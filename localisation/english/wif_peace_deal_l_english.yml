l_english:
 # The Anglo-American peace (common/scripted_effects/wif_peace_deal.txt)
 wif_peace_deal_tt:0 "§YThe war in the west ends.§! Every member of the Allies makes peace with Germany and the Allies are dissolved. Vichy annexes France, Britain becomes a German Reichsprotektorat under Mosley, the Dominions follow Canada, and the Allied lands are divided between Germany, its allies and new Reichskommissariats."
 wif_peace_free_commonwealth:0 "The Free Commonwealth"

 wif_peace_deal.1.t:0 "The Peace of the West"
 wif_peace_deal.1.desc:0 "With the United States withdrawn from the war, the Allied coalition has come apart. The remaining Allied governments have made peace with Germany on the Reich's terms.\n\nFrance passes whole to the government at Vichy. Britain, under Sir Oswald Mosley, becomes a protectorate of the Reich and keeps little more than England and a handful of African colonies; Scotland and Northern Ireland are lost to it. The Dominions have turned to Ottawa, and Canada now leads what remains of the Commonwealth. South Africa has proclaimed a republic and turned its back on every alliance.\n\nIn Africa, three new Reichskommissariats are proclaimed - Ostafrika, Rhodesia and Zentralafrika - while Poland, the Low Countries, Norway and Yugoslavia are divided between Germany, its Reichskommissariats and its allies."
 wif_peace_deal.1.a:0 "It is over."
 wif_peace_deal.1.b:0 "The Reich stands victorious in the west."
 wif_peace_deal.1.c:0 "The world will not be the same."

 wif_peace_deal.2.t:0 "Strike at [wif_sco_strike_target.GetName]"
 wif_peace_deal.2.desc:0 "Our people have struck in [wif_sco_strike_target.GetName]. §Y[?ROOT.wif_sco_last_destroyed|0]§! buildings of Fascist Britain lie in ruins.\n\nThe chance of success was §Y[?ROOT.wif_sco_last_chance|0]%§!, with §Y[?ROOT.wif_sco_last_mp|0]§! military police divisions standing guard."
 wif_peace_deal.2.a:0 "Alba gu bràth."
 wif_peace_deal.3.t:0 "Caught in [wif_sco_strike_target.GetName]"
 wif_peace_deal.3.desc:0 "The cell sent into [wif_sco_strike_target.GetName] was taken before it could act. The rifles are lost, and so are the men.\n\nThe chance of success was §Y[?ROOT.wif_sco_last_chance|0]%§!; §Y[?ROOT.wif_sco_last_mp|0]§! military police divisions were in the state."
 wif_peace_deal.3.a:0 "We will try again."
 wif_peace_deal.4.t:0 "Scottish Terror in [wif_sco_strike_target.GetName]"
 wif_peace_deal.4.desc:0 "Scottish terrorists have struck in [wif_sco_strike_target.GetName], destroying §Y[?ROOT.wif_sco_last_destroyed|0]§! buildings. Every division with military police we keep in a state makes such strikes less likely to succeed."
 wif_peace_deal.4.a:0 "Hunt them down."
 wif_peace_deal.5.t:0 "Plot Foiled in [wif_sco_strike_target.GetName]"
 wif_peace_deal.5.desc:0 "Our police have caught a Scottish cell in [wif_sco_strike_target.GetName] before it could strike."
 wif_peace_deal.5.a:0 "Good."

 # Scotland
 wif_sco_resistance_category:0 "The Campaign against Fascist Britain"
 wif_sco_resistance_category_desc:0 "England has fallen to the fascists and serves Berlin. Scotland is free - and while Mosley rules in London, nothing south of the border is safe.\n\nEach strike costs §Y2,000§! rifles, and one can be launched a month. A strike succeeds §Y90%§! of the time, §R5%§! less for every British division with military police in the target state, and wrecks §Y1 to 3§! buildings."
 wif_sco_terror_strike:0 "Strike at [FROM.GetName]"
 wif_sco_terror_strike_desc:0 "Send a cell south with arms and explosives. Factories, refineries, rail and airfields are all targets."
 wif_sco_strike_cost:0 "£infantry_equipment_texticon §Y2,000§!"
 wif_sco_strike_cost_blocked:0 "£infantry_equipment_texticon §R2,000§!"
 wif_sco_terror_strike_tt:0 "Costs §Y2,000§! infantry equipment. Next strike in §Y30§! days.\nSuccess chance §Y90%§!, §R-5%§! for every British division with §Ymilitary police§! in [FROM.GetName]. A success destroys §Y1 to 3§! buildings there."

 # The United States
 wif_usa_arms_for_scotland_category:0 "Arms for Scotland"
 wif_usa_arms_for_scotland_category_desc:0 "Washington made peace with Berlin, not with Mosley. Rifles can still find their way north of the border."
 wif_usa_smuggle_arms_to_scotland:0 "Smuggle Rifles to Scotland"
 wif_usa_smuggle_arms_to_scotland_desc:0 "Ship §Y2,000§! rifles to the Scots through fishing ports and false manifests."

