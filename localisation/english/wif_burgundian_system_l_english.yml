l_english:
 burgundian_system:0 "Burgundian System"
 burgundian_system_desc:0 "The fascism of the Ordensstaat Burgund: a sealed state of the Order, where every adult serves, every factory works for war and nothing crosses the border - not trade, not secrets, not even to the Order's own masters."
 wif_ideology_burgundian_system:0 "The Burgundian System"
 wif_burgundian_closed_economy:0 "Burgundian Closed Economy"
 wif_burgundian_closed_economy_desc:0 "Nothing leaves the Order's lands - not to the market, not to allies, not even to an overlord."
