l_english:
 wif_ita_the_new_roman_order:0 "The New Roman Order"
 wif_ita_the_new_roman_order_desc:0 "The war in the west is over and Italy stands on the winning side. From the Alps to the Horn of Africa, from Tirana to Tripoli, the Empire is larger than at any time since the Caesars. Now it has to be governed, defended and paid for - beside an ally that never lets Rome forget who won the war."
 wif_ita_ministry_of_the_empire:0 "Ministero dell'Impero"
 wif_ita_ministry_of_the_empire_desc:0 "The old Ministry of Italian Africa cannot govern an empire on three continents. One ministry, one minister, one map."
 wif_ita_the_great_division:0 "The Great Division"
 wif_ita_the_great_division_desc:0 "Every holding of the Empire is assigned to an administration: the Kingdom proper, the governorates, the viceroyalty and the protectorates. Each answers to Rome in its own way."
 wif_ita_rule_from_rome:0 "Rule from Rome"
 wif_ita_rule_from_rome_desc:0 "Governorates, not governments. Italian prefects, Italian law, Italian settlers."
 wif_ita_self_governing_protectorates:0 "Self-Governing Protectorates"
 wif_ita_self_governing_protectorates_desc:0 "Let the local elites govern under the fasces. Cheaper, quieter - and less Italian."
 wif_ita_viceroyalty_of_east_africa:0 "The Viceroyalty of East Africa"
 wif_ita_viceroyalty_of_east_africa_desc:0 "The Duke of Aosta governs Italian East Africa from Addis Ababa - Ethiopia, Eritrea and both Somalilands under one viceroy."
 wif_ita_the_fourth_shore:0 "La Quarta Sponda"
 wif_ita_the_fourth_shore_desc:0 "Libya is no colony. Tripolitania and Cyrenaica become provinces of the Kingdom itself."
 wif_ita_governorate_of_the_aegean:0 "Governorate of the Aegean"
 wif_ita_governorate_of_the_aegean_desc:0 "Rhodes, the Dodecanese and the Greek islands taken in the war, governed from the Palazzo del Governo in Rhodes."
 wif_ita_the_albanian_crown:0 "The Albanian Crown"
 wif_ita_the_albanian_crown_desc:0 "Victor Emmanuel is King of Italy, Emperor of Ethiopia and King of the Albanians. Tirana must feel it."
 wif_ita_the_cairo_residency:0 "The Cairo Residency"
 wif_ita_the_cairo_residency_desc:0 "Egypt keeps its King and its parliament. Italy keeps the Canal."
 wif_ita_the_levant_mandate:0 "The Levant Mandate"
 wif_ita_the_levant_mandate_desc:0 "Palestine and Transjordan, taken from Britain at the peace. Haifa's refinery and the Kirkuk pipeline end are Italy's now."
 wif_ita_colonial_police:0 "Polizia dell'Africa Italiana"
 wif_ita_colonial_police_desc:0 "A colonial police reborn - motorised, armed and everywhere."
 wif_ita_the_settler_programme:0 "I Ventimila"
 wif_ita_the_settler_programme_desc:0 "Twenty thousand colonists to Libya in 1938 - now two hundred thousand, to Libya and the Ethiopian highlands."
 wif_ita_imperial_civil_service:0 "The Imperial Civil Service"
 wif_ita_imperial_civil_service_desc:0 "Clerks, engineers and magistrates trained in Rome for posts in Asmara, Cairo and Haifa."
 wif_ita_the_ordered_empire:0 "L'Impero Ordinato"
 wif_ita_the_ordered_empire_desc:0 "Every province has its governor, every governor his orders. The Empire is administered."
 wif_ita_the_imperial_senate:0 "The Imperial Senate"
 wif_ita_the_imperial_senate_desc:0 "Senators from Asmara, Tripoli and Tirana sit in the Palazzo Madama. An empire that sits in Rome is an empire that stays."
 wif_ita_a_mediterranean_policy:0 "A Mediterranean Policy"
 wif_ita_a_mediterranean_policy_desc:0 "Germany looks east to Russia. Italy's future is the sea - and the two other powers that border it: Turkey and Spain."
 wif_ita_bury_the_dodecanese_quarrel:0 "Bury the Dodecanese Quarrel"
 wif_ita_bury_the_dodecanese_quarrel_desc:0 "Ankara has feared Italian guns on Rhodes since 1923. Rome renounces every claim on Anatolia, in writing."
 wif_ita_the_lisbon_overture:0 "The Lisbon Overture"
 wif_ita_the_lisbon_overture_desc:0 "Salazar is Spain's neighbour, Britain's oldest ally and nobody's fool. A friendly word from Rome costs nothing."
 wif_ita_the_veterans_of_guadalajara:0 "The Veterans of Guadalajara"
 wif_ita_the_veterans_of_guadalajara_desc:0 "Seventy thousand Italians fought for Franco. The CTV's veterans become Italy's ambassadors to Madrid."
 wif_ita_trade_with_ankara:0 "Trade with Ankara"
 wif_ita_trade_with_ankara_desc:0 "Turkish chromium for Italian machine tools."
 wif_ita_forgive_the_war_debts:0 "Forgive the War Debts"
 wif_ita_forgive_the_war_debts_desc:0 "Spain owes Rome five billion lire for the civil war. It will never pay. Forgive it, loudly."
 wif_ita_the_straits_understanding:0 "An Understanding on the Straits"
 wif_ita_the_straits_understanding_desc:0 "The Bosporus stays Turkish, the Aegean stays Italian, and both sides agree who keeps the Russians and the Germans out."
 wif_ita_military_mission_to_ankara:0 "Military Mission to Ankara"
 wif_ita_military_mission_to_ankara_desc:0 "Italian officers teach at the Turkish War College; Turkish officers train with the Regia Aeronautica."
 wif_ita_latin_brotherhood:0 "Latin Brotherhood"
 wif_ita_latin_brotherhood_desc:0 "Two Catholic, Latin, corporatist states - the natural partners of the Mediterranean."
 wif_ita_the_gibraltar_question:0 "The Gibraltar Question"
 wif_ita_the_gibraltar_question_desc:0 "The Rock is Britain's - or Germany's, if the peace gave it away. Rome tells Madrid it will back Spain's claim."
 wif_ita_italo_turkish_friendship:0 "The Italo-Turkish Friendship Treaty"
 wif_ita_italo_turkish_friendship_desc:0 "Signed in the Dolmabahce Palace. Twenty years of suspicion, ended in an afternoon."
 wif_ita_hispano_italian_accord:0 "The Hispano-Italian Accord"
 wif_ita_hispano_italian_accord_desc:0 "A treaty of friendship, trade and mutual consultation - everything short of an alliance, for now."
 wif_ita_the_three_seas:0 "The Three Seas Understanding"
 wif_ita_the_three_seas_desc:0 "The Tyrrhenian, the Aegean and the Atlantic gate. Three capitals that consult before they act."
 wif_ita_in_berlins_shadow:0 "In Berlin's Shadow"
 wif_ita_in_berlins_shadow_desc:0 "Italy won the war with Germany. Germany never lets Italy forget whose war it was."
 wif_ita_the_south_tyrol_question:0 "The South Tyrol Question"
 wif_ita_the_south_tyrol_question_desc:0 "German-speaking Bolzano listens to Berlin's radio, and Berlin has started to talk back."
 wif_ita_rivals_in_zagreb:0 "Rivals in Zagreb"
 wif_ita_rivals_in_zagreb_desc:0 "Croatia was promised to Rome. Its factories are owned in Vienna and its ministers dine at the German legation."
 wif_ita_german_merchants_in_trieste:0 "German Merchants in Trieste"
 wif_ita_german_merchants_in_trieste_desc:0 "The port of Trieste handles more German trade than Italian. Its harbour master takes his orders from Hamburg."
 wif_ita_no_german_flag_on_our_sea:0 "No German Flag on Our Sea"
 wif_ita_no_german_flag_on_our_sea_desc:0 "Kriegsmarine cruisers in Taranto, U-boat pens in La Spezia. The Mediterranean was supposed to be ours."
 wif_ita_recall_our_workers:0 "Recall Our Workers"
 wif_ita_recall_our_workers_desc:0 "Three hundred thousand Italians work in German factories. Italy needs them home."
 wif_ita_piano_brennero:0 "Piano Brennero"
 wif_ita_piano_brennero_desc:0 "A contingency plan nobody signs and everybody reads: what Italy does if the Germans ever come over the Alps."
 wif_ita_secret_rearmament:0 "Secret Rearmament"
 wif_ita_secret_rearmament_desc:0 "Arsenals in Sardinia and Sicily that appear on no German liaison officer's list."
 wif_ita_the_loyal_ally:0 "The Loyal Ally"
 wif_ita_the_loyal_ally_desc:0 "Swallow the pride. As long as the Reich stands, Italy stands with it - and is paid for it."
 wif_ita_a_quiet_distance:0 "A Quiet Distance"
 wif_ita_a_quiet_distance_desc:0 "Smile in Berlin, plan in Rome. Every agreement with Germany gets a clause that lets Italy out."
 wif_ita_the_axis_is_a_cage:0 "The Axis Is a Cage"
 wif_ita_the_axis_is_a_cage_desc:0 "Whatever face Rome shows Berlin, the conclusion is the same: the Axis exists to serve Germany."
 wif_ita_the_reich_divided:0 "The Reich Divided"
 wif_ita_the_reich_divided_desc:0 "Speer, Goring, Bormann, the Wehrmacht and the SS are fighting over Hitler's inheritance. For the first time in a decade, nobody in Berlin is watching Rome."
 wif_ita_the_axis_is_dead:0 "The Axis Is Dead"
 wif_ita_the_axis_is_dead_desc:0 "Rome declares that the Pact of Steel died with the Reich that signed it."
 wif_ita_the_roman_pact:0 "The Roman Pact"
 wif_ita_the_roman_pact_desc:0 "A new alliance for a new Mediterranean - with Rome at its head."
 wif_ita_invite_ankara:0 "Invite Ankara"
 wif_ita_invite_ankara_desc:0 "The only focus that brings Turkey into an Italian alliance."
 wif_ita_invite_madrid:0 "Invite Madrid"
 wif_ita_invite_madrid_desc:0 "The ONLY focus that brings Spain into an Italian alliance."
 wif_ita_the_balkan_members:0 "The Balkan Members"
 wif_ita_the_balkan_members_desc:0 "Croatia, Montenegro, Greece and Albania - every Balkan state in Italy's orbit, under one treaty."
 wif_ita_joint_mediterranean_command:0 "The Joint Mediterranean Command"
 wif_ita_joint_mediterranean_command_desc:0 "One staff, in Rome, for every army and navy of the Pact."
 wif_ita_armed_forces_of_the_empire:0 "The Empire's Armed Forces"
 wif_ita_armed_forces_of_the_empire_desc:0 "Italy's army fought with 1918 rifles, its navy without radar, its air force with biplanes. Never again."
 wif_ita_lessons_of_matapan:0 "The Lessons of Matapan"
 wif_ita_lessons_of_matapan_desc:0 "The Regia Marina lost three cruisers in one night because it could not see in the dark."
 wif_ita_the_imperial_army:0 "L'Esercito Imperiale"
 wif_ita_the_imperial_army_desc:0 "Motorised divisions for the desert, mountain divisions for the Alps and the Balkans."
 wif_ita_the_jet_age:0 "The Jet Age"
 wif_ita_the_jet_age_desc:0 "Campini flew a jet in 1940. Italy should have been first. It can still be second."
 wif_ita_aquila_and_sparviero:0 "Aquila and Sparviero"
 wif_ita_aquila_and_sparviero_desc:0 "Two liners converted into Italy's first aircraft carriers."
 wif_ita_colonial_divisions:0 "Divisioni Coloniali"
 wif_ita_colonial_divisions_desc:0 "Libyan, Eritrean and Somali divisions to garrison the Empire, so Italians do not have to."
 wif_ita_the_sons_of_campini:0 "The Sons of Campini"
 wif_ita_the_sons_of_campini_desc:0 "Reggiane, Fiat and Caproni each get a jet contract."
 wif_ita_the_imperial_fleet:0 "The Imperial Fleet"
 wif_ita_the_imperial_fleet_desc:0 "Two oceans to patrol now - the Mediterranean and the Indian."
 wif_ita_armoured_legions:0 "Armoured Legions"
 wif_ita_armoured_legions_desc:0 "Ansaldo's new medium tank, at last a match for anything on the road."
 wif_ita_air_bases_across_the_empire:0 "Air Bases Across the Empire"
 wif_ita_air_bases_across_the_empire_desc:0 "Benghazi, Asmara, Rhodes, Tirana - an air umbrella from the Alps to the Gulf of Aden."
 wif_ita_forze_armate_imperiali:0 "Forze Armate Imperiali"
 wif_ita_forze_armate_imperiali_desc:0 "Armed forces worthy of the Empire."
 wif_ita_an_imperial_economy:0 "An Imperial Economy"
 wif_ita_an_imperial_economy_desc:0 "Autarky won the war; it will not win the peace."
 wif_ita_trade_beyond_the_reich:0 "Trade Beyond the Reich"
 wif_ita_trade_beyond_the_reich_desc:0 "Sell to Spain, Turkey and South America - not only to Germany."
 wif_ita_autarchia_imperiale:0 "Autarchia Imperiale"
 wif_ita_autarchia_imperiale_desc:0 "The Empire supplies the Empire."
 wif_ita_oil_of_the_fourth_shore:0 "Oil of the Fourth Shore"
 wif_ita_oil_of_the_fourth_shore_desc:0 "Ardito Desio said there was oil under Libya in 1938. Find it."
 wif_ita_develop_the_highlands:0 "Develop the Highlands"
 wif_ita_develop_the_highlands_desc:0 "Roads, dams and coffee plantations in Ethiopia's highlands."
 wif_ita_iri_reborn:0 "IRI Reborn"
 wif_ita_iri_reborn_desc:0 "The Istituto per la Ricostruzione Industriale owns half of Italian industry. Make it build."
 wif_ita_the_red_sea_route:0 "The Red Sea Route"
 wif_ita_the_red_sea_route_desc:0 "Suez, Massawa, Aden - Italy holds the whole road from the Mediterranean to the Indian Ocean."
 wif_ita_the_imperial_railway:0 "The Imperial Railway"
 wif_ita_the_imperial_railway_desc:0 "Addis Ababa to Asmara to Massawa, and Tripoli to Benghazi to the Egyptian frontier."
 wif_ita_northern_industry_expanded:0 "The Northern Triangle"
 wif_ita_northern_industry_expanded_desc:0 "Milan, Turin, Genoa - the industrial triangle doubles."
 wif_ita_the_imperial_market:0 "The Imperial Market"
 wif_ita_the_imperial_market_desc:0 "One currency, one market, one Empire."
 wif_ita_consolidate_the_balkans:0 "Consolidate the Balkans"
 wif_ita_consolidate_the_balkans_desc:0 "Albania, Montenegro, Dalmatia, Croatia, Greece: five arrangements made in wartime haste. Peace demands one."
 wif_ita_annex_albania:0 "One Crown, One Kingdom"
 wif_ita_annex_albania_desc:0 "Albania stops being a protectorate and becomes a part of the Kingdom."
 wif_ita_the_montenegrin_throne:0 "The Montenegrin Throne"
 wif_ita_the_montenegrin_throne_desc:0 "Queen Elena was a Montenegrin princess. Her family's throne is a gift Rome can give."
 wif_ita_dalmazia_italiana:0 "Dalmazia Italiana"
 wif_ita_dalmazia_italiana_desc:0 "Zara, Spalato, Cattaro - Venice's coast, Italy's again."
 wif_ita_the_croatian_question:0 "The Croatian Question"
 wif_ita_the_croatian_question_desc:0 "Pavelic owes Italy his throne and hates it for that."
 wif_ita_the_greek_kingdom:0 "The Greek Kingdom"
 wif_ita_the_greek_kingdom_desc:0 "Athens is Italy's protectorate. It needs a government Greeks will obey."
 wif_ita_adriatic_customs_union:0 "The Adriatic Customs Union"
 wif_ita_adriatic_customs_union_desc:0 "No borders for trade from Trieste to Durres."
 wif_ita_annex_croatia:0 "Annex Croatia"
 wif_ita_annex_croatia_desc:0 "The Kingdom of Croatia had an Italian king who never set foot in it. Now it has an Italian governor."
 wif_ita_a_loyal_croatia:0 "A Loyal Croatia"
 wif_ita_a_loyal_croatia_desc:0 "A Croatia that looks to Rome and not to Vienna is worth more than a Croatia that has to be occupied."
 wif_ita_a_prince_for_athens:0 "A Prince for Athens"
 wif_ita_a_prince_for_athens_desc:0 "The Duke of Spoleto refused Croatia's crown. Perhaps he will take Greece's."
 wif_ita_the_adriatic_is_italian:0 "Mare Nostrum Adriaticum"
 wif_ita_the_adriatic_is_italian_desc:0 "Every port on the Adriatic flies the tricolour or a flag Rome chose."
 wif_ita_the_balkan_order:0 "The Balkan Order"
 wif_ita_the_balkan_order_desc:0 "Rome decides in the Balkans - not Berlin, not Belgrade, not Sofia."
 wif_ita_the_balkans_consolidated:0 "The Balkans Consolidated"
 wif_ita_the_balkans_consolidated_desc:0 "The Balkans are quiet for the first time since 1912 - Italy's quiet."
 wif_ita_italia_potenza_mondiale:0 "Italia, Potenza Mondiale"
 wif_ita_italia_potenza_mondiale_desc:0 "Italy has been a great power by courtesy since 1861. It intends to be one in fact."
 wif_ita_indian_ocean_squadron:0 "The Indian Ocean Squadron"
 wif_ita_indian_ocean_squadron_desc:0 "Based in Mogadishu and Massawa, flying the flag from Zanzibar to Bombay."
 wif_ita_the_roman_sphere:0 "The Roman Sphere"
 wif_ita_the_roman_sphere_desc:0 "Influence campaigns in the Balkans, the Levant, North Africa and Latin America."
 wif_ita_progetto_atomico:0 "Progetto Atomico"
 wif_ita_progetto_atomico_desc:0 "Fermi left. Amaldi stayed - and Segre has come home."
 wif_ita_the_latin_american_connection:0 "The Latin American Connection"
 wif_ita_the_latin_american_connection_desc:0 "Twelve million Italians in Argentina and Brazil. They are Rome's best ambassadors."
 wif_ita_rockets_over_rome:0 "Rockets over Rome"
 wif_ita_rockets_over_rome_desc:0 "Italy will not watch the space race from the stands."
 wif_ita_blue_water_navy:0 "A Blue-Water Navy"
 wif_ita_blue_water_navy_desc:0 "Carriers, cruisers and the bases to keep them at sea."
 wif_ita_a_seat_at_the_table:0 "A Seat at the Table"
 wif_ita_a_seat_at_the_table_desc:0 "When Washington and Berlin decide the world, Rome is in the room."
 wif_ita_the_roman_bomb:0 "The Roman Bomb"
 wif_ita_the_roman_bomb_desc:0 "Effect: +2 nuclear bombs and a permanent +nuclear production bonus. Counts as a nuclear power for the Cold War doctrine system."
 wif_ita_the_italian_satellite:0 "San Marco"
 wif_ita_the_italian_satellite_desc:0 "An Italian satellite, launched from a platform off the Somali coast."
 wif_ita_the_third_pole:0 "The Third Pole"
 wif_ita_the_third_pole_desc:0 "Not Washington's world, not Berlin's: Rome is the third pole."
 wif_ita_pax_romana_aeterna:0 "Pax Romana Aeterna"
 wif_ita_pax_romana_aeterna_desc:0 "Two thousand years after Augustus, the Mediterranean is at peace under Rome again."
 ITA_wif_pax_romana:0 "Pax Romana"
 ITA_wif_pax_romana_desc:0 "The war is won. Britain has made peace, France is Vichy's, and the Mediterranean is ringed by Italian and German flags. It is time for Italy to stop being Germany's partner in a war and start being an empire in its own right."
 wif_ita_too_large_1:0 "An Empire Too Large"
 wif_ita_too_large_1_desc:0 "Addis Ababa, Tripoli, Tirana, Rhodes, Cairo, Haifa: the Empire has more provinces than Rome has prefects, and every one of them needs a garrison."
 wif_ita_too_large_2:0 "An Empire Too Large (Severe)"
 wif_ita_too_large_2_desc:0 "Addis Ababa, Tripoli, Tirana, Rhodes, Cairo, Haifa: the Empire has more provinces than Rome has prefects, and every one of them needs a garrison."
 wif_ita_too_large_3:0 "An Empire Too Large (Crippling)"
 wif_ita_too_large_3_desc:0 "Addis Ababa, Tripoli, Tirana, Rhodes, Cairo, Haifa: the Empire has more provinces than Rome has prefects, and every one of them needs a garrison."
 wif_ita_shadow_1:0 "In Germany's Shadow"
 wif_ita_shadow_1_desc:0 "Italy won the war beside Germany. Germany never lets Italy forget whose war it was."
 wif_ita_shadow_2:0 "In Germany's Shadow (Resentful)"
 wif_ita_shadow_2_desc:0 "Italy won the war beside Germany. Germany never lets Italy forget whose war it was."
 wif_ita_shadow_3:0 "In Germany's Shadow (Bitter)"
 wif_ita_shadow_3_desc:0 "Italy won the war beside Germany. Germany never lets Italy forget whose war it was."
 wif_ita_ministry_idea:0 "Ministero dell'Impero"
 wif_ita_ministry_idea_desc:0 "One ministry, one minister, one map."
 wif_ita_rule_from_rome_idea:0 "Rule from Rome"
 wif_ita_rule_from_rome_idea_desc:0 "Italian prefects, Italian law, Italian settlers."
 wif_ita_prefects_strain_idea:0 "The Prefects Arrive"
 wif_ita_prefects_strain_idea_desc:0 "Direct rule takes time to settle."
 wif_ita_protectorates_idea:0 "Self-Governing Protectorates"
 wif_ita_protectorates_idea_desc:0 "Local elites govern under the fasces."
 wif_ita_protectorate_member_idea:0 "An Italian Protectorate"
 wif_ita_protectorate_member_idea_desc:0 "Rome governs lightly, and for now that suits everyone."
 wif_ita_aegean_idea:0 "Governorate of the Aegean"
 wif_ita_aegean_idea_desc:0 "Rhodes governs the islands."
 wif_ita_levant_idea:0 "The Levant Mandate"
 wif_ita_levant_idea_desc:0 "Haifa and the pipeline end are Italian."
 wif_ita_pai_idea:0 "Polizia dell'Africa Italiana"
 wif_ita_pai_idea_desc:0 "Motorised, armed and everywhere."
 wif_ita_settlers_idea:0 "I Ventimila"
 wif_ita_settlers_idea_desc:0 "Colonists for Libya and the Ethiopian highlands."
 wif_ita_settler_strain_idea:0 "Settlers and Natives"
 wif_ita_settler_strain_idea_desc:0 "Land taken for colonists was land somebody farmed."
 wif_ita_civil_service_idea:0 "The Imperial Civil Service"
 wif_ita_civil_service_idea_desc:0 "Clerks, engineers and magistrates trained in Rome."
 wif_ita_straits_idea:0 "An Understanding on the Straits"
 wif_ita_straits_idea_desc:0 "Italy keeps the Aegean, Turkey the Bosporus."
 wif_ita_italian_mission_idea:0 "The Italian Military Mission"
 wif_ita_italian_mission_idea_desc:0 "Italian officers at the Turkish War College."
 wif_ita_latin_brotherhood_idea:0 "Latin Brotherhood"
 wif_ita_latin_brotherhood_idea_desc:0 "Two Catholic, Latin, corporatist states."
 wif_ita_our_sea_idea:0 "Our Sea"
 wif_ita_our_sea_idea_desc:0 "No German flag on the Mediterranean."
 wif_ita_brennero_idea:0 "Piano Brennero"
 wif_ita_brennero_idea_desc:0 "What Italy does if the Germans come over the Alps."
 wif_ita_quiet_distance_idea:0 "A Quiet Distance"
 wif_ita_quiet_distance_idea_desc:0 "Smile in Berlin, plan in Rome."
 wif_ita_joint_command_idea:0 "The Joint Mediterranean Command"
 wif_ita_joint_command_idea_desc:0 "One staff, in Rome, for every army and navy of the Pact."
 wif_ita_matapan_idea:0 "The Lessons of Matapan"
 wif_ita_matapan_idea_desc:0 "The Regia Marina learns to fight in the dark."
 wif_ita_imperial_army_idea:0 "L'Esercito Imperiale"
 wif_ita_imperial_army_idea_desc:0 "Motorised for the desert, mountain troops for the Alps."
 wif_ita_jet_age_idea:0 "The Jet Age"
 wif_ita_jet_age_idea_desc:0 "Italy can still be second."
 wif_ita_carrier_programme_idea:0 "Aquila and Sparviero"
 wif_ita_carrier_programme_idea_desc:0 "Italy's first carriers."
 wif_ita_colonial_divisions_idea:0 "Divisioni Coloniali"
 wif_ita_colonial_divisions_idea_desc:0 "Colonial divisions garrison the Empire."
 wif_ita_campini_idea:0 "The Sons of Campini"
 wif_ita_campini_idea_desc:0 "Every aircraft maker gets a jet contract."
 wif_ita_tank_programme_idea:0 "Armoured Legions"
 wif_ita_tank_programme_idea_desc:0 "Ansaldo's new medium tank."
 wif_ita_forze_armate_idea:0 "Forze Armate Imperiali"
 wif_ita_forze_armate_idea_desc:0 "Armed forces worthy of the Empire."
 wif_ita_trade_idea:0 "Trade Beyond the Reich"
 wif_ita_trade_idea_desc:0 "Spain, Turkey and South America buy Italian."
 wif_ita_autarchia_idea:0 "Autarchia Imperiale"
 wif_ita_autarchia_idea_desc:0 "The Empire supplies the Empire."
 wif_ita_iri_idea:0 "IRI Reborn"
 wif_ita_iri_idea_desc:0 "Half of Italian industry, told to build."
 wif_ita_imperial_market_idea:0 "The Imperial Market"
 wif_ita_imperial_market_idea_desc:0 "One currency, one market, one Empire."
 wif_ita_annexation_strain_idea:0 "New Provinces"
 wif_ita_annexation_strain_idea_desc:0 "Annexation is a decree; integration takes years."
 wif_ita_adriatic_idea:0 "Mare Nostrum Adriaticum"
 wif_ita_adriatic_idea_desc:0 "Every Adriatic port flies a flag Rome chose."
 wif_ita_balkans_quiet_idea:0 "The Balkans Consolidated"
 wif_ita_balkans_quiet_idea_desc:0 "The Balkans are quiet - Italy's quiet."
 wif_ita_potenza_idea:0 "Italia, Potenza Mondiale"
 wif_ita_potenza_idea_desc:0 "A great power in fact, not by courtesy."
 wif_ita_roman_sphere_idea:0 "The Roman Sphere"
 wif_ita_roman_sphere_idea_desc:0 "Influence from the Balkans to Buenos Aires."
 wif_ita_blue_water_idea:0 "A Blue-Water Navy"
 wif_ita_blue_water_idea_desc:0 "Carriers, cruisers and the bases to keep them at sea."
 wif_ita_aeterna_idea:0 "Pax Romana Aeterna"
