l_english:
 wif_ger_road_itself_in_progress_tt:0 "This is happening on its own, and nobody can stop it.\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 GER_the_fuhrers_tremor:0 "The Führer's Tremor"
 GER_the_fuhrers_tremor_desc:0 "Hitler's left hand will not keep still. The doctors have a word for it, and nobody is allowed to say it. The newsreel cameramen are told to film him from the right."
 GER_the_fuhrers_tremor_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YA Weakened King among Vultures§! is complete."
 GER_dr_morells_injections:0 "Dr Morell's Injections"
 GER_dr_morells_injections_desc:0 "Every morning Dr Morell gives the Führer an injection, and every afternoon the Führer gives an order nobody expected. Ministers learn to read his moods before they read his mail."
 GER_dr_morells_injections_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YThe Führer's Tremor§! is complete."
 GER_newsreel_the_fuhrer_at_the_obersalzberg:0 "Newsreel: The Führer at the Obersalzberg"
 GER_newsreel_the_fuhrer_at_the_obersalzberg_desc:0 "A carefully staged film: a healthy Führer walks the mountain paths with his dog. Three takes were needed. The cinemas show the fourth."
 GER_newsreel_the_fuhrer_at_the_obersalzberg_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Führer's Tremor§! is complete."
 GER_government_by_audience:0 "Government by Audience"
 GER_government_by_audience_desc:0 "Nobody sees the Führer without Bormann's say-so. Ministers wait in the corridor for days for an hour that is cancelled at the last minute."
 GER_government_by_audience_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YDr Morell's Injections§! is complete."
 GER_bormann_holds_the_keys:0 "Bormann Holds the Keys"
 GER_bormann_holds_the_keys_desc:0 "The Party Chancellery decides what reaches the Führer's desk, and Speer's requisition orders sit at the bottom of the pile."
 GER_bormann_holds_the_keys_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YGovernment by Audience§! is complete."
 GER_goebbels_speaks_for_the_fuhrer:0 "Goebbels Speaks for the Führer"
 GER_goebbels_speaks_for_the_fuhrer_desc:0 "With Himmler gone, Goebbels holds his chair. He reads the Führer's speeches on the radio. Before long he writes them too."
 GER_goebbels_speaks_for_the_fuhrer_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YGovernment by Audience§! is complete, after §YOffer Retirement§!, and only while §YJoseph Goebbels§! sits in the §YInner Circle§!."
 GER_the_succession_question:0 "The Succession Question"
 GER_the_succession_question_desc:0 "After Himmler's betrayal Hitler will name no heir at all. Every minister counts his friends and writes down his enemies."
 GER_the_succession_question_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YBormann Holds the Keys§! and §YGoebbels Speaks for the Führer§! are complete, after §YOffer Retirement§!."
 GER_gorings_last_ambition:0 "Göring's Last Ambition"
 GER_gorings_last_ambition_desc:0 "In 1941 the Reichsmarschall was named the Führer's successor. He has not forgotten it, even if the Führer has. The army has not forgotten the Luftwaffe's failures either."
 GER_gorings_last_ambition_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Succession Question§! is complete."
 GER_newsreel_the_fuhrers_sixtieth_birthday:0 "Newsreel: The Führer's Sixtieth Birthday"
 GER_newsreel_the_fuhrers_sixtieth_birthday_desc:0 "The largest parade the Reich has ever held marches down the new East-West Axis. The Führer takes the salute for eleven minutes before he is helped inside."
 GER_newsreel_the_fuhrers_sixtieth_birthday_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Succession Question§! is complete."
 GER_the_second_stroke:0 "The Second Stroke"
 GER_the_second_stroke_desc:0 "Hitler collapses at the Berghof. For three weeks Bormann tells the ministers the Führer is resting. The fourth week, he lets them see him."
 GER_the_second_stroke_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YGöring's Last Ambition§! and §YNewsreel: The Führer's Sixtieth Birthday§! are complete."
 GER_the_berghof_court:0 "The Berghof Court"
 GER_the_berghof_court_desc:0 "The Führer no longer leaves the mountain, so the government climbs up to him. Bormann decides who comes back down with an answer."
 GER_the_berghof_court_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Second Stroke§! is complete."
 GER_the_regency_council:0 "The Regency Council"
 GER_the_regency_council_desc:0 "Hitler's ministers govern in his name, Bormann at the door. None of them trusts the others, but for once they agree on a budget."
 GER_newsreel_the_fuhrers_last_balcony:0 "Newsreel: The Führer's Last Balcony"
 GER_newsreel_the_fuhrers_last_balcony_desc:0 "Hitler is held upright on the Chancellery balcony for four minutes. The crowd is told to cheer louder than ever. Nobody is filmed too closely."
 GER_newsreel_the_fuhrers_last_balcony_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Berghof Court§! is complete."
 GER_the_generals_count_their_divisions:0 "The Generals Count Their Divisions"
 GER_the_generals_count_their_divisions_desc:0 "Every officer watched the SS turn on the Reich, by war or by treaty. Now every officer looks at the SS men who stayed behind, and wonders which way they will turn next."
 GER_the_generals_count_their_divisions_itself_tt:0 "This focus cannot be chosen. It happens on its own, after §YOffer Retirement§!, after §YNein, Verräter!§! or §YHow About Burgundy?§!."
 GER_a_guard_of_his_own:0 "A Guard of His Own"
 GER_a_guard_of_his_own_desc:0 "The Führer trusts nobody now except the SS men who did not follow Himmler: what is left of the Leibstandarte and the Totenkopf. They become his guard, and they answer to no general."
 GER_a_guard_of_his_own_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YThe Generals Count Their Divisions§! is complete."
 GER_loyalty_oaths_for_the_officer_corps:0 "Loyalty Oaths for the Officer Corps"
 GER_loyalty_oaths_for_the_officer_corps_desc:0 "Every officer swears his oath again, personally to the Führer, with the guard standing at the back of the hall."
 GER_leibstandarte_checkpoints:0 "Leibstandarte Checkpoints"
 GER_leibstandarte_checkpoints_desc:0 "The guard rings the Chancellery and the government quarter with checkpoints. Staff officers are searched at the door of their own Bendlerblock."
 GER_leibstandarte_checkpoints_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YA Guard of His Own§! is complete."
 GER_two_armies_in_one_reich:0 "Two Armies in One Reich"
 GER_two_armies_in_one_reich_desc:0 "The guard gets the newest tanks and the first fuel. The army gets the explanation."
 GER_two_armies_in_one_reich_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YLeibstandarte Checkpoints§! is complete."
 GER_ss_liaison_officers_in_every_corps:0 "SS Liaison Officers in Every Corps"
 GER_ss_liaison_officers_in_every_corps_desc:0 "A guard officer sits in every corps headquarters and reads every order before it goes out."
 GER_keep_the_guard_out_of_the_barracks:0 "Keep the Guard Out of the Barracks"
 GER_keep_the_guard_out_of_the_barracks_desc:0 "The army is promised that no SS man will set foot in its barracks. The guard calls it treason."
 GER_the_abwehr_and_the_sd:0 "The Abwehr and the SD"
 GER_the_abwehr_and_the_sd_desc:0 "What is left of the Abwehr spies on the guard. What stayed of the SD spies on the Abwehr. The files each keeps on the other grow thicker every month."
 GER_the_abwehr_and_the_sd_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YTwo Armies in One Reich§! is complete."
 GER_the_zossen_circle:0 "The Zossen Circle"
 GER_the_zossen_circle_desc:0 "Generals of the army high command meet at Zossen. They write nothing down. The SD writes down that they met."
 GER_the_zossen_circle_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YThe Abwehr and the SD§! is complete."
 GER_gestapo_files_on_the_general_staff:0 "Gestapo Files on the General Staff"
 GER_gestapo_files_on_the_general_staff_desc:0 "With Himmler gone the Gestapo answers to the Chancellery, and the Führer wants a file on every general."
 GER_shots_at_the_chancellery_gate:0 "Shots at the Chancellery Gate"
 GER_shots_at_the_chancellery_gate_desc:0 "A Wehrmacht courier refuses to be searched, and an SS sentry fires. Both sides bury their dead with full honours, and each blames the other."
 GER_shots_at_the_chancellery_gate_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YThe Zossen Circle§! is complete."
 GER_newsreel_wehrmacht_and_ss_shoulder_to_shoulder:0 "Newsreel: Wehrmacht and SS, Shoulder to Shoulder"
 GER_newsreel_wehrmacht_and_ss_shoulder_to_shoulder_desc:0 "On the anniversary of Totaler Sieg the guard and the army march in step past the Chancellery. Nobody in either uniform believes it."
 GER_newsreel_wehrmacht_and_ss_shoulder_to_shoulder_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YShots at the Chancellery Gate§! is complete."
 GER_the_officers_memorandum:0 "The Officers' Memorandum"
 GER_the_officers_memorandum_desc:0 "Twenty-two generals sign a letter asking the Führer to disband his guard. He tears it up in front of them."
 GER_the_officers_memorandum_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YNewsreel: Wehrmacht and SS, Shoulder to Shoulder§! is complete."
 GER_purge_the_signatories:0 "Purge the Signatories"
 GER_purge_the_signatories_desc:0 "The twenty-two are dismissed. Four of them are shot."
 GER_pardon_the_signatories:0 "Pardon the Signatories"
 GER_pardon_the_signatories_desc:0 "The Führer pretends the letter was never written. The guard calls it weakness."
 GER_the_army_waits:0 "The Army Waits"
 GER_the_army_waits_desc:0 "The officers stop arguing. They wait, and they count."
 GER_the_army_waits_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YThe Officers' Memorandum§! is complete."
 GER_treason_in_the_west:0 "Treason in the West"
 GER_treason_in_the_west_desc:0 "The SS has risen in the West, and the Reich is at war with its own Order State. Every SS man still in Germany is checked for loyalty."
 GER_a_satellite_called_burgund:0 "A Satellite Called Burgund"
 GER_a_satellite_called_burgund_desc:0 "Himmler is gone without a shot fired, and he took the western provinces with him. The Reich gave away land in the year of its victory."
 GER_crush_the_black_order:0 "Crush the Black Order"
 GER_crush_the_black_order_desc:0 "The Wehrmacht marches west against the SS. The generals learn that they can beat it, and the SS learns it too."
 GER_the_ordensburgen_trials:0 "The Ordensburgen Trials"
 GER_the_ordensburgen_trials_desc:0 "The SS leaders who were taken alive are tried in Berlin. The verdicts were written before the trials began."
 GER_newsreel_the_traitors_answer_for_it:0 "Newsreel: The Traitors Answer for It"
 GER_newsreel_the_traitors_answer_for_it_desc:0 "The verdicts are read out in every cinema in the Reich, before the main feature."
 GER_newsreel_the_traitors_answer_for_it_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Ordensburgen Trials§! is complete."
 GER_the_meuse_border:0 "The Meuse Border"
 GER_the_meuse_border_desc:0 "A new border has to be held against a former ally. The army digs in facing the SS."
 GER_tribute_from_the_order_state:0 "Tribute from the Order State"
 GER_tribute_from_the_order_state_desc:0 "Burgund pays for its freedom, in rifles and in gold."
 GER_himmlers_long_shadow:0 "Himmler's Long Shadow"
 GER_himmlers_long_shadow_desc:0 "Everyone who ever wore the black uniform is under suspicion now, and SS sympathisers are found wherever somebody looks for them."
 GER_himmlers_long_shadow_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YTribute from the Order State§! is complete."
 GER_the_western_question_settled:0 "The Western Question Settled"
 GER_the_western_question_settled_desc:0 "The West is settled one way or the other. The army remembers who did the fighting, or who gave the land away."
 GER_the_western_question_settled_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YNewsreel: The Traitors Answer for It§! or §YHimmler's Long Shadow§! is complete."
 GER_keep_up_the_facade:0 "Keep Up the Facade"
 GER_keep_up_the_facade_desc:0 "The report goes into a drawer. The newsreels go on. The Reich will spend whatever it takes to look rich for as long as it can, and then it will spend what it does not have."
 GER_keep_up_the_facade_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YSpeer's Final Report§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§!."
 GER_speers_emergency_programme:0 "Speer's Emergency Programme"
 GER_speers_emergency_programme_desc:0 "One more plan, the last Speer will be allowed to draw up. Every signature it needs is delayed at the Party Chancellery."
 GER_speers_emergency_programme_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YKeep Up the Facade§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§!."
 GER_rationing_in_peacetime:0 "Rationing in Peacetime"
 GER_rationing_in_peacetime_desc:0 "Ration cards return in the year of victory. The posters call it discipline."
 GER_rationing_in_peacetime_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YSpeer's Emergency Programme§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§!."
 GER_swiss_gold:0 "Swiss Gold"
 GER_swiss_gold_desc:0 "A loan against the Reichsbank's gold, from bankers who do not ask where the gold came from."
 GER_swiss_gold_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YSpeer's Emergency Programme§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§! and §YSwitzerland§! or §YSweden§! exists and is at peace with Germany."
 GER_demobilise_the_reserves:0 "Demobilise the Reserves"
 GER_demobilise_the_reserves_desc:0 "Speer's oldest request: send the reservists back to the factories. The generals watch their army shrink while the Führer's guard grows."
 GER_demobilise_the_reserves_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YRationing in Peacetime§! or §YSwiss Gold§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§!."
 GER_newsreel_the_reich_builds:0 "Newsreel: The Reich Builds"
 GER_newsreel_the_reich_builds_desc:0 "Autobahns, dams, and the first towers of Germania. Every one of them was paid for twice."
 GER_newsreel_the_reich_builds_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YDemobilise the Reserves§! is complete."
 GER_the_numbers_no_longer_add_up:0 "The Numbers No Longer Add Up"
 GER_the_numbers_no_longer_add_up_desc:0 "Speer's last audit shows the Facade passing what the civilian industry can carry. Bormann's Chancellery blames Speer for it."
 GER_the_numbers_no_longer_add_up_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YNewsreel: The Reich Builds§! is complete, and only while §YAlbert Speer§! sits in the §YInner Circle§!."
 GER_speer_resigns:0 "Speer Resigns"
 GER_speer_resigns_desc:0 "Speer puts his resignation on the Führer's desk, and for once Bormann makes sure it reaches him."
 GER_speer_stays_at_his_desk:0 "Speer Stays at His Desk"
 GER_speer_stays_at_his_desk_desc:0 "Speer stays, and from now on he is blamed for everything that goes wrong."
 GER_the_economy_in_free_fall:0 "The Economy in Free Fall"
 GER_the_economy_in_free_fall_desc:0 "Consumer goods take every civilian factory the Reich has, and then they start on the arms plants."
 GER_the_economy_in_free_fall_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YSpeer Resigns§! or §YSpeer Stays at His Desk§! is complete."
 GER_germany_on_the_brink:0 "Germany on the Brink"
 GER_germany_on_the_brink_desc:0 "The army and the Führer's guard face each other across Berlin. The ministers at the Führer's bedside have no answer, and they no longer pretend to."
 GER_germany_on_the_brink_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YNewsreel: The Führer's Last Balcony§! and §YThe Army Waits§! and §YThe Economy in Free Fall§! are complete, and no sooner than five years after §YTotaler Sieg§! - or at once if the army moves first, when §YArmy-SS distrust§! reaches §R100§!."
 GER_fuhrer_found_dead:0 "Führer Found Dead"
 GER_fuhrer_found_dead_desc:0 "The guard finds him in the morning. The doctors argue about the cause for an hour, and then the Party tells them what it was."
 GER_fuhrer_found_dead_itself_tt:0 "This focus cannot be chosen. It happens on its own, once §YGermany on the Brink§! is complete."
 GER_grand_funeral_schemes_of_power:0 "Grand Funeral, Schemes of Power"
 GER_grand_funeral_schemes_of_power_desc:0 "All of Germany mourns along the East-West Axis. Behind the black crêpe every faction counts its divisions."
 GER_the_deutsche_volksliste:0 "The Deutsche Volksliste"
 GER_the_deutsche_volksliste_desc:0 "Everyone in the annexed lands is sorted into categories by the state. Those listed as German are drafted. The rest are listed for something else."
 GER_settlers_from_the_old_reich:0 "Settlers from the Old Reich"
 GER_settlers_from_the_old_reich_desc:0 "Families from the Old Reich are offered farms, homes and loans in the annexed lands, and the farms and homes are emptied for them."
 GER_deportations_to_the_east:0 "Deportations to the East"
 GER_deportations_to_the_east_desc:0 "The lists from the Volksliste become timetables."
 GER_new_names_for_old_cities:0 "New Names for Old Cities"
 GER_new_names_for_old_cities_desc:0 "Łódź becomes Litzmannstadt, Gdynia Gotenhafen, Poznań Posen, Katowice Kattowitz, and Płock Schröttersburg. The maps are reprinted."
 GER_the_wartheland_model:0 "The Wartheland Model"
 GER_the_wartheland_model_desc:0 "Posen and Litzmannstadt are rebuilt as the model of what the whole East is meant to become."
 GER_blood_before_labour:0 "Blood Before Labour"
 GER_blood_before_labour_desc:0 "Himmler wins the argument: the East is to be emptied, whatever it costs the factories."
 GER_labour_before_blood:0 "Labour Before Blood"
 GER_labour_before_blood_desc:0 "Speer wins the argument: the Reich keeps the workers it has. The Party calls it betrayal."
 GER_the_reichs_wonder_weapons:0 "The Reich's Wonder Weapons"
 GER_the_reichs_wonder_weapons_desc:0 "The war's secret projects are pooled under one office, and Goebbels makes sure the whole world hears about each of them."
 GER_peenemunde_reborn:0 "Peenemünde Reborn"
 GER_peenemunde_reborn_desc:0 "Von Braun's team gets Peenemünde back, with a blank cheque."
 GER_the_uranium_club_reconvened:0 "The Uranium Club Reconvened"
 GER_the_uranium_club_reconvened_desc:0 "Heisenberg's uranium club is called back together, and this time nobody is allowed to say it cannot be done."
 GER_the_jet_age_luftwaffe:0 "The Jet Age Luftwaffe"
 GER_the_jet_age_luftwaffe_desc:0 "The successors of the Me 262 are already on the drawing boards."
 GER_newsreel_the_v_weapons_fly_again:0 "Newsreel: The V-Weapons Fly Again"
 GER_newsreel_the_v_weapons_fly_again_desc:0 "The rockets rise over the Baltic for the cameras."
 GER_newsreel_the_v_weapons_fly_again_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YPeenemünde Reborn§! is complete."
 GER_newsreel_german_science_leads_the_world:0 "Newsreel: German Science Leads the World"
 GER_newsreel_german_science_leads_the_world_desc:0 "Scientists in white coats, filmed from below."
 GER_newsreel_german_science_leads_the_world_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Uranium Club Reconvened§! is complete."
 GER_newsreel_masters_of_the_sky:0 "Newsreel: Masters of the Sky"
 GER_newsreel_masters_of_the_sky_desc:0 "Jets in formation over the Brandenburg Gate."
 GER_newsreel_masters_of_the_sky_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Jet Age Luftwaffe§! is complete."
 GER_the_amerika_rocket:0 "The Amerika Rocket"
 GER_the_amerika_rocket_desc:0 "The A9/A10: a rocket that can reach New York."
 GER_the_reichs_atomic_pile:0 "The Reich's Atomic Pile"
 GER_the_reichs_atomic_pile_desc:0 "The first German reactor goes critical in a cellar outside Berlin."
 GER_the_horten_flying_wing:0 "The Horten Flying Wing"
 GER_the_horten_flying_wing_desc:0 "The Horten H XVIII, the Amerikabomber: a jet flying wing that radar barely sees."
 GER_newsreel_a_rocket_over_the_atlantic:0 "Newsreel: A Rocket Over the Atlantic"
 GER_newsreel_a_rocket_over_the_atlantic_desc:0 "A test rocket comes down in the Atlantic, in sight of an American ship."
 GER_newsreel_a_rocket_over_the_atlantic_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Amerika Rocket§! is complete."
 GER_newsreel_the_sun_in_german_hands:0 "Newsreel: The Sun in German Hands"
 GER_newsreel_the_sun_in_german_hands_desc:0 "The flash over the test range is shown in slow motion, twice."
 GER_newsreel_the_sun_in_german_hands_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Reich's Atomic Pile§! is complete, once Germany has completed the §YAtomic Bomb§! special project."
 GER_newsreel_wings_over_the_reich:0 "Newsreel: Wings Over the Reich"
 GER_newsreel_wings_over_the_reich_desc:0 "The flying wing passes over the Party rally at Nuremberg."
 GER_newsreel_wings_over_the_reich_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YThe Horten Flying Wing§! is complete."
 GER_the_reich_space_office:0 "The Reich Space Office"
 GER_the_reich_space_office_desc:0 "A Reichsraumfahrtamt, with von Braun at its head and the stars as its border."
 GER_project_silbervogel:0 "Project Silbervogel"
 GER_project_silbervogel_desc:0 "Sänger's antipodal bomber skips along the edge of space to strike the other side of the world."
 GER_project_walhalla:0 "Project Walhalla"
 GER_project_walhalla_desc:0 "The first artificial satellite, built to pass over every capital on Earth."
 GER_newsreel_a_german_star_in_the_sky:0 "Newsreel: A German Star in the Sky"
 GER_newsreel_a_german_star_in_the_sky_desc:0 "Walhalla's radio signal is played on every Volksempfänger in the Reich."
 GER_newsreel_a_german_star_in_the_sky_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YProject Walhalla§! is complete."
 GER_newsreel_the_thousand_year_exhibition:0 "Newsreel: The Thousand-Year Exhibition"
 GER_newsreel_the_thousand_year_exhibition_desc:0 "The wonder weapons are put on show in the halls of Germania."
 GER_newsreel_the_thousand_year_exhibition_itself_tt:0 "This focus cannot be chosen. It is worked on by §Y$CHARACTER$§! himself, once §YProject Silbervogel§! or §YNewsreel: A German Star in the Sky§! is complete."
 GER_a_guard_of_his_own_units_tt:0 "§Y6§! veteran, fully equipped §YLeibstandarte Divisions§! are raised in §YBrandenburg§!. They cannot be edited or trained."
 GER_blood_before_labour_tt:0 "Every annexed German state loses a further §R15%§! of its population."
 GER_bormann_holds_the_keys_tt:0 "Speer's §Yrequisition decisions§! cost §R25§! more political power."
 GER_demobilise_the_reserves_tt:0 "Up to §Y20§! infantry divisions are disbanded. Their men go home and their rifles go back into the stockpile."
 GER_deportations_to_the_east_tt:0 "Unlocks a §Ydeportation decision§! for each annexed state, once each, for §Y25§! political power: the state loses §R25%§! of its population, sent into §YReichskommissariat Ostland§! or §YUkraine§!, which loses §R10%§! stability for a year. Each one: §YFacade Economy§! growth §R+0.05%§! a month for good, world tension §R+1%§!."
 GER_dr_morells_injections_tt:0 "From now on the §YFührer's moods§! can overrule his ministers: every month there is a chance of an event that costs §Rpolitical power§! or §Rstability§!."
 GER_fuhrer_found_dead_tt:0 "§YAdolf Hitler§! is dead. Until the Party agrees on a successor, the §YReichstag§! governs, with the trait §YParalysed Government§! (Political power gain: §R-20%§!)."
 GER_germany_on_the_brink_tt:0 "The Reich will not survive the Führer."
 GER_gestapo_files_on_the_general_staff_tt:0 "An event decides what to do with the files: arrest three generals (§Rdistrust +15§!, §G+50§! political power) or keep them closed (§Rdistrust +5§!)."
 GER_government_by_audience_tt:0 "Unlocks the §YAudience with the Führer§! decisions in §YThe Reich Divided§!."
 GER_grand_funeral_schemes_of_power_tt:0 "The day after the funeral, the Reich begins to come apart."
 GER_labour_before_blood_tt:0 "The §Ydeportation decisions§! are gone for good."
 GER_new_names_for_old_cities_tt:0 "§YŁódź§!, §YGdynia§!, §YPoznań§!, §YKatowice§! and §YPłock§! are renamed."
 GER_project_walhalla_tt:0 "Germany puts the first satellite into orbit."
 GER_settlers_from_the_old_reich_tt:0 "Unlocks a §Ysettlement decision§! for each annexed state, once each, for §Y25§! political power: §Y5%§! of the population of a neighbouring Old Reich state moves in. Each wave: §YFacade Economy§! consumer goods §R+1%§!."
 GER_speer_resigns_tt:0 "§YAlbert Speer§! leaves the §YInner Circle§!, and his ministry's spirit goes with him. His seat stays empty. If the §Ysuccession contest§! has begun, his faction collapses and its support splits between the others."
 GER_speers_emergency_programme_tt:0 "§YReich Ministry for the Total Economy§!: Factory efficiency growth §G+5%§!."
 GER_ss_liaison_officers_in_every_corps_tt:0 "The army can no longer plan in secret: even at §R100§! distrust it cannot move before §YGermany on the Brink§!."
 GER_the_army_waits_tt:0 "From now on §YArmy-SS distrust§! can no longer fall, and it rises by §R2§! every month while the Führer's guard exists."
 GER_the_generals_count_their_divisions_tt:0 "The §YArmy-SS distrust§! meter appears in §YThe Reich Divided§!. It has counted quietly since §YTotaler Sieg§!. At §R100§! the army moves, whatever the date."
 GER_the_meuse_border_tt:0 "Every German state bordering the §YOrdensstaat Burgund§! gains level §Y3§! forts along that border."
 GER_the_regency_council_tt:0 "Whichever faction leads the §Ysuccession contest§! holds the chair."
 GER_the_reichs_wonder_weapons_tt:0 "Each project in this branch costs §YFacade Economy§! growth, and each is followed by a newsreel that completes itself and raises §Gstability§!. A project Germany has already completed is §Ybypassed§!."
 GER_the_succession_question_tt:0 "The §Ysuccession contest§! begins. The Party, Propaganda, Luftwaffe and Economy factions gain support every month, and the §YAudience with the Führer§! decisions push it. The standings are shown in §YThe Reich Divided§!."
 GER_the_wartheland_model_tt:0 "§YPoznań§! and §YŁódź§!, if German: §Y+2§! civilian factories and §Y+1§! infrastructure each. Every annexed German state: construction speed §G+10%§! for a year."
 GER_tribute_from_the_order_state_tt:0 "Every year the §YOrdensstaat Burgund§! sends Germany §Y10%§! of its stockpiled infantry equipment, and while it stays a German subject the §YFacade Economy§!'s growth falls by §G0.05%§! a month."
