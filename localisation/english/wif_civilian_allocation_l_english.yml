l_english:
 wif_cg_title:0 "Civilian Factory Allocation"
 wif_cg_auto_label:0 "Automatic factory redistribution"
 wif_cg_auto_tt:0 "While ticked, whenever §YConsumer Goods§! are short of what is required, factories are moved onto them automatically - from §YTrains§! first, then the four resources, then §YConstruction§! - until goods are paid in full or nothing is left to move.\n\nUntick it to decide for yourself, including paying less than required."
 wif_cg_summary:0 "Civilian factories: §Y[?wif_cg_pool|0]§!   Required on goods: §Y[?wif_cg_required|0]§!   Balance: [?wif_cg_balance|+0]"
 wif_cg_add_tt:0 "Move a factory in from §YConstruction§!.\n§GShift§!: 5   §GCtrl§!: 10"
 wif_cg_sub_tt:0 "Move a factory back to §YConstruction§!.\n§GShift§!: 5   §GCtrl§!: 10"
 wif_cg_open_tt:0 "Open §YCivilian Factory Allocation§!"
 wif_cg_overlay_recommended:0 "[?wif_cg_required|0]"
 wif_cg_overlay_balance:0 "[?wif_cg_balance|+0]"
 wif_cg_overlay_tt:0 "§YRecommended:§! [?wif_cg_required|0] factories on consumer goods to break even.\n§YPaying:§! [?wif_cg_on_goods|0]  ([?wif_cg_balance|+0])\n\nEvery factory over: §G+0.01%§! stability and war support, §G+0.001%§! construction speed.\nEvery factory short: §R-1%§! stability and war support §Ra week§!. Past §R25%§! debt the ruling party loses support; past §R50%§! every further factory short costs §R1%§! factory output, efficiency growth and max efficiency."
 wif_cg_goods_name:0 "Consumer Goods"
 wif_cg_goods_desc:0 "Factories paying for consumer goods. Pay more than required for small stability, war support and construction bonuses; pay less and the country suffers for it."
 wif_cg_goods_count:0 "[?wif_cg_on_goods|0]"
 wif_cg_goods_out0:0 "[?wif_cg_out_stability|%+1]"
 wif_cg_goods_out1:0 "[?wif_cg_out_war_support|%+1]"
 wif_cg_goods_out2:0 "[?wif_cg_bonus_construction|%+2]"
 wif_cg_construction_name:0 "Construction"
 wif_cg_construction_desc:0 "Everything not put anywhere else. These are the factories that build."
 wif_cg_construction_count:0 "[?wif_cg_on_construction|0]"
 wif_cg_steel_name:0 "Steel"
 wif_cg_steel_desc:0 "Each factory here adds §G+0.1§! steel - ten factories make one."
 wif_cg_steel_count:0 "[?wif_cg_on_steel|0]"
 wif_cg_steel_out0:0 "[?wif_cg_res_steel|+1]"
 wif_cg_tungsten_name:0 "Tungsten"
 wif_cg_tungsten_desc:0 "Each factory here adds §G+0.1§! tungsten - ten factories make one."
 wif_cg_tungsten_count:0 "[?wif_cg_on_tungsten|0]"
 wif_cg_tungsten_out0:0 "[?wif_cg_res_tungsten|+1]"
 wif_cg_chromium_name:0 "Chromium"
 wif_cg_chromium_desc:0 "Each factory here adds §G+0.1§! chromium - ten factories make one."
 wif_cg_chromium_count:0 "[?wif_cg_on_chromium|0]"
 wif_cg_chromium_out0:0 "[?wif_cg_res_chromium|+1]"
 wif_cg_aluminium_name:0 "Aluminium"
 wif_cg_aluminium_desc:0 "Each factory here adds §G+0.1§! aluminium - ten factories make one."
 wif_cg_aluminium_count:0 "[?wif_cg_on_aluminium|0]"
 wif_cg_aluminium_out0:0 "[?wif_cg_res_aluminium|+1]"
 wif_cg_trains_name:0 "Trains"
 wif_cg_trains_desc:0 "Each factory works like a basic military factory at 25% efficiency and delivers whole trains to the stockpile every week."
 wif_cg_trains_count:0 "[?wif_cg_on_trains|0]"
 wif_cg_trains_out0:0 "[?wif_cg_train_rate|1]"
 wif_cg_goods_out_tt:0 "§YStability§!: [?wif_cg_out_stability|%+2]   §YWar support§!: [?wif_cg_out_war_support|%+2]   §YConstruction speed§!: [?wif_cg_bonus_construction|%+3]\n\nOver the requirement these are §Gflat bonuses§!. Under it, stability and war support are lost §Revery week§! instead."
 wif_cg_steel_out_tt:0 "[?wif_cg_res_steel|+1] steel from [?wif_cg_on_steel|0] factories."
 wif_cg_tungsten_out_tt:0 "[?wif_cg_res_tungsten|+1] tungsten from [?wif_cg_on_tungsten|0] factories."
