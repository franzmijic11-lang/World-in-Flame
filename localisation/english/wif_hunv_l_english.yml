l_english:
 wif_hunv_victorious:0 "Victorious in a New World"
 wif_hunv_victorious_desc:0 "Germany has won the war in Europe, and Hungary stood on the winning side. Trianon is torn up, the lands of the Holy Crown are gathered again - and Budapest must now find its place in a continent that answers to Berlin."
 wif_hunv_who_rules_hungary:0 "Who Governs Hungary"
 wif_hunv_who_rules_hungary_desc:0 "Victory settled the war, not the question of who holds power in Budapest - the old magnates, the officers, the parties of the street."
 wif_hunv_holy_crown_doctrine:0 "The Doctrine of the Holy Crown"
 wif_hunv_holy_crown_doctrine_desc:0 "All power flows from the Crown of St Stephen - whoever wears it, or guards it in its name."
 wif_hunv_berlins_demand:0 "Berlin's Demand"
 wif_hunv_berlins_demand_desc:0 "In 1942 and 1943 Germany demanded that Hungary hand over its Jews; Budapest refused, and in 1944 Germany occupied the country and took them. Victorious Germany asks again - for the 800,000 Jews of Greater Hungary."
 wif_hunv_arrow_cross_question:0 "The Arrow Cross Question"
 wif_hunv_arrow_cross_question_desc:0 "The Arrow Cross helped win the war in the streets and wants the state as its reward."
 wif_hunv_gendarmerie:0 "The Royal Gendarmerie"
 wif_hunv_gendarmerie_desc:0 "The feather-capped gendarmes keep order in every village of Greater Hungary."
 wif_hunv_land_question:0 "The Land Question"
 wif_hunv_land_question_desc:0 "Half of Hungary's arable land belongs to great estates; three million peasants own little or nothing."
 wif_hunv_refuse_berlin:0 "Refuse Berlin"
 wif_hunv_refuse_berlin_desc:0 "As in 1943: Hungary will keep its laws against the Jews but will not hand them to Germany. Berlin is told no - and Berlin remembers."
 wif_hunv_the_trains:0 "The Trains"
 wif_hunv_the_trains_desc:0 "In 1944 the gendarmerie deported 437,000 Hungarian Jews to Auschwitz in 56 days. In this Europe it happens with Budapest's consent: the ghettos, the brickyards, the trains north."
 wif_hunv_tame_the_arrow_cross:0 "Tame the Arrow Cross"
 wif_hunv_tame_the_arrow_cross_desc:0 "Posts for the leaders, prison for the street fighters."
 wif_hunv_arrow_cross_in_power:0 "The Arrow Cross in Power"
 wif_hunv_arrow_cross_in_power_desc:0 "The party's men take the ministries and the police."
 wif_hunv_land_reform:0 "Break the Great Estates"
 wif_hunv_land_reform_desc:0 "The estates of the magnates and the Church are divided among the peasants who work them."
 wif_hunv_preserve_the_estates:0 "Preserve the Estates"
 wif_hunv_preserve_the_estates_desc:0 "The magnates won the war for Hungary too. They keep their land."
 wif_hunv_national_radio:0 "Radio Budapest"
 wif_hunv_national_radio_desc:0 "One voice for the nation, from the Danube to the Carpathians."
 wif_hunv_corporate_chamber:0 "The Corporate Chamber"
 wif_hunv_corporate_chamber_desc:0 "Guilds, unions and employers in one chamber under the state."
 wif_hunv_censorship:0 "The Press Chamber"
 wif_hunv_censorship_desc:0 "Every newspaper licensed, every editor a member."
 wif_hunv_peasant_hungary:0 "A Nation of Smallholders"
 wif_hunv_peasant_hungary_desc:0 "Whatever was decided about the land, the village is the nation."
 wif_hunv_national_consolidation:0 "A Nation Consolidated"
 wif_hunv_national_consolidation_desc:0 "Ten years after the war began, Hungary is governed again - firmly."
 wif_hunv_hungary_at_mid_century:0 "Hungary at Mid-Century"
 wif_hunv_hungary_at_mid_century_desc:0 "A thousand-year kingdom in a thousand-year Reich's Europe."
 wif_hunv_lands_of_the_crown:0 "The Lands of the Holy Crown"
 wif_hunv_lands_of_the_crown_desc:0 "Northern Transylvania, the Bacska, Ruthenia and southern Slovakia - returned. Now they must be governed."
 wif_hunv_szekely_railway:0 "The Szekely Railway"
 wif_hunv_szekely_railway_desc:0 "The Szeretfalva-Deda line, built in 1942, ties the Szekely Land to Hungary at last."
 wif_hunv_kolozsvar_university:0 "The University of Kolozsvar"
 wif_hunv_kolozsvar_university_desc:0 "The Franz Joseph University returns from exile in Szeged to Kolozsvar."
 wif_hunv_nationalities_question:0 "The Nationalities Question"
 wif_hunv_nationalities_question_desc:0 "A third of Greater Hungary's people are not Magyars: Romanians, Slovaks, Serbs, Ruthenians, Germans."
 wif_hunv_ruthenian_question:0 "The Ruthenian Question"
 wif_hunv_ruthenian_question_desc:0 "Carpathian Ruthenia was promised autonomy in 1939. It never came."
 wif_hunv_magyarisation:0 "Magyarisation"
 wif_hunv_magyarisation_desc:0 "One nation in the lands of the Crown: Hungarian schools, Hungarian names, Hungarian officials."
 wif_hunv_nationalities_statute:0 "The Nationalities Statute"
 wif_hunv_nationalities_statute_desc:0 "Schools and officials in their own languages for the peoples of the Crown - as St Stephen advised: 'a kingdom of one tongue is weak'."
 wif_hunv_ruthenian_voivodeship:0 "The Ruthenian Voivodeship"
 wif_hunv_ruthenian_voivodeship_desc:0 "Ruthenia gets a governor of its own and a diet with little power."
 wif_hunv_romanian_problem:0 "The Romanian Problem"
 wif_hunv_romanian_problem_desc:0 "A million Romanians live in Northern Transylvania. Tens of thousands are pushed south over the Vienna line."
 wif_hunv_ujvidek:0 "Ujvidek"
 wif_hunv_ujvidek_desc:0 "January 1942: hunting 'partisans' in the Bacska, Hungarian soldiers and gendarmes kill more than 3,300 Serbs and Jews in Novi Sad and the villages, many shot into the frozen Danube. In this Europe no one is tried for it."
 wif_hunv_volksbund:0 "The Volksbund"
 wif_hunv_volksbund_desc:0 "Half a million Danube Swabians answer to the SS-backed Volksbund, not to Budapest."
 wif_hunv_slovak_question:0 "The Slovak Question"
 wif_hunv_slovak_question_desc:0 "Bratislava is Berlin's client. Budapest wants it back in the Crown."
 wif_hunv_vienna_line:0 "Defend the Vienna Line"
 wif_hunv_vienna_line_desc:0 "Romania has never accepted the award. The new border must be held."
 wif_hunv_swabian_settlements:0 "The Swabian Villages"
 wif_hunv_swabian_settlements_desc:0 "German villages from the Bacska to the Banat - prosperous, disciplined, loyal to someone else."
 wif_hunv_slovakia_subject:0 "Slovakia in the Crown"
 wif_hunv_slovakia_subject_desc:0 "Ask Berlin for Slovakia - as a Hungarian protectorate."
 wif_hunv_slovak_friendship:0 "A Slovak Friendship"
 wif_hunv_slovak_friendship_desc:0 "Leave Slovakia be - and make it a friend."
 wif_hunv_lands_united:0 "One Crown, Many Peoples"
 wif_hunv_lands_united_desc:0 "The lands of the Holy Crown are governed as one again, after twenty years apart."
 wif_hunv_peace_economy:0 "The Peace Economy"
 wif_hunv_peace_economy_desc:0 "War orders stop; the Reich's markets open. Hungary must make the change."
 wif_hunv_bauxite:0 "Bauxite for the Reich"
 wif_hunv_bauxite_desc:0 "Hungary holds some of Europe's richest bauxite - the ore of the Luftwaffe's aluminium."
 wif_hunv_zala_oil:0 "Seize MAORT"
 wif_hunv_zala_oil_desc:0 "The Zala oilfields at Lispe and Nagylengyel belong to Standard Oil's Hungarian company. Not any more."
 wif_hunv_csepel:0 "The Csepel Works"
 wif_hunv_csepel_desc:0 "Manfred Weiss's island works make bicycles, aircraft engines and shells."
 wif_hunv_danube_shipping:0 "The Danube Shipping Company"
 wif_hunv_danube_shipping_desc:0 "The river from Regensburg to the Black Sea, under German and Hungarian flags."
 wif_hunv_grain_for_the_grossraum:0 "Grain for the Grossraum"
 wif_hunv_grain_for_the_grossraum_desc:0 "Wheat for the Reich's cities at Berlin's prices."
 wif_hunv_ajka:0 "The Ajka Smelter"
 wif_hunv_ajka_desc:0 "Smelt the bauxite at home, not in Germany."
 wif_hunv_zala_pipeline:0 "The Zala Refineries"
 wif_hunv_zala_pipeline_desc:0 "Refineries at the fields and a pipeline to Budapest."
 wif_hunv_ganz:0 "Ganz and Company"
 wif_hunv_ganz_desc:0 "Locomotives, electric railways, diesel engines - Ganz sells to half of Europe."
 wif_hunv_danube_tisza_canal:0 "The Danube-Tisza Canal"
 wif_hunv_danube_tisza_canal_desc:0 "A canal across the Great Plain, planned for a century."
 wif_hunv_farm_machinery:0 "Tractors for the Plain"
 wif_hunv_farm_machinery_desc:0 "Hofherr-Schrantz tractors on the puszta."
 wif_hunv_tungsram:0 "The Tungsram Laboratory"
 wif_hunv_tungsram_desc:0 "Light bulbs, radio valves and the best physicists in Central Europe."
 wif_hunv_budapest_metro:0 "The Budapest Metro"
 wif_hunv_budapest_metro_desc:0 "The second underground railway on the continent was Budapest's, in 1896. The first line under Pest's new boulevards begins."
 wif_hunv_electrify_the_plain:0 "Electrify the Plain"
 wif_hunv_electrify_the_plain_desc:0 "Power to the market towns of the Alfold."
 wif_hunv_radar_to_the_moon:0 "Radar to the Moon"
 wif_hunv_radar_to_the_moon_desc:0 "Zoltan Bay's team bounces a radar signal off the Moon - one of the first in the world."
 wif_hunv_grossraum_partner:0 "A Partner in the Grossraum"
 wif_hunv_grossraum_partner_desc:0 "Not a colony like Romania - a partner. Budapest insists on the difference."
 wif_hunv_hungarian_pengo:0 "A Strong Pengo"
 wif_hunv_hungarian_pengo_desc:0 "Our own currency, our own prices, our own trade."
 wif_hunv_danube_basin:0 "The Danube Basin Economy"
 wif_hunv_danube_basin_desc:0 "Trade with Vienna, Bratislava, Zagreb, Belgrade - the old Monarchy's market."
 wif_hunv_industrial_hungary:0 "An Industrial Hungary"
 wif_hunv_industrial_hungary_desc:0 "The kingdom of the plain makes engines, aluminium and radios."
 wif_hunv_economy_1952:0 "The Economy of 1952"
 wif_hunv_economy_1952_desc:0 "Richer than at any time since 1914."
 wif_hunv_honved_after_victory:0 "The Honved After Victory"
 wif_hunv_honved_after_victory_desc:0 "Hungary's army fought from the Don to the Carpathians. Now it must be rebuilt for peace - or the next war."
 wif_hunv_occupation_group:0 "The Occupation Group"
 wif_hunv_occupation_group_desc:0 "Hungarian divisions still hold the rear in Reichskommissariat Ukraine, as they did from 1941."
 wif_hunv_levente:0 "The Levente"
 wif_hunv_levente_desc:0 "Every boy from twelve to twenty-one drills on Sunday."
 wif_hunv_honved_reform:0 "Reform the Honved"
 wif_hunv_honved_reform_desc:0 "The lessons of Voronezh: anti-tank guns, radios, trucks."
 wif_hunv_armoured_forces:0 "The Armoured Forces"
 wif_hunv_armoured_forces_desc:0 "The Turan was obsolete the day it was finished. Hungary needs real tanks."
 wif_hunv_air_force:0 "The Royal Hungarian Air Force"
 wif_hunv_air_force_desc:0 "The Magyar Kiralyi Honved Legiero."
 wif_hunv_partisan_hunters:0 "Partisan Hunters"
 wif_hunv_partisan_hunters_desc:0 "Years of 'security' operations in the Ukrainian forests."
 wif_hunv_ludovika:0 "The Ludovika Academy"
 wif_hunv_ludovika_desc:0 "The officers' academy on the Orczy garden."
 wif_hunv_tas:0 "Finish the Tas"
 wif_hunv_tas_desc:0 "The 44M Tas heavy tank was bombed in its factory in 1944. In this world it rolls out."
 wif_hunv_gyor_messerschmitts:0 "Gyor's Messerschmitts"
 wif_hunv_gyor_messerschmitts_desc:0 "The Gyor wagon works build Bf 109s under licence."
 wif_hunv_arpad_line:0 "The Arpad Line"
 wif_hunv_arpad_line_desc:0 "The Carpathian fortress line of 1940-44: bunkers in every pass."
 wif_hunv_standing_honved:0 "A Standing Honved"
 wif_hunv_standing_honved_desc:0 "Twenty-five divisions in peacetime."
 wif_hunv_zrinyi:0 "The Zrinyi"
 wif_hunv_zrinyi_desc:0 "The 43M Zrinyi assault gun: a Hungarian answer to the StuG."
 wif_hunv_me_210:0 "The Me 210 Ca"
 wif_hunv_me_210_desc:0 "Built by Danube Aircraft - better than the German original."
 wif_hunv_honved_1950:0 "The Honved of 1950"
 wif_hunv_honved_1950_desc:0 "An army fit for Hungary's new borders."
 wif_hunv_jets_for_hungary:0 "Jets for Hungary"
 wif_hunv_jets_for_hungary_desc:0 "German jet engines, Hungarian airframes."
 wif_hunv_new_europe:0 "Hungary in the New Europe"
 wif_hunv_new_europe_desc:0 "Berlin rules the continent. Every capital is looking for its place in the order - and Budapest means to have a good one."
 wif_hunv_berlin_first:0 "Berlin First"
 wif_hunv_berlin_first_desc:0 "The Reich made Greater Hungary possible. Hungary will be its most loyal ally."
 wif_hunv_rome_budapest:0 "The Rome-Budapest Axis"
 wif_hunv_rome_budapest_desc:0 "Italy backed Hungary's revisionism from 1927. Rome is Budapest's second friend - and its insurance against Berlin."
 wif_hunv_arbiters_of_vienna:0 "The Arbiters of Vienna"
 wif_hunv_arbiters_of_vienna_desc:0 "Germany and Italy guaranteed the Vienna line. Keep them interested in guaranteeing it."
 wif_hunv_watch_bucharest:0 "Watching Bucharest"
 wif_hunv_watch_bucharest_desc:0 "Romania arms. Romania waits. Romania remembers Cluj."
 wif_hunv_bulgarian_friendship:0 "The Enemy of Our Enemy"
 wif_hunv_bulgarian_friendship_desc:0 "Bulgaria has its own quarrel with Bucharest over the Dobruja."
 wif_hunv_turan:0 "Brothers in Turan"
 wif_hunv_turan_desc:0 "The Turanist dream: Magyars and Turks, kin from the steppe."
 wif_hunv_anti_comintern_congress:0 "The Anti-Comintern Congress"
 wif_hunv_anti_comintern_congress_desc:0 "Budapest hosts the congress of the victors over Bolshevism."
 wif_hunv_danubian_concord:0 "The Danubian Concord"
 wif_hunv_danubian_concord_desc:0 "Rome, Vienna's old ally, and Budapest: a Danube under Latin and Magyar eyes."
 wif_hunv_mitteleuropa:0 "The Mitteleuropa Customs Union"
 wif_hunv_mitteleuropa_desc:0 "Tariffs fall from the Rhine to the Carpathians."
 wif_hunv_carpathian_arms_race:0 "The Carpathian Arms Race"
 wif_hunv_carpathian_arms_race_desc:0 "Every Romanian division is answered by a Hungarian one."
 wif_hunv_balkan_contacts:0 "Friends in the Balkans"
 wif_hunv_balkan_contacts_desc:0 "Sofia and Ankara - with Bucharest between them."
 wif_hunv_reich_divided:0 "The Reich Divided"
 wif_hunv_reich_divided_desc:0 "The Reich is at war with itself. Its guarantees are worth what its armies can enforce - and they are fighting each other."
 wif_hunv_stand_with_the_axis:0 "Stand with the Axis"
 wif_hunv_stand_with_the_axis_desc:0 "Hungary owes Greater Hungary to the Reich. Whatever happens in Berlin, Budapest stays in the Axis - and in whichever Germany comes out of the war."
 wif_hunv_join_rome:0 "The Invitation from Rome"
 wif_hunv_join_rome_desc:0 "Italy's Pact of Rome wants Hungary."
 wif_hunv_crown_of_austria:0 "The Austrian Question"
 wif_hunv_crown_of_austria_desc:0 "Vienna and Budapest shared a crown for four centuries. With Rome behind it and Berlin no friend, Budapest looks at the old Monarchy's border again."
 wif_hunv_hold_the_vienna_line:0 "Hold the Vienna Line"
 wif_hunv_hold_the_vienna_line_desc:0 "Romania will strike while Berlin cannot protect the award."
 wif_hunv_fiume:0 "A Port at Fiume"
 wif_hunv_fiume_desc:0 "Hungary's old harbour on the Adriatic - Italian since 1924. Rome may lease it to a friend."
 wif_hunv_burgenland:0 "Take Burgenland"
 wif_hunv_burgenland_desc:0 "The strip of western Hungary given to Austria in 1921."
 wif_hunv_reich_returns:0 "The Reich Returns"
 wif_hunv_reich_returns_desc:0 "Germany is one again - and asks who stood where in its civil war."
 wif_hunv_bow_to_the_reich:0 "Bow to the Reich"
 wif_hunv_bow_to_the_reich_desc:0 "Back into Berlin's faction, with apologies."
 wif_hunv_defy_the_reich:0 "Defy the Reich"
 wif_hunv_defy_the_reich_desc:0 "Hungary stays its own master - and prepares."
 wif_hunv_hungary_1952:0 "Hungary in 1952"
 wif_hunv_hungary_1952_desc:0 "Greater Hungary has outlived the Reich's war with itself."
 wif_hunv_choose_a_side:0 "Choose a Side"
 wif_hunv_choose_a_side_desc:0 "Waiting is for the weak. Budapest backs the German successor most likely to win - and sends the Honved to prove it."
 wif_hunv_stand_by_the_winner:0 "Wait and Stand By the Winner"
 wif_hunv_stand_by_the_winner_desc:0 "Budapest keeps its army at home, its ambassadors polite and its options open. Whoever wins in Germany will find Hungary where it always was."
 wif_hunv_dark_dawn:0 "A Dark Dawn over Germany"
 wif_hunv_dark_dawn_desc:0 "The SS has won the civil war. Reinhard Heydrich, the man behind Prague's terror and the Wannsee conference, now rules in Berlin - and Budapest does not trust him to stop at Germany's borders."
 wif_hunv_victory_idea:0 "Victorious in a New World"
 wif_hunv_victory_idea_desc:0 "Trianon is torn up; the lands of the Crown are gathered again."
 wif_hunv_gendarmerie_idea:0 "The Royal Gendarmerie"
 wif_hunv_gendarmerie_idea_desc:0 "Feather caps in every village."
 wif_hunv_arrow_cross_idea:0 "The Arrow Cross in Power"
