 wif_hunv_tt_19:0 "§YGermany§! is asked to hand §YSlovakia§! to Hungary as a protectorate."
 wif_hunv_tt_20:0 "Slovakia: §G+50§! opinion of us."
 wif_hunv_tt_21:0 "A non-aggression pact with §YSlovakia§!."
