 wif_hun_victorious_in_a_new_world:0 "Victorious in a New World"
 wif_hun_victorious_in_a_new_world_desc:0 "Germany has won the war in Europe, and Hungary stood on the winning side. Trianon is torn up, the lands of the Holy Crown are gathered again - and Budapest must now find its place in a continent that answers to Berlin."
 wif_hun_victorious_britain_tt:0 "Britain is beaten or has made peace"
 wif_hun_victorious_soviets_tt:0 "The Soviet Union is broken"
 wif_hun_victorious_new_tree_tt:0 "§YThe Hungarian focus tree is replaced by the post-war tree.§!"
 wif_hunv.20.spg:0 "Back Speer's Germany."
 wif_hunv.20.gor:0 "Back Goring's Germany."
 wif_hunv.20.dwm:0 "Back the Wehrmacht."
 wif_hunv.20.bor:0 "Back Bormann's Germany."
 wif_hunv.1.t:0 "Hungary Victorious"
 wif_hunv.1.desc:0 "Budapest celebrates. Trianon is dead, the lands of the Holy Crown are gathered again, and Hungary stands among the victors of the war in Europe."
 wif_hunv.1.a:0 "A new world."
 wif_hunv.10.t:0 "Budapest Asks for Slovakia"
 wif_hunv.10.desc:0 "The Hungarian government asks the Reich to hand Slovakia to Hungary as a protectorate - the old Upper Hungary, returned to the lands of the Crown."
 wif_hunv.10.a:0 "Let Budapest have it."
 wif_hunv.10.a_tt:0 "§YSlovakia§! becomes a subject of §YHungary§!."
 wif_hunv.10.b:0 "Slovakia stays ours."
 wif_hunv.20.t:0 "Which Germany?"
 wif_hunv.20.desc:0 "Several of the German successors are holding firm, none closer to collapse than the others. The Honved will march - but for whom? (The SS is not a choice.)"
 wif_hunv.21.t:0 "Hungary Enters the German War"
 wif_hunv.21.desc:0 "The Honved has crossed into Austria to fight for one of the German successors. Budapest calls it a limited war: no one else is to join on either side."
 wif_hunv.21.a:0 "The Danube burns."
