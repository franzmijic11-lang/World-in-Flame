l_english:

 # The Swedish Civil War build-up. Logic: common/scripted_effects/wif_swe_civil_war_effects.txt

 # === The choice (AAT_Sweden_communism.1) ===========================
 AAT_Sweden_communism.1.wif_desc:0 "The red flag flies over Rosenbad, and the Riksdag sits on sufferance. Across the country the officers' messes have gone quiet in the way a room goes quiet when the wrong man walks in. Lindholm's men drill in the forests of Södermanland, the farmers' leagues talk of marching on Stockholm as their fathers did in 1914, and in Stockholm Palace an old King receives more generals than his calendar can explain.\n\nThe workers' guards in Norrköping and Gävle are arming too. Sooner or later someone will give an order and someone else will refuse it. When that day comes, which Sweden will you stand with?"
 AAT_Sweden_communism.1.wif_a:0 "Then Sweden must choose."
 AAT_Sweden_communism.1.wif_a_tt:0 "Two new focuses open below §YStrike the Capitalist Beast Down§!: §YFör Kung och Fosterland§! and §YFör arbetarnas revolution§!. The one you take decides which side you play in the coming civil war."

 # === The side-choice focuses ===
 SWE_for_kung_och_fosterland:0 "För Kung och Fosterland"
 SWE_for_kung_och_fosterland_desc:0 "The government has the Riksdag. The King has the army, or most of it, and the farmers, and a thousand years of Sweden behind him. We stand with the Crown."
 SWE_for_kung_och_fosterland_tt:0 "§YWe play the counter-revolution.§! The build-up for the Swedish civil war begins: win the garrisons for the Crown before the rising. When it comes, we become the Kingdom of Sweden under Gustaf V and the communist government holds the states it won.\nOpens §YThe Nordic Defense Council§!."
 SWE_for_arbetarnas_revolution:0 "För arbetarnas revolution"
 SWE_for_arbetarnas_revolution_desc:0 "The reaction is gathering in the officers' messes and the manor houses. Let it come. The workers took Sweden at the ballot box, and they will hold it with rifles if they have to."
 SWE_for_arbetarnas_revolution_tt:0 "§YWe play the revolution.§! The build-up for the Swedish civil war begins: hold the garrisons for the workers before the Crown rises. When it does, the royalists take the states they won.\nOpens §YThe Nordic Defense Council§!."

 # === Category ======================================================
 wif_swe_cw_category:0 "The Coming Storm"
 wif_swe_cw_category_desc:0 "Sweden is splitting in two, garrison by garrison. Every regiment won now is a regiment that fires on the other side when the shooting starts.\n\nWhen the countdown runs out, every state at §Y3§! or §Y4§! garrison control rises for the Crown, and every state at §Y1§! or §Y2§! holds for the revolution. Officers the revolution has reached go over to it; the rest stand with the King."
 wif_swe_cw_map_area:0 "The Coming Storm"
 wif_swe_cw_crown_counter_value:0 "[?SWE.wif_swe_cw_crown_divisions|0H]"
 wif_swe_cw_crown_counter_desc:0 "The §YCrown§! would raise [?SWE.wif_swe_cw_crown_divisions|0H] §Hmilitia divisions§! if the war began today."
 wif_swe_cw_red_counter_value:0 "[?SWE.wif_swe_cw_red_divisions|0H]"
 wif_swe_cw_red_counter_desc:0 "The §Rrevolution§! would raise [?SWE.wif_swe_cw_red_divisions|0H] Red Guard §Hmilitia divisions§! if the war began today."

 # === The plot ======================================================
 wif_swe_cw_crown_plot_mission:0 "The Rising for the Crown"
 wif_swe_cw_crown_plot_mission_desc:0 "The officers, the farmers' leagues and the King's household are agreed: the government must fall. When the time comes, the garrisons will march. Every action we take brings that day closer."
 wif_swe_cw_red_plot_mission:0 "The Counter-Revolution"
 wif_swe_cw_red_plot_mission_desc:0 "The reaction is gathering in the officers' messes and the manor houses. It will strike when it is ready. Every month we deny it is a month to arm the workers and win the regiments."

 # === Crown actions =================================================
 wif_swe_cw_second_farmers_march:0 "The Second Farmers' March"
 wif_swe_cw_second_farmers_march_desc:0 "In 1914 thirty thousand farmers marched to the Palace to demand that the King defend the realm. Their sons can do it again, and this time the King will answer them."
 wif_swe_cw_courtyard_speech:0 "A Speech in the Palace Courtyard"
 wif_swe_cw_courtyard_speech_desc:0 "The King will speak to his officers in the courtyard of Stockholm Palace, as he spoke to the farmers in 1914. A man who has given his oath to a King hears it differently when the King is in front of him."
 wif_swe_cw_arm_the_defence_corps:0 "Arm the Defence Corps"
 wif_swe_cw_arm_the_defence_corps_desc:0 "The volunteer defence corps of the countryside have rifles on paper and drill on Sundays. Open the regimental depots to them, quietly, and they become an army."
 wif_swe_cw_break_the_strikes:0 "Break the Strikes"
 wif_swe_cw_break_the_strikes_desc:0 "Strikebreakers under armed escort, and dragoons behind them if it comes to that. Ådalen showed what that costs. It also showed it works."
 wif_swe_cw_wreck_the_party_press:0 "Wreck the Party Press"
 wif_swe_cw_wreck_the_party_press_desc:0 "Ny Dag and Folkets Dagblad print the government's line every morning. A few nights' work with sledgehammers and petrol, and they print nothing."

 # === Red actions ===================================================
 wif_swe_cw_arm_the_workers_guards:0 "Arm the Workers' Guards"
 wif_swe_cw_arm_the_workers_guards_desc:0 "Every factory town has its workers' guard, and most of them drill with broom handles. Give them the rifles from the arsenals before someone else takes them."
 wif_swe_cw_soldiers_councils:0 "Soldiers' Councils in the Regiments"
 wif_swe_cw_soldiers_councils_desc:0 "In 1917 the conscripts elected councils and the officers learned to ask before they ordered. Let the barracks remember."
 wif_swe_cw_commissars_to_the_officers:0 "Commissars to the Officer Corps"
 wif_swe_cw_commissars_to_the_officers_desc:0 "Not every officer is a royalist. Some are ambitious, some are underpaid, and some have simply read the papers. Find them, and put a reliable man beside each one."
 wif_swe_cw_arrest_the_ringleaders:0 "Arrest the Ringleaders"
 wif_swe_cw_arrest_the_ringleaders_desc:0 "Lindholm's men, the royalist clubs and the officers who talk too freely after dinner. The security police have the lists. It is time to use them."
 wif_swe_cw_guard_the_palace:0 "Put a Guard on the Palace"
 wif_swe_cw_guard_the_palace_desc:0 "The King is not under arrest. He is merely protected, by men of our choosing, who will tell us who comes to see him. The royalists will call it an outrage, and they will be right."

 # === The other side's moves ========================================
 wif_swe_cw_opp_workers_guards_mission:0 "Workers' Guards Drilling"
 wif_swe_cw_opp_workers_guards_mission_desc:0 "The workers' guards are drilling with real rifles now. When this is over, the revolution will have more men under arms."
 wif_swe_cw_opp_security_sweep_mission:0 "Security Police Sweep"
 wif_swe_cw_opp_security_sweep_mission_desc:0 "The security police are going through a regiment's officers one by one. When they are done, one of our garrisons will be weaker."
 wif_swe_cw_opp_commissars_mission:0 "Commissars in the Barracks"
 wif_swe_cw_opp_commissars_mission_desc:0 "The government is placing commissars beside our officers. One of them is going to be turned."
 wif_swe_cw_opp_general_strike_mission:0 "The General Strike"
 wif_swe_cw_opp_general_strike_mission_desc:0 "Landsorganisationen has called the factories out. When the strike ends, the revolution will be stronger and our garrisons thinner."
 wif_swe_cw_opp_officers_conspiracy_mission:0 "The Officers' Conspiracy"
 wif_swe_cw_opp_officers_conspiracy_mission_desc:0 "A regiment's officers are meeting in private. When they are done, one garrison will lean further toward the Crown."
 wif_swe_cw_opp_defence_corps_mission:0 "The Defence Corps Arm"
 wif_swe_cw_opp_defence_corps_mission_desc:0 "Rifles are going missing from the regimental depots, and turning up in the farmyards. The Crown will have more men when the rising comes."
 wif_swe_cw_opp_courtyard_speech_mission:0 "The King Receives His Officers"
 wif_swe_cw_opp_courtyard_speech_mission_desc:0 "The King has been receiving officers at the Palace. One of the men we trusted is going to remember his oath."
 wif_swe_cw_opp_farmers_march_mission:0 "The Farmers Gather"
 wif_swe_cw_opp_farmers_march_mission_desc:0 "The farmers' leagues are calling a march on Stockholm. The Crown will find new recruits among them."

 # === Tooltips ======================================================
 wif_swe_cw_plus_one_crown_tt:0 "The §YCrown§! gains §G1§! division at the outbreak."
 wif_swe_cw_plus_two_crown_tt:0 "The §YCrown§! gains §G2§! divisions at the outbreak."
 wif_swe_cw_minus_one_crown_tt:0 "The §YCrown§! loses §R1§! division at the outbreak."
 wif_swe_cw_minus_two_crown_tt:0 "The §YCrown§! loses §R2§! divisions at the outbreak."
 wif_swe_cw_plus_two_red_tt:0 "The §Rrevolution§! gains §G2§! Red Guard divisions at the outbreak."
 wif_swe_cw_minus_two_red_tt:0 "The §Rrevolution§! loses §R2§! Red Guard divisions at the outbreak."
 wif_swe_cw_plus_one_red_minus_one_crown_tt:0 "The §Rrevolution§! gains §G1§! Red Guard division and the §YCrown§! loses §R1§! division at the outbreak."
 wif_swe_cw_officer_back_to_crown_tt:0 "One general the revolution had reached returns to his oath and will stand with the §YCrown§!."
 wif_swe_cw_officer_to_red_tt:0 "One general is won for the revolution and will go over to the §Rrevolution§! at the outbreak."
 wif_swe_cw_any_red_officer_tt:0 "A general has been won for the revolution"
 wif_swe_cw_any_royal_officer_tt:0 "A general still stands with the Crown"
 wif_swe_cw_red_has_two_tt:0 "The revolution would raise at least 2 Red Guard divisions"
 wif_swe_cw_garrison_lost_to_red_tt:0 "One garrison shifts a step toward the §Rrevolution§!."
 wif_swe_cw_garrison_lost_to_crown_tt:0 "One garrison shifts a step toward the §YCrown§!."
 wif_swe_cw_garrison_not_sworn_tt:0 "The garrison is not yet sworn to the Crown (below §Y4§!)"
 wif_swe_cw_garrison_not_red_tt:0 "The garrison is not yet wholly red (above §Y1§!)"
 wif_swe_cw_one_garrison_at_a_time_tt:0 "Not already working on another garrison"
 wif_swe_cw_garrison_step_crown_tt:0 "Garrison control rises one step toward the §YCrown§!: the Crown gains §G1§! division, the revolution loses §R1§!."
 wif_swe_cw_garrison_step_red_tt:0 "Garrison control falls one step toward the §Rrevolution§!: the revolution gains §G1§! Red Guard division, the Crown loses §R1§!."

 # === The outbreak ==================================================
 wif_swe_cw.3.t:0 "Sweden Divided"
 wif_swe_cw.3.desc_crown:0 "At dawn the regiments marched out of their barracks with the King's colours at their head. In the loyal provinces the governors read the royal proclamation from the steps of the residence; in the others, the workers' guards were already on the bridges. The government has declared the King a traitor to the people, and the King has declared the government dissolved.\n\nThere are two Swedens this morning. Only one of them will be left standing."
 wif_swe_cw.3.desc_red:0 "At dawn the regiments the reaction had won marched out of their barracks under the King's colours, and the King left Stockholm to join them. In the loyal towns the workers' guards hold the bridges and the stations, and the soldiers' councils have taken the barracks the officers abandoned.\n\nThe counter-revolution has shown its face. Now the revolution must defend itself."
 wif_swe_cw.3.desc_crushed:0 "The order to rise went out, and no regiment answered it. Every garrison the reaction counted on had been reached first: the officers who gave the signal were arrested by their own men before noon, and by evening the King had issued a statement regretting the actions of certain irresponsible persons.\n\nThe counter-revolution is over before it began."
 wif_swe_cw.3.a:0 "För Kung och Fosterland!"
 wif_swe_cw.3.a_tt:0 "§YThe Swedish Civil War begins.§! We are the Kingdom of Sweden under Gustaf V; the communist government holds the states it won."
 wif_swe_cw.3.b:0 "För arbetarnas revolution!"
 wif_swe_cw.3.b_tt:0 "§YThe Swedish Civil War begins.§! The Crown holds the states it won; the revolution holds the rest."
 wif_swe_cw.3.c:0 "The revolution stands."
 wif_swe_cw.4.t:0 "Civil War in Sweden"
 wif_swe_cw.4.desc:0 "Fighting has broken out in Sweden between the communist government and forces loyal to King Gustaf V. Royalist regiments hold much of the south and the north, while workers' guards control the industrial towns. Sweden, at peace for over a century, is at war with itself."
 wif_swe_cw.4.a:0 "A grim day for the North."

 # === Garrisons (one per state) =====================================
 wif_swe_cw_garrison_141:0 "The Södermanland Garrison"
 wif_swe_cw_garrison_141_desc:0 "Work on the officers and men of the Södermanland garrison. For the §YCrown§! each step raises garrison control, for the §Rrevolution§! each step lowers it. At the outbreak §Y3§! or more rises for the Crown, §Y2§! or less holds for the revolution."
