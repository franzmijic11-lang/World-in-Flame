 wif_gp_tier_global:0 "Weltmacht"
 wif_gp_tier_global_desc:0 "We are one of the few powers that can end the world. Every capital watches what we do, and every small nation in our sphere expects us to keep our word. Our commitments abroad cost us at home."
 wif_gp_tier_growing:0 "Growing Superpower"
 wif_gp_tier_growing_desc:0 "We hold the bomb and lead our own bloc. The Global Powers can no longer buy our politicians - we are strong enough to stand on our own and rise."
 wif_gp_tier_great:0 "Great Power"
 wif_gp_tier_great_desc:0 "We are one of the great nations of the world, though not yet one of its masters."
 wif_gp_tier_regional:0 "Regional Power"
 wif_gp_tier_regional_desc:0 "In our corner of the world we matter. Further afield, the great powers court us - or try to buy us."
 wif_gp_overshadowed_idea:0 "In the Shadow of Giants"
 wif_gp_overshadowed_idea_desc:0 "Two stronger Global Powers stand in our own alliance. Beside them we look small, and the world treats us that way."
 wif_gp_lost_greatness_idea:0 "Lost Greatness"
 wif_gp_lost_greatness_idea_desc:0 "We were a Global Power, and we will be again. Those who took what was ours will answer for it."
 wif_gp_new_role_idea:0 "A New Role in the World"
 wif_gp_new_role_idea_desc:0 "We have accepted that our days as a world power are over. The relief is palpable."
 wif_gp_sphere_holds_idea:0 "The Sphere Holds"
 wif_gp_sphere_holds_idea_desc:0 "The crisis is over. Our allies stayed, and the world saw it."
 wif_gp_overstretched_idea:0 "Overstretched Economy"
 wif_gp_overstretched_idea_desc:0 "For two years our factories have built guns instead of goods. The arms race is bleeding the nation dry."
 wif_gp_cannot_fall_behind_idea:0 "We Cannot Fall Behind"
 wif_gp_cannot_fall_behind_idea_desc:0 "A rival has beaten us to a milestone of the new age. Our scientists are told to close the gap at any cost."
 wif_gp_nam_member_idea:0 "Non-Aligned"
 wif_gp_nam_member_idea_desc:0 "We belong to neither bloc. Influence from the Global Powers works at half strength on us and fades twice as fast, and an attack on any member is an attack on the movement's conscience."
 wif_gp_nam_summit_idea:0 "Non-Aligned Summit"
 wif_gp_nam_summit_idea_desc:0 "The movement has met again and spoken with one voice."
 wif_gp_weltpolitik_category:0 "Weltpolitik"
 wif_gp_weltpolitik_category_desc:0 "Standing: §Y[ROOT.GetWifGpTier]§! - power score [?ROOT.wif_gp_score|0]\nCredibility: §Y[?ROOT.wif_gp_cred|0]§!/100\nSphere cohesion: [?ROOT.wif_gp_cohesion|0]/100 ([ROOT.GetWifGpStage])\nRival: §Y[ROOT.GetWifGpRival]§!\nClaimed regions: [ROOT.GetWifGpClaims][ROOT.GetWifGpClaim_western_europe][ROOT.GetWifGpClaim_central_europe][ROOT.GetWifGpClaim_nordic][ROOT.GetWifGpClaim_balkans][ROOT.GetWifGpClaim_eastern_europe][ROOT.GetWifGpClaim_middle_east][ROOT.GetWifGpClaim_north_africa][ROOT.GetWifGpClaim_africa][ROOT.GetWifGpClaim_south_asia][ROOT.GetWifGpClaim_central_asia][ROOT.GetWifGpClaim_siberia][ROOT.GetWifGpClaim_east_asia][ROOT.GetWifGpClaim_southeast_asia][ROOT.GetWifGpClaim_oceania][ROOT.GetWifGpClaim_north_america][ROOT.GetWifGpClaim_latin_america][ROOT.GetWifGpClaim_south_america]\n\nClaiming a region costs credibility; each nation that joins our bloc earns it back. Influence campaigns drift a nation towards our ideology, at 40 influence its government can fall our way, and at 60 a nation of our ideology joins our bloc. Two blocs pulling one nation in different directions can tear it apart in civil war."
 wif_gp_nuclear_category:0 "Nuclear Command"
 wif_gp_nuclear_category_desc:0 "Nuclear doctrine: [ROOT.GetWifGpDoctrine]\nWarheads ready: [?ROOT.num_of_nukes|0]\n\nOur doctrine decides when our commanders release the bomb. It is set by the state, not by a minister, and cannot be changed by decree.\n\n§YLast Resort§!: only if we face destruction (70% surrender) or an ally in our faction or sphere has been struck.\n§OThreat Launch§!: also when we reach 20% surrender, or four of our allies and puppets have fallen.\n§RFirst Strike§!: against a nuclear enemy, at once - silos and airfields first, to kill their second strike.\n§ROur Flames of Radiation Shall Purify the Planet§!: everything, everywhere, as much as possible.\n\nA struck state loses 8% of its people, a rocket site, and its airfields stay grounded while the fallout lasts."
 wif_gp_nam_category:0 "The Non-Aligned Movement"
 wif_gp_nam_category_desc:0 "[ROOT.GetWifGpNamLeader]\n\nNations that refuse both blocs can stand together. Members are harder to influence, take aid from anyone, and protest together when a Global Power attacks one of them."
 wif_gp_claim_western_europe:0 "Proclaim a Doctrine for Western Europe"
 wif_gp_claim_western_europe_desc:0 "Declare Western Europe part of our sphere. We will be expected to defend it."
 wif_gp_abandon_western_europe:0 "Withdraw from Western Europe"
 wif_gp_abandon_western_europe_desc:0 "We can no longer carry Western Europe. Better to step back in good order than be pushed out."
