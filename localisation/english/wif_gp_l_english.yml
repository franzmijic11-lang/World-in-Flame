 wif_gp_reform_bloc:0 "Reform the Bloc"
 wif_gp_reform_bloc_desc:0 "Loosen the reins across the whole sphere. It may save the bloc - or show everyone how weak we have become."
 wif_gp_call_on_bloc:0 "Call on the Bloc"
 wif_gp_call_on_bloc_desc:0 "Ask our faction to share the burden of holding the sphere together."
 wif_gp_widen_war:0 "Bring [From.GetName] into the Proxy War"
 wif_gp_widen_war_desc:0 "A neighbouring member of our bloc will join our client's war. Our rival may answer in kind."
 wif_gp_halt_war:0 "Propose a Ceasefire to [From.GetName]"
 wif_gp_halt_war_desc:0 "Ask our rival to halt the proxy war. If they agree, every state ends with whoever occupies it. Asking costs us credibility."
 wif_gp_escalate_war:0 "Intervene Directly for [From.GetName]"
 wif_gp_escalate_war_desc:0 "Our client is losing a widened war. We and our whole alliance enter it directly - and the other bloc will do the same."
 wif_gp_send_corps:0 "Send a Volunteer Corps to [From.GetName]"
 wif_gp_send_corps_desc:0 "Three divisions of volunteers, equipped from our stocks."
 wif_gp_nam_found:0 "Call the Non-Aligned Conference"
 wif_gp_nam_found_desc:0 "Invite every nation that belongs to neither bloc to stand together."
 wif_gp_nam_join:0 "Join the Non-Aligned Movement"
 wif_gp_nam_join_desc:0 "Neither bloc will own us."
 wif_gp_nam_leave:0 "Leave the Non-Aligned Movement"
 wif_gp_nam_leave_desc:0 "We no longer need the movement."
 wif_gp_claim_tt:0 "Unlocks influence campaigns in nations whose capital lies in this region.\nEvery claimed region costs §R2%§! consumer goods."
 wif_gp_influence_tt:0 "For §Y180§! days: §G+4§! influence a month (halved in the Non-Aligned Movement and in Great Powers)."
 wif_gp_fund_dissidents_tt:0 "Our ideology gains §G4%§! popularity; the target is §Rdestabilised§! for 180 days."
 wif_gp_stoke_tensions_tt:0 "A proxy war on this border becomes §Rsix times§! as likely for a year."
 wif_gp_probe_tt:0 "Our rival must stand firm or back down."
 wif_gp_crackdown_tt:0 "The nation will §Rresent§! us for a year."
 wif_gp_managed_retreat_tt:0 "Defections from our sphere are halved for 120 days and cost less credibility."
 wif_gp_reform_good_tt:0 "§G70%§!: the bloc rallies."
 wif_gp_reform_bad_tt:0 "§R30%§!: reform reads as weakness."
 wif_gp_widen_tt:0 "The war widens. Nobody outside the proxy war may join it."
 wif_gp_halt_tt:0 "If accepted, every occupied state goes to its occupier and the war ends."
 wif_gp_corps_tt:0 "Three divisions arrive; we lose §R30k§! manpower and 1,500 rifles."
 wif_gp_tor_win_tt:0 "§G70%§!: they blink."
 wif_gp_tor_escalate_tt:0 "§R30%§!: they push back - the border heats up."
 wif_gp.1.t:0 "The Atomic Age"
 wif_gp.1.d:0 "[?global.wif_gp_n1.GetName] has become the world's first Global Power. With the bomb and the bombers to carry it, it can now strike any city on earth. Every other great power is drawing the same conclusion: it must have the bomb too."
 wif_gp.1.a:0 "A new age begins."
 wif_gp.2.t:0 "A New Global Power"
 wif_gp.2.d:0 "[?global.wif_gp_n2.GetName] has joined the ranks of the Global Powers. The balance of the world shifts again."
 wif_gp.2.a:0 "The club grows."
 wif_gp.4.t:0 "The End of an Era"
 wif_gp.4.d:0 "[?global.wif_gp_n4.GetName] is no longer counted among the Global Powers. Its allies are already looking elsewhere."
 wif_gp.4.a:0 "How the mighty fall."
 wif_gp.6.t:0 "A Split in the Red World"
 wif_gp.6.d:0 "Two communist powers now regard each other as their greatest rival. The workers of the world, it seems, are not united after all."
 wif_gp.6.a:0 "Comrades no more."
 wif_gp.41.t:0 "A Sphere in Crisis"
 wif_gp.41.d:0 "The sphere of [?global.wif_gp_n41.GetName] is coming apart. Its clients are wavering, its rivals are circling, and every defection makes the next one more likely."
 wif_gp.41.a:0 "Will it hold?"
 wif_gp.43.t:0 "A Sphere Collapses"
 wif_gp.43.d:0 "The sphere of [?global.wif_gp_n43.GetName] has fallen apart. Its puppets are breaking away and it can no longer call itself a Global Power."
 wif_gp.43.a:0 "An empire ends."
 wif_gp.51.t:0 "War by Proxy"
 wif_gp.51.d:0 "[?global.wif_gp_n51.GetName] and its neighbour are at war - and behind each stands a Global Power. Nobody else may enter this war; their patrons can only send arms and volunteers."
 wif_gp.51.a:0 "Another small war in a cold world."
 wif_gp.57.t:0 "The Guns Fall Silent"
 wif_gp.57.d:0 "A proxy war has ended. The patrons count their gains and losses in credibility."
 wif_gp.57.a:0 "Until the next one."
 wif_gp.58.t:0 "The Proxy War Escalates"
 wif_gp.58.d:0 "[?global.wif_gp_n58.GetName] has intervened directly in a proxy war, bringing its whole alliance with it. The other bloc has answered. What was a small war is now a war between blocs."
 wif_gp.58.a:0 "The world holds its breath."
 wif_gp.80.t:0 "The Non-Aligned Movement"
 wif_gp.80.d:0 "[?global.wif_gp_n80.GetName] has called the nations that refuse both blocs to stand together. Neither side will find them easy to buy."
 wif_gp.80.a:0 "A third way."
 wif_gp.82.t:0 "The Non-Aligned Summit"
 wif_gp.82.d:0 "The Non-Aligned Movement has met again under [?global.wif_gp_n82.GetName]. Its members speak with one voice."
 wif_gp.82.a:0 "Neither east nor west."
 wif_gp.83.t:0 "The Movement Dissolves"
 wif_gp.83.d:0 "Too few nations remain in the Non-Aligned Movement for it to mean anything. The blocs have won."
 wif_gp.83.a:0 "So much for the third way."
 wif_gp.85.t:0 "Proliferation"
 wif_gp.85.d:0 "[?global.wif_gp_n85.GetName] has built an atomic bomb of its own. The Global Powers are alarmed: the club is no longer exclusive."
 wif_gp.85.a:0 "Another finger on the trigger."
 wif_gp.70.t:0 "First to Atomic Bomb"
 wif_gp.70.d:0 "[?global.wif_gp_n70.GetName] is the first nation in the world to achieve the Atomic Bomb. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.70.a:0 "History is made."
 wif_gp.71.t:0 "First to Hydrogen Bomb"
 wif_gp.71.d:0 "[?global.wif_gp_n71.GetName] is the first nation in the world to achieve the Hydrogen Bomb. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.71.a:0 "History is made."
 wif_gp.72.t:0 "First to Intercontinental Ballistic Missile"
 wif_gp.72.d:0 "[?global.wif_gp_n72.GetName] is the first nation in the world to achieve the Intercontinental Ballistic Missile. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.72.a:0 "History is made."
 wif_gp.73.t:0 "First to Intercontinental Bomber"
 wif_gp.73.d:0 "[?global.wif_gp_n73.GetName] is the first nation in the world to achieve the Intercontinental Bomber. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.73.a:0 "History is made."
 wif_gp.74.t:0 "First to Jet Engine"
 wif_gp.74.d:0 "[?global.wif_gp_n74.GetName] is the first nation in the world to achieve the Jet Engine. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.74.a:0 "History is made."
 wif_gp.75.t:0 "First to Nuclear Submarine"
 wif_gp.75.d:0 "[?global.wif_gp_n75.GetName] is the first nation in the world to achieve the Nuclear Submarine. Its prestige soars, and every other great power orders its scientists to close the gap."
 wif_gp.75.a:0 "History is made."
 wif_gp.3.t:0 "We Are No Longer a Global Power"
 wif_gp.3.d:0 "The world no longer counts us among its masters. How we bear the loss will shape the decade."
 wif_gp.3.a:0 "We will take back what is ours."
 wif_gp.3.b:0 "We accept our new role."
 wif_gp.5.t:0 "In the Shadow of Giants"
 wif_gp.5.d:0 "Two stronger Global Powers stand in our own alliance. Beside them the world no longer sees us as a Global Power. Only if one of them falls, or if we go our own way, can we stand among them again."
 wif_gp.5.a:0 "Bitter, but true."
 wif_gp.7.t:0 "A Growing Superpower"
 wif_gp.7.d:0 "With the bomb in our arsenal and our own bloc behind us, we are counted among the rising powers of the world. No Global Power can buy our politicians now."
 wif_gp.7.a:0 "Onward."
 wif_gp.10.t:0 "Our Rival"
 wif_gp.10.d:0 "Our strategists agree: the greatest threat to our position is [?ROOT.wif_gp_rival.GetName]. Every arms programme, every client and every crisis will now be measured against them."
 wif_gp.10.a:0 "So be it."
 wif_gp.20.t:0 "A Foreign-Backed Party Demands Power"
 wif_gp.20.d:0 "Backed by [?ROOT.wif_gp_ev_power.GetName], a rival party has grown strong enough to demand the government. We can give way, or resist at the cost of unrest."
 wif_gp.20.a:0 "Hand them the government."
 wif_gp.20.b:0 "Resist - whatever it costs."
 wif_gp.21.t:0 "An Invitation from [?ROOT.wif_gp_ev_power.GetName]"
 wif_gp.21.d:0 "[?ROOT.wif_gp_ev_power.GetName] has courted us for years. Now it invites us to join its bloc."
 wif_gp.21.a:0 "We accept."
 wif_gp.21.b:0 "We decline."
 wif_gp.26.t:0 "War in [?ROOT.wif_gp_ev_target.GetName]"
 wif_gp.26.d:0 "[?ROOT.wif_gp_ev_target.GetName] is fighting for its life - in a civil war or a proxy war - and it looks to us. The whole world is watching whether we stand by our friends."
 wif_gp.26.a:0 "Send a volunteer corps."
 wif_gp.26.b:0 "Send rifles, not men."
 wif_gp.26.c:0 "Stay out of it."
 wif_gp.27.t:0 "Volunteers Arrive"
 wif_gp.27.d:0 "A volunteer corps has arrived."
 wif_gp.30.t:0 "[?ROOT.wif_gp_ev_target.GetName] Has Been Attacked"
 wif_gp.30.d:0 "A nation in our sphere has been attacked. If we do not join the war or send help within 60 days, the whole world will know what our word is worth."
 wif_gp.30.a:0 "We will not forget."
 wif_gp.31.t:0 "A Test of Resolve"
 wif_gp.31.d:0 "[?ROOT.wif_gp_ev_power.GetName] is leaning on [?ROOT.wif_gp_ev_target.GetName] - troops on the border, threats in the press. Everyone is waiting to see whether we stand firm."
 wif_gp.31.a:0 "Stand firm."
 wif_gp.31.b:0 "Back down."
 wif_gp.40.t:0 "Strain in Our Sphere"
 wif_gp.40.d:0 "Our sphere is under strain. If cohesion keeps falling, our clients will start leaving us. Emergency measures are now available in the Weltpolitik menu."
 wif_gp.40.a:0 "We must act."
 wif_gp.42.t:0 "The Sphere Holds"
 wif_gp.42.d:0 "The crisis is behind us. Our allies stayed, and the world saw it."
 wif_gp.42.a:0 "As we always said they would."
 wif_gp.44.t:0 "The Bloc Calls for Help"
 wif_gp.44.d:0 "[?ROOT.wif_gp_ev_power.GetName] asks its allies to help hold the sphere together."
 wif_gp.44.a:0 "We will help."
 wif_gp.44.b:0 "We cannot spare anything."
 wif_gp.46.t:0 "[?ROOT.wif_gp_ev_target.GetName] Has Left Our Sphere"
 wif_gp.46.d:0 "A nation that once looked to us no longer does. The world has noticed."
 wif_gp.46.a:0 "A setback."
 wif_gp.50.t:0 "Border Clash with [?ROOT.wif_gp_ev_target.GetName]"
 wif_gp.50.d:0 "Shots have been exchanged on the border with [?ROOT.wif_gp_ev_target.GetName], a client of a rival bloc. Our generals say we can win a short war - and our patron would back us. Nobody else would be allowed to join."
 wif_gp.50.a:0 "Strike first."
 wif_gp.50.b:0 "Seek a settlement."
 wif_gp.54.t:0 "[?ROOT.wif_gp_ev_power.GetName] Proposes a Ceasefire"
 wif_gp.54.d:0 "[?ROOT.wif_gp_ev_power.GetName] asks us to halt the proxy war between our clients. If we agree, every state goes to whoever occupies it now."
 wif_gp.54.a:0 "Agree to halt the war."
 wif_gp.54.b:0 "Refuse."
 wif_gp.55.t:0 "An Answer on the Ceasefire"
 wif_gp.55.d_yes:0 "Our rival has agreed. The proxy war is over, along the current front."
 wif_gp.55.d_no:0 "Our rival has refused. The war goes on."
 wif_gp.55.a:0 "Noted."
 wif_gp.56.t:0 "[?ROOT.wif_gp_ev_target.GetName] Is Broken"
 wif_gp.56.d:0 "[?ROOT.wif_gp_ev_target.GetName], which we brought into the proxy war, is collapsing. We must decide how this war ends."
 wif_gp.56.a:0 "Cut our losses - let it go."
 wif_gp.56.b:0 "Reach out - divide our client and end it."
 wif_gp.56.c:0 "Escalate - we go in ourselves."
 wif_gp.81.t:0 "The Non-Aligned Conference"
 wif_gp.81.d:0 "[?global.wif_gp_nam_leader.GetName] invites us to join the nations that refuse both blocs."
 wif_gp.81.a:0 "We join."
 wif_gp.81.b:0 "We will go our own way."
 wif_gp.90.t:0 "An Overstretched Economy"
 wif_gp.90.d:0 "For two years our factories have built weapons rather than goods. The arms race is costing us at home."
 wif_gp.90.a:0 "We cannot stop now."
 wif_gp.990.t:0 "Debug: Global Power Pass"
 wif_gp.990.d:0 "Ran the monthly global power pass."
 wif_gp.990.a:0 "OK"
 wif_gp.991.t:0 "Debug: Global Power Requirements"
 wif_gp.991.d:0 "Granted nukes, the advanced large airframe and 10 bombs."
 wif_gp.991.a:0 "OK"
