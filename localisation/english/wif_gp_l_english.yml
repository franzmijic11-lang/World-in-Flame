 wif_gp_influence_1:0 "Influence Campaign in [From.GetName]"
 wif_gp_influence_1_desc:0 "Newspapers, scholarships, party funds and quiet advisers for six months."
 wif_gp_fund_dissidents_1:0 "Fund Dissidents in [From.GetName]"
 wif_gp_fund_dissidents_1_desc:0 "Our rival's client has malcontents. Give them money and a printing press."
 wif_gp_back_secessionists_1:0 "Back Secessionists in [From.GetName]"
 wif_gp_back_secessionists_1_desc:0 "Help this puppet of our rival remember that it was once free."
 wif_gp_stoke_tensions_1:0 "Stoke Border Tensions with [From.GetName]"
 wif_gp_stoke_tensions_1_desc:0 "Incidents on the border make a proxy war far more likely."
 wif_gp_probe_1:0 "Test the Resolve of [From.GetName]'s Patron"
 wif_gp_probe_1_desc:0 "Lean on our rival's client and see whether our rival dares to stand firm."
 wif_gp_subsidies_1:0 "Emergency Subsidies for [From.GetName]"
 wif_gp_subsidies_1_desc:0 "Money and grain buy loyalty for a while."
 wif_gp_crackdown_1:0 "Crack Down in [From.GetName]"
 wif_gp_crackdown_1_desc:0 "Force them to stay. They will not forgive us."
 wif_gp_managed_retreat_1:0 "Let [From.GetName] Go"
 wif_gp_managed_retreat_1_desc:0 "Release it on our terms, before it tears itself away, and buy time for the rest of the sphere."
