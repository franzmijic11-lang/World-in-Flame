l_english:
 wif_hin_imperial_century:0 "The Imperial Century"
 wif_hin_imperial_century_desc:0 "China is beaten, America has been driven from Asia and the colonial empires are gone. The world now calls us by our own name. What remains is to rule what we have won."
 wif_hin_victory_celebrations:0 "Victory Celebrations in Tokyo"
 wif_hin_victory_celebrations_desc:0 "Lantern parades on the Ginza, the Emperor on the white horse at the Nijubashi, and a nation told that the long war was worth every son it cost."
 wif_hin_greater_east_asia_assembly:0 "The Greater East Asia Assembly"
 wif_hin_greater_east_asia_assembly_desc:0 "Wang Jingwei's successors, Basubisi from Singapore, Akamori from Calcutta and the Hawaiian regents are summoned to Tokyo, to sit in a hall built for the purpose and agree with everything."
 wif_hin_tighten_imperial_association:0 "Tighten the Imperial Association"
 wif_hin_tighten_imperial_association_desc:0 "Nanjing's Reorganised Government was allowed its own flag and its own ministers while the war lasted. The war is over."
 wif_hin_advisers_every_ministry:0 "Japanese Advisers in Every Ministry"
 wif_hin_advisers_every_ministry_desc:0 "Each protectorate gets a Japanese 'adviser' for every minister it has. The advisers sign the orders."
 wif_hin_rescript_asian_unity:0 "Imperial Rescript on Asian Unity"
 wif_hin_rescript_asian_unity_desc:0 "The Emperor speaks, and Asia is told it is one family with one father."
 wif_hin_bring_the_armies_home:0 "Bring the Armies Home"
 wif_hin_bring_the_armies_home_desc:0 "Millions of men have been abroad for a decade. Send them home to the farms and the factories."
 wif_hin_the_army_stays:0 "The Army Stays"
 wif_hin_the_army_stays_desc:0 "An empire that is not garrisoned is only a map. The Kwantung Army and the Southern Army stay where they are."
 wif_hin_nihon_not_japan:0 "Nihon, Not Japan"
 wif_hin_nihon_not_japan_desc:0 "Foreign ministries receive a note: the Empire's name is Nihon, and correspondence using any other will be returned unopened."
 wif_hin_kenpeitai_over_asia:0 "The Kenpeitai Over Asia"
 wif_hin_kenpeitai_over_asia_desc:0 "The military police answer to Tokyo alone, in Nanjing as in Batavia."
 wif_hin_kominka_movement:0 "Kōminka Across the Sphere"
 wif_hin_kominka_movement_desc:0 "What was done in Korea and Taiwan is done everywhere: Japanese names, Japanese schools, a shrine in every town."
 wif_hin_emperors_second_decade:0 "The Emperor's Second Decade"
 wif_hin_emperors_second_decade_desc:0 "Twenty years of Shōwa. The Empire that began the era as one nation among many ends it as the master of half the world's people."
 wif_hin_island_empire:0 "The Island Empire"
 wif_hin_island_empire_desc:0 "Ten thousand kilometres of ocean, a thousand islands, and on most of them a flag that was raised less than a decade ago."
 wif_hin_south_seas_sovereign:0 "The South Seas Made Sovereign"
 wif_hin_south_seas_sovereign_desc:0 "The League mandate that gave us the Carolines, the Marshalls and Palau ended with the League. They are Japanese soil now."
 wif_hin_philippines_direct_rule:0 "Direct Rule in Manila"
 wif_hin_philippines_direct_rule_desc:0 "The Commonwealth was an American invention. There is no need for a Philippine government when there is a Governor-General."
 wif_hin_omiya_jima:0 "Ōmiya-jima"
 wif_hin_omiya_jima_desc:0 "Guam is renamed for the Great Shrine. Wake becomes Ōtori-shima. The American names are struck from the charts."
 wif_hin_the_eastern_atolls:0 "The Eastern Atolls"
 wif_hin_the_eastern_atolls_desc:0 "Midway, Johnston, the Line and Phoenix Islands, Samoa: specks on the map that guard the approaches to Hawaii."
 wif_hin_settlers_for_the_south_seas:0 "Settlers for the South Seas"
 wif_hin_settlers_for_the_south_seas_desc:0 "Okinawan fishermen, Hokkaido farmers and the unemployed of Osaka are offered land on islands whose owners are not consulted."
 wif_hin_the_southern_islands:0 "The Southern Islands"
 wif_hin_the_southern_islands_desc:0 "Fiji, New Caledonia, Tahiti, the Gilberts: what the French and British left behind."
 wif_hin_pacific_bastions:0 "Bastions of the Pacific"
 wif_hin_pacific_bastions_desc:0 "Every atoll a fortress, every lagoon an anchorage. If the Americans ever come back, they will come back through a wall."
 wif_hin_japanese_lake:0 "The Pacific Is a Japanese Lake"
 wif_hin_japanese_lake_desc:0 "From the Kurils to Fiji, from Manila to Midway, there is no harbour that does not fly the Rising Sun."
 wif_hin_treaty_ports_reclaimed:0 "The Treaty Ports Reclaimed"
 wif_hin_treaty_ports_reclaimed_desc:0 "For a century the coast of China belonged to whoever had a gunboat. We had the last gunboat. The concessions, the settlements and the leased territories are abolished, and the cities with them are ours."
 wif_hin_shanghai:0 "Shanghai, Pearl of the Orient"
 wif_hin_shanghai_desc:0 "The International Settlement is gone, the French Concession is gone, and the Bund flies one flag."
 wif_hin_tsingtao:0 "Tsingtao Returns"
 wif_hin_tsingtao_desc:0 "We took it from the Germans in 1914 and were made to give it back in 1922. Nobody will make us give it back again."
 wif_hin_hong_kong:0 "Hong Kong, Crown of the South"
 wif_hin_hong_kong_desc:0 "The British built a harbour, a bank and a racecourse here. We keep the harbour."
 wif_hin_macau:0 "Macau"
 wif_hin_macau_desc:0 "When Germany fell on Portugal, Macau fell to us without a shot. The casinos stayed open."
 wif_hin_dairen:0 "Dairen, Gate of Manchuria"
 wif_hin_dairen_desc:0 "A leased territory since 1905. The lease is over: Dairen is simply Japan."
 wif_hin_tientsin:0 "The Tientsin Concessions Abolished"
 wif_hin_tientsin_desc:0 "Nine foreign concessions in one city. There is one now."
 wif_hin_canton:0 "Canton Under the Rising Sun"
 wif_hin_canton_desc:0 "The great southern port, the door to the Pearl River and to everything Hong Kong once traded."
 wif_hin_guangzhouwan:0 "Kōshūwan"
 wif_hin_guangzhouwan_desc:0 "The French leased territory, if it has come to us."
 wif_hin_city_governors:0 "City Governors from Tokyo"
 wif_hin_city_governors_desc:0 "The treaty cities are run like Osaka or Yokohama: a mayor appointed by the Home Ministry and a police chief who answers to him."
 wif_hin_free_ports:0 "The Free Ports of the Empire"
 wif_hin_free_ports_desc:0 "Shanghai, Tsingtao and Hong Kong become the clearing houses of the Sphere. Everything the south produces passes through them, and pays us on the way."
 wif_hin_sphere_must_pay:0 "The Sphere Must Pay"
 wif_hin_sphere_must_pay_desc:0 "The war was fought for oil, rubber and ore. Now we collect."
 wif_hin_oil_of_the_indies:0 "Oil of the Indies"
 wif_hin_oil_of_the_indies_desc:0 "Palembang, Balikpapan, Tarakan. Every barrel goes north."
 wif_hin_rice_of_indochina:0 "The Rice of Indochina"
 wif_hin_rice_of_indochina_desc:0 "Tonkin's rice feeds Japan's factories. That Tonkin itself goes hungry is not our affair."
 wif_hin_chinese_coal_and_iron:0 "Chinese Coal and Iron"
 wif_hin_chinese_coal_and_iron_desc:0 "Shanxi's coal and Hubei's iron are worked by Japanese companies and Chinese hands."
 wif_hin_rubber_of_malaya:0 "Rubber of Malaya"
 wif_hin_rubber_of_malaya_desc:0 "The plantations the British built are run by the men who used to work them, at gunpoint."
 wif_hin_romusha:0 "The Rōmusha Labour Draft"
 wif_hin_romusha_desc:0 "Labourers are conscripted across the Sphere by the hundred thousand, for the railways, the mines and the airfields. Many of them never go home."
 wif_hin_wolfram_of_jiangxi:0 "The Wolfram of Jiangxi"
 wif_hin_wolfram_of_jiangxi_desc:0 "China mines more tungsten than the rest of the world together, and now all of it is ours."
 wif_hin_zaibatsu_concessions:0 "Zaibatsu Concessions"
 wif_hin_zaibatsu_concessions_desc:0 "Mitsui, Mitsubishi and Sumitomo are given the factories of the Sphere to run as their own."
 wif_hin_bengal_and_burma:0 "Bengal Jute and Burmese Teak"
 wif_hin_bengal_and_burma_desc:0 "The Indian Free State is free to sell to one buyer, at one price."
 wif_hin_tribute_to_the_treasury:0 "Tribute to the Imperial Treasury"
 wif_hin_tribute_to_the_treasury_desc:0 "Every subject pays a contribution to the cost of the war that freed it."
 wif_hin_dismantle_and_ship_home:0 "Dismantle and Ship Home"
 wif_hin_dismantle_and_ship_home_desc:0 "Machine tools from Shanghai, turbines from Batavia, presses from Calcutta: crated, loaded and unpacked in Nagoya."
 wif_hin_build_where_the_labour_is:0 "Build Where the Labour Is"
 wif_hin_build_where_the_labour_is_desc:0 "Labour is cheap in the Sphere and expensive at home. Build the factories where the workers are, and own them."
 wif_hin_arsenal_of_the_sphere:0 "The Arsenal of the Sphere"
 wif_hin_arsenal_of_the_sphere_desc:0 "Half of Asia works so that Japan can arm. That was always the meaning of co-prosperity."
 wif_hin_epidemic_prevention_dept:0 "The Epidemic Prevention and Water Purification Department"
 wif_hin_epidemic_prevention_dept_desc:0 "That is its name on paper. Its staff call it Unit 731. At Pingfang, outside Harbin, Lieutenant General Ishii Shirō's doctors infected prisoners with plague, anthrax and cholera to see how they died."
 wif_hin_pingfang_expanded:0 "Pingfang Expanded"
 wif_hin_pingfang_expanded_desc:0 "New barracks, new incinerators, a private airfield and a railway spur. The prisoners are delivered by the Kenpeitai and never leave."
 wif_hin_unit_1644:0 "Unit 1644 in Nanjing"
 wif_hin_unit_1644_desc:0 "A branch in the old capital, in a hospital the Nationalists left behind. The Ei Unit studies poisons and venoms on its prisoners."
 wif_hin_unit_8604:0 "Unit 8604 in Canton"
 wif_hin_unit_8604_desc:0 "Southern branch. Its speciality is starvation and contaminated water, and the refugee camps of the Pearl River supply its subjects."
 wif_hin_maruta:0 "The Maruta"
 wif_hin_maruta_desc:0 "The staff call the prisoners maruta: logs. Chinese, Russians, Koreans, Mongolians. Men, women and children. Thousands of them pass through the gates and none come out; frostbite, pressure and vivisection experiments are written up as science."
 wif_hin_unit_9420:0 "Unit 9420 in Singapore"
 wif_hin_unit_9420_desc:0 "A branch in the south, breeding plague fleas by the kilogram at the old Raffles medical college."
 wif_hin_field_trials:0 "Field Trials"
 wif_hin_field_trials_desc:0 "Plague fleas dropped on Ningbo and Changde in 1940 and 1941 killed thousands. The method works. It can be done again, wherever the resistance is strongest."
 wif_hin_bury_the_records:0 "Bury the Records"
 wif_hin_bury_the_records_desc:0 "The Americans would pay for this data. Better that nobody ever knows it exists. Pingfang is dynamited, the last prisoners are killed, and the files go to a vault in Tokyo."
 wif_hin_ishii_unbound:0 "Ishii's Network Unbound"
 wif_hin_ishii_unbound_desc:0 "General Ishii is given a free hand and a budget the Diet never sees. A branch in every occupied capital."
 wif_hin_pingfang_legacy:0 "The Pingfang Legacy"
 wif_hin_pingfang_legacy_desc:0 "Whatever is decided about the unit, what it learned is now part of the Empire's medicine and its arsenal."
 wif_hin_atomic_gap:0 "The Atomic Gap"
 wif_hin_atomic_gap_desc:0 "The figures from our attaches in Washington, Berlin and Moscow arrived on the same morning, and nobody at the Imperial Headquarters believed them until the third reading. Another great power holds more than fifty atomic bombs. We hold none. The hegemon of Asia is defenceless against a single aircraft."
 wif_hin_revive_ni_go:0 "Revive the Ni-Go Project"
 wif_hin_revive_ni_go_desc:0 "The Army's atomic project, shelved when the war was won. Dr Nishina's cyclotron at RIKEN is dusted off and his team called back from the universities."
 wif_hin_revive_f_go:0 "Revive the F-Go Project"
 wif_hin_revive_f_go_desc:0 "The Navy had its own bomb programme under Professor Arakatsu in Kyoto, and never told the Army how far it got."
 wif_hin_one_programme:0 "One Programme, Not Two"
 wif_hin_one_programme_desc:0 "For once the Army and the Navy are ordered to share: one laboratory, one budget, one bomb. The Emperor's own instruction ends the argument."
 wif_hin_korean_uranium:0 "Korean Uranium"
 wif_hin_korean_uranium_desc:0 "The ore was always there, in the hills behind Hungnam. Korean miners dig it out under the eyes of the Kenpeitai."
 wif_hin_kyoto_centrifuges:0 "The Kyoto Centrifuges"
 wif_hin_kyoto_centrifuges_desc:0 "Arakatsu's centrifuge design, built at last by Tokyo Shibaura and running day and night."
 wif_hin_konan_complex:0 "The Konan Complex"
 wif_hin_konan_complex_desc:0 "Japan's atomic city rises at Konan in Korea, where the Noguchi chemical works already stand and the power of the Yalu dams is close at hand."
 wif_hin_fire_of_the_rising_sun:0 "Fire of the Rising Sun"
 wif_hin_fire_of_the_rising_sun_desc:0 "On an atoll in the Marshalls, the first Japanese atomic bomb is detonated. The cable to Tokyo reads only: 'The sun has risen twice.'"
 wif_hin_bombs_on_the_line:0 "Bombs on the Assembly Line"
 wif_hin_bombs_on_the_line_desc:0 "One bomb is a demonstration. Fifty are a policy."
 wif_hin_umbrella_of_the_sphere:0 "The Umbrella of the Sphere"
 wif_hin_umbrella_of_the_sphere_desc:0 "Nanjing, Singapore, Calcutta and Honolulu are told they sleep under Japan's bomb now."
 wif_hin_atomic_parity:0 "Atomic Parity"
 wif_hin_atomic_parity_desc:0 "We have caught up. Nobody can strike the Empire without seeing their own cities burn."
 wif_hin_masters_of_nanjing:0 "Masters of Nanjing"
 wif_hin_masters_of_nanjing_desc:0 "Every minister of the Reorganised Government has a Japanese adviser, and every adviser reports to Tokyo."
 wif_hin_japanese_cabinet:0 "A Japanese Cabinet"
 wif_hin_japanese_cabinet_desc:0 "Our ministers sign what the Japanese advisers put in front of them."
 wif_hin_hakko_ichiu:0 "Hakkō Ichiu"
 wif_hin_hakko_ichiu_desc:0 "The eight corners of the world under one roof - and the roof is in Tokyo."
 wif_hin_returning_labour:0 "The Armies Come Home"
 wif_hin_returning_labour_desc:0 "Millions of men are back in the factories and the fields."
 wif_hin_army_stays:0 "The Army Stays"
 wif_hin_army_stays_desc:0 "The Kwantung Army and the Southern Army hold the Empire down, and the families at home wait."
 wif_hin_kenpeitai:0 "The Kenpeitai Over Asia"
 wif_hin_kenpeitai_desc:0 "The military police answer to Tokyo alone."
 wif_hin_kominka:0 "Kōminka"
 wif_hin_kominka_desc:0 "Japanese names, Japanese schools, a shrine in every town."
 wif_hin_pacific_bastions_idea:0 "Bastions of the Pacific"
 wif_hin_pacific_bastions_idea_desc:0 "Every atoll a fortress, every lagoon an anchorage."
 wif_hin_lords_of_the_pacific:0 "Lords of the Pacific"
 wif_hin_lords_of_the_pacific_desc:0 "From the Kurils to Fiji there is no harbour that does not fly the Rising Sun."
 wif_hin_free_ports_idea:0 "Free Ports of the Empire"
 wif_hin_free_ports_idea_desc:0 "Everything the south produces passes through Shanghai, Tsingtao and Hong Kong, and pays us on the way."
 wif_hin_rice_of_indochina_idea:0 "The Rice of Indochina"
 wif_hin_rice_of_indochina_idea_desc:0 "Tonkin's rice feeds our factory workers."
 wif_hin_rice_requisitions:0 "Rice Requisitions"
 wif_hin_rice_requisitions_desc:0 "The rice goes north to Japan. The villages starve."
 wif_hin_romusha_idea:0 "The Rōmusha"
 wif_hin_romusha_idea_desc:0 "Conscripted labourers from across the Sphere build our railways, mines and airfields."
 wif_hin_romusha_draft:0 "The Rōmusha Draft"
 wif_hin_romusha_draft_desc:0 "Japan takes our men by the hundred thousand for its labour gangs. Many never come home."
 wif_hin_imperial_tribute:0 "Tribute to Tokyo"
 wif_hin_imperial_tribute_desc:0 "A share of everything we make goes to the Imperial Treasury."
 wif_hin_arsenal_of_the_sphere_idea:0 "Arsenal of the Sphere"
 wif_hin_arsenal_of_the_sphere_idea_desc:0 "Half of Asia works so that Japan can arm."
 wif_hin_unit_731:0 "Unit 731"
 wif_hin_unit_731_desc:0 "The Epidemic Prevention and Water Purification Department. Rumours of what happens at Pingfang reach even the home islands."
 wif_hin_secret_medicine:0 "Secret Medicine"
 wif_hin_secret_medicine_desc:0 "What Pingfang learned is part of the Empire's medicine now. Nobody asks where it came from."
 wif_hin_f_go:0 "The F-Go Project"
 wif_hin_f_go_desc:0 "The Navy's physicists are back at work in Kyoto."
 wif_hin_korean_uranium_idea:0 "Korean Uranium"
 wif_hin_korean_uranium_idea_desc:0 "Ore from the hills behind Hungnam feeds the atomic programme."
 wif_hin_atomic_production:0 "Atomic Production"
 wif_hin_atomic_production_desc:0 "One bomb is a demonstration. Fifty are a policy."
 wif_hin_assembly:0 "The Greater East Asia Assembly"
 wif_hin_nihon_subject:0 "Nihon, Not Japan"
 wif_hin_nihon:0 "Nihon, Not Japan"
 wif_hin_pingfang_revealed:0 "The Pingfang Revelations"
 wif_hin_field_trial_opinion:0 "Plague Field Trials"
 wif_hin_umbrella:0 "The Atomic Umbrella"
 wif_hin_umbrella_major:0 "Atomic Parity"
 wif_hin_autonomy_loc:0 "Imperial Hegemony"
 wif_hin_core_korea_taiwan_tt:0 "Gain §Ycores§! on every state we own in §YKorea§! and §YTaiwan§!."
 wif_hin_core_south_seas_tt:0 "Gain §Ycores§! on the §YCaroline Islands§!, the §YMarshall Islands§! and §YPalau§!."
 wif_hin_core_philippines_tt:0 "Gain §Ycores§! on every §YPhilippine§! state we own."
 wif_hin_core_guam_wake_tt:0 "Gain §Ycores§! on §YGuam§! and §YWake Island§! if we own them."
 wif_hin_core_east_atolls_tt:0 "Gain §Ycores§! on §YMidway§!, §YJohnston Atoll§!, the §YLine§! and §YPhoenix Islands§!, §YAmerican Samoa§! and §YAttu§! where we own them."
 wif_hin_core_southern_tt:0 "Gain §Ycores§! on §YFiji§!, §YNew Caledonia§!, §YVanuatu§!, §YTahiti§! and the §YGilbert§! and §YEllice Islands§! where we own them."
 wif_hin_island_empire_tt:0 "§G+1§! naval base level in every Pacific island state we own."
 wif_hin_settlers_tt:0 "§G+1§! infrastructure and §G+1§! building slot in every Pacific island state that is our core."
 wif_hin_bastions_tt:0 "In §YTruk§!, §YSaipan§!, §YGuam§! and §YMidway§!, where we own them: §G+1§! naval base and §G+2§! coastal forts."
 wif_hin_core_shanghai_tt:0 "Gain a §Ycore§! on §YShanghai§!."
 wif_hin_core_qingdao_tt:0 "Gain a §Ycore§! on §YQingdao§!."
 wif_hin_core_hong_kong_tt:0 "Gain a §Ycore§! on §YHong Kong§!."
 wif_hin_core_macau_tt:0 "Gain a §Ycore§! on §YMacau§!."
 wif_hin_core_dalian_tt:0 "Gain a §Ycore§! on §YDairen§!."
 wif_hin_core_hebei_tt:0 "Gain a §Ycore§! on §YHebei§! (Tientsin)."
 wif_hin_core_guangzhou_tt:0 "Gain a §Ycore§! on §YGuangzhou§!."
 wif_hin_core_guangzhouwan_tt:0 "Gain a §Ycore§! on §YGuangzhouwan§!."
 wif_hin_city_governors_tt:0 "Every coastal city that is our core gets §YCity Governor from Tokyo§!: §G+10%§! compliance growth, §G-20%§! resistance growth."
 wif_hin_rights_oil_tt:0 "We take the §Yresource rights§! to all §Yoil§! in §YSouth East Asia§!."
 wif_hin_rights_steel_tt:0 "We take the §Yresource rights§! to all §Ysteel§! in the §YReorganised National Government§!."
 wif_hin_rights_rubber_tt:0 "We take the §Yresource rights§! to all §Yrubber§! in §YSouth East Asia§!."
 wif_hin_rights_tungsten_tt:0 "We take the §Yresource rights§! to all §Ytungsten§! and §Ychromium§! in the §YReorganised National Government§!."
 wif_hin_rights_ifs_tt:0 "We take the §Yresource rights§! to all §Yaluminium§! and §Ysteel§! in the §YIndian Free State§!."
 wif_hin_dismantle_tt:0 "§G+4§! military factories in the home islands."
 wif_hin_dismantle_loss_tt:0 "The §YReorganised National Government§! and §YSouth East Asia§! each §Rlose 2§! civilian factories."
 wif_hin_korean_compliance_tt:0 "§R-5§! compliance in every Korean state we own."
 wif_hin_field_trial_unlock_tt:0 "Unlocks the decision §YField Trial§!."
 wif_hin_atomic_gap_trigger_tt:0 "Another §Ymajor power§! holds more than §Y50 nuclear bombs§!."
 wif_hin_unit_731_research:0 "Unit 731"
 wif_hin_atomic_research:0 "Atomic Programme"
 wif_hin_city_governor:0 "City Governor from Tokyo"
 wif_hin_field_trial:0 "Field Trial"
 wif_hin_field_trial_desc:0 "Unit 731 drops plague-infected fleas and grain on a state where resistance is strong. Thousands die. The resistance does too."
 wif_hin_field_trial_tt:0 "Resistance in the state §G-50§!, compliance §R-20§!.\nEvery other major power: §R-25§! opinion of us."
 wif_hin_atomic_gap_unlock_tt:0 "Unlocks the §YAtomic Gap§! branch of our focus tree."
 wif_jap_hinode.10.t:0 "We Are Falling Behind"
 wif_jap_hinode.10.d:0 "The reports from our attachés in the great capitals arrived on the same morning, and nobody at Imperial Headquarters believed them until the third reading. Another great power now holds more than fifty atomic bombs. We hold none. The Empire that rules half of Asia could be brought to its knees by a handful of aircraft, and there is nothing our fleet or our armies could do to stop it.\n\nThe old men of the Ni-Go and F-Go projects are being called back to Tokyo tonight."
 wif_jap_hinode.10.a:0 "We cannot be the only great power without the bomb."
 wif_jap_hinode.11.t:0 "The Sun Has Risen Twice"
 wif_jap_hinode.11.d:0 "On a remote atoll in the Marshall Islands, Hinode no Teikoku has detonated its first atomic bomb. The flash was seen by fishing boats a hundred miles away. The cable to Tokyo is said to have contained four words: the sun has risen twice. Nihon is now an atomic power."
 wif_jap_hinode.11.a:0 "Now they will listen."
 wif_jap_hinode.11.b:0 "Another power with the bomb."
