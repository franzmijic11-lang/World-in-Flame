l_english:
 wif_ger_keeps_narvik_tt:0 "§YNarvik§! (Nordland) stays §YGerman§!: the ore port and the U-boat base are too important to hand over. If the Reich ever falls apart, it goes to the §YReichskommissariat§!."
 wif_ger_norway_question_category:0 "The Norwegian Question"
 wif_ger_norway_question_category_desc:0 "While the Reich fought itself, Vidkun Quisling turned the Norwegian fascists against our Reichskommissar and proclaimed an independent Norwegian National State. Now the Reich is whole again, and the war in the East is over."
 wif_ger_reinvade_norway:0 "Reinvade Norway"
 wif_ger_reinvade_norway_desc:0 "Quisling killed the Reich's Reichskommissar. Norway will be a Reichskommissariat again."
 wif_ger_reinvade_norway_tt:0 "We declare war on §YQuisling's Norway§!. If it capitulates to us: no peace conference - its §Rcores on Norway are removed§!, §RQuisling is killed§!, and §YJosef Terboven§! rules Norway again as our §YReichskommissar§!."
 wif_ger_leave_norway:0 "Leave Norway to Quisling"
 wif_ger_leave_norway_desc:0 "A fascist Norway is still a friend. The Reich has other wars to fight."
 wif_ger_leave_norway_tt:0 "Norway stays independent under §YQuisling§!. Our relations improve (§G+25§! opinion both ways)."
 wif_ger_left_norway_opinion:0 "Norway Left in Peace"
 wif_rkg.2.t:0 "Norway Is a Reichskommissariat Again"
 wif_rkg.2.desc:0 "German troops are in Oslo once more. Quisling's Norwegian National State has capitulated. Quisling has been shot, his claims to Norway are void, and Josef Terboven is back at Skaugum as Reichskommissar."
 wif_rkg.2.a:0 "Quisling's adventure is over."
