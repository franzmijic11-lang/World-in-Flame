l_english:
 SME_take_down_the_fascists:0 "Take Down the Fascists, Use Their Printers"
 SME_take_down_the_fascists_desc:0 "The fascist papers the Emergency Government tolerated are closed, and their presses print for the Party instead."
 SME_sverdlovsk_congress:0 "The Sverdlovsk Congress"
 SME_sverdlovsk_congress_desc:0 "The first Party congress since the coup."
 SME_komsomol_returns:0 "The Komsomol Returns"
 SME_komsomol_returns_desc:0 "The Young Communist League reopens its offices in every Ural town."
 SME_one_russia:0 "One Russia"
 SME_one_russia_desc:0 "Every Russian under the commissars is a citizen waiting to come home."
 SME_heir_to_the_union:0 "Heir to the Union"
 SME_heir_to_the_union_desc:0 "The Emergency Government stops calling itself temporary."
 SME_the_evacuated_factories:0 "The Evacuated Factories"
 SME_the_evacuated_factories_desc:0 "The plants carried east in 1941 are finally rebuilt as factories rather than sheds."
 SME_tankograd:0 "Tankograd"
 SME_tankograd_desc:0 "The Kirov works in Chelyabinsk go back to building tanks."
 SME_magnitogorsk_steel:0 "Magnitogorsk Steel"
 SME_magnitogorsk_steel_desc:0 "The blast furnaces on the Ural river are relit."
 SME_a_plan_for_restoration:0 "A Plan for Restoration"
 SME_a_plan_for_restoration_desc:0 "Gosplan, or what is left of it, draws up a plan."
 SME_guns_first:0 "Guns First"
 SME_guns_first_desc:0 "Moscow first. Bread afterwards."
 SME_bread_first:0 "Bread First"
 SME_bread_first_desc:0 "An army marches on a full country."
 SME_dams_on_the_ob:0 "Dams on the Ob"
 SME_dams_on_the_ob_desc:0 "Novosibirsk gets its power station."
 SME_fourth_five_year_plan:0 "The Fourth Five-Year Plan"
 SME_fourth_five_year_plan_desc:0 "The plan Moscow never got to write."
 SME_chelyabinsk_40:0 "Chelyabinsk-40"
 SME_chelyabinsk_40_desc:0 "Laboratory No. 2 is rebuilt behind wire outside Kyshtym."
 SME_lessons_of_the_war:0 "Lessons of the Great Patriotic War"
 SME_lessons_of_the_war_desc:0 "Every officer who survived 1941 is asked what went wrong."
 SME_frunze_academy:0 "The Frunze Academy in Sverdlovsk"
 SME_frunze_academy_desc:0 "The staff college reopens in exile."
 SME_mechanised_corps_reborn:0 "Mechanised Corps Reborn"
 SME_mechanised_corps_reborn_desc:0 "The mechanised corps of 1941 were broken up after the summer. They come back."
 SME_red_air_force_again:0 "A Red Air Force Again"
 SME_red_air_force_again_desc:0 "Airfields around Sverdlovsk, and pilots to fly from them."
 SME_the_ural_line:0 "The Ural Line"
 SME_the_ural_line_desc:0 "Bunkers along the border with Moskowien, while there is still peace to build them in."
 SME_deep_battle_restored:0 "Deep Battle Restored"
 SME_deep_battle_restored_desc:0 "Tukhachevsky's doctrine, without Tukhachevsky."
 SME_plan_kutuzov:0 "Plan Kutuzov"
 SME_plan_kutuzov_desc:0 "The plan to take back Moscow."
 SME_the_road_to_moscow:0 "The Road to Moscow"
 SME_the_road_to_moscow_desc:0 "Forward."
 SME_archangelsk_is_ours:0 "Archangelsk Is Ours"
 SME_archangelsk_is_ours_desc:0 "The White Sea, and a port the Germans never held."
 SME_molotovsk_shipyards:0 "The Molotovsk Shipyards"
 SME_molotovsk_shipyards_desc:0 "Yard No. 402 is finished at last."
 SME_pechora_railway:0 "The Pechora Railway"
 SME_pechora_railway_desc:0 "The railway to the Vorkuta coal basin."
 SME_white_sea_fleet:0 "The White Sea Fleet"
 SME_white_sea_fleet_desc:0 "Ten destroyers and two submarines laid down in Molotovsk."
 SME_northern_sea_route:0 "The Northern Sea Route"
 SME_northern_sea_route_desc:0 "Icebreakers and convoys from the White Sea to the Pacific."
 SME_window_on_the_west:0 "A Window on the West"
 SME_window_on_the_west_desc:0 "Ships from America and Britain may call at Archangelsk."
 SME_bide_our_time:0 "Bide Our Time"
 SME_bide_our_time_desc:0 "No war with the Reich until the Reich is at war with itself. The focuses below complete themselves as Germany comes apart."
 SME_refugees_from_the_east:0 "Refugees from the East"
 SME_refugees_from_the_east_desc:0 "Germany has bled the East dry, and those who can run are running to us.\n\n§YCompletes itself§! once Germany gets there."
 SME_the_wehrbauern_arrive:0 "The Wehrbauern Arrive"
 SME_the_wehrbauern_arrive_desc:0 "Soldier-farmers on the frontier. We dig in opposite them.\n\n§YCompletes itself§! once Germany gets there."
 SME_shovels_instead_of_rifles:0 "Shovels Instead of Rifles"
 SME_shovels_instead_of_rifles_desc:0 "The frontier divisions are digging, not watching.\n\n§YCompletes itself§! once Germany gets there."
 SME_himmler_turns_west:0 "Himmler Turns West"
 SME_himmler_turns_west_desc:0 "The SS is looking at Burgundy, not at us.\n\n§YCompletes itself§! once Germany gets there."
 SME_the_old_man_shakes:0 "The Old Man Shakes"
 SME_the_old_man_shakes_desc:0 "The newsreels from Berlin have started cutting away early.\n\n§YCompletes itself§! once Germany gets there."
 SME_the_reserves_go_home:0 "The Reserves Go Home"
 SME_the_reserves_go_home_desc:0 "The threat on the border is thinning.\n\n§YCompletes itself§! once Germany gets there."
 SME_two_armies_in_one_reich:0 "Two Armies in One Reich"
 SME_two_armies_in_one_reich_desc:0 "The Wehrmacht and the SS no longer share codebooks - or secrets.\n\n§YCompletes itself§! once Germany gets there."
 SME_feed_the_partisans:0 "Feed the Partisans"
 SME_feed_the_partisans_desc:0 "Rifles, money and orders for every partisan band between the Urals and the Vistula."
 SME_friends_in_the_wehrmacht:0 "Friends in the Wehrmacht"
 SME_friends_in_the_wehrmacht_desc:0 "There are German officers who would rather talk to us than to Himmler."
 SME_rifles_from_a_bankrupt_reich:0 "Rifles from a Bankrupt Reich"
 SME_rifles_from_a_bankrupt_reich_desc:0 "Bought through Swiss middlemen, no questions asked."
 SME_the_fuhrer_is_dead:0 "The Führer Is Dead"
 SME_the_fuhrer_is_dead_desc:0 "Berlin has buried him. Now we wait for them to start shooting each other.\n\n§YCompletes itself§! once Germany gets there."
 SME_total_mobilisation:0 "Total Mobilisation"
 SME_total_mobilisation_desc:0 "Every man who can carry a rifle will be needed."
 SME_the_hour_has_come:0 "The Hour Has Come"
 SME_the_hour_has_come_desc:0 "The Reich is at war with itself.\n\n§YCompletes itself§! once Germany gets there."
 wif_sme_fascist_writers_turned:0 "Fascist Writers, Our Presses"
 wif_sme_fascist_writers_turned_desc:0 "The fascist papers are shut and their presses print for the Party."
 wif_sme_komsomol:0 "The Komsomol"
 wif_sme_komsomol_desc:0 "The Young Communist League recruits in every Ural town."
 wif_sme_heir_to_the_union:0 "Heir to the Union"
 wif_sme_heir_to_the_union_desc:0 "The Emergency Government has stopped calling itself temporary."
 wif_sme_plan_for_restoration:0 "A Plan for Restoration"
 wif_sme_plan_for_restoration_desc:0 "Gosplan, or what is left of it, has a plan."
 wif_sme_ural_industry:0 "The Ural Workshop"
 wif_sme_ural_industry_desc:0 "The Urals build what the Union used to build everywhere."
 wif_sme_ural_industry_2:0 "The Fourth Five-Year Plan"
 wif_sme_ural_industry_2_desc:0 "The plan Moscow never got to write."
 wif_sme_chelyabinsk_40:0 "Chelyabinsk-40"
 wif_sme_chelyabinsk_40_desc:0 "A closed city behind wire outside Kyshtym."
 wif_sme_deep_battle:0 "Deep Battle Restored"
 wif_sme_deep_battle_desc:0 "Tukhachevsky's doctrine, without Tukhachevsky."
 wif_sme_plan_kutuzov:0 "Plan Kutuzov"
 wif_sme_plan_kutuzov_desc:0 "The plan to take back Moscow."
 wif_sme_northern_sea_route:0 "The Northern Sea Route"
 wif_sme_northern_sea_route_desc:0 "Icebreakers and convoys from the White Sea to the Pacific."
 wif_sme_window_on_the_west:0 "A Window on the West"
 wif_sme_window_on_the_west_desc:0 "Ships from America and Britain call at Archangelsk."
 wif_sme_wehrbauern_watch:0 "Watching the Wehrbauern"
 wif_sme_wehrbauern_watch_desc:0 "Soldier-farmers on the frontier, and our divisions dug in opposite them."
 wif_sme_shovels_instead_of_rifles:0 "Shovels Instead of Rifles"
 wif_sme_shovels_instead_of_rifles_desc:0 "The frontier divisions across the border are digging, not watching."
 wif_sme_reserves_go_home:0 "The Reserves Go Home"
 wif_sme_reserves_go_home_desc:0 "The threat on the border is thinning, and the factories can work for something other than the next week."
 wif_sme_friends_in_the_wehrmacht:0 "Friends in the Wehrmacht"
 wif_sme_friends_in_the_wehrmacht_desc:0 "German officers who would rather talk to us than to Himmler."
 wif_sme_total_mobilisation:0 "Total Mobilisation"
 wif_sme_total_mobilisation_desc:0 "Every man who can carry a rifle."
