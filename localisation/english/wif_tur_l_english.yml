 wif_tur_kw_dock_strikes_risk:0 "§R10%§! chance our agents are caught: Influence §R-10§!, and the garrison's country turns against us."
 wif_tur_kw_rifles_for_tribes:0 "Rifles for the Tribes"
 wif_tur_kw_rifles_for_tribes_desc:0 "2,000 rifles across the desert to the Mutayr and Ajman tribes."
 wif_tur_tt_111:0 "Kuwait: Unrest §G+15§!."
 wif_tur_kw_rifles_for_tribes_risk:0 "§R25%§! chance our agents are caught: Influence §R-10§!, and the garrison's country turns against us."
 wif_tur_kw_martyr_in_the_souk:0 "A Martyr in the Souk"
 wif_tur_kw_martyr_in_the_souk_desc:0 "A demonstration, a volley from the garrison, a funeral the whole town attends. It can be arranged."
 wif_tur_tt_112:0 "Kuwait: Influence §R-5§!, Unrest §G+20§!."
 wif_tur_kw_martyr_in_the_souk_risk:0 "§R30%§! chance our agents are caught: Influence §R-10§!, and the garrison's country turns against us."
 wif_tur_kuwait_category:0 "The Kuwait Game"
 wif_tur_kuwait_category_desc:0 "Turkish Influence in Kuwait: §G[?ROOT.wif_tur_kw_inf|0]§!/100. Unrest against the garrison: §R[?ROOT.wif_tur_kw_unrest|0]§!/100.\nThe cut-off British and Canadian garrison answers every month. When either reaches §Y75§!, The Kuwait Crisis can decide it: Influence - the Sheikh asks for our protection; Unrest - Kuwait rises and we may march in; both at 60 - a rising that invites us in."
 wif_tur.1.t:0 "Ataturk Is Dead"
 wif_tur.1.desc:0 "At 9:05 this morning, in Dolmabahce Palace, Mustafa Kemal Ataturk died. He was fifty-seven. The clocks of the palace have been stopped at the hour of his death, and the whole nation is in mourning. Until a new President is chosen, the Grand National Assembly itself governs the Republic."
 wif_tur.1.a:0 "The Republic goes on."
 wif_tur_ataturk_dead_tt:0 "§YAtaturk§! has died."
 wif_tur_assembly:0 "The Grand National Assembly"
 wif_tur.30.t:0 "Ankara Asks for Aleppo"
 wif_tur.30.desc:0 "The Turkish ambassador reminds us that Hatay bought Turkish friendship in 1939 - and that Aleppo was an Ottoman city for four centuries. Ankara asks, as one friend of the Reich to another, for Aleppo and the Jazira."
 wif_tur.30.a:0 "Give it to them. Syria costs more than it is worth."
 wif_tur.30.a_tt:0 "§YAleppo§! and §YDeir-az-Zur§! become Turkish. Turkey: §G+25§! opinion."
 wif_tur.30.b:0 "France gives away no more of its empire."
 wif_tur.30.b_tt:0 "Turkey: §R-25§! opinion. Ankara may come for Syria if the Reich falls apart."
 wif_tur.33.t:0 "Turkey Marches into Syria"
 wif_tur.33.desc:0 "With the Reich at war with itself, Turkish divisions have crossed into Syria. The French garrison has gone over to a hastily proclaimed independent Syrian republic - with Lebanon - which has taken its guns and a share of Vichy's stores. Ankara wants it over within six weeks."
 wif_tur.33.a:0 "The Levant is burning again."
 wif_tur.35.t:0 "Syria Holds"
 wif_tur.35.desc:0 "Forty-five days, and Syria still stands. The army cannot go on without a wider war Ankara does not want. We make peace - and Vichy takes Syria back."
 wif_tur.35.a:0 "A bitter day for the Republic."
 wif_tur.36.t:0 "Syria Falls to Turkey"
 wif_tur.36.desc:0 "Damascus has surrendered. Syria and Lebanon are annexed to Turkey, and Aleppo and the Jazira are declared Turkish land forever."
 wif_tur.36.a:0 "The south is ours."
 wif_tur.37.t:0 "Turkey's Syrian Humiliation"
 wif_tur.37.desc:0 "Turkey has failed to take Syria in six weeks and made peace. Vichy France has re-annexed Syria and Lebanon."
 wif_tur.37.a:0 "Ankara will not forget."
 wif_tur.41.t:0 "The Garrison Answers"
 wif_tur.41.desc:0 "The British and Canadian garrison in Kuwait, cut off from home, does what it can to keep order."
 wif_tur.41.a:0 "We will see."
 wif_tur.41.curfew_tt:0 "§YA curfew:§! Unrest §G-8§!... for them."
 wif_tur.41.arrests_tt:0 "§YArrests:§! Influence and Unrest §R-5§! - and if the town is already angry, Unrest §G+8§!."
 wif_tur.41.reinforce_tt:0 "§YCanadian reinforcements by sea:§! Unrest §R-12§!."
 wif_tur.41.deport_tt:0 "§YDeportations of Turkish sympathisers:§! Influence §R-8§!, Unrest §G+4§!."
 wif_tur.41.quiet_tt:0 "A quiet month."
 wif_tur.42.t:0 "Our Agents Caught"
 wif_tur.42.desc:0 "The garrison has arrested men carrying Turkish money. The papers in Ottawa are furious."
 wif_tur.42.a:0 "Deny everything."
 wif_tur.43.t:0 "Kuwait Asks for Turkish Protection"
 wif_tur.43.desc:0 "The Sheikh of Kuwait has asked Ankara for protection, and the garrison has been told to leave."
 wif_tur.43.a:0 "The Basra vilayet remembers."
 wif_tur.44.t:0 "Kuwait Rises"
 wif_tur.44.desc:0 "Kuwait town has risen against its British and Canadian garrison and declared itself free. Turkish divisions are massing on the border, ready to \"restore order\"."
 wif_tur.44.a:0 "Who will hold Kuwait?"
 wif_tur.45.t:0 "Kuwait Invites the Turks"
 wif_tur.45.desc:0 "Kuwait has risen against its garrison - and its leaders have asked Turkey to protect the new order. Turkish troops are welcomed in the souk."
 wif_tur.45.a:0 "Kuwait is Turkish in all but name."
