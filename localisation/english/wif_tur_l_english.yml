 wif_tur_kw_bribe_the_cousins_risk:0 "§R20%§! chance our agents are caught: Influence §R-10§!, and the garrison's country turns against us."
 wif_tur_kw_arab_clubs:0 "Arab Clubs and Newspapers"
 wif_tur_kw_arab_clubs_desc:0 "Reading clubs and broadsheets in the souk: Kuwait for the Arabs, the garrison out."
 wif_tur_tt_109:0 "Kuwait: Influence §G+2§!, Unrest §G+6§!."
