 wif_tur_tt_84:0 "§YKuwait§! is annexed and cored if it is our subject or we hold it. §G+8§! oil."
 wif_tur_tt_85:0 "We ask §YVichy France§! for Aleppo and Deir-az-Zur. If it agrees, they are ours and cores; if it refuses, §YMarch into Syria§! opens once the Reich falls apart."
 wif_tur_tt_86:0 "§RThe Syrian War.§! Syria becomes independent with Lebanon, takes over every French division stationed there and §R10%§! of Vichy's stockpile. Then we invade in a §Ylimited war§! with a §Y45-day§! deadline. Win: we annex Syria and core §YAleppo§! and §YDeir-az-Zur§!. Fail: Vichy re-annexes Syria and we are §Rhumiliated§! for a year."
