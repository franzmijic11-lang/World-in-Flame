l_english:
 wif_tur_root:0 "Peace at Home, Peace in the World"
 wif_tur_root_desc:0 "Ataturk's Republic: secular, nationalist, poor, and sitting on the Straits between every great power of the coming war. Its whole policy - under Ataturk and, from 1938, Ismet Inonu, the 'Milli Sef' - is to stay out: to balance Britain against Germany and both against the Soviet Union, sell chromium to whoever pays, and fight no one."
 wif_tur_six_arrows:0 "The Six Arrows"
 wif_tur_six_arrows_desc:0 "Republicanism, nationalism, populism, etatism, secularism, reformism: the Kemalist creed, written into the constitution in 1937."
 wif_tur_peoples_houses:0 "The People's Houses"
 wif_tur_peoples_houses_desc:0 "The Halkevleri: reading rooms, theatres and lecture halls in every town, carrying the revolution to the people."
 wif_tur_language_reform:0 "The Sun Language Theory"
 wif_tur_language_reform_desc:0 "Ataturk's last intellectual passion: Turkish as the mother of all languages. The Turkish Language Association purges Arabic and Persian words."
 wif_tur_hatay_question:0 "The Hatay Question"
 wif_tur_hatay_question_desc:0 "The Sanjak of Alexandretta, a third Turkish, belongs to French Syria. Ataturk wants it back before he dies."
 wif_tur_dersim:0 "Dersim"
 wif_tur_dersim_desc:0 "1937-38: the army crushes the Kurdish Alevi uprising in Dersim, renamed Tunceli. Villages are bombed and burned; thousands are killed and thousands more deported to the west. The Tunceli Law keeps the province under military rule."
 wif_tur_ataturk_dies:0 "Ataturk Is Dead"
 wif_tur_ataturk_dies_desc:0 "10 November 1938, 9:05 in the morning, Dolmabahce Palace. The clocks in the palace are stopped at the hour of his death. The nation mourns."
 wif_tur_hatay_state:0 "The State of Hatay"
 wif_tur_hatay_state_desc:0 "1938: under French and Turkish supervision, the sanjak becomes the 'Republic of Hatay' - with a Turkish majority in its assembly."
 wif_tur_village_institutes:0 "The Village Institutes"
 wif_tur_village_institutes_desc:0 "1940: peasant children trained as teachers - and as builders and farmers - and sent back to their villages: Kemalism carried into Anatolia."
 wif_tur_milli_sef:0 "Milli Sef"
 wif_tur_milli_sef_desc:0 "Ismet Inonu, the hero of the Inonu battles and of Lausanne, becomes President - the 'National Chief'. His face replaces Ataturk's on the banknotes."
 wif_tur_keep_bayar:0 "Keep Bayar"
 wif_tur_keep_bayar_desc:0 "Celal Bayar, the banker of the Is Bank, stays Prime Minister: a lighter hand for private enterprise."
 wif_tur_saydam_cabinet:0 "The Saydam Cabinet"
 wif_tur_saydam_cabinet_desc:0 "January 1939: Inonu replaces Bayar with Refik Saydam, a loyal statist doctor. The state runs the economy."
 wif_tur_annex_hatay:0 "Annex Hatay"
 wif_tur_annex_hatay_desc:0 "June 1939: the Hatay assembly votes to join Turkey - with French consent, the price of keeping Turkey out of Germany's camp. Most of its Armenians leave for Syria."
 wif_tur_national_protection_law:0 "The National Protection Law"
 wif_tur_national_protection_law_desc:0 "1940: emergency powers over prices, labour and property for a country mobilised but not at war."
 wif_tur_twenty_classes:0 "The Twenty Classes"
 wif_tur_twenty_classes_desc:0 "1941: the non-Muslim men of twenty age classes - Greeks, Armenians, Jews - are called up into unarmed labour battalions and sent to build roads in Anatolia."
 wif_tur_bread_ration:0 "The Bread Ration"
 wif_tur_bread_ration_desc:0 "1942: bread is rationed in the cities. Profiteers grow rich; civil servants go hungry."
 wif_tur_varlik_vergisi:0 "Varlik Vergisi"
 wif_tur_varlik_vergisi_desc:0 "The 1942 capital tax: assessed arbitrarily, and up to ten times higher for Greeks, Armenians and Jews than for Muslim Turks. Those who could not pay had their property auctioned and were sent to labour camps at Askale in the eastern winter."
 wif_tur_askale:0 "Askale"
 wif_tur_askale_desc:0 "Some 1,400 men who could not pay the tax break stones in the snow at Askale. Twenty-one die. Their businesses pass into Muslim Turkish hands."
 wif_tur_repeal_the_tax:0 "Repeal the Tax"
 wif_tur_repeal_the_tax_desc:0 "March 1944: under Allied criticism the tax is repealed and the prisoners released. The property is not returned."
 wif_tur_kemalist_state:0 "The Kemalist State"
 wif_tur_kemalist_state_desc:0 "1944: Inonu cracks down on the pan-Turkists - the Racism-Turanism Trials put Nihal Atsiz and his circle in prison."
 wif_tur_turanist_movement:0 "The Turanist Movement"
 wif_tur_turanist_movement_desc:0 "The pan-Turkists around Nihal Atsiz and the officers who read him are not arrested - they are listened to."
 wif_tur_memorandum_of_four:0 "The Memorandum of the Four"
 wif_tur_memorandum_of_four_desc:0 "June 1945: Bayar, Menderes, Koraltan and Koprulu ask for real democracy inside the CHP. The one-party state starts to crack. (To be continued in an Allied-victory scenario.)"
 wif_tur_grey_wolves:0 "The Grey Wolf"
 wif_tur_grey_wolves_desc:0 "The bozkurt, the grey wolf that led the Turks out of Ergenekon, becomes the symbol of a movement - and of a generation of officers."
 wif_tur_etatism:0 "Continue the Policy of Etatism"
 wif_tur_etatism_desc:0 "The state builds the industry private capital will not."
 wif_tur_is_bank:0 "Fully Integrate the Is Bank"
 wif_tur_is_bank_desc:0 "Ataturk's own bank finances the new industries."
 wif_tur_first_five_year_plan:0 "The First Five-Year Plan"
 wif_tur_first_five_year_plan_desc:0 "Textiles, paper, glass, cement - the first state factories."
 wif_tur_sumerbank:0 "Sumerbank"
 wif_tur_sumerbank_desc:0 "The state textile and industrial holding."
 wif_tur_izmir_fair:0 "The Izmir International Fair"
 wif_tur_izmir_fair_desc:0 "Every September the world's pavilions in Izmir: Germany's the largest."
 wif_tur_etibank:0 "Etibank"
 wif_tur_etibank_desc:0 "The state mining bank, founded 1935: copper, coal, chromium."
 wif_tur_second_five_year_plan:0 "The Second Five-Year Plan"
 wif_tur_second_five_year_plan_desc:0 "Heavy industry, mines and power."
 wif_tur_karabuk:0 "Karabuk Steelworks"
 wif_tur_karabuk_desc:0 "Turkey's first integrated steelworks, built with British loans and opened in 1939."
 wif_tur_zonguldak:0 "Zonguldak Coal"
 wif_tur_zonguldak_desc:0 "The Black Sea coal basin, worked by labour conscripts."
 wif_tur_adana_cotton:0 "Adana Cotton"
 wif_tur_adana_cotton_desc:0 "The Cukurova plain grows the cotton for Sumerbank's mills."
 wif_tur_eastern_railways:0 "Railways to the East"
 wif_tur_eastern_railways_desc:0 "The lines reach Sivas, Erzurum and Diyarbakir."
 wif_tur_ergani_copper:0 "Ergani Copper"
 wif_tur_ergani_copper_desc:0 "Copper from the mountains of Diyarbakir."
 wif_tur_chromium:0 "Chromium for Everyone"
 wif_tur_chromium_desc:0 "Turkey is one of the world's great chromium producers - and both Britain and Germany need it for steel. Turkey sells to both."
 wif_tur_divrigi_iron:0 "Divrigi Iron"
 wif_tur_divrigi_iron_desc:0 "The iron mine at Divrigi feeds Karabuk."
 wif_tur_war_profiteers:0 "The War Rich"
 wif_tur_war_profiteers_desc:0 "Wheat speculators and smugglers grow rich on the war; the 'war rich' become a byword."
 wif_tur_develop_the_east:0 "Develop the East"
 wif_tur_develop_the_east_desc:0 "Dams, roads and schools for eastern Anatolia - and garrisons for the Kurdish provinces."
 wif_tur_refugee_professors:0 "The Professors from Germany"
 wif_tur_refugee_professors_desc:0 "From 1933 Istanbul University took in over a hundred German and Austrian professors driven out by the Nazis - surgeons, economists, architects - and built a modern university around them."
 wif_tur_mobilised_economy:0 "The Mobilised Economy"
 wif_tur_mobilised_economy_desc:0 "A million men under arms in a country at peace: the economy is run as if at war."
 wif_tur_state_monopolies:0 "State Monopolies"
 wif_tur_state_monopolies_desc:0 "Tobacco, salt, alcohol, matches: the state's monopolies fund the budget."
 wif_tur_east_anatolian_dams:0 "Dams of the East"
 wif_tur_east_anatolian_dams_desc:0 "Hydroelectric dams on the upper Euphrates and the Kizilirmak."
 wif_tur_industrial_turkey:0 "An Industrial Turkey"
 wif_tur_industrial_turkey_desc:0 "Karabuk, Zonguldak, Kayseri, Izmit: Turkey makes its own steel, cloth and aircraft."
 wif_tur_postwar_plan:0 "The Post-War Development Plan"
 wif_tur_postwar_plan_desc:0 "Whoever wins, Turkey must be richer when the war is over."
 wif_tur_active_neutrality:0 "Active Neutrality"
 wif_tur_active_neutrality_desc:0 "Neutral, but not passive: Ankara talks to everyone and promises nothing."
 wif_tur_saadabad_pact:0 "The Saadabad Pact"
 wif_tur_saadabad_pact_desc:0 "1937: non-aggression with Iran, Iraq and Afghanistan - a quiet eastern border."
 wif_tur_montreux:0 "The Montreux Convention"
 wif_tur_montreux_desc:0 "1936: the Straits are Turkish again, to fortify and to close to warships in wartime."
 wif_tur_nyon:0 "The Nyon Patrols"
 wif_tur_nyon_desc:0 "1937: 'unknown' Italian submarines sink ships bound for Spain. Turkey joins the Nyon patrols in the Aegean."
 wif_tur_balkan_entente:0 "The Balkan Entente"
 wif_tur_balkan_entente_desc:0 "With Greece, Yugoslavia and Romania: a pact against revisionists that will not survive the war."
 wif_tur_soviet_friendship:0 "The Soviet Treaty"
 wif_tur_soviet_friendship_desc:0 "The 1925 friendship treaty with Moscow, renewed every ten years - and less trusted every year."
 wif_tur_tripartite_treaty:0 "The Tripartite Treaty"
 wif_tur_tripartite_treaty_desc:0 "October 1939: mutual assistance with Britain and France - with an escape clause for any war with the Soviet Union."
 wif_tur_saracoglu_moscow:0 "Saracoglu in Moscow"
 wif_tur_saracoglu_moscow_desc:0 "October 1939: the Foreign Minister waits three weeks in Moscow while Molotov signs with Ribbentrop - and asks for bases on the Straits. He comes home with nothing."
 wif_tur_german_friendship_treaty:0 "The German-Turkish Treaty"
 wif_tur_german_friendship_treaty_desc:0 "June 1941, four days before Barbarossa: friendship and non-aggression with Germany - while the British treaty stays in force."
 wif_tur_bulgarian_front:0 "The Bulgarian Front"
 wif_tur_bulgarian_front_desc:0 "March 1941: German armies stand in Bulgaria, on the Thracian border. Ankara signs a non-aggression declaration with Sofia and prays."
 wif_tur_rashid_ali_1941:0 "No Road to Baghdad"
 wif_tur_rashid_ali_1941_desc:0 "May 1941: Rashid Ali's coup in Iraq asks for German help. Germany asks Turkey for transit. Turkey says no."
 wif_tur_vichy_syria:0 "The Fall of Vichy Syria"
 wif_tur_vichy_syria_desc:0 "June 1941: British and Free French troops take Syria and Lebanon from Vichy, on Turkey's southern border."
 wif_tur_greek_refugees:0 "Greece Falls"
 wif_tur_greek_refugees_desc:0 "April 1941: Greece falls; its refugees cross the Aegean, and the famine in Athens begins. Turkey sends the Kurtulus with food."
 wif_tur_balancing_act:0 "The Balancing Act"
 wif_tur_balancing_act_desc:0 "Every side courts Turkey; Turkey disappoints every side a little. Sooner or later Ankara must decide which way it leans."
 wif_tur_istanbul_route:0 "The Istanbul Route"
 wif_tur_istanbul_route_desc:0 "Jewish refugees from the Balkans reach Palestine through Istanbul; Turkish consuls like Necdet Kent in Marseille and Selahattin Ulkumen on Rhodes save those they can."
 wif_tur_closed_doors:0 "Closed Doors"
 wif_tur_closed_doors_desc:0 "February 1942: the Struma, crammed with 768 Jewish refugees from Romania, is towed out of Istanbul into the Black Sea without an engine. A Soviet submarine sinks her. One man survives."
 wif_tur_lean_west:0 "Lean Towards the Allies"
 wif_tur_lean_west_desc:0 "The historical road: neutral, but leaning towards the side that will win."
 wif_tur_wait_for_victor:0 "Wait for the Victor"
 wif_tur_wait_for_victor_desc:0 "Turkey will join no one until it knows who wins - and then it will join the winner."
 wif_tur_adana_conference:0 "The Adana Conference"
 wif_tur_adana_conference_desc:0 "January 1943: Churchill flies to Adana in person to bring Turkey into the war. Inonu listens politely and asks for more arms."
 wif_tur_hardihood:0 "Operation Hardihood"
 wif_tur_hardihood_desc:0 "The Allied plan to base aircraft in Anatolia - if Turkey enters the war."
 wif_tur_cicero_allies:0 "Cicero"
 wif_tur_cicero_allies_desc:0 "1943-44: the British ambassador's valet in Ankara photographs the embassy's secrets and sells them to the Germans. Turkish intelligence watches, and says nothing to anyone."
 wif_tur_cairo_conference:0 "The Cairo Conference"
 wif_tur_cairo_conference_desc:0 "December 1943: Roosevelt and Churchill press Inonu again. Again he asks for time."
 wif_tur_allied_arms:0 "Allied Arms"
 wif_tur_allied_arms_desc:0 "Lend-lease reaches Turkey through Syria and Iraq."
 wif_tur_chromium_embargo:0 "Stop the Chromium"
 wif_tur_chromium_embargo_desc:0 "April 1944: under Allied pressure the chromium shipments to Germany stop."
 wif_tur_break_with_berlin:0 "Break with Berlin"
 wif_tur_break_with_berlin_desc:0 "August 1944: Turkey breaks off relations with Germany."
 wif_tur_bow_to_victor:0 "Bow to the Victor"
 wif_tur_bow_to_victor_desc:0 "Germany has won. The Allies Turkey leaned towards are beaten or gone, and Ankara must make its peace with the new order - quickly."
 wif_tur_molotov_demands:0 "Molotov's Demands"
 wif_tur_molotov_demands_desc:0 "March 1945: Moscow refuses to renew the 1925 treaty and wants Kars, Ardahan and bases on the Straits."
 wif_tur_war_on_the_axis:0 "Declare War on the Axis"
 wif_tur_war_on_the_axis_desc:0 "23 February 1945: a symbolic declaration of war on Germany and Japan, the price of a seat at the peace."
 wif_tur_san_francisco:0 "The San Francisco Conference"
 wif_tur_san_francisco_desc:0 "A founding member of the United Nations. (The historical road ends here - to be expanded for Allied-victory scenarios.)"
 wif_tur_armed_neutrality:0 "Armed Neutrality"
 wif_tur_armed_neutrality_desc:0 "A million men mobilised to make sure no one marches through Anatolia."
 wif_tur_von_papen:0 "Ambassador von Papen"
 wif_tur_von_papen_desc:0 "Franz von Papen, Hitler's ambassador in Ankara, offers Turkey everything it wants once the war is won."
 wif_tur_german_transit:0 "Ships Through the Straits"
 wif_tur_german_transit_desc:0 "German 'merchant' ships and landing craft pass the Straits into the Black Sea. Britain protests; Ankara counts the tonnage another way."
 wif_tur_generals_tour:0 "The Generals at the Front"
 wif_tur_generals_tour_desc:0 "October 1941: Generals Erkilet and Erden tour the Eastern Front as Hitler's guests, and talk with the Turkic prisoners of war in German camps."
 wif_tur_cicero_axis:0 "Cicero"
 wif_tur_cicero_axis_desc:0 "Von Papen's best source: the British ambassador's valet, 'Cicero', photographing the embassy safe. Turkey sees everything and warns no one."
 wif_tur_chromium_for_reich:0 "Chromium for the Reich"
 wif_tur_chromium_for_reich_desc:0 "The Clodius agreement: Turkish chromium for German weapons."
 wif_tur_victor_emerges:0 "The Victor Emerges"
 wif_tur_victor_emerges_desc:0 "Germany has won one of its two great wars. Turkey's waiting is over."
 wif_tur_join_the_axis:0 "Join the Axis"
 wif_tur_join_the_axis_desc:0 "Turkey enters Germany's alliance - late, cheaply, and on the winning side."
 wif_tur_new_order_turkey:0 "Turkey in the New Order"
 wif_tur_new_order_turkey_desc:0 "In a Europe ruled from Berlin and Rome, Turkey is the strongest of the lesser powers - and the gateway to the Middle East."
 wif_tur_turan:0 "The Dream of Turan"
 wif_tur_turan_desc:0 "A Turkic world from the Bosporus to Central Asia: the old pan-Turkist dream, now with a victorious ally willing to listen."
 wif_tur_batum_kars:0 "Batum and Kars"
 wif_tur_batum_kars_desc:0 "Batum was Ottoman until 1878; Kars and Ardahan were Russian until 1918. With the Soviet Union gone, Ankara asks for Batum."
 wif_tur_azerbaijan_turkish:0 "Azerbaijan Is Turkish"
 wif_tur_azerbaijan_turkish_desc:0 "Baku's Azerbaijanis are Turks. Kaukasien's Reichskommissar may disagree."
 wif_tur_crimean_tatars:0 "The Crimean Tatars"
 wif_tur_crimean_tatars_desc:0 "Ankara asks Berlin to protect the Tatars of Crimea - and to let them come to Turkey."
 wif_tur_turkestan_legion:0 "The Turkestan Legion"
 wif_tur_turkestan_legion_desc:0 "Turkic prisoners of war who fought for Germany come 'home' to Turkey - and form a legion."
 wif_tur_turkestan_brothers:0 "Our Brothers in Turkestan"
 wif_tur_turkestan_brothers_desc:0 "Uzbeks, Kazakhs, Turkmens, Kyrgyz: the Turkic peoples of former Soviet Central Asia."
 wif_tur_turanist_state:0 "The Turanist State"
 wif_tur_turanist_state_desc:0 "Turkey as the elder brother of every Turkic nation."
 wif_tur_iraq_cut_off:0 "Iraq Cut Off"
 wif_tur_iraq_cut_off_desc:0 "With Britain beaten, Iraq's British garrison and advisers are gone, and Baghdad is alone between Turkey, Iran and Italy's Levant."
 wif_tur_mosul_vilayet:0 "The Mosul Vilayet"
 wif_tur_mosul_vilayet_desc:0 "Mosul was Ottoman until 1918, and Turkey never stopped claiming it."
 wif_tur_kirkuk_oil:0 "The Oil of Kirkuk"
 wif_tur_kirkuk_oil_desc:0 "The fields the British held are unguarded."
 wif_tur_rashid_ali:0 "Rashid Ali Returns"
 wif_tur_rashid_ali_desc:0 "The man who rose against Britain in 1941 waits in exile, ready to govern Iraq for whoever puts him back."
 wif_tur_seize_iraq:0 "Seize Iraq"
 wif_tur_seize_iraq_desc:0 "Turkish divisions cross the border to 'restore order' in Iraq."
 wif_tur_annex_mosul:0 "Annex Mosul"
 wif_tur_annex_mosul_desc:0 "The vilayet comes home; the rest of Iraq is left to its fate."
 wif_tur_rashid_ali_government:0 "Rashid Ali's Government"
 wif_tur_rashid_ali_government_desc:0 "A Turkish-guided government in Baghdad under Rashid Ali - and Kirkuk's oil for Turkey."
 wif_tur_kurdish_question:0 "The Kurdish Question"
 wif_tur_kurdish_question_desc:0 "More Kurds now live under Ankara than ever - in the east, in Mosul, in the mountains. Some of them have not forgotten Dersim."
 wif_tur_ask_vichy_for_syria:0 "Ask Vichy for Syria"
 wif_tur_ask_vichy_for_syria_desc:0 "Hatay was the price of Turkish neutrality in 1939. In the New Order, Ankara asks Vichy for the rest of the old Aleppo province: a request between friends of the Reich."
 wif_tur_kuwait_question:0 "The Kuwait Question"
 wif_tur_kuwait_question_desc:0 "To the Ottomans Kuwait was a district of the Basra vilayet; to Britain, since 1899, a protectorate. Britain is beaten - but a British and Canadian garrison still holds Kuwait town, cut off and answering to Ottawa."
 wif_tur_majlis_movement:0 "The Majlis Movement"
 wif_tur_majlis_movement_desc:0 "In 1938 Kuwait's merchants forced an elected council on the Sheikh, and looked to Iraq rather than Britain. Their sons can be made to look to Ankara."
 wif_tur_sheikhs_court:0 "The Sheikh's Court"
 wif_tur_sheikhs_court_desc:0 "Sheikh Ahmad al-Jaber has outlived his British protectors' power. His cousins and rivals have prices."
 wif_tur_kuwait_crisis:0 "The Kuwait Crisis"
 wif_tur_kuwait_crisis_desc:0 "The garrison is exhausted, the souks are restless, the Sheikh is listening. One more push."
 wif_tur_kuwait_turkish:0 "Kuwait Is Turkish"
 wif_tur_kuwait_turkish_desc:0 "The Turkish flag over Kuwait town, for the first time since 1914 - and the oil of Burgan, found by the British in 1938 and never pumped, is ours."
 wif_tur_straits_question:0 "The Straits Question"
 wif_tur_straits_question_desc:0 "With the Soviet fleet gone, who needs Montreux?"
 wif_tur_rewrite_montreux:0 "Rewrite Montreux"
 wif_tur_rewrite_montreux_desc:0 "The Straits are Turkish alone: closed to every warship Turkey does not invite."
 wif_tur_shared_straits:0 "Share the Straits"
 wif_tur_shared_straits_desc:0 "Rome and Berlin may pass whenever they like - in return for friendship."
 wif_tur_reich_divided:0 "The Reich Divided"
 wif_tur_reich_divided_desc:0 "The Reich is at war with itself. Its allies must find new friends - and Rome is offering."
 wif_tur_march_into_syria:0 "March into Syria"
 wif_tur_march_into_syria_desc:0 "With the Reich at war with itself, Vichy has no one to protect it. If France would not give Syria, Turkey will take it."
 wif_tur_aleppo_vilayet:0 "The Aleppo Vilayet"
 wif_tur_aleppo_vilayet_desc:0 "Aleppo, an Ottoman city for four hundred years, is Turkish again."
 wif_tur_pact_of_rome:0 "The Invitation from Rome"
 wif_tur_pact_of_rome_desc:0 "Italy's Pact of Rome invites Turkey: the two Mediterranean powers, together while Germany burns."
 wif_tur_thrace_guarantee:0 "A Guarantee for Thrace"
 wif_tur_thrace_guarantee_desc:0 "The border with Bulgaria, guaranteed by Rome and Ankara together."
 wif_tur_sofia:0 "Influence in Sofia"
 wif_tur_sofia_desc:0 "Bulgaria lost its German patron. Ankara offers trade, a frontier guarantee in Thrace and advisers to the regents of the boy-Tsar Simeon."
 wif_tur_bucharest:0 "Influence in Bucharest"
 wif_tur_bucharest_desc:0 "Romania's oil and its Black Sea coast: worth courting while Berlin cannot."
 wif_tur_black_sea:0 "Master of the Black Sea"
 wif_tur_black_sea_desc:0 "With the Soviet fleet gone and the Germans busy, the Black Sea is Turkey's lake."
 wif_tur_romanian_oil:0 "Oil from Ploesti"
 wif_tur_romanian_oil_desc:0 "Romanian oil, paid for in Turkish chromium and cotton."
 wif_tur_balkan_sphere:0 "The Turkish Balkan Sphere"
 wif_tur_balkan_sphere_desc:0 "From Thrace to the Danube, Ankara's word counts - under Rome's umbrella."
 wif_tur_regional_power:0 "A Regional Power"
 wif_tur_regional_power_desc:0 "By 1950 Turkey is the strongest state between the Adriatic and Iran - still Kemalist, still careful, and on the winning side."
 wif_tur_second_republic:0 "The Republic at Twenty-Seven"
 wif_tur_second_republic_desc:0 "Ataturk's Republic has outlived its founder and survived the war that broke Europe. What it becomes now is up to Ankara."
 wif_tur_peace_at_home_idea:0 "Peace at Home, Peace in the World"
 wif_tur_peace_at_home_idea_desc:0 "Ataturk's motto - and Turkey's whole foreign policy."
 wif_tur_halkevleri_idea:0 "The People's Houses"
 wif_tur_halkevleri_idea_desc:0 "Reading rooms and theatres in every town."
 wif_tur_language_idea:0 "The Turkish Language Association"
 wif_tur_language_idea_desc:0 "Arabic and Persian words out; Turkish in."
 wif_tur_tunceli_law_idea:0 "The Tunceli Law"
 wif_tur_tunceli_law_idea_desc:0 "Dersim under military rule."
 wif_tur_mourning_idea:0 "Mourning Ataturk"
 wif_tur_mourning_idea_desc:0 "The clocks are stopped at 9:05."
 wif_tur_village_institutes_idea:0 "The Village Institutes"
 wif_tur_village_institutes_idea_desc:0 "Teachers for every village."
 wif_tur_milli_sef_idea:0 "Milli Sef"
 wif_tur_milli_sef_idea_desc:0 "Inonu, the National Chief."
 wif_tur_bayar_idea:0 "The Bayar Government"
 wif_tur_bayar_idea_desc:0 "A lighter hand for private enterprise."
 wif_tur_saydam_idea:0 "The Saydam Cabinet"
 wif_tur_saydam_idea_desc:0 "The state runs the economy."
 wif_tur_protection_law_idea:0 "The National Protection Law"
 wif_tur_protection_law_idea_desc:0 "Emergency powers for a country at peace."
 wif_tur_labour_battalions_idea:0 "The Labour Battalions"
 wif_tur_labour_battalions_idea_desc:0 "Non-Muslim men building roads in Anatolia."
 wif_tur_bread_ration_idea:0 "The Bread Ration"
 wif_tur_bread_ration_idea_desc:0 "The cities queue for bread."
 wif_tur_grey_wolf_idea:0 "The Grey Wolf"
 wif_tur_grey_wolf_idea_desc:0 "The bozkurt of Ergenekon."
 wif_tur_etatism_idea:0 "Etatism"
 wif_tur_etatism_idea_desc:0 "The state builds what capital will not."
 wif_tur_sumerbank_idea:0 "Sumerbank"
 wif_tur_sumerbank_idea_desc:0 "State textiles and industry."
 wif_tur_zonguldak_idea:0 "Zonguldak Coal"
 wif_tur_zonguldak_idea_desc:0 "The Black Sea coal basin."
 wif_tur_chromium_idea:0 "Chromium for Everyone"
 wif_tur_chromium_idea_desc:0 "Britain and Germany both need it."
 wif_tur_war_rich_idea:0 "The War Rich"
