 # The Unity Government's ministers
 SWE_gustav_moller:0 "Gustav Möller"
 SWE_allan_vougt:0 "Allan Vougt"
 SWE_gunnar_hedlund:0 "Gunnar Hedlund"
 SWE_karin_kock:0 "Karin Kock"
 wif_swe_moller_advisor:0 "Minister for Social Affairs"
 wif_swe_moller_advisor_desc:0 "Pensions, child allowances and unemployment insurance: the welfare state keeps the home front together."
 wif_swe_vougt_advisor:0 "Minister of Defence"
 wif_swe_vougt_advisor_desc:0 "Sweden stays armed in a Europe that has stopped being safe for small countries."
 wif_swe_hedlund_advisor:0 "Agrarian Tactician"
 wif_swe_hedlund_advisor_desc:0 "The farmers' party's sharpest negotiator. He always knows which way the vote will go."
 wif_swe_kock_advisor:0 "Economist of the Supply Board"
 wif_swe_kock_advisor_desc:0 "Sweden's first woman in the cabinet, rationing a country in debt."
