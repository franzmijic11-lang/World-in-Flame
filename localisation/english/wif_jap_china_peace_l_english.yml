l_english:
 wif_jap_china_peace.1.t:0 "Japan Dictates Peace in China"
 wif_jap_china_peace.1.d:0 "With the surrender of its government, China's war with Japan is over, and there was no conference to end it. Tokyo has annexed the Chinese coast from Hebei to Hainan, Nanjing among it, along with all of Guangdong and Guangxi. The heartland of the interior, from Henan and Shanxi to Sichuan and Yunnan, passes to Wang Jingwei's Reorganized National Government as an Imperial Associate of Japan. Whatever Chinese governments are left have laid down their arms against all comers, and the United Front is no more."
 wif_jap_china_peace.1.a:0 "The China Incident is closed."
 wif_jap_china_peace.1.b:0 "We will not forget this humiliation."
 wif_jap_china_peace.1.c:0 "Asia has a new master."
 wif_jap_treaty_port_seized:0 "Seized a Treaty Port"
 wif_jap_china_peace.2.t:0 "Japan Takes Our Chinese Colony"
 wif_jap_china_peace.2.d:0 "Japan's peace has redrawn the coast of China, and our colony there is part of it. Japanese troops crossed the border without a shot fired, and the governor was given an hour to haul down the flag. Tokyo calls the old treaties an insult to Asia that it has now put right. We were not at war with Japan, and nobody asked us."
 wif_jap_china_peace.2.a:0 "We cannot hold it from here."
 wif_jap_china_peace.2.b:0 "Lodge a formal protest."
 wif_jap_china_peace.2.c:0 "Embargo Japan."
