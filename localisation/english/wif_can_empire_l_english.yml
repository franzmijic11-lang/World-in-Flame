l_english:
 wif_can_empire_moves_west:0 "The Empire Moves West"
 wif_can_empire_moves_west_desc:0 "London has made peace with Berlin and Britain is a German protectorate. What is left of the Empire outside Europe and Africa now answers to Ottawa: India, Ceylon, the Caribbean, the Pacific islands and the Gulf - and Burma, Malaya and Singapore if Japan has not taken them. Canada never asked for an empire. It has one now, and it has to hold it."
 wif_can_crown_in_ottawa:0 "The Crown in Ottawa"
 wif_can_crown_in_ottawa_desc:0 "The King takes up residence at Rideau Hall. For the first time the sovereign lives in a dominion, and the whole Empire is watching."
 wif_can_welcome_the_exiles:0 "Welcome the Exiles"
 wif_can_welcome_the_exiles_desc:0 "Ministers, civil servants, officers and scientists who refused to serve the Protectorate cross the Atlantic."
 wif_can_mackenzie_king:0 "Mackenzie King Takes the Helm"
 wif_can_mackenzie_king_desc:0 "Canada's cautious, spiritualist Prime Minister now speaks for an empire of four hundred million."
 wif_can_imperial_federation:0 "Imperial Federation"
 wif_can_imperial_federation_desc:0 "Ottawa becomes the seat of the Empire, not just of Canada. An Imperial Cabinet with ministers from every dominion."
 wif_can_canada_first:0 "Canada First"
 wif_can_canada_first_desc:0 "Canada will hold the Empire because it must, not because it wants to. Ottawa's interests come first."
 wif_can_conscription_question:0 "The Conscription Question"
 wif_can_conscription_question_desc:0 "Quebec voted against conscription once and will again. A plebiscite, a promise and a compromise: not necessarily conscription, but conscription if necessary."
 wif_can_st_laurent:0 "Louis St. Laurent"
 wif_can_st_laurent_desc:0 "A bilingual Quebec lawyer as Mackenzie King's heir binds French Canada to the Empire's cause."
 wif_can_royal_tours:0 "The Royal Tours"
 wif_can_royal_tours_desc:0 "The King sails to Canberra, Wellington, Delhi and Kingston. A monarch who is seen is a monarch who is kept."
 wif_can_realm_endures:0 "The Realm Endures"
 wif_can_realm_endures_desc:0 "Eight years ago Canada inherited a broken empire. The Crown now sits as firmly in Ottawa as it ever did in London."
 wif_can_imperial_secretariat:0 "The Imperial Secretariat"
 wif_can_imperial_secretariat_desc:0 "The Colonial Office reopens in a requisitioned hotel on Wellington Street. Every governor in the Empire gets a new address to report to."
 wif_can_imperial_constabulary:0 "The Imperial Constabulary"
 wif_can_imperial_constabulary_desc:0 "One police service for every colony, trained in Regina and led by men who know the ground."
 wif_can_new_governors:0 "New Governors for Old Colonies"
 wif_can_new_governors_desc:0 "Governors who took their orders from London are replaced by men loyal to Ottawa."
 wif_can_rcmp_imperial:0 "The RCMP Imperial Branch"
 wif_can_rcmp_imperial_desc:0 "The Mounties go abroad. Their intelligence branch watches the agitators, the smugglers and the German consuls."
 wif_can_west_indies_federation:0 "The West Indies Federation"
 wif_can_west_indies_federation_desc:0 "Jamaica, Trinidad, Barbados and the Leewards govern themselves together, under the Crown."
 wif_can_velvet_glove:0 "The Velvet Glove"
 wif_can_velvet_glove_desc:0 "Self-government, local councils, a timetable for independence. Hold the colonies by letting them go slowly."
 wif_can_iron_fist:0 "The Iron Fist"
 wif_can_iron_fist_desc:0 "Garrisons, curfews and emergency powers. Whoever rises will be put down."
 wif_can_indian_ocean:0 "An Imperial Lake"
 wif_can_indian_ocean_desc:0 "Whatever happens in the Pacific, the Indian Ocean must stay the Empire's: Trincomalee, Mauritius, the Seychelles and the Cape route."
 wif_can_ceylon_constitution:0 "A Constitution for Ceylon"
 wif_can_ceylon_constitution_desc:0 "Ceylon's leaders have asked for self-government for twenty years. Give it to them and keep Trincomalee."
 wif_can_aden_gulf:0 "Aden and the Gulf"
 wif_can_aden_gulf_desc:0 "The coaling stations and oil sheikhdoms of the Gulf - a long way from Ottawa and close to the Axis."
 wif_can_willing_members:0 "An Empire of Willing Members"
 wif_can_willing_members_desc:0 "The colonies stay not because Ottawa holds them but because they choose to."
 wif_can_indian_question:0 "The Indian Question"
 wif_can_indian_question_desc:0 "Three hundred and fifty million people, a Viceroy whose King lives in Canada, and a Congress Party that has waited long enough."
 wif_can_viceroy_ottawa:0 "The Viceroy Answers to Ottawa"
 wif_can_viceroy_ottawa_desc:0 "Linlithgow stays at his post and the Indian Civil Service stays loyal - for now."
 wif_can_talk_to_congress:0 "Talk to Congress"
 wif_can_talk_to_congress_desc:0 "Release Nehru. Meet Gandhi. Find out what India's price is."
 wif_can_rule_by_ordinance:0 "Rule by Ordinance"
 wif_can_rule_by_ordinance_desc:0 "The Congress leaders go back to prison and the Viceroy governs by decree."
 wif_can_dominion_promise:0 "Dominion Status after the War"
 wif_can_dominion_promise_desc:0 "A written promise: when the fighting is over, India becomes a self-governing dominion of the Crown."
 wif_can_indian_army:0 "Raise the Indian Army"
 wif_can_indian_army_desc:0 "Two and a half million volunteers - the largest volunteer army in history, if India believes in the cause."
 wif_can_famine_relief:0 "Grain for India"
 wif_can_famine_relief_desc:0 "The rice from Burma has stopped - whether Burma fell or is only cut off - and India is hungry. Ship Canadian wheat, whatever it costs. If Japan's Indian Free State holds Bengal, the grain feeds the refugees who fled west."
 wif_can_princes_league:0 "The Princes and the League"
 wif_can_princes_league_desc:0 "Five hundred princely states and a Muslim League that will not live under a Congress government. Every answer angers someone."
 wif_can_keep_the_jewel:0 "Keep the Jewel"
 wif_can_keep_the_jewel_desc:0 "India stays a colony of the Crown. The garrison is doubled and the promises are forgotten."
 wif_can_dominion_of_india:0 "The Dominion of India"
 wif_can_dominion_of_india_desc:0 "India - whatever part of it Canada still holds - becomes a self-governing dominion with its own army and its own seat at the Imperial Conference."
 wif_can_indian_settlement:0 "The Indian Settlement"
 wif_can_indian_settlement_desc:0 "However it was decided, the Indian question is answered."
 wif_can_pacific_dominions:0 "The Pacific Dominions"
 wif_can_pacific_dominions_desc:0 "Australia and New Zealand followed Britain into the war and Canada out of it. Whether they follow Canada any further is their choice."
 wif_can_imperial_conference:0 "Imperial Conference in Ottawa"
 wif_can_imperial_conference_desc:0 "Curtin, Fraser and Mackenzie King around one table, without London for the first time."
 wif_can_singapore_must_hold:0 "The Pacific Defence Council"
 wif_can_singapore_must_hold_desc:0 "Australia's whole defence was built on a British fleet that never came. Canada promises it will - and sits down with Canberra and Wellington to plan where."
 wif_can_joint_staff:0 "The Commonwealth Joint Staff"
 wif_can_joint_staff_desc:0 "One staff for every Commonwealth army - planning together, training together."
 wif_can_fleet_east:0 "Send the Fleet East"
 wif_can_fleet_east_desc:0 "What remains of the Royal Navy sails for the Pacific."
 wif_can_canberra_pact:0 "The Canberra Pact"
 wif_can_canberra_pact_desc:0 "Canada, Australia and New Zealand pledge to defend each other's Pacific territory."
 wif_can_share_research:0 "Pool the Research"
 wif_can_share_research_desc:0 "Radar from Canada, aircraft from Australia, everything that came out of Britain - shared."
 wif_can_pacific_trade:0 "The Pacific Trade Council"
 wif_can_pacific_trade_desc:0 "Wool, wheat, timber and Malayan rubber go round the Empire, not to Germany's markets."
 wif_can_union_of_crowns:0 "A Union of Crowns"
 wif_can_union_of_crowns_desc:0 "One crown, one foreign policy, one war. Australia and New Zealand are bound to Ottawa."
 wif_can_partnership_equals:0 "A Partnership of Equals"
 wif_can_partnership_equals_desc:0 "Free nations, freely allied. The dominions stay because it suits them."
 wif_can_anzac_endures:0 "The ANZAC Alliance Endures"
 wif_can_anzac_endures_desc:0 "Gallipoli, Tobruk - and now the Pacific. The alliance holds."
 wif_can_arms_of_empire:0 "Arms of the Empire"
 wif_can_arms_of_empire_desc:0 "Canada has a small army, a rescued fleet and an empire to defend on four oceans."
 wif_can_halifax_fleet:0 "Halifax: Home of the Fleet"
 wif_can_halifax_fleet_desc:0 "The Royal Navy's new home port is on the Atlantic coast of Nova Scotia."
 wif_can_air_training_plan:0 "The Air Training Plan"
 wif_can_air_training_plan_desc:0 "The Commonwealth Air Training Plan already turns out pilots by the thousand. Now it trains for an empire."
 wif_can_navy_reborn:0 "The Royal Navy Reborn"
 wif_can_navy_reborn_desc:0 "Same ensign, same traditions, a new Admiralty in Ottawa."
 wif_can_imperial_air_command:0 "Imperial Air Command"
 wif_can_imperial_air_command_desc:0 "Squadrons on four continents under one command."
 wif_can_imperial_army:0 "The Imperial Army"
 wif_can_imperial_army_desc:0 "Canadians, Indians, Malays, West Indians and Africans in one army under the Crown."
 wif_can_garrison_divisions:0 "Colonial Garrison Divisions"
 wif_can_garrison_divisions_desc:0 "Cheap, local, loyal - troops who keep order without stripping the field army."
 wif_can_pacific_war_plan:0 "War Plan Pacific"
 wif_can_pacific_war_plan_desc:0 "If Japan comes south, the Empire must already know where to meet it."
 wif_can_shield_of_empire:0 "Shield of the Empire"
 wif_can_shield_of_empire_desc:0 "No part of the Empire is left undefended."
 wif_can_arsenal_of_empire:0 "The Arsenal of the Empire"
 wif_can_arsenal_of_empire_desc:0 "C. D. Howe, the minister of everything, is told to supply an empire from Canadian factories."
 wif_can_relocate_industry:0 "Relocate British Industry"
 wif_can_relocate_industry_desc:0 "Machine tools, blueprints and engineers smuggled out before the Protectorate closed the ports."
 wif_can_dollar_area:0 "The Dollar Area"
 wif_can_dollar_area_desc:0 "Sterling is a German protectorate's currency now. The Empire trades in Canadian dollars."
 wif_can_hydro_aluminium:0 "Hydro and Aluminium"
 wif_can_hydro_aluminium_desc:0 "The Saguenay dams power the biggest aluminium smelter in the world."
 wif_can_imperial_preference:0 "Imperial Preference"
 wif_can_imperial_preference_desc:0 "Empire goods first, Empire markets first."
 wif_can_hyde_park:0 "The Hyde Park Declaration"
 wif_can_hyde_park_desc:0 "Roosevelt and Mackenzie King pool North America's war production. Canada gets American factories - and American strings."
 wif_can_self_sufficiency:0 "Imperial Self-Sufficiency"
 wif_can_self_sufficiency_desc:0 "The Empire will not trade a German master for an American one."
 wif_can_montreal_laboratory:0 "The Montreal Laboratory"
 wif_can_montreal_laboratory_desc:0 "The Tube Alloys scientists who escaped Britain rebuild the atomic project in Montreal and at Chalk River."
 wif_can_colonial_development:0 "Colonial Development Fund"
 wif_can_colonial_development_desc:0 "Roads, schools and power stations in the colonies - the cheapest garrison there is."
 wif_can_empire_rebuilt:0 "The Empire Rebuilt"
 wif_can_empire_rebuilt_desc:0 "Canada's factories, the Empire's resources."
 wif_can_war_in_the_east:0 "The War in the East"
 wif_can_war_in_the_east_desc:0 "Germany made peace with the Empire. Japan did not have to. How the Pacific war ends decides what kind of empire Canada keeps in Asia."
 wif_can_rising_sun_sets:0 "The Rising Sun Sets"
 wif_can_rising_sun_sets_desc:0 "Japan has surrendered."
 wif_can_armed_peace:0 "An Armed Peace in the Pacific"
 wif_can_armed_peace_desc:0 "Japan never came south, or the war has burnt out. The Empire holds what it held - and watches Tokyo."
 wif_can_fall_of_the_east:0 "The Fall of the East"
 wif_can_fall_of_the_east_desc:0 "Singapore is a Japanese protectorate's capital. Rangoon and Calcutta fly the flag of the Indian Free State."
 wif_can_return_to_malaya:0 "Return to Malaya"
 wif_can_return_to_malaya_desc:0 "The Union Jack goes back up over Singapore, Kuala Lumpur and Kuching."
 wif_can_burma_restored:0 "Burma Restored"
 wif_can_burma_restored_desc:0 "Burma comes back to the Empire - and Aung San's army wants to know on what terms."
 wif_can_hong_kong_returns:0 "The Return to Hong Kong"
 wif_can_hong_kong_returns_desc:0 "A Royal Navy squadron sails into Victoria Harbour to accept the surrender."
 wif_can_tokyo_tribunal:0 "The Tokyo Tribunal"
 wif_can_tokyo_tribunal_desc:0 "Canadian, Australian and Indian judges sit on the bench in Tokyo."
 wif_can_pacific_victory:0 "Victory in the Pacific"
 wif_can_pacific_victory_desc:0 "The whole Empire came through the war - only a different capital is celebrating."
 wif_can_fortress_singapore:0 "Fortress Singapore"
 wif_can_fortress_singapore_desc:0 "This time the guns will face north as well as south."
 wif_can_malay_barrier:0 "The Malay Barrier"
 wif_can_malay_barrier_desc:0 "A line from Burma through Malaya to Darwin, held together."
 wif_can_long_watch:0 "The Long Watch"
 wif_can_long_watch_desc:0 "Peace with Japan is a ceasefire nobody signed."
 wif_can_pacific_standoff:0 "Stalemate in the Pacific"
 wif_can_pacific_standoff_desc:0 "Japan will not come south. The Empire will not go north. Both sides can live with that."
 wif_can_malayan_refugees:0 "The Refugees from the East"
 wif_can_malayan_refugees_desc:0 "Planters, clerks, Chinese merchants and Indian soldiers who would not live under Tokyo arrive in Ceylon and Madras."
 wif_can_hold_the_brahmaputra:0 "Hold the Brahmaputra"
 wif_can_hold_the_brahmaputra_desc:0 "The Indian Free State's border runs through Bengal. It must not run any further west."
 wif_can_fortress_australia:0 "Fortress Australia"
 wif_can_fortress_australia_desc:0 "Papua and the Solomons are gone and Darwin is a frontier town. Canada sends what it can."
 wif_can_free_india_radio:0 "Answer the Free Indian Radio"
 wif_can_free_india_radio_desc:0 "Every night Akamori's broadcasts tell India that Asia has thrown out the white man. Ottawa must answer."
 wif_can_accept_settlement:0 "Accept the Tokyo Settlement"
 wif_can_accept_settlement_desc:0 "Malaya and Burma are lost. Better a smaller empire at peace than a bankrupt one at war."
 wif_can_road_back:0 "The Road Back"
 wif_can_road_back_desc:0 "The Empire will return to Singapore and Rangoon."
 wif_can_east_settled:0 "The East Settled"
 wif_can_east_settled_desc:0 "Whether by victory, stalemate or defeat, the Empire knows where its eastern border lies."
 wif_can_empire_endures:0 "The Empire Endures"
 wif_can_empire_endures_desc:0 "The Empire lost its heart and kept its body. From Ottawa, under the Crown, it endures."
 wif_can_adrift_1:0 "An Empire Adrift"
 wif_can_adrift_1_desc:0 "The Colonial Office, the India Office, the Admiralty and the Treasury were all in London. Their files, their staff and their authority are now in a city that answers to Berlin. Governors from Kingston to Colombo wait for orders that nobody in Ottawa is yet able to give."
 wif_can_adrift_2:0 "An Empire Adrift (Severe)"
 wif_can_adrift_2_desc:0 "The Colonial Office, the India Office, the Admiralty and the Treasury were all in London. Their files, their staff and their authority are now in a city that answers to Berlin. Governors from Kingston to Colombo wait for orders that nobody in Ottawa is yet able to give."
 wif_can_adrift_3:0 "An Empire Adrift (Crippling)"
 wif_can_adrift_3_desc:0 "The Colonial Office, the India Office, the Admiralty and the Treasury were all in London. Their files, their staff and their authority are now in a city that answers to Berlin. Governors from Kingston to Colombo wait for orders that nobody in Ottawa is yet able to give."
 wif_can_quebec_idea:0 "Quebec Will Not Fight for London"
 wif_can_quebec_idea_desc:0 "French Canada voted against conscription in 1917 and remembers what came of it. A war for an empire that London no longer rules is not a war Quebec means to fight."
 wif_can_exiles_idea:0 "The Exiles"
 wif_can_exiles_idea_desc:0 "Ministers, scientists and officers who would not serve the Protectorate."
 wif_can_mackenzie_king_idea:0 "Mackenzie King at the Helm"
 wif_can_mackenzie_king_idea_desc:0 "Cautious, patient and never quite pinned down."
 wif_can_imperial_cabinet_idea:0 "The Imperial Cabinet"
 wif_can_imperial_cabinet_idea_desc:0 "Ministers from every dominion, sitting in Ottawa."
 wif_can_quebec_furious_idea:0 "Quebec Is Furious"
 wif_can_quebec_furious_idea_desc:0 "Ottawa has made itself the capital of an empire Quebec never wanted."
 wif_can_conscription_idea:0 "Conscription if Necessary"
 wif_can_conscription_idea_desc:0 "Not necessarily conscription, but conscription if necessary."
 wif_can_st_laurent_idea:0 "The Heir from Quebec"
 wif_can_st_laurent_idea_desc:0 "A bilingual heir binds French Canada to the cause."
 wif_can_crown_commonwealth_idea:0 "The Crown of the Commonwealth"
 wif_can_crown_commonwealth_idea_desc:0 "The Crown sits as firmly in Ottawa as it ever did in London."
 wif_can_rcmp_idea:0 "The RCMP Imperial Branch"
 wif_can_rcmp_idea_desc:0 "The Mounties watch the agitators, the smugglers and the German consuls."
 wif_can_velvet_glove_idea:0 "The Velvet Glove"
 wif_can_velvet_glove_idea_desc:0 "Councils, constitutions and timetables cost time and patience."
 wif_can_air_training_idea:0 "The Air Training Plan"
 wif_can_air_training_idea_desc:0 "Pilots by the thousand, for an empire."
 wif_can_navy_reborn_idea:0 "The Royal Navy Reborn"
 wif_can_navy_reborn_idea_desc:0 "A new Admiralty in Ottawa."
 wif_can_air_command_idea:0 "Imperial Air Command"
 wif_can_air_command_idea_desc:0 "Squadrons on four continents under one command."
 wif_can_imperial_army_idea:0 "The Imperial Army"
 wif_can_imperial_army_idea_desc:0 "One army under the Crown."
 wif_can_pacific_war_plan_idea:0 "War Plan Pacific"
 wif_can_pacific_war_plan_idea_desc:0 "If Japan comes south, the Empire knows where to meet it."
 wif_can_shield_idea:0 "Shield of the Empire"
 wif_can_shield_idea_desc:0 "No part of the Empire left undefended."
 wif_can_arsenal_idea:0 "The Arsenal of the Empire"
 wif_can_arsenal_idea_desc:0 "C. D. Howe supplies an empire."
 wif_can_british_engineers_idea:0 "British Engineers"
 wif_can_british_engineers_idea_desc:0 "Machine tools and blueprints smuggled out of Britain."
 wif_can_dollar_area_idea:0 "The Dollar Area"
 wif_can_dollar_area_idea_desc:0 "The Empire trades in Canadian dollars."
 wif_can_imperial_preference_idea:0 "Imperial Preference"
 wif_can_imperial_preference_idea_desc:0 "Empire goods first, Empire markets first."
 wif_can_empire_rebuilt_idea:0 "The Empire Rebuilt"
 wif_can_empire_rebuilt_idea_desc:0 "Canada's factories, the Empire's resources."
 wif_can_eastern_defence_idea:0 "The War in the East"
 wif_can_eastern_defence_idea_desc:0 "Whatever Japan does, the Empire will be ready for it."
 wif_can_armed_peace_idea:0 "An Armed Peace"
 wif_can_armed_peace_idea_desc:0 "The Empire holds what it held - and watches Tokyo."
 wif_can_refugee_scientists_idea:0 "Refugees from the East"
 wif_can_refugee_scientists_idea_desc:0 "Engineers and doctors who would not live under Tokyo."
 wif_can_refugee_strain_idea:0 "The Refugee Camps"
 wif_can_refugee_strain_idea_desc:0 "Ceylon and Madras are overflowing."
 wif_can_long_watch_idea:0 "The Long Watch"
 wif_can_long_watch_idea_desc:0 "Peace with Japan is a ceasefire nobody signed."
 wif_can_peace_dividend_idea:0 "The Peace Dividend"
 wif_can_peace_dividend_idea_desc:0 "A smaller empire at peace."
 wif_can_pacific_victory_idea:0 "Victory in the Pacific"
 wif_can_pacific_victory_idea_desc:0 "The whole Empire came through the war."
 wif_can_empire_endures_idea:0 "The Empire Endures"
 wif_can_empire_endures_idea_desc:0 "From Ottawa, under the Crown, it endures."
 wif_can_pdc_idea:0 "The Pacific Defence Council"
 wif_can_pdc_idea_desc:0 "Canberra, Wellington and Ottawa plan the defence of the Pacific together."
 wif_can_joint_staff_idea:0 "The Commonwealth Joint Staff"
 wif_can_joint_staff_idea_desc:0 "One staff for every Commonwealth army."
 wif_can_union_of_crowns_idea:0 "A Union of Crowns"
 wif_can_union_of_crowns_idea_desc:0 "One crown, one foreign policy - and it is made in Ottawa."
 wif_can_partnership_idea:0 "A Partnership of Equals"
 wif_can_partnership_idea_desc:0 "Free nations, freely allied."
 wif_can_malay_barrier_idea:0 "The Malay Barrier"
 wif_can_malay_barrier_idea_desc:0 "A line from Burma through Malaya to Darwin, held together."
 wif_can_raj_ordinance_idea:0 "Rule by Ordinance"
 wif_can_raj_ordinance_idea_desc:0 "The Viceroy governs by decree."
 wif_can_raj_army_idea:0 "The Indian Army"
 wif_can_raj_army_idea_desc:0 "The largest volunteer army in history."
 wif_can_raj_jewel_idea:0 "The Jewel Kept"
 wif_can_raj_jewel_idea_desc:0 "The garrison is doubled and the promises are forgotten."
 wif_can_hyde_park_opinion:0 "The Hyde Park Declaration"
 wif_can_unlock_decisions_tt:0 "Unlocks the §YImperial Unrest§! decisions."
 wif_can_iu_m5_tt:0 "Imperial Unrest: §G-5§!"
 wif_can_ac_p5_tt:0 "ANZAC Cohesion: §G+5§!"
 wif_can_churchill_tt:0 "§YWinston Churchill§! becomes available as a political advisor."
 wif_can_ac_p15_tt:0 "ANZAC Cohesion: §G+15§!"
 wif_can_iu_m10_tt:0 "Imperial Unrest: §G-10§!"
 wif_can_fed_conscription_tt:0 "The Conscription Question will cost §R75§! political power."
 wif_can_ac_m10_tt:0 "ANZAC Cohesion: §R-10§!"
 wif_can_canada_first_tt:0 "Granting a colony self-government no longer raises §YImperial Unrest§!."
 wif_can_conscription_cost_tt:0 "If we chose §YImperial Federation§!: §R-75§! political power to buy Quebec's consent."
 wif_can_st_laurent_tt:0 "Louis St. Laurent will succeed Mackenzie King as Prime Minister in §Y1948§!."
 wif_can_ac_p10_tt:0 "ANZAC Cohesion: §G+10§!"
 wif_can_inu_m5_tt:0 "Indian Unrest: §G-5§!"
 wif_can_realm_endures_tt:0 "The Crown in Exile becomes §YThe Crown of the Commonwealth§!."
 wif_can_constabulary_tt:0 "§YSuppress Unrest§! costs §G25%§! less political power."
 wif_can_governors_tt:0 "§YImperial Unrest§! rises §G0.5§! a month slower."
 wif_can_rcmp_tt:0 "A colony about to revolt now sends a §Ywarning a month in advance§!."
 wif_can_west_indies_tt:0 "Our §YCaribbean§! colonies can no longer revolt."
 wif_can_iu_m20_tt:0 "Imperial Unrest: §G-20§!"
 wif_can_velvet_tt:0 "§YImperial Unrest§! rises §G0.5§! a month slower."
 wif_can_iron_fist_tt:0 "§YSuppress Unrest§! is §Gtwice as strong§!.\nA colony that revolts anyway adds §R+10§! Imperial Unrest."
 wif_can_indian_ocean_tt:0 "§G+1§! naval base in §YCeylon§!, §YMauritius§! and the §YSeychelles§!, where we own them."
 wif_can_ceylon_tt:0 "§YCeylon§! can no longer revolt. §G+1§! infrastructure in Ceylon."
 wif_can_aden_tt:0 "In §YAden§!, if we own it: §G+1§! refinery and §G+1§! naval base."
 wif_can_iu_m15_tt:0 "Imperial Unrest: §G-15§!"
 wif_can_willing_tt:0 "§YImperial Unrest§! no longer rises on its own."
 wif_can_indian_question_tt:0 "§YIndian Unrest§! is shown in the §YThe Empire§! decisions."
 wif_can_inu_m10_tt:0 "Indian Unrest: §G-10§!"
 wif_can_inu_m15_tt:0 "Indian Unrest: §G-15§!"
 wif_can_ordinance_tt:0 "§YIndian Unrest§! rises §R1§! a month faster for the rest of the tree."
 wif_can_inu_m20_tt:0 "Indian Unrest: §G-20§!"
 wif_can_indian_army_tt:0 "If we chose §YRule by Ordinance§!: Indian Unrest §R+10§!."
 wif_can_princes_tt:0 "Unlocks §YThe Indian Settlement§!."
 wif_can_inu_p20_tt:0 "Indian Unrest: §R+20§!"
 wif_can_dominion_india_tt:0 "§YIndia§! becomes a self-governing dominion and joins the Free Commonwealth. §YIndian Unrest§! disappears."
 wif_can_anzac_shown_tt:0 "§YANZAC Cohesion§! is shown in the §YThe Empire§! decisions."
 wif_can_canberra_tt:0 "§YANZAC Cohesion§! falls §G0.5§! a month slower."
 wif_can_union_tt:0 "§YANZAC Cohesion§! no longer falls on its own."
 wif_can_ac_p20_tt:0 "ANZAC Cohesion: §G+20§!"
 wif_can_anzac_endures_tt:0 "§YAustralia§! and §YNew Zealand§! can no longer leave the Free Commonwealth."
 wif_can_halifax_tt:0 "In §YNova Scotia§!: §G+2§! naval base and §G+2§! dockyards."
 wif_can_garrison_tt:0 "We get the §YColonial Garrison§! template and §G4§! divisions.\n§YSuppress Unrest§! also lowers Imperial Unrest by §G2§! more."
 wif_can_war_plan_tt:0 "If we are at war with §YJapan§!: ANZAC Cohesion §G+10§!."
 wif_can_hyde_park_tt:0 "§YImperial Unrest§! rises §R0.5§! a month faster (the colonies see Washington's hand)."
 wif_can_development_tt:0 "§G+1§! infrastructure in §Y6§! of our colonial states."
 wif_can_east_unlock_tt:0 "Unlocks the three outcomes below - only the one that matches the war can be taken."
 wif_can_malaya_tt:0 "We take back §YMalaya§!, §YSingapore§! and §YBritish Borneo§! from Japan or its puppets, if they still hold them."
 wif_can_fortress_singapore_tt:0 "In §YSingapore§! and §YJohor§!, where we own them: §G+2§! forts and §G+2§! coastal forts."
 wif_can_burma_tt:0 "We take back §YBurma§! from Japan or its puppets, if they hold it. Burma can no longer revolt."
 wif_can_barrier_tt:0 "§G+1§! fort along the borders of every §YBurmese§! and §YMalayan§! state we own."
 wif_can_brahmaputra_tt:0 "§G+2§! forts in every Indian state that borders the §YIndian Free State§!."
 wif_can_fortress_australia_tt:0 "§YAustralia§! gets §G+2§! forts and §G+1§! naval base in the §YNorthern Territory§! and §YQueensland§!."
 wif_can_hong_kong_tt:0 "We take back §YHong Kong§! if Japan or its puppets hold it. §G+1§! naval base in Hong Kong."
 wif_can_radio_tt:0 "The §YIndian Free State§! no longer raises Indian Unrest."
 wif_can_road_back_tt:0 "War goals on the §YIndian Free State§! and §YSouth East Asia§! for the land the Empire lost."
 wif_can_iu_p5_tt:0 "Imperial Unrest: §R+5§!"
 wif_can_endures_tt:0 "§YImperial Unrest§! and the colonial revolts §Gend§!.\nEvery member of the Free Commonwealth gains §G+5%§! stability for each member (at most §G+25%§!)."
 wif_can_holds_india_trigger_tt:0 "The §YRaj§! is still a Canadian subject"
 wif_can_japan_out_trigger_tt:0 "§YJapan§! has capitulated or no longer exists"
 wif_can_armed_peace_trigger_tt:0 "We are at peace with §YJapan§!, Japan has neither won in the Pacific nor surrendered, and our new tree has run for at least a year"
 wif_can_japan_won_trigger_tt:0 "§YJapan§!'s Pacific settlement has been made"
 wif_can_federation_trigger_tt:0 "Has completed §YImperial Federation§!"
 wif_can_dominion_promised_trigger_tt:0 "Has completed §YDominion Status after the War§!"
 wif_can_montreal_bonus:0 "The Montreal Laboratory"
 wif_can_commonwealth_research_name:0 "Free Commonwealth Research"
 wif_can_commonwealth_research_desc:0 "Radar from Canada, aircraft from Australia, and everything that came out of Britain."
 wif_can_commonwealth_strength:0 "The Free Commonwealth"
 wif_can_empire_category:0 "The Empire"
 wif_can_empire_category_desc:0 "Imperial Unrest: §Y[?ROOT.wif_can_iu|0]§!/100, rising [?ROOT.wif_can_iu_rate|1] a month. At §R60§! or more a colony may revolt each month.\nIndian Unrest: §Y[?ROOT.wif_can_inu|0]§!/100, rising [?ROOT.wif_can_inu_rate|1] a month while the Raj is ours. At §R80§! India may rise and break free.\nANZAC Cohesion: §Y[?ROOT.wif_can_ac|0]§!/100, changing [?ROOT.wif_can_ac_rate|1] a month. Below §R30§! Australia and New Zealand may leave the Free Commonwealth."
 wif_can_suppress_unrest_decision:0 "Suppress Unrest"
 wif_can_suppress_unrest_decision_desc:0 "Curfews, arrests and a show of force in the most restless colonies."
 wif_can_suppress_unrest_cheap_decision:0 "Suppress Unrest"
 wif_can_suppress_unrest_cheap_decision_desc:0 "The Imperial Constabulary makes arrests where the governors point."
 wif_can_grant_self_government:0 "Grant Self-Government to [FROM.GetName]"
 wif_can_grant_self_government_desc:0 "Let [FROM.GetName] govern itself as a dominion of the Crown. It will never revolt - but the other colonies will ask why they were not first."
 wif_can_suppress_tt:0 "Imperial Unrest: §G-8§! (§G-16§! after §YThe Iron Fist§!; §G2§! more after §YColonial Garrison Divisions§!)"
 wif_can_self_government_tt:0 "Imperial Unrest: §R+5§! (none after §YCanada First§!). The colony can never revolt."
 wif_can.1.t:0 "Revolt in [wif_can_revolt_state.GetName]"
 wif_can.1.d:0 "The governor's last cable was brief. [wif_can_rebel.GetName] has declared that it no longer owes anything to a Crown that sits in Ottawa, and men who wore the King's uniform a week ago are holding the government buildings. London would have sent a battalion. Ottawa has to decide whether it can."
 wif_can.1.a:0 "Restore order."
 wif_can.2.t:0 "Warning from the RCMP"
 wif_can.2.d:0 "The Imperial Branch has been watching the meetings, the arms caches and the coded letters. Its report is blunt: unless something changes, [wif_can_revolt_state.GetName] will rise within the month."
 wif_can.2.a:0 "We have a month."
 wif_can.2.tt:0 "If §YImperial Unrest§! is still §R60§! or more next month, §Y[wif_can_revolt_state.GetName]§! will revolt."
 wif_can.3.t:0 "Quit India"
 wif_can.3.d:0 "The Congress has called the country out, and this time the country has answered. Railway lines are torn up, police stations burn and the Viceroy's council has stopped meeting. Whatever India owed to a King in London, it has decided it owes nothing to one in Ottawa."
 wif_can.3.a:0 "India is lost."
 wif_can.4.t:0 "[wif_can_anzac_leaver.GetName] Leaves the Free Commonwealth"
 wif_can.4.d:0 "[wif_can_anzac_leaver.GetName] has concluded that Ottawa cannot defend it and does not listen to it. Its government has announced that it will make its own way in the Pacific."
 wif_can.4.a:0 "The alliance is weaker for it."
 wif_can.5.t:0 "The Colonies Are Restless"
 wif_can.5.d:0 "Reports from the colonies grow darker every week. Strikes, riots, attacks on the police. Our governors warn that a colony may rise in open revolt at any moment.\n\nImperial Unrest has reached §R60§!. Each month from now on a colony may revolt."
 wif_can.5.a:0 "Hold them together."
 wif_can.6.t:0 "India on the Brink"
 wif_can.6.d:0 "The Viceroy reports that the Congress is preparing a campaign of mass disobedience. If Indian Unrest reaches §R80§!, it may begin."
 wif_can.6.a:0 "We must act now."
 wif_can.7.t:0 "The Dominions Drift Away"
 wif_can.7.d:0 "Canberra and Wellington have begun to talk about their own interests in the Pacific, and about Washington. If ANZAC Cohesion falls below §R30§!, Australia and New Zealand may leave the Free Commonwealth."
 wif_can.7.a:0 "They must be reassured."
 wif_can.8.t:0 "Mackenzie King Retires"
 wif_can.8.d:0 "After more than twenty years at the head of the government, Mackenzie King has stepped down. Louis St. Laurent, the bilingual lawyer from Quebec, is the Empire's new Prime Minister."
 wif_can.8.a:0 "Welcome, Prime Minister."
