l_english:
 GER_aging_fuhrer:0 "Aging Fuhrer"
 GER_aging_fuhrer_desc:0 "As the Fuhrer grows older, his grip on power remains unshaken - held firmly in place by the unwavering loyalty of his inner circle. But loyalty born of ambition is a fickle thing, and the whispers in the corridors of the Reich grow louder with each passing year... For now, however, the circle holds."
 GER_aging_fuhrer_inner_circle_slot_tt:0 "Unlocks a §Y4th Inner Circle§! slot."
 GER_inner_circle.01.d:0 "Replace [GetAscendedAdvisorName4]"
 GER_inner_circle.01.e:0 "[GetAscendingAdvisorName] is not worthy of the Fuhrer's trust"
 GER_inner_circle.02.d:0 "[GetAscendedAdvisorName4] will carry on the Fuhrer's legacy."
 GER_inner_circle.02.e:0 "We are not ready for a change in leadership."
 GER_ascended_advisor_4_name_text:0 "§Y[GetAscendedAdvisorName4]§!"

 # Single-focus form of vanilla GER_inner_circle_industrial_me_focuses_tt.
 # That one names two focuses; Todt's branch is gone, so Speer and Goring
 # each lock only one focus now.
 wif_inner_circle_industrial_me_focus_tt:0 "(Completing this focus will §Rlock§! §Y$FOCUS_1$§! for its respective $GER_inner_circle_member_title$)"
 GER_force_americans_to_see_reason_tt:0 "The §YUnited States§! will be offered a §Yseparate peace§!"
 GER_force_americans_allied_tt:0 "The §YUnited States§! and §YFrance§! are in a faction with the §YUnited Kingdom§!"
 GER_force_americans_capitulated_tt:0 "The §YUnited Kingdom§! and §YFrance§! have both §Rcapitulated§!"
 wif_negotiated_settlement:0 "Negotiated Settlement"
 wif_negotiated_settlement_desc:0 "We came to terms with Germany rather than fight a war across an ocean for allies already beaten. The agreement holds us out of any alliance, and the public has no appetite to test it. In five years this will be a matter for historians. Until then, we stand alone."
 wif_usa_peace.1.t:0 "Berlin Offers Terms"
 wif_usa_peace.1.desc:0 "The German ambassador has delivered a note. With Britain and France both fallen, the Reich proposes an end to hostilities between our two nations on the basis of the situation as it stands. No indemnity is demanded, no territory of ours is claimed, and no occupation is proposed. In exchange we are to withdraw from the alliance and remain outside any such arrangement for five years.\n\nThe alternative is a war continued alone, across three thousand miles of ocean, for a coalition that no longer exists in Europe."
 wif_usa_peace.1.a:0 "There is nothing left in Europe to fight for. Accept."
 wif_usa_peace.1.b:0 "We do not treat with tyrants. The war continues."
 wif_usa_peace.2.t:0 "The Americans See Reason"
 wif_usa_peace.2.desc:0 "Washington has accepted. The United States withdraws from the alliance and from the war, bound for five years to stand outside any faction. The other powers of the Americas have followed where Washington led. What remains of the enemy coalition fights on without a single friend west of the Atlantic."
 wif_usa_peace.2.a:0 "The war in the west is over."
 wif_usa_peace.3.t:0 "The Americans Refuse"
 wif_usa_peace.3.desc:0 "Washington has rejected our terms out of hand. The Americans intend to continue the war, alone if they must. So be it - they will find the Atlantic a very wide ocean."
 wif_usa_peace.3.a:0 "Then let them come."
 wif_pacific_islands_to_japan_tt:0 "If §YJapan§! is part of the settlement, the outlying §YAmerican Pacific possessions§! pass to Japan. §YHawaii§! and §YMidway§! are conceded §Yonly§! if Japanese forces already hold them."

 # Totaler Sieg - the capstone in the old Establish Protectorates in America slot.
 GER_totaler_sieg:0 "Totaler Sieg"
 GER_totaler_sieg_desc:0 "Bolshevism is broken, the Americans have been brought to reason and the continent answers to Berlin. The war is won. Now the Reich must be given a form worthy of its victory: a new name, a new capital, and a monument to stand for a thousand years."
 GER_totaler_sieg_austria_tt:0 "Controls every state that is a core of §YAustria§!"
 GER_totaler_sieg_volkshalle_tt:0 "Replaces the §Y$landmark_berlin_reichstag$§! with the §Y$landmark_berlin_volkshalle$§! at level §Y2/2§!, giving §G+10%§! stability"
 wif_totaler_sieg.1.t:0 "Hitler's Speech"
 wif_totaler_sieg.1.desc:0 "Beneath the dome of the newly finished Volkshalle, before a hundred and fifty thousand of the faithful, Adolf Hitler today proclaimed the end of the war and the birth of the Greater German Reich, with Germania as its capital.\n\n\"From the Atlantic to the Volga, from the North Cape to the Mediterranean, Europe has found its order. The Bolshevik is driven back behind the Urals, the old powers of the West are humbled, and across the ocean even the Americans have learned what it costs to stand against us. For the first time in two thousand years this continent has one master and one will. That will is German.\"\n\nAcross the occupied capitals the speech was broadcast on every frequency. Few who heard it doubted what it meant: the fate of Europe is no longer debated in its parliaments, but decided in Germania."
 wif_totaler_sieg.1.a:0 "Sieg Heil!"
 wif_totaler_sieg.1.b:0 "Europe has a new master."

 # The post-victory tree (common/national_focus/wif_ger_victory.txt).
 GER_totaler_sieg_new_tree_tt:0 "§RThe entire German focus tree is replaced.§! Only §YTotaler Sieg§! remains, and new focuses open beneath it."
 GER_totaler_sieg_achieved:0 "$GER_totaler_sieg$"
 GER_totaler_sieg_achieved_desc:0 "$GER_totaler_sieg_desc$"
 GER_a_weakened_king_among_vultures:0 "A Weakened King among Vultures"
 GER_a_weakened_king_among_vultures_desc:0 "The war is won, and the man who won it is failing. His hands shake, his rages grow wilder and his orders stranger, and the men around him have stopped looking to him and started looking at each other."
 GER_a_weakened_king_among_vultures_traits_tt:0 "§YAdolf Hitler§! loses all his leader traits, including §YDer Führer§!, and gains §YTremors§!, §YFrequent Outbursts and Overinvolvement in the Military§! and §YDetached from Reality§!."
 wif_ger_visibly_aging_fuhrer:0 "Visibly Aging Führer"
 wif_ger_visibly_aging_fuhrer_desc:0 "The Führer can no longer hide what the years and the war have done to him. The inner circle that once held firm now waits for the end."
 wif_ger_tremors:0 "Tremors"
 wif_ger_frequent_outbursts:0 "Frequent Outbursts and Overinvolvement in the Military"
 wif_ger_detached_from_reality:0 "Detached from Reality"
 GER_schemes_of_himmler:0 "Schemes of Himmler"
 GER_schemes_of_himmler_desc:0 "While the Führer rages in his bunker, the Reichsführer-SS builds an army of his own. Its divisions answer to Himmler first and to the Wehrmacht not at all, and their first fortress rises in Luxembourg, far from Berlin's eyes."
 GER_schemes_of_himmler_needs_himmler_tt:0 "This focus can only be worked on by §Y$CHARACTER$§!, and only if he sits in the §YInner Circle§! when §YA Weakened King among Vultures§! is completed."
 GER_schemes_of_himmler_units_tt:0 "Two §Yveteran§!, fully equipped §YWaffen SS Infanterie Divisions§! are raised in §YLuxembourg§!."
 wif_ger_himmlers_waffen_ss:0 "Himmler's Waffen-SS"
 wif_ger_himmlers_waffen_ss_desc:0 "The Reichsführer's private army is drawn from the most fanatical volunteers of the Reich and its conquests. What it lacks in training it makes up for in zeal."
 GER_make_the_fuhrer_only_trust_the_ss:0 "Make the Führer Only Trust the SS"
 GER_make_the_fuhrer_only_trust_the_ss_desc:0 "Every failure at the front reaches the bunker as treachery by the generals, and every report bears the Reichsführer's seal. The Führer no longer trusts his Wehrmacht, only the black-clad men who stand guard at his door."
 GER_make_the_fuhrer_only_trust_the_ss_needs_himmler_tt:0 "This focus can only be worked on by §Y$CHARACTER$§!, who begins it the moment §YSchemes of Himmler§! is completed, if he still sits in the §YInner Circle§!."
 GER_make_the_fuhrer_only_trust_the_ss_units_tt:0 "Two §Yveteran§!, fully equipped §YWaffen SS Infanterie Divisions§! are raised in §YBerlin§!."
 GER_finish_the_purification_of_our_lands:0 "Finish the Purification of Our Lands"
 GER_finish_the_purification_of_our_lands_desc:0 "The war is won, and the lands the Reich has claimed are to be German in fact as well as in name. In the East, whole districts are emptied, and families from the Ostmark are sent to take their place."
 GER_finish_the_purification_of_our_lands_population_tt:0 "§YKatowice§!, §YŁódź§!, §YPłock§! and §YBiałystok§! lose §R50%§! of their population.\n§YOstmark§! loses §R10%§! of its population, divided evenly between those four states as settlers."
 wif_ger_himmlers_waffen_ss_2:0 "Himmler's Waffen-SS"
 wif_ger_facade_economy_modifier:0 "Facade Economy"
 wif_ger_facade_economy_modifier_desc:0 "The Reich calls itself self-sufficient, and the newsreels agree. Behind the facade the MEFO debt was never repaid, only rolled over again and again. Each month more of the nation's industry must go to keeping up appearances at home."
 wif_ger_facade_economy_cg_tt:0 "Consumer Goods Factories: §R+[?GER_industrial_consumer_goods_factor|%1]§!\nGrows by §R+0.5%§! every month, without limit."
 wif_ger_replace_mefo_with_facade_economy_tt:0 "§Y$GER_mefo_bills$§! becomes the §Y$wif_ger_facade_economy_modifier$§!. Its consumer goods reset to §G0%§!, then grow by §R+0.5%§! every month, without limit."
 wif_ger_invincible_army_1:0 "The German Army, Invincible"
 wif_ger_invincible_army_1_desc:0 "Newsreels of the victories play in every cinema in the Reich. Young men who watched them want to be part of the next one."
 wif_ger_invincible_army_1_tt:0 "Base battalion cap: §G+5%§!"
 wif_ger_invincible_army_2:0 "$wif_ger_invincible_army_1$"
 wif_ger_invincible_army_2_desc:0 "The Ministry of Propaganda has made the Wehrmacht a legend. Every victory is retold until it seems inevitable, and every family wants a son in field grey."
 wif_ger_invincible_army_2_tt:0 "Base battalion cap: §G+10%§!"
 wif_ger_invincible_army_3:0 "$wif_ger_invincible_army_1$"
 wif_ger_invincible_army_3_desc:0 "No army in history has won as the German army has won. The nation believes it cannot be beaten, and it gives the army every man it asks for."
 wif_ger_invincible_army_3_tt:0 "Base battalion cap: §G+15%§!"
 wif_ger_himmlers_waffen_ss_2_desc:0 "The Führer's orders now pass through Himmler's hands before they reach the generals, and the generals know it. Officers hesitate, second-guess and cover themselves, while the Reichsführer's private army is given the men, the guns and the glory."
