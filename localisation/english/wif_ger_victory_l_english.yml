 OSB_communism_DEF:0 "the Burgundian Commune"
 WMG:0 "German Military Government"
 WMG_DEF:0 "the German Military Government"
 WMG_ADJ:0 "German"
 WMG_neutrality:0 "German Military Government"
 WMG_neutrality_DEF:0 "the German Military Government"
 WMG_fascism:0 "German Military Government"
 WMG_fascism_DEF:0 "the German Military Government"
 WMG_democratic:0 "Provisional German Republic"
 WMG_democratic_DEF:0 "the Provisional German Republic"
