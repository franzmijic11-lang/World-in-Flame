l_english:
 # Germany after Totaler Sieg: Speer's economy and the rest of Himmler's path
 # (common/national_focus/wif_ger_victory.txt).

 # --- Shared tooltips -----------------------------------------------------
 wif_ger_needs_speer_tt:0 "§YAlbert Speer§! sits in the §YInner Circle§!"
 wif_ger_cg_minus_1_tt:0 "§YFacade Economy§! consumer goods: §G-1%§! (never below 0%)"
 wif_ger_cg_minus_5_tt:0 "§YFacade Economy§! consumer goods: §G-5%§! (never below 0%)"
 wif_ger_cg_minus_10_tt:0 "§YFacade Economy§! consumer goods: §G-10%§! (never below 0%)"
 wif_ger_cg_minus_15_tt:0 "§YFacade Economy§! consumer goods: §G-15%§! (never below 0%)"
 wif_ger_cg_minus_20_tt:0 "§YFacade Economy§! consumer goods: §G-20%§! (never below 0%)"
 wif_ger_cg_plus_3_tt:0 "§YFacade Economy§! consumer goods: §R+3%§!"
 wif_ger_cg_plus_5_tt:0 "§YFacade Economy§! consumer goods: §R+5%§!"
 wif_ger_rate_minus_0_05_tt:0 "§YFacade Economy§! growth: §G-0.05%§! a month, for good"
 wif_ger_rate_minus_0_1_tt:0 "§YFacade Economy§! growth: §G-0.1%§! a month, for good"
 wif_ger_rate_minus_0_15_tt:0 "§YFacade Economy§! growth: §G-0.15%§! a month, for good"
 wif_ger_rate_plus_0_1_tt:0 "§YFacade Economy§! growth: §R+0.1%§! a month, for good"
 wif_ger_himmler_next_scheme_tt:0 "This focus can only be worked on by §Y$CHARACTER$§!, who begins it the moment the scheme before it is completed, if he still sits in the §YInner Circle§!."
 GER_offer_retirement_needs_tt:0 "This focus can only be worked on by §Y$CHARACTER$§!, if he still sits in the §YInner Circle§!. He begins it once §YA Dream of Neu Burgundy§! and §YRequisition Territory from Our French Puppet§! are both completed, and only §Yduring or after the civil war in Moskowien§!."

 # --- Speer: the trunk ----------------------------------------------------
 GER_give_the_people_the_resources_of_the_east:0 "Give the People the Resources of the East"
 GER_give_the_people_the_resources_of_the_east_desc:0 "The war is over and the East is ours. The people were promised its grain, its oil and its wealth, and Speer is charged with bringing them home. He is the first to read the real accounts."
 GER_give_the_people_the_resources_of_the_east_tt:0 "If §YMefo Bills§!, §YEconomy of Conquest§!, §YRecovering Economy§! or §YWirtschaftswunder§! is still in force, it becomes the §YFacade Economy§!, keeping its values.\nThe §YFacade Economy§!'s consumer goods grow by a rate this tree can change: §R+0.5%§! a month to begin with, and never less than §R+0.1%§!.\nNo cut in this tree takes consumer goods below §G0%§!."
 GER_reich_ministry_for_the_total_economy:0 "Reich Ministry for the Total Economy"
 GER_reich_ministry_for_the_total_economy_desc:0 "Speer takes every economic ministry of the Reich under his own. Four-year plans, armaments, labour and trade now answer to one man, and the old ministers resent every hour of it."
 GER_reich_ministry_for_the_total_economy_tt:0 "Gain §YReich Ministry for the Total Economy§!: Max factory efficiency §G+5%§!, Political power gain §R-10%§!. Later focuses in this tree add to it.\nUnlocks the §YEconomic Council§! decisions."

 # --- Speer: the East -----------------------------------------------------
 GER_quotas_for_the_reichskommissariate:0 "Quotas for the Reichskommissariate"
 GER_quotas_for_the_reichskommissariate_desc:0 "Every Reichskommissariat is given a quota of grain, coal and labour for the Reich. The Reichskommissare are told to meet it, and not told how."
 GER_quotas_for_the_reichskommissariate_tt:0 "Unlocks a §Yrequisition decision§! for each of §YOstland§!, §YUkraine§!, §YMoskowien§! and §YKaukasien§!, while it is a German subject. Each costs §Y50§! political power (§Y75§! once the SS has its Economic Empire), once a year:\n Germany: §YFacade Economy§! consumer goods §G-1%§!\n That Reichskommissariat: §YRequisitioned§! for a year, and §R-25,000§! manpower"
 GER_ukrainian_grain_for_german_tables:0 "Ukrainian Grain for German Tables"
 GER_ukrainian_grain_for_german_tables_desc:0 "The black earth of the Ukraine will feed the Reich. The villages that grow the grain will keep what the quota leaves them, which is nothing."
 GER_ukrainian_grain_for_german_tables_tt:0 "§YFacade Economy§! growth: §G-0.1%§! a month, for as long as §YReichskommissariat Ukraine§! is a German subject.\n§YReichskommissariat Ukraine§! gains §YGrain Requisitions§!."
 GER_the_oil_of_the_caucasus:0 "The Oil of the Caucasus"
 GER_the_oil_of_the_caucasus_desc:0 "Baku and Maikop were the prize of the whole war in the East. Their oil now flows west, and the Reichskommissariat that sits on it is left to run on what spills."
 GER_the_oil_of_the_caucasus_tt:0 "Germany gains the §Yresource rights§! to every oil-producing state of §YReichskommissariat Kaukasien§!.\n§YReich Ministry for the Total Economy§!: Max fuel §G+20%§!.\n§YFacade Economy§! growth: §G-0.05%§! a month, for as long as §YReichskommissariat Kaukasien§! is a German subject.\n§YReichskommissariat Kaukasien§! gains §YOil Fields Under Reich Control§!."
 GER_organisation_todt_in_the_east:0 "Organisation Todt in the East"
 GER_organisation_todt_in_the_east_desc:0 "Railways, roads and factories for the East, built by the East. Organisation Todt brings the engineers; the Reichskommissariate supply the hands."
 GER_organisation_todt_in_the_east_tt:0 "Every eastern §YReichskommissariat§!: §G+1§! infrastructure in 3 of its states, §R-50,000§! manpower, and §YForced Labour§! for a year."
 GER_the_east_is_bled_dry:0 "The East Is Bled Dry"
 GER_the_east_is_bled_dry_desc:0 "One last requisition, greater than all the others. When it is done there will be nothing left in the East to take, and Speer knows it. So does everyone who lives there."
 GER_the_east_is_bled_dry_tt:0 "The §Yrequisition decisions§! are gone for good.\nEvery eastern §YReichskommissariat§! gains §YBled Dry§!, which replaces §YRequisitioned§!.\n§RThis can push Moskowien toward civil war.§!"

 # --- Speer: the army -----------------------------------------------------
 GER_a_bloated_army:0 "A Bloated Army"
 GER_a_bloated_army_desc:0 "Speer's report is short. Sending the army home would put millions out of work, in the barracks and in the arms plants alike. Keeping it costs the Reich more every month. There is no third choice."
 GER_a_bloated_army_tt:0 "Battalion cap: §R-15%§!\nFrom now on the army's size feeds the §YFacade Economy§!'s growth: §R+0.1%§! a month for every full §Y500§! line battalions above §Y1,000§!."
 GER_labour_battalions:0 "Labour Battalions"
 GER_labour_battalions_desc:0 "If the army cannot be sent home, it can at least be put to work. Whole divisions trade their rifles for shovels and build what the Reich has no workers to build."
 GER_labour_battalions_tt:0 "§YReich Ministry for the Total Economy§!: Construction speed §G+10%§!, Army organisation §R-5%§!.\n§YFacade Economy§! growth: §G-0.1%§! a month, for good."
 GER_wehrbauern:0 "Wehrbauern: Soldier-Farmers of the East"
 GER_wehrbauern_desc:0 "The old dream of the soldier-farmer: veterans given land in the East, a farm and a rifle each, to hold the frontier for ever. The land is taken from those who farm it now."
 GER_wehrbauern_disband_tt:0 "§R10§! infantry divisions are disbanded, their men settled in the East."
 GER_wehrbauern_rk_tt:0 "Every eastern §YReichskommissariat§!: §R-50,000§! manpower, and §YSoldier-Villages§! for a year."
 GER_arms_for_the_allies:0 "Arms for the Allies"
 GER_arms_for_the_allies_desc:0 "The arsenals are full of rifles no one will fire. Sold on to the Reich's subjects, they at least bring something back."
 GER_arms_for_the_allies_tt:0 "§R20%§! of Germany's stockpiled §Yinfantry equipment§!, §Yartillery§! and §Ysupport equipment§! is sent to its subjects, split equally between them."
 GER_the_eternal_garrison:0 "The Eternal Garrison"
 GER_the_eternal_garrison_desc:0 "The army that occupies the East will be paid for by the East. Every Reichskommissariat owes a tribute for the soldiers who stand guard over it."
 GER_the_eternal_garrison_tt:0 "§YFacade Economy§! growth: §G-0.1%§! a month, for as long as at least two eastern §YReichskommissariate§! are German subjects.\nEvery eastern §YReichskommissariat§! gains §YGarrison Tribute§!."

 # --- Speer: finance ------------------------------------------------------
 GER_roll_over_the_debt:0 "Roll Over the Debt"
 GER_roll_over_the_debt_desc:0 "The Mefo bills fall due again, and again they are not paid. New paper replaces the old, at a higher rate, and the reckoning is put off one more time."
 GER_the_reichsmark_bloc:0 "The Reichsmark Bloc"
 GER_the_reichsmark_bloc_desc:0 "Every subject of the Reich will hold its reserves in Reichsmarks. The Reich's debt becomes everyone's debt."
 GER_rationalisation_of_industry:0 "Rationalisation of Industry"
 GER_rationalisation_of_industry_desc:0 "Speer's own reform: fewer designs, longer runs, factories run by the men who know them. It is the one measure that makes the Reich richer and not merely poorer more slowly."
 GER_rationalisation_of_industry_tt:0 "§YReich Ministry for the Total Economy§!: Factory efficiency growth §G+10%§!, Max factory efficiency §G+5%§!."
 GER_convert_the_arms_plants:0 "Convert the Arms Plants"
 GER_convert_the_arms_plants_desc:0 "The only real cure, and only a small one. Arms plants that have nothing left to arm are turned over to the goods the people were promised. The Wehrmacht calls it disarmament."
 GER_convert_the_arms_plants_tt:0 "Up to §Y20§! military factories in German core states become §Gcivilian factories§!."
 GER_keep_the_factories_turning:0 "Keep the Factories Turning"
 GER_keep_the_factories_turning_desc:0 "An idle factory is an idle worker, and an idle worker is a question. The arms plants will never stop, whether or not anyone needs what they make."
 GER_keep_the_factories_turning_tt:0 "§YReich Ministry for the Total Economy§!: Military factory output §G+10%§!."
 GER_paper_over_the_cracks:0 "Paper Over the Cracks"
 GER_paper_over_the_cracks_desc:0 "A new loan, a new bond, a new promise. It buys a year, perhaps two. It costs more than the last one did."

 # --- Speer: the promise --------------------------------------------------
 GER_the_victory_dividend:0 "The Victory Dividend"
 GER_the_victory_dividend_desc:0 "The newsreels promise every family its share of the East: land, a house, a car, a holiday. The people believe it. They have been told it for ten years."
 GER_a_volkswagen_for_every_family:0 "A Volkswagen for Every Family"
 GER_a_volkswagen_for_every_family_desc:0 "Millions paid into the savings scheme before the war and never saw a car. Now the cars will come, and every one of them is a factory not making something else."
 GER_strength_through_joy:0 "Strength Through Joy"
 GER_strength_through_joy_desc:0 "Cruises to Norway, holidays on the Baltic, concerts in the factories. The worker who has seen the fjords will not ask where his wages went."
 GER_build_germania:0 "Build Germania"
 GER_build_germania_desc:0 "Speer's own dream, drawn long before the war: Berlin rebuilt as the capital of the world, with a hall so large it makes its own weather. The great works employ the jobless; for years they employ everyone else as well."
 GER_the_prosperity_is_coming:0 "The Prosperity Is Coming"
 GER_the_prosperity_is_coming_desc:0 "The people are told once more that it is just around the corner. Fewer of them believe it than last time."

 # --- Speer: the end ------------------------------------------------------
 GER_speers_final_report:0 "Speer's Final Report"
 GER_speers_final_report_desc:0 "Speer writes down what the numbers have said all along. The East has delayed the collapse, not prevented it. Someone has to decide whether the Führer reads it."
 GER_speers_final_report_tt:0 "Needs any one branch of Speer's tree finished.\nOpens the last decision of Speer's ministry."
 GER_tell_the_fuhrer_the_truth:0 "Tell the Führer the Truth"
 GER_tell_the_fuhrer_the_truth_desc:0 "Speer takes the report to the Führer himself. The Reich will admit that it is poorer than it claimed, cut what it cannot afford, and start again. It will not be forgiven for saying so."
 GER_tell_the_fuhrer_the_truth_tt:0 "§YFacade Economy§! consumer goods reset to §G0%§!.\n§YFacade Economy§! growth §Ghalved§! for good (it never falls below §R+0.1%§! a month)."
 GER_tell_the_fuhrer_the_truth_speer_tt:0 "The Führer may dismiss §YSpeer§! from the §YInner Circle§! for it - even odds."
 GER_keep_up_the_facade:0 "Keep Up the Facade"
 GER_keep_up_the_facade_desc:0 "The report goes into a drawer. The newsreels go on. The Reich will spend whatever it takes to look rich for as long as it can, and then it will spend what it does not have."
 GER_keep_up_the_facade_tt:0 "§YFacade Economy§! growth §Rdoubled§! for good.\n§RThe collapse is now only a matter of time.§!"

 # --- Himmler -------------------------------------------------------------
 GER_the_ss_economic_empire:0 "The SS Economic Empire"
 GER_the_ss_economic_empire_desc:0 "The camps' labour, the factories built around them, the quarries and the brickworks: the SS keeps all of it for its own enterprises. Speer protests. Himmler does not reply."
 GER_the_ss_economic_empire_tt:0 "§YFacade Economy§! growth: §R+0.05%§! a month, while the SS holds its enterprises.\nSpeer's §Yrequisition decisions§! cost §R75§! political power instead of 50."
 GER_ss_mighty_stands:0 "SS Mighty Stands"
 GER_ss_mighty_stands_desc:0 "Himmler no longer asks the Führer for divisions. He raises them, in Hannover and in the Ruhr, and informs Berlin afterwards."
 GER_ss_mighty_stands_units_tt:0 "§Y20§! veteran, fully equipped §YWaffen SS Infanterie Divisions§! are raised in §YHannover§!.\n§Y4§! veteran, fully equipped §YWaffen SS Panzer Divisions§! are raised at §YEssen§!: 8 medium tanks of Germany's newest type, 1 heavy tank, 4 mechanised infantry, a maintenance company and support artillery. They cannot be edited or trained."
 GER_requisition_territory_from_our_french_puppet:0 "Requisition Territory from Our French Puppet"
 GER_requisition_territory_from_our_french_puppet_desc:0 "France was allowed to keep its eastern provinces. Himmler has decided it will not. Vichy is informed of the new border, and of nothing else."
 GER_requisition_territory_from_our_french_puppet_tt:0 "Our French puppet gives §YFranche-Comte§!, §YChampagne§! and §YPicardy§! to the §YGerman Reich§!."
 GER_a_dream_of_neu_burgundy:0 "A Dream of Neu Burgundy"
 GER_a_dream_of_neu_burgundy_desc:0 "In the castle at Wewelsburg Himmler draws the borders of an Order State in the West: old Burgundy reborn, ruled by the SS and by no one else. He shows the map to very few people."
 GER_a_dream_of_neu_burgundy_tt:0 "Himmler has drawn the borders of an §YOrder State§! in the West: §YAlsace-Lorraine§!, the requisitioned French provinces, and the lands of §YReichskommissariat Belgien-Nordfrankreich§!."
 GER_offer_retirement:0 "Offer Retirement"
 GER_offer_retirement_desc:0 "While Moskowien burns, Himmler goes to the bunker with a proposal. The Führer is old and tired. He has earned his rest. Someone else should carry the burden now."
 GER_offer_retirement_tt:0 "§RHimmler demands the Führer role from Hitler.§!"

 # --- Spirits -------------------------------------------------------------
 wif_ger_speer_economy_modifier:0 "Reich Ministry for the Total Economy"
 wif_ger_speer_economy_modifier_desc:0 "Every economic ministry of the Reich now answers to Albert Speer."
 wif_ger_victory_celebrations:0 "Victory Celebrations"
 wif_ger_victory_celebrations_desc:0 "The war is over. The people are told that the reward is on its way."
 wif_ger_todt_in_the_east:0 "Organisation Todt in the East"
 wif_ger_todt_in_the_east_desc:0 "Engineers and forced labourers are building the Reich's eastern railways at a pace no free workforce could match."
 wif_ger_wehrmacht_protests:0 "The Wehrmacht Protests"
 wif_ger_wehrmacht_protests_desc:0 "The generals call the conversion of the arms plants disarmament, and say so loudly."
 wif_ger_building_germania:0 "Building Germania"
 wif_ger_building_germania_desc:0 "Half the Reich's builders are at work on the new capital, and everything else waits."
 wif_ger_ss_enterprises:0 "SS Enterprises"
 wif_ger_ss_enterprises_desc:0 "The SS runs its own economy of camps, quarries and factories, and keeps its labour for itself."
 wif_rk_requisitioned:0 "Requisitioned"
 wif_rk_requisitioned_desc:0 "The Reich has taken this year's quota. What it left is not enough."
 wif_rk_grain_requisitions:0 "Grain Requisitions"
 wif_rk_grain_requisitions_desc:0 "The harvest goes west on the trains. The villages that grew it go hungry."
 wif_rk_oil_under_reich_control:0 "Oil Fields Under Reich Control"
 wif_rk_oil_under_reich_control_desc:0 "The oil fields belong to the Reich in all but name. The Reichskommissariat runs on what spills."
 wif_rk_todt_labour:0 "Forced Labour"
 wif_rk_todt_labour_desc:0 "Organisation Todt takes the able-bodied for its railways and its factories."
 wif_rk_soldier_villages:0 "Soldier-Villages"
 wif_rk_soldier_villages_desc:0 "German veterans have been given the best land, and the people who farmed it have been moved off."
 wif_rk_garrison_tribute:0 "Garrison Tribute"
 wif_rk_garrison_tribute_desc:0 "The Reichskommissariat pays for the army that occupies it."
 wif_rk_bled_dry:0 "Bled Dry"
 wif_rk_bled_dry_desc:0 "There is nothing left to take. The Reich has taken it anyway."
 wif_subject_reichsmark_bloc:0 "The Reichsmark Bloc"
 wif_subject_reichsmark_bloc_desc:0 "Our reserves are held in Reichsmarks, and the Reich's debt has become ours."
 wif_rk_reichsmark_bloc:0 "The Reichsmark Bloc"
 wif_rk_reichsmark_bloc_desc:0 "Our reserves are held in Reichsmarks, and the Reich's debt has become ours. The factories pay for it."

 # --- Decisions -----------------------------------------------------------
 wif_ger_economic_council_category:0 "Economic Council"
 wif_ger_economic_council_category_desc:0 "Speer's ministry sets the quotas the Reichskommissariate must deliver. Each requisition buys the Reich a little time, and costs the East a great deal more."
 wif_ger_quota_cost:0 "£pol_power §Y50§! (§Y75§! with the SS Economic Empire)"
 wif_ger_requisition_rko:0 "Requisition from Ostland"
 wif_ger_requisition_rko_desc:0 "Take this year's quota from Reichskommissariat Ostland."
 wif_ger_requisition_rku:0 "Requisition from the Ukraine"
 wif_ger_requisition_rku_desc:0 "Take this year's quota from Reichskommissariat Ukraine."
 wif_ger_requisition_rkm:0 "Requisition from Moskowien"
 wif_ger_requisition_rkm_desc:0 "Take this year's quota from Reichskommissariat Moskowien."
 wif_ger_requisition_rkk:0 "Requisition from Kaukasien"
 wif_ger_requisition_rkk_desc:0 "Take this year's quota from Reichskommissariat Kaukasien."

 # --- Events --------------------------------------------------------------
 wif_ger_himmler_coup.1.t:0 "Himmler Demands the Führer Role from Hitler"
 wif_ger_himmler_coup.1.d:0 "The Reichsführer-SS came to the bunker alone, and he did not ask. The Führer, he said, is old and ill, and has earned his rest. The Reich needs a younger hand, and the SS is ready to give it one.\n\nWhat followed was heard through two closed doors. Hitler screamed until his voice gave out. He called Himmler a traitor, a chicken farmer, a worm he had raised from nothing; he swept the maps from the table and beat his fists against the wall until the guards outside wondered whether to go in. Himmler stood through all of it and waited.\n\nWhen the rage was spent, the question was still there. Twenty SS divisions stand in Hannover and the Ruhr. The Wehrmacht is watching. The Reich must answer."
 wif_ger_himmler_coup.1.a:0 "Hitler, it is time to go."
 wif_ger_himmler_coup.1.b:0 "Nein, Verräter!"
 wif_ger_himmler_coup.1.c:0 "How about Burgundy?"
 wif_ger_himmler_coup_time_to_go_tt:0 "§YHeinrich Himmler§! becomes Führer of the Reich.\nEvery division that is not of the §YSS§! is disbanded."
 wif_ger_himmler_coup_traitor_tt:0 "§RCivil war.§! The SS rises in the West: the requisitioned French provinces, §YLuxembourg§!, §YAlsace-Lorraine§! and the lands of §YReichskommissariat Belgien-Nordfrankreich§! break away under §YHeinrich Himmler§!.\nThe §YSS§! divisions and the SS generals go with him."
 wif_ger_himmler_coup_burgundy_tt:0 "§YAlsace-Lorraine§!, the requisitioned French provinces and the lands of §YReichskommissariat Belgien-Nordfrankreich§! become the §YOrdensstaat Burgund§!, a German satellite under §YHeinrich Himmler§!.\nThe §YSS§! divisions and the SS generals go with him."
 wif_ger_speer.1.t:0 "Speer Dismissed"
 wif_ger_speer.1.d:0 "The Führer read the first page of the report and no further. Speer, he said, had become a defeatist and a bookkeeper. He was not to come to the bunker again."
 wif_ger_speer.1.a:0 "So ends the ministry of Albert Speer."
 wif_ger_speer_dismissed_tt:0 "§YAlbert Speer§! leaves the §YInner Circle§!."
 wif_ger_speer.2.t:0 "Speer Keeps His Seat"
 wif_ger_speer.2.d:0 "The Führer raged for an hour and then fell silent. When he spoke again it was to ask how long the Reich had. Speer told him. He kept his post, and the Führer never mentioned the report again."
 wif_ger_speer.2.a:0 "The work goes on."

 # --- Countries -----------------------------------------------------------
 OSB:0 "Ordensstaat Burgund"
 OSB_DEF:0 "the Ordensstaat Burgund"
 OSB_ADJ:0 "Burgundian"
 OSB_fascism:0 "Ordensstaat Burgund"
