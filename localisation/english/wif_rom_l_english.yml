 wif_rom_petru_groza:0 "Petru Groza"
 wif_rom.10.t:0 "Romania's New Masters"
 wif_rom.10.desc:0 "Romania has broken. Its government has turned to the Communist Party, and the country is ours to rule. Who will govern Bucharest for us - one of our own, or a Romanian who will do as he is told?"
 wif_rom.10.a:0 "A Soviet official: Petru Groza."
 wif_rom.10.a_tt:0 "§YPetru Groza§! governs Romania as Moscow's appointed official - a hardliner taking his orders from the Soviet embassy."
 wif_rom.10.b:0 "A local collaborator: Constantin Ion Parhon."
 wif_rom.10.b_tt:0 "§YConstantin Ion Parhon§!, an old Romanian socialist - a Romanian face on the Party government."
 wif_rom.11.t:0 "Romania Turns Red"
 wif_rom.11.desc:0 "With the Red Army deep inside Moldavia, Romania has collapsed politically. A communist government has taken power in Bucharest, made peace with the Soviet Union and placed the country under Moscow's protection."
 wif_rom.11.a:0 "The Danube is Soviet."
 wif_rom.20.t:0 "Romania Carved Up"
 wif_rom.20.desc:0 "Romania has capitulated to Germany and its allies and left the war. Hungary takes all of Transylvania; what remains of the kingdom becomes a German protectorate in all but name."
 wif_rom.20.a:0 "Another kingdom falls."
 wif_rom.33.t:0 "Romania Marches on Cluj"
 wif_rom.33.desc:0 "With the Reich at war with itself and its guarantee worth nothing, Romanian troops have crossed the Vienna line into Northern Transylvania. Bucharest calls it a limited war; neither side may call on its allies."
 wif_rom.33.a:0 "Transylvania again."
 wif_rom.35.t:0 "Sixty Days"
 wif_rom.35.desc:0 "Sixty days of war over Transylvania are over. Whoever holds Cluj now will keep it."
 wif_rom.35.a:0 "Cluj is ours."
 wif_rom.35.b:0 "We could not take Cluj."
 wif_rom.36.t:0 "Cluj Is Romanian Again"
 wif_rom.36.desc:0 "Hungary has made peace and handed Northern Transylvania back to Romania. The Vienna Award is dead."
 wif_rom.36.a:0 "The Carpathians are Romanian."
 wif_rom.37.t:0 "The Humiliation of Cluj"
 wif_rom.37.desc:0 "Romania has failed to take Northern Transylvania in sixty days and made peace. The Vienna line stands."
 wif_rom.37.a:0 "Bucharest will not forget."
