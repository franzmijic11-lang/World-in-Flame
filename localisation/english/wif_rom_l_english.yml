l_english:
 wif_rom_ministry_of_defence:0 "The Ministry of National Defence"
 wif_rom_ministry_of_defence_desc:0 "The army that held the line at Marasesti in 1917 is twenty years out of date."
 wif_rom_modernize_land_forces:0 "Modernize the Land Forces"
 wif_rom_modernize_land_forces_desc:0 "French-trained, French-equipped, and still fighting the last war."
 wif_rom_armoured_division:0 "The Armoured Division"
 wif_rom_armoured_division_desc:0 "The 1st Armoured Division, 'Romania Mare', is formed around a few dozen Czech tanks."
 wif_rom_ministry_of_air:0 "The Ministry of Air and Navy"
 wif_rom_ministry_of_air_desc:0 "A ministry for the air force, the navy and the aircraft industry."
 wif_rom_navy_fund:0 "The National Navy Fund"
 wif_rom_navy_fund_desc:0 "Public subscriptions for a fleet on the Black Sea."
 wif_rom_vanatori_de_munte:0 "Vanatorii de Munte"
 wif_rom_vanatori_de_munte_desc:0 "The mountain troops, Romania's elite - trained for the Carpathians."
 wif_rom_balcescu_academy:0 "The Nicolae Balcescu Academy"
 wif_rom_balcescu_academy_desc:0 "The cavalry and officers' school at Sibiu, expanded for a modern war."
 wif_rom_r2_tanks:0 "R-2 Tanks from Skoda"
 wif_rom_r2_tanks_desc:0 "126 LT vz. 35 light tanks bought from Czechoslovakia: Romania's first real armour."
 wif_rom_tacam:0 "TACAM"
 wif_rom_tacam_desc:0 "Captured Soviet guns on old tank chassis: Romanian tank destroyers."
 wif_rom_iar_80:0 "The IAR 80"
 wif_rom_iar_80_desc:0 "A Romanian-designed fighter from the IAR works at Brasov - one of the best of its class in 1939."
 wif_rom_icar:0 "ICAR"
 wif_rom_icar_desc:0 "The Bucharest aircraft company builds trainers and licence designs."
 wif_rom_galati:0 "The Galati Shipyards"
 wif_rom_galati_desc:0 "Destroyers, minelayers and submarines on the Danube."
 wif_rom_naval_air:0 "The Naval Air Squadron"
 wif_rom_naval_air_desc:0 "Seaplanes over the Black Sea, based at Mamaia."
 wif_rom_rosiori:0 "The Rosiori"
 wif_rom_rosiori_desc:0 "The red-hussar cavalry regiments, mounted and proud."
 wif_rom_carol_line:0 "The Carol Line"
 wif_rom_carol_line_desc:0 "Bunkers along the Prut against the Soviet Union - begun in 1938."
 wif_rom_orita:0 "The Orita Submachine Gun"
 wif_rom_orita_desc:0 "A Romanian design from the Cugir arsenal: the army's own weapons."
 wif_rom_maresal:0 "The Maresal"
 wif_rom_maresal_desc:0 "A low, cheap Romanian tank destroyer - so good the Germans copied it as the Hetzer."
 wif_rom_iar_81:0 "The IAR 81"
 wif_rom_iar_81_desc:0 "The IAR 80 as a dive bomber."
 wif_rom_jrs_79:0 "The JRS-79B"
 wif_rom_jrs_79_desc:0 "Licence-built Italian bombers with Romanian engines."
 wif_rom_delfinul:0 "The Delfinul"
 wif_rom_delfinul_desc:0 "Romania's only submarine - for now."
 wif_rom_murgescu:0 "The Amiral Murgescu"
 wif_rom_murgescu_desc:0 "A minelayer built at Galati: the Black Sea is a sea of mines."
 wif_rom_traian_line:0 "The Trajan Line"
 wif_rom_traian_line_desc:0 "A second line along the Siret."
 wif_rom_resita_75:0 "The Resita 75mm"
 wif_rom_resita_75_desc:0 "A Romanian anti-tank gun from the Resita works - one of the best of the war."
 wif_rom_mechanised_corps:0 "A Mechanised Corps"
 wif_rom_mechanised_corps_desc:0 "Two armoured divisions and motorised infantry."
 wif_rom_grupul_7:0 "Grupul 7 Vanatoare"
 wif_rom_grupul_7_desc:0 "The fighter group of aces like Prince Constantin 'Bazu' Cantacuzino."
 wif_rom_white_squadron:0 "The White Squadron"
 wif_rom_white_squadron_desc:0 "Women pilots flying air ambulances to the front: the Escadrila Alba."
 wif_rom_danube_flotilla:0 "The Danube Flotilla"
 wif_rom_danube_flotilla_desc:0 "Monitors and gunboats guarding the river frontier."
 wif_rom_learn_from_the_past:0 "Learn from the Past"
 wif_rom_learn_from_the_past_desc:0 "The lessons of 1916-17: never again a collapse in a single campaign."
 wif_rom_paratroopers:0 "The First Parachute Battalion"
 wif_rom_paratroopers_desc:0 "1941: Romania's first paratroopers, trained by the Germans at Bucharest."
 wif_rom_aeronautica_regala:0 "Aeronautica Regala"
 wif_rom_aeronautica_regala_desc:0 "The Royal Air Force of Romania."
 wif_rom_black_sea_division:0 "The Black Sea Division"
 wif_rom_black_sea_division_desc:0 "Four destroyers, a submarine and a minelayer: enough to rule the western Black Sea."
 wif_rom_royal_army:0 "The Royal Romanian Army"
 wif_rom_royal_army_desc:0 "Thirty divisions that can fight a modern war."
 wif_rom_army_of_1950:0 "The Army of 1950"
 wif_rom_army_of_1950_desc:0 "A decade of war has made Romania's army the strongest in the Balkans - for whichever side it fights."
 wif_rom_coanda_jets:0 "Coanda's Jets"
 wif_rom_coanda_jets_desc:0 "Henri Coanda flew a jet-like aircraft in 1910. A Romania that built the IAR 80 can build jets."
 wif_rom_ten_year_plan:0 "The Ten-Year Modernization Plan"
 wif_rom_ten_year_plan_desc:0 "The state means to industrialise an agrarian kingdom in a decade."
 wif_rom_ploiesti:0 "The Ploiesti Oil Fields"
 wif_rom_ploiesti_desc:0 "Europe's greatest oil field outside the Soviet Union - and every power's target."
 wif_rom_tax_reforms:0 "Finalize Tax Reforms"
 wif_rom_tax_reforms_desc:0 "A modern tax code for a state that has doubled in size."
 wif_rom_resita:0 "The Resita Works"
 wif_rom_resita_desc:0 "The old iron works of the Banat, Romania's heavy industry."
 wif_rom_cfr:0 "Caile Ferate Romane"
 wif_rom_cfr_desc:0 "The state railways, the spine of the kingdom."
 wif_rom_breadbasket:0 "Breadbasket of Europe"
 wif_rom_breadbasket_desc:0 "Romania exports grain to half of Europe."
 wif_rom_astra_romana:0 "Leave Oil to Astra Romana"
 wif_rom_astra_romana_desc:0 "Foreign capital - Shell's Astra Romana, Steaua Romana and the others - keeps the fields producing."
 wif_rom_nationalize_oil:0 "Nationalize the Oil Fields"
 wif_rom_nationalize_oil_desc:0 "Romanian oil for Romania - and for whoever Bucharest chooses to sell it to."
 wif_rom_national_bank:0 "The National Bank"
 wif_rom_national_bank_desc:0 "Gold reserves, a stable leu, and credit for industry."
 wif_rom_resita_steel:0 "Resita Steel"
 wif_rom_resita_steel_desc:0 "New furnaces at Resita."
 wif_rom_malaxa:0 "Diversify Malaxa"
 wif_rom_malaxa_desc:0 "Nicolae Malaxa's works build locomotives, rifles, pipes - and fortunes."
 wif_rom_danube_ports:0 "The Danube Ports"
 wif_rom_danube_ports_desc:0 "Braila, Galati and Giurgiu: the river carries Romania's trade."
 wif_rom_agrarian_credit:0 "Agrarian Credit"
 wif_rom_agrarian_credit_desc:0 "Cheap credit for the peasants who own the land since 1921."
 wif_rom_apuseni_gold:0 "The Gold of the Apuseni"
 wif_rom_apuseni_gold_desc:0 "The 'Golden Quadrilateral' of the Western Carpathians, mined since the Romans."
 wif_rom_prahova_refineries:0 "The Refineries of Prahova"
 wif_rom_prahova_refineries_desc:0 "Cracking towers at Ploiesti, Campina and Brazi."
 wif_rom_ford_romania:0 "Ford Romania"
 wif_rom_ford_romania_desc:0 "The American car plant in Bucharest - to be expanded, or seized."
 wif_rom_hunedoara:0 "Hunedoara Steel"
 wif_rom_hunedoara_desc:0 "The furnaces of Hunedoara, the future steel city."
 wif_rom_malaxa_arms:0 "Malaxa Arms"
 wif_rom_malaxa_arms_desc:0 "Rifles, machine guns and artillery from Malaxa's plants."
 wif_rom_electrification:0 "Electrify the Country"
 wif_rom_electrification_desc:0 "Power stations and lines to the villages."
 wif_rom_grain_for_europe:0 "Grain for Europe"
 wif_rom_grain_for_europe_desc:0 "Contracts for the wheat crop with whoever pays best."
 wif_rom_pipeline_constanta:0 "The Pipeline to Constanta"
 wif_rom_pipeline_constanta_desc:0 "Oil to the sea, for tankers to anywhere."
 wif_rom_oil_diplomacy:0 "Oil Diplomacy"
 wif_rom_oil_diplomacy_desc:0 "Oil buys friends: Berlin, London and Rome all want contracts."
 wif_rom_synthetic_rubber:0 "Synthetic Rubber"
 wif_rom_synthetic_rubber_desc:0 "Independent synthetic rubber production from Romanian oil."
 wif_rom_bihor_bauxite:0 "The Bauxite of Bihor"
 wif_rom_bihor_bauxite_desc:0 "Aluminium ore in the western mountains."
 wif_rom_industrial_heartland:0 "The Industrial Heartland"
 wif_rom_industrial_heartland_desc:0 "Bucharest, Brasov, Ploiesti, Resita: an industrial triangle."
 wif_rom_oil_capital:0 "The Oil Capital of Europe"
 wif_rom_oil_capital_desc:0 "Ploiesti refines more oil than all of Germany produces."
 wif_rom_polytechnic:0 "The Polytechnic of Bucharest"
 wif_rom_polytechnic_desc:0 "Romania's engineers - Coanda's heirs - are trained at home now."
 wif_rom_cooperatives:0 "Peasant Cooperatives"
 wif_rom_cooperatives_desc:0 "Village cooperatives buy tractors together and sell grain together."
 wif_rom_modern_industry:0 "A Modern Romanian Industry"
 wif_rom_modern_industry_desc:0 "Ten years of the plan, and Romania makes its own guns, planes and fuel."
 wif_rom_second_plan:0 "The Second Modernization Plan"
 wif_rom_second_plan_desc:0 "A new plan for after the war - whoever won it."
 wif_rom_romania_1950_industry:0 "Romania in 1950"
 wif_rom_romania_1950_industry_desc:0 "The kingdom of peasants is an industrial state."
 wif_rom_new_kingdom:0 "Deal with the New Kingdom"
 wif_rom_new_kingdom_desc:0 "Greater Romania - doubled in size in 1918, ringed by neighbours who want their land back: the Soviet Union wants Bessarabia, Hungary wants Transylvania, Bulgaria wants Southern Dobruja. King Carol II rules through a camarilla; the Iron Guard murders its way towards power; Ploiesti's oil makes Romania worth having for anyone who wins."
 wif_rom_carols_camarilla:0 "Carol's Camarilla"
 wif_rom_carols_camarilla_desc:0 "Carol II rules through favourites - the palace clique of courtiers, generals and industrialists."
 wif_rom_election_1937:0 "The General Election"
 wif_rom_election_1937_desc:0 "December 1937: no party reaches the 40% that would give it a majority. The Iron Guard's party comes third."
 wif_rom_iron_guard_question:0 "The Iron Guard Question"
 wif_rom_iron_guard_question_desc:0 "Codreanu's Legion of the Archangel Michael: green shirts, death squads, and a quarter of the young intelligentsia."
 wif_rom_lupescu:0 "Madame Lupescu"
 wif_rom_lupescu_desc:0 "Elena Lupescu, the King's mistress, hated by the court, the Church and the Guard - and the most powerful woman in Romania."
 wif_rom_royal_dictatorship:0 "The Royal Dictatorship"
 wif_rom_royal_dictatorship_desc:0 "February 1938: Carol suspends the constitution and rules by decree."
 wif_rom_patriarch_cristea:0 "Patriarch Miron Cristea"
 wif_rom_patriarch_cristea_desc:0 "The head of the Orthodox Church becomes Prime Minister of the royal dictatorship."
 wif_rom_renaissance_front:0 "The National Renaissance Front"
 wif_rom_renaissance_front_desc:0 "The King's own single party, with its own uniforms and Roman salute."
 wif_rom_goga_cabinet:0 "The Goga-Cuza Government"
 wif_rom_goga_cabinet_desc:0 "December 1937: the antisemitic National Christian Party governs for 44 days and strips a third of Romania's Jews of their citizenship."
 wif_rom_codreanu_trial:0 "The Trial of Codreanu"
 wif_rom_codreanu_trial_desc:0 "1938: Codreanu is tried and imprisoned. In November he is 'shot while trying to escape'."
 wif_rom_legion_underground:0 "The Legion Underground"
 wif_rom_legion_underground_desc:0 "The Legion's leaders flee to Germany and plan revenge."
 wif_rom_calinescu:0 "Armand Calinescu"
 wif_rom_calinescu_desc:0 "The Prime Minister who crushed the Guard - assassinated by legionaries in September 1939. Hundreds of legionaries are executed in reprisal."
 wif_rom_racial_statute:0 "The Racial Statute"
 wif_rom_racial_statute_desc:0 "August 1940: Carol's own government copies the Nuremberg laws - Jews are barred from the army, the land and the professions."
 wif_rom_ssi:0 "The SSI"
 wif_rom_ssi_desc:0 "The Special Intelligence Service under Mihail Moruzov, then Eugen Cristescu - Romania's secret police."
 wif_rom_jilava:0 "The Jilava Massacre"
 wif_rom_jilava_desc:0 "November 1940: legionaries murder 64 political prisoners in Jilava prison, among them Calinescu's ministers - revenge for Codreanu."
 wif_rom_summer_of_1940:0 "The Summer of 1940"
 wif_rom_summer_of_1940_desc:0 "In ten weeks Romania loses Bessarabia and Northern Bukovina to the Soviets, Northern Transylvania to Hungary and Southern Dobruja to Bulgaria. Carol abdicates for his son Michael and flees with Lupescu and a trainload of gold. Someone must govern what is left."
 wif_rom_king_michael:0 "King Michael"
 wif_rom_king_michael_desc:0 "Michael I, nineteen years old, reigns - and means to rule."
 wif_rom_national_peasants:0 "Maniu's National Peasants"
 wif_rom_national_peasants_desc:0 "Iuliu Maniu and the National Peasants' Party: the democrats who never stopped asking for the 1923 constitution."
 wif_rom_conducator:0 "The Conducator"
 wif_rom_conducator_desc:0 "General Ion Antonescu takes power as 'Conducator', the leader - first with the Iron Guard, then without it."
 wif_rom_queen_helen:0 "Queen Mother Helen"
 wif_rom_queen_helen_desc:0 "The King's mother, back from exile: she pleads with every government for the Jews - and will be named Righteous Among the Nations."
 wif_rom_crown_council:0 "The Crown Council"
 wif_rom_crown_council_desc:0 "The King governs with the old party leaders as his advisers."
 wif_rom_kings_army:0 "The King's Army"
 wif_rom_kings_army_desc:0 "The officers swear to the Crown, not to a party."
 wif_rom_king_on_the_radio:0 "The King on the Radio"
 wif_rom_king_on_the_radio_desc:0 "Michael speaks to the nation himself - the first Romanian king to do so."
 wif_rom_crown_restored:0 "The Crown Restored"
 wif_rom_crown_restored_desc:0 "A constitutional monarchy with a King who has proved he can act."
 wif_rom_monarchist_romania:0 "The Kingdom of Romania, 1950"
 wif_rom_monarchist_romania_desc:0 "King Michael at thirty: a monarch his people trust."
 wif_rom_peasant_state:0 "The Peasant State"
 wif_rom_peasant_state_desc:0 "Maniu's taranism: a Romania of free, cooperative smallholders."
 wif_rom_restore_1923:0 "Restore the 1923 Constitution"
 wif_rom_restore_1923_desc:0 "Parliament, parties, a free press - again."
 wif_rom_minority_rights:0 "Rights for the Minorities"
 wif_rom_minority_rights_desc:0 "Equal rights for Hungarians, Germans, Jews and Ukrainians - as Greater Romania promised in 1918."
 wif_rom_liberal_coalition:0 "The Liberal Coalition"
 wif_rom_liberal_coalition_desc:0 "Maniu governs with Dinu Bratianu's National Liberals."
 wif_rom_free_elections:0 "Free Elections"
 wif_rom_free_elections_desc:0 "The first honest vote in a decade."
 wif_rom_democratic_romania:0 "A Democratic Romania"
 wif_rom_democratic_romania_desc:0 "Romania governed by its parliament - a rare thing in the Europe of 1950."
 wif_rom_legionary_state:0 "The National Legionary State"
 wif_rom_legionary_state_desc:0 "September 1940: Antonescu shares power with Horia Sima's Iron Guard. The Legion's police terrorise Bucharest."
 wif_rom_legionary_rebellion:0 "The Legionary Rebellion"
 wif_rom_legionary_rebellion_desc:0 "January 1941: the Guard rises against Antonescu; in Bucharest its men murder 125 Jews. The army crushes the rising in three days."
 wif_rom_romanianisation:0 "Romanianisation"
 wif_rom_romanianisation_desc:0 "Jewish businesses, farms and houses are expropriated and handed to 'Romanian' owners."
 wif_rom_marshal:0 "Marshal of Romania"
 wif_rom_marshal_desc:0 "August 1941: Antonescu makes himself Marshal after the reconquest of Bessarabia."
 wif_rom_conducator_state:0 "The Conducator's State"
 wif_rom_conducator_state_desc:0 "A military dictatorship without the Legion: order, discipline, Antonescu."
 wif_rom_authoritarian_romania:0 "Antonescu's Romania"
 wif_rom_authoritarian_romania_desc:0 "The Marshal rules for life."
 wif_rom_great_powers:0 "Between the Great Powers"
 wif_rom_great_powers_desc:0 "France guaranteed Greater Romania. France is weak. Germany buys the oil. The Soviet Union wants Bessarabia."
 wif_rom_little_entente:0 "The Little Entente"
 wif_rom_little_entente_desc:0 "With Czechoslovakia and Yugoslavia against Hungarian revisionism - until Munich kills it."
 wif_rom_balkan_entente:0 "The Balkan Entente"
 wif_rom_balkan_entente_desc:0 "With Turkey, Greece and Yugoslavia against Bulgaria."
 wif_rom_polish_alliance:0 "The Polish Alliance"
 wif_rom_polish_alliance_desc:0 "The 1921 alliance against the Soviet Union - which Romania will not honour against Germany."
 wif_rom_armed_neutrality:0 "Armed Neutrality"
 wif_rom_armed_neutrality_desc:0 "September 1939: Romania declares neutrality - and mobilises a million men."
 wif_rom_berghof:0 "Carol at the Berghof"
 wif_rom_berghof_desc:0 "November 1938: Carol visits Hitler. Days later, Codreanu is dead."
 wif_rom_wohltat_treaty:0 "The Wohltat Treaty"
 wif_rom_wohltat_treaty_desc:0 "March 1939: the economic treaty that ties Romanian oil and grain to the German economy."
 wif_rom_british_guarantee:0 "The Anglo-French Guarantee"
 wif_rom_british_guarantee_desc:0 "April 1939: Britain and France guarantee Romania's independence."
 wif_rom_soviet_ultimatum:0 "The Soviet Ultimatum"
 wif_rom_soviet_ultimatum_desc:0 "June 1940: Moscow gives Romania 24 hours to hand over Bessarabia and Northern Bukovina. No one will help."
 wif_rom_renounce_guarantee:0 "Renounce the Anglo-French Guarantee"
 wif_rom_renounce_guarantee_desc:0 "July 1940: France has fallen and the guarantee is worthless. Bucharest renounces it and asks Berlin for a German guarantee and a military mission instead - hoping Germany will be generous when it settles Romania's borders."
 wif_rom_craiova:0 "The Treaty of Craiova"
 wif_rom_craiova_desc:0 "September 1940: Southern Dobruja goes back to Bulgaria, peacefully."
 wif_rom_tripartite_pact:0 "The Tripartite Pact"
 wif_rom_tripartite_pact_desc:0 "November 1940: Romania joins the Axis. German troops arrive to 'protect the oil'."
 wif_rom_stand_with_allies:0 "Stand with the Allies"
 wif_rom_stand_with_allies_desc:0 "Romania honours the guarantee and the French alliance of 1926 - whatever it costs."
 wif_rom_german_mission:0 "The German Military Mission"
 wif_rom_german_mission_desc:0 "German instructors, German weapons, German officers in the oil fields."
 wif_rom_oil_for_the_reich:0 "Oil for the Reich"
 wif_rom_oil_for_the_reich_desc:0 "Ploiesti's oil goes north on every train."
 wif_rom_volksgruppe:0 "The German Ethnic Group"
 wif_rom_volksgruppe_desc:0 "Romania's Saxons and Swabians become a 'Volksgruppe' under SS patronage - a state within the state, and a recruiting ground for the Waffen-SS."
 wif_rom_order_and_discipline:0 "Order and Discipline"
 wif_rom_order_and_discipline_desc:0 "In Hitler's Europe, Romania governs like its allies: censorship, decrees, a stronger hand - whoever rules."
 wif_rom_iasi_pogrom:0 "Iasi, June 1941"
 wif_rom_iasi_pogrom_desc:0 "Days after the attack on the Soviet Union, soldiers, police and townsmen murder thousands of Jews in Iasi; thousands more die in sealed 'death trains'. At least 13,000 are killed."
 wif_rom_operation_munchen:0 "Operation Munchen"
 wif_rom_operation_munchen_desc:0 "July 1941: Romanian and German armies retake Bessarabia and Northern Bukovina."
 wif_rom_siege_of_odessa:0 "The Siege of Odessa"
 wif_rom_siege_of_odessa_desc:0 "Seventy days and 90,000 Romanian casualties to take the city."
 wif_rom_transnistria:0 "The Governorate of Transnistria"
 wif_rom_transnistria_desc:0 "The land between the Dniester and the Bug is Romania's to govern - not to annex."
 wif_rom_odessa_october:0 "Odessa, October 1941"
 wif_rom_odessa_october_desc:0 "After a bomb kills Romanian officers in their headquarters, the army murders around 25,000 Jews in Odessa in three days."
 wif_rom_deportations_transnistria:0 "The Deportations to Transnistria"
 wif_rom_deportations_transnistria_desc:0 "The Jews of Bessarabia and Bukovina, and 25,000 Roma, are driven across the Dniester into camps and ghettos. Between 150,000 and 250,000 die of typhus, hunger and shooting."
 wif_rom_sevastopol:0 "Sevastopol"
 wif_rom_sevastopol_desc:0 "Romanian mountain troops storm the fortress beside the Germans."
 wif_rom_caucasus_mountains:0 "The Mountain Corps in the Caucasus"
 wif_rom_caucasus_mountains_desc:0 "The Vanatori de Munte fight on the Terek and in the Kuban."
 wif_rom_deportations_halted:0 "The Deportations Halted"
 wif_rom_deportations_halted_desc:0 "Autumn 1942: Antonescu refuses to send the Jews of the Regat and southern Transylvania to the death camps in Poland - not out of mercy, but because the war has turned and the Allies are watching."
 wif_rom_volga_armies:0 "The Armies on the Volga"
 wif_rom_volga_armies_desc:0 "Two Romanian armies hold the flanks at Stalingrad."
 wif_rom_tidal_wave:0 "Tidal Wave"
 wif_rom_tidal_wave_desc:0 "1 August 1943: 178 American B-24s fly low over Ploiesti. The flak, the fighters and the smoke destroy 54 of them."
 wif_rom_victory_dividend:0 "The Victory Dividend"
 wif_rom_victory_dividend_desc:0 "Germany has won. Romania sat on the winning side - and wants its reward."
 wif_rom_turn_of_the_tide:0 "The Turn of the Tide"
 wif_rom_turn_of_the_tide_desc:0 "23 August 1944: King Michael arrests the government and takes Romania out of the Axis - to the Western Allies, not to Moscow."
 wif_rom_romania_on_the_bug:0 "Romania on the Bug"
 wif_rom_romania_on_the_bug_desc:0 "Transnistria and Odessa are Romanian in all but name - and Reichskommissariat Ukraine wants them back."
 wif_rom_grossraum:0 "In the Grossraum"
 wif_rom_grossraum_desc:0 "Romania is the oil and grain department of the German economic space: fixed prices, German managers, guaranteed markets."
 wif_rom_constanta:0 "Constanta on the Black Sea"
 wif_rom_constanta_desc:0 "With the Soviet fleet gone, Constanta is the second port of the Black Sea."
 wif_rom_odessa_romanian:0 "Odessa, a Romanian City"
 wif_rom_odessa_romanian_desc:0 "Romanian universities, Romanian street names, a Romanian governor in the Vorontsov Palace."
 wif_rom_reich_divided:0 "The Reich Divided"
 wif_rom_reich_divided_desc:0 "The Reich is at war with itself. Its guarantee of the Vienna line is worth nothing. Romania's oil is suddenly Romania's again."
 wif_rom_pact_of_rome:0 "The Invitation from Rome"
 wif_rom_pact_of_rome_desc:0 "Italy's Pact of Rome asks Romania in: Latin sisters together."
 wif_rom_ankaras_offer:0 "Ankara's Offer"
 wif_rom_ankaras_offer_desc:0 "Turkey offers trade and a frontier guarantee - and wants Ploiesti's oil."
 wif_rom_michaels_choice:0 "King Michael's Choice"
 wif_rom_michaels_choice_desc:0 "In 1944 he took Romania out of the Axis. Now, with the Reich in pieces, he can take it out of Berlin's orbit for good."
 wif_rom_romania_1952:0 "Romania in 1952"
 wif_rom_romania_1952_desc:0 "Greater Romania survived the war that destroyed Europe - by choosing sides well, and changing them in time."
 wif_rom_transylvania_war:0 "Take Back Transylvania"
 wif_rom_transylvania_war_desc:0 "The Vienna line was guaranteed by Berlin and Rome. Berlin is fighting itself, and Rome is busy. For a few months, Northern Transylvania is only Hungary's to defend."
 wif_rom_cluj_regained:0 "Cluj Regained"
 wif_rom_cluj_regained_desc:0 "The Romanian flag over the Cluj city hall again, four years late or twelve years late."
 wif_rom_deny_ploiesti:0 "Deny Ploiesti"
 wif_rom_deny_ploiesti_desc:0 "The British plan, prepared in 1939-40: wreck the oil fields rather than let Germany have them."
 wif_rom_polish_gold:0 "The Polish Gold"
 wif_rom_polish_gold_desc:0 "September 1939: Poland's gold reserve crosses Romania to Constanta and the West - and Romania lets it pass."
 wif_rom_balkan_front:0 "The Balkan Front"
 wif_rom_balkan_front_desc:0 "With Yugoslavia and Greece, a front against Germany in the Balkans."
 wif_rom_polish_soldiers:0 "The Polish Soldiers"
 wif_rom_polish_soldiers_desc:0 "Tens of thousands of interned Polish soldiers are let 'escape' to France to fight again."
 wif_rom_hold_the_carpathians:0 "Hold the Carpathians"
 wif_rom_hold_the_carpathians_desc:0 "The mountains are Romania's fortress against the Wehrmacht."
 wif_rom_british_aid:0 "British Aid via the Straits"
 wif_rom_british_aid_desc:0 "Supplies through Turkey and the Black Sea."
 wif_rom_war_with_germany:0 "War with Germany"
 wif_rom_war_with_germany_desc:0 "The Wehrmacht will come for the oil. Romania will make it pay."
 wif_rom_free_romanian_committee:0 "The Free Romanian Committee"
 wif_rom_free_romanian_committee_desc:0 "Romanians in London and Washington, ready to govern in exile."
 wif_rom_among_the_allies:0 "Romania Among the Allies"
 wif_rom_among_the_allies_desc:0 "Romania fights for the side it chose - or came back to."
 wif_rom_free_balkans:0 "The Free Balkans"
 wif_rom_free_balkans_desc:0 "Germany has won in the West or the East - but has not come for Romania, or has not managed to break it. A free Romania is an island in an Axis sea."
 wif_rom_ofn:0 "The Organisation of Free Nations"
 wif_rom_ofn_desc:0 "Across the Atlantic, America has founded an alliance for what is left of the free world."
 wif_rom_rump_kingdom:0 "The Rump Kingdom"
 wif_rom_rump_kingdom_desc:0 "Romania capitulated. The war is over for it: Hungary takes all of Transylvania, and what is left becomes a German protectorate in all but name."
 wif_rom_transylvanian_refugees:0 "The Refugees from Transylvania"
 wif_rom_transylvanian_refugees_desc:0 "Hundreds of thousands of Romanians flee south over the Carpathians from Hungarian rule."
 wif_rom_trusted_government:0 "A Government Berlin Trusts"
 wif_rom_trusted_government_desc:0 "The occupiers want men they can work with: generals, legionaries, the right kind of King's men."
 wif_rom_new_order:0 "A Place in the New Order"
 wif_rom_new_order_desc:0 "Defeat makes Romania an Axis state. Its oil now flows north - and its future runs on the German road."
 wif_rom_victory_over_germany:0 "Victory over Germany"
 wif_rom_victory_over_germany_desc:0 "The Reich has capitulated. Romania is on the winning side - this time from the start, or almost."
 wif_rom_transylvania_returned:0 "Northern Transylvania Returned"
 wif_rom_transylvania_returned_desc:0 "The victors annul the Vienna Award."
 wif_rom_peace_conference:0 "At the Peace Conference"
 wif_rom_peace_conference_desc:0 "Romania sits with the victors in Paris, not with the defeated."
 wif_rom_kingdom_of_victors:0 "A Kingdom Among the Victors"
 wif_rom_kingdom_of_victors_desc:0 "Greater Romania restored, on the right side of history."
 wif_rom_last_free_kingdom:0 "The Last Free Kingdom"
 wif_rom_last_free_kingdom_desc:0 "In 1952 Romania is still free - against every expectation."
 wif_romc_peoples_republic:0 "The Romanian People's Republic"
 wif_romc_peoples_republic_desc:0 "It forks at once on Moscow's choice of ruler:\n- THE SOVIET OFFICIAL (Petru Groza): Moscow's own man, a hardliner - Marxist Fundamentalist and Political Commissar - governing on the Soviet embassy's orders: faster Sovietisation, more extraction, less legitimacy.\n- THE LOCAL COLLABORATOR (Constantin Ion Parhon, the base game's communist leader): a Romanian communist with a following of his own - slower, but steadier.\n\nBoth roads lead through the real history of 1945-52 compressed into the WiF world: the King's abdication, rigged elections, the Sovroms that drain the oil, the Securitate, Pitesti, the Danube-Black Sea Canal, collectivisation and the Baragan deportations."
 wif_romc_soviet_official:0 "Groza, Moscow's Man"
 wif_romc_soviet_official_desc:0 "Moscow chose a Soviet official: Petru Groza governs Romania on the Soviet embassy's orders, a hardliner who does exactly as he is told."
 wif_romc_local_collaborator:0 "Parhon's Government"
 wif_romc_local_collaborator_desc:0 "Moscow chose a local collaborator: Constantin Ion Parhon, the physician and old Romanian socialist, fronts a Party government with a Romanian face."
 wif_romc_abdication:0 "The Abdication of the King"
 wif_romc_abdication_desc:0 "30 December 1947: the Party's leaders tell King Michael to abdicate, a pistol on the table and troops around the palace. He goes into exile."
 wif_romc_rigged_elections:0 "The Elections of 1946"
 wif_romc_rigged_elections_desc:0 "The bloc wins 70% - and everyone knows the opposition won."
 wif_romc_ploughmens_front:0 "The National Democratic Front"
 wif_romc_ploughmens_front_desc:0 "The Party's coalition of 'democratic' parties: a Romanian front for the new order."
 wif_romc_land_reform:0 "The Land Reform of 1945"
 wif_romc_land_reform_desc:0 "March 1945: the estates over 50 hectares are taken and handed to the peasants - for now."
 wif_romc_maniu_trial:0 "The Trial of Maniu"
 wif_romc_maniu_trial_desc:0 "1947: Iuliu Maniu and the National Peasant leaders are sentenced to life. Maniu dies in Sighet prison."
 wif_romc_securitate:0 "The Securitate"
 wif_romc_securitate_desc:0 "August 1948: the Department of State Security is founded, with Soviet advisers in every office."
 wif_romc_pitesti:0 "Pitesti"
 wif_romc_pitesti_desc:0 "1949-51: in Pitesti prison, political prisoners are forced to torture one another until they 'unmask' themselves - the most brutal re-education experiment in the Eastern bloc."
 wif_romc_greek_catholic_church:0 "The Church Abolished"
 wif_romc_greek_catholic_church_desc:0 "December 1948: the Greek-Catholic Church is dissolved and its bishops imprisoned; its parishes are given to the Orthodox Church."
 wif_romc_patrascanu:0 "The Fall of Patrascanu"
 wif_romc_patrascanu_desc:0 "Lucretiu Patrascanu, the 'national' communist who negotiated the 1944 coup, is arrested in 1948 as a Titoist and executed in 1954."
 wif_romc_peoples_constitution:0 "The Constitution of 1948"
 wif_romc_peoples_constitution_desc:0 "A Soviet-model constitution for the People's Republic."
 wif_romc_war_reparations:0 "War Reparations"
 wif_romc_war_reparations_desc:0 "Romania pays the Soviet Union - in oil, grain, rolling stock and factories."
 wif_romc_sovroms:0 "The Sovroms"
 wif_romc_sovroms_desc:0 "Joint Soviet-Romanian companies - Sovrompetrol, Sovromtransport, Sovrombanc - that send the profits east."
 wif_romc_nationalization:0 "The Nationalization of 1948"
 wif_romc_nationalization_desc:0 "11 June 1948: every factory, mine, bank and insurance company becomes state property overnight."
 wif_romc_collectivisation:0 "Collectivisation"
 wif_romc_collectivisation_desc:0 "From 1949 the peasants are forced into collective farms; those who resist are 'chiaburi' - kulaks - and are deported or jailed."
 wif_romc_canal_of_death:0 "The Danube-Black Sea Canal"
 wif_romc_canal_of_death_desc:0 "1949: a canal dug by tens of thousands of political prisoners - the 'Canal of Death'."
 wif_romc_five_year_plan:0 "The First Five-Year Plan"
 wif_romc_five_year_plan_desc:0 "1951: heavy industry first, at any cost."
 wif_romc_baragan:0 "The Baragan Deportations"
 wif_romc_baragan_desc:0 "June 1951: 40,000 Serbs, Germans and others from the Yugoslav border are deported to the empty Baragan steppe and left to build villages in the open."
 wif_romc_socialist_industry:0 "Socialist Industry"
 wif_romc_socialist_industry_desc:0 "Steel, tractors and oil for the bloc."
 wif_romc_red_army_garrison:0 "The Red Army Garrison"
 wif_romc_red_army_garrison_desc:0 "Soviet divisions stay in Romania 'to protect the lines of communication'."
 wif_romc_tudor_vladimirescu:0 "The Tudor Vladimirescu Division"
 wif_romc_tudor_vladimirescu_desc:0 "Romanian prisoners of war, re-educated in Soviet camps, formed into a 'volunteer' division."
 wif_romc_soviet_advisers:0 "Soviet Advisers"
 wif_romc_soviet_advisers_desc:0 "A Soviet officer beside every Romanian commander."
 wif_romc_peoples_army:0 "The Romanian People's Army"
 wif_romc_peoples_army_desc:0 "1948: the Royal Army is purged and rebuilt on the Soviet model."
 wif_romc_soviet_tanks:0 "T-34s for Romania"
 wif_romc_soviet_tanks_desc:0 "Soviet tanks, Soviet training, Soviet doctrine."
 wif_romc_soviet_bloc:0 "The Soviet Bloc"
 wif_romc_soviet_bloc_desc:0 "A colony of the Soviet Union, among its other satellites."
 wif_romc_friendship_treaty:0 "The Treaty of Friendship"
 wif_romc_friendship_treaty_desc:0 "1948: friendship, cooperation and mutual assistance with the Soviet Union."
 wif_romc_cominform:0 "The Cominform"
 wif_romc_cominform_desc:0 "The Cominform moves its headquarters from Belgrade to Bucharest after Tito's expulsion."
 wif_romc_against_tito:0 "Against Tito"
 wif_romc_against_tito_desc:0 "Troops on the Yugoslav border, show trials of 'Titoists'."
 wif_romc_stalinist_romania:0 "Stalinist Romania"
 wif_romc_stalinist_romania_desc:0 "Seven years after the flip, Romania is a Stalinist state in every institution - and a Soviet colony in every account book."
 wif_rom_defence_ministry_idea:0 "The Ministry of National Defence"
 wif_rom_defence_ministry_idea_desc:0 "One ministry for a modern army."
 wif_rom_balcescu_idea:0 "The Balcescu Academy"
 wif_rom_balcescu_idea_desc:0 "Officers trained for a modern war."
 wif_rom_icar_idea:0 "ICAR"
 wif_rom_icar_idea_desc:0 "Trainers and licence designs from Bucharest."
 wif_rom_rosiori_idea:0 "The Rosiori"
 wif_rom_rosiori_idea_desc:0 "The red hussars."
 wif_rom_grupul_7_idea:0 "Grupul 7 Vanatoare"
 wif_rom_grupul_7_idea_desc:0 "The aces of the Royal Air Force."
 wif_rom_white_squadron_idea:0 "The White Squadron"
 wif_rom_white_squadron_idea_desc:0 "Women flying air ambulances to the front."
 wif_rom_danube_flotilla_idea:0 "The Danube Flotilla"
 wif_rom_danube_flotilla_idea_desc:0 "Monitors on the river frontier."
 wif_rom_learn_from_the_past_idea:0 "Learn from the Past"
 wif_rom_learn_from_the_past_idea_desc:0 "Never again a collapse in one campaign."
 wif_rom_aeronautica_idea:0 "Aeronautica Regala"
 wif_rom_aeronautica_idea_desc:0 "The Royal Air Force of Romania."
 wif_rom_royal_army_idea:0 "The Royal Romanian Army"
 wif_rom_royal_army_idea_desc:0 "Thirty divisions fit for a modern war."
 wif_rom_army_1950_idea:0 "The Army of 1950"
 wif_rom_army_1950_idea_desc:0 "The strongest army in the Balkans."
 wif_rom_tax_reform_idea:0 "The Tax Reforms"
 wif_rom_tax_reform_idea_desc:0 "A modern tax code."
 wif_rom_cfr_idea:0 "Caile Ferate Romane"
 wif_rom_cfr_idea_desc:0 "The state railways."
 wif_rom_breadbasket_idea:0 "Breadbasket of Europe"
 wif_rom_breadbasket_idea_desc:0 "Grain for half the continent."
 wif_rom_astra_idea:0 "Astra Romana"
 wif_rom_astra_idea_desc:0 "Foreign capital keeps the oil fields producing."
 wif_rom_agrarian_credit_idea:0 "Agrarian Credit"
 wif_rom_agrarian_credit_idea_desc:0 "Cheap credit for the smallholders."
 wif_rom_electrification_idea:0 "Electrification"
 wif_rom_electrification_idea_desc:0 "Power lines to the villages."
 wif_rom_oil_diplomacy_idea:0 "Oil Diplomacy"
 wif_rom_oil_diplomacy_idea_desc:0 "Everyone wants Romanian oil."
 wif_rom_cooperatives_idea:0 "Peasant Cooperatives"
 wif_rom_cooperatives_idea_desc:0 "Tractors bought together."
 wif_rom_modern_industry_idea:0 "A Modern Romanian Industry"
 wif_rom_modern_industry_idea_desc:0 "Romanian guns, planes and fuel."
 wif_rom_1950_idea:0 "Romania in 1950"
 wif_rom_1950_idea_desc:0 "An industrial state."
 wif_rom_greater_romania_idea:0 "Greater Romania"
 wif_rom_greater_romania_idea_desc:0 "Doubled in size in 1918 - and ringed by neighbours who want their land back."
 wif_rom_camarilla_idea:0 "Carol's Camarilla"
 wif_rom_camarilla_idea_desc:0 "The palace clique rules."
 wif_rom_ssi_idea:0 "The SSI"
 wif_rom_ssi_idea_desc:0 "Romania's secret service."
 wif_rom_crown_council_idea:0 "The Crown Council"
 wif_rom_crown_council_idea_desc:0 "The King governs with the old party leaders."
 wif_rom_kings_army_idea:0 "The King's Army"
 wif_rom_kings_army_idea_desc:0 "The officers swear to the Crown."
 wif_rom_kingdom_1950_idea:0 "The Kingdom of Romania"
 wif_rom_kingdom_1950_idea_desc:0 "A King his people trust."
 wif_rom_peasant_state_idea:0 "The Peasant State"
 wif_rom_peasant_state_idea_desc:0 "Free, cooperative smallholders."
 wif_rom_minority_rights_idea:0 "Rights for the Minorities"
 wif_rom_minority_rights_idea_desc:0 "As Greater Romania promised in 1918."
 wif_rom_democracy_1950_idea:0 "A Democratic Romania"
 wif_rom_democracy_1950_idea_desc:0 "Governed by its parliament."
 wif_rom_conducator_state_idea:0 "The Conducator's State"
 wif_rom_conducator_state_idea_desc:0 "Order, discipline, Antonescu."
 wif_rom_marshal_rules_idea:0 "Antonescu's Romania"
 wif_rom_marshal_rules_idea_desc:0 "The Marshal rules for life."
 wif_rom_between_powers_idea:0 "Between the Great Powers"
 wif_rom_between_powers_idea_desc:0 "Every power courts Bucharest."
 wif_rom_armed_neutrality_idea:0 "Armed Neutrality"
 wif_rom_armed_neutrality_idea_desc:0 "A million men mobilised."
 wif_rom_german_mission_idea:0 "The German Military Mission"
 wif_rom_german_mission_idea_desc:0 "German instructors and weapons."
 wif_rom_order_idea:0 "Order and Discipline"
 wif_rom_order_idea_desc:0 "Governing like Hitler's Europe."
 wif_rom_munchen_idea:0 "Operation Munchen"
 wif_rom_munchen_idea_desc:0 "The lost provinces retaken."
 wif_rom_mountain_corps_idea:0 "The Mountain Corps"
 wif_rom_mountain_corps_idea_desc:0 "Vanatori de Munte in the Caucasus."
 wif_rom_flak_idea:0 "The Flak of Ploiesti"
 wif_rom_flak_idea_desc:0 "The best-defended target in Europe."
 wif_rom_tidal_wave_idea:0 "Tidal Wave"
 wif_rom_tidal_wave_idea_desc:0 "The refineries burn."
 wif_rom_grossraum_idea:0 "In the Grossraum"
 wif_rom_grossraum_idea_desc:0 "Fixed prices, German managers, guaranteed markets."
 wif_rom_reich_divided_idea:0 "The Reich Divided"
 wif_rom_reich_divided_idea_desc:0 "Romania's oil is Romania's again."
 wif_rom_1952_idea:0 "Romania in 1952"
 wif_rom_1952_idea_desc:0 "Greater Romania survived."
 wif_rom_carpathians_idea:0 "Hold the Carpathians"
 wif_rom_carpathians_idea_desc:0 "The mountains are our fortress."
 wif_rom_home_defence_idea:0 "War with Germany"
 wif_rom_home_defence_idea_desc:0 "The Wehrmacht will pay for the oil."
 wif_rom_new_order_idea:0 "A Place in the New Order"
 wif_rom_new_order_idea_desc:0 "Defeated, and an Axis state."
 wif_rom_victors_idea:0 "A Kingdom Among the Victors"
 wif_rom_victors_idea_desc:0 "On the right side of history."
 wif_rom_last_free_idea:0 "The Last Free Kingdom"
 wif_rom_last_free_idea_desc:0 "Still free, against every expectation."
 wif_rom_tw_war_idea:0 "Take Back Transylvania"
 wif_rom_tw_war_idea_desc:0 "Sixty days to take Cluj."
 wif_rom_cluj_humiliation_idea:0 "The Humiliation of Cluj"
 wif_rom_cluj_humiliation_idea_desc:0 "Sixty days, and Cluj is still Hungarian."
 wif_rom_ploiesti_wrecked_idea:0 "Ploiesti Wrecked"
 wif_rom_ploiesti_wrecked_idea_desc:0 "We burned our own oil fields rather than give them to Germany."
 wif_romc_colony_idea:0 "A Soviet Colony"
 wif_romc_colony_idea_desc:0 "Ruled from Moscow, drained by Moscow."
 wif_romc_moscow_directives_idea:0 "Directives from Moscow"
 wif_romc_moscow_directives_idea_desc:0 "The Soviet embassy governs."
 wif_romc_ploughmen_idea:0 "The National Democratic Front"
 wif_romc_ploughmen_idea_desc:0 "A Romanian front for the Party."
 wif_romc_land_reform_idea:0 "The Land Reform"
 wif_romc_land_reform_idea_desc:0 "The estates go to the peasants - for now."
 wif_romc_securitate_idea:0 "The Securitate"
 wif_romc_securitate_idea_desc:0 "Soviet advisers in every office."
 wif_romc_sovroms_idea:0 "The Sovroms"
 wif_romc_sovroms_idea_desc:0 "The profits go east."
 wif_romc_collective_farms_idea:0 "Collective Farms"
 wif_romc_collective_farms_idea_desc:0 "The peasants forced in."
 wif_romc_socialist_industry_idea:0 "Socialist Industry"
 wif_romc_socialist_industry_idea_desc:0 "Steel, tractors and oil for the bloc."
 wif_romc_soviet_advisers_idea:0 "Soviet Advisers"
 wif_romc_soviet_advisers_idea_desc:0 "A Soviet officer beside every commander."
 wif_romc_peoples_army_idea:0 "The Romanian People's Army"
 wif_romc_peoples_army_idea_desc:0 "Rebuilt on the Soviet model."
