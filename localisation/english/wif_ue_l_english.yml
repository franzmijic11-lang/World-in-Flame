 wif_ue_campaign:0 "The Campaign Trail"
 wif_ue_campaign_desc:0 "§YThe [?wif_ue_year|0] [wif_ue_kind_name]§!\nYou lead the §Y[wif_ue_player_party]§! campaign. [wif_ue_nominees]\n\nIf the election were held today (electoral votes):\n§BStrong Democratic [?wif_ue_t1|0]§! · §BDemocratic [?wif_ue_t2|0]§! · §YFence [?wif_ue_t3|0]§! · §RRepublican [?wif_ue_t4|0]§! · §RStrong Republican [?wif_ue_t5|0]§!\nSafe for the Democrats: §B[?wif_ue_tdem|0]§!   Safe for the Republicans: §R[?wif_ue_trep|0]§!   Needed to win the presidency: §Y266§!\n\nCampaign in a state to move it toward your party. Fence states are counted one by one on election night, and the result waits for every one of them. Campaigning closes a month before election day."
 wif_ue_kind_1:0 "Presidential Election"
 wif_ue_kind_2:0 "Midterm Elections"
 wif_ue_sway_state:0 "Campaign in [FROM.GetName]"
 wif_ue_sway_state_desc:0 "Rallies, radio time and handshakes. Lean here: §Y[?FROM.wif_ue_show|0]§! (0 = solid Democratic, 50 = a coin toss, 100 = solid Republican)."
 wif_ue_sway_tt:0 "Moves [FROM.GetName] §Y15-20§! points toward §Y[wif_ue_player_party]§!."
 wif_ue_four_at_once_tt:0 "Fewer than §Y4§! campaigns running at once"
 wif_ue_congress_majority_tt:0 "The President's party holds a majority of both houses (House: §Y[?USA.wif_ue_house_pct|0]%§!, Senate: §Y[?USA.wif_ue_sen_pct|0]%§!)"
 wif_ue_congress_supermajority_tt:0 "The President's party holds §Y60%§! of the House and a majority of the Senate (House: §Y[?USA.wif_ue_house_pct|0]%§!, Senate: §Y[?USA.wif_ue_sen_pct|0]%§!)"
 wif_ue_senate_treaty_tt:0 "The President's party holds §Ytwo thirds§! of the Senate (now §Y[?USA.wif_ue_sen_pct|0]%§!)"
 wif_ue_join_AK_tt:0 "§YAlaska§! becomes a voting state: §Y1§! House seat and §Y2§! senators, first held by the President's party."
 wif_ue_join_HI_tt:0 "§YHawaii§! becomes a voting state: §Y1§! House seat and §Y2§! senators, first held by the President's party."
 wif_ue_shift_industrial_pres_tt:0 "Voters in the industrial states (New York, New Jersey, Pennsylvania, Ohio, Michigan, Illinois, Indiana) move toward the President's party."
 wif_ue_shift_industrial_opp_tt:0 "Voters in the industrial states (New York, New Jersey, Pennsylvania, Ohio, Michigan, Illinois, Indiana) turn against the President's party."
 wif_ue_shift_farm_pres_tt:0 "Voters in the farm states (Iowa, Kansas, Nebraska, the Dakotas, Minnesota, Wisconsin, Missouri) move toward the President's party."
 wif_ue_shift_farm_opp_tt:0 "Voters in the farm states (Iowa, Kansas, Nebraska, the Dakotas, Minnesota, Wisconsin, Missouri) turn against the President's party."
 wif_ue_shift_south_pres_tt:0 "Voters in the South move toward the President's party."
 wif_ue_shift_south_opp_tt:0 "Voters in the South turn against the President's party."
 wif_ue_shift_west_pres_tt:0 "Voters in the West move toward the President's party."
 wif_ue_shift_west_opp_tt:0 "Voters in the West turn against the President's party."
 wif_ue_shift_new_england_pres_tt:0 "Voters in New England move toward the President's party."
 wif_ue_shift_new_england_opp_tt:0 "Voters in New England turn against the President's party."
 wif_ue_shift_business_pres_tt:0 "Voters in the business states (New York, New Jersey, Connecticut, Pennsylvania, Delaware, Massachusetts) move toward the President's party."
 wif_ue_shift_business_opp_tt:0 "Voters in the business states (New York, New Jersey, Connecticut, Pennsylvania, Delaware, Massachusetts) turn against the President's party."
 wif_ue_shift_midwest_pres_tt:0 "Voters in the Midwest move toward the President's party."
 wif_ue_shift_midwest_opp_tt:0 "Voters in the Midwest turn against the President's party."
 wif_ue_shift_nation_pres_tt:0 "Voters in every state move toward the President's party."
 wif_ue_shift_nation_opp_tt:0 "Voters in every state turn against the President's party."
 wif_ue.1.t:0 "The [?wif_ue_year|0] Campaign"
 wif_ue.1.d:0 "The [wif_ue_kind_name] are coming. The parties are opening their offices and booking their halls.\n\nWhich party will you lead this time? The other one will be run by its own strategists, and they will not make it easy.\n\nElectoral votes as things stand: §BDemocratic [?wif_ue_tdem|0]§!, §YFence [?wif_ue_t3|0]§!, §RRepublican [?wif_ue_trep|0]§!."
 wif_ue.1.a:0 "The Democrats."
 wif_ue.1.b:0 "The Republicans."
 wif_ue.2.t:0 "Four More Years?"
 wif_ue.2.d:0 "Roosevelt will run on the record of the New Deal against a Republican Party that has not won since 1928. The Literary Digest predicts a Landon landslide. Few others do.\n\nIn 1936 you lead the Democratic campaign. Campaigning costs only §Y20§! political power a state this year."
 wif_ue.2.a:0 "Every man a job."
 wif_ue.20.t:0 "Too Close to Call"
 wif_ue.20.d:0 "The safe states are in, but §Y[?wif_ue_pending_count|0]§! states are too close to call. Every vote will be counted before a winner is declared."
 wif_ue.20.a:0 "Count every vote."
 wif_ue.21.t:0 "The [?wif_ue_year|0] Presidential Election"
 wif_ue.21.d:0 "The count is complete.\n\nElectoral College: §BDemocrats [?wif_ue_ev_d|0]§!, §RRepublicans [?wif_ue_ev_r|0]§!.\nHouse: §B[?wif_ue_house_d|0]§! Democrats, §R[?wif_ue_house_r|0]§! Republicans.\nSenate: §B[?wif_ue_sen_d|0]§! Democrats, §R[?wif_ue_sen_r|0]§! Republicans.\n\n[ROOT.GetLeader] will be the President of the United States."
 wif_ue.21.a:0 "The people have spoken."
 wif_ue.22.t:0 "The [?wif_ue_year|0] Midterm Elections"
 wif_ue.22.d:0 "The new Congress:\n\nHouse: §B[?wif_ue_house_d|0]§! Democrats, §R[?wif_ue_house_r|0]§! Republicans.\nSenate: §B[?wif_ue_sen_d|0]§! Democrats, §R[?wif_ue_sen_r|0]§! Republicans.\n\nThe President's party now holds §Y[?wif_ue_house_pct|0]%§! of the House and §Y[?wif_ue_sen_pct|0]%§! of the Senate."
 wif_ue.22.a:0 "Back to work."
 wif_ue.30.t:0 "The President Is Dead"
 wif_ue.30.d:0 "Franklin Delano Roosevelt died this afternoon at Warm Springs, Georgia, of a cerebral haemorrhage. He had been President for twelve years.\n\nHarry S. Truman of Missouri, Vice President for eighty-two days, took the oath of office this evening in the Cabinet Room."
 wif_ue.30.a:0 "\"I felt like the moon, the stars and all the planets had fallen on me.\""
 wif_ue.106.t:0 "The 1940 Republican National Convention"
 wif_ue.106.d:0 "The delegates have gathered and the balloting is about to begin. Who will carry the Republican banner in 1940?\n\nCandidates: Wendell Willkie, Thomas E. Dewey."
 wif_ue.110.t:0 "The 1944 Republican National Convention"
 wif_ue.110.d:0 "The delegates have gathered and the balloting is about to begin. Who will carry the Republican banner in 1944?\n\nCandidates: Thomas E. Dewey, Wendell Willkie, Douglas MacArthur."
 wif_ue.113.t:0 "The 1948 Democratic National Convention"
 wif_ue.113.d:0 "The delegates have gathered and the balloting is about to begin. Who will carry the Democratic banner in 1948?\n\nCandidates: Harry S. Truman, Dwight D. Eisenhower."
 wif_ue.118.t:0 "The 1952 Republican National Convention"
 wif_ue.118.d:0 "The delegates have gathered and the balloting is about to begin. Who will carry the Republican banner in 1952?\n\nCandidates: Dwight D. Eisenhower, Douglas MacArthur."
 wif_ue_nobody:0 ""
 wif_ue_nominees_text:0 "Nominees: §B[wif_ue_nom_d_name]§! (Democratic) against §R[wif_ue_nom_r_name]§! (Republican)."
