 GER_reichskommissariat_schweden:0 "Establish Reichskommissariat Schweden"
 GER_reichskommissariat_schweden_desc:0 "Sweden's neutrality is over, and so is its kingdom. Rosenberg's office will govern it as a Reichskommissariat - through Swedish National Socialists, under the banner once planned for a 'Reichsprotektorat Nordland' - and its iron will go where it always should have: to the Reich."
 GER_reichskommissariat_schweden_effect_tt:0 "§YReichskommissariat Schweden§! is created from the Swedish states, as our §Yintegrated puppet§!, under the §YReichskommissariat§! economic law."
 GER_reichskommissariat_schweden_leader_tt:0 "§YSven Olov Lindholm§!, leader of the Swedish National Socialists, becomes its leader."
 wif_rks_mines_category:0 "The Iron Mines"
 wif_rks_mines_category_desc:0 "The Swedes blew up the mines of Kiruna and Gallivare before they surrendered. Without the iron, Sweden is worth little to the Reich."
 wif_rks_rebuild_the_mines:0 "Rebuild the Iron Mines"
 wif_rks_rebuild_the_mines_desc:0 "German engineers and Swedish labour clear the shafts, pump out the water and relay the ore railway to Narvik and Lulea."
 wif_rks_rebuild_the_mines_tt:0 "After §Y90§! days the mines of §YNorrbotten§! and §YVasterbotten§! work again: the §RBlown-Up Mines§! penalty is removed. §YGermany§! is pleased (§G+25§! opinion)."
 wif_rks_mines_opinion:0 "The Iron Flows Again"
