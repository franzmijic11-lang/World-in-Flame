l_english:
 wif_pws_root:0 "Nobody Is Coming"
 wif_pws_root_desc:0 "The SME is gone. No orders, no supply trains, no Moscow. Whatever this place becomes, it becomes on its own."
 wif_pws_count:0 "Count the Rifles, Count the Mouths"
 wif_pws_count_desc:0 "Before anything can be planned, someone has to know how many soldiers, how many workers and how many hungry there are."
 wif_pws_garrison_rule:0 "Rule of the Garrison"
 wif_pws_garrison_rule_desc:0 "The officers already hold the guns. Let them hold the offices too."
 wif_pws_provisional_soviet:0 "A Provisional Soviet"
 wif_pws_provisional_soviet_desc:0 "A council of workers' and soldiers' deputies, as in 1917 - on paper, at least."
 wif_pws_seal:0 "Seal of the New State"
 wif_pws_seal_desc:0 "A flag, a stamp and a name on the documents. It is not much, but it is ours."
 wif_pws_feuds:0 "Settle the Feuds of the Officers"
 wif_pws_feuds_desc:0 "Every colonel who marched here thinks he should be the one in charge."
 wif_pws_strongman:0 "The Strongman's Peace"
 wif_pws_strongman_desc:0 "One man decides, and the arguments end."
 wif_pws_elections:0 "Elections in the Towns"
 wif_pws_elections_desc:0 "Let the towns choose their own soviets - under supervision."
 wif_pws_constitution:0 "A Constitution of Sorts"
 wif_pws_constitution_desc:0 "Written in a week, amended every month, but written."
 wif_pws_recognition:0 "Recognition from Abroad"
 wif_pws_recognition_desc:0 "An embassy, even one, would mean somebody out there admits we exist."
 wif_pws_neither:0 "Neither Moscow nor Berlin"
 wif_pws_neither_desc:0 "The old Union is dead and the Reich is not our friend. We are something else now."
 wif_pws_state:0 "A State, Not a Warband"
 wif_pws_state_desc:0 "Ten years on, the warlord's camp has become a country. A small, poor one - but a country."
 wif_pws_envoys:0 "Envoys to the Neighbours"
 wif_pws_envoys_desc:0 "Riders and radio messages to the other fragments of the Union."
 wif_pws_brothers:0 "Brothers in the Wreckage"
 wif_pws_brothers_desc:0 "Better a pact with another warlord than to die alone."
 wif_pws_trust_no_one:0 "Trust No One"
 wif_pws_trust_no_one_desc:0 "Every other warlord would take our land the moment we looked away."
 wif_pws_trade:0 "Trade Across the Lines"
 wif_pws_trade_desc:0 "Grain for fuel, timber for rifles, with whoever is buying."
 wif_pws_fed:0 "Keep the Divisions Fed"
 wif_pws_fed_desc:0 "An unfed army becomes a band of looters within a month."
 wif_pws_cadre:0 "Officer Cadre School"
 wif_pws_cadre_desc:0 "A handful of staff officers teaching what they still remember."
 wif_pws_militia:0 "Militia of the Villages"
 wif_pws_militia_desc:0 "Every village keeps a dozen rifles and knows how to use them."
 wif_pws_drill:0 "Drill Manuals from the Old Army"
 wif_pws_drill_desc:0 "The Red Army's field regulations, reprinted on whatever paper there is."
 wif_pws_junctions:0 "Garrison the Rail Junctions"
 wif_pws_junctions_desc:0 "Whoever holds the junctions holds the country."
 wif_pws_few_trained:0 "Few but Trained"
 wif_pws_few_trained_desc:0 "A small army that can fight, rather than a large one that cannot."
 wif_pws_every_man:0 "Every Man a Rifle"
 wif_pws_every_man_desc:0 "No professional army, only the whole people armed."
 wif_pws_artillery:0 "Field Guns from the Depots"
 wif_pws_artillery_desc:0 "Old 76mm guns found in a depot nobody looted."
 wif_pws_mortars:0 "Mortars and Machine Guns"
 wif_pws_mortars_desc:0 "What a small army can actually build and keep firing."
 wif_pws_lorries:0 "Horses and Lorries"
 wif_pws_lorries_desc:0 "Most of the trucks are gone, but horses can still pull a gun."
 wif_pws_border:0 "Border Posts"
 wif_pws_border_desc:0 "Marked borders, guarded crossings, and fewer raids."
 wif_pws_standing:0 "A Standing Army"
 wif_pws_standing_desc:0 "No longer a warlord's following, but an army that answers to the state."
 wif_pws_inventory:0 "Inventory the Workshops"
 wif_pws_inventory_desc:0 "Lathes, presses, boilers: what survived the evacuation and the war."
 wif_pws_power:0 "Repair the Power Station"
 wif_pws_power_desc:0 "Nothing works without electricity, and the station has been running at a quarter."
 wif_pws_mines:0 "Reopen the Mines"
 wif_pws_mines_desc:0 "The shafts were flooded on purpose in the retreat."
 wif_pws_workshops:0 "Local Workshops"
 wif_pws_workshops_desc:0 "Small, but making what people need."
 wif_pws_timber:0 "Timber and Coal for Sale"
 wif_pws_timber_desc:0 "The only things we have more of than we need."
 wif_pws_branch_lines:0 "Mend the Branch Lines"
 wif_pws_branch_lines_desc:0 "The main line is patched; the branch lines feed the villages."
 wif_pws_rail_workshops:0 "Rail Workshops"
 wif_pws_rail_workshops_desc:0 "Rebuild the locomotives instead of waiting for new ones."
 wif_pws_small_arms:0 "A Small Arms Plant"
 wif_pws_small_arms_desc:0 "Rifles of our own, not ones taken from the dead."
 wif_pws_second_shift:0 "A Second Shift"
 wif_pws_second_shift_desc:0 "The same machines, worked twice as long."
 wif_pws_plan:0 "A Plan for Five Years"
 wif_pws_plan_desc:0 "Modest targets, actually met."
 wif_pws_tractors:0 "The Tractor Works"
 wif_pws_tractors_desc:0 "A factory that can make tractors can make other things too."
 wif_pws_scrap:0 "Steel from Scrap"
 wif_pws_scrap_desc:0 "Wrecked tanks and burned rail yards are the only steel mine we have."
 wif_pws_own_economy:0 "An Economy of Its Own"
 wif_pws_own_economy_desc:0 "It still cannot match a real power, but it no longer lives off what the Union left behind."
 wif_pws_choose_capital:0 "Choose a Capital"
 wif_pws_choose_capital_desc:0 "The headquarters town becomes the seat of government - a garrison town, a rail junction, a few streets of wooden houses."
 wif_pws_survey:0 "Survey the Town"
 wif_pws_survey_desc:0 "Engineers walk every street and draw what a city here could look like."
 wif_pws_housing:0 "Barracks into Housing"
 wif_pws_housing_desc:0 "The barracks emptied when the army moved to the front lines. Families can live there now."
 wif_pws_rubble:0 "Clear the Rubble"
 wif_pws_rubble_desc:0 "Before anything new is built, what the war left must be carted away."
 wif_pws_water:0 "Water and Sewers"
 wif_pws_water_desc:0 "A town becomes a city when its people stop getting sick from the water."
 wif_pws_electric:0 "Power to Every Street"
 wif_pws_electric_desc:0 "Electric light in every house, not just the headquarters."
 wif_pws_hospital:0 "A Hospital Worthy of the Name"
 wif_pws_hospital_desc:0 "The field hospital moves into a real building."
 wif_pws_schools:0 "Schools and a Technical Institute"
 wif_pws_schools_desc:0 "Engineers for the factories have to come from somewhere."
 wif_pws_trams:0 "Markets and Tramlines"
 wif_pws_trams_desc:0 "A market square and a tram line to the factories."
 wif_pws_villages:0 "Bring the Villages to Town"
 wif_pws_villages_desc:0 "Housing, work and bread draw people in from the countryside."
 wif_pws_city:0 "The Capital Rises"
 wif_pws_city_desc:0 "Where there was a garrison town ten years ago, there is now a city."
 wif_pws_strongman:0 "The Strongman's Peace"
 wif_pws_strongman_desc:0 "One man decides, and the arguments end."
 wif_pws_town_soviets:0 "Town Soviets"
 wif_pws_town_soviets_desc:0 "The towns choose their own councils - under supervision."
 wif_pws_trade:0 "Trade Across the Lines"
 wif_pws_trade_desc:0 "Grain for fuel, timber for rifles, with whoever is buying."
 wif_pws_drill_manuals:0 "Old Army Drill Manuals"
 wif_pws_drill_manuals_desc:0 "The Red Army's regulations, reprinted on whatever paper there is."
 wif_pws_few_but_trained:0 "Few but Trained"
 wif_pws_few_but_trained_desc:0 "A small army that can fight, rather than a large one that cannot."
 wif_pws_every_man_a_rifle:0 "Every Man a Rifle"
 wif_pws_every_man_a_rifle_desc:0 "No professional army - only the whole people, armed."
 wif_pws_border_posts:0 "Border Posts"
 wif_pws_border_posts_desc:0 "Marked borders, guarded crossings, and fewer raids."
 wif_pws_exports:0 "Timber and Coal for Sale"
 wif_pws_exports_desc:0 "The only things we have more of than we need."
 wif_pws_five_year_plan:0 "A Plan for Five Years"
 wif_pws_five_year_plan_desc:0 "Modest targets, actually met."
 wif_pws_institute:0 "The Technical Institute"
 wif_pws_institute_desc:0 "Engineers for the factories have to come from somewhere."
 wif_pws_inventory:0 "Inventory the Workshops"
