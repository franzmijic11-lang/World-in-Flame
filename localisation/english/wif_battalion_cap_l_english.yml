l_english:
 # Overcap penalty, applied as a dynamic modifier once the one month
 # demobilisation grace has run out.
 wif_over_battalion_cap:0 "Overstretched Army"
 wif_over_battalion_cap_desc:0 "This nation fields more line battalions than it can sustain. Every battalion over the limit costs attrition, supply, political authority and industrial output, and the penalty grows with each one over."

 # Officer corps readout, drawn under the special forces block.
 wif_battalion_cap_count:0 "[?wif_bat_used|0]/[?wif_bat_limit|0]"
 wif_battalion_cap_label:0 "Line Battalions"
 wif_battalion_cap_desc:0 "Line battalions in service: §Y[?wif_bat_used|0]§!\nSustainable limit: §G[?wif_bat_limit|0]§!\n\n§HWhat the limit is built from§!\nBase: §G324§! battalions, for every country.[GetWifCapTerritory][GetWifCapRedArmy][GetWifCapOneState][GetWifCapWarlord][GetWifCapConscription][GetWifCapEconomy][GetWifCapStability][GetWifCapWarSupport][GetWifCapMajor][GetWifCapFaction][GetWifCapWarBalance][GetWifCapWarDef][GetWifCapWar2x][GetWifCapWar4x][GetWifCapTension][GetWifCapDouble]\n\n§HTotal: [GetWifCapTotal]\n\nTerritory and the single state penalty are counted in battalions and are added after the percentages, so they are never scaled by them. Everything else adds together against the base rather than compounding, and every one is re-checked each week - wartime bonuses vanish the week a war ends, which is what the one month demobilisation grace exists to absorb.\n\nSupport companies and regiments are not counted and are not limited.\n\nThis is a §Ysoft§! limit - going over is allowed, but it costs.[GetWifBattalionCapPenalties]"

 # --- Cap breakdown -------------------------------------------------------
 # One line per bonus, emitted by the defined_texts in
 # common/scripted_localisation/wif_battalion_cap.txt. A bonus that is not
 # live resolves to wif_cap_line_none instead, so its line vanishes rather
 # than showing +0%.
 #
 # Each line states the payout first and the reason second, so the column of
 # green numbers reads straight down.
 wif_cap_line_none:0 ""
 wif_cap_line_terr:0 "\n §G+[?wif_terr_bat|1]§! battalions Territory §g([?wif_terr_states|0] states, [?wif_terr_cores|0] cored)§!"
 wif_cap_line_double:0 "\n §G×[?wif_cap_multiplier|0]§! The millions of China §g(everything above, doubled)§!"
 wif_cap_line_redarmy:0 "\n §G+[?wif_src_redarmy|0]§! battalions The Red Army §g(the standing army of the Union, whatever else is true this week)§!"
 wif_cap_line_onestate:0 "\n §R[?wif_src_onestate|1]§! battalions Single state §g(a country of one state is held to 27)§!"
 wif_cap_line_consc:0 "\n §G+[?wif_src_consc|%0]§! Conscription §g([GetWifCapLawName])§!"
 # The only two breakdown lines that can be a penalty. The %0 formatter
 # prints the minus sign itself, which is why the negative key has no "+".
 wif_cap_line_warlord:0 "\n §G+[?wif_src_warlord|%0]§! Russian warlord §g(no borders anyone recognises, and every man the Union trained)§!"
 wif_cap_line_econ:0 "\n §G+[?wif_src_econ|%0]§! Economy §g([GetWifCapEconomyName])§!"
 wif_cap_line_econ_neg:0 "\n §R[?wif_src_econ|%0]§! Economy §g([GetWifCapEconomyName])§!"
 wif_cap_line_stab:0 "\n §G+[?wif_src_stab|%0]§! Stability §g(at [?wif_val_stab|%0])§!"
 wif_cap_line_ws:0 "\n §G+[?wif_src_ws|%0]§! War support §g(at [?wif_val_ws|%0])§!"
 wif_cap_line_major:0 "\n §G+[?wif_src_major|0]§! battalions Major power §g(one of the seven the world actually answers to)§!"
 wif_cap_line_faction:0 "\n §G+[?wif_src_faction|%0]§! Faction leader"
 wif_cap_line_war_weaker:0 "\n §G+[?wif_src_war_bal|%0]§! At war, enemy is weaker §g(their strength [?wif_val_enemy_ratio|%0] of yours)§!"
 wif_cap_line_war_even:0 "\n §G+[?wif_src_war_bal|%0]§! At war, evenly matched §g(their strength [?wif_val_enemy_ratio|%0] of yours)§!"
 wif_cap_line_war_stronger:0 "\n §G+[?wif_src_war_bal|%0]§! At war, enemy is stronger §g(their strength [?wif_val_enemy_ratio|%0] of yours)§!"
 wif_cap_line_war_def:0 "\n §G+[?wif_src_war_def|%0]§! Fighting a defensive war"
 wif_cap_line_war_2x:0 "\n §G+[?wif_src_war_2x|%0]§! Outnumbered more than two to one"
 wif_cap_line_war_4x:0 "\n §G+[?wif_src_war_4x|%0]§! Outnumbered four to one or worse"
 wif_cap_line_tension:0 "\n §G+[?wif_src_tension|%0]§! World tension §g(at [?wif_val_tension|%0])§!"

 # Conscription law names, chosen by GetWifCapLawName. Written out rather than
 # referenced from vanilla's keys so a loc change upstream cannot blank them.
 wif_cap_law_barrel:0 "Scraping the Barrel"
 wif_cap_law_adults:0 "All Adults Serve"
 wif_cap_law_requirement:0 "Service by Requirement"
 wif_cap_law_extensive:0 "Extensive Conscription"
 wif_cap_law_limited:0 "Limited Conscription"
 wif_cap_law_volunteer:0 "Volunteer Only"
 wif_cap_law_disarmed:0 "Disarmed Nation - contributes nothing"

 # Economy law names, chosen by GetWifCapEconomyName. Early Mobilisation is
 # the neutral law and never actually shows - its line is hidden at 0% - but
 # it is written out anyway as the fallback branch.
 wif_cap_econ_totaler_krieg:0 "Totaler Krieg"
 wif_cap_econ_war:0 "War Economy"
 wif_cap_econ_nds:0 "National Defense State"
 wif_cap_econ_rk:0 "Reichskommissariat Economy"
 wif_cap_econ_total:0 "Total Economic Mobilisation"
 wif_cap_econ_partial:0 "Partial Economic Mobilisation"
 wif_cap_econ_nep:0 "New Economic Policy"
 wif_cap_econ_cim:0 "Capital Investment Model"
 wif_cap_econ_civilian:0 "Civilian Economy"
 wif_cap_econ_isolation:0 "Isolation"
 wif_cap_econ_undisturbed:0 "Undisturbed Isolation"
 wif_cap_econ_early:0 "Early Mobilisation - contributes nothing"

 # The total, signed. Positive is green with an explicit plus; negative is
 # red and lets the formatter supply the minus.
 wif_cap_total_pos:0 "§G+[?wif_bat_pct|%0]§! of the base, plus the battalions listed above, giving §G[?wif_bat_limit|0]§!"
 wif_cap_total_neg:0 "§R[?wif_bat_pct|%0]§! of the base, plus the battalions listed above, giving §G[?wif_bat_limit|0]§!"

 # Penalty breakdown, selected by GetWifBattalionCapPenalties in
 # common/scripted_localisation/wif_battalion_cap.txt.
 wif_cap_penalties_none:0 "\n\n§GWithin the limit. No penalties.§!"
 wif_cap_penalties_grace:0 "\n\n§YOver the limit by [?wif_battalions_over|0] battalions.§!\n§YDemobilisation grace is still running - no penalties yet. Get back under the limit within the month and none will be applied.§!"
 wif_cap_penalties_active:0 "\n\n§ROver the limit by [?wif_battalions_over|0] battalions. Active penalties:§!\nAttrition: §R[?wif_over_attrition|+%1]§!\nSupply consumption: §R[?wif_over_supply|+%1]§!\nPolitical power gain: §R[?wif_over_pp|+%1]§!\nFactory output: §R[?wif_over_factory|+%1]§!"
