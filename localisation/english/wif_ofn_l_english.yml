l_english:
 wif_ofn_faction:0 "Organisation of Free Nations"
 wif_ofn.1.t:0 "The Organisation of Free Nations"
 wif_ofn.1.desc:0 "The treaty that kept the United States out of every alliance has expired. In Washington, the President has signed the charter of the Organisation of Free Nations - a pact for the defence of democracy wherever it still stands. Canada and the remaining nations of the Commonwealth have dissolved their own alliance and joined it."
 wif_ofn.1.a:0 "The free world stands together."
