 wif_sme.1.t:0 "The Red Army Coup"
 wif_sme.1.desc:0 "With the catastrophic failure of the Soviet government and the humiliating white peace with Germany surrendering vast western territories, the chain of command has shattered. The Red Army, refusing to accept the political collapse and the loss of half the Motherland, has seized power directly. What remains of the Soviet state now answers to a Military Emergency Government under the command of the Red Army's senior officers. The Party is dead. The Army remains."
 wif_sme.1.a:0 "The Army stands."
