l_english:
 # --- Ideas ---------------------------------------------------------------
 wif_ger_government_by_audience:0 "Government by Audience"
 wif_ger_government_by_audience_desc:0 "Nobody sees the Führer without Bormann's say-so. Ministers wait for days in the corridor."
 wif_ger_gorings_ambition:0 "Göring's Last Ambition"
 wif_ger_gorings_ambition_desc:0 "The Reichsmarschall spends more time counting his allies than his aircraft."
 wif_ger_second_stroke:0 "The Second Stroke"
 wif_ger_second_stroke_desc:0 "The Führer can barely sign his name. Others sign it for him."
 wif_ger_berghof_court:0 "The Berghof Court"
 wif_ger_berghof_court_desc:0 "The government of the Reich sits on a mountain, waiting for an audience."
 wif_ger_the_fuhrers_guard:0 "The Führer's Guard"
 wif_ger_the_fuhrers_guard_desc:0 "The SS men who did not follow Himmler now guard the Führer, and answer to no general."
 wif_ger_the_fuhrers_guard_2:0 "The Führer's Guard"
 wif_ger_the_fuhrers_guard_2_desc:0 "Shut out of the army's barracks, the guard trains harder than ever, and against whom nobody says."
 wif_ger_two_armies:0 "Two Armies in One Reich"
 wif_ger_two_armies_desc:0 "The guard gets the newest tanks and the first fuel. The army gets what is left."
 wif_ger_purged_officer_corps:0 "Purged Officer Corps"
 wif_ger_purged_officer_corps_desc:0 "Twenty-two generals are gone, and every officer who remains has learned to say nothing."
 wif_ger_crushing_the_black_order:0 "Crushing the Black Order"
 wif_ger_crushing_the_black_order_desc:0 "The Wehrmacht marches west, against the SS."
 wif_ger_emergency_signatures:0 "Delayed Signatures"
 wif_ger_emergency_signatures_desc:0 "Every order of Speer's emergency programme waits at the Party Chancellery for a signature."
 wif_ger_speer_blamed:0 "Speer Takes the Blame"
 wif_ger_speer_blamed_desc:0 "Whatever goes wrong in the Reich, it was Speer's fault."
 wif_ger_economy_in_free_fall:0 "The Economy in Free Fall"
 wif_ger_economy_in_free_fall_desc:0 "Consumer goods have taken every civilian factory, and now they take from the arms plants too."
 wif_ger_volksliste:0 "The Deutsche Volksliste"
 wif_ger_volksliste_desc:0 "Those listed as German in the annexed lands are drafted."
 wif_ger_blood_before_labour:0 "Blood Before Labour"
 wif_ger_blood_before_labour_desc:0 "Himmler won the argument, and Speer pays for it."
 wif_ger_labour_before_blood:0 "Labour Before Blood"
 wif_ger_labour_before_blood_desc:0 "Speer won the argument. The SS has not forgiven it."
 wif_ger_party_calls_it_betrayal:0 "The Party Calls It Betrayal"
 wif_ger_party_calls_it_betrayal_desc:0 "Labour Before Blood is called weakness in every Gau office."
 wif_ger_wonder_weapons_office:0 "The Wonder Weapons Office"
 wif_ger_wonder_weapons_office_desc:0 "The war's secret projects, under one roof and one budget."
 wif_ger_reich_space_office:0 "The Reich Space Office"
 wif_ger_reich_space_office_desc:0 "Von Braun's Reichsraumfahrtamt, with the stars as its border."
 wif_rk_deportees:0 "Deportees from the Reich"
 wif_rk_deportees_desc:0 "Trains arrive from the annexed lands every week, and nobody is ready for the people on them."
 wif_ssr_ss_army:0 "SS Army"
 wif_ssr_ss_army_desc:0 "The SS fights the way it always has: with zeal rather than with doctrine."
 wif_ger_wartheland_construction:0 "The Wartheland Model"

 # --- Leader traits and characters ------------------------------------------
 wif_ger_failing_health:0 "Failing Health"
 wif_ger_paralysed_government:0 "Paralysed Government"
 wif_ger_reichstag:0 "Reichstag"
 wif_dwm_general_staff:0 "German General Staff"

 # --- Decisions ---------------------------------------------------------------
 wif_ger_reich_divided_category:0 "The Reich Divided"
 wif_ger_reich_divided_category_desc:0 "The Führer is failing, and everyone around him knows it.\n\n§YArmy-SS distrust§!: §R[?wif_ger_distrust|0]§!/100. At §R100§! the army moves.\n\n§YThe succession contest§!\nParty (Bormann): §Y[?wif_ger_sc_party|0]§!\nPropaganda (Goebbels): §Y[?wif_ger_sc_propaganda|0]§!\nLuftwaffe (Göring): §Y[?wif_ger_sc_luftwaffe|0]§!\nEconomy (Speer): §Y[?wif_ger_sc_economy|0]§!"
 wif_ger_audience_party:0 "Audience with the Führer: The Party"
 wif_ger_audience_party_desc:0 "Bormann's men get the first hour of the day."
 wif_ger_audience_propaganda:0 "Audience with the Führer: Propaganda"
 wif_ger_audience_propaganda_desc:0 "Goebbels brings the newsreels the Führer likes best."
 wif_ger_audience_luftwaffe:0 "Audience with the Führer: The Luftwaffe"
 wif_ger_audience_luftwaffe_desc:0 "Göring brings photographs of the new jets."
 wif_ger_audience_economy:0 "Audience with the Führer: The Economy"
 wif_ger_audience_economy_desc:0 "Speer brings figures, and tries to make them sound like good news."
 wif_ger_audience_army:0 "Audience with the Führer: The Generals"
 wif_ger_audience_army_desc:0 "The generals ask for an hour to talk the Führer out of his guard. They get twenty minutes."
 wif_ger_purification_category:0 "Settling the Annexed Lands"
 wif_ger_purification_category_desc:0 "The annexed lands are to be made German, one state at a time."
 wif_ger_settle_annexed_state:0 "Send Settlers to [FROM.GetName]"
 wif_ger_settle_annexed_state_desc:0 "Families from the Old Reich are given farms and homes in [FROM.GetName]."
 wif_ger_settle_annexed_state_tt:0 "§Y5%§! of the population of a neighbouring Old Reich state moves to §Y[FROM.GetName]§!."
 wif_ger_deport_annexed_state:0 "Deport the People of [FROM.GetName]"
 wif_ger_deport_annexed_state_desc:0 "The lists from the Volksliste become timetables."
 wif_ger_deport_annexed_state_tt:0 "§Y[FROM.GetName]§! loses §R25%§! of its population, sent into §YReichskommissariat Ostland§! or §YUkraine§!, which loses §R10%§! stability for a year."
 wif_ger_road_cg_plus_1_tt:0 "§YFacade Economy§! consumer goods: §R+1%§!"

 # --- Events: the road ----------------------------------------------------------
 wif_ger_road.1.t:0 "The Führer Overrules His Ministers"
 wif_ger_road.1.d:0 "The Führer woke in a black mood after Dr Morell's morning injection, and by noon he had cancelled an order three ministers had spent a month agreeing. By evening he had forgotten he gave the counter-order. Somebody will have to pay for the confusion: in time, or in nerves."
 wif_ger_road.1.a:0 "Spend the political capital to smooth it over."
 wif_ger_road.1.b:0 "Let the ministries sort it out among themselves."
 wif_ger_road.3.t:0 "Rumours from Zossen"
 wif_ger_road.3.d:0 "The SD reports that generals of the army high command have been meeting at Zossen. Nothing was written down, and nobody who was there will say what was discussed. The SD has written it down anyway."
 wif_ger_road.3.a:0 "File it with the others."
 wif_ger_road.4.t:0 "The Files on the General Staff"
 wif_ger_road.4.d:0 "The Gestapo has done as it was told. There is a file on every general of the army, and three of them are thick enough to hang a man. The Chancellery asks what the Führer wishes to do with them."
 wif_ger_road.4.a:0 "Arrest the three."
 wif_ger_road.4.a_tt:0 "Three German generals are §Rremoved§!."
 wif_ger_road.4.b:0 "Keep the files closed. For now."
 wif_ger_road.5.t:0 "The Army Moves"
 wif_ger_road.5.d:0 "The army has stopped waiting. Overnight, regiments loyal to the general staff have taken the bridges of Berlin and ringed the government quarter, and the Führer's guard stands behind its checkpoints with its guns facing out. Nobody has fired yet. Nobody has backed down either."
 wif_ger_road.5.a:0 "The Reich is on the brink."
 wif_ger_road.5.a_tt:0 "§YGermany on the Brink§! is completed at once."
 wif_ger_road.6.t:0 "Adolf Hitler Is Dead"
 wif_ger_road.6.d:0 "The German Reich has announced the death of Adolf Hitler, Führer and Chancellor. The cause was not given. Until the National Socialist Party agrees on a successor the Reichstag governs, and every capital in the world is asking the same question: how long can the Reich hold together without him?"
 wif_ger_road.6.a:0 "The world holds its breath."
 wif_ger_road.6.b:0 "The Führer is dead. Long live the Reich."

 # --- Events: the collapse ---------------------------------------------------------
 wif_ger_collapse.1.t:0 "SS Gather in the Rhine"
 wif_ger_collapse.1.d:0 "The funeral was barely over when the black uniforms began to move. SS men from every garrison in the West have been seen on the roads to the Moselle and the Upper Rhine, and the Gauleiter of Baden reports that the SS has taken over the police stations of Karlsruhe and Freiburg \"to keep order\". Their officers speak of loyalty to the Führer's memory. They do not speak of loyalty to anyone in Berlin. In Trier, an SS-Obergruppenführer told a reporter that Reinhard Heydrich would be arriving soon."
 wif_ger_collapse.1.a:0 "Berlin cannot lose the West."
 wif_ger_collapse.1.a_tt:0 "§YMoselland§! and §YBaden§! - and §YAlsace-Lorraine§! and §YLuxembourg§!, if they are German - declare for the §YSS§! and are §Rdemilitarised§!."
 wif_ger_collapse.2.t:0 "Reichstag Elects Bormann"
 wif_ger_collapse.2.d:0 "The Reichstag met in the Kroll Opera House in the afternoon, and by evening it had done what it was called together to do. Martin Bormann, the man who decided for years who could see the Führer, is now the Führer's successor. The vote was unanimous. Half the deputies looked at the doors while they voted, and the doors were guarded by men from the Party Chancellery."
 wif_ger_collapse.2.a:0 "Heil Bormann."
 wif_ger_collapse.2.a_tt:0 "§YBrandenburg§!, §YVorpommern§!, §YSachsen§!, §YOstmark§!, §YHinterpommern§!, §YSilesia§!, §YThuringia§! and §YMecklenburg§! declare for §YMartin Bormann§! and are §Rdemilitarised§!."
 wif_ger_collapse.3.t:0 "Göring Rallies Support"
 wif_ger_collapse.3.d:0 "The Reichsmarschall has not accepted the Reichstag's vote. From Karinhall he flew to Munich, where the Luftwaffe gave him a guard of honour and the Bavarian Gauleiters gave him their support. In a broadcast from the Brown House he reminded the nation that in 1941 the Führer himself named Hermann Göring as his successor, and that no vote of the Reichstag can overturn the Führer's will. Vienna has already declared for him."
 wif_ger_collapse.3.a:0 "The South goes its own way."
 wif_ger_collapse.3.a_tt:0 "Every German-held §YAustrian§! and §YBavarian§! state, §YWürttemberg§! and §YSouth Sudetenland§! declare for §YHermann Göring§! and are §Rdemilitarised§!."
 wif_ger_collapse.4.t:0 "Students and Factories Back Speer"
 wif_ger_collapse.4.d:0 "In Essen the workers of Krupp walked out of the gates at noon and did not go back. In Cologne, Bonn and Göttingen the students filled the squares. By evening the industrialists of the Ruhr had published a letter of their own: the only man who ever understood the German economy is Albert Speer, and it is to Speer, not to Bormann, that the West will look. Speer himself has said nothing in public. He has not said no, either."
 wif_ger_collapse.4.a:0 "The West belongs to the factories."
 wif_ger_collapse.4.a_tt:0 "§YRhineland§!, §YWestfalen§!, §YHessen§!, §YHannover§!, §YWeser-Ems§!, §YHolstein§!, §YSchleswig§! and §YSønderjylland§! declare for §YAlbert Speer§! and are §Rdemilitarised§!."
 wif_ger_collapse.5.t:0 "Wehrmacht Generals Mobilise East"
 wif_ger_collapse.5.d:0 "The army has waited long enough. At Königsberg the commanders of the eastern army groups have announced that the Wehrmacht recognises neither Bormann, nor Göring, nor Speer, and certainly not the SS. Until a lawful government exists, the general staff will govern the East. Field Marshals Rommel and von Manstein have flown to Königsberg. Every garrison from the Baltic to the Vistula has been ordered to stand ready."
 wif_ger_collapse.5.a:0 "There is nothing left to hold it together."
 wif_ger_collapse.5.a_tt:0 "§YEast Prussia§!, every cored §YPolish§! state, and every German core nobody else has claimed declare for the §YDeutsche Wehrmacht§! and are §Rdemilitarised§!."
 wif_ger_collapse.6.t:0 "Collapse of the Reich"
 wif_ger_collapse.6.d:0 "The Thousand-Year Reich has outlived its victory by barely five years. Five governments now claim to be Germany, and each of them holds part of its army. In the West the SS fights under Heydrich and the banner of Burgund. Speer's industrial Rhineland flies the old imperial colours. Göring holds the South and most of the Luftwaffe, the Wehrmacht holds the East, and Bormann holds Berlin and the name of the Reich. Far to the north, in Oslo, Grand Admiral Dönitz has taken command of the fleet, the faction and the Reich's subjects, and declared that his German Administrative Government will not take part in a war between Germans. Bohemia and Moravia wait to see who wins."
 wif_ger_collapse.6.a:0 "Germany against Germany."
 wif_ger_collapse.6.a_tt:0 "The Reich splits into the §YSS Remnant§!, §YSpeer's Germany§!, §YGöring's Germany§!, the §YDeutsche Wehrmacht§! and §YBormann's German Reich§!, with the §YReichsprotektorat Böhmen und Mähren§! and the §YGerman Administrative Government§! in Oslo standing aside. In §Y10§! days the five go to war with one another."
 wif_ger_collapse.7.t:0 "The German Civil War"
 wif_ger_collapse.7.d:0 "Ten days of ultimatums have changed nothing. Nobody would give up a single state, a single division, or a single claim to be the true heir of the Reich. This morning the first shots were fired along the demarcation lines, and by noon every one of the five Germanies was at war with every other."
 wif_ger_collapse.7.a:0 "To the last German."
 wif_ger_collapse.7.a_tt:0 "The §YSS Remnant§!, §YSpeer's Germany§!, §YGöring's Germany§!, the §YDeutsche Wehrmacht§! and §YBormann's German Reich§! declare war on one another."
 wif_ger_collapse.8.t:0 "The Reich Has Fallen"
 wif_ger_collapse.8.d:0 "The German Reich no longer exists in any form that its Führer would recognise. Bormann holds Berlin; Göring holds Munich and Vienna; Speer holds the Ruhr; the Wehrmacht holds Königsberg; and the SS holds the Rhine under Reinhard Heydrich. In Oslo, Grand Admiral Dönitz has taken the German fleet and the Reich's alliances under his German Administrative Government, and calls on every German to lay down his arms. Nobody has."
 wif_ger_collapse.8.a:0 "Five Germanies."

