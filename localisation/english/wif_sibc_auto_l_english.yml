 wif_sibc_white_commanders:0 "White Army Commanders"
 wif_sibc_white_commanders_desc:0 "Officers who learned their trade under Kolchak and Semyonov, and their sons, who learned it from them."
 wif_sibc_free_at_last:0 "Free at Last"
 wif_sibc_free_at_last_desc:0 "For the first time since the Tsars, nobody in Moscow or Irkutsk decides what happens on the Lena."
 wif_sibc_nomadic:0 "Nomadic People Once More"
 wif_sibc_nomadic_desc:0 "The reindeer herds and the winter camps come back, and the building sites stand empty."
 wif_sibc_native_union:0 "Union of Many Native Peoples"
 wif_sibc_native_union_desc:0 "Sakha, Evenks, Evens and Yukaghirs, each feeding their own, and asking little of the state."
 wif_sibc_few_farms:0 "Few Farms Up North"
 wif_sibc_few_farms_desc:0 "The farmland was always in the south and the west. What is left is taiga, permafrost and hunger."
 wif_sibc_police_state:0 "Brutal Police State"
 wif_sibc_police_state_desc:0 "The organs no longer pretend to serve anyone but themselves. Fear keeps the party in power when nothing else could."
 wif_sibc_institute:0 "The Institute Governs Itself"
 wif_sibc_institute_desc:0 "The scientists of the Institute for All Research answer to nobody now - and work faster for it."
 wif_sibc_alexei_lives:0 "Alexei Lives, the Regent Endures"
 wif_sibc_alexei_lives_desc:0 "The Tsarevich did not die at Yekaterinburg. The regent speaks for him, and the faithful believe."
 wif_sibc_mad_regent:0 "Mad Regent"
 wif_sibc_mad_regent_desc:0 "He rules in the name of a prince who has been dead for thirty years."
 wif_sibc_dead_prince:0 "Hallucinations of a Dead Prince"
 wif_sibc_dead_prince_desc:0 "Alexei speaks to him at night. The court writes down what he says."
 wif_sibc.stay:0 "We stay with what is left."
 wif_sibc.3.t:0 "Yagoda Is Dead"
 wif_sibc.3.d:0 "Genrikh Yagoda was shot in his own office in Tyumen, by men he had appointed. Chelyabinsk and Sverdlovsk are gone. Erling Eigo holds what is left, and the organs answer to him now."
 wif_sibc.3.a:0 "The organs endure."
 wif_sibc.10.t:0 "The New White Army"
 wif_sibc.10.d:0 "Yaroslov Navalnji has declared the New White Army, and the ground it stands on no longer answers to us."
 wif_sibc.10.b:0 "Lead the New White Army instead."
 wif_sibc.11.t:0 "The State of Siberia"
 wif_sibc.11.d:0 "Alexander Vasolivi has declared the State of Siberia, and the ground it stands on no longer answers to us."
 wif_sibc.11.b:0 "Lead the State of Siberia instead."
 wif_sibc.12.t:0 "The Yakutsk"
 wif_sibc.12.d:0 "Ayana Yusip has declared the Yakutsk, and the ground it stands on no longer answers to us."
 wif_sibc.12.b:0 "Lead the Yakutsk instead."
 wif_sibc.13.t:0 "The Anarchist State of Siberia"
 wif_sibc.13.d:0 "Anarchist Council has declared the Anarchist State of Siberia, and the ground it stands on no longer answers to us."
 wif_sibc.13.b:0 "Lead the Anarchist State of Siberia instead."
 wif_sibc.14.t:0 "The Siberian Military Government"
 wif_sibc.14.d:0 "Vasily Shukshin has declared the Siberian Military Government, and the ground it stands on no longer answers to us."
 wif_sibc.14.b:0 "Lead the Siberian Military Government instead."
 wif_sibc.15.t:0 "The Chelyabinsk Institute"
 wif_sibc.15.d:0 "The Institute Directorate has declared the Chelyabinsk Institute, and the ground it stands on no longer answers to us."
 wif_sibc.15.b:0 "Lead the Chelyabinsk Institute instead."
 wif_sibc.16.t:0 "The Imperial Cult of Alexei"
 wif_sibc.16.d:0 "Sergey Taboritsky has declared the Imperial Cult of Alexei, and the ground it stands on no longer answers to us."
 wif_sibc.16.b:0 "Lead the Imperial Cult of Alexei instead."
