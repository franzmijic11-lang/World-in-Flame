 wif_rkm_civil_war_emergency:0 "State of Emergency"
 wif_rkm_civil_war_emergency_desc:0 "Half the Reichskommissariat is in open revolt and a dozen cities have declared for one banner or another. The administration has abandoned any pretence of governing to the old standard: the garrison rules where it stands, the railways run under military order, and Moskowien will not be counted beaten while Moskau still answers to Berlin."

 RKM_secure_the_logistic_lines:0 "Secure the Logistic Lines"
 RKM_secure_the_logistic_lines_desc:0 "Everything east of the old border moves on track we did not lay, in stock we did not build, worked by crews we do not trust. Three gauges meet at Smolensk and none of them meet cleanly. A locomotive ordered in Essen arrives having been paid for twice — once to the works, and once to whichever authority happened to control the sidings that week.\n\nPut the whole net under one military administration. It will not straighten the track, but it will end the second payment, and it will mean that when Moskau finally has to be held, the trains that hold it are ours to direct."
 RKM_the_army_of_lebensraum:0 "The Army of Lebensraum"
 RKM_the_army_of_lebensraum_desc:0 "The divisions we were given came with their establishments already written. Berlin decided what a Moskowien division is: how many battalions, which support companies, what it may and may not carry. It was a sensible arrangement for an occupation garrison and it is a ruinous one for an army that has to fight.\n\nThe men are ours, the rifles are ours, and the ground they will be spent on is ours. The paper should be ours as well."
 RKM_slave_revolt:0 "Slave Revolt?"
 RKM_slave_revolt_desc:0 "The word from the labour districts is not that they are restless. Restless we have handled before. The word is that they have stopped stealing food and started stealing rifles, and that the ones going missing from the Ryazan camps are not the weak.\n\nWe can garrison this or we can arm against it, and we cannot do both with what we hold. Berlin has never much liked the question of who is armed in the east. It is going to be asked anyway."
 wif_rkm.33.t:0 "Moskowien Requests Rifles"
 wif_rkm.33.desc:0 "Reichskommissariat Moskowien reports a rising in preparation among the eastern labour population and requests infantry equipment to meet it — [?RKM.wif_rkm_equip_request|0] rifles, by their own accounting of what their divisions are short.\n\nThe Reichskommissar is careful to note that he asks for equipment and not for German troops. Whether that is reassurance or a warning is a matter of reading."
 wif_rkm.33.a:0 "Arm them. Better their hands than the alternative."
 wif_rkm.33.b:0 "Moskowien will manage with what it has."
 wif_rkm.34.t:0 "Berlin Sends the Rifles"
 wif_rkm.34.desc:0 "The shipment is approved in full. The crates come east on our own repaired track, which is a satisfaction of a kind, and they are counted into the depots at Moskau under guard.\n\nThere is no covering letter beyond the manifest. Berlin has armed us, and declined to say anything further about it."
 wif_rkm.34.a:0 "Issue them before the week is out."
 wif_rkm.35.t:0 "Berlin Declines"
 wif_rkm.35.desc:0 "The request is refused without elaboration. The Reich has its own fronts and its own arithmetic, and the labour districts of Moskowien do not enter into it.\n\nWe will hold what we can hold with what we already have, and the camps will be watched by men who know they are not to be reinforced."
 wif_rkm.35.a:0 "Then we hold with what we have."
 wif_rkm_secure_logistics:0 "Secured Logistic Lines"
 wif_rkm_secure_logistics_desc:0 "The eastern rail net answers to one military administration instead of four competing ones. The track is no better, but the accounting is, and Moskowien no longer pays twice for the same locomotive."

 RKM_konstantin_rossovsky:0 "Konstantin Rossovsky"
 wif_collaborationist_administrator:0 "Collaborationist Administrator"
 wif_collaborationist_administrator_desc:0 "He was a district administrator before the war and he is a district administrator now, and he has never once asked which flag the district answers to. The Reich finds him distasteful and indispensable in roughly equal measure."

