l_english:
 wif_sp_unmanned_prototype:0 "Unmanned Prototype"
 wif_sp_unmanned_prototype_desc:0 "A rocket strong enough to put a payload into orbit, and a payload that survives the trip. Only the greatest powers can afford to try."
 wif_sp_radio_satellites:0 "Radio Satellites"
 wif_sp_radio_satellites_desc:0 "Satellites that talk back: relays, beacons and eyes that circle the planet every ninety minutes."
 wif_sp_liquid_fuel_reward:0 "Liquid Fuel"
 wif_sp_liquid_fuel_reward_desc:0 "Our engineers settle on liquid propellant: harder to handle, but far more controllable at launch."
 wif_sp_liquid_fuel_reward_take:0 "Liquid fuel it is"
 wif_sat_liquid_fuel_tt:0 "Unmanned satellites gain §G+10%§! reliability (launch success §G90%§! instead of §Y80%§!)."
 wif_sat_prototype_done_tt:0 "The first nation to finish puts the §Yfirst satellite in space§!: great prestige and power."
 wif_sat_radio_done_tt:0 "Unlocks the §Yunmanned satellite§! and the §YSpace Port§!.\nFirst to finish: great prestige. Fourth: a small loss of face."
 wif_satellite_equipment:0 "Unmanned Satellite"
 wif_satellite_equipment_desc:0 "A satellite waiting on the ground for a Space Port and a rocket. In orbit it gives planet-wide coordination, reinforcement and radar coverage."
 wif_satellite_equipment_1:0 "Unmanned Satellite"
 wif_satellite_equipment_1_short:0 "Satellite"
 wif_satellite_equipment_1_desc:0 "A satellite waiting on the ground for a Space Port and a rocket."
 wif_space_port:0 "Space Port"
 wif_space_port_desc:0 "Launch pads, gantries and tracking stations. Each level keeps one satellite in orbit. No aircraft or rockets can be based here."
 wif_space_port_plural:0 "Space Ports"
 wif_space_port_tech:0 "Space Port"
 wif_space_port_tech_desc:0 "Unlocked by Radio Satellites."
 wif_sat_coverage_idea:0 "Satellite Coverage"
 wif_sat_coverage_idea_desc:0 "Our satellites watch every air zone on the planet. More satellites keep the coverage alive; they do not add to it."
 wif_sat_category:0 "Space Programme"
 wif_sat_category_desc:0 "Satellites in orbit: §Y[?ROOT.wif_sat_orbit|0]§! of [?ROOT.wif_sat_ports|0] Space Port levels.\n\nEach Space Port level keeps one satellite in orbit. With at least one up we get §G+20%§! coordination, §G+5%§! reinforce rate and radar coverage everywhere - a second satellite does not add to it, but keeps it alive if we lose one."
 wif_sat_launch:0 "Launch a Satellite"
 wif_sat_launch_desc:0 "Roll a satellite out to the pad."
 wif_sat_launch_tt:0 "Uses one §YUnmanned Satellite§!. Success: §Y80%§!, §G90%§! with Liquid Fuel."
 wif_sat.1.t:0 "First Satellite in Space"
 wif_sat.1.d:0 "[?global.wif_sat_n1.GetName] has put the first man-made object into orbit. Its beeping can be heard by radio amateurs all over the world - and every general understands what a rocket that reaches orbit can also reach."
 wif_sat.1.a:0 "The heavens are no longer empty."
 wif_sat.2.t:0 "Satellites Over Every Nation"
 wif_sat.2.d:0 "[?global.wif_sat_n2.GetName] is the first to master radio satellites. Soon nothing on earth will be hidden from it."
 wif_sat.2.a:0 "We are being watched."
 wif_sat.3.t:0 "An Eye in the Sky"
 wif_sat.3.d:0 "[?global.wif_sat_n3.GetName] has put a working satellite into permanent orbit. Its armies now see the whole planet."
 wif_sat.3.a:0 "A new kind of power."
 wif_sat.10.t:0 "Satellite in Orbit"
 wif_sat.10.d:0 "The launch was a success. Our satellite is circling the planet."
 wif_sat.10.a:0 "Excellent."
 wif_sat.11.t:0 "Launch Failure"
 wif_sat.11.d:0 "The rocket broke apart shortly after lift-off. The satellite is lost."
 wif_sat.11.a:0 "Build another."
 wif_sat.990.t:0 "Debug: Space Race"
 wif_sat.990.d:0 "Completed both projects, added two satellites and a Space Port."
 wif_sat.990.a:0 "OK"
