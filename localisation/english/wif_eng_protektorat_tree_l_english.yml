l_english:
 wif_eng_the_reichsprotektorat:0 "The Reichsprotektorat"
 wif_eng_the_reichsprotektorat_desc:0 "The war is over and Britain lost it. Mosley governs from Downing Street, a Reichsprotektor watches him from the German embassy, and what is left of the country has to be held together."
 wif_eng_blackshirts_in_whitehall:0 "Blackshirts in Whitehall"
 wif_eng_blackshirts_in_whitehall_desc:0 "The civil service stays at its desks. Its masters change. Every ministry gets a BUF commissar."
 wif_eng_defence_regulations:0 "The Defence Regulations"
 wif_eng_defence_regulations_desc:0 "Regulation 18B was written to lock up fascists. It works just as well the other way round."
 wif_eng_disarm_the_home_guard:0 "Disarm the Home Guard"
 wif_eng_disarm_the_home_guard_desc:0 "A million and a half men with rifles under their beds. The rifles are collected; most of them."
 wif_eng_the_national_register:0 "The National Register"
 wif_eng_the_national_register_desc:0 "Every man, woman and child in England and Wales, with an address and an identity card."
 wif_eng_hunt_the_auxiliary_units:0 "Hunt the Auxiliary Units"
 wif_eng_hunt_the_auxiliary_units_desc:0 "Churchill left behind cells of saboteurs in hides under the woods of Kent and Somerset. They have to be found before they find a reason to act."
 wif_eng_the_iron_hand:0 "The Iron Hand"
 wif_eng_the_iron_hand_desc:0 "Hostages, curfews, the camps on the Isle of Man reopened. Fear keeps England quiet."
 wif_eng_bread_and_circuses:0 "Bread and Circuses"
 wif_eng_bread_and_circuses_desc:0 "End bread rationing, reopen the football league, put the BBC to work. A fed and entertained England is a quiet England."
 wif_eng_a_quiet_england:0 "A Quiet England"
 wif_eng_a_quiet_england_desc:0 "No shots in the night, no leaflets in the post. England is quiet. Whether it is content is another question."
 wif_eng_the_welsh_question:0 "The Welsh Question"
 wif_eng_the_welsh_question_desc:0 "Wales was left to Britain by the peace, but Wales was never asked. The valleys are restless and the Free Welsh look to Edinburgh."
 wif_eng_the_reichsprotektor:0 "The Reichsprotektor"
 wif_eng_the_reichsprotektor_desc:0 "Germany's man in London has an office in Carlton House Terrace and a direct line to Berlin. Better to have him on our side."
 wif_eng_the_british_free_corps:0 "The British Free Corps"
 wif_eng_the_british_free_corps_desc:0 "Volunteers in German uniform with a Union Jack on the sleeve, sent wherever Berlin needs them."
 wif_eng_gold_to_berlin:0 "Gold to Berlin"
 wif_eng_gold_to_berlin_desc:0 "What is left of the Bank of England's gold is 'deposited' in the Reichsbank."
 wif_eng_workers_for_the_reich:0 "Workers for the Reich"
 wif_eng_workers_for_the_reich_desc:0 "Liverpool dockers and Midlands machinists, recruited for German factories at German wages."
 wif_eng_the_continental_market:0 "The Continental Market"
 wif_eng_the_continental_market_desc:0 "Britain trades with Europe now, on Europe's terms, in Reichsmarks."
 wif_eng_a_junior_partner:0 "A Junior Partner"
 wif_eng_a_junior_partner_desc:0 "Loyal service earns a longer leash. Mosley asks Berlin for more say in British affairs, and Berlin listens - a little."
 wif_eng_what_remains_of_the_empire:0 "What Remains of the Empire"
 wif_eng_what_remains_of_the_empire_desc:0 "Canada took the dominions and the East. What remains is West Africa and the Sudan - and the habit of ruling."
 wif_eng_lagos_and_accra:0 "Lagos and Accra"
 wif_eng_lagos_and_accra_desc:0 "Nigeria and the Gold Coast: twenty million people, the cocoa crop and the tin mines."
 wif_eng_the_sudan_defence_force:0 "The Sudan Defence Force"
 wif_eng_the_sudan_defence_force_desc:0 "The Sudan borders Italy's Ethiopia and Germany's Egypt. The Defence Force is all that stands on the Nile."
 wif_eng_freetown_station:0 "Freetown Naval Station"
 wif_eng_freetown_station_desc:0 "The best harbour in West Africa, and the only one still flying the White Ensign."
 wif_eng_the_colonial_service:0 "The Colonial Service"
 wif_eng_the_colonial_service_desc:0 "District officers who stayed on, governing as if nothing had happened, because for them almost nothing has."
 wif_eng_african_regiments:0 "The African Regiments"
 wif_eng_african_regiments_desc:0 "The Royal West African Frontier Force and the King's African Rifles, now the backbone of the British Army."
 wif_eng_the_imperial_remnant:0 "The Imperial Remnant"
 wif_eng_the_imperial_remnant_desc:0 "A small empire, but an empire. Berlin lets Britain keep it because nobody else wants the trouble."
 wif_eng_the_fleet_that_was:0 "The Fleet That Was"
 wif_eng_the_fleet_that_was_desc:0 "The battleships were handed over at Scapa Flow or scuttled in Plymouth Sound. What is left fits in Portsmouth harbour."
 wif_eng_kriegsmarine_permission:0 "Permission from the Kriegsmarine"
 wif_eng_kriegsmarine_permission_desc:0 "Every keel laid needs a signature from Wilhelmshaven. Raeder's staff are surprisingly willing - Britain is to guard the Channel for the Reich now."
 wif_eng_reopen_the_yards:0 "Reopen the Yards"
 wif_eng_reopen_the_yards_desc:0 "Harland and Wolff is gone with Ulster. Vickers at Barrow, Cammell Laird at Birkenhead and Swan Hunter on the Tyne are still English."
 wif_eng_coastal_command:0 "Coastal Command"
 wif_eng_coastal_command_desc:0 "Destroyers and flying boats to keep the Channel and the Irish Sea clear - of Americans and of Scottish gunrunners."
 wif_eng_a_cruiser_squadron:0 "A Cruiser Squadron"
 wif_eng_a_cruiser_squadron_desc:0 "Four cruisers, Britain's first new capital ships since the war."
 wif_eng_the_home_fleet_reborn:0 "The Home Fleet Reborn"
 wif_eng_the_home_fleet_reborn_desc:0 "Not the Grand Fleet. Not even the Home Fleet of 1939. But a fleet, under the White Ensign, in British waters."
 wif_eng_raiders_from_the_north:0 "Raiders from the North"
 wif_eng_raiders_from_the_north_desc:0 "Free Scotland swears it has nothing to do with it. Nevertheless the bombs on the Newcastle railway were made in Glasgow, and the men who planted them went home over the Cheviots."
 wif_eng_fortify_the_border:0 "Fortify the Border"
 wif_eng_fortify_the_border_desc:0 "Hadrian had the right idea."
 wif_eng_special_branch_north:0 "Special Branch in the North"
 wif_eng_special_branch_north_desc:0 "Informers in every Tyneside pub, detectives on every train out of Carlisle."
 wif_eng_the_border_constabulary:0 "The Border Constabulary"
 wif_eng_the_border_constabulary_desc:0 "A gendarmerie for the north, recruited from men who know the hills."
 wif_eng_punitive_raid:0 "A Punitive Raid"
 wif_eng_punitive_raid_desc:0 "If Edinburgh will not stop them, London will. One raid across the border, to burn the camps and come back."
 wif_eng_seal_the_border:0 "Seal the Border"
 wif_eng_seal_the_border_desc:0 "Wire, watchtowers and a closed frontier. Let the Scots keep their freedom on their side of it."
 wif_eng_the_north_is_quiet:0 "The North Is Quiet"
 wif_eng_the_north_is_quiet_desc:0 "The trains run to Edinburgh again, with soldiers on them."
 wif_eng_the_reich_divided:0 "The Reich Divided"
 wif_eng_the_reich_divided_desc:0 "Berlin is at war with itself. The Reichsprotektor has stopped answering the telephone."
 wif_eng_martial_law:0 "Martial Law"
 wif_eng_martial_law_desc:0 "Tanks at Westminster, curfew from eight. The government must look stronger than it is."
 wif_eng_emergency_rationing:0 "Emergency Rationing"
 wif_eng_emergency_rationing_desc:0 "German grain shipments have stopped. Britain must feed itself or starve."
 wif_eng_watch_the_generals:0 "Watch the Generals"
 wif_eng_watch_the_generals_desc:0 "The Americans are talking to British officers. MI5 is listening to the Americans."
 wif_eng_a_government_of_national_safety:0 "A Government of National Safety"
 wif_eng_a_government_of_national_safety_desc:0 "Mosley brings in men from outside the BUF - civil servants, generals, even a few old Tories - to show the country it is still governed."
 wif_eng_britain_endures:0 "Britain Endures"
 wif_eng_britain_endures_desc:0 "The Reich may fall. England has stood alone before."
 wif_eng_defeated_1:0 "A Defeated Nation"
 wif_eng_defeated_1_desc:0 "Britain lost the war. The people know it, the army knows it, and the men in Whitehall know that everyone knows it."
 wif_eng_defeated_2:0 "A Defeated Nation (Rising)"
 wif_eng_defeated_2_desc:0 "Britain lost the war. The people know it, the army knows it, and the men in Whitehall know that everyone knows it."
 wif_eng_defeated_3:0 "A Defeated Nation (Severe)"
 wif_eng_defeated_3_desc:0 "Britain lost the war. The people know it, the army knows it, and the men in Whitehall know that everyone knows it."
 wif_eng_insurgency_1:0 "The Scottish Insurgency"
 wif_eng_insurgency_1_desc:0 "Bombs on the Newcastle line, ambushes on the Carlisle road. The men who do it go home over the Cheviots, and Edinburgh swears it knows nothing."
 wif_eng_insurgency_2:0 "The Scottish Insurgency (Rising)"
 wif_eng_insurgency_2_desc:0 "Bombs on the Newcastle line, ambushes on the Carlisle road. The men who do it go home over the Cheviots, and Edinburgh swears it knows nothing."
 wif_eng_insurgency_3:0 "The Scottish Insurgency (Severe)"
 wif_eng_insurgency_3_desc:0 "Bombs on the Newcastle line, ambushes on the Carlisle road. The men who do it go home over the Cheviots, and Edinburgh swears it knows nothing."
 wif_eng_blackshirt_civil_service:0 "Blackshirts in Whitehall"
 wif_eng_blackshirt_civil_service_desc:0 "Every ministry has a BUF commissar."
 wif_eng_the_register:0 "The Register"
 wif_eng_the_register_desc:0 "Every man, woman and child, with an address and an identity card."
 wif_eng_bread_and_circuses_idea:0 "Bread and Circuses"
 wif_eng_bread_and_circuses_idea_desc:0 "Football, the BBC and an end to bread rationing."
 wif_eng_continental_market:0 "The Continental Market"
 wif_eng_continental_market_desc:0 "Britain trades with Europe now, on Europe's terms."
 wif_eng_junior_partner:0 "A Junior Partner"
 wif_eng_junior_partner_desc:0 "Loyal service has earned a longer leash."
 wif_eng_african_garrisons:0 "The African Garrisons"
 wif_eng_african_garrisons_desc:0 "What remains of the Empire is held by the men who were already there."
 wif_eng_colonial_service:0 "The Colonial Service"
 wif_eng_colonial_service_desc:0 "District officers governing as if nothing had happened."
 wif_eng_african_regiments_idea:0 "The African Regiments"
 wif_eng_african_regiments_idea_desc:0 "The backbone of what is left of the British Army."
 wif_eng_imperial_remnant:0 "The Imperial Remnant"
 wif_eng_imperial_remnant_desc:0 "A small empire, but an empire."
 wif_eng_coastal_command_idea:0 "Coastal Command"
 wif_eng_coastal_command_idea_desc:0 "The Channel and the Irish Sea, kept clear."
 wif_eng_cruiser_programme:0 "The Cruiser Programme"
 wif_eng_cruiser_programme_desc:0 "Britain's first new warships since the war."
 wif_eng_home_fleet:0 "The Home Fleet"
 wif_eng_home_fleet_desc:0 "A fleet, under the White Ensign, in British waters."
 wif_eng_border_constabulary:0 "The Border Constabulary"
 wif_eng_border_constabulary_desc:0 "A gendarmerie for the north."
 wif_eng_martial_law_idea:0 "Martial Law"
 wif_eng_martial_law_idea_desc:0 "Tanks at Westminster, curfew from eight."
 wif_eng_emergency_rationing_idea:0 "Emergency Rationing"
 wif_eng_emergency_rationing_idea_desc:0 "The German grain ships have stopped coming."
 wif_eng_collaboration:0 "Collaboration"
 wif_eng_autonomy_loc:0 "The Reichsprotektorat"
 wif_eng_wales_core_tt:0 "We gain a §Ycore§! on §YWales§!."
 wif_eng_west_africa_forts_tt:0 "§G+1§! fort along the borders of §YLagos§! and the §YGold Coast§!, if we own them."
 wif_eng_sudan_fort_tt:0 "§G+1§! fort along the borders of §YKhartoum§!, if we own it."
 wif_eng_freetown_tt:0 "In §YSierra Leone§!, if we own it: §G+1§! naval base and §G+2§! coastal forts."
 wif_eng_portsmouth_tt:0 "§G+1§! naval base in §YSouth-West England§!, if we own it."
 wif_eng_border_forts_tt:0 "§G+2§! forts along the borders of §YNorthumberland§! and §YCumbria§!, if we own them."
 wif_eng_punitive_raid_tt:0 "A §Ylimited§! war goal on §YScotland§!: §YLothian§! and §YLanark§!."
 wif_eng_seal_tt:0 "§G+1§! fort along every state we own that borders §YScotland§!."
 wif_eng_watch_generals_tt:0 "An §YAmerican-sponsored coup§! becomes much less likely when the Reich falls apart."
 wif_eng_scotland_raidable_tt:0 "§YScotland§! has §Yno nuclear weapons§! and is not in a faction with a §Ymajor power§!"
 wif_eng_civil_war_trigger_tt:0 "The §YGerman civil war§! has begun"
