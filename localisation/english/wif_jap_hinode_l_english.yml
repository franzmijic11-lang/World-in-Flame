 JAP_wif_new_asian_hegemon:0 "New Asian Hegemon"
 JAP_wif_new_asian_hegemon_desc:0 "China lies beaten, Nanjing governs in our name, and from Singapore to Honolulu the new states of Asia answer to Tokyo. The age of the Western empires in Asia is over. A new one has begun, and the world will learn to call it by its own name."
 JAP_wif_new_asian_hegemon_tt:0 "Our nation becomes §YHinode no Teikoku§!, the Empire of the Rising Sun, and the world must call us §YNihon§!.\nOur §Rentire focus tree§! is replaced by the tree of the victorious empire."
 wif_jap_hinode.1.t:0 "Hinode no Teikoku"
 wif_jap_hinode.1.d:0 "In a ceremony before the Imperial Palace, Tokyo has proclaimed the Empire of the Rising Sun, Hinode no Teikoku, hegemon of a new Asian order. Foreign governments have been informed that the name Japan is a Western word and will no longer be accepted: the Empire is Nihon. With Nanjing, Singapore, Calcutta and Honolulu all governed under its protection, there is little anyone can do but comply."
 wif_jap_hinode.1.a:0 "Banzai!"
 wif_jap_hinode.1.b:0 "We stand beside our protector."
 wif_jap_hinode.1.c:0 "Nihon, then."
 wif_jap_hinode.2.t:0 "Macau Comes to Us"
 wif_jap_hinode.2.d:0 "With Germany at war with Portugal, Lisbon can no longer hold its colony on the Pearl River. Our garrison from Canton crossed the border unopposed, and the governor handed over the keys of the city. The casinos are still open."
 wif_jap_hinode.2.a:0 "A small prize, but a prize."
 wif_jap_hinode.3.t:0 "Macau Lost to Japan"
 wif_jap_hinode.3.d:0 "With German troops on our soil, there was nothing we could send to Macau. Japanese soldiers have crossed from the mainland, and the governor, with no garrison worth the name, has surrendered the colony."
 wif_jap_hinode.3.a:0 "There was nothing we could do."
