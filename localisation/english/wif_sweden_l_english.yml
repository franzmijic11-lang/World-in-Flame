l_english:

 # Descriptions are kept to about four lines. The focus tooltip has a fixed
 # width and no scrollbar, so anything much longer is cut off at the bottom and
 # the player never sees the end of it.

 # === The 1936 Election =============================================
 # The focus name itself is overridden in localisation/english/replace/,
 # because that key belongs to vanilla. Only new keys live here.
 SWE_the_1936_election_tt:0 "§YThe ballot decides this one.§! One of the three results below is completed with it."

 # === The three outcomes ============================================
 SWE_socialdemokratisk_seger:0 "Socialdemokratisk Seger"
 SWE_socialdemokratisk_seger_desc:0 "Per Albin holds the Riksdag, and this time with a majority that does not depend on the farmers' goodwill. Folkhemmet stops being a speech and becomes a building programme - housing, pensions, and the unemployment works the crash left half-finished.\n\nThe quarrel that remains is inside the party rather than outside it: how much of the programme belongs to the government, and how much to Landsorganisationen."
 SWE_socialdemokratisk_seger_tt:0 "§YThe 1936 election was won by the Social Democrats.§!"

 SWE_bondeforbundet_leder:0 "Bondeförbundet Leder"
 SWE_bondeforbundet_leder_desc:0 "The summer government turns out not to have been a summer government. Pehrsson-Bramstorp came in as a caretaker while the Social Democrats argued among themselves, and he is still sitting in the chair when the votes are counted.\n\nIt is a farmers' ministry with a farmer's priorities - grain tariffs, rural credit, and a settled suspicion of anything decided in Stockholm."
 SWE_bondeforbundet_leder_tt:0 "§YThe 1936 election was won by Bondeförbundet.§!"

 SWE_hogern_leder:0 "Högern Leder"
 SWE_hogern_leder_desc:0 "Bagge has the mandate. A professor of economics who came to politics late and to the party leadership later still, he inherits a right that has spent a decade being told it is finished.\n\nHe means to spend the mandate on the two things his party never stopped talking about: the defence estimates, and the church."
 SWE_hogern_leder_tt:0 "§YThe 1936 election was won by Högern.§!"

 # === The three cabinets ============================================
 SWE_form_a_social_democratic_cabinet:0 "Form a Social Democratic Cabinet"
 SWE_form_a_social_democratic_cabinet_desc:0 "A party government, and the first in years that need not count heads before every vote. Wigforss takes finance and the deficit budgets that go with it, Sandler keeps foreign affairs, and Undén sits beside him as the party's own lawyer.\n\nThree Social Democrats, three ministries, and nobody outside the movement to answer to."

 SWE_form_an_agrarian_cabinet:0 "Form an Agrarian Cabinet"
 SWE_form_an_agrarian_cabinet_desc:0 "Pehrsson-Bramstorp cannot govern from the farmers' benches alone, and a majority has to be bought from the other bourgeois parties.\n\nWestman takes justice for Bondeförbundet, Bagge comes in for Högern, and Bergquist for Folkpartiet. The prime minister keeps the chair; the other two keep the ministries they were promised."

 SWE_form_a_conservative_cabinet:0 "Form a Conservative Cabinet"
 SWE_form_a_conservative_cabinet_desc:0 "Bagge takes the chair, so Högern's seat at the table falls to Domö - deputy prime minister, and the man who will take the party leadership from Bagge in due course.\n\nWestman stays at justice for Bondeförbundet and Bergquist for Folkpartiet. The same three parties as the agrarian ministry, with the order of precedence reversed."

 # === The two ministers vanilla does not ship =======================
 SWE_karl_gustav_westman:0 "Karl Gustav Westman"
 SWE_karl_gustav_westman_desc:0 "Professor of legal history before he was a politician, and Bondeförbundet's man at the Ministry of Justice from 1936. Careful, conservative and a great deal more comfortable with the letter of the law than with the press."
 SWE_fritiof_domo:0 "Fritiof Domö"
 SWE_fritiof_domo_desc:0 "Högern's deputy leader and a minister without portfolio - the man who does the arithmetic while Bagge makes the speeches. He will have the party leadership himself before the war is over."

 # === The fifth answer at the ballot box ============================
 AAT_Sweden.3.e:0 "Socialisterna växer starkt - the party comes back leaning on the unions."

 # === The king who stays ============================================
 SWE_constitutional_monarch:0 "Constitutional Monarch"
 wif_swe_gustaf_v_constitutional:0 "King Gustaf V"
 wif_swe_gustaf_v_constitutional_desc:0 "The war cabinet did not ask the King to go. It asked him to stop, which at seventy-eight is the harder request of the two.\n\nHe keeps the palace, the opening of the Riksdag and the state visits. He has given up the letters to ministers, the opinions about Germany, and the standing quarrel with the chamber over who decides what."

 # === Foreign policy ================================================
 SWE_swedish_foreign_policy:0 "Swedish Foreign Policy"
 SWE_affirm_neutrality:0 "Affirm Neutrality"
 SWE_affirm_neutrality_desc:0 "Sweden stayed out of the last great war and came out of it richer. The government restates the policy in the Riksdag and in every capital that asks: Sweden trades with all, allies with none, and will defend its borders against anyone who crosses them."
 SWE_join_the_allies:0 "Join the Allies"
 SWE_join_the_allies_desc:0 "London and Paris have spent the war asking Stockholm for ore, for transit rights and for a little courage. The government decides to give them all three. Sweden's lot is cast with the democracies it has always resembled."
 SWE_stand_with_finland:0 "Stand with Finland"
 SWE_stand_with_finland_desc:0 "When Helsinki asked for help, Sweden did not send a letter of sympathy. It sent an army. Having gone to war for Finland, the government now commits to seeing it through, whatever the cost and however long the war lasts."
 SWE_join_the_axis:0 "Join the Axis"
 SWE_join_the_axis_desc:0 "Germany is winning, Germany is next door, and Germany buys most of the iron ore that keeps Swedish industry alive. The cabinet concludes that it is safer to be Berlin's partner than to wait and see what Berlin does to a neutral."
 SWE_take_sides:0 "Take Sides"
 SWE_take_sides_desc:0 "Neutrality kept Sweden safe while the war was far away. It is not far away any more. The cabinet concludes that a country which refuses to choose will simply have the choice made for it, and begins to look for friends while it still has something to offer them."
 SWE_swedish_foreign_policy_desc:0 "The war has reached the Baltic, and it no longer stops at someone else's border. Stockholm can keep insisting on neutrality, but it can no longer pretend that neutrality is a policy on its own.\n\nThe cabinet has to decide what Sweden stands for before somebody else decides it for Sweden."
