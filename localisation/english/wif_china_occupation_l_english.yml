 wif_rng_resistance_category:0 "The Three Resistances"
 wif_rng_resistance_category_desc:0 "Communist Guerrillas §R[?RNG.wif_rng_com_s|0]§! (+[?RNG.wif_rng_com_r|1]/month), Loyalist Army §R[?RNG.wif_rng_kmt_s|0]§! (+[?RNG.wif_rng_kmt_r|1]), Liberation League §R[?RNG.wif_rng_lib_s|0]§! (+[?RNG.wif_rng_lib_r|1]). They never fall below 10.\nEconomic Decay: §R[?ROOT.wif_rng_decay|0]§!/100.\n\n[ROOT.GetWifRngIntelCom]\n[ROOT.GetWifRngIntelKmt]\n[ROOT.GetWifRngIntelLib]\n\nEach resistance saves its strength for an operation and spends it when it strikes: railway cuts (10), freeing labour columns (20), wrecking mines (30), factory strikes (40), assassinations (45, Loyalists), blowing up factories (50), breaking open labour camps (60), liberated districts (75), strikes at Japanese convoys (85). Sweep the state where a resistance hides to set it back."
 wif_jap_china_category:0 "Our Chinese Associate"
 wif_jap_china_category_desc:0 "Wang's government in Wuhan feeds us - for now. RNG's Economic Decay: §R[?RNG.wif_rng_decay|0]§!/100. The resistance: Communist Guerrillas §R[?RNG.wif_rng_com_s|0]§! (+[?RNG.wif_rng_com_r|1]/month), Loyalist Army §R[?RNG.wif_rng_kmt_s|0]§! (+[?RNG.wif_rng_kmt_r|1]), Liberation League §R[?RNG.wif_rng_lib_s|0]§! (+[?RNG.wif_rng_lib_r|1]). They never fall below 10."
 wif_prc_resistance_category:0 "Behind the Enemy Lines"
 wif_prc_resistance_category_desc:0 "The resistance in RNG: Communist Guerrillas §R[?RNG.wif_rng_com_s|0]§! (+[?RNG.wif_rng_com_r|1]/month), Loyalist Army §R[?RNG.wif_rng_kmt_s|0]§! (+[?RNG.wif_rng_kmt_r|1]), Liberation League §R[?RNG.wif_rng_lib_s|0]§! (+[?RNG.wif_rng_lib_r|1]). They never fall below 10.\nLeague Allegiance: [?global.wif_league_allegiance|0] (-100 Nationalist, +100 Communist).\nJapan's suspicion of us: §R[?ROOT.wif_jap_susp|0]§!/50."
 wif_nwa_resistance_category:0 "The Republic Behind the Lines"
 wif_nwa_resistance_category_desc:0 "The resistance in RNG: Communist Guerrillas §R[?RNG.wif_rng_com_s|0]§! (+[?RNG.wif_rng_com_r|1]/month), Loyalist Army §R[?RNG.wif_rng_kmt_s|0]§! (+[?RNG.wif_rng_kmt_r|1]), Liberation League §R[?RNG.wif_rng_lib_s|0]§! (+[?RNG.wif_rng_lib_r|1]). They never fall below 10.\nLeague Allegiance: [?global.wif_league_allegiance|0] (-100 Nationalist, +100 Communist).\nJapan's suspicion of us: §R[?ROOT.wif_jap_susp|0]§!/50."
 wif_chn.11.t:0 "The Railway Cut"
 wif_chn.11.d:0 "Explosives under the line in [wif_rng_attack_state.GetName]. A goods train for the coast lies on its side in a ravine. The [ROOT.GetWifRngAttacker] have claimed it."
 wif_chn.11.a:0 "Repair it - if we can."
 wif_chn.12.t:0 "A Labour Column Freed"
 wif_chn.12.d:0 "A column of conscripted labourers on its way to the mines was ambushed. The guards ran; the labourers did not come back. Many of them, we hear, now carry rifles for the [ROOT.GetWifRngAttacker]."
 wif_chn.12.a:0 "Raise the quota."
 wif_chn.13.t:0 "A Mine Wrecked"
 wif_chn.13.d:0 "The pit head and winding gear at a mine in [wif_rng_attack_state.GetName] have been blown up by the [ROOT.GetWifRngAttacker]. Tokyo is already asking where its ore is."
 wif_chn.13.a:0 "There is nothing to repair it with."
 wif_chn.14.t:0 "Strike!"
 wif_chn.14.d:0 "The workers in [wif_rng_attack_state.GetName] have downed tools. The [ROOT.GetWifRngAttacker] organised it; hunger did the rest."
 wif_chn.14.a:0 "Send in the police."
 wif_chn.15.t:0 "A Collaborator Shot"
 wif_chn.15.d:0 "One of our ministers was shot dead in the street in broad daylight. The [ROOT.GetWifRngAttacker] left a leaflet on the body: a traitor's death."
 wif_chn.15.a:0 "Another one."
 wif_chn.16.t:0 "A Factory Destroyed"
 wif_chn.16.d:0 "A factory in [wif_rng_attack_state.GetName] has gone up in flames. The [ROOT.GetWifRngAttacker] smuggled the explosives in with the night shift. Repairing it will take months we do not have."
 wif_chn.16.a:0 "Find them."
 wif_chn.17.t:0 "The Camp Broken Open"
 wif_chn.17.d:0 "The [ROOT.GetWifRngAttacker] stormed a labour camp. The wire is down, the guards are dead, and thousands of prisoners have vanished into the hills."
 wif_chn.17.a:0 "Hunt them down."
 wif_chn.18.t:0 "A Liberated District"
 wif_chn.18.d:0 "[wif_rng_attack_state.GetName] has fallen to the [ROOT.GetWifRngAttacker]. They hold the towns, run the villages and call it liberated territory. The army must take it back."
 wif_chn.18.a:0 "Retake it."
 wif_chn.19.t:0 "Japanese Convoy Burned"
 wif_chn.19.d:0 "A Japanese supply convoy was ambushed on the road by the [ROOT.GetWifRngAttacker]. Tokyo blames Wuhan."
 wif_chn.19.a:0 "They will not forgive us."
 wif_chn.30.t:0 "The Sweep Finds Them"
 wif_chn.30.d:0 "The cordon closed on the hideout of the [ROOT.GetWifRngAttacker]. They broke out with heavy losses and have gone to ground."
 wif_chn.30.a:0 "They will be back."
 wif_chn.31.t:0 "They Slipped Away"
 wif_chn.31.d:0 "The sweep found the camp of the [ROOT.GetWifRngAttacker] still warm. They had been warned, and have moved their hideout."
 wif_chn.31.a:0 "Next time."
 wif_chn.32.t:0 "Empty Hills"
 wif_chn.32.d:0 "A month of marching found burned-out camps and nothing else. The [ROOT.GetWifRngAttacker] were never there."
 wif_chn.32.a:0 "Our intelligence was wrong."
 wif_chn.33.t:0 "A Cell Uncovered"
 wif_chn.33.d:0 "The [ROOT.GetWifRngAttacker] were not there - but the sweep stumbled on one of their cells: an arms cache, a courier network and the men who ran it."
 wif_chn.33.a:0 "Every cell counts."
 wif_chn.34.t:0 "Where They Hide"
 wif_chn.34.d:0 "Informers, captured couriers and Japanese radio intercepts all point the same way. [ROOT.GetWifRngIntelLast]\n\nThe information will be good for a few weeks."
 wif_chn.34.a:0 "Send in the army."
 wif_chn.61.t:0 "The Kempeitai Finds the Letters"
 wif_chn.61.d:0 "The Japanese military police have intercepted Zhou Fohai's letters to the Northwestern Army. Tokyo is furious, and Wuhan is shaken."
 wif_chn.61.a:0 "It was insurance, nothing more."
 wif_chn.62.t:0 "A Japanese Punitive Expedition"
 wif_chn.62.d:0 "Japan has had enough of us arming the bandits in its Chinese associate. A Japanese column has struck across our border, burning villages and wrecking roads before it withdrew."
 wif_chn.62.a:0 "We will remember this."
 wif_chn.60.t:0 "The Collapse in China"
 wif_chn.60.d:0 "It started in the provinces: a run on the Central Reserve Bank in Changsha, a rice riot in Wuhan, a regiment that did not answer orders. Within weeks the Reorganized Government's whole hollow structure has begun to give way. Tokyo built its plans on Chinese rice, iron and men - and must now decide how much more it can afford to pour in."
 wif_chn.60.a:0 "Japan must hold it together."
 wif_chn.60.b:0 "The house of cards is falling."
