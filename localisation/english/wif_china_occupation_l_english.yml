l_english:
 wif_rng_root:0 "The Reorganized National Government"
 wif_rng_root_desc:0 "China has surrendered. The coast and Nanjing are Japan's; the interior has been handed to Wang Jingwei's Reorganized National Government, seated at Wuhan, an Imperial Associate of Japan. Its slogan is Peace, Anti-Communism, National Reconstruction. Its purpose, as Tokyo sees it, is rice, iron, tungsten and labour."
 wif_rng_peace_anti_communism:0 "Peace, Anti-Communism, National Reconstruction"
 wif_rng_peace_anti_communism_desc:0 "Wang's three slogans are painted on every wall in Wuhan. Few believe the first, many fear the second, and the third is done by Japanese companies."
 wif_rng_capital_wuhan:0 "The Capital at Wuhan"
 wif_rng_capital_wuhan_desc:0 "Nanjing is Japan's now. The government moves into the river city's old concession buildings, guarded by Japanese sentries."
 wif_rng_three_principles:0 "The Three Principles Reinterpreted"
 wif_rng_three_principles_desc:0 "Sun Yat-sen's nationalism, democracy and livelihood - read so that they mean cooperation with Japan."
 wif_rng_political_council:0 "The Central Political Council"
 wif_rng_political_council_desc:0 "A council of former Nationalists, warlords and bankers. It debates; Japanese advisers decide."
 wif_rng_new_citizens:0 "The New Citizens' Movement"
 wif_rng_new_citizens_desc:0 "Mass rallies, loyalty oaths and portraits of Wang beside the Emperor."
 wif_rng_wang_cabinet:0 "Wang Jingwei's Cabinet"
 wif_rng_wang_cabinet_desc:0 "Chen Gongbo at the Legislative Yuan, Zhou Fohai at Finance. Men who once served Chiang now serve Tokyo through Wang."
 wif_rng_youth_corps:0 "The Youth Corps"
 wif_rng_youth_corps_desc:0 "Uniformed youth for parades and for informing on their teachers."
 wif_rng_puppet_press:0 "The Controlled Press"
 wif_rng_puppet_press_desc:0 "Every newspaper is printed under a Japanese censor. The rebels print their own."
 wif_rng_leash_not_crown:0 "A Leash, Not a Crown"
 wif_rng_leash_not_crown_desc:0 "Wang dreamed of a China that would be Japan's equal partner. The treaties say otherwise, and the garrisons enforce them. The government accepts what it is."
 wif_rng_wang_illness:0 "Wang Jingwei's Illness"
 wif_rng_wang_illness_desc:0 "The bullet from the 1935 assassination attempt is still in Wang's back. He is flown to Nagoya for surgery and does not come back."
 wif_rng_chen_gongbo:0 "Chen Gongbo Takes Over"
 wif_rng_chen_gongbo_desc:0 "Wang's loyal lieutenant becomes acting chairman, and keeps the regime exactly as it was."
 wif_rng_zhou_fohai:0 "Zhou Fohai Takes Over"
 wif_rng_zhou_fohai_desc:0 "The finance minister holds the purse, the police and the secret line to the Nationalists."
 wif_rng_party_before_all:0 "The Party Before All"
 wif_rng_party_before_all_desc:0 "The Reorganized Kuomintang becomes the only path to office."
 wif_rng_treasury_before_all:0 "The Treasury Before All"
 wif_rng_treasury_before_all_desc:0 "Zhou runs the state like a bank: everything has a price, including loyalty."
 wif_rng_loyal_unto_end:0 "Loyal Unto the End"
 wif_rng_loyal_unto_end_desc:0 "Whatever happens to Japan, Chen promises to share its fate."
 wif_rng_secret_letters:0 "Secret Letters to the Northwest"
 wif_rng_secret_letters_desc:0 "Zhou passes messages to the Northwestern Army's agents - insurance, he calls it."
 wif_rng_eight_years:0 "Eight Years Under the Sun"
 wif_rng_eight_years_desc:0 "The Reorganized Government has survived where no one thought it would - as a servant, never as a state. But the warehouses are empty and the banknotes worthless."
 wif_rng_basic_relations:0 "The Treaty of Basic Relations"
 wif_rng_basic_relations_desc:0 "Signed under the guns: Japanese troops may stay anywhere, Japanese firms get first claim on every mine, and Japan advises every ministry."
 wif_rng_advisers_everywhere:0 "Japanese Advisers in Every Ministry"
 wif_rng_advisers_everywhere_desc:0 "A Japanese colonel sits beside every Chinese minister."
 wif_rng_garrison_agreement:0 "The Garrison Agreement"
 wif_rng_garrison_agreement_desc:0 "Japanese divisions are stationed in Wuhan, Changsha and along the railways at RNG's expense."
 wif_rng_eager_collaborator:0 "The Eager Collaborator"
 wif_rng_eager_collaborator_desc:0 "Wuhan anticipates Tokyo's wishes before they are spoken."
 wif_rng_reluctant_servant:0 "The Reluctant Servant"
 wif_rng_reluctant_servant_desc:0 "Wuhan obeys, slowly, and files every order in triplicate. It is still a servant."
 wif_rng_comfort_stations:0 "The Comfort Stations"
 wif_rng_comfort_stations_desc:0 "The garrisons bring their 'comfort stations'. Women and girls are taken from the towns along the railways, some by RNG police on Japanese orders. Nobody in Wuhan protests."
 wif_rng_petition_arms:0 "Petition for Japanese Arms"
 wif_rng_petition_arms_desc:0 "Wang asks for rifles and gets them - old Arisakas, but rifles."
 wif_rng_quiet_grievances:0 "A Quiet List of Grievances"
 wif_rng_quiet_grievances_desc:0 "A memorandum to the Japanese embassy about requisitions and the garrisons. It is acknowledged and filed."
 wif_rng_concessions:0 "The Return of the Concessions"
 wif_rng_concessions_desc:0 "Japan hands the old Western concessions over to Chinese administration - on paper."
 wif_rng_greater_east_asia:0 "The Greater East Asia Conference"
 wif_rng_greater_east_asia_desc:0 "Wang sits in Tokyo beside Tojo, Ba Maw, Laurel, Bose and Zhang Jinghui, the faces of the Co-Prosperity Sphere."
 wif_rng_declare_war:0 "Declare War on the Allies"
 wif_rng_declare_war_desc:0 "RNG joins the war it cannot fight."
 wif_rng_volunteers:0 "Labour Battalions for the Imperial Army"
 wif_rng_volunteers_desc:0 "Chinese labourers dig Japanese airfields across the Pacific."
 wif_rng_co_prosperity:0 "A Member of the Co-Prosperity Sphere"
 wif_rng_co_prosperity_desc:0 "In Tokyo's charts, RNG is a model member: it gives everything and asks nothing."
 wif_rng_tokyos_son:0 "Tokyo's Favourite Son"
 wif_rng_tokyos_son_desc:0 "Of all Japan's Chinese governments, Wuhan is the one Tokyo trusts most - which means it is watched most closely."
 wif_rng_reserve_bank:0 "The Central Reserve Bank"
 wif_rng_reserve_bank_desc:0 "A new currency, tied to the yen and printed without limit."
 wif_rng_rice_control:0 "The Rice Control Committee"
 wif_rng_rice_control_desc:0 "Every harvest is weighed; the Japanese army's share comes first."
 wif_rng_development_company:0 "The Central China Development Company"
 wif_rng_development_company_desc:0 "A Japanese holding company takes the mines, railways and power plants of central China."
 wif_rng_labour_bureau:0 "The Labour Recruitment Bureau"
 wif_rng_labour_bureau_desc:0 "Recruitment means lorries in the villages and quotas for every county head."
 wif_rng_grain_requisitions:0 "Grain Requisitions"
 wif_rng_grain_requisitions_desc:0 "The quota is fixed in Tokyo, whatever the harvest."
 wif_rng_daye_iron:0 "Daye Iron for Yawata"
 wif_rng_daye_iron_desc:0 "The ore of Daye in Hubei goes down the Yangtze to the Yawata steelworks in Japan."
 wif_rng_jiangxi_tungsten:0 "The Tungsten of Jiangxi"
 wif_rng_jiangxi_tungsten_desc:0 "The world's richest tungsten mines, now worked for Japanese armour-piercing shot."
 wif_rng_county_quotas:0 "Labour Quotas for Every County"
 wif_rng_county_quotas_desc:0 "A county head who misses his quota goes himself."
 wif_rng_henan_famine:0 "The Henan Famine"
 wif_rng_henan_famine_desc:0 "The harvest fails, the requisitions do not stop. Millions starve in Henan; families sell their children for grain."
 wif_rng_factories_for_japan:0 "Factories for Japan"
 wif_rng_factories_for_japan_desc:0 "Mitsui and Mitsubishi take over the mills of Wuhan and Changsha."
 wif_rng_ore_for_japan:0 "Ore for Japan"
 wif_rng_ore_for_japan_desc:0 "Why build factories here when the ore can go to Japan?"
 wif_rng_workers_manchukuo:0 "Workers for Manchukuo"
 wif_rng_workers_manchukuo_desc:0 "Trains of conscripted labourers go north to the mines of Fushun and the fortresses of the Soviet border."
 wif_rng_opium_monopoly:0 "The Opium Monopoly"
 wif_rng_opium_monopoly_desc:0 "The state sells opium openly; the profits pay for the army and the Japanese special service."
 wif_rng_mitsubishi_wuhan:0 "The Wuhan Works"
 wif_rng_mitsubishi_wuhan_desc:0 "Arsenals and shipyards on the Yangtze, working for the Imperial Army."
 wif_rng_gejiu_tin:0 "The Tin of Gejiu"
 wif_rng_gejiu_tin_desc:0 "The Yunnan tin mines, where boys carry ore up from the shafts on their backs."
 wif_rng_labourers_japan:0 "Labourers Shipped to Japan"
 wif_rng_labourers_japan_desc:0 "Prisoners of war and conscripts go to Japan's coal mines and docks, many never to return."
 wif_rng_factory_guards:0 "Factory Guards"
 wif_rng_factory_guards_desc:0 "Armed guards and fences around every works and mine head."
 wif_rng_pits_of_dead:0 "The Pits of Ten Thousand Dead"
 wif_rng_pits_of_dead_desc:0 "Beside the mines, the bodies of worked-to-death labourers are thrown into pits. Villagers call them 'pits of ten thousand men'."
 wif_rng_total_mobilisation:0 "Total Mobilisation of Resources"
 wif_rng_total_mobilisation_desc:0 "Everything that can be moved is moved to Japan: scrap metal, temple bells, railway track from branch lines."
 wif_rng_runaway_inflation:0 "Runaway Inflation"
 wif_rng_runaway_inflation_desc:0 "Central Reserve Bank notes are weighed, not counted. Workers are paid in rice when they are paid at all."
 wif_rng_economy_for_empire:0 "An Economy for the Empire"
 wif_rng_economy_for_empire_desc:0 "Central China has become a quarry and a labour pool for Japan. Nothing is left to build with, and nobody is left to build."
 wif_rng_peace_army:0 "The Peace Preservation Army"
 wif_rng_peace_army_desc:0 "The Heping Jianguo Jun: former Nationalist units, bandits and conscripts in Japanese-cut uniforms."
 wif_rng_turncoat_generals:0 "Turncoat Generals"
 wif_rng_turncoat_generals_desc:0 "Nationalist generals who changed sides bring their divisions - and their loyalties - with them."
 wif_rng_japanese_instructors:0 "Japanese Instructors"
 wif_rng_japanese_instructors_desc:0 "Japanese officers drill the new army."
 wif_rng_reliable_few:0 "The Reliable Few"
 wif_rng_reliable_few_desc:0 "A small army that will not desert."
 wif_rng_endless_levies:0 "Endless Levies"
 wif_rng_endless_levies_desc:0 "Numbers instead of loyalty. Half of them will sell their rifles to the guerrillas."
 wif_rng_military_academy:0 "The Central Military Academy"
 wif_rng_military_academy_desc:0 "Cadets swear loyalty to Wang - and to the Emperor."
 wif_rng_pressganged:0 "Pressganged Divisions"
 wif_rng_pressganged_desc:0 "Villages that miss the conscription quota are burned."
 wif_rng_arisaka_rifles:0 "Arisaka Rifles"
 wif_rng_arisaka_rifles_desc:0 "Japan hands down its old rifles and machine guns."
 wif_rng_river_patrol:0 "The Yangtze River Patrol"
 wif_rng_river_patrol_desc:0 "Gunboats to keep the river - Japan's highway into the interior - open."
 wif_rng_token_air_arm:0 "A Token Air Arm"
 wif_rng_token_air_arm_desc:0 "A handful of old Japanese trainers and fighters for parades and patrols."
 wif_rng_railway_guards:0 "Railway Guard Divisions"
 wif_rng_railway_guards_desc:0 "Blockhouses every few miles along every line, each with a platoon."
 wif_rng_armies_for_emperor:0 "Field Armies for the Emperor"
 wif_rng_armies_for_emperor_desc:0 "RNG divisions may be sent wherever Japan needs them."
 wif_rng_pacification:0 "Pacification Committees"
 wif_rng_pacification_desc:0 "Every county gets a committee of collaborators, a police chief and a Japanese liaison officer."
 wif_rng_baojia:0 "The Baojia System"
 wif_rng_baojia_desc:0 "Households in groups of ten, each responsible for the others. One guerrilla, ten families punished."
 wif_rng_informants:0 "Friends of the Kempeitai"
 wif_rng_informants_desc:0 "Paid informers in every teahouse."
 wif_rng_clear_villages:0 "Clear the Villages"
 wif_rng_clear_villages_desc:0 "The Qingxiang campaign: villages near the guerrilla areas are emptied and fenced, the people moved to guarded settlements."
 wif_rng_fourth_army:0 "Against the New Fourth Army"
 wif_rng_fourth_army_desc:0 "A campaign aimed at the Communist base areas."
 wif_rng_loyalist_hunt:0 "Hunting the Loyal and Patriotic Army"
 wif_rng_loyalist_hunt_desc:0 "The Loyalists' officers are hunted through their families."
 wif_rng_liberation_infiltrate:0 "Infiltrate the Liberation League"
 wif_rng_liberation_infiltrate_desc:0 "Agents join the student circles and the dock unions."
 wif_rng_blockhouses:0 "Blockhouses and Ditches"
 wif_rng_blockhouses_desc:0 "Walls, ditches and watchtowers cut the base areas off from the plains."
 wif_rng_loyalist_amnesty:0 "Amnesty for Loyalist Officers"
 wif_rng_loyalist_amnesty_desc:0 "A Nationalist officer who comes over keeps his rank. Some do. Their men do not."
 wif_rng_liberation_bounties:0 "Bounties on the League"
 wif_rng_liberation_bounties_desc:0 "A price on every head."
 wif_rng_joint_operations:0 "Joint Operations with the Japanese Army"
 wif_rng_joint_operations_desc:0 "RNG divisions march with the Japanese North and Central China Armies."
 wif_rng_model_zones:0 "Model Peace Zones"
 wif_rng_model_zones_desc:0 "Showcase counties with schools and clinics for visiting journalists."
 wif_rng_three_alls:0 "The Three Alls"
 wif_rng_three_alls_desc:0 "Kill all, burn all, loot all: the Japanese army's answer to the base areas, carried out with RNG units at its side. Whole districts are depopulated."
 wif_rng_camp_guards:0 "Labour Camp Guards"
 wif_rng_camp_guards_desc:0 "Wire, dogs and machine guns around the labour camps."
 wif_rng_collective_punishment:0 "Collective Punishment"
 wif_rng_collective_punishment_desc:0 "For every soldier killed, a village burned."
 wif_rng_bribes_amnesties:0 "Bribes and Amnesties"
 wif_rng_bribes_amnesties_desc:0 "Rice for informers, pardons for deserters."
 wif_rng_endless_war:0 "The Endless War in the Hills"
 wif_rng_endless_war_desc:0 "The rebels cannot be beaten, only held. RNG learns to live with them."
 wif_rng_collapse_begins:0 "The Collapse Begins"
 wif_rng_collapse_begins_desc:0 "It starts in the provinces: a run on the Central Reserve Bank in Changsha, a rice riot in Wuhan, a regiment that does not answer orders. Within weeks the whole hollow structure begins to give way. Tokyo, which built its plans on Chinese rice, iron and men, must now decide how much more it can afford to pour in."
 wif_prc_root:0 "After the Surrender"
 wif_prc_root_desc:0 "China has surrendered. Japan holds the coast, Wang Jingwei's Reorganized National Government (RNG) holds the interior for Tokyo, and the rump Nationalist government - the Northwestern Army - holds the far northwest. The Communists are left with the poor loess hills around Yan'an, blockaded on every side. There is no help from Moscow: the Soviet Union is gone, and Stalin sits in Irkutsk with only his most loyal men.\n\nThe Party's answer is the one it has always had: survive, organise, and let the enemy's own rule recruit for it."
 wif_prc_party_survives:0 "The Party Survives"
 wif_prc_party_survives_desc:0 "The Central Committee meets in the caves of Yan'an. The war is lost; the Party is not."
 wif_prc_rectification:0 "The Rectification Movement"
 wif_prc_rectification_desc:0 "Study sessions, self-criticism and confession. Every cadre must learn to think as the Chairman thinks."
 wif_prc_mass_line:0 "The Mass Line"
 wif_prc_mass_line_desc:0 "From the masses, to the masses: cadres live in the villages, eat what the peasants eat, and listen."
 wif_prc_yanan_forum:0 "The Yan'an Forum on Literature and Art"
 wif_prc_yanan_forum_desc:0 "Art must serve the workers, peasants and soldiers. Writers who disagree learn to keep silent."
 wif_prc_rescue_campaign:0 "The Rescue Campaign"
 wif_prc_rescue_campaign_desc:0 "Kang Sheng's security service 'rescues' cadres who have 'lost their footing': night interrogations, forced confessions, thousands accused of being Nationalist spies."
 wif_prc_persuasion:0 "Rectification by Persuasion"
 wif_prc_persuasion_desc:0 "Mao halts the worst of the confessions and apologises - a little."
 wif_prc_rent_reduction:0 "Rent and Interest Reduction"
 wif_prc_rent_reduction_desc:0 "Landlords keep their land but must cut their rents. The peasants notice who made them."
 wif_prc_kangda:0 "Cadre Schools"
 wif_prc_kangda_desc:0 "Thousands of students who fled the occupied cities are trained as cadres."
 wif_prc_lu_xun_academy:0 "The Lu Xun Academy of Arts"
 wif_prc_lu_xun_academy_desc:0 "Yangge dances and new operas, performed in every village and smuggled into RNG on handbills."
 wif_prc_wang_shiwei:0 "Wang Shiwei"
 wif_prc_wang_shiwei_desc:0 "The writer who mocked the leaders' privileges in 'Wild Lilies' is branded a Trotskyist, held for years, and finally executed. Every intellectual in Yan'an knows his name."
 wif_prc_land_to_tiller:0 "Land to the Tiller"
 wif_prc_land_to_tiller_desc:0 "In the Border Region, the landlords' land is divided. Some landlords leave; some are killed."
 wif_prc_seventh_congress:0 "The Seventh Party Congress"
 wif_prc_seventh_congress_desc:0 "Mao Zedong Thought is written into the Party constitution. The Chairman stands alone at the top."
 wif_prc_liu_shaoqi:0 "Liu Shaoqi's Organisation"
 wif_prc_liu_shaoqi_desc:0 "The Party's organiser builds a cadre system ready to run a country."
 wif_prc_zhou_enlai:0 "Zhou Enlai's United Front Work"
 wif_prc_zhou_enlai_desc:0 "Zhou courts students, merchants, minor parties and Northwestern Army officers alike."
 wif_prc_party_million:0 "A Party of a Million"
 wif_prc_party_million_desc:0 "Membership passes one million - most of them in the hills of RNG, not in Yan'an."
 wif_prc_ready_to_govern:0 "Ready to Govern"
 wif_prc_ready_to_govern_desc:0 "Shadow county governments wait in the guerrilla areas for the day RNG falls."
 wif_prc_border_government:0 "The Border Region Government"
 wif_prc_border_government_desc:0 "The Shaan-Gan-Ning Border Region: a few hundred thousand peasants, no railway, no industry, and the most organised government in China."
 wif_prc_self_reliance:0 "Self-Reliance"
 wif_prc_self_reliance_desc:0 "Nobody will help us, so we will help ourselves."
 wif_prc_production_campaign:0 "The Great Production Campaign"
 wif_prc_production_campaign_desc:0 "Soldiers, cadres and students all farm, spin and build. Even Mao keeps a vegetable plot."
 wif_prc_nanniwan:0 "Nanniwan"
 wif_prc_nanniwan_desc:0 "The 359th Brigade turns a wilderness valley into farmland and feeds itself."
 wif_prc_cooperatives:0 "Cooperatives"
 wif_prc_cooperatives_desc:0 "Village cooperatives pool tools, draught animals and labour."
 wif_prc_salt_trade:0 "The Salt of the Border Region"
 wif_prc_salt_trade_desc:0 "Salt from the northern lakes is the Border Region's one export - sold across the lines to anyone who pays."
 wif_prc_smuggling:0 "Smuggling Across the Lines"
 wif_prc_smuggling_desc:0 "Mule trains slip through RNG's blockhouses with cloth, medicine and rifles - bribes paid in salt and silver."
 wif_prc_cave_arsenals:0 "Cave Arsenals"
 wif_prc_cave_arsenals_desc:0 "Workshops dug into the loess make rifles, grenades and mines by hand."
 wif_prc_yanchang_oil:0 "The Yanchang Oil Wells"
 wif_prc_yanchang_oil_desc:0 "China's oldest oil wells, at Yanchang in northern Shaanxi, are put back to work."
 wif_prc_border_bank:0 "The Border Region Bank"
 wif_prc_border_bank_desc:0 "The Border Region issues its own money, backed by salt and grain rather than by Tokyo."
 wif_prc_spinning_wheels:0 "A Spinning Wheel in Every Cave"
 wif_prc_spinning_wheels_desc:0 "Cloth is the blockade's worst shortage. Every household spins."
 wif_prc_economic_war:0 "Economic War on the Reserve Bank"
 wif_prc_economic_war_desc:0 "Border Region agents dump forged and hoarded Central Reserve Bank notes back into RNG's markets."
 wif_prc_break_blockade:0 "Break the Blockade"
 wif_prc_break_blockade_desc:0 "The blockade is still there; it no longer matters."
 wif_prc_base_for_country:0 "A Base for the Whole Country"
 wif_prc_base_for_country_desc:0 "Yan'an is no longer a refuge. It is the rear base for the war still to come."
 wif_prc_rebuild_army:0 "Rebuild the Eighth Route Army"
 wif_prc_rebuild_army_desc:0 "The divisions that came back from the war are rebuilt around their surviving officers."
 wif_prc_lessons_defeat:0 "The Lessons of Defeat"
 wif_prc_lessons_defeat_desc:0 "Where we fought the Japanese head-on, we lost."
 wif_prc_arms_from_enemy:0 "Arms from the Enemy"
 wif_prc_arms_from_enemy_desc:0 "With no Soviet aid, the enemy is the quartermaster: captured rifles, bought rifles, rifles traded for salt."
 wif_prc_guerrilla_war:0 "Guerrilla War Above All"
 wif_prc_guerrilla_war_desc:0 "Mao's way: the army is the fish, the people are the sea."
 wif_prc_mobile_warfare:0 "Mobile Warfare"
 wif_prc_mobile_warfare_desc:0 "Peng Dehuai's way: concentrate, strike hard, move on - like the Hundred Regiments Offensive."
 wif_prc_militia:0 "The People's Militia"
 wif_prc_militia_desc:0 "Every village has its self-defence corps."
 wif_prc_military_university:0 "The Military and Political University"
 wif_prc_military_university_desc:0 "Officers learn tactics in the morning and Marxism in the afternoon."
 wif_prc_regular_columns:0 "Regular Columns"
 wif_prc_regular_columns_desc:0 "A few divisions are trained and armed to fight in the open."
 wif_prc_japanese_comrades:0 "Japanese Comrades"
 wif_prc_japanese_comrades_desc:0 "Nosaka Sanzo's Japanese People's Emancipation League turns captured Japanese soldiers into propagandists, calling across the lines to the garrisons in their own language."
 wif_prc_tunnels_mines:0 "Tunnels and Mines"
 wif_prc_tunnels_mines_desc:0 "Tunnel warfare and landmine warfare: whole villages connected underground, roads seeded with homemade mines."
 wif_prc_field_armies:0 "Field Armies"
 wif_prc_field_armies_desc:0 "The guerrilla units are grouped into field armies, ready to come down from the hills."
 wif_prc_ready_counteroffensive:0 "Ready for the Counteroffensive"
 wif_prc_ready_counteroffensive_desc:0 "The plans are drawn for the day the enemy's rule cracks."
 wif_prc_behind_lines:0 "Behind the Enemy Lines"
 wif_prc_behind_lines_desc:0 "The war goes on where Japan thinks it has won: in RNG's villages, mines and labour camps."
 wif_prc_cadres_south:0 "Cadres to the South"
 wif_prc_cadres_south_desc:0 "Trained cadres slip south to lead the scattered guerrilla bands."
 wif_prc_underground_railway:0 "The Underground Railway"
 wif_prc_underground_railway_desc:0 "Safe houses, guides and forged passes from RNG's labour camps to Yan'an."
 wif_prc_court_league:0 "Courting the Liberation League"
 wif_prc_court_league_desc:0 "The League has no party. We would like it to have one."
 wif_prc_fourth_army_reborn:0 "The New Fourth Army Reborn"
 wif_prc_fourth_army_reborn_desc:0 "The bands in Anhui and Jiangxi take back the old name."
 wif_prc_sabotage_schools:0 "Sabotage Schools"
 wif_prc_sabotage_schools_desc:0 "Railwaymen and miners who escaped north are trained to go back and wreck what they built."
 wif_prc_students_strikers:0 "Students and Strikers"
 wif_prc_students_strikers_desc:0 "Communist organisers in the student circles and the factory unions of Wuhan and Changsha."
 wif_prc_base_areas:0 "Base Areas in the Hills"
 wif_prc_base_areas_desc:0 "Mountain base areas with their own shadow governments."
 wif_prc_free_the_camps:0 "Free the Labour Camps"
 wif_prc_free_the_camps_desc:0 "The camps that feed Japan's mines are the weakest point of RNG's economy - and the place where most of our future soldiers are."
 wif_prc_lead_league:0 "Lead the League"
 wif_prc_lead_league_desc:0 "The Party takes the League's committees over, one by one."
 wif_prc_league_equals:0 "A League of Equals"
 wif_prc_league_equals_desc:0 "The League stays broad; we are one voice in it, the loudest."
 wif_prc_strike_mines:0 "Strike Japan's Mines"
 wif_prc_strike_mines_desc:0 "Daye, Jiangxi, Gejiu: every ton that does not reach Japan is a victory."
 wif_prc_one_front:0 "One Front Behind the Lines"
 wif_prc_one_front_desc:0 "Communists and the League plan their operations together."
 wif_prc_prairie_fire:0 "The Prairie Fire Spreads"
 wif_prc_prairie_fire_desc:0 "From Anhui to Yunnan, RNG holds the towns and the railways by day. The night belongs to the guerrillas."
 wif_prc_waiting_storm:0 "Waiting for the Storm"
 wif_prc_waiting_storm_desc:0 "Orders go out to every base area: save strength, store weapons, wait for the signal."
 wif_prc_two_chinas:0 "The Two Chinas Left"
 wif_prc_two_chinas_desc:0 "Two Chinese governments remain outside Japan's grip: ours, and the Northwestern Army's. Neither trusts the other."
 wif_prc_new_united_front:0 "A New United Front"
 wif_prc_new_united_front_desc:0 "Old enemies, one occupier. We offer the Northwestern Army a truce and a common cause."
 wif_prc_rivals_hills:0 "Rivals in the Hills"
 wif_prc_rivals_hills_desc:0 "The Nationalists lost China once. We will not let them lead it again."
 wif_prc_joint_funding:0 "Joint Funding of the League"
 wif_prc_joint_funding_desc:0 "A shared committee decides what the League gets, and from whom."
 wif_prc_border_clashes:0 "Border Clashes"
 wif_prc_border_clashes_desc:0 "Patrols fire on each other in the hills of Gansu."
 wif_prc_shared_intelligence:0 "Shared Intelligence"
 wif_prc_shared_intelligence_desc:0 "Our agents and theirs swap what they know about RNG and the Japanese garrisons."
 wif_prc_win_officers:0 "Win Over Their Officers"
 wif_prc_win_officers_desc:0 "Northwestern Army officers who are tired of losing are offered rank and a cause."
 wif_prc_world_beyond:0 "The World Beyond the Mountains"
 wif_prc_world_beyond_desc:0 "Moscow is gone. Who else is there?"
 wif_prc_dixie_mission:0 "The Dixie Mission"
 wif_prc_dixie_mission_desc:0 "An American observer group lands at Yan'an and finds the Communists useful."
 wif_prc_stand_alone:0 "Stand Alone"
 wif_prc_stand_alone_desc:0 "We owe nothing to anyone, and will not."
 wif_prc_allies_necessity:0 "Allies of Necessity"
 wif_prc_allies_necessity_desc:0 "Whoever helps us, helps us for their own reasons. That is enough."
 wif_prc_single_spark:0 "A Single Spark"
 wif_prc_single_spark_desc:0 "'A single spark can start a prairie fire,' Mao wrote in 1930. Twenty years later, the prairie is dry."
 wif_prc_industrial_coops:0 "Yan'an Industrial Cooperatives"
 wif_prc_industrial_coops_desc:0 "Refugee engineers and mechanics from the occupied cities set up small cooperative workshops in the caves and courtyards of Yan'an."
 wif_prc_suide_mills:0 "The Suide Textile Mills"
 wif_prc_suide_mills_desc:0 "Hand looms become a real mill at Suide - the first in the Border Region."
 wif_prc_loess_roads:0 "Roads Through the Loess"
 wif_prc_loess_roads_desc:0 "Lorry roads cut through the gullies between Yan'an, Yulin and the front."
 wif_prc_power_plant:0 "The Border Region Power Plant"
 wif_prc_power_plant_desc:0 "A small power plant, built from machinery smuggled in piece by piece."
 wif_prc_industry_rear:0 "Industry in the Rear"
 wif_prc_industry_rear_desc:0 "Yan'an has more industry now than it had in all its history - a few factories, but ours."
 wif_nwa_root:0 "The Retreat to the Northwest"
 wif_nwa_root_desc:0 "China has surrendered. Japan holds the coast; Wang Jingwei's RNG holds the interior for Tokyo. What is left of the Nationalist government has fallen back to eastern Gansu behind the Central Army's last divisions. In Lanzhou, General Hu Zongnan - once the man who blockaded Yan'an from Xi'an - now commands a state that is little more than an army with a capital.\n\nThe Northwestern Army Group still calls itself the government of China. Almost nobody else does."
 wif_nwa_lanzhou_capital:0 "The Capital at Lanzhou"
 wif_nwa_lanzhou_capital_desc:0 "Ministries move into temples and warehouses on the Yellow River. The flag of the Republic still flies."
 wif_nwa_generalissimo:0 "The Generalissimo's Fate"
 wif_nwa_generalissimo_desc:0 "Chiang Kai-shek resigned after the surrender. Some officers want him back; others blame him for everything."
 wif_nwa_chiang_returns:0 "The Generalissimo Returns"
 wif_nwa_chiang_returns_desc:0 "Chiang flies into Lanzhou and takes back the chairmanship. Hu Zongnan, his most loyal general, steps aside."
 wif_nwa_chiang_finished:0 "The Generalissimo Is Finished"
 wif_nwa_chiang_finished_desc:0 "Chiang stays in retirement. Hu Zongnan governs in the name of a Republic that has no president."
 wif_nwa_military_government:0 "Military Government"
 wif_nwa_military_government_desc:0 "Every county is run by an officer. Civilians may advise."
 wif_nwa_legitimate_government:0 "The Legitimate Government of China"
 wif_nwa_legitimate_government_desc:0 "Lanzhou still claims all of China, and says so in every broadcast and every embassy that will listen."
 wif_nwa_juntong:0 "Dai Li's Juntong"
 wif_nwa_juntong_desc:0 "The secret service follows the government west - and keeps its agents behind in every RNG city."
 wif_nwa_three_principles:0 "The Three Principles Restored"
 wif_nwa_three_principles_desc:0 "Lanzhou reminds the country that Wang Jingwei has stolen Sun Yat-sen's words."
 wif_nwa_new_life:0 "The New Life Movement Revived"
 wif_nwa_new_life_desc:0 "Discipline, cleanliness, obedience - and the army's portrait in every schoolroom."
 wif_nwa_national_assembly:0 "A National Assembly in Exile"
 wif_nwa_national_assembly_desc:0 "Delegates from every lost province - most of them refugees - meet in Lanzhou."
 wif_nwa_clean_house:0 "Clean House"
 wif_nwa_clean_house_desc:0 "Corruption lost China once. The worst grain hoarders and black marketeers are shot in public."
 wif_nwa_still_china:0 "We Are Still China"
 wif_nwa_still_china_desc:0 "Eight years after the surrender, the Republic still has a government, an army and a flag."
 wif_nwa_develop_northwest:0 "Develop the Northwest"
 wif_nwa_develop_northwest_desc:0 "The old dream of the Northwest Development plans, now the only plan there is."
 wif_nwa_lanzhou_arsenal:0 "The Lanzhou Arsenal"
 wif_nwa_lanzhou_arsenal_desc:0 "The arsenal machinery that made it out of Xi'an is set up again by the river."
 wif_nwa_refugee_workshops:0 "Refugee Workshops"
 wif_nwa_refugee_workshops_desc:0 "Engineers and craftsmen from Shanghai and Wuhan set up shop in Lanzhou's back streets."
 wif_nwa_yellow_river_power:0 "Power on the Yellow River"
 wif_nwa_yellow_river_power_desc:0 "A power station on the river for the arsenal and the city."
 wif_nwa_wool_hides:0 "Wool and Hides"
 wif_nwa_wool_hides_desc:0 "The Northwest's one great export - sold to whoever will buy."
 wif_nwa_gansu_xinjiang_road:0 "The Gansu-Xinjiang Highway"
 wif_nwa_gansu_xinjiang_road_desc:0 "The road west along the Hexi Corridor - the only road out that Japan does not watch."
 wif_nwa_yumen_oil:0 "Claim the Yumen Oilfield"
 wif_nwa_yumen_oil_desc:0 "China's only real oilfield is at Yumen, in the Ma clique's Jiuquan. We need it more than they do."
 wif_nwa_lanzhou_works:0 "The Lanzhou Works"
 wif_nwa_lanzhou_works_desc:0 "A machine works, a textile mill and a flour mill - the beginnings of an industry."
 wif_nwa_war_economy_nw:0 "A War Economy Without a War"
 wif_nwa_war_economy_nw_desc:0 "Everything is built for the day the army marches east."
 wif_nwa_arsenal_northwest:0 "The Arsenal of the Northwest"
 wif_nwa_arsenal_northwest_desc:0 "Lanzhou now makes its own rifles, mortars and shells."
 wif_nwa_central_army_remnants:0 "The Central Army's Remnants"
 wif_nwa_central_army_remnants_desc:0 "Whampoa officers, survivors of a dozen lost battles. They are the state."
 wif_nwa_first_army:0 "Hu Zongnan's First Army"
 wif_nwa_first_army_desc:0 "The best divisions are grouped as the First Army, under Hu's own command."
 wif_nwa_officers_every_province:0 "Officers from Every Lost Province"
 wif_nwa_officers_every_province_desc:0 "Men who made their way west alone, through RNG and Japanese lines."
 wif_nwa_end_the_retreat:0 "End the Retreat"
 wif_nwa_end_the_retreat_desc:0 "No more retreating. Not one more county."
 wif_nwa_gansu_cavalry:0 "Horsemen of Gansu"
 wif_nwa_gansu_cavalry_desc:0 "The plateau breeds horses and riders."
 wif_nwa_whampoa_west:0 "Whampoa in the West"
 wif_nwa_whampoa_west_desc:0 "A new military academy at Lanzhou, on the old Whampoa model."
 wif_nwa_fortify_corridor:0 "Fortify the Hexi Corridor"
 wif_nwa_fortify_corridor_desc:0 "Bunkers and gun lines on the passes - against the Ma, the Communists and the Japanese alike."
 wif_nwa_mountain_divisions:0 "Mountain Divisions"
 wif_nwa_mountain_divisions_desc:0 "Divisions trained for the hills between us and Yan'an."
 wif_nwa_army_of_return:0 "The Army of the Return"
 wif_nwa_army_of_return_desc:0 "The Northwestern Army Group is reorganised for one purpose: to go back."
 wif_nwa_ready_to_march:0 "Ready to March"
 wif_nwa_ready_to_march_desc:0 "The march orders are printed. Only the date is missing."
 wif_nwa_loyalists:0 "The Loyal and Patriotic Army"
 wif_nwa_loyalists_desc:0 "Behind RNG's lines, Nationalist officers still lead guerrilla bands in the name of the Republic."
 wif_nwa_officer_routes:0 "Officer Routes"
 wif_nwa_officer_routes_desc:0 "Safe roads for officers going east - and for those coming back."
 wif_nwa_silver_lines:0 "Silver Across the Lines"
 wif_nwa_silver_lines_desc:0 "Smuggled silver dollars buy more than rifles in RNG's starving towns."
 wif_nwa_win_league:0 "Win the Liberation League"
 wif_nwa_win_league_desc:0 "The League has no party. It should be ours."
 wif_nwa_saboteurs_mines:0 "Wreck Tokyo's Mines"
 wif_nwa_saboteurs_mines_desc:0 "Loyalist engineers know the mines of Daye and Jiangxi - many of them built them."
 wif_nwa_assassins:0 "Kill the Collaborators"
 wif_nwa_assassins_desc:0 "Juntong assassins hunt RNG ministers, Japanese advisers and labour bosses."
 wif_nwa_league_officers:0 "Officers for the League"
 wif_nwa_league_officers_desc:0 "Trained officers join the League's bands - and bring the Republic's flag with them."
 wif_nwa_loyalist_districts:0 "Loyalist Districts"
 wif_nwa_loyalist_districts_desc:0 "Mountain districts in Sichuan and Guizhou where the Republic's flag still flies at night."
 wif_nwa_free_officers:0 "Free the Prisoners"
 wif_nwa_free_officers_desc:0 "Nationalist soldiers sit in RNG's labour camps. Break them out."
 wif_nwa_league_ours:0 "The League Is Ours"
 wif_nwa_league_ours_desc:0 "Nationalist officers run the League's committees."
 wif_nwa_league_free:0 "A Free League"
 wif_nwa_league_free_desc:0 "Let the League be broad; just make sure it remembers who armed it."
 wif_nwa_one_republic:0 "One Republic Behind the Lines"
 wif_nwa_one_republic_desc:0 "From Sichuan to Hunan, the Republic has a shadow government waiting."
 wif_nwa_signal_east:0 "Waiting for the Signal"
 wif_nwa_signal_east_desc:0 "Orders to every Loyalist band: hold your strength for the day the army comes back."
 wif_nwa_neighbours:0 "Enemies on Every Side"
 wif_nwa_neighbours_desc:0 "The Ma clique wants its land back, the Communists sit at Yan'an, Japan and RNG hold everything east. The truce will not last for ever."
 wif_nwa_ma_question:0 "The Ma Question"
 wif_nwa_ma_question_desc:0 "The Ma clique lost three provinces to us. They will not forget."
 wif_nwa_buy_ma:0 "Buy Off the Ma"
 wif_nwa_buy_ma_desc:0 "Silver, titles and a share of the Yumen oil. Ma Bufang was a Nationalist general once."
 wif_nwa_break_ma:0 "Break the Ma Clique"
 wif_nwa_break_ma_desc:0 "The Ma clique is a feudal relic sitting on our oil. When the truce ends, we march."
 wif_nwa_yanan_question:0 "The Yan'an Question"
 wif_nwa_yanan_question_desc:0 "Hu Zongnan spent years blockading Yan'an. The Communists remember."
 wif_nwa_blockade_yanan:0 "Tighten the Blockade of Yan'an"
 wif_nwa_blockade_yanan_desc:0 "Not one bale of cotton, not one rifle into the Border Region."
 wif_nwa_united_front:0 "A New United Front"
 wif_nwa_united_front_desc:0 "Old enemies, one occupier. Lanzhou offers Yan'an a truce and a common cause."
 wif_nwa_xinjiang:0 "The Road to Xinjiang"
 wif_nwa_xinjiang_desc:0 "Beyond the Hexi Corridor lies Sheng Shicai's Xinjiang - and the roads to the outside world."
 wif_nwa_pressure_yanan:0 "Pressure on Yan'an"
 wif_nwa_pressure_yanan_desc:0 "Whether as rivals or partners, we keep our eyes on the Communists."
 wif_nwa_world_beyond:0 "Friends Beyond the Mountains"
 wif_nwa_world_beyond_desc:0 "A government no one recognises needs friends."
 wif_nwa_washington:0 "Appeal to Washington"
 wif_nwa_washington_desc:0 "The Republic's ambassador still has an office in Washington."
 wif_nwa_tibetan_road:0 "The Tibetan Road to India"
 wif_nwa_tibetan_road_desc:0 "Mule trains from British India through Lhasa and Chamdo."
 wif_nwa_stand_alone:0 "Stand Alone"
 wif_nwa_stand_alone_desc:0 "The Republic owes nothing to the foreigners who abandoned it."
 wif_nwa_recognised:0 "Recognised Somewhere"
 wif_nwa_recognised_desc:0 "Somewhere in the world, an embassy still flies our flag."
 wif_nwa_march_east:0 "The March Back East"
 wif_nwa_march_east_desc:0 "The banners are unrolled; the Northwestern Army Group turns to face the east."
 wif_rng_hollow_1:0 "Tokyo's Workshop"
 wif_rng_hollow_1_desc:0 "Everything goes to Tokyo. It works - until it doesn't."
 wif_rng_hollow_2:0 "Running on Credit"
 wif_rng_hollow_2_desc:0 "Everything goes to Tokyo. It works - until it doesn't."
 wif_rng_hollow_3:0 "Stripped Bare"
 wif_rng_hollow_3_desc:0 "Everything goes to Tokyo. It works - until it doesn't."
 wif_rng_hollow_4:0 "A Hollow Shell"
 wif_rng_hollow_4_desc:0 "Everything goes to Tokyo. It works - until it doesn't."
 wif_rng_hollow_5:0 "On the Brink"
 wif_rng_hollow_5_desc:0 "Everything goes to Tokyo. It works - until it doesn't."
 wif_rng_labour_1:0 "Labour Quotas"
 wif_rng_labour_1_desc:0 "Conscripted labour for Japan's mines, docks and fortresses."
 wif_rng_labour_2:0 "Labour Quotas"
 wif_rng_labour_2_desc:0 "Conscripted labour for Japan's mines, docks and fortresses."
 wif_rng_labour_3:0 "Labour Quotas"
 wif_rng_labour_3_desc:0 "Conscripted labour for Japan's mines, docks and fortresses."
 wif_jap_labour_1:0 "Chinese Labour"
 wif_jap_labour_1_desc:0 "Conscripted Chinese labour in our mines, docks and fortresses."
 wif_jap_labour_2:0 "Chinese Labour"
 wif_jap_labour_2_desc:0 "Conscripted Chinese labour in our mines, docks and fortresses."
 wif_jap_labour_3:0 "Chinese Labour"
 wif_jap_labour_3_desc:0 "Conscripted Chinese labour in our mines, docks and fortresses."
 wif_prc_blockade_1:0 "The Blockade"
 wif_prc_blockade_1_desc:0 "Japan and RNG to the east, the Northwestern Army to the west. Nothing gets through."
 wif_prc_blockade_2:0 "The Blockade"
 wif_prc_blockade_2_desc:0 "Japan and RNG to the east, the Northwestern Army to the west. Nothing gets through."
 wif_prc_blockade_3:0 "The Blockade"
 wif_prc_blockade_3_desc:0 "Japan and RNG to the east, the Northwestern Army to the west. Nothing gets through."
 wif_rng_reorganized_idea:0 "The Reorganized Government"
 wif_rng_reorganized_idea_desc:0 "A government of collaborators, ruling the interior in Tokyo's name."
 wif_rng_interior_idea:0 "Japan's Interior"
 wif_rng_interior_idea_desc:0 "An Imperial Associate of Japan. Its autonomy will never rise."
 wif_rng_three_principles_idea:0 "The Three Principles Reinterpreted"
 wif_rng_three_principles_idea_desc:0 "Sun Yat-sen, read Tokyo's way."
 wif_rng_cabinet_idea:0 "Wang Jingwei's Cabinet"
 wif_rng_cabinet_idea_desc:0 "Chen Gongbo at the Legislative Yuan, Zhou Fohai at Finance."
 wif_rng_youth_corps_idea:0 "The Youth Corps"
 wif_rng_youth_corps_idea_desc:0 "Uniformed youth for parades - and for informing."
 wif_rng_leash_idea:0 "A Leash, Not a Crown"
 wif_rng_leash_idea_desc:0 "The government accepts what it is."
 wif_rng_zhou_idea:0 "Zhou Fohai's Government"
 wif_rng_zhou_idea_desc:0 "The man who holds the purse holds the state."
 wif_rng_party_idea:0 "The Party Before All"
 wif_rng_party_idea_desc:0 "The Reorganized Kuomintang is the only path to office."
 wif_rng_loyal_idea:0 "Loyal Unto the End"
 wif_rng_loyal_idea_desc:0 "Whatever happens to Japan happens to us."
 wif_rng_advisers_idea:0 "Japanese Advisers"
 wif_rng_advisers_idea_desc:0 "A Japanese colonel beside every minister."
 wif_rng_garrison_idea:0 "The Garrison Agreement"
 wif_rng_garrison_idea_desc:0 "We pay for the Japanese garrisons."
 wif_rng_quiet_idea:0 "A Quiet List of Grievances"
 wif_rng_quiet_idea_desc:0 "Acknowledged and filed."
 wif_rng_concessions_idea:0 "The Concessions Returned"
 wif_rng_concessions_idea_desc:0 "On paper, at least."
 wif_rng_county_quotas_idea:0 "The Quota Boom"
 wif_rng_county_quotas_idea_desc:0 "For a while, the numbers look good."
 wif_rng_famine_idea:0 "The Henan Famine"
 wif_rng_famine_idea_desc:0 "Millions starve; the requisitions go on."
 wif_rng_factories_for_japan_idea:0 "Factories for Japan"
 wif_rng_factories_for_japan_idea_desc:0 "Our arsenals work for the Imperial Army."
 wif_rng_opium_idea:0 "The Opium Monopoly"
 wif_rng_opium_idea_desc:0 "The state sells opium openly."
 wif_rng_factory_guards_idea:0 "Factory Guards"
 wif_rng_factory_guards_idea_desc:0 "Guards are paid in goods."
 wif_rng_inflation_idea:0 "Runaway Inflation"
 wif_rng_inflation_idea_desc:0 "Banknotes are weighed, not counted."
 wif_rng_empire_economy_idea:0 "An Economy for the Empire"
 wif_rng_empire_economy_idea_desc:0 "Nothing is left to build with, and nobody is left to build."
 wif_rng_instructors_idea:0 "Japanese Instructors"
 wif_rng_instructors_idea_desc:0 "Japanese officers drill the new army."
 wif_rng_reliable_idea:0 "The Reliable Few"
 wif_rng_reliable_idea_desc:0 "A small army that will not desert."
 wif_rng_levies_idea:0 "Endless Levies"
 wif_rng_levies_idea_desc:0 "Numbers instead of loyalty."
 wif_rng_academy_idea:0 "The Central Military Academy"
 wif_rng_academy_idea_desc:0 "Loyalty to Wang - and to the Emperor."
 wif_rng_field_armies_idea:0 "Field Armies for the Emperor"
 wif_rng_field_armies_idea_desc:0 "Our divisions go wherever Japan needs them."
 wif_rng_pacification_idea:0 "Pacification Committees"
 wif_rng_pacification_idea_desc:0 "A committee, a police chief and a Japanese liaison in every county."
 wif_rng_engineers_idea:0 "Japanese Engineers"
 wif_rng_engineers_idea_desc:0 "Japanese engineers patch up what they can."
 wif_rng_rice_relief_idea:0 "Rice from Japan"
 wif_rng_rice_relief_idea_desc:0 "Shipments to stop the riots."
 wif_rng_sabotage_idea:0 "Railway Sabotage"
 wif_rng_sabotage_idea_desc:0 "The trains are not running."
 wif_rng_strike_idea:0 "Strikes in the Factories"
 wif_rng_strike_idea_desc:0 "The workers have downed tools."
 wif_rng_breakout_idea:0 "Camp Breakout"
 wif_rng_breakout_idea_desc:0 "The mines are short of hands."
 wif_jap_china_rice_idea:0 "Chinese Rice"
 wif_jap_china_rice_idea_desc:0 "The army eats first."
 wif_jap_china_dividend_1_idea:0 "The China Dividend"
 wif_jap_china_dividend_1_idea_desc:0 "Rice, iron, tungsten and labour from the Chinese interior."
 wif_jap_china_dividend_2_idea:0 "The China Dividend"
 wif_jap_china_dividend_2_idea_desc:0 "The returns from China are shrinking."
 wif_jap_china_burden_idea:0 "The China Burden"
 wif_jap_china_burden_idea_desc:0 "The colony that was meant to feed Japan now has to be fed."
 wif_jap_china_burden_hard_idea:0 "The China Burden"
 wif_jap_china_burden_hard_idea_desc:0 "Wuhan lied about its books. The bill has come due all at once."
 wif_jap_rice_shipments_idea:0 "Rice for Wuhan"
 wif_jap_rice_shipments_idea_desc:0 "Japanese rice goes back to China."
 wif_jap_bank_loan_idea:0 "The Yokohama Loan"
 wif_jap_bank_loan_idea_desc:0 "The Specie Bank props up Wuhan."
 wif_jap_quotas_idea:0 "Tightened Quotas"
 wif_jap_quotas_idea_desc:0 "More from China, whatever it costs China."
 wif_jap_mine_shortfall_idea:0 "Chinese Ore Shortfall"
 wif_jap_mine_shortfall_idea_desc:0 "A wrecked mine in China means an idle furnace in Japan."
 wif_jap_convoys_hit_idea:0 "Convoys Burned"
 wif_jap_convoys_hit_idea_desc:0 "Supply columns in China were ambushed."
 wif_prc_after_surrender_idea:0 "After the Surrender"
 wif_prc_after_surrender_idea_desc:0 "The war is lost. The Party is not."
 wif_prc_no_moscow_idea:0 "No Help from Moscow"
 wif_prc_no_moscow_idea_desc:0 "The Soviet Union is gone."
 wif_prc_rectification_idea:0 "The Rectification Movement"
 wif_prc_rectification_idea_desc:0 "Every cadre learns to think as the Chairman thinks."
 wif_prc_rectification_strain_idea:0 "Self-Criticism"
 wif_prc_rectification_strain_idea_desc:0 "Study sessions late into the night."
 wif_prc_mass_line_idea:0 "The Mass Line"
 wif_prc_mass_line_idea_desc:0 "From the masses, to the masses."
 wif_prc_rescue_idea:0 "The Rescue Campaign"
 wif_prc_rescue_idea_desc:0 "Kang Sheng finds spies everywhere."
 wif_prc_rescue_fear_idea:0 "Forced Confessions"
 wif_prc_rescue_fear_idea_desc:0 "Nobody in Yan'an sleeps well."
 wif_prc_persuasion_idea:0 "Rectification by Persuasion"
 wif_prc_persuasion_idea_desc:0 "A softer line, a slower Party."
 wif_prc_rent_idea:0 "Rent and Interest Reduction"
 wif_prc_rent_idea_desc:0 "The peasants notice who made the landlords cut the rent."
 wif_prc_kangda_idea:0 "Cadre Schools"
 wif_prc_kangda_idea_desc:0 "Students from the occupied cities become cadres."
 wif_prc_wang_shiwei_idea:0 "Wild Lilies"
 wif_prc_wang_shiwei_idea_desc:0 "Every intellectual in Yan'an knows the name Wang Shiwei."
 wif_prc_land_idea:0 "Land to the Tiller"
 wif_prc_land_idea_desc:0 "The landlords' land is divided."
 wif_prc_seventh_congress_idea:0 "Mao Zedong Thought"
 wif_prc_seventh_congress_idea_desc:0 "Written into the Party constitution."
 wif_prc_liu_idea:0 "Liu Shaoqi's Organisation"
 wif_prc_liu_idea_desc:0 "A cadre system ready to run a country."
