 # === Non-aligned sub-ideologies ====================================
 # The neutrality group's modifiers = { } is empty now, so its tooltip no
 # longer prints a list. These four keep vanilla's exact statistics, via
 # dynamic modifiers, and restate them here so nothing is lost on screen.
 anarchism_desc:0 "Anarchism is the rejection of authority itself, promoting the division of society into self-managing and self-governing collectives instead of a singular, centralized state.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 moderatism_desc:0 "Moderatism is a form of government which avoids the extremes of left and right by taking a moderate position or course of action.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 centrism_desc:0 "Centrism is a form of government which wants to achieve common sense solutions that appropriately address current and future needs, that support the public trust and serve the common good with consideration of risk and capacity in context of these needs.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 japan_militarism_ideology_desc:0 "Militarism is an ideology in which the leader of the nation holds only nominal control, and acts more like a puppet to the nation's military than an independent politician, constantly forwarding their agenda with the end goal of rapid expansionist policy.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 despotism_desc:0 "Despotism is a form of government in which a single person rules with absolute power.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 oligarchism_desc:0 "Oligarchy is a form of government in which a group of people rule with absolute power.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +50.0%§!\n §GJoin faction tension limit: +40.0%§!\n §GLend-lease tension limit: +60.0%§!\n §GSend volunteers tension limit: +40.0%§!\n §GGuarantee tension limit: +40.0%§!\n §RIdeology drift defense: -30.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
