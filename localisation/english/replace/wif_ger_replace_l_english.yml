l_english:
 # localisation/english/replace/ is HoI4's forced-override folder: keys here
 # beat the base game's whatever the file ordering works out to. The rename
 # below sat in wif_ger_l_english.yml and lost to vanilla's focus_l_english
 # anyway, with nothing else in the playset defining the key and no error in
 # the log. This is the one place the engine guarantees.
 GER_crossing_the_atlantic:0 "Force the Americans to see Reason"
 GER_crossing_the_atlantic_desc:0 "Britain has fallen and France with her. The Atlantic is a moat, not a road, and no army of ours will march on Washington. But the Americans are practical people, and a war fought for allies who no longer exist is a war fought for nothing. Let us put terms to them and see whether reason prevails."

 # === The three monarchies ==========================================
 wif_regential_monarchism:0 "Regential Monarchism"
 wif_regential_monarchism_desc:0 "A throne held in trust. The crown exists, the succession is disputed or the heir is unfit, and a regent rules in a king's name until a question nobody wants to answer is finally answered.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +25.0%§!\n §GJoin faction tension limit: +20.0%§!\n §GLend-lease tension limit: +25.0%§!\n §GSend volunteers tension limit: +25.0%§!\n §GGuarantee tension limit: +20.0%§!\n §GIdeology drift defense: +10.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 wif_absolute_monarchism:0 "Absolute Monarchism"
 wif_absolute_monarchism_desc:0 "The monarch rules as well as reigns. There is no assembly that can gainsay him, and no election that could produce one.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +25.0%§!\n §GJoin faction tension limit: +20.0%§!\n §GLend-lease tension limit: +25.0%§!\n §GSend volunteers tension limit: +25.0%§!\n §GGuarantee tension limit: +20.0%§!\n §GIdeology drift defense: +10.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"
 wif_semi_constitutional_monarchy:0 "Semi-Constitutional Monarchy"
 wif_semi_constitutional_monarchy_desc:0 "The crown keeps the army, the appointments and the last word; the country keeps its ballot papers. Both sides call the arrangement temporary and neither is in a hurry to end it.\n\n§YThis form of rule means:§!\n §GGenerate war goal tension limit: +25.0%§!\n §GJoin faction tension limit: +20.0%§!\n §GLend-lease tension limit: +25.0%§!\n §GSend volunteers tension limit: +25.0%§!\n §GGuarantee tension limit: +20.0%§!\n §GIdeology drift defense: +10.0%§!\n §RCivilian intelligence to others: +20.0%§!\n §RArmy intelligence to others: +10.0%§!\n §RNavy intelligence to others: +20.0%§!\n §RAir Force intelligence to others: +10.0%§!"

 # === Non-Aligned renamed to Authoritarian / Authoritarianism ========
 # Vanilla's pattern is adjective / noun: communism "Communist" and
 # communism_noun "Communism". neutrality took the same shape.
