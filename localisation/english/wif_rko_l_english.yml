 wif_rko_depop_94_2_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Pinsk. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_95:0 "Depopulate Baranovichi"
 wif_rko_depop_95_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Baranovichi. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_95_2:0 "Depopulate Baranovichi Again"
 wif_rko_depop_95_2_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Baranovichi. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_96:0 "Depopulate Molodechno"
 wif_rko_depop_96_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Molodechno. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_96_2:0 "Depopulate Molodechno Again"
 wif_rko_depop_96_2_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Molodechno. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_tt:0 "Over the next §Y120§! days the state loses §R25%§! of its people, in four monthly steps. The next Belarusian partisan raid comes §R15 days sooner§!."
 wif_rko_deliver_quota:0 "Deliver the Ostland Quota"
 wif_rko_deliver_quota_desc:0 "Grain, timber and oil-shale fuel, loaded for the Reich before anyone here is fed."
 wif_rko_forest_sweep:0 "Forest Sweep"
 wif_rko_forest_sweep_desc:0 "Police battalions comb the woods of Estonia, Latvia and Lithuania for the Forest Brothers."
 wif_rko_sweep_tt:0 "After §Y30§! days: Forest Brothers' Strength §G-5§! or §G-10§! (more with Jagdkommandos and The Forests Never Empty)."
 wif_rko_take_hostages:0 "Take Hostages"
 wif_rko_take_hostages_desc:0 "Ten villagers for every German shot. It works - for a while."
 wif_rko_hostages_tt:0 "Forest Brothers' Strength §G-5§! now - and they grow §R0.25§! a month faster, for good."
 wif_arm_belarusian_partisans:0 "Arm the Belarusian Partisans"
 wif_arm_belarusian_partisans_desc:0 "7,000 rifles go west, to the brigades in the Belarusian marshes. The next raid on the Ostland comes in half the time."
 wif_arm_belarusian_partisans_tt:0 "§YThe time until Reichskommissariat Ostland's next Belarusian raid is halved§!"
 wif_swe_rifles_to_saaremaa:0 "Send 1800 Rifles to Saaremaa"
 wif_swe_rifles_to_saaremaa_desc:0 "Since the Germans won, Sweden has lived in fear, appeasing Berlin at every turn. Now the Ostland is burning, and an Estonian resistance on Saaremaa needs only rifles. A fishing fleet can carry 1800 of them across the Baltic in a night."
 wif_swe_rifles_tt:0 "§YSaaremaa§! rises as the §YEstonian Liberation Front§!: democratic, three fully equipped infantry divisions, at war with Ostland.\nIf Ostland falls while it stands, it also takes §YTallinn§! and becomes a §Ysupervised state§! of ours. The Reich will not forget."
 wif_rko_chase_terrorists:0 "Chase the Terrorists"
 wif_rko_ostland_category:0 "The Ostland"
 wif_rko_ostland_category_desc:0 "Germanisation: §Y[?ROOT.wif_rko_germ|0]§!/100 (25: building slots in cored states, 50: Aukschtaiten, 60: Reichsgau Ostland, 80: A German Land).\nForest Brothers' Strength: §R[?ROOT.wif_rko_fs|0]§!/100, growing [?ROOT.wif_rko_fs_rate|1] a month. Each month they strike with a chance of half their Strength: ambushes (10), rail sabotage (25), settler villages (40), Estonian risings (55), liberated districts (70), a coordinated rising (90).\nNext Belarusian partisan raid in §R[?ROOT.wif_rko_terror_days|0]§! days."
 wif_swe_baltic_category:0 "The Baltic Question"
 wif_swe_baltic_category_desc:0 "Across the water, the Ostland is burning."
 wif_rko.25.t:0 "Complete Success"
 wif_rko.25.desc:0 "Our forces achieved a decisive victory against the partisans in [event_target:partisan_state.GetName]. The terrorist cell has been completely destroyed, the region is stabilised, and the next attack has been significantly delayed."
 wif_rko.25.a:0 "Excellent work!"
 wif_rko.26.t:0 "The Terrorists Got Away But Region Stabilised"
 wif_rko.26.desc:0 "Our forces swept through [event_target:partisan_state.GetName] and restored order, but the partisan leaders managed to escape into the countryside. The region is stable for now, though the threat remains."
 wif_rko.26.a:0 "At least the region is secure."
 wif_rko.27.t:0 "Harsh Battle"
 wif_rko.27.desc:0 "The operation in [event_target:partisan_state.GetName] turned into a brutal engagement. We took significant casualties but managed to clear the area. The region is stabilised, though at great cost."
 wif_rko.27.a:0 "A pyrrhic victory."
 wif_rko.28.t:0 "Failed to Pursue"
 wif_rko.28.desc:0 "Our forces deployed to [event_target:partisan_state.GetName] but failed to locate the partisan cells. The terrorists remain at large and the region continues to suffer from their presence."
 wif_rko.28.a:0 "They will not escape forever."
 wif_rko.29.t:0 "Forces Routed"
 wif_rko.29.desc:0 "The operation in [event_target:partisan_state.GetName] was a disaster. Our forces walked into an ambush and were routed by the partisans. The terrorists are now emboldened and their grip on the region has tightened considerably."
 wif_rko.29.a:0 "This is humiliating."
 wif_rko.30.t:0 "Total Defeat"
 wif_rko.30.desc:0 "Catastrophe in [event_target:partisan_state.GetName]. Our entire force was annihilated by a well-coordinated partisan offensive. None of the 10,000 men returned. The region has been lost to the terrorists, who have declared it a liberated zone. Emboldened partisans across the Reichskommissariat are accelerating their attacks."
 wif_rko.30.a:0 "God help us..."
 wif_rko.31.t:0 "Demilitarization Lifted"
 wif_rko.31.desc:0 "The demilitarized zone has been lifted. Our forces can once again operate in the formerly contested area."
 wif_rko.31.a:0 "Resume operations."
 wif_rko.20.t:0 "Belarusian Partisan Raid"
 wif_rko.20.desc:0 "On [GetDateText], a Belarusian partisan brigade struck in [terror_attack_state.GetName]. Railway lines and factories were blown up, and garrison troops and civilians killed."
 wif_rko.20.a:0 "Burn them out."
 wif_rko.3.t:0 "The Settler Villages"
 wif_rko.3.desc:0 "German villages now stand along the Baltic coast - new farmhouses, a school, a church, a watchtower. More land can be built on."
 wif_rko.3.a:0 "The coast is changing."
 wif_rko.4.t:0 "A German Land"
 wif_rko.4.desc:0 "In the cored states of the Ostland, German is the language of the street, the office and the school. The settlers are no longer newcomers. Berlin is pleased."
 wif_rko.4.a:0 "As it was always meant to be."
 wif_rko.11.t:0 "Ambush in the Forest"
 wif_rko.11.desc:0 "The Forest Brothers ambushed a German patrol on a forest road in [wif_rko_fs_state.GetName]. The men were found the next morning."
 wif_rko.11.a:0 "Comb the woods."
 wif_rko.12.t:0 "The Railway Cut"
 wif_rko.12.desc:0 "A railway bridge in [wif_rko_fs_state.GetName] was blown in the night. The Forest Brothers left a note in three languages."
 wif_rko.12.a:0 "Repair it."
 wif_rko.13.t:0 "A Settler Village Burns"
 wif_rko.13.desc:0 "The Forest Brothers attacked a German settler village in [wif_rko_fs_state.GetName] and burned the farms. The families are fleeing back to the towns."
 wif_rko.13.a:0 "They will be avenged."
 wif_rko.14.t:0 "Estonia in the Forests"
 wif_rko.14.desc:0 "Whole Estonian parishes have gone to the woods. The metsavennad hold the roads by night across the country."
 wif_rko.14.a:0 "Estonia will be broken."
 wif_rko.15.t:0 "A Liberated District"
 wif_rko.15.desc:0 "In [wif_rko_fs_state.GetName], the Forest Brothers hold the villages by day as well as by night. German officials no longer go there."
 wif_rko.15.a:0 "For now."
 wif_rko.16.t:0 "The Baltic Rises Together"
 wif_rko.16.desc:0 "Estonian, Latvian and Lithuanian Forest Brothers struck on the same night across the Ostland. Men of the Baltic Legions deserted with their rifles to join them."
 wif_rko.16.a:0 "This is war."
 wif_rko.40.t:0 "The Ostland Rises"
 wif_rko.40.desc:0 "With the SME's army on the road to Riga, the Ostland is coming apart. In the Estonian and Lithuanian forests the Forest Brothers have proclaimed a Council of Brothers, and the Belarusian partisan brigades have come out of the marshes to take Minsk."
 wif_rko.40.a:0 "The forests have come alive."
 wif_rko.41.t:0 "The Reichskommissariat Ostland Falls"
 wif_rko.41.desc:0 "Reichskommissariat Ostland has capitulated. The Council of Brothers takes the Baltic lands as the Baltic Union, and Belarus is in the hands of its partisans."
 wif_rko.41.a:0 "The Baltic is free."
 wif_rko.45.t:0 "The Reichskommissariat Returns"
 wif_rko.45.desc:0 "There will be no peace conference. The reunited Reich has crushed the rising and handed its land straight back to a re-established Reichskommissariat Ostland."
 wif_rko.45.a:0 "Order is restored."
 wif_rko.50.t:0 "Swedish Rifles on Saaremaa"
 wif_rko.50.desc:0 "Sweden, for years the most careful of the Reich's neighbours, has smuggled 1800 rifles across the Baltic. Saaremaa has risen as the Estonian Liberation Front."
 wif_rko.50.a:0 "Sweden has chosen."
 wif_rko.60.t:0 "An Ultimatum from Berlin"
 wif_rko.60.desc:0 "The Reich is whole again, and it has turned east. Berlin demands that we hand back the Estonian land we \"liberated\" to a re-established Reichskommissariat Ostland - or face the Wehrmacht."
 wif_rko.60.a:0 "We cannot fight the Reich. Give it back."
 wif_rko.60.a_tt:0 "Our Estonia goes back to a re-established §YReichskommissariat Ostland§!."
 wif_rko.60.b:0 "Never again. Sweden will fight."
 wif_rko.60.b_tt:0 "§RGermany declares war on us.§! The war ends the day Swedish Estonia capitulates - and Estonia then goes back to the Ostland."
 wif_rko.61.t:0 "Sweden Gives Estonia Back"
 wif_rko.61.desc:0 "Faced with the reunited Reich, Sweden has abandoned the Estonian Liberation Front. The Reichskommissariat returns to Tallinn."
 wif_rko.61.a:0 "Sweden bends again."
 wif_rko.62.t:0 "Swedish Estonia Falls"
 wif_rko.62.desc:0 "The Estonian Liberation Front has capitulated. Germany and Sweden have made peace, and Estonia goes back to the Reichskommissariat Ostland."
 wif_rko.62.a:0 "It was brave while it lasted."
 wif_rko.63.t:0 "Sweden Defies the Reich"
 wif_rko.63.desc:0 "Sweden has refused to hand back Estonia. The Wehrmacht is moving on Tallinn and the Swedish coast is preparing for war."
 wif_rko.63.a:0 "The Baltic is at war."
 wif_rko.70.t:0 "The Reich Turns East"
 wif_rko.70.desc:0 "Moskowien and Kaukasien fell while the Reich fought itself. Now the Reich is whole again, and with Ostland and Ukraine behind it, it has declared war on the SME to take Moscow back."
 wif_rko.70.a:0 "To Moscow."
 wif_rko.71.t:0 "Moscow Retaken"
 wif_rko.71.desc:0 "German troops are in Moscow again. The SME has made peace, Reichskommissariat Moskowien and Reichskommissariat Kaukasien are re-established - and the SME, beaten a second time, is falling apart."
 wif_rko.71.a:0 "The East is ours again."
 wif_rko.72.t:0 "The Reich Makes Peace with the SME"
 wif_rko.72.desc:0 "Ostland and Ukraine have fallen to the SME. The Reich has made peace and abandoned the East."
 wif_rko.72.a:0 "The East is lost."
