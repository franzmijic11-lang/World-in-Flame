 wif_rko_vef:0 "VEF Riga"
 wif_rko_attack_partisan_activity:0 "Attack partisan activity in [FROM.GetName]"
 wif_rko_attack_partisan_activity_desc:0 "Belarusian partisans have struck in [FROM.GetName]. We shall deploy 10,000 men to hunt them down and restore order. The outcome is uncertain."
 wif_rko_deploy_mechanised_forces:0 "Deploy the Mechanised Forces in [FROM.GetName]"
 wif_rko_deploy_mechanised_forces_desc:0 "Belarusian partisans have struck in [FROM.GetName]. We shall deploy mechanised police forces to hunt them down. This requires §R10,000 Manpower§! and §R500 Mechanised Equipment§!, but our armoured troops are far more effective at eliminating partisan cells."
 wif_rko_police_offensive:0 "Police Offensive in [FROM.GetName]"
 wif_rko_police_offensive_desc:0 "Belarusian partisans have struck in [FROM.GetName]. Under the Higher SS and Police Leader, we shall deploy a combined-arms force with armoured support to hunt them down. This requires §R10,000 Manpower§!, §R200 Support Equipment§!, and §R10 Medium Tanks§!."
