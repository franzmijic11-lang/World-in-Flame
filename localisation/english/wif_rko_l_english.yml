l_english:
 wif_rko_root:0 "Reichskommissariat Ostland"
 wif_rko_root_desc:0 "The Soviet Union has surrendered. From Riga Castle, Reichskommissar Hinrich Lohse rules the four Generalbezirke of the Ostland: Estland, Lettland, Litauen and Weissruthenien. Unlike the Ukraine, the Ostland is not only to be bled: Rosenberg's and Himmler's plans both call for its Baltic coast to become German land, a future Reichsgau settled by Germans and by those Balts judged 'racially valuable'."
 wif_rko_riga_castle:0 "Lohse in Riga Castle"
 wif_rko_riga_castle_desc:0 "Hinrich Lohse, Gauleiter of Schleswig-Holstein, moves his court into the castle of the Livonian Order."
 wif_rko_generalbezirke:0 "The Four Generalbezirke"
 wif_rko_generalbezirke_desc:0 "Estland, Lettland, Litauen and Weissruthenien each get a Generalkommissar, and each Generalkommissar his own fiefdom."
 wif_rko_civil_administration:0 "The Civil Administration"
 wif_rko_civil_administration_desc:0 "Lohse rules through his own officials and Rosenberg's Ostministerium: paperwork, quotas and slow Germanisation."
 wif_rko_jeckeln_ss:0 "Jeckeln's SS"
 wif_rko_jeckeln_ss_desc:0 "The Higher SS and Police Leader Friedrich Jeckeln, the man of Rumbula, takes the Ostland out of Lohse's hands. Lohse is recalled to Kiel; Jeckeln becomes Reichskommissar."
 wif_rko_answer_ostministerium:0 "Quotas from Berlin"
 wif_rko_answer_ostministerium_desc:0 "Grain, timber, oil and labour: the Ostland's quotas are set in Berlin and the Reichskommissar is judged by them."
 wif_rko_first_among:0 "First Among the Reichskommissariate"
 wif_rko_first_among_desc:0 "Riga, not Rowno or Moskau, is the senior seat in the East. If contact with Germania is ever lost, the other Reichskommissariate will look to Lohse."
 wif_rko_racial_survey:0 "The Racial Survey"
 wif_rko_racial_survey_desc:0 "SS race examiners go village to village through Latvia and Lithuania, sorting families into 'Germanisable' and 'undesirable'. Estonia is surveyed too: the answer there is already decided."
 wif_rko_baltic_germans_return:0 "Return of the Baltic Germans"
 wif_rko_baltic_germans_return_desc:0 "In 1939 the Baltic Germans were 'called home' and resettled in the Warthegau. Now they are sent back, to the manors and town houses of their grandfathers."
 wif_rko_land_bank:0 "The Ostland Land Society"
 wif_rko_land_bank_desc:0 "The farms the Soviets nationalised are not returned to their owners: the Landbewirtschaftungsgesellschaft Ostland keeps them for German settlers."
 wif_rko_courland:0 "The Duchy of Courland"
 wif_rko_courland_desc:0 "Kurzeme was the Duchy of Courland, ruled by German barons for seven centuries. Libau and Windau get German harbour masters again."
 wif_rko_riga_hansestadt:0 "Riga, Hansestadt"
 wif_rko_riga_hansestadt_desc:0 "The Hanseatic city is to become German again: German schools, German street names, German shops in the old town."
 wif_rko_sudauen:0 "Sudauen"
 wif_rko_sudauen_desc:0 "Suduva borders East Prussia and was long marked for annexation to it. Its farmland goes to settlers from Ostpreussen."
 wif_rko_schamaiten:0 "Schamaiten"
 wif_rko_schamaiten_desc:0 "Zemaitija lies behind the Memelland. Settlers from the Memel and East Prussia take the confiscated farms."
 wif_rko_baltic_question:0 "The Baltic Question"
 wif_rko_baltic_question_desc:0 "The coast is being settled. What to do with the millions of Latvians and Lithuanians who remain? Berlin's experts disagree, and the Reichskommissar must choose."
 wif_rko_eindeutschung:0 "Eindeutschung"
 wif_rko_eindeutschung_desc:0 "Only those who pass the racial survey may stay. The rest - most Lithuanians, half the Latvians - are to be moved east, to Weissruthenien and beyond."
 wif_rko_intelligentsia:0 "Deport the Intelligentsia"
 wif_rko_intelligentsia_desc:0 "Teachers, priests, officers and former ministers are put on trains east."
 wif_rko_wehrbauern:0 "Wehrbauern on the Coast"
 wif_rko_wehrbauern_desc:0 "Soldier-farmers, armed and organised in villages along the coast, from Memel to the Gulf of Riga."
 wif_rko_german_coast:0 "A German Baltic Coast"
 wif_rko_german_coast_desc:0 "From Memel to Riga the coast is meant to look like Pomerania: German villages, German harbours, German churches."
 wif_rko_germanisable_peoples:0 "The Germanisable Peoples"
 wif_rko_germanisable_peoples_desc:0 "Latvians and Lithuanians are declared Germanisable over a generation: schools in German, marriage allowed, service rewarded. The Estonians are not part of this: they are to be ruled, never joined."
 wif_rko_self_administrations:0 "The Native Self-Administrations"
 wif_rko_self_administrations_desc:0 "The Latvian and Lithuanian 'Landeseigene Verwaltungen' keep their directors-general, under German supervision."
 wif_rko_baltic_legions:0 "The Baltic Legions"
 wif_rko_baltic_legions_desc:0 "Latvian and Lithuanian volunteers in German uniform: the reward is citizenship for their sons."
 wif_rko_kauen:0 "Kauen"
 wif_rko_kauen_desc:0 "The old Lithuanian capital, with its university and its fortress. If it is quiet enough, it may be absorbed."
 wif_rko_semgallen:0 "Semgallen"
 wif_rko_semgallen_desc:0 "A small, rich farming land between Riga and the Lithuanian border, once part of the Duchy."
 wif_rko_aukschtaiten:0 "Aukschtaiten"
 wif_rko_aukschtaiten_desc:0 "The Lithuanian highlands, the heart of Lithuanian identity. Absorbing them is the furthest the lenient path can go - perhaps."
 wif_rko_livland:0 "Livland"
 wif_rko_livland_desc:0 "Vidzeme, the old Livonia of the Sword Brothers: coastal, and Latvian. If its people can be won, it joins the German coast."
 wif_rko_wilna:0 "Wilna"
 wif_rko_wilna_desc:0 "Vilnius: claimed by Lithuania, Polish by population, and the 'Jerusalem of the North' until 1941. Taking it in completes Lithuania."
 wif_rko_reichsgau_ostland:0 "Reichsgau Ostland"
 wif_rko_reichsgau_ostland_desc:0 "The goal of the Reichskommissariat: a Baltic land ready to join the Reich as a Reichsgau, German by blood and language. Weissruthenien and Estonia will never be part of it."
 wif_rko_weissruthenien:0 "Generalbezirk Weissruthenien"
 wif_rko_weissruthenien_desc:0 "Minsk and the Belarusian lands: Slavs, in Nazi ideology, to be worked, starved and removed. There is no other policy here."
 wif_rko_maly_trostenets:0 "Maly Trostenets"
 wif_rko_maly_trostenets_desc:0 "The extermination camp outside Minsk, where Jews from Minsk, Vienna, Prague and the Reich were shot and gassed, and where captured partisans and their families are still killed."
 wif_rko_labour_levies:0 "The Labour Levies"
 wif_rko_labour_levies_desc:0 "Every Belarusian village must send its quota of young men and women to the Reich as Ostarbeiter."
 wif_rko_burned_villages:0 "The Burned Villages"
 wif_rko_burned_villages_desc:0 "Anti-partisan operations in the style of Cottbus and Hermann: villages like Khatyn are burned with their people inside."
 wif_rko_pripet_drainage:0 "Draining the Pripet"
 wif_rko_pripet_drainage_desc:0 "Hitler's plan to drain the Pripet marshes for German farmland, dug by forced labour."
 wif_rko_latgale_slav:0 "Latgale Is Slav Land"
 wif_rko_latgale_slav_desc:0 "Latgale's Latgalians, Russians and Belarusians are classed with the Slavs. Its farms go to the Land Society."
 wif_rko_labour_reservation:0 "The Labour Reservation"
 wif_rko_labour_reservation_desc:0 "Weissruthenien is never to be settled: it is the Ostland's reservoir of labour, timber and peat."
 wif_rko_generalplan_ost:0 "Generalplan Ost"
 wif_rko_generalplan_ost_desc:0 "The SS plan for the East foresaw removing three quarters of the Belarusians - by starvation, deportation and murder - and leaving the rest as a labour pool. The Reichskommissariat begins with the cities."
 wif_rko_hunger_rations:0 "Hunger Rations"
 wif_rko_hunger_rations_desc:0 "City dwellers are 'useless eaters': their ration cards are cut below what keeps a person alive, and the food goes west."
 wif_rko_deportation_trains:0 "Deportation Trains"
 wif_rko_deportation_trains_desc:0 "Freight trains leave Minsk station every week, east to the Moskowien labour camps. Few come back."
 wif_rko_emptied_land:0 "The Emptied Land"
 wif_rko_emptied_land_desc:0 "The cities are half empty. Grass grows in the streets of Bobruysk."
 wif_rko_wirtschaftsstab:0 "Wirtschaftsstab Ostland"
 wif_rko_wirtschaftsstab_desc:0 "The economic staff takes over the Soviet trusts, now run by German companies under licence."
 wif_rko_baltol:0 "Baltol"
 wif_rko_baltol_desc:0 "The oil shale of Kohtla-Jarve in Virumaa: the Baltische Ol GmbH builds retorts and a refinery."
 wif_rko_vef_riga:0 "VEF Riga"
 wif_rko_vef_riga_desc:0 "Valsts Elektrotehniska Fabrika: radios, telephones and the Minox camera, now for the Wehrmacht."
 wif_rko_ostland_faser:0 "Ostland-Faser"
 wif_rko_ostland_faser_desc:0 "Flax and linen from Lithuanian and Latvian farms, spun in Kaunas and Siauliai."
 wif_rko_ports:0 "The Ports of Ostland"
 wif_rko_ports_desc:0 "Libau, Windau, Riga and Reval: the Kriegsmarine's eastern harbours."
 wif_rko_narva_power:0 "Narva Power"
 wif_rko_narva_power_desc:0 "Oil-shale power stations and the Narva falls light the cities."
 wif_rko_ostland_arms:0 "Ostland Arms Works"
 wif_rko_ostland_arms_desc:0 "The factories make shells, rifles and spare parts for the Ostfront's garrisons."
 wif_rko_baltic_shipyards:0 "The Baltic Shipyards"
 wif_rko_baltic_shipyards_desc:0 "The Tosmare yard in Libau and the Riga yards repair U-boats and build minesweepers."
 wif_rko_peat_timber:0 "Peat and Timber"
 wif_rko_peat_timber_desc:0 "The Belarusian forests and bogs are cut and dug by forced labour."
 wif_rko_rails_koenigsberg:0 "Rails to Konigsberg"
 wif_rko_rails_koenigsberg_desc:0 "The Soviet broad gauge is relaid to standard gauge, west to East Prussia."
 wif_rko_industrial_zone:0 "The Ostland Industrial Zone"
 wif_rko_industrial_zone_desc:0 "The Baltic coast is to be an extension of the Reich's own industry, not a colony."
 wif_rko_schutzmannschaft:0 "The Schutzmannschaften"
 wif_rko_schutzmannschaft_desc:0 "Latvian and Lithuanian police battalions, and the Belarusian auxiliary police."
 wif_rko_ostland_line:0 "The Ostland Line"
 wif_rko_ostland_line_desc:0 "Bunkers along the Narva, the Lake Peipus shore and the Daugava, built against an enemy that might one day come from the east."
 wif_rko_ostschild_command:0 "Ostschild Command"
 wif_rko_ostschild_command_desc:0 "Staff officers in Riga plan for the day the Reichskommissariate must defend themselves."
 wif_rko_selbstschutz:0 "The Selbstschutz"
 wif_rko_selbstschutz_desc:0 "Armed settler militias and police regiments: the most Ostland can raise."
 wif_rko_forest_war:0 "The Forest War"
 wif_rko_forest_war_desc:0 "Two enemies: the Forest Brothers in the Baltic woods, and the Belarusian partisan brigades in the marshes."
 wif_rko_jagdkommandos:0 "Jagdkommandos"
 wif_rko_jagdkommandos_desc:0 "Small hunter teams that live in the forest like the partisans do."
 wif_rko_informers:0 "Village Informers"
 wif_rko_informers_desc:0 "Paid informers in every parish - and every informer a target."
 wif_rko_hostage_laws:0 "The Hostage Laws"
 wif_rko_hostage_laws_desc:0 "For every German killed, a hundred hostages are shot."
 wif_rko_forest_amnesty:0 "Amnesty for the Forests"
 wif_rko_forest_amnesty_desc:0 "Men who come out of the forest and hand in their rifles are pardoned and sent home. (Germanisable Peoples path only.)"
 wif_rko_partisan_zones:0 "Bandenkampfgebiete"
 wif_rko_partisan_zones_desc:0 "Whole districts of Belarus are declared 'partisan zones': everyone in them is an enemy."
 wif_rko_forest_never_ends:0 "The Forests Never Empty"
 wif_rko_forest_never_ends_desc:0 "Every sweep finds burned camps and fresh graves. The forests stay theirs."
 wif_rko_administration_idea:0 "The Ostland Administration"
 wif_rko_administration_idea_desc:0 "Four Generalkommissare, a Reichskommissar in Riga, and Rosenberg in Berlin."
 wif_rko_hierarchy_idea:0 "Rosenberg's Racial Hierarchy"
 wif_rko_hierarchy_idea_desc:0 "Balts may be Germanised. Slavs may not."
 wif_rko_bureaucracy_idea:0 "Lohse's Bureaucracy"
 wif_rko_bureaucracy_idea_desc:0 "Forms, quotas, and slow Germanisation."
 wif_rko_ss_rule_idea:0 "SS Rule"
 wif_rko_ss_rule_idea_desc:0 "The man of Rumbula governs the Ostland."
 wif_rko_selfadmin_idea:0 "The Native Self-Administrations"
 wif_rko_selfadmin_idea_desc:0 "Latvian and Lithuanian directors-general, under German supervision."
 wif_rko_germanic_province_idea:0 "A Germanic Province"
 wif_rko_germanic_province_idea_desc:0 "The Baltic coast is German land."
 wif_rko_german_land_idea:0 "A German Land"
 wif_rko_german_land_idea_desc:0 "The settlers are no longer newcomers."
 wif_rko_starving_cities_idea:0 "Starving Cities"
 wif_rko_starving_cities_idea_desc:0 "The ration cards of Minsk do not keep a person alive."
 wif_rko_industrial_zone_idea:0 "The Ostland Industrial Zone"
 wif_rko_industrial_zone_idea_desc:0 "An extension of the Reich's own industry."
 wif_rko_staff_idea:0 "Ostschild Command"
 wif_rko_staff_idea_desc:0 "Staff officers in Riga plan for the day the East must defend itself."
 wif_rko_ostschild_org_idea:0 "First Among the Reichskommissariate"
 wif_rko_ostschild_org_idea_desc:0 "Riga leads the East."
 wif_rko_ostschild_def_idea:0 "Ostschild Command"
 wif_rko_ostschild_def_idea_desc:0 "The plans drawn up in Riga."
 wif_fbr_forest_war_idea:0 "The Forest War"
 wif_fbr_forest_war_idea_desc:0 "They live in the forest, eat from the farms, and are never where the Germans look. Cut off, they fight on."
 wif_rko_ostarbeiter_idea:0 "Ostarbeiter from Weissruthenien"
 wif_rko_ostarbeiter_idea_desc:0 "Belarusian labour on German building sites."
 wif_rko_rations_idea:0 "Food from the Ostland"
 wif_rko_rations_idea_desc:0 "Minsk's rations, in Berlin's shops."
 wif_rko_quota_idea:0 "The Ostland Quota"
 wif_rko_quota_idea_desc:0 "Grain, timber and oil from the Baltic."
 wif_rko_loyal_opinion:0 "Quotas Delivered"
 wif_rko_terror_opinion:0 "Ruthless in Weissruthenien"
 wif_rko_reichsgau_opinion:0 "Reichsgau Ostland"
 wif_rko_german_land_opinion:0 "A German Land"
 wif_rko_emptied_opinion:0 "The Emptied Land"
 wif_rko_tt_1:0 "§YHinrich Lohse§! rules from Riga. The §RBelarusian partisans§! are already in the marshes, and the §RForest Brothers§! in the woods."
 wif_rko_tt_2:0 "Germanisation: §G+5§!"
 wif_rko_tt_3:0 "Every Baltic state: §G+5§! compliance."
 wif_rko_tt_4:0 "§YFriedrich Jeckeln§!, Higher SS and Police Leader, replaces §YHinrich Lohse§! as Reichskommissar."
 wif_rko_tt_5:0 "Germanisation: §G+10§!"
 wif_rko_tt_6:0 "Unlocks §YDeliver the Ostland Quota§!."
 wif_rko_tt_7:0 "When the §YOstschild§! forms, every member gets §G+10%§! organisation for two years, and we get §G+100§! political power."
 wif_rko_tt_8:0 "Germanisation: §G+10§!"
 wif_rko_tt_9:0 "Riga and Kurzeme: §G+15§! compliance."
 wif_rko_tt_10:0 "Germanisation: §G+5§!"
 wif_rko_tt_11:0 "§YKurzeme§! becomes a core of the Reichskommissariat."
 wif_rko_tt_12:0 "Germanisation: §G+5§!"
 wif_rko_tt_13:0 "§YRiga§! becomes a core of the Reichskommissariat."
 wif_rko_tt_14:0 "Germanisation: §G+10§!"
 wif_rko_tt_15:0 "Riga: §R-10,000§! people deported."
 wif_rko_tt_16:0 "§YSuduva§! becomes a core of the Reichskommissariat."
 wif_rko_tt_17:0 "Germanisation: §G+5§!"
 wif_rko_tt_18:0 "§YZemaitija§! becomes a core of the Reichskommissariat."
 wif_rko_tt_19:0 "Germanisation: §G+5§!"
 wif_rko_tt_20:0 "Unlocks the choice: §YEindeutschung§! or §YThe Germanisable Peoples§!."
 wif_rko_tt_21:0 "Germanisation: §G+15§!"
 wif_rko_tt_22:0 "Every Latvian and Lithuanian state we have not cored: §R-30,000§! people, moved east."
 wif_rko_tt_23:0 "From now on every point of Germanisation feeds the Forest Brothers §Rtwice§! as much."
 wif_rko_tt_24:0 "Of Lithuania, only the coast and Suduva will ever be ours."
 wif_rko_tt_25:0 "Germanisation: §G+5§!"
 wif_rko_tt_26:0 "The Forest Brothers grow §R0.25§! a month faster, for good."
 wif_rko_tt_27:0 "Every Baltic state: §G+20§! compliance."
 wif_rko_tt_28:0 "Germanisation: §G+10§!"
 wif_rko_tt_29:0 "Germanisation grows §G+1§! a month more, for good."
 wif_rko_tt_30:0 "Germanisation: §G+10§!"
 wif_rko_tt_31:0 "Every cored state: §G+2§! building slots."
 wif_rko_tt_32:0 "Germanisation: §G+5§!"
 wif_rko_tt_33:0 "Every Latvian and Lithuanian state: §G+10§! compliance."
 wif_rko_tt_34:0 "Germanisation feeds the Forest Brothers only §Ghalf§! as much. Opens the coring of all of Lithuania and coastal Latvia. Estonia stays ruled, never joined."
 wif_rko_tt_35:0 "Every Latvian and Lithuanian state: §G+10§! compliance."
 wif_rko_tt_36:0 "Germanisation: §G+5§!"
 wif_rko_tt_37:0 "§YKaunas§! becomes a core of the Reichskommissariat."
 wif_rko_tt_38:0 "Germanisation: §G+5§!"
 wif_rko_tt_39:0 "§YZemgale§! becomes a core of the Reichskommissariat."
 wif_rko_tt_40:0 "Germanisation: §G+5§!"
 wif_rko_tt_41:0 "§YAukstaitija§! becomes a core of the Reichskommissariat."
 wif_rko_tt_42:0 "Germanisation: §G+5§!"
 wif_rko_tt_43:0 "§YVidzeme§! becomes a core of the Reichskommissariat."
 wif_rko_tt_44:0 "Germanisation: §G+5§!"
 wif_rko_tt_45:0 "§YVilna§! becomes a core of the Reichskommissariat."
 wif_rko_tt_46:0 "Germanisation: §G+5§!"
 wif_rko_tt_47:0 "We become §YReichsgau Ostland§!."
 wif_rko_tt_48:0 "The Belarusian states can never rise above §R30%§! compliance."
 wif_rko_tt_49:0 "Minsk: §R-20,000§! people."
 wif_rko_tt_50:0 "Every Belarusian state: §R-5,000§! people taken to the Reich."
 wif_rko_tt_51:0 "§YGermany§!: §G+5%§! construction speed for a year."
 wif_rko_tt_52:0 "The next Belarusian partisan raid comes §G60 days later§!."
 wif_rko_tt_53:0 "Belarusian partisan raids come §R10 days sooner§!, for good."
 wif_rko_tt_54:0 "Chase the Terrorists: success §G25%§! more likely."
 wif_rko_tt_55:0 "Every Belarusian state: §R-2,500§! people."
 wif_rko_tt_56:0 "Polesie and Mozyr: §R-10,000§! people each."
 wif_rko_tt_57:0 "Latgale can never rise above §R30%§! compliance."
 wif_rko_tt_58:0 "Latgale: §R-20,000§! people."
 wif_rko_tt_59:0 "Every Slavic state: §G+25%§! local resources, §R-10%§! local manpower. They can never be cored."
 wif_rko_tt_60:0 "Unlocks the §RDepopulation§! decisions: one per Belarusian city state, each a 120-day operation that removes §R25%§! of the population in four monthly steps."
 wif_rko_tt_61:0 "Minsk, Bobruysk and Mozyr: §R-15%§! of the population (about §R470,830§! people)."
 wif_rko_tt_62:0 "§YGermany§!: §G-2%§! consumer goods for 180 days."
 wif_rko_tt_63:0 "Every Belarusian state: §R-10%§! of the population (about §R669,597§! people)."
 wif_rko_tt_64:0 "The next Belarusian partisan raid comes §R20 days sooner§!."
 wif_rko_tt_65:0 "§YMoskowien§!: §G+50,000§! manpower for its labour camps."
 wif_rko_tt_66:0 "Each §RDepopulation§! decision can be taken a second time. Depopulated states: raids pick them only half as often, but §R-10%§! local manpower and §R-20%§! factory output for good."
 wif_rko_tt_67:0 "Virumaa: §G+4§! oil."
 wif_rko_tt_68:0 "Every Belarusian state: §R-2,000§! people."
 wif_rko_tt_69:0 "Every cored state: §G+1§! civilian factory."
 wif_rko_tt_70:0 "When the §YOstschild§! forms, every member gets §G+10%§! defence for a year."
 wif_rko_tt_71:0 "Unlocks §YForest Sweep§! and §YTake Hostages§!. Every Chase the Terrorists operation gives back §G2,500§! manpower when it ends."
 wif_rko_tt_72:0 "Forest Brothers' Strength: §G-5§!"
 wif_rko_tt_73:0 "Forest Sweeps cut Strength by §G3§! more."
 wif_rko_tt_74:0 "Belarusian partisan raids come §G10 days later§!, for good."
 wif_rko_tt_75:0 "Forest Brothers attacks are §G15%§! less likely."
 wif_rko_tt_76:0 "Belarusian partisan raids come §G20 days later§!, for good."
 wif_rko_tt_77:0 "The Forest Brothers grow §R0.5§! a month faster, for good."
 wif_rko_tt_78:0 "Forest Brothers' Strength: §G-15§!"
 wif_rko_tt_79:0 "The Forest Brothers grow §G0.5§! a month slower, for good."
 wif_rko_tt_80:0 "Belarusian partisan raids come §G15 days later§!, for good."
 wif_rko_tt_81:0 "Every Belarusian state: §R-2,000§! people."
 wif_rko_tt_82:0 "Chase the Terrorists: success §G25%§! more likely. Forest Sweeps cut Strength by §G2§! more."
 wif_rko_tt_83:0 "§YGermanisation§! begins: see the §YOstland§! decisions."
 wif_large_belarusian_resistance:0 "Large Belarusian Resistance"
 wif_large_belarusian_resistance_doubled:0 "Severe Belarusian Resistance"
 wif_large_belarusian_resistance_quintupled:0 "Devastating Belarusian Resistance"
 wif_rko_germanisation:0 "Germanisation"
 wif_rko_germanised_state:0 "Germanised"
 wif_rko_baltic_state:0 "Baltic Land"
 wif_rko_slavic_state:0 "Slavic Land"
 wif_rko_labour_reservation_state:0 "The Labour Reservation"
 wif_rko_emptied_state:0 "The Emptied Land"
 wif_rko_fs_zone:0 "Forest Brothers' Zone"
 wif_rko_depop_206:0 "Depopulate Minsk"
 wif_rko_depop_206_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Minsk. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_206_2:0 "Depopulate Minsk Again"
 wif_rko_depop_206_2_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Minsk. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_204:0 "Depopulate Bobruysk"
 wif_rko_depop_204_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Bobruysk. Over 120 days the state loses a quarter of its people."
 wif_rko_depop_204_2:0 "Depopulate Bobruysk Again"
 wif_rko_depop_204_2_desc:0 "Starve, deport and shoot: Generalplan Ost, applied to Bobruysk. Over 120 days the state loses a quarter of its people."
