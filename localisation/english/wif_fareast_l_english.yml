 # === Focus ===========================================================
 SME_hunt_for_stalin:0 "Hunt for Stalin and his Loyalists"
 SME_hunt_for_stalin_desc:0 "He was not in the Kremlin when the tanks arrived. He was not at the dacha, and he was not on any of the three trains we stopped outside Moscow. Someone warned him, and whoever it was is still wearing our uniform.\n\nThe Union is finished either way - but a Stalin at large is a second government waiting to be declared, and every officer who resents us knows it. Find him."

 # === wif_sme.2 - Stalin escaped ======================================
 wif_sme.2.t:0 "Stalin and his Loyalists Escaped to Irkutsk"
 wif_sme.2.desc:0 "Sixty-three days of roadblocks, wire taps and interrogations, and the answer arrives by radio rather than by arrest: he is in Irkutsk, and he has been there for weeks.\n\nHe did not flee alone. An armoured train, most of an NKVD regiment and a column of Party functionaries went east along the Trans-Siberian while we were still searching the suburbs of Moscow. From Irkutsk he has declared that the Union endures, that the men in Moscow are usurpers, and that the Far Eastern Union of Soviet Socialist Republics is the lawful continuation of the Soviet state.\n\nWorse than the declaration is who has answered it. Marshal Rokossovsky and Marshal Vasilevsky have both left their posts and taken the eastern railway. Buryatia, Chita, the Amur, Yakutsk, Kamchatka - the whole of the Far East has gone over with them.\n\nKhabarovsk we have already lost to whoever holds Vladivostok. The rest now belongs to him."
 wif_sme.2.a:0 "Then there are two Russias, and one of them has our marshals."
 wif_sme.2.b:0 "The Union is wherever Stalin is. Put me on the eastern train."

