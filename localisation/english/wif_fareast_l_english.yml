 # === The Romanov road =============================================
 wif_arrange_tsar_funeral:0 "Arrange a Funeral for the Tsar and his Children"
 wif_arrange_tsar_funeral_desc:0 "They have been in a mineshaft outside Yekaterinburg for eighteen years and everyone in the Union knows roughly where. Bringing them up and burying them properly is not an endorsement of anything - it is an admission that they were people, and that shooting the children was a decision somebody made. The monarchists will weep. The Party will note who attended."
 wif_sme_tsar_funeral:0 "The Ekaterinburg Reburial"
 wif_sme_tsar_funeral_desc:0 "A funeral with no flags on the coffins, which everyone present understood to be the point. It has cost the government nothing it can name and bought it something it cannot name either."
 wif_return_tsarist_land:0 "Give Former Tsarist Landowners Back Their Property"
 wif_return_tsarist_land_desc:0 "This one cannot be dressed as a gesture. Estates seized in 1918 go back to the families that held them, or to whichever of their sons is still alive to sign for them, and the men working that land are told the revolution has been amended. It is the single most expensive thing the Emergency Government can do to itself - and the whites have made it perfectly clear that nothing further is on offer until it is done."
 wif_marxist_white_compromise:0 "The Marxist-White Compromise"
 wif_marxist_white_compromise_desc:0 "Estates restored, ministries shared, and a working arrangement that satisfies nobody and holds anyway. The economy carries the cost of two ruling classes where it had budgeted for none."
 wif_invite_vladimir_iii:0 "Invite Vladimir III Back as a Figurehead"
 wif_invite_vladimir_iii_desc:0 "A private citizen of no particular occupation is invited to return to a country he left as a child, on the strict understanding that he will open hospitals and sign nothing. Every party in Kazan believes it has outmanoeuvred the others by agreeing to it. One of them is right."
 wif_honourary_tsar_vladimir:0 "Honourary Tsar Vladimir III Romanov"
 wif_honourary_tsar_vladimir_desc:0 "He has no powers, no ministry and no army, and he is photographed everywhere. The arrangement was designed to make a monarchy harmless by making it ceremonial, which is a thing that has been tried before."
 wif_new_imperial_palace:0 "New Imperial Palace"
 wif_new_imperial_palace_desc:0 "Built quickly, in the wrong architectural century, by men who were told not to ask what it was for."

 wif_sme.5.t:0 "Return of a Romanov"
 wif_sme.5.d:0 "He came by train, which the newspapers were instructed to call unremarkable, and thirty thousand people were at the station to see something unremarkable happen.\n\nThe Party has not taken it well. Whatever the arrangement says on paper, half the Red Army command watched a Romanov step onto a platform in Russia and drew the obvious conclusion about what the last twenty years were for. The whites, for their part, have spent the week explaining that Kuybyshev must be cleared of troops - the Tsar is not safe, they say, among soldiers who remember Yekaterinburg. Nobody is certain whom that argument is meant to reassure.\n\nThe palace is already going up."
 wif_sme.5.a:0 "He signs nothing. That was the arrangement."

 # === The NKVD's advisors ==========================================
 SME_nakita_paskarov:0 "Nakita Paskarov"
 SME_yuri_dnoroutsi:0 "Yuri Dnoroutsi"
 # The trait name is what the game prints as the job title.
 wif_political_commissar:0 "Political Commissar"
 wif_political_commissar_desc:0 "He attends meetings he was not invited to and writes down what was said. Nobody has established who reads the notebooks, and the uncertainty is doing more work than the notebooks are. The Party has never been more confident of itself, and the country has never been less relaxed."
 wif_propaganda_master:0 "Propaganda Master"
 wif_propaganda_master_desc:0 "He was a poster designer in Kazan and is now the reason the Emergency Government is popular. He does not argue with the whites; he simply arrives first, in larger letters, and by the time anyone answers him the answer sounds defensive. Even the negotiations go easier - it is remarkable what a faction will settle for when the public has already been told it agreed."

 # === Breaking the democrats =======================================
 SME_infiltrate_democratic_opposition:0 "Infiltrate the Democratic Opposition"
 SME_infiltrate_democratic_opposition_desc:0 "Nothing is done to them. Men are simply placed - a clerk in the press office, a driver, somebody's nephew who needed the work - and then the Commissariat waits. It is the cheapest operation the NKVD will ever run and the only one with no possible failure state, because at this stage there is nothing to fail at. We are only listening."
 SME_find_scandals:0 "Find Scandals"
 SME_find_scandals_desc:0 "Everything the listening turned up, printed. A contract, a hotel register, a cousin in Berlin who should not have been written to. None of it is invented and none of it is quite a crime, which is precisely what makes it usable - a man defending himself against something true has already lost the argument he was actually having."
 SME_frame_leaders:0 "Frame the Leaders"
 SME_frame_leaders_desc:0 "The material ran out before the leadership did, so the Commissariat is now supplying its own. This is the step nobody in Kazan will be able to describe honestly afterwards, and everybody involved understands that. What it buys is real: the democratic faction is being decapitated at a steady rate, week after week, for exactly as long as Paskarov is left in his post."

 # The advisor upgrades these focuses grant.
 wif_nkvd_infiltration:0 "Infiltration of the Opposition"
 wif_nkvd_infiltration_desc:0 "Our people are inside their offices. While the propaganda master is in post, he knows what they will say before they say it."
 wif_nkvd_scandals:0 "The Files on the Democrats"
 wif_nkvd_scandals_desc:0 "A drawer of true things, released at chosen moments. Only useful while there is somebody in post to choose the moments."
 wif_nkvd_framing:0 "Manufactured Evidence"
 wif_nkvd_framing_desc:0 "The Commissar of State Security is no longer waiting for the democrats to give him something. Effective, and entirely dependent on his remaining in office."
