 # === wif_sme.4 - Yagoda is alive =====================================
 wif_sme.4.t:0 "Yagoda is Alive"
 wif_sme.4.desc:0 "Genrikh Grigoryevich Yagoda was shot in the cellar of the Lubyanka in March 1938. The order was signed, the sentence was carried out, and the file was closed. All three of those things are in the record and only two of them are true.\n\nWhat happened, as near as anyone will now admit, is that the men sent to do it did not. Whether they were bought, or persuaded, or simply could not bring themselves to shoot the man who had built the apparatus they served in, nobody says. What they did afterwards is the part that matters: they reported the sentence carried out. Telling Stalin that the former People's Commissar for Internal Affairs had walked out of the Lubyanka alive was a conversation none of them expected to survive, so they did not have it. The paperwork was filed. The Commissar-General of State Security ceased to exist.\n\nHe went east. For seven years he has been in the Urals and the western Siberian oblasts, among the men who owe their careers to him and the camps that are still run by his appointments, doing what he did better than anyone alive - assembling a list of people who will do what they are told.\n\nThis week the Emergency Government marched north against Archangelsk, and the Urals were left with nobody watching them. Tyumen, Sverdlovsk, Chelyabinsk and Tobolsk have declared for a West Siberian Marxist Republic. The garrisons did not resist because the garrisons are his. Ten divisions of border troops are standing in Tyumen under the old NKVD colours, and Yagoda has broadcast his own name as its chairman."
 wif_sme.4.a:0 "We buried him seven years ago. Somebody should be shot for that - if there is anyone left who was not in on it."
 wif_sme.4.b:0 "He built the apparatus every one of us serves in, and it is still his. I am going to Tyumen."

 # === Rebuild the NKVD =============================================
 SME_rebuild_the_nkvd:0 "Rebuild the NKVD"
 SME_rebuild_the_nkvd_desc:0 "The Commissariat was not abolished. It was scattered - officers in Kazan, files in Sverdlovsk, and a great many men who have spent two years insisting they were only ever clerks. Calling them back together is a decision about what the Emergency Government intends to be, and everyone who answers the summons understands that perfectly well."
 wif_nkvd:0 "The NKVD"
 wif_nkvd_desc:0 "The People's Commissariat for Internal Affairs, reassembled. It watches the borders and it watches the ministries, and it has never been especially clear to anyone which of the two it takes more seriously. The Party's position in the Union is a great deal steadier for its return - and a great deal harder to argue with."
 WIF_NKVD_COMMISSAR:0 "Commissar of State Security"

 # === Who the NKVD answers to ======================================
 SME_marshals_secret_police:0 "The Marshal's Secret Police"
 SME_marshals_secret_police_desc:0 "Zhukov does not ask for the Commissariat. He simply begins to be told things first, and the men who tell him find their careers improving. By the time anyone thinks to object, the objection would have to be filed with people who already report to him. An army that holds the borders and the files behind them is not a branch of the government - it is the government, wearing the government's coat."
 wif_nkvd_marshals_police:0 "The Marshal's Secret Police"
 wif_nkvd_marshals_police_desc:0 "The Commissariat answers to Zhukov now, and has stopped pretending otherwise. It works with the particular energy of an institution that finally knows whose it is - and every file it opens is one the marshal could read tonight, which most officers find is enough."
 SME_make_them_auditable:0 "Make Them Auditable"
 SME_make_them_auditable_desc:0 "A secret police answerable to a soldier is a soldier's secret police. The Commissariat was built to serve the Party and it will serve the Party: its warrants countersigned, its budgets read, its officers answerable to a committee that can end them. Nobody enjoys the arrangement. That is rather the point of it - an institution nobody can audit is an institution that has already changed sides."
 wif_nkvd_auditable:0 "An Auditable Commissariat"
 wif_nkvd_auditable_desc:0 "Every warrant countersigned, every budget read, every officer answerable to a committee of men who will outlast him. The Commissariat resented it for about a month and then discovered what it had gained: nobody can now accuse it of belonging to anyone but the Party, and it has become considerably more useful for being able to say so."

 # === Curb Their Influence / Prevent a Second Civil War =============
 SME_curb_their_influence:0 "Curb Their Influence"
 SME_curb_their_influence_desc:0 "They have been worth every concession. The staff officers can read a map, the engineers can read a ledger, and the Emergency Government has needed both badly enough to stop asking where they learned. What nobody accounted for is that men who came back to serve a state do not necessarily believe in it - and they have been talking. In the academies, in the ministries, in the officers' messes where the Union's next generation is being formed. Nothing that could be called a conspiracy. Simply three answers to the question of what Russia is for, none of them ours, all of them being given patiently to people who have never heard them before."
 # The category and the panel it draws.
 wif_the_white_question:0 "The White Question"
 wif_the_white_question_desc:0 "The Whites did not come back as one thing. They came back as three, and each of them keeps a quiet account of what the Emergency Government has earned. A faction can be courted, bought, set against its rivals or broken outright - and every one of those is a decision somebody will have to answer for later. These are the ledgers as our people read them."
 # The three readouts. [?variable|0] prints the live value, no decimals.
 wif_whites_dem_loyalty_readout:0 "Loyalty of the Russian Democratic Faction: §Y[?wif_whites_dem_loyalty|0]%§!/§H100%§!"
 wif_whites_fas_loyalty_readout:0 "Loyalty of the Russian Fascist Party: §Y[?wif_whites_fas_loyalty|0]%§!/§H100%§!"
 wif_whites_mon_loyalty_readout:0 "Loyalty of the Monarchists: §Y[?wif_whites_mon_loyalty|0]%§!/§H100%§!"
 wif_whites_dem_loyalty_readout_desc:0 "The largest of the three factions and the least openly hostile, which is not the same as friendly. They talk about a constituent assembly the way other men talk about the weather - constantly, and as though it were coming whatever anyone does.\n\n§YTheir standing:§! [WIF_WhitesDemStatus]\n\n§YWhat they are worth right now:§!\n Daily political power: [?wif_whites_dem_pp|+2]\n Loyalty: §H[?wif_whites_dem_loyalty|0]%§!  of 100"
 wif_whites_fas_loyalty_readout_desc:0 "The smallest faction and by some distance the most dangerous. They have no interest in an assembly, no interest in the Union, and a very clear interest in the moment the other two stop cooperating with us.\n\n§YTheir standing:§! [WIF_WhitesFasStatus]\n\n§YWhat they are worth right now:§!\n Daily political power: [?wif_whites_fas_pp|+2]\n Loyalty: §H[?wif_whites_fas_loyalty|0]%§!  of 100"
 wif_whites_mon_loyalty_readout_desc:0 "They ask for nothing and refuse nothing, and they are waiting - for a name, an heir, a bad enough winter. Of the three they are the easiest to keep and the hardest to read.\n\n§YTheir standing:§! [WIF_WhitesMonStatus]\n\n§YWhat they are worth right now:§!\n Daily political power: [?wif_whites_mon_pp|+2]\n Loyalty: §H[?wif_whites_mon_loyalty|0]%§!  of 100"
 wif_loyalty_readout_tt:0 "This is a reading, not an action."

 # The status line, chosen by common/scripted_localisation/wif_whites_loyalty.txt.
 wif_whites_status_loyal:0 "§Gloyal - paying into the treasury§!"
 wif_whites_status_neutral:0 "§Hneither an asset nor a liability§!"
 wif_whites_status_disaffected:0 "§Rdisaffected - costing you political power§!"
 wif_whites_status_absent:0 "§Rabsent from the ministries - costing you construction and factory output§!"
 wif_whites_status_irrelevant:0 "§Htoo small to matter - under 15% of the vote§!"

 # The panel itself.
 wif_whites_in_the_state:0 "The Whites in the State"
 wif_whites_in_the_state_desc:0 "Three factions sit inside the Emergency Government, and each of them is keeping an account. What they are owed, what they have been given, and how long they intend to go on waiting."

 # === The Duma road ================================================
 wif_promise_the_democrats_a_duma:0 "Promise the Democrats a Duma"
 wif_promise_the_democrats_a_duma_desc:0 "It costs nothing to say it. A constituent assembly, once the emergency is over, once the front is stable, once the harvest is in - the conditions can be written afterwards and there will be a great many of them. What matters is that the word has been said out loud by someone entitled to say it, and that every democrat in the ministries has now heard it. They will work twice as hard for a year on the strength of a sentence. The fascists heard it too."
 wif_establish_local_dumas:0 "Establish Temporary Local Dumas"
 wif_establish_local_dumas_desc:0 "The promise has lapsed and been noticed. So the assemblies are seated - district ones, temporary ones, with powers carefully enumerated and a sunset clause nobody expects to be honoured by either side. It is enormously expensive and it works: men who were drafting manifestos are now drafting drainage budgets, and a man arguing about drainage is not arguing about the government. The officers regard the whole business as the beginning of the end, and say so where they think they are not heard."

 # The temporary spirits these two swap in.
 wif_sme_the_whites_return_duma:0 "The Whites Return: A Duma Promised"
 wif_sme_the_whites_return_duma_desc:0 "A sentence spoken in a room in Kazan, repeated in every ministry within the week. The democrats have decided to believe it. The officers have decided to remember it."
 wif_sme_the_whites_return_local_dumas:0 "The Whites Return: The Assemblies Sit"
 wif_sme_the_whites_return_local_dumas_desc:0 "District assemblies with enumerated powers and a sunset clause. The democrats are inside the structure now rather than outside it, which is either the safest place for them or the most dangerous, depending on which marshal you ask."

 wif_white_decision_cooldown:0 "The Whites Are Watching"

 # === The fall of the Emergency Government =========================
 CSR_russian_federation:0 "Russian Federation"
