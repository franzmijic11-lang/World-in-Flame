 # === wif_sme.4 - Yagoda is alive =====================================
 wif_sme.4.t:0 "Yagoda is Alive"
 wif_sme.4.desc:0 "Genrikh Grigoryevich Yagoda was shot in the cellar of the Lubyanka in March 1938. The order was signed, the sentence was carried out, and the file was closed. All three of those things are in the record and only two of them are true.\n\nWhat happened, as near as anyone will now admit, is that the men sent to do it did not. Whether they were bought, or persuaded, or simply could not bring themselves to shoot the man who had built the apparatus they served in, nobody says. What they did afterwards is the part that matters: they reported the sentence carried out. Telling Stalin that the former People's Commissar for Internal Affairs had walked out of the Lubyanka alive was a conversation none of them expected to survive, so they did not have it. The paperwork was filed. The Commissar-General of State Security ceased to exist.\n\nHe went east. For seven years he has been in the Urals and the western Siberian oblasts, among the men who owe their careers to him and the camps that are still run by his appointments, doing what he did better than anyone alive - assembling a list of people who will do what they are told.\n\nThis week the Emergency Government marched north against Archangelsk, and the Urals were left with nobody watching them. Tyumen, Sverdlovsk, Chelyabinsk and Tobolsk have declared for a West Siberian Marxist Republic. The garrisons did not resist because the garrisons are his. Ten divisions of border troops are standing in Tyumen under the old NKVD colours, and Yagoda has broadcast his own name as its chairman."
 wif_sme.4.a:0 "We buried him seven years ago. Somebody should be shot for that - if there is anyone left who was not in on it."
