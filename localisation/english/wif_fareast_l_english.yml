 # === The Anarchy Zone spirit =========================================
 wif_anarchy_zone:0 "Anarchy Zone"
 wif_anarchy_zone_desc:0 "There is no government here. The last administrator left on the last train and nobody was sent to replace him, so the settlements along the Yenisei and the Kolyma keep their own counsel and answer to nothing.\n\nNothing is built, because there is no one to order it built. Nobody is called up, because there is no one to call them. No foreign ministry will negotiate with a place that cannot sign, and no general staff will spend a year drafting a claim on ground that has nothing on it worth taking."

