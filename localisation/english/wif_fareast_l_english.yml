 # === Focus: Deploy East under Marshal Popov ==========================
 # This text is the lie. It promises the campaign against Stalin that the
 # focus tooltip also shows and that never actually happens.
 SME_deploy_east_under_popov:0 "Deploy East under Marshal Popov"
 SME_deploy_east_under_popov_desc:0 "Irkutsk cannot be allowed to stand. Every week the Far Eastern Union survives is a week in which some garrison commander between here and Lake Baikal decides that the lawful government of the Union is the one with Stalin in it.\n\nMarshal Markian Popov has the Siberian districts and knows the ground east of the Urals better than any officer we have left. Give him the divisions he asks for, put the whole eastern deployment under his command, and let him finish the usurper before the winter closes the railway."

 # === Focus: Prepare to Take Back What the Germans Took =============
 SME_prepare_to_take_back:0 "Prepare to Take Back What the Germans Took"
 SME_prepare_to_take_back_desc:0 "The armistice line runs where the Wehrmacht stopped, not where the Union ended. Behind it lie the Donbass, the Dnieper dams and half the plant that built the Red Army - not destroyed, not even idle, but turned around and running for somebody else. Every month it stays there it is a month of German shells made with Ukrainian steel.\n\nNothing is declared. Nothing is announced. What goes out to the Urals is a production schedule and nothing more: longer shifts, wider tolerances, and a quota written against a war that is not on any calendar yet. The men on the line will draw their own conclusions, and they will be right."
 wif_sme_prepare_to_take_back:0 "Prepare to Take Back What the Germans Took"
 wif_sme_prepare_to_take_back_desc:0 "The plants are running to a quota nobody has explained. The general staff has not said what it is for, and does not need to."

 # === Focus: Address the Fracturing Leadership ======================
 # The political branch off Deploy East. It does not undo Popov - it makes
 # what he left behind governable.
 SME_address_fracturing_leadership:0 "Address the Fracturing Leadership"
 SME_address_fracturing_leadership_desc:0 "Popov did not have to fight his way out. He asked for divisions, he was given them, and he drove east with the general staff's own signature in his pocket.\n\nThe question in every district command since is the one nobody will put in writing: if it was that simple for him, who else has already done the arithmetic? Officers are moved before they can settle. Commissars are asked for opinions they were never appointed to hold. Orders leave Moscow and arrive somewhere east of it as suggestions.\n\nThis does not mend the Union, and it does not bring Siberia back. It mends the chain of command - enough of it that an order given here is still an order by the time it reaches Kazan."
 wif_sme_fractured_government:0 "Fractured Government, Who is Loyal?"
 wif_sme_fractured_government_desc:0 "A marshal took an army group east and made a country out of it. Nobody in Moscow can say with any confidence which of the others would not do the same, and every command in the country knows that nobody can say it."
 wif_sme_fractured_government_addressed:0 "Fractured Government, Who is Loyal?"
 wif_sme_fractured_government_addressed_desc:0 "The reshuffles have done what reshuffles can. The chain of command holds again - not because the question was ever answered, but because asking it out loud now costs a man his command."

 # === The leadership balance of power ==============================
 # Created by SME_address_fracturing_leadership. The council runs
 # negative and Zhukov positive; see common/bop/SME.txt.
 SME_leadership_balance:0 "Who Speaks for the Union"
 SME_leadership_balance_desc:0 "Nothing in the founding of the Emergency Government ever said whether the marshal answers to the council or the council to the marshal. It did not need saying while there was a war on. It needs saying now."
 SME_leadership_balance_neutral:0 "An Open Question"
 SME_leadership_balance_neutral_desc:0 "The council meets. The marshal attends. Nothing is decided, and both sides find that they can live with it."

 SME_leadership_council_side:0 "Soviet Emergency Military Council"
 SME_leadership_council_1:0 "The Council Sits"
 SME_leadership_council_1_desc:0 "Orders leave Moscow with a committee's signature on them again. It is slower, and it is obeyed."
 SME_leadership_council_2:0 "The Council Decides"
 SME_leadership_council_2_desc:0 "Appointments go through the council now, and the men appointed know it."
 SME_leadership_council_3:0 "The Council Governs"
 SME_leadership_council_3_desc:0 "The general staff submits its plans for approval, and waits for it."
 SME_leadership_council_4:0 "A Government of Laws"
 SME_leadership_council_4_desc:0 "There is a civilian authority in Moscow again, and an army that reports to it. Whether it can fight is a question for later."

 SME_leadership_zhukov_side:0 "Marshal Zhukov"
 SME_leadership_zhukov_1:0 "The Marshal's Word"
 SME_leadership_zhukov_1_desc:0 "On matters of the army the council has stopped arguing, which is not the same as agreeing."
 SME_leadership_zhukov_2:0 "The Marshal's Men"
 SME_leadership_zhukov_2_desc:0 "The commands that matter are held by officers who owe them to one man. Governing costs more than it did."
 SME_leadership_zhukov_3:0 "The Marshal's Government"
 SME_leadership_zhukov_3_desc:0 "The council is consulted afterwards, as a courtesy. The country has decided it would rather be defended than governed."
 SME_leadership_zhukov_4:0 "The Marshal Alone"
 SME_leadership_zhukov_4_desc:0 "There is no longer any distinction between the general staff and the government of the Union. There is only Zhukov, and the army, and the war he says is coming."

 # === Focus: Industries of Siberia ==================================
 SME_industries_of_siberia:0 "Industries of Siberia"
 SME_industries_of_siberia_desc:0 "Tyumen, Sverdlovsk, Kazan and Syktyvkar were evacuation towns. Plant came east ahead of the Wehrmacht in 1941, was set down wherever there was rail and a river, and has been running ever since on the understanding that it would all go back one day.\n\nIt is not going back. The order signed this week makes the temporary permanent: new floor space, new slots cleared for more of it, and the arms works at Tyumen expanded until the town is an arsenal with a population attached. What was salvage becomes the industrial base of a state that intends to fight again."

 # === Focus: the two rail branches ==================================
 SME_connect_south:0 "Connecting the South with the Capital"
 SME_connect_south_desc:0 "Kuybyshev, Kazan, Ufa and the Magnitogorsk works are four of the largest things the Emergency Government still owns, and not one of them can reach another without a detour. Track, in the straightest line the ground allows."
 SME_connect_north:0 "Connect the North"
 SME_connect_north_desc:0 "North of Kirov the map stops being a country and starts being a distance. A single line to Syktyvkar, on through the Pechora and out to the Nenets coast, with depots at both ends to make it mean something."

 # === Focus: Zlatoust Ural Military District ========================
 SME_zlatoust_ural_military_district:0 "Zlatoust Ural Military District"
 SME_zlatoust_ural_military_district_desc:0 "Both lines run to Zlatoust now, and a town that was a steel works with a railway station attached becomes the point on the map where the Urals can be defended from.\n\nThe district command is stood up in the old arsenal offices. Five new works go up around it, the sidings are doubled, and the guns that were meant for the front are bolted to the roofs instead - because a factory that cannot be bombed is worth more than one that is merely closer to the fighting."

 # === Focus and decision: Arm the Partisans ========================
 SME_arm_the_partisans:0 "Arm the Partisans"
 SME_arm_the_partisans_desc:0 "Zlatoust turns out more rifles than we have shoulders to carry them. West of the armistice line there are people with the opposite problem.\n\nNothing is signed and nothing is admitted. Crates go west on the ore trains and come back empty, and what becomes of them after that is written down nowhere. Berlin will know within a month who armed them. It will not be able to prove it, and it will not be able to stop it."
 wif_arm_the_partisans_unlock_tt:0 "Unlocks the decision §YArm the Partisans§!"

 wif_arm_the_partisans_category:0 "Partisans"
 wif_arm_the_partisans:0 "Arm the Partisans"
 wif_arm_the_partisans_desc:0 "Seven thousand rifles go west, out of the oldest racks first - the ones stamped before the war, which nobody will miss and nobody can trace. What they buy is impatience: the next raid comes in half the time it would have."
 wif_arm_the_partisans_effect_tt:0 "§YThe time until Moskowien's next terror raid is halved§!"

 # === Focuses: the two answers to the fractured leadership =========
 SME_checks_and_balances:0 "Checks and Balances"
 SME_checks_and_balances_desc:0 "The council cannot govern an army it cannot audit. Every district command files its returns through the secretariat now, every requisition carries a countersignature, and every officer who signs one learns whose name sits above his own.\n\nNone of it is aimed at the Marshal. All of it is.\n\n§YShifts the balance of power eleven points towards the Council, enough to leave neutral ground.§!"
 SME_root_out_german_collaborators:0 "Root Out German Collaborators"
 SME_root_out_german_collaborators_desc:0 "There are men in this government who were taking German pay while the front was still moving, and everybody knows which men they are. What nobody has had is the authority to arrest them.\n\nThe Marshal has that authority, because he has the divisions. The council will approve it afterwards, and in approving it will concede who is actually in charge.\n\n§YShifts the balance of power eleven points towards Zhukov, enough to leave neutral ground.§!"

 # === Focus: Invite the Whites Back ================================
 SME_invite_the_whites_back:0 "Invite the Whites Back"
 SME_invite_the_whites_back_desc:0 "There are men in Paris and Harbin and Belgrade who have spent fifteen years waiting to be asked. Some of them commanded armies against us. Some of them are the only people alive who know how to run a rolling mill.\n\nThe quarrel that drove them out was about what Russia should be. That quarrel has been overtaken: there may not be a Russia to argue over much longer. Whatever they are, they are not Germans, and they are not staying away.\n\nLet them come home. We can finish the argument once there is a country left to have it in."
 wif_sme_the_whites_return:0 "The Whites Return"
 wif_sme_the_whites_return_desc:0 "The emigration is coming back - officers who left in 1920, engineers who spent fifteen years building somebody else's factories, and a political tradition that lost the civil war and never once conceded the point.\n\nThey bring hands, and skills, and opinions. The last of those is not free.\n\n§YEvery ideology but communism gains 0.1 support a day.§!"

 wif_marshal_of_the_union:0 "Marshal of the Union"
 wif_marshal_of_the_union_desc:0 "He has never given a speech that anybody remembers and has no opinion on agriculture. What he has is an army that still answers when he calls, and a record nobody in Russia is willing to argue with."

 # === wif_sme.3 - Popov's betrayal ====================================
 wif_sme.3.t:0 "Marshal Popov has Betrayed Us"
 wif_sme.3.desc:0 "The army group reached Novosibirsk on schedule and then stopped reporting. It did not stop moving.\n\nPopov has declared a Central Siberian Republic from the governor's residence at Tomsk, with himself at the head of it. He did not go east to fight Stalin. He went east because it was the only direction in which a man could take an army away from both Moscow and Irkutsk and still have somewhere to put it.\n\nHis proclamation is careful to insult nobody. The Union has two governments and neither was elected, he says, so Siberia will hold its own. Omsk, Novosibirsk, Krasnoyarsk, the Altai, the whole central belt from the Urals to Bratsk has gone with him - and so has close to a third of the army we had left.\n\nMarshal Zhukov gave him that command personally."
 wif_sme.3.a:0 "Three Russias, then. He might have had the decency to say so first."
 wif_sme.3.b:0 "He is right that neither government was elected. Have a train made ready for Tomsk."

