l_english:

 # The four coalition concessions under Form an Agrarian Cabinet, and the
 # spirits they grant. Descriptions run to about two short paragraphs - the
 # focus tooltip has a fixed width and no scrollbar, so anything longer is cut
 # off where the player cannot read it.

 # === Bondeförbundet =================================================
 SWE_lika_folkpension:0 "Lika Folkpension i Stad och Land"
 SWE_lika_folkpension_desc:0 "The pension committee wants the old-age pension graded by cost of living, which in practice means a larger pension in Stockholm than in Norrbotten. Bondeförbundet will not have it: a farm labourer who worked forty years is owed what a tram conductor is owed.\n\nThe party gets its flat rate. The country pays the town rate everywhere."
 wif_swe_lika_folkpension:0 "Lika Folkpension"
 wif_swe_lika_folkpension_desc:0 "The old-age pension is paid at one rate from Ystad to Kiruna. It costs more than grading it would have, and it has done more than any speech to convince the countryside that the state is also theirs."

 SWE_tryggade_jordbrukspriser:0 "Tryggade Jordbrukspriser"
 SWE_tryggade_jordbrukspriser_desc:0 "The kohandel bought a government; the regulations are what it bought the government for. Milk price equalisation, grain regulation and a tariff wall to hold both of them up.\n\nThe farms come off the edge of ruin and the country feeds itself. The price is paid abroad, by everyone who wanted to sell us food."
 wif_swe_tryggade_jordbrukspriser:0 "Tryggade Jordbrukspriser"
 wif_swe_tryggade_jordbrukspriser_desc:0 "Guaranteed prices, a regulated grain market and a tariff wall around both. The countryside is solvent and confident, and rather less welcome at anyone else's negotiating table."

 # === Folkpartiet ====================================================
 SWE_nykterhet_och_folkbildning:0 "Nykterhet och Folkbildning"
 SWE_nykterhet_och_folkbildning_desc:0 "Folkpartiet is the temperance movement, the free churches and the study circles wearing a rosette, and its price for supporting the ministry is that the state take all three seriously - the motbok enforced, the bildningsförbund funded.\n\nThe study circles repay it quickly. The motbok is another matter: half the country resents being counted at the counter."
 wif_swe_nykterhet_och_folkbildning:0 "Folkbildning"
 wif_swe_nykterhet_och_folkbildning_desc:0 "Study circles, lending libraries and evening classes in every parish that will have them. A settled habit by now, and one that quietly raises the ceiling on what the country can be taught."
 wif_swe_nykterhetskampanjen:0 "Nykterhetskampanjen"
 wif_swe_nykterhetskampanjen_desc:0 "The temperance campaign at full pitch: the ration book enforced, the lecture halls full, and a government spending political capital it will not get back on telling working men what they may drink."

 # === Högern =========================================================
 # Högern is what the party called itself in this period. It did not become
 # Moderata samlingspartiet until 1969.
 SWE_stod_at_forsvarsrorelsen:0 "Stöd åt den Frivilliga Försvarsrörelsen"
 SWE_stod_at_forsvarsrorelsen_desc:0 "Lindman's people think the 1936 defence act a half-measure and say so. What they ask of this ministry is not a bigger army but a wider one: the shooting clubs, the Lottakåren and voluntary training funded and encouraged.\n\nConscripts arrive already knowing which end of a rifle is which. The labour movement notices who is being armed, and by whom."
 wif_swe_frivilliga_forsvarsrorelsen:0 "Den Frivilliga Försvarsrörelsen"
 wif_swe_frivilliga_forsvarsrorelsen_desc:0 "Skytteföreningar, the Lottakåren and voluntary defence training, funded by the state and run by nobody in particular. A cheap way to shorten training, and a standing quarrel with the unions over what it is really for."

 SWE_sparsamhet_sunda_statsfinanser:0 "Sparsamhet och Sunda Statsfinanser"
 SWE_sparsamhet_sunda_statsfinanser_desc:0 "Högern fought the election against planhushållning - against a state that spends more every year and taxes more every year to pay for it. What it wants from a ministry it leads is a budget held straight, and private saving and private enterprise left alone to do the work.\n\nThe workshops and the yards agree with it. The union halls read the whole thing as an attack on the reform programme, and are not entirely wrong."
 wif_swe_sparsamhet_sunda_statsfinanser:0 "Sparsamhet och Sunda Statsfinanser"
 wif_swe_sparsamhet_sunda_statsfinanser_desc:0 "A budget held straight, and private capital left where it is. Industry builds cheaper and the state asks less of the household - at the price of a labour movement that has been told, in as many words, that the reforms stop here."

 # === Socialdemokraterna ==============================================
 SWE_dyrortsgraderade_folkpensioner:0 "Dyrortsgraderade Folkpensioner"
 SWE_dyrortsgraderade_folkpensioner_desc:0 "This is the question the government fell over in June. The pension committee wants the old-age pension graded by cost of living; Bondeförbundet wants one flat rate and brought down the ministry rather than concede it.\n\nThe Social Democrats came back with a mandate and intend to use it. A pension that is worth something in a town where rent is worth something - and a bill the towns will also pay."
 wif_swe_dyrortsgraderade_folkpensioner:0 "Dyrortsgraderade Folkpensioner"
 wif_swe_dyrortsgraderade_folkpensioner_desc:0 "The old-age pension is graded by what living actually costs where the pensioner lives. It settles the question that brought down a government, and it costs rather more than paying one rate everywhere would have."

 SWE_fri_modravard:0 "Fri Mödravård och Moderskapshjälp"
 SWE_fri_modravard_desc:0 "The same population debate as Myrdal's book, but about care rather than housing: free antenatal and maternity care, a trained midwife within reach of every parish, and money for new mothers who have none.\n\nThe Riksdag will legislate moderskapspenning and mödrahjälp within the year. Getting it there costs the government most of what it has to bargain with."
 wif_swe_fri_modravard:0 "Fri Mödravård"
 wif_swe_fri_modravard_desc:0 "Antenatal and maternity care free at the point of use, midwives across the whole country, and maternity payments for mothers with nothing to fall back on. Fewer women die, more children live, and the population figures stop frightening people."
 wif_swe_moderskapsreformen:0 "Moderskapsreformen"
 wif_swe_moderskapsreformen_desc:0 "The maternity bill is being pushed through the chamber, and it is taking every favour and every hour the government has. Nothing else moves while it does."

 # === Högern's second promise =========================================
 SWE_ett_starkare_forsvarsbeslut:0 "Ett Starkare Försvarsbeslut"
 SWE_ett_starkare_forsvarsbeslut_desc:0 "Högern voted against the 1936 defence act, and not because it disliked the idea. Lindman's people wanted a larger establishment, a bigger navy estimate and the money to pay for both, and said so at every stage of the bill.\n\nThat the same party spent the rest of the session demanding a tighter budget is not a contradiction it has ever felt obliged to explain."
 wif_swe_ett_starkare_forsvarsbeslut:0 "Ett Starkare Försvarsbeslut"
 wif_swe_ett_starkare_forsvarsbeslut_desc:0 "The establishment the 1936 act should have voted for: more regiments, more yards, and the arms works running to fill them. It is being paid for out of the same purse that was so carefully guarded a moment ago, and everybody can see it."

 # === The war cabinet's own gate ======================================
 SWE_war_cabinet_four_promises_tt:0 "The government has §Ykept all four of its promises§!."
