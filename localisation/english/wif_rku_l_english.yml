l_english:
 wif_rku_root:0 "Koch's Kingdom"
 wif_rku_root_desc:0 "The Soviet Union has surrendered. From Rowno, a provincial town in Volhynia chosen because it is not Kiev, Reichskommissar Erich Koch rules the richest farmland in Europe for one purpose: to feed the Reich. Koch's own words set the tone: if he finds a Ukrainian worthy of sitting at his table, he will have him shot."
 wif_rku_rowno:0 "The Capital at Rowno"
 wif_rku_rowno_desc:0 "Kiev is too Ukrainian to be a capital. The Reichskommissariat governs from a Volhynian market town."
 wif_rku_untermensch_decree:0 "The Untermensch Decree"
 wif_rku_untermensch_decree_desc:0 "Ukrainians are not to be educated beyond the fourth grade, may not use parks or trams reserved for Germans, and are to be addressed as subjects, not citizens."
 wif_rku_no_ukrainian_state:0 "No Ukrainian State"
 wif_rku_no_ukrainian_state_desc:0 "The nationalists who hoped for a Ukraine under German protection are arrested; their leaders go to Sachsenhausen."
 wif_rku_reich_officials:0 "Officials from the Reich"
 wif_rku_reich_officials_desc:0 "Every district gets a German Gebietskommissar, most of them party men nobody wanted at home."
 wif_rku_close_the_schools:0 "Close the Schools"
 wif_rku_close_the_schools_desc:0 "Secondary schools and universities are shut. Ukraine needs labourers, not graduates."
 wif_rku_tribute_to_berlin:0 "Tribute to Berlin"
 wif_rku_tribute_to_berlin_desc:0 "Koch reports directly to Hitler and Goring, over the heads of Rosenberg's ministry."
 wif_rku_obedient_servant:0 "The Reich's Obedient Servant"
 wif_rku_obedient_servant_desc:0 "Every order from Berlin is carried out to the letter."
 wif_rku_koch_kingdom:0 "Koch's Private Fiefdom"
 wif_rku_koch_kingdom_desc:0 "Koch runs Ukraine like an East Prussian estate - his estate."
 wif_rku_rk_endures:0 "The Reichskommissariat Endures"
 wif_rku_rk_endures_desc:0 "Years on, the Reichskommissariat still stands - on a population that hates it."
 wif_rku_grain_quotas:0 "Grain Quotas"
 wif_rku_grain_quotas_desc:0 "Every village has a quota. Villages that miss it are 'investigated'."
 wif_rku_community_farms:0 "Keep the Collective Farms"
 wif_rku_community_farms_desc:0 "The Soviet collective farms are renamed 'community farms' and kept: nothing collects grain better."
 wif_rku_grain_collection:0 "The Grain Collection Points"
 wif_rku_grain_collection_desc:0 "Railheads ringed with barbed wire, where the harvest is weighed and loaded."
 wif_rku_bread_for_the_reich:0 "Bread for the Reich"
 wif_rku_bread_for_the_reich_desc:0 "The harvest belongs to Germany first, the Wehrmacht second, Ukraine last."
 wif_rku_close_the_cities:0 "Close the Cities"
 wif_rku_close_the_cities_desc:0 "Checkpoints around Kiev and Kharkov stop peasants bringing food into the cities. The cities are meant to shrink."
 wif_rku_rail_west:0 "Every Train Goes West"
 wif_rku_rail_west_desc:0 "Grain, cattle, sunflower oil, the black soil itself - dug up and sent to the Reich by the trainload."
 wif_rku_kharkov_famine:0 "The Kharkov Famine"
 wif_rku_kharkov_famine_desc:0 "With the roads closed, Kharkov starves. Tens of thousands die in the city that was the capital of Soviet Ukraine."
 wif_rku_hunger_plan:0 "The Hunger Plan"
 wif_rku_hunger_plan_desc:0 "Backe's plan, written before the invasion, foresaw millions of 'superfluous eaters' starving so that the Reich could eat. Koch carries it out."
 wif_rku_sunflower_oil:0 "Sunflower Oil and Sugar"
 wif_rku_sunflower_oil_desc:0 "The sugar beet and sunflower fields of the Right Bank are put to work for the Reich's margarine factories."
 wif_rku_breadbasket:0 "The Breadbasket of Europe"
 wif_rku_breadbasket_desc:0 "Ukraine feeds the Reich. Ukraine starves."
 wif_rku_the_population_question:0 "The Population Question"
 wif_rku_the_population_question_desc:0 "Ukraine has forty million people. The Reich's plans for it have room for far fewer."
 wif_rku_babi_yar:0 "Babi Yar"
 wif_rku_babi_yar_desc:0 "The ravine outside Kiev where, in two days in 1941, the SS shot 33,771 Jews - and where the shooting never really stopped."
 wif_rku_ostarbeiter:0 "Ostarbeiter"
 wif_rku_ostarbeiter_desc:0 "Labour recruitment becomes round-ups: young Ukrainians are loaded onto trains to the Reich's factories, marked with the OST badge."
 wif_rku_volksdeutsche:0 "The Volksdeutsche"
 wif_rku_volksdeutsche_desc:0 "Ukraine's ethnic German villages become the Reich's first foothold."
 wif_rku_cleansing_kiev:0 "Cleansing Kiev"
 wif_rku_cleansing_kiev_desc:0 "Kiev is to be a German city. Its people are to be starved out, deported or shot."
 wif_rku_burn_villages:0 "Burn the Villages"
 wif_rku_burn_villages_desc:0 "For every German killed, a village burned with its people."
 wif_rku_german_farmers:0 "German Farmers for the Black Earth"
 wif_rku_german_farmers_desc:0 "Settlers from the Reich are promised Ukrainian farms - with the Ukrainians removed."
 wif_rku_kiev_resettled:0 "Kiev Resettled"
 wif_rku_kiev_resettled_desc:0 ""
 wif_rku_the_dnieper:0 "The Dnieper Farms"
 wif_rku_the_dnieper_desc:0 "The great river's farmland - Dnipropetrovsk, Zaporozhe, Kherson and Mykolaiv - is opened to German settlement."
 wif_rku_hegewald:0 "Hegewald"
 wif_rku_hegewald_desc:0 "Himmler's own model colony near Zhytomyr: 10,000 Ukrainians expelled, Volksdeutsche brought in, his field headquarters in the middle."
 wif_rku_gotengau:0 "Gotengau"
 wif_rku_gotengau_desc:0 "Crimea is to become 'Gotenland', settled by South Tyroleans and Germans from Palestine. The Tatars and Russians are to go."
 wif_rku_the_settler_frontier:0 "The Settler Frontier"
 wif_rku_the_settler_frontier_desc:0 "German villages stand in the black earth, fortified, armed - and surrounded."
 wif_rku_schutzmannschaft:0 "The Schutzmannschaft"
 wif_rku_schutzmannschaft_desc:0 "Auxiliary police battalions, recruited from collaborators, criminals and the desperate."
 wif_rku_ordnungspolizei:0 "Ordnungspolizei Command"
 wif_rku_ordnungspolizei_desc:0 "German police officers to command them - and watch them."
 wif_rku_rifles_from_reich:0 "Rifles from Reich Depots"
 wif_rku_rifles_from_reich_desc:0 "Captured Soviet rifles and old Mausers."
 wif_rku_colonial_regiments:0 "Colonial Police Regiments"
 wif_rku_colonial_regiments_desc:0 "The battalions are grouped into regiments for anti-partisan sweeps."
 wif_rku_railway_watch:0 "The Railway Watch"
 wif_rku_railway_watch_desc:0 "Blockhouses along every line west."
 wif_rku_last_police:0 "Every Last Policeman"
 wif_rku_last_police_desc:0 "There are no more men to recruit who would not desert."
 wif_rku_bandenbekaempfung:0 "Bandenbekampfung"
 wif_rku_bandenbekaempfung_desc:0 "'Bandit fighting' - the word for war on the villages."
 wif_rku_forests_volhynia:0 "The Forests of Volhynia"
 wif_rku_forests_volhynia_desc:0 "The UPA's home ground. Every sweep finds burned-out camps and mined roads."
 wif_rku_soviet_partisans:0 "The Soviet Partisans"
 wif_rku_soviet_partisans_desc:0 "Kovpak's raiders from the north and Soviet cells in the cities - armed, when the SME can manage it, from across the front."
 wif_rku_pacification_zones:0 "Pacification Zones"
 wif_rku_pacification_zones_desc:0 "A few districts around the railheads and the settler villages are declared 'pacified'."
 wif_rku_collective_responsibility:0 "Collective Responsibility"
 wif_rku_collective_responsibility_desc:0 "Hostages from every village, shot when the railway is cut."
 wif_rku_ukrainian_auxiliaries:0 "Use the Nationalists"
 wif_rku_ukrainian_auxiliaries_desc:0 "Turn the OUN's rival factions against each other and against the Soviets."
 wif_rku_endless_partisan_war:0 "The Endless Partisan War"
 wif_rku_endless_partisan_war_desc:0 "Ukraine cannot be pacified. Koch's police can only keep the railways open."
 wif_rku_kochs_kingdom_idea:0 "Koch's Kingdom"
 wif_rku_kochs_kingdom_idea_desc:0 "If he finds a Ukrainian worthy of sitting at his table, Koch has said, he will have him shot."
 wif_rku_breadbasket_idea:0 "The Breadbasket of the Reich"
 wif_rku_breadbasket_idea_desc:0 "Every harvest goes west."
 wif_rku_untermenschen_idea:0 "Untermenschen"
 wif_rku_untermenschen_idea_desc:0 "Ukrainians are subjects, not citizens."
 wif_rku_rowno_idea:0 "The Capital at Rowno"
 wif_rku_rowno_idea_desc:0 "Kiev is too Ukrainian to be a capital."
 wif_rku_untermensch_idea:0 "The Untermensch Decree"
 wif_rku_untermensch_idea_desc:0 "Four grades of school, no parks, no trams."
 wif_rku_officials_idea:0 "Officials from the Reich"
 wif_rku_officials_idea_desc:0 "A German Gebietskommissar in every district."
 wif_rku_schools_idea:0 "The Schools Closed"
 wif_rku_schools_idea_desc:0 "Labourers, not graduates."
 wif_rku_tribute_idea:0 "Tribute to Berlin"
 wif_rku_tribute_idea_desc:0 "Koch reports to Hitler and Goring directly."
 wif_rku_fiefdom_idea:0 "Koch's Private Fiefdom"
 wif_rku_fiefdom_idea_desc:0 "An East Prussian estate the size of France."
 wif_rku_quotas_idea:0 "Grain Quotas"
 wif_rku_quotas_idea_desc:0 "Villages that miss the quota are investigated."
 wif_rku_farms_idea:0 "Community Farms"
 wif_rku_farms_idea_desc:0 "The collective farms, renamed."
 wif_rku_famine_idea:0 "The Kharkov Famine"
 wif_rku_famine_idea_desc:0 "The city that was the capital of Soviet Ukraine starves."
 wif_rku_breadbasket_end_idea:0 "The Breadbasket of Europe"
 wif_rku_breadbasket_end_idea_desc:0 "Ukraine feeds the Reich. Ukraine starves."
 wif_rku_volksdeutsche_idea:0 "The Volksdeutsche"
 wif_rku_volksdeutsche_idea_desc:0 "Ukraine's German villages."
 wif_rku_orpo_idea:0 "Ordnungspolizei Command"
 wif_rku_orpo_idea_desc:0 "German officers command the auxiliaries - and watch them."
 wif_rku_hunger_1:0 "Hunger"
 wif_rku_hunger_1_desc:0 "The grain trains leave full; the villages are empty."
 wif_rku_hunger_2:0 "Famine"
 wif_rku_hunger_2_desc:0 "People are dying in the villages."
 wif_rku_hunger_3:0 "The Great Hunger"
 wif_rku_hunger_3_desc:0 "A second Holodomor, made in Berlin."
 wif_rku_sunflower_idea:0 "Sunflower Oil and Sugar"
 wif_rku_sunflower_idea_desc:0 "Ukrainian oil and sugar fill the shops."
 wif_rku_ostarbeiter_idea:0 "Ostarbeiter"
 wif_rku_ostarbeiter_idea_desc:0 "Ukrainian labour in German factories."
 wif_rku_loyal_opinion:0 "A Loyal Reichskommissariat"
 wif_rku_fiefdom_opinion:0 "Koch's Ambitions"
 wif_rku_tt_1:0 "§YErich Koch§! rules from Rowno. The §RUkrainian Resistance§! raids have begun."
 wif_rku_tt_2:0 "Ukrainian Resistance raids come §R10 days sooner§!, for good."
 wif_rku_tt_3:0 "Ukrainian Resistance raids come §R15 days sooner§!, for good."
 wif_rku_tt_4:0 "§YGermany§! answers our requests for Kiev's resettlement whatever it can spare."
 wif_rku_tt_5:0 "Ukrainian Resistance raids come §R5 days sooner§!, for good."
 wif_rku_tt_6:0 "Unlocks §YSend Extra Grain to the Reich§!: it slows the Facade Economy's consumer-goods rise in Germany - and starves Ukraine."
 wif_rku_tt_7:0 "§RThe Kharkov Famine§! will follow."
 wif_rku_tt_8:0 "§YGermany§!: §G+1§! civilian factory for good."
 wif_rku_tt_9:0 "§YSend Extra Grain to the Reich§! costs §G25%§! less manpower."
 wif_rku_tt_10:0 "Ukrainian Resistance raids come §R15 days sooner§!, for good."
 wif_rku_tt_11:0 "§YSend Extra Grain to the Reich§! slows the Facade Economy by §G0.35§! points a month instead of 0.25 - and costs §R15,000§! manpower instead of 10,000."
 wif_rku_tt_12:0 "§YGermany§!: §G-5%§! consumer goods for a year."
 wif_rku_tt_13:0 "§YGermany§!: §G+5%§! stability."
 wif_rku_tt_14:0 "Unlocks the settlement and coring of Ukraine."
 wif_rku_tt_15:0 "Ukrainian Resistance raids come §R10 days sooner§!, for good."
 wif_rku_tt_16:0 "Kiev: §R-125,000§! people."
 wif_rku_tt_17:0 "§YGermany§!: §G+2%§! factory output for two years."
 wif_rku_tt_18:0 "Ukrainian Resistance raids come §R10 days sooner§!, for good."
 wif_rku_tt_19:0 "Prepares §YKiev§!'s resettlement."
 wif_rku_tt_20:0 "Ukrainian Resistance raids come §R10 days sooner§!, for good."
 wif_rku_tt_21:0 "Chase the Terrorists: success §G25%§! more likely."
 wif_rku_tt_22:0 "Unlocks the decisions to settle German farmers in §YPoltava§!, §YCherkasy§! and §YKharkov§! - and make them cores."
 wif_rku_tt_23:0 "If we have §Y10,000§! manpower and §Y12,000§! rifles we resettle Kiev ourselves; otherwise we ask §YBerlin§!. Kiev loses §R50-65%§! of its people and becomes a §Gcore§!."
 wif_rku_tt_24:0 "Unlocks the decisions to settle German farmers along the §YDnieper§! - Dnipropetrovsk, Zaporozhe, Kherson, Mykolaiv - and make them cores."
 wif_rku_tt_25:0 "§YZhytomyr (Hegewald)§! becomes a core of the Reichskommissariat."
 wif_rku_tt_26:0 "Zhytomyr: §R-10,000§! people expelled."
 wif_rku_tt_27:0 "§YCrimea (Gotengau)§! becomes a core of the Reichskommissariat."
 wif_rku_tt_28:0 "The next Ukrainian Resistance raid comes §R10 days sooner§!."
 wif_rku_tt_29:0 "Every cored state: §G+1§! building slot."
 wif_rku_tt_30:0 "Unlocks §YDeploy the Mechanised Forces§! against the partisans."
 wif_rku_tt_31:0 "Raids on the railways do half the damage."
 wif_rku_tt_32:0 "This is all the police Ukraine will ever have."
 wif_rku_tt_33:0 "Every Chase the Terrorists operation gives back §G2,500§! manpower when it ends."
 wif_rku_tt_34:0 "The next Ukrainian Resistance raid comes §G20 days later§!."
 wif_rku_tt_35:0 "The SME's §YArm the Ukrainian Partisans§! costs it 9,000 rifles instead of 7,000."
 wif_rku_tt_36:0 "Up to four states become Pacification Zones: §G+20§! compliance, and their compliance may rise to 55% instead of 35%."
 wif_rku_tt_37:0 "Ukrainian Resistance raids come §G15 days later§!, for good."
 wif_rku_tt_38:0 "Ukrainian Resistance raids come §G10 days later§!, for good."
 wif_rku_tt_39:0 "If Ukraine rises, Proskuriv's nationalists fight §Gfor us§! - for as long as we need them."
 wif_rku_tt_40:0 "Chase the Terrorists: success §G25%§! more likely. Unlocks the §YOrdnungspolizei Offensive§!."
 wif_large_ukrainian_resistance:0 "Large Ukrainian Resistance"
 wif_large_ukrainian_resistance_doubled:0 "Severe Ukrainian Resistance"
 wif_large_ukrainian_resistance_quintupled:0 "Devastating Ukrainian Resistance"
 wif_rku_settle_259:0 "Settle German Farmers in [259.GetName]"
 wif_rku_settle_259_desc:0 "Remove the Ukrainians from the farms of Poltava - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Poltava becomes a core."
 wif_rku_settle_203:0 "Settle German Farmers in [203.GetName]"
 wif_rku_settle_203_desc:0 "Remove the Ukrainians from the farms of Cherkasy - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Cherkasy becomes a core."
 wif_rku_settle_221:0 "Settle German Farmers in [221.GetName]"
 wif_rku_settle_221_desc:0 "Remove the Ukrainians from the farms of Kharkov - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Kharkov becomes a core."
 wif_rku_settle_226:0 "Settle German Farmers in [226.GetName]"
 wif_rku_settle_226_desc:0 "Remove the Ukrainians from the farms of Dnipropetrovsk - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Dnipropetrovsk becomes a core."
 wif_rku_settle_200:0 "Settle German Farmers in [200.GetName]"
 wif_rku_settle_200_desc:0 "Remove the Ukrainians from the farms of Zaporozhe - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Zaporozhe becomes a core."
 wif_rku_settle_196:0 "Settle German Farmers in [196.GetName]"
 wif_rku_settle_196_desc:0 "Remove the Ukrainians from the farms of Kherson - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Kherson becomes a core."
 wif_rku_settle_197:0 "Settle German Farmers in [197.GetName]"
 wif_rku_settle_197_desc:0 "Remove the Ukrainians from the farms of Mykolaiv - by deportation, labour drafts and hunger - and give the land to German settlers. After 90 days Mykolaiv becomes a core."
 wif_rku_settle_tt:0 "§R60,000§! people removed from the state. The next Ukrainian Resistance raid comes §R10 days sooner§!."
 wif_rku_extra_grain:0 "Send Extra Grain to the Reich"
 wif_rku_extra_grain_desc:0 "Empty the collection points into the trains west. The shops in Germany stay full a little longer. The villages here do not."
 wif_rku_extra_grain_tt:0 "For 180 days §YGermany§!'s Facade Economy consumer goods rise §G0.25§! points a month slower (§G0.35§! with The Hunger Plan).\nWe lose §R10,000§! manpower (§R15,000§! with The Hunger Plan; a quarter less with Every Train Goes West) and §R5%§! stability, Hunger grows a level, and the next Ukrainian Resistance raid comes §R15 days sooner§!."
 wif_arm_ukrainian_partisans:0 "Arm the Ukrainian Partisans"
 wif_arm_ukrainian_partisans_desc:0 "7,000 rifles go south-west, to the forests of Volhynia and Chernigov. The next raid on the Reichskommissariat comes in half the time."
 wif_arm_ukrainian_partisans_heavy:0 "Arm the Ukrainian Partisans"
 wif_arm_ukrainian_partisans_heavy_desc:0 "9,000 rifles go south-west, to the forests of Volhynia and Chernigov. The next raid on the Reichskommissariat comes in half the time."
 wif_arm_ukrainian_partisans_tt:0 "§YThe time until Reichskommissariat Ukraine's next raid is halved§!"
 wif_ukr_war_UKS_UKR:0 "Unite Ukraine: War on the Republic of Ukraine"
 wif_ukr_war_UKS_UKR_desc:0 "The Republic of Ukraine refused to join us. Ukraine will have one government, and it will be ours."
 wif_ukr_war_UKS_UNS:0 "Unite Ukraine: War on the Ukrainian National State"
 wif_ukr_war_UKS_UNS_desc:0 "The Ukrainian National State refused to join us. Ukraine will have one government, and it will be ours."
 wif_ukr_war_UNS_UKS:0 "Unite Ukraine: War on the Ukrainian Socialist Republic"
 wif_ukr_war_UNS_UKS_desc:0 "The Ukrainian Socialist Republic refused to join us. Ukraine will have one government, and it will be ours."
 wif_rku_chase_terrorists:0 "Chase the Terrorists"
 wif_rku_breadbasket_category:0 "The Breadbasket"
 wif_rku_breadbasket_category_desc:0 "Ukraine's grain and land, for the Reich. Next Ukrainian Resistance raid in [?ROOT.wif_rku_terror_days|0] days."
 wif_ukr_unification_category:0 "One Ukraine"
 wif_ukr_unification_category_desc:0 "The Reichskommissariat has fallen, and not every Ukrainian government will accept ours."
 wif_rku.25.t:0 "Complete Success"
 wif_rku.25.desc:0 "Our forces achieved a decisive victory against the partisans in [event_target:partisan_state.GetName]. The terrorist cell has been completely destroyed, the region is stabilised, and the next attack has been significantly delayed."
 wif_rku.25.a:0 "Excellent work!"
 wif_rku.26.t:0 "The Terrorists Got Away But Region Stabilised"
 wif_rku.26.desc:0 "Our forces swept through [event_target:partisan_state.GetName] and restored order, but the partisan leaders managed to escape into the countryside. The region is stable for now, though the threat remains."
 wif_rku.26.a:0 "At least the region is secure."
 wif_rku.27.t:0 "Harsh Battle"
 wif_rku.27.desc:0 "The operation in [event_target:partisan_state.GetName] turned into a brutal engagement. We took significant casualties but managed to clear the area. The region is stabilised, though at great cost."
 wif_rku.27.a:0 "A pyrrhic victory."
 wif_rku.28.t:0 "Failed to Pursue"
 wif_rku.28.desc:0 "Our forces deployed to [event_target:partisan_state.GetName] but failed to locate the partisan cells. The terrorists remain at large and the region continues to suffer from their presence."
 wif_rku.28.a:0 "They will not escape forever."
 wif_rku.29.t:0 "Forces Routed"
 wif_rku.29.desc:0 "The operation in [event_target:partisan_state.GetName] was a disaster. Our forces walked into an ambush and were routed by the partisans. The terrorists are now emboldened and their grip on the region has tightened considerably."
 wif_rku.29.a:0 "This is humiliating."
 wif_rku.30.t:0 "Total Defeat"
 wif_rku.30.desc:0 "Catastrophe in [event_target:partisan_state.GetName]. Our entire force was annihilated by a well-coordinated partisan offensive. None of the 10,000 men returned. The region has been lost to the terrorists, who have declared it a liberated zone. Emboldened partisans across the Reichskommissariat are accelerating their attacks."
 wif_rku.30.a:0 "God help us..."
 wif_rku.31.t:0 "Demilitarization Lifted"
 wif_rku.31.desc:0 "The demilitarized zone has been lifted. Our forces can once again operate in the formerly contested area."
 wif_rku.31.a:0 "Resume operations."
 wif_rku.20.t:0 "Ukrainian Resistance Raid"
 wif_rku.20.desc:0 "On [GetDateText], the Ukrainian Resistance struck in [terror_attack_state.GetName]. Railway lines and factories were blown up, and garrison troops and civilians killed."
 wif_rku.20.a:0 "Find them."
 wif_rku.5.t:0 "Resettlement Request from Reichskommissariat Ukraine"
 wif_rku.5.desc:0 "Reichskommissar Koch wants Kiev emptied and resettled with Germans. He lacks the men and the rifles to do it, and asks for 10,000 men and 12,000 infantry weapons - and for settlers taken from the Reich."
 wif_rku.5.a:0 "Send them. Kiev will be German."
 wif_rku.5.b:0 "We cannot spare them."
 wif_rku.6.t:0 "Resettlement Request Denied"
 wif_rku.6.desc:0 "Berlin will not send the men or the rifles. Kiev's resettlement will have to wait until we have them ourselves."
 wif_rku.6.a:0 "We will find another way."
 wif_rku.10.t:0 "Kiev Resettled"
 wif_rku.10.desc:0 "Kiev has been emptied. Over half its people have been deported to the Reich, sent to the labour camps, starved behind the checkpoints or shot at Babi Yar. German officials, families and their servants are moving into the empty flats. The city is ours."
 wif_rku.10.a:0 "Kiev belongs to the Reich."
 wif_rku.40.t:0 "Ukraine Rises"
 wif_rku.40.desc:0 "With Moscow lost, the Reichskommissariat Ukraine is coming apart. The Republic of Ukraine has been proclaimed in Chernigov, Sumy and Poltava; the Ukrainian Socialist Republic in the Donbas; a National Farmers State in Mykolaiv. In Proskuriv the nationalists are in arms - for Koch, or against him."
 wif_rku.40.a:0 "Ukraine is not dead yet."
 wif_rku.41.t:0 "The Reichskommissariat Falls"
 wif_rku.41.desc:0 "Reichskommissariat Ukraine has capitulated. The partisan governments have cut it up between them, each keeping what its militias hold - and the rest has gone to whichever of them did most to bring Koch down."
 wif_rku.41.a:0 "Ukraine is free - for now."
 wif_rku.42.t:0 "Who Speaks for Ukraine?"
 wif_rku.42.desc:0 "The largest of Ukraine's new governments has called on the others to join it. Some have; those who refused may yet have to be made to."
 wif_rku.42.a:0 "One Ukraine, or several."
 wif_rku.45.t:0 "The Reichskommissariat Returns"
 wif_rku.45.desc:0 "There will be no peace conference. The reunited Reich has crushed the Ukrainian rising and handed its land straight back to a re-established Reichskommissariat."
 wif_rku.45.a:0 "Order is restored."
 wif_rku.46.t:0 "The Auxiliaries Disarmed"
 wif_rku.46.desc:0 "With the last partisan government destroyed, the Ukrainian nationalist militias that fought for us in Proskuriv are no longer needed. They were disarmed at dawn; their officers were shot."
 wif_rku.46.a:0 "They were never allies."
