l_english:
 wif_vic_le_marechal:0 "Le Maréchal"
 wif_vic_le_marechal_desc:0 "France has lost the war. The Third Republic voted itself out of existence in a casino theatre in Vichy, and handed everything to an eighty-four-year-old Marshal who won the last war at Verdun."
 wif_vic_constitutional_acts:0 "The Constitutional Acts"
 wif_vic_constitutional_acts_desc:0 "Act No. 1: Philippe Pétain is Chief of the French State. The Republic is not abolished. It is simply never mentioned again."
 wif_vic_travail_famille_patrie:0 "Travail, Famille, Patrie"
 wif_vic_travail_famille_patrie_desc:0 "Liberty, Equality, Fraternity are chiselled off the town halls. Work, Family, Fatherland go up in their place."
 wif_vic_legion_des_combattants:0 "The Legion of Veterans"
 wif_vic_legion_des_combattants_desc:0 "Every veteran of 1914 a member, every village a branch, every branch loyal to the Marshal."
 wif_vic_riom_trial:0 "The Riom Trial"
 wif_vic_riom_trial_desc:0 "Blum, Daladier and Gamelin in the dock for losing the war. The trial is meant to prove the Republic's guilt; it may prove something else."
 wif_vic_who_governs_vichy:0 "Who Governs at Vichy?"
 wif_vic_who_governs_vichy_desc:0 "The Marshal reigns. Someone else has to govern."
 wif_vic_laval_returns:0 "Laval Returns"
 wif_vic_laval_returns_desc:0 "Pierre Laval believes Germany has won and that France's only future is in Hitler's Europe. He intends to be first in line."
 wif_vic_darlans_government:0 "Darlan's Government"
 wif_vic_darlans_government_desc:0 "Admiral Darlan holds the one card France has left: the fleet. He means to bargain with it, with Berlin and with everyone else."
 wif_vic_the_milice:0 "The Milice"
 wif_vic_the_milice_desc:0 "Darnand's political police, in black berets, for hunting the Resistance where the Germans cannot be bothered to."
 wif_vic_fleet_in_being:0 "The Fleet in Being"
 wif_vic_fleet_in_being_desc:0 "The fleet at Toulon is the strongest thing France owns. It will sail for nobody - and everybody knows it could."
 wif_vic_the_french_state:0 "The French State"
 wif_vic_the_french_state_desc:0 "A state without a republic, a government without a parliament, an army without a war. It works, after a fashion."
 wif_vic_the_empire_holds:0 "The Empire Holds"
 wif_vic_the_empire_holds_desc:0 "Metropolitan France is half occupied. The Empire is not. Dakar, Algiers, Beirut, Hanoi: as long as they fly the tricolour, France is still a great power."
 wif_vic_dakar_must_not_fall:0 "Dakar Must Not Fall"
 wif_vic_dakar_must_not_fall_desc:0 "The British and de Gaulle came to Dakar in September 1940 and were driven off. They will come again."
 wif_vic_weygand_in_algiers:0 "Weygand in Algiers"
 wif_vic_weygand_in_algiers_desc:0 "General Weygand, Delegate-General in North Africa, quietly rebuilds the Army of Africa behind the armistice commission's back."
 wif_vic_the_levant_army:0 "The Army of the Levant"
 wif_vic_the_levant_army_desc:0 "General Dentz holds Syria and Lebanon with 35,000 men, and the British in Palestine and Iraq have noticed."
 wif_vic_decoux_in_indochina:0 "Decoux in Indochina"
 wif_vic_decoux_in_indochina_desc:0 "Admiral Decoux governs Indochina with 30,000 men, no reinforcements and the Japanese army on the border."
 wif_vic_west_african_army:0 "The West African Army"
 wif_vic_west_african_army_desc:0 "Senegalese tirailleurs, the backbone of the colonial army, re-equipped from Dakar's arsenal."
 wif_vic_army_of_africa:0 "The Army of Africa"
 wif_vic_army_of_africa_desc:0 "Officially 120,000 men. Unofficially rather more, hidden as labour companies and police."
 wif_vic_dentz_holds:0 "Dentz Holds the Levant"
 wif_vic_dentz_holds_desc:0 "Beirut will not be handed to the British without a fight."
 wif_vic_bend_to_tokyo:0 "Bend to Tokyo"
 wif_vic_bend_to_tokyo_desc:0 "Japanese troops may use Tonkin's airfields and railways. In return, the French flag stays up in Hanoi."
 wif_vic_madagascar_garrison:0 "The Madagascar Garrison"
 wif_vic_madagascar_garrison_desc:0 "Diego-Suarez is the best harbour on the Indian Ocean, and the British want it."
 wif_vic_hunt_the_gaullists:0 "Hunt the Gaullists"
 wif_vic_hunt_the_gaullists_desc:0 "Chad, Cameroon and Equatorial Africa went over to de Gaulle in 1940. They can be brought back."
 wif_vic_overseas_squadrons:0 "The Overseas Squadrons"
 wif_vic_overseas_squadrons_desc:0 "Admiral Robert's carrier at Martinique, Godfroy's cruisers at Alexandria, the gold in Fort-de-France: scattered, but still French."
 wif_vic_the_empire_endures:0 "The Empire Endures"
 wif_vic_the_empire_endures_desc:0 "Three years of war, and the Empire has not fallen. Whatever the peace brings, France comes to the table with a world behind it."
 wif_vic_montoire:0 "Montoire"
 wif_vic_montoire_desc:0 "The Marshal shakes Hitler's hand at a railway station in the Loir-et-Cher. 'I enter today upon the path of collaboration.'"
 wif_vic_occupation_costs:0 "Negotiate the Occupation Costs"
 wif_vic_occupation_costs_desc:0 "Four hundred million francs a day, for the privilege of being occupied. Perhaps it can be three hundred."
 wif_vic_paris_protocols:0 "The Paris Protocols"
 wif_vic_paris_protocols_desc:0 "Bizerte, Dakar and the Syrian airfields for German use, in exchange for concessions that never quite arrive."
 wif_vic_the_releve:0 "La Relève"
 wif_vic_the_releve_desc:0 "Three workers to Germany for every prisoner of war who comes home."
 wif_vic_german_contracts:0 "German Contracts"
 wif_vic_german_contracts_desc:0 "French factories work for German orders. Better German orders than no orders at all."
 wif_vic_the_lvf:0 "The Legion of French Volunteers"
 wif_vic_the_lvf_desc:0 "Doriot and Déat send French volunteers in German uniform to fight Bolshevism in Russia."
 wif_vic_the_sto:0 "Compulsory Labour Service"
 wif_vic_the_sto_desc:0 "Volunteering was not enough. Young men are now conscripted for German factories, and many take to the hills instead."
 wif_vic_workshop_of_the_reich:0 "Workshop of the Reich"
 wif_vic_workshop_of_the_reich_desc:0 "Renault builds trucks for the Wehrmacht, Gnome-Rhône builds aero engines. The war economy runs through France."
 wif_vic_a_place_at_the_table:0 "A Place at the Victors' Table"
 wif_vic_a_place_at_the_table_desc:0 "When the peace comes, France must sit with the victors, not on the menu."
 wif_vic_la_paix_allemande:0 "La Paix Allemande"
 wif_vic_la_paix_allemande_desc:0 "The Americans have made peace, Britain has a Reichsprotektor, and the war in the west is over. The German peace has come to France."
 wif_vic_return_to_paris:0 "The Return to Paris"
 wif_vic_return_to_paris_desc:0 "The occupied zone is handed back: Paris, the north and the Atlantic coast, everything but Alsace-Lorraine. The government leaves the spa town for the capital."
 wif_vic_prisoners_come_home:0 "The Prisoners Come Home"
 wif_vic_prisoners_come_home_desc:0 "A million and a half men, five years in German camps, coming home on the same trains that took them."
 wif_vic_rebuild_the_north:0 "Rebuild the North"
 wif_vic_rebuild_the_north_desc:0 "Lille, Rouen, Calais: bombed by both sides and stripped by one."
 wif_vic_a_new_constitution:0 "A New Constitution"
 wif_vic_a_new_constitution_desc:0 "The Marshal's constitution, drafted in 1944 and never promulgated, is promulgated."
 wif_vic_the_grossraum:0 "The Grossraumwirtschaft"
 wif_vic_the_grossraum_desc:0 "France is a province of the German economic sphere: coal from the Ruhr, iron from Lorraine, wheat from the Beauce, all priced in Reichsmarks."
 wif_vic_empire_trade:0 "Imperial Preference"
 wif_vic_empire_trade_desc:0 "What the Reich does not want, the Empire can buy: Algerian wine, Moroccan phosphate, Indochinese rubber."
 wif_vic_workshop_of_new_europe:0 "Workshop of the New Europe"
 wif_vic_workshop_of_new_europe_desc:0 "French engineering, German capital, European markets. The Marshal's ministers call it partnership."
 wif_vic_the_marshal_grows_old:0 "The Marshal Grows Old"
 wif_vic_the_marshal_grows_old_desc:0 "Pétain is ninety. His mind wanders in the afternoons, and every faction at Vichy has noticed."
 wif_vic_successor_laval:0 "Laval Succeeds"
 wif_vic_successor_laval_desc:0 "The collaborator's collaborator, Chief of State at last."
 wif_vic_successor_doriot:0 "Doriot Succeeds"
 wif_vic_successor_doriot_desc:0 "Jacques Doriot, the communist who became a fascist, comes back from the Russian front to take power."
 wif_vic_successor_darlan:0 "Darlan Succeeds"
 wif_vic_successor_darlan_desc:0 "The admiral who kept the fleet now keeps the State."
 wif_vic_the_new_chief_of_state:0 "The New Chief of State"
 wif_vic_the_new_chief_of_state_desc:0 "The Marshal is dead. Long live the French State."
 wif_vic_the_requisition:0 "The Requisition"
 wif_vic_the_requisition_desc:0 "A letter from Himmler's office: Franche-Comté, Champagne and Picardy - the east of France - are German from today. Nobody in Berlin asked Vichy."
 wif_vic_protest_in_berlin:0 "Protest in Berlin"
 wif_vic_protest_in_berlin_desc:0 "The ambassador delivers a note. It is filed."
 wif_vic_accept_the_new_border:0 "Accept the New Border"
 wif_vic_accept_the_new_border_desc:0 "France has lost provinces before, and got them back."
 wif_vic_expelled_from_the_east:0 "Expelled from the East"
 wif_vic_expelled_from_the_east_desc:0 "The SS empties the requisitioned lands of anyone who will not be Germanised. They arrive at the new border with one suitcase each."
 wif_vic_black_order_on_our_border:0 "A Black Order on Our Border"
 wif_vic_black_order_on_our_border_desc:0 "Himmler has his Ordensstaat: Burgundy, a state run by the SS, on French soil and on France's frontier."
 wif_vic_close_the_frontier:0 "Close the Burgundian Frontier"
 wif_vic_close_the_frontier_desc:0 "Barbed wire and machine guns along a border that did not exist five years ago."
 wif_vic_burgundian_refugees:0 "The Burgundian Refugees"
 wif_vic_burgundian_refugees_desc:0 "Not everyone the SS rules wants to be ruled by the SS. Those who can, cross over to us."
 wif_vic_claims_on_burgundy:0 "French Soil Is French"
 wif_vic_claims_on_burgundy_desc:0 "Franche-Comté, Champagne, Picardy, Alsace-Lorraine. One day."
 wif_vic_the_reich_burns:0 "The Reich Burns"
 wif_vic_the_reich_burns_desc:0 "Berlin is at war with itself. For the first time since 1940, nobody in Germany has time for France."
 wif_vic_sovereignty_restored:0 "Sovereignty Restored"
 wif_vic_sovereignty_restored_desc:0 "The armistice commission has gone home. The garrisons have marched east to fight each other. France governs itself again."
 wif_vic_stay_in_the_axis:0 "The Axis Is Our Shield"
 wif_vic_stay_in_the_axis_desc:0 "Leaving the alliance would be easy. Surviving without it would not. Without the Reich's remaining allies behind us, de Gaulle comes back - and he will not come alone."
 wif_vic_the_gaullist_rising:0 "The Gaullist Rising"
 wif_vic_the_gaullist_rising_desc:0 "Brittany, Normandy and the Loire rise for Free France the moment the Germans leave. It was always going to happen."
 wif_vic_the_army_reborn:0 "The Army Reborn"
 wif_vic_the_army_reborn_desc:0 "No armistice limits, no German inspectors. The armée de l'armistice becomes the French Army again."
 wif_vic_crush_free_france:0 "Crush Free France"
 wif_vic_crush_free_france_desc:0 "The Gaullists hold the west. The French State holds everything else."
 wif_vic_reclaim_burgundy:0 "Reclaim Burgundy"
 wif_vic_reclaim_burgundy_desc:0 "The SS state is fighting for its life against the Wehrmacht. Its western flank is open."
 wif_vic_leave_burgundy_be:0 "Leave Burgundy Be"
 wif_vic_leave_burgundy_be_desc:0 "The SS can keep its black castle in the east. France has bled enough, and the men in Dijon have nothing left to lose."
 wif_vic_la_france_seule:0 "La France Seule"
 wif_vic_la_france_seule_desc:0 "France alone - Maurras' old slogan, now a fact. Ten years after the defeat, the French State stands on its own feet."
 wif_vic_national_revolution:0 "The National Revolution"
 wif_vic_national_revolution_desc:0 "Work, Family, Fatherland: the Republic's motto chiselled off the town halls and the Marshal's put up in its place."
 wif_vic_laval_government:0 "Laval's Government"
 wif_vic_laval_government_desc:0 "Pierre Laval governs in the Marshal's name, and in Berlin's interest as much as France's."
 wif_vic_darlan_government:0 "Darlan's Government"
 wif_vic_darlan_government_desc:0 "An admiral governs France, and the fleet is the one card he means to keep."
 wif_vic_milice:0 "The Milice"
 wif_vic_milice_desc:0 "Darnand's political police hunt the Resistance where the Germans cannot be bothered to."
 wif_vic_fleet_at_toulon:0 "The Fleet at Toulon"
 wif_vic_fleet_at_toulon_desc:0 "The strongest thing France still owns. It sails for nobody, and everybody knows it could."
 wif_vic_imperial_garrisons:0 "The Imperial Garrisons"
 wif_vic_imperial_garrisons_desc:0 "Dakar, Algiers, Beirut, Hanoi. As long as they hold, France is still a great power."
 wif_vic_weygand:0 "Weygand's Army of Africa"
 wif_vic_weygand_desc:0 "Rebuilt quietly, behind the armistice commission's back."
 wif_vic_imperial_shield:0 "The Imperial Shield"
 wif_vic_imperial_shield_desc:0 "Three years of war, and the Empire has not fallen."
 wif_vic_german_orders:0 "German Orders"
 wif_vic_german_orders_desc:0 "French factories work for German contracts. Better German orders than no orders at all."
 wif_vic_german_sphere:0 "The German Sphere"
 wif_vic_german_sphere_desc:0 "Ruhr coal, Lorraine iron, Beauce wheat, all priced in Reichsmarks."
 wif_vic_imperial_preference:0 "Imperial Preference"
 wif_vic_imperial_preference_desc:0 "What the Reich does not want, the Empire buys."
 wif_vic_new_europe:0 "Workshop of the New Europe"
 wif_vic_new_europe_desc:0 "French engineering, German capital, European markets."
 wif_vic_laval_state:0 "Laval's State"
 wif_vic_laval_state_desc:0 "The collaborator's collaborator, Chief of State at last."
 wif_vic_admirals_state:0 "The Admiral's State"
 wif_vic_admirals_state_desc:0 "The admiral who kept the fleet now keeps the State."
 wif_vic_burgundian_frontier:0 "The Burgundian Frontier"
 wif_vic_burgundian_frontier_desc:0 "Barbed wire along a border that did not exist five years ago."
 wif_vic_against_the_gaullists:0 "Against the Gaullists"
 wif_vic_against_the_gaullists_desc:0 "The French State fights for the west of France."
 wif_vic_army_reborn:0 "The Army Reborn"
 wif_vic_army_reborn_desc:0 "No armistice limits, no German inspectors."
 wif_vic_collaboration:0 "Collaboration"
 wif_vic_contracts:0 "German Contracts"
 wif_vic_decoux:0 "Accommodation in Indochina"
 wif_vic_protest:0 "Protested the Requisition"
 wif_vic_axis_shield:0 "The Axis Is Our Shield"
 wif_vic_autonomy_loc:0 "The French State"
 wif_vic_elections_off_tt:0 "Elections are §Yabolished§!."
 wif_vic_dakar_tt:0 "In §YSenegal§!, if we own it: §G+1§! naval base and §G+2§! coastal forts."
 wif_vic_levant_tt:0 "§G+1§! fort level along the borders of §YSyria§! and §YLebanon§!, where we or our subjects hold them."
 wif_vic_madagascar_tt:0 "In §YMadagascar§!, if we own it: §G+1§! naval base and §G+2§! coastal forts."
 wif_vic_hunt_tt:0 "We gain §Yclaims§! on the colonies of §YFrench Equatorial Africa§! (Gabon, Middle Congo, Cameroon, Chad) that are held by someone else."
 wif_vic_antilles_tt:0 "§G+1§! naval base in the §YFrench Caribbean§!, if we own it."
 wif_vic_algeria_cores_tt:0 "We gain §Ycores§! on §YAlgeria§!."
 wif_vic_occupation_down_tt:0 "The §YOccupation Costs§! are reduced one step."
 wif_vic_occupation_gone_tt:0 "The §YOccupation Costs§! are §Gremoved§!."
 wif_vic_return_to_paris_tt:0 "§YGermany§! hands back every French state it owns, except §YAlsace-Lorraine§! and the states the SS requisitioned (§YFranche-Comte§!, §YChampagne§!, §YPicardy§!).\nOur capital moves to §YParis§!."
 wif_vic_north_infra_tt:0 "§G+1§! infrastructure in every northern state we own."
 wif_vic_border_forts_2_tt:0 "§G+2§! forts along every state we own that borders §YBurgundy§!."
 wif_vic_border_forts_1_tt:0 "§G+1§! fort along every state we own that borders §YBurgundy§!."
 wif_vic_burgundy_claims_tt:0 "We gain §Yclaims§! on every French state held by §YBurgundy§!."
 wif_vic_sovereignty_tt:0 "We are §Gno longer a German subject§!, but we §Ystay in the Axis§!: if leaving the subject relationship takes us out of the faction, the faction's leader takes us back at once."
 wif_vic_axis_shield_tt:0 "Every member of our faction gains §G+25§! opinion of us.\nIf we are in no faction (the German one broke apart in the civil war), we join the faction of the strongest remaining German ally."
 wif_vic_crush_ffr_tt:0 "If §YFree France§! exists and we are not already at war with it: a war goal to §Rannex§! it."
 wif_vic_reclaim_burgundy_tt:0 "If we are not already at war with §YBurgundy§!: a war goal to §Rannex§! it.\nWe gain §Yclaims§! on every French state it holds."
 wif_vic_leave_burgundy_tt:0 "§YBurgundy§! and we sign a §Ynon-aggression pact§!."
 wif_vic_requisition_trigger_tt:0 "§YGermany§! has requisitioned §YFranche-Comte§!, §YChampagne§! and §YPicardy§! from us"
 wif_vic_civil_war_trigger_tt:0 "The §YGerman civil war§! has begun"
 wif_vic_osb_no_nukes_tt:0 "§YBurgundy§! has §Yno nuclear weapons§!"
 wif_vic_war_in_the_west_tt:0 "The war in the west §Ygoes on§! (Germany has not yet won it)"
 wif_vic_west_won_tt:0 "The war in the west is §Ywon§!: the Anglo-American peace, or Germany's Totaler Sieg"
 wif_vic_burgundian_scientists:0 "Burgundian Refugees"
