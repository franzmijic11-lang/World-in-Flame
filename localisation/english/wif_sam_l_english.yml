l_english:
 wif_sam_battery:0 "SAM Battery"
 wif_sam_battery_plural:0 "SAM Batteries"
 wif_sam_battery_desc:0 "Radar, launchers and anti-aircraft guns. Each level adds air defence. While the national stockpile holds surface-to-air missiles, the battery raises the hit chance of all anti-air in the state; every week the state is attacked it uses §Y5§! missiles per level (§Y10§! against an enemy with 500+ planes). Radar-guided missiles are fired first."
 wif_sam_battery_tech:0 "SAM Battery"
 wif_sam_battery_tech_desc:0 "Unlocked by the Wasserfall project: the SAM Battery and the Heat-Seeking Surface-to-Air Missile."
 wif_rd_sam_tech:0 "Radar-Guided SAM Missiles"
 wif_rd_sam_tech_desc:0 "A ground radar tracks the target and steers the missile onto it. Unlike heat-seekers, it is not fooled by propeller planes or flares."
 wif_sam_fire_control:0 "SAM Fire Control"
 wif_sam.1.t:0 "Nuclear Missile Shot Down"
 wif_sam.1.d:0 "A nuclear missile aimed at [wif_sam_nuke_state.GetName] was destroyed in flight by a SAM battery. The warhead fell harmlessly short of its target."
 wif_sam.1.a:0 "Fortune favours the prepared."
 wif_hs_sam_equipment:0 "Heat-Seeking Surface-to-Air Missile"
 wif_hs_sam_equipment_short:0 "HS-SAM"
 wif_hs_sam_equipment_desc:0 "Homes in on engine heat. Deadly against early jets, but cool-running propeller planes and flares fool it."
 wif_hs_sam_equipment_1:0 "Heat-Seeking Surface-to-Air Missile I"
 wif_hs_sam_equipment_1_short:0 "HS-SAM I"
 wif_hs_sam_equipment_1_desc:0 "Homes in on engine heat. Deadly against early jets, but cool-running propeller planes and flares fool it."
 wif_rd_sam_equipment:0 "Radar-Guided Surface-to-Air Missile"
 wif_rd_sam_equipment_short:0 "RD-SAM"
 wif_rd_sam_equipment_desc:0 "Guided by a ground radar. Propellers and flares make no difference to it, only radar warning receivers do. Batteries fire these first."
 wif_rd_sam_equipment_1:0 "Radar-Guided Surface-to-Air Missile I"
 wif_rd_sam_equipment_1_short:0 "RD-SAM I"
 wif_rd_sam_equipment_1_desc:0 "Guided by a ground radar. Propellers and flares make no difference to it, only radar warning receivers do. Batteries fire these first."
