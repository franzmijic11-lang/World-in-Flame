l_english:
 wif_osb_the_ordensstaat:0 "Der Ordensstaat"
 wif_osb_the_ordensstaat_desc:0 "Burgundy belongs to the SS now: Franche-Comté, Champagne, Picardy, Alsace-Lorraine and the Belgian north, ruled from Strasbourg by Heinrich Himmler as Grand Master of an Order. It is a German satellite in name. In practice it answers to nobody."
 wif_osb_close_the_borders:0 "Close the Borders"
 wif_osb_close_the_borders_desc:0 "No one enters the Ordensstaat without a pass from the SS."
 wif_osb_internal_passports:0 "Internal Passports"
 wif_osb_internal_passports_desc:0 "A permit to live in a town, another to work in it, a third to visit the next one."
 wif_osb_ban_the_foreign_press:0 "Ban the Foreign Press"
 wif_osb_ban_the_foreign_press_desc:0 "Swiss papers, French radio, German newsreels: all forbidden."
 wif_osb_the_informant_network:0 "The Informant Network"
 wif_osb_the_informant_network_desc:0 "Every street has a man who reports on it."
 wif_osb_jam_the_airwaves:0 "Jam the Airwaves"
 wif_osb_jam_the_airwaves_desc:0 "Transmitters on every hill drown the BBC and Radio Paris in noise."
 wif_osb_the_block_wardens:0 "The Block Wardens"
 wif_osb_the_block_wardens_desc:0 "Every block has a warden, every warden a list."
 wif_osb_the_order_speaks:0 "The Order Speaks"
 wif_osb_the_order_speaks_desc:0 "One radio station, one newspaper, one voice."
 wif_osb_the_exit_ban:0 "The Exit Ban"
 wif_osb_the_exit_ban_desc:0 "Leaving the Ordensstaat is desertion, and desertion is death."
 wif_osb_shoot_on_the_border:0 "Orders to Fire"
 wif_osb_shoot_on_the_border_desc:0 "The border guards have their orders, and their orders have no exceptions."
 wif_osb_autarky_of_the_order:0 "Autarky of the Order"
 wif_osb_autarky_of_the_order_desc:0 "What the Order lacks, it does without."
 wif_osb_expel_the_foreigners:0 "Expel the Foreigners"
 wif_osb_expel_the_foreigners_desc:0 "Swiss, Belgians, Americans who stayed after the war: thirty days to leave."
 wif_osb_nothing_in:0 "Nothing In"
 wif_osb_nothing_in_desc:0 "Imports end. Not a ton of grain or a single newspaper crosses the frontier into the Order."
 wif_osb_nothing_out:0 "Nothing Out"
 wif_osb_nothing_out_desc:0 "Exports end too. The Order's steel and coal are for the Order."
 wif_osb_the_eternal_rationing:0 "The Eternal Rationing"
 wif_osb_the_eternal_rationing_desc:0 "Bread, potatoes and margarine, by card, for ever."
 wif_osb_the_closed_cities:0 "The Closed Cities"
 wif_osb_the_closed_cities_desc:0 "Strasbourg, Metz and Reims are closed to anyone without SS business there."
 wif_osb_the_last_train:0 "The Last Train"
 wif_osb_the_last_train_desc:0 "The last international train leaves Strasbourg for Basel, empty. The rails are lifted behind it."
 wif_osb_the_hermit_kingdom:0 "The Hermit Kingdom"
 wif_osb_the_hermit_kingdom_desc:0 "What happens inside the Ordensstaat is known only to those inside it. From outside it is a dark patch on the map between France and Germany."
 wif_osb_the_grand_master_ages:0 "The Grand Master Ages"
 wif_osb_the_grand_master_ages_desc:0 "Himmler is past seventy. His knights have begun to count."
 wif_osb_the_chosen_knight:0 "The Chosen Knight"
 wif_osb_the_chosen_knight_desc:0 "Himmler names one knight as his heir, and the others swear to him."
 wif_osb_the_council_of_knights:0 "The Council of Knights"
 wif_osb_the_council_of_knights_desc:0 "The twelve will rule together after him, as the Order's founders intended."
 wif_osb_the_burial_in_the_crypt:0 "The Burial in the Crypt"
 wif_osb_the_burial_in_the_crypt_desc:0 "The Grand Master is laid in the crypt above Strasbourg, under the Black Sun."
 wif_osb_the_order_endures:0 "The Order Endures"
 wif_osb_the_order_endures_desc:0 "The Order outlives its founder."
 wif_osb_festung_burgund:0 "Festung Burgund"
 wif_osb_festung_burgund_desc:0 "The Order trusts nobody: not France, not Switzerland, not the Reich that made it."
 wif_osb_the_western_line:0 "The Western Line"
 wif_osb_the_western_line_desc:0 "Facing France: concrete from the Somme to the Saône."
 wif_osb_the_rhine_line:0 "The Rhine Line"
 wif_osb_the_rhine_line_desc:0 "Facing the Reich. Nobody says why out loud."
 wif_osb_concrete_on_the_marne:0 "Concrete on the Marne"
 wif_osb_concrete_on_the_marne_desc:0 "The second line west, where the French stopped the Germans in 1914."
 wif_osb_the_rhine_bunkers:0 "The Rhine Bunkers"
 wif_osb_the_rhine_bunkers_desc:0 "Effect: +1 fort along the German border; +5% army defence for 2 years."
 wif_osb_the_jura_line:0 "The Jura Line"
 wif_osb_the_jura_line_desc:0 "The Swiss have their redoubt. The Order has its own."
 wif_osb_the_ardennes_line:0 "The Ardennes Line"
 wif_osb_the_ardennes_line_desc:0 "The forest that let the Wehrmacht through in 1940 will let nobody through again."
 wif_osb_anti_tank_ditches:0 "Anti-Tank Ditches"
 wif_osb_anti_tank_ditches_desc:0 "Dug by the labour camps, ten metres wide."
 wif_osb_the_first_belt:0 "The First Belt"
 wif_osb_the_first_belt_desc:0 "A belt of bunkers twenty kilometres behind the frontier."
 wif_osb_flak_towers:0 "The Flak Towers"
 wif_osb_flak_towers_desc:0 "Concrete towers bristling with guns over Strasbourg, Metz and Reims."
 wif_osb_the_second_belt:0 "The Second Belt"
 wif_osb_the_second_belt_desc:0 "And another behind the first."
 wif_osb_the_radar_chain:0 "The Radar Chain"
 wif_osb_the_radar_chain_desc:0 "Every aircraft over Europe is watched from the hills of the Order."
 wif_osb_the_iron_ring:0 "The Iron Ring"
 wif_osb_the_iron_ring_desc:0 "Burgundy is a fortress. Anyone who wants it will have to pay in a generation of dead."
 wif_osb_the_underground_order:0 "The Underground Order"
 wif_osb_the_underground_order_desc:0 "Command bunkers, tunnels and factories under the hills, beyond the reach of any bomb."
 wif_osb_guns_before_butter:0 "Guns Before Butter"
 wif_osb_guns_before_butter_desc:0 "The Order does not exist to feed its subjects."
 wif_osb_seize_the_factories:0 "Seize the Factories"
 wif_osb_seize_the_factories_desc:0 "Every factory in Burgundy is property of the Order."
 wif_osb_the_economic_office:0 "The SS Economic Office"
 wif_osb_the_economic_office_desc:0 "Pohl's office runs the factories, the mines and the camps as one enterprise."
 wif_osb_peugeot_at_sochaux:0 "Peugeot at Sochaux"
 wif_osb_peugeot_at_sochaux_desc:0 "The car works make half-tracks now."
 wif_osb_the_lorraine_steelworks:0 "The Lorraine Steelworks"
 wif_osb_the_lorraine_steelworks_desc:0 "Effect: +4 steel; +1 military factory."
 wif_osb_the_camp_enterprises:0 "The Camp Enterprises"
 wif_osb_the_camp_enterprises_desc:0 "The SS firms that work prisoners for profit."
 wif_osb_beyond_the_ceiling:0 "Beyond the Ceiling"
 wif_osb_beyond_the_ceiling_desc:0 "Other states must balance guns against goods because their people would revolt. Ours will not."
 wif_osb_the_dijon_works:0 "The Strasbourg Arms Works"
 wif_osb_the_dijon_works_desc:0 "Effect: +3 military factories."
 wif_osb_the_champagne_arsenal:0 "The Champagne Arsenal"
 wif_osb_the_champagne_arsenal_desc:0 "Shells instead of champagne."
 wif_osb_the_want_is_a_discipline:0 "The Want Is a Discipline"
 wif_osb_the_want_is_a_discipline_desc:0 "Shortages are not a problem to be solved but a discipline to be kept."
 wif_osb_no_want_permitted:0 "No Want Permitted"
 wif_osb_no_want_permitted_desc:0 "A people that wants nothing can be given nothing."
 wif_osb_waffen_ss_divisions:0 "Waffen-SS Divisions"
 wif_osb_waffen_ss_divisions_desc:0 "Effect: +10% army organisation."
 wif_osb_tank_works:0 "Tank Works of the Order"
 wif_osb_tank_works_desc:0 "Panthers built in Burgundy, for Burgundy."
 wif_osb_every_man_a_soldier:0 "Every Man a Soldier"
 wif_osb_every_man_a_soldier_desc:0 "Every citizen of the Order serves."
 wif_osb_the_panther_lines:0 "The Panther Lines"
 wif_osb_the_panther_lines_desc:0 "Effect: +2 military factories; research bonus for armour (50%, 2 uses)."
 wif_osb_arsenal_of_the_order:0 "The Arsenal of the Order"
 wif_osb_arsenal_of_the_order_desc:0 "The smallest state in Europe with one of its largest arsenals."
 wif_osb_the_racial_register:0 "The Racial Register"
 wif_osb_the_racial_register_desc:0 "Every inhabitant of the Ordensstaat is measured, photographed and classified."
 wif_osb_the_race_office:0 "The Race Office"
 wif_osb_the_race_office_desc:0 "The SS race office decides who is Germanic enough to be a citizen."
 wif_osb_the_expulsions:0 "The Expulsions"
 wif_osb_the_expulsions_desc:0 "Those the Order does not want and cannot use are driven over the border."
 wif_osb_germanic_or_not:0 "Germanic or Not"
 wif_osb_germanic_or_not_desc:0 "Those who pass are citizens. Those who fail lose every right a citizen has."
 wif_osb_trains_to_vichy:0 "Trains to Vichy"
 wif_osb_trains_to_vichy_desc:0 "Sealed trains, unloaded at the French border."
 wif_osb_the_labour_camps:0 "The Labour Camps"
 wif_osb_the_labour_camps_desc:0 "The non-citizens are put to work behind wire, in the quarries, mines and factories of the Order."
 wif_osb_slaves_for_the_forges:0 "Slaves for the Forges"
 wif_osb_slaves_for_the_forges_desc:0 "The arms works run on unpaid labour from the camps."
 wif_osb_destruction_through_labour:0 "Destruction Through Labour"
 wif_osb_destruction_through_labour_desc:0 "The SS has a name for working a prisoner until he dies of it. The camps of the Order use it as policy."
 wif_osb_the_camps_expand:0 "The Camps Expand"
 wif_osb_the_camps_expand_desc:0 "More wire, more barracks, more names on more lists."
 wif_osb_the_breeding_laws:0 "The Lebensborn Laws"
 wif_osb_the_breeding_laws_desc:0 "The citizens are to have children - many, and with the right partners."
 wif_osb_settlers_of_the_order:0 "Settlers of the Order"
 wif_osb_settlers_of_the_order_desc:0 "SS veterans and their families are given the farms of the expelled."
 wif_osb_the_lebensborn_homes:0 "The Lebensborn Homes"
 wif_osb_the_lebensborn_homes_desc:0 "Effect: +5% stability; +5% monthly population growth."
 wif_osb_the_veterans_farms:0 "The Veterans' Farms"
 wif_osb_the_veterans_farms_desc:0 "Effect: +15000 manpower; +5% stability."
 wif_osb_a_germanic_burgundy:0 "A Germanic Burgundy"
 wif_osb_a_germanic_burgundy_desc:0 "The census of the Ordensstaat lists citizens and no one else."
 wif_osb_the_last_census:0 "The Last Census"
 wif_osb_the_last_census_desc:0 "There is nobody left to classify."
 wif_osb_the_wunderwaffe_inheritance:0 "The Wunderwaffe Inheritance"
 wif_osb_the_wunderwaffe_inheritance_desc:0 "The SS ran the V-weapon programme in the war. The men who built the rockets answer to Himmler, not to Speer."
 wif_osb_peenemunde_men:0 "The Peenemünde Men"
 wif_osb_peenemunde_men_desc:0 "A dozen rocket engineers, 'invited' to Burgundy with their families."
 wif_osb_the_uranium_club:0 "The Uranium Club"
 wif_osb_the_uranium_club_desc:0 "The physicists the Reich forgot, given everything they ask for."
 wif_osb_the_test_range:0 "The Test Range"
 wif_osb_the_test_range_desc:0 "A valley in the Vosges, evacuated and fenced, where rockets fall."
 wif_osb_heavy_water:0 "Heavy Water"
 wif_osb_heavy_water_desc:0 "Effect: research bonus for nuclear technology."
 wif_osb_rocket_sites_in_the_vosges:0 "Rocket Sites in the Vosges"
 wif_osb_rocket_sites_in_the_vosges_desc:0 "Launch sites tunnelled into the mountains."
 wif_osb_the_reactor_pile:0 "The Reactor Pile"
 wif_osb_the_reactor_pile_desc:0 "Effect: +1 nuclear reactor in Champagne."
 wif_osb_long_range_rockets:0 "Long-Range Rockets"
 wif_osb_long_range_rockets_desc:0 "From the V-2 to rockets with ten times its range."
 wif_osb_the_reactor_goes_critical:0 "The Reactor Goes Critical"
 wif_osb_the_reactor_goes_critical_desc:0 "Effect: completes the Nuclear Reactor special project."
 wif_osb_range_to_london:0 "Range to London"
 wif_osb_range_to_london_desc:0 "A rocket from the Vosges can reach London now. The Reichsprotektor there has been informed."
 wif_osb_the_bomb_of_the_order:0 "The Bomb of the Order"
 wif_osb_the_bomb_of_the_order_desc:0 "Effect: completes the Nuclear Bomb special project; +3 nuclear bombs."
 wif_osb_the_warheads:0 "The Warheads"
 wif_osb_the_warheads_desc:0 "A bomb small enough to sit on a rocket."
 wif_osb_the_silos:0 "The Silos"
 wif_osb_the_silos_desc:0 "Concrete shafts in the forests, each with a rocket standing in it."
 wif_osb_thermonuclear_fire:0 "Thermonuclear Fire"
 wif_osb_thermonuclear_fire_desc:0 "Effect: completes the Thermonuclear Bomb special project; +3 nuclear bombs."
 wif_osb_the_argonne_field:0 "The Argonne Field"
 wif_osb_the_argonne_field_desc:0 "A second field of silos, in the forest where the last war was fought."
 wif_osb_the_hydrogen_test:0 "The Hydrogen Test"
 wif_osb_the_hydrogen_test_desc:0 "Effect: +3 nuclear bombs; spirit 'The Hydrogen Programme' (+10% nuclear production)."
 wif_osb_the_intercontinental_rocket:0 "The Intercontinental Rocket"
 wif_osb_the_intercontinental_rocket_desc:0 "Effect: completes the Long-Range Ballistic Missile special project."
 wif_osb_range_to_new_york:0 "Range to New York"
 wif_osb_range_to_new_york_desc:0 "A rocket that can reach New York."
 wif_osb_cheap_fire:0 "Cheap Fire"
 wif_osb_cheap_fire_desc:0 "A nuclear strike is no longer a decision for the Grand Master. It is a procedure."
 wif_osb_first_strike_doctrine:0 "The First Strike Doctrine"
 wif_osb_first_strike_doctrine_desc:0 "Whoever strikes second does not strike at all."
 wif_osb_the_black_sun_arsenal:0 "The Black Sun Arsenal"
 wif_osb_the_black_sun_arsenal_desc:0 "Enough fire to burn Europe twice over, and a Grand Master who believes it was foretold."
 wif_osb_the_grand_master:0 "The Grand Master"
 wif_osb_the_grand_master_desc:0 "Himmler never wanted to be a minister. He wanted to be the head of an order of knights. Now he is."
 wif_osb_the_ahnenerbe:0 "The Ahnenerbe"
 wif_osb_the_ahnenerbe_desc:0 "The SS ancestral research office moves to Burgundy, with its archaeologists, runologists and astrologers."
 wif_osb_a_new_wewelsburg:0 "A New Wewelsburg"
 wif_osb_a_new_wewelsburg_desc:0 "Himmler builds a castle above Strasbourg greater than the Wewelsburg he left in the Reich."
 wif_osb_the_rune_scholars:0 "The Rune Scholars"
 wif_osb_the_rune_scholars_desc:0 "Runes on the uniforms, on the banknotes, on the gravestones."
 wif_osb_the_crypt_of_twelve:0 "The Crypt of the Twelve"
 wif_osb_the_crypt_of_twelve_desc:0 "Beneath the hall, a crypt with twelve seats around an empty well."
 wif_osb_the_thule_inheritance:0 "The Thule Inheritance"
 wif_osb_the_thule_inheritance_desc:0 "The old Thule Society's lore becomes the doctrine of the Order."
 wif_osb_knights_of_the_order:0 "Knights of the Order"
 wif_osb_knights_of_the_order_desc:0 "Twelve SS generals sworn as knights at a round table."
 wif_osb_the_black_sun:0 "The Black Sun"
 wif_osb_the_black_sun_desc:0 "The twelve-rayed sun is set in the marble of the Grand Master's hall."
 wif_osb_hyperborea:0 "The Hyperborea Expedition"
 wif_osb_hyperborea_desc:0 "An expedition sails north to find the lost homeland of the Aryans in the ice."
 wif_osb_agartha:0 "The Road to Agartha"
 wif_osb_agartha_desc:0 "Somewhere beneath Tibet, the Grand Master believes, lies the underground kingdom of Agartha and the source of all power."
 wif_osb_into_the_ice:0 "Into the Ice"
 wif_osb_into_the_ice_desc:0 "The Hyperborea expedition winters in Greenland. It finds ice."
 wif_osb_through_persia:0 "Through Persia"
 wif_osb_through_persia_desc:0 "The Agartha expedition crosses Turkey and Persia looking for the entrance."
 wif_osb_the_hollow_earth:0 "The Hollow Earth"
 wif_osb_the_hollow_earth_desc:0 "The expeditions return - those that return - with stories the Grand Master chooses to believe."
 wif_osb_the_solstice_rites:0 "The Solstice Rites"
 wif_osb_the_solstice_rites_desc:0 "Fire on every hilltop of the Order on the longest night."
 wif_osb_himmler_ascends:0 "The Grand Master Ascends"
 wif_osb_himmler_ascends_desc:0 "Himmler no longer speaks of politics, only of destiny, rebirth and the coming age. The Order obeys a prophet now."
 wif_osb_the_reich_burns:0 "The Reich Burns"
 wif_osb_the_reich_burns_desc:0 "Berlin is at war with itself. The Order owes it nothing."
 wif_osb_leave_the_axis:0 "Leave the Axis"
 wif_osb_leave_the_axis_desc:0 "The Order was never anyone's ally. Now it is nobody's satellite."
 wif_osb_no_allies_no_masters:0 "No Allies, No Masters"
 wif_osb_no_allies_no_masters_desc:0 "The Order will never join another alliance."
 wif_osb_pacts_of_silence:0 "Pacts of Silence"
 wif_osb_pacts_of_silence_desc:0 "Non-aggression with every neighbour. Not friendship - silence."
 wif_osb_hatred_of_all_nations:0 "Hatred of All Nations"
 wif_osb_hatred_of_all_nations_desc:0 "Every nation outside the Order is decadent, mongrel or weak."
 wif_osb_guns_outward:0 "Turn the Guns Outward"
 wif_osb_guns_outward_desc:0 "Effect: +10% army attack and defence; +10% war support."
 wif_osb_trust_no_treaty:0 "Trust No Treaty"
 wif_osb_trust_no_treaty_desc:0 "The pacts are signed. Nobody in Strasbourg expects them to be kept."
 wif_osb_the_order_alone:0 "The Order Alone"
 wif_osb_the_order_alone_desc:0 "No masters, no allies, no friends. Exactly as the Grand Master wanted."
 wif_osb_the_landwehr_of_the_order:0 "The Landwehr of the Order"
 wif_osb_the_landwehr_of_the_order_desc:0 "Every village of the Order raises its own company: farmers and clerks with a rifle, an armband and an SS sergeant. Himmler trusts a fanatic more than a conscript."
 wif_osb_junkerschule_cadres:0 "Junkerschule Cadres"
 wif_osb_junkerschule_cadres_desc:0 "Officers from the SS Junkerschulen take over the Landwehr companies and drill them to the standard of the line."
 wif_osb_fanatics_of_the_order:0 "Fanatics of the Order"
 wif_osb_fanatics_of_the_order_desc:0 "The Landwehr man fights for his own village, his own farm and his own Grand Master. He does not surrender, because he knows what the Order does to those who do."
 wif_osb_closed_borders:0 "Closed Borders"
 wif_osb_closed_borders_desc:0 "No one enters the Ordensstaat without a pass from the SS."
 wif_osb_nothing_in_idea:0 "Nothing In"
 wif_osb_nothing_in_idea_desc:0 "Not a ton of grain or a single newspaper crosses the frontier."
 wif_osb_nothing_out_idea:0 "Nothing In, Nothing Out"
 wif_osb_nothing_out_idea_desc:0 "The Order's steel and coal are for the Order."
 wif_osb_pass_system:0 "The Pass System"
 wif_osb_pass_system_desc:0 "A permit to live in a town, another to work in it, a third to visit the next one."
 wif_osb_pass_system_2:0 "The Pass System"
 wif_osb_pass_system_2_desc:0 "Every block has a warden, every warden a list."
 wif_osb_informants:0 "The Informant Network"
 wif_osb_informants_desc:0 "Every street has a man who reports on it."
 wif_osb_exit_ban:0 "The Exit Ban"
 wif_osb_exit_ban_desc:0 "Leaving the Ordensstaat is desertion, and desertion is death."
 wif_osb_autarky:0 "Autarky of the Order"
 wif_osb_autarky_desc:0 "What the Order lacks, it does without."
 wif_osb_eternal_rationing:0 "The Eternal Rationing"
 wif_osb_eternal_rationing_desc:0 "Bread, potatoes and margarine, by card, for ever."
 wif_osb_closed_cities:0 "The Closed Cities"
 wif_osb_closed_cities_desc:0 "Closed to anyone without SS business there."
 wif_osb_hermit_kingdom:0 "The Hermit Kingdom"
 wif_osb_hermit_kingdom_desc:0 "A dark patch on the map between France and Germany."
 wif_osb_council_of_knights:0 "The Council of Knights"
 wif_osb_council_of_knights_desc:0 "The twelve rule together."
 wif_osb_rhine_garrison:0 "The Rhine Garrison"
 wif_osb_rhine_garrison_desc:0 "Facing the Reich."
 wif_osb_tank_ditches:0 "Anti-Tank Ditches"
 wif_osb_tank_ditches_desc:0 "Ten metres wide, dug by the camps."
 wif_osb_iron_ring:0 "The Iron Ring"
 wif_osb_iron_ring_desc:0 "Anyone who wants Burgundy will pay in a generation of dead."
 wif_osb_underground:0 "The Underground Order"
 wif_osb_underground_desc:0 "Command bunkers and factories beyond the reach of any bomb."
 wif_osb_economic_office:0 "The SS Economic Office"
 wif_osb_economic_office_desc:0 "Factories, mines and camps run as one enterprise."
 wif_osb_camp_enterprises:0 "The Camp Enterprises"
 wif_osb_camp_enterprises_desc:0 "SS firms that work prisoners for profit."
 wif_osb_want_1:0 "The Want Is a Discipline"
 wif_osb_want_1_desc:0 "Shortages are a discipline to be kept."
 wif_osb_want_2:0 "No Want Permitted"
 wif_osb_want_2_desc:0 "A people that wants nothing can be given nothing."
 wif_osb_waffen_ss:0 "The Waffen-SS of the Order"
 wif_osb_waffen_ss_desc:0 "Every man of the Order a soldier."
 wif_osb_every_man:0 "Every Man a Soldier"
 wif_osb_every_man_desc:0 "Every citizen of the Order serves."
 wif_osb_arsenal:0 "Arsenal of the Order"
 wif_osb_arsenal_desc:0 "The smallest state in Europe with one of its largest arsenals."
 wif_osb_labour_camps:0 "The Labour Camps"
 wif_osb_labour_camps_desc:0 "The non-citizens work behind wire."
 wif_osb_labour_camps_2:0 "The Labour Camps"
 wif_osb_labour_camps_2_desc:0 "More wire, more barracks, more names on more lists."
 wif_osb_forced_labour:0 "Slaves for the Forges"
 wif_osb_forced_labour_desc:0 "The arms works run on unpaid labour from the camps."
 wif_osb_forced_labour_2:0 "Destruction Through Labour"
 wif_osb_forced_labour_2_desc:0 "Prisoners are worked until they die of it."
 wif_osb_lebensborn:0 "The Lebensborn Laws"
 wif_osb_lebensborn_desc:0 "The citizens are to have children."
 wif_osb_lebensborn_2:0 "The Lebensborn Homes"
 wif_osb_lebensborn_2_desc:0 "The citizens are to have children."
 wif_osb_germanic_burgundy:0 "A Germanic Burgundy"
