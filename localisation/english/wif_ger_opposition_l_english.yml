 GER_integrate_country_ugsr_england:0 "DSR England"
 GER_integrate_country_ugsr_scotland:0 "DSR Schottland"
 GER_integrate_country_ugsr_wales:0 "DSR Wales"
 GER_integrate_country_ugsr_netherlands:0 "DSR Niederlande"
 GER_integrate_country_ugsr_denmark:0 "DSR Dänemark"
 GER_integrate_country_ugsr_sweden:0 "DSR Schweden"
 GER_integrate_country_ugsr_norway:0 "DSR Norwegen"
 GER_integrate_country_ugsr_iceland:0 "DSR Island"
 GER_republican_sentiment:0 "Spirit of the 1918-19 Revolution"
 GER_republican_sentiment_desc:0 "While it may be unpopular among others, the Weimar Republic was the last truly legitimate government of [ROOT.GetNonIdeologyNameDef]. We should seek to restore it, even though it would anger much of those who fought to remove the National Socialists."
 GER_federation_compromise:0 "Confederation Compromise"
 GER_federation_compromise_desc:0 "By promising a significant amount of autonomy to the local states, we can appease much of the monarchist populace as it could give some representation to the old kings."
 GER_align_with_the_uk:0 "Align with [ENG.getnamedef]"
 GER_align_with_the_uk_desc:0 "Though relations with [ENG.getnamedef] have always been shaky, to say the least, we can still attempt to create an alliance with them. They are desperate for allies, after all, so why can't we let bygones be bygones?"
 GER_germany_leads:0 "Germany Leads"
 GER_germany_leads_desc:0 "We know more than any other nation of the dangers of rising radical ideology. Now that we have restored the grand institution of a democratic republic, we can position ourselves as the true leader of European democracy, and maybe even the whole free world."
 GER_join_the_allies:0 "Join the Allies"
 GER_join_the_allies_desc:0 "Now that we have rebuilt our relations with [ENG.getnamedef], we should now join their alliance, in our effort to protect democracy and freedom in Europe - and perhaps even the entire world!"
 GER_form_the_central_european_alliance:0 "Form a European Alliance"
 GER_form_the_central_european_alliance_desc:0 "The time has come for a new alliance of free European states. While the Brits waste their time protecting their rediculous imperial integrity, us on the continent can focus on protecting those good old democratic values on which we used to rely."
 GER_stressmans_legacy:0 "Legacy of Gustav Stresemann"
 GER_stressmans_legacy_desc:0 "We should honor former Chancellor Gustav Stresemann's legacy, as he was a proponent of liberal democracy while also being supportive of careful [ROOT.getadjective] expansionism. By following his lead, we can ensure a great future of [ROOT.getnamedef]."
 GER_anti_imperialism:0 "Stamp Out Imperial-Era Nationalism"
 GER_anti_imperialism_desc:0 "Even after the loss in the Great War, nationalist fervor and imperial revaunchism is rampant in the country. While a healthy dose of patriotism is a good thing, we cannot continue to be a pariah on the world stage."
 GER_officially_abandon_eastern_claims:0 "Officially Abandon Eastern Claims"
 GER_officially_abandon_eastern_claims_desc:0 "We must seek normalization of relations with our Eastern brothers, [POL.getnamedef] and [LIT.getnamedef]. A great way to do so would be by abandoning the claims that we used to have over their lands."
 GER_referendum_in_austria:0 "Referendum in [AUS.getnamedef]"
 GER_referendum_in_austria_desc:0 "We all know that the people of [AUS.getnamedef] want to join us; it's no secret. While the restrictions of the awful Versailles treaty may stipulate otherwise, we must hold a referendum to allow the [ROOT.getadjective] people to finally be united!"
 GER_invite_austria_to_alliance:0 "Brüder Zusammen"
 GER_invite_austria_to_alliance_desc:0 "The truth is, we and [AUS.getnamedef] are long time allies and brothers. We cannot let silly nationalists change that idea. In addition, annexing them could vex the Allied powers. All in all, we must befriend the Austrians."
 GER_great_red_menace:0 "The Great Red Menace"
 GER_great_red_menace_desc:0 "For too long, the awful [SOV.getnamedef] has been allowed to exist with its communist government, which is a major threat to the institution of democracy. We must ensure that their terrible, radical ideas cannot enter our fellow European brothers, and we must make it a goal to topple the Reds!"
 GER_danube_expansion:0 "Danube Expansion"
 GER_danube_expansion_desc:0 "While their empire may be but a memory, the Austro-Hungarians have left us with a big influence in the Danubian region. In our effort to establish an anti-communist bloc, we should ally with the nations of the Danube first."
 GER_benelux_expansion:0 "Benelux Expansion"
 GER_benelux_expansion_desc:0 "While we have certainly had a rough past with the nations of [BEL.getnamedef] and [LUX.getnamedef], with a new government we have the chance to unite under the ideas of freedom and democracy in the face of foreign threats."
 GER_nordic_expansion:0 "Scandinavian Expansion"
 GER_nordic_expansion_desc:0 "We know that the Scandinavian nations of [DEN.getnamedef], [SWE.getnamedef], and [NOR.getnamedef] can feel the threat of the Soviets on their doorstep. We should do them a favor, by inviting them to our alliance which can protect them."
 GER_threat_among_us:0 "The Threat Among Us"
 GER_threat_among_us_desc:0 "It is clear that the Soviets intend to spread their terrible Communist ideology all around Europe. We shall now announce our plan to take action, and bring those damned Soviets down, as war with them is only inevitable."
 GER_referendum_in_sudetenland:0 "Sudetenland Referendum"
 GER_referendum_in_sudetenland_desc:0 "It is clear that the people of the Sudetenland want to join us; it's no secret. While the restrictions of the awful Versailles treaty may stipulate otherwise, we must hold a referendum to allow the [ROOT.getadjective] people to finally be united!"
 GER_polish_invitation:0 "[POL.getadjective] Expansion"
 GER_polish_invitation_desc:0 "[POL.getadjective] independence has historically been constantly under attack by the [SOV.getadjective]s, and even us. However, with our new government, we can put the past behind us and invite them to join our anti-communist alliance to protect them from the [SOV.getadjective] threat."
 GER_baltic_invitation:0 "Baltic Expansion"
 GER_baltic_invitation_desc:0 "The Baltic states of [LIT.getnamedef], [LAT.getnamedef], and [EST.getnamedef] have all suffered under the threat of the [SOV.getnamedef] for years. We should invite them to join our alliance, to protect them from the threat that still stands in the East."
 GER_finnish_invitation:0 "[FIN.getadjective] Expansion"
 GER_finnish_invitation_desc:0 "[FIN.getnamedef] has only recently won their freedom from [SOV.getnamedef], and the [SOV.getadjective] imperialists still want to take it back. We should invite them to join our alliance, to ensure their independence."
 GER_strike_the_soviets:0 "Great War of Eastern Liberation"
 GER_strike_the_soviets_desc:0 "The time has come to strike [SOV.getnamedef] once and for all! Their brutal oppression and threatening stance over Europe must finally end, even if that requires going to war."
 GER_free_the_soviet_republics:0 "Liberate the Soviet States"
 GER_free_the_soviet_republics_desc:0 "With many of the former Soviet republics under our control, we must establish new republics to free the people and weaken [SOV.getnamedef] even further!"
 GER_secure_the_bosporus:0 "Secure the Bosporus"
 GER_secure_the_bosporus_desc:0 "Not only will the capture of the Bosporus close off a vital supply route for the [SOV.getadjective]s, but it will also grant us the ability to start another front against them from the South, which could be vital in our war effort."
 GER_turkish_expansion:0 "Turkish Expansion"
 GER_turkish_expansion_desc:0 "We've always been good friends with the [TUR.getadjective]. That being said, with the [SOV.getadjective]s on [TUR.getnamedef]'s doorstep, and us needing to open a new front, perhaps we can revitalize this alliance in our effort to defeat communism."
 GER_fascist_threat:0 "The Fascist Threat"
 GER_fascist_threat_desc:0 "Fascism is a cancer upon Europe, and we cannot allow it to spread any further. The Chancellor must make his speech to take a stance against this viscious ideology, and we will finish what we started during the civil war!"
 GER_defense_pact_with_allies:0 "Defense Pact with the Allies"
 GER_defense_pact_with_allies_desc:0 "Our foreign minister has been in talks with [ENG.getnamedef] about a possible defense pact between us and the Allies. This would greatly bolster our security against the totalitarian threats that linger, and could even deter them from attacking us."
 GER_lessons_from_the_civil_war:0 "Lessons from the Civil War"
 GER_lessons_from_the_civil_war_desc:0 "The generals of the Civil War know well of how to fight against the fascists. Some promotions are deserved, and lessons to be learned on how to combat fascism in the battlefield."
 GER_deutschland_ist_geoeffnet:0 "Deutschland ist Geöffnet!"
 GER_deutschland_ist_geoeffnet_desc:0 "We shall have a new economic policy that will boost our own economy and damage those of the fascists. Deutschland ist Geöffnet will welcome industries from fascist nations to seek refuge and set up shop in [ROOT.getnamedef]."
 GER_destroy_mussolinis_italy:0 "Destroy Mussolini's Italy"
 GER_destroy_mussolinis_italy_desc:0 "The time has come to finally destroy the creator of fascism, Benito Mussolini. He inspired so many to do such horrible things, including a certain Adolf Hitler in our own country. We must make sure that his regime is toppled, once and for all!"
 GER_bring_in_the_swiss:0 "End Swiss Neutrality"
 GER_bring_in_the_swiss_desc:0 "Although it may take some convincing, it's time for the Swiss to finally accept that the days of neutrality are over. We need to open more fronts to fight [ITA.getnamedef], and they are the perfect ally to help us do so."
 GER_alpine_offensives:0 "Alpine Offensives"
 GER_alpine_offensives_desc:0 "Fighting in the mountains has proven to be quite difficult. However, by coordinating proper attacks and doctrines for mountain warfare, we can ensure that our troops are prepared to fight in such harsh conditions."
 GER_finish_the_job:0 "Finish the Job"
 GER_finish_the_job_desc:0 "The time has come for us to finally end all totalitarian regimes in Europe, at any cost. With the inevitable fall of fascism and communism in [ITA.getnamedef] and [SOV.getnamedef], respectively, we can focus on crushing these viscious regimes in all other European nations."
 GER_eastern_plebiscites:0 "Eastern Plebiscites"
 GER_eastern_plebiscites_desc:0 "Stresemann, and much of the other ministers of government in [ROOT.getnamedef], have always supported the reclamation of eastern lands. We will do so, but in a peaceful way as they intended."
 GER_crackdown_on_dnsap:0 "Crackdown on the DNSAP"
 GER_crackdown_on_dnsap_desc:0 "The DNSAP remains a great threat to the nation. We should seek to crack down on them, something the Austrians had failed to do, to prevent some sort of coup..."
 GER_prussian_democracy:0 "Prussian Democracy"
 GER_prussian_democracy_desc:0 "While of course bringing back old institutions is of our best interest, the Western Democracies would be quite against the restoration of Wilhelm II. Instead, we can instate his son, Wilhelm III, and bring back the Prussian Democratic systems in place before the Great War."
 GER_new_prussian_industry:0 "New Prussian Industry"
 GER_new_prussian_industry_desc:0 "Some places in Prussia have long been lacking in the industrial sector. We should invest to expand their industrial capacity, to bring them up to scratch with the rest of [ROOT.getnamedef]."
 GER_anti_socialist_rhetoric:0 "Anti-Socialist Rhetoric"
 GER_anti_socialist_rhetoric_desc:0 "We cannot allow these evil socialists to continue to ruin our country, especially in these times. We will denounce and crack down on socialist and communist behavior, for the benefit of our great country!"
 GER_balance_the_budget:0 "Balance the Budget"
 GER_balance_the_budget_desc:0 "While previous government have largely failed to do so, we must seek to balance the budget in an effort to stabalize our economy which has been rather rocky since the end of the Great War."
 GER_naval_cooperation_with_uk:0 "The Royal Navy and the Reichsmarine"
 GER_naval_cooperation_with_uk_desc:0 "We once held a very powerful fleet before the Great War. Since then we have lost most of it, but we are now allies with she who rules the waves. Let us sign a pact with [ENG.getnamedef], giving us access to their superior navy technology and tactics."
 GER_cooperative_army_training:0 "Military Cooperation"
 GER_cooperative_army_training_desc:0 "As tensions rise in the world, we, and our allies, need to bring our militaries up to scratch. Therefore, a collective training of our armies shall be organized."
 GER_refuge_of_the_greatest_minds:0 "Refuge of the Greatest Minds"
 GER_refuge_of_the_greatest_minds_desc:0 "Reversing the Brain Drain was a great first step to breathing new life into our R&D. However, we should go even further: declaring ourselves a political refuge for the greatest minds."
 GER_denounce_colonialism:0 "Denounce Colonialism"
 GER_denounce_colonialism_desc:0 "Colonialism has no place in the modern world! We must denounce it, so the whole world knows of its evils. Who knows? Maybe the colonial powers will actually do something about it."
 GER_anti_colonialist_crusade:0 "Anti-Colonialist Crusade"
 GER_anti_colonialist_crusade_desc:0 "We cannot stand idly by while these evil colonial empires to exist and oppress their constituents. We must take them down, and bring freedom to oppressed peoples in their colonies."
 GER_take_down_national_socialist_remnants:0 "Take Down [AUS.getadjective] National Socialists"
 GER_take_down_national_socialist_remnants_desc:0 "The German National Socialist movement is unfortunately still alive and well, in [AUS.getnamedef]. Since the [AUS.getadjective]s have done little to stop them, we must take action ourselves, through war."
 GER_reconsider_american_colonization:0 "Reconsider American Colonization"
 GER_reconsider_american_colonization_desc:0 "While other European powers had fun in the Americas, we stood idly by, only establishing a failed colony in modern-day [VEN.getnamedef]. With the winds of change blowing, perhaps it's time to right that wrong and bring [ROOT.getnamedef] into the region."
 GER_seize_dutch_colonies:0 "Seize [HOL.getadjective] Colonies"
 GER_seize_dutch_colonies_desc:0 "The [HOL.getadjective] nation is a weak one, but it is valuable as it holds colonies in the Americas. We should attack them, and seize control of their colonies, to establish a base of operations."
 GER_disrupt_monroe:0 "Disrupt the Monroe Doctrine"
 GER_disrupt_monroe_desc:0 "[USA.getnamedefcap] has a long-standing doctrine stating that no foreign European powers can get involved in the Americas. While this has worked well for them for a long time, with our colonial ambitions we will have to change that."
 GER_emergency_mobilization_act:0 "Emergency Mobilization Act"
 GER_emergency_mobilization_act_desc:0 "Desperate times call for desperate measures. In a period of ever-increasing tensions, we must mobilize our nation, to protect our republic and alliance as a whole."
 GER_balkan_guarantees:0 "Balkan Guarantees"
 GER_balkan_guarantees_desc:0 "[ITA.getnamedefcap] seems poised to expand into the Balkan states, by means of war if necessary. In an effort to curb their ambitions, we will protect the countries that they seek to attack most."
 GER_revive_the_chinese_alliance:0 "Revive the [CHI.getadjective] Alliance"
 GER_revive_the_chinese_alliance_desc:0 "We have had a long-standing alliance with [CHI.getnamedef], sending them our officers to help them out in times of war. With [JAP.getnamedef]'s threatening ambitions, perhaps it's time to revitalize this alliance."
 GER_send_military_aid_rep:0 "Send Military Aid to [CHI.getnamedef]"
 GER_send_military_aid_rep_desc:0 "It's clear that [CHI.getnamedef] has to contend with equipment problems. Perhaps we can send them some of our own, and offer industrial support so they can continue their war effort."
 GER_send_volunteers_rep:0 "Eastern Volunteers"
 GER_send_volunteers_rep_desc:0 "Expanding from our assistance in offering our military officers in the past, perhaps now we can help [CHI.getnamedef] in their war by sending some of our own men over. This can offer us some great fighting experience and severly benefit both nations."
 GER_new_guinea_protectorate:0 "The [ROOT.getadjective] New Guinea Protectorate"
 GER_new_guinea_protectorate_desc:0 "Before the Great War, we controlled what is now known as Papua New Guinea. We should request to have it back, as we need a useful base for a possible war in the Pacific."
 GER_expand_new_guinea_protectorate:0 "Expand the New Guinea Protectorate"
 GER_expand_new_guinea_protectorate_desc:0 "With [INS.getnamedef] under threat, perhaps we should seek to expand the New Guinea Protectorate into them as well."
 GER_protect_hungarys_neighbours:0 "Surround [HUN.getnamedef]"
 GER_protect_hungarys_neighbours_desc:0 "[HUN.getnamedef] has been increasingly revaunchist ever since the end of the Great War. Let's try to curb their expansion, by ensuring their neighbours' independence."
 GER_freeze_foreign_assets:0 "Freeze Foreign Assets"
 GER_freeze_foreign_assets_desc:0 "To help for our own gain and to damage their economies, we can freeze the assets of [ITA.getnamedef], [HUN.getnamedef], and [BUL.getnamedef]."
 GER_dissolve_bulgaria:0 "Dissolve [BUL.getnamedef]"
 GER_dissolve_bulgaria_desc:0 "[BUL.getnamedefcap] has its eyes on expanding its borders into its neigbours. Given that its power now is practically insignificant, we should take the chance to topple its current government and ensure continued peace in the region."
 GER_dissolve_hungary:0 "Dissolve [HUN.getnamedef]"
 GER_dissolve_hungary_desc:0 "[HUN.getnamedefcap] has its eyes on expanding its borders into its neigbours. Given that its power now is practically insignificant, we should take the chance to topple its current government and ensure continued peace in the region."
 GER_destroy_italian_expansionism:0 "Destroy [ITA.getadjective] Expansionism"
 GER_destroy_italian_expansionism_desc:0 "[ITA.getnamedefcap] has always been trying to ruthlessly expand their empire since the end of the Great War, and anyone has yet to bat an eye. Let us change that, and get rid of their expansionism once and for all!"
 GER_destroy_japanese_expansionism:0 "Set the Rising Sun"
 GER_destroy_japanese_expansionism_desc:0 "[JAP.getnamedefcap] has sought to expand its relam even further after the Great War, commiting atrocious atrocities to do so. We will have to take care of them ourselves before they grow even larger."
 GER_great_red_menace_uk:0 "The Great Red Menace"
 GER_great_red_menace_uk_desc:0 "For too long, the awful [SOV.getnamedef] has been allowed to exist with its communist government, which is a major threat to the institution of democracy. We must ensure that their terrible, radical ideas cannot enter our fellow European brothers, and we must make it a goal to topple the Reds!"
 GER_operation_unthinkable:0 "Operation Unthinkable"
 GER_operation_unthinkable_desc:0 "We, and our allies, must destroy [SOV.getnamedef] at all costs! No matter what, they will be destroyed, as will communism!"
 GER_a_free_europe:0 "Free Europe"
 GER_a_free_europe_desc:0 "We are a Europe of free, democratic nations together. Not some united empire; we do not want that."
 GER_a_united_europe:0 "United Europe"
 GER_a_united_europe_desc:0 "We should focus on uniting Europe into one state, to avoid the mistakes of the past."
 GER_realize_a_european_union:0 "Realize a European Union"
 GER_realize_a_european_union_desc:0 "We can now finally federalize, and bring Europe together into one united federation!"
 GER_improved_german_state:0 "Improved German State"
 GER_improved_german_state_desc:0 "In our efforts, we have proved triumphant. In our people, we see opportunity. In [GER.getnamedef], we see greatness. The success of the German State has been proven. For Unity, Justice, and Freedom!"
 GER_conquer_the_usa:0 "Conquer the USA"
 GER_conquer_the_usa_desc:0 "We have had plans in many years past of invading [USA.getnamedef] to cut down its international influence and to strengthen ourselves. While these plans were never used, [USA.getnamedef] is still extremely powerful, and must be destroyed."
 GER_new_zimmerman_telegram:0 "A New Zimmerman Telegram"
 GER_new_zimmerman_telegram_desc:0 "During the Great War, we gave [MEX.getnamedef] the opportunity to attack the USA and get all of their old lands back in exchange. While that didn't work then, we can try now with all of our efforts focused in the region."
 GER_restore_klein_venedig:0 "Restore Klein-Venedig"
 GER_restore_klein_venedig_desc:0 "With our plans in motion, and the “protector” of the Americas destroyed, we can finally seek to take back our rightful colony of Klein-Venedig."
 GER_french_expansion:0 "[FRA.getadjective] Expansion"
 GER_french_expansion_desc:0 "Communists and fascists threaten [FRA.getnamedef] internally and externally. Since we share common enemies with them, and also hold our democratic values, they would be a fantastic addition to our alliance."
 GER_join_the_comintern:0 "Join the Comintern"
 GER_join_the_comintern_desc:0 "Now that we have cemented our ties with [SOV.getnamedef], we can join their alliance so we can protect and spread the revolution together!"
 GER_anti_ussr:0 "Anti-USSR Communism"
 GER_anti_ussr_desc:0 "The workers know very well that [SOV.GetLeader]'s Russia is not a safe place for them. Therefore, we must rally against their government, and plan to bring a true revolution to them to free their workers."
 GER_free_the_soviet_workers:0 "Liberate the [SOV.getadjective] Workers"
 GER_free_the_soviet_workers_desc:0 "We shall finally assume the position of the liberator of the [SOV.getadjective] Workers, since it has become quite clear that [SOV.GetLeader] has no interest in helping them."
 GER_surrender_and_escape:0 "Surrender and Escape"
 GER_surrender_and_escape_desc:0 "The Military Government must flee, as a result of us failing to overthrow the Nazis. While the National Socialists may have declared their victory now, they will soon learn that the battle is not over yet."
 GER_seek_to_unite_our_people:0 "Seek to Unite Our People"
 GER_seek_to_unite_our_people_desc:0 "We should seek to unite all of the German people into one state, so we can liberate their workers and bring glory to our nation!"
 GER_the_british_socialist_republic:0 "Spread the Revolution to [ENG.getnamedef]"
 GER_the_british_socialist_republic_desc:0 "The workers of [ENG.getnamedef] continue to be oppressed. We must liberate them, and spread the socialist revolution to the British Isles!"
 GER_the_american_socialist_republic:0 "Spread the Revolution to [USA.getnamedef]"
 GER_the_american_socialist_republic_desc:0 "The workers of [USA.getnamedef] continue to be oppressed. We must liberate them, and spread the socialist revolution to America!"
 GER_the_commonwealth_socialist_republic:0 "Spread the Revolution to the Commonwealth"
 GER_the_commonwealth_socialist_republic_desc:0 "The workers of the former British Commonwealth nations continue to be oppressed. We must liberate them, and spread the socialist revolution to them!"
 GER_the_scandinavian_socialist_republic:0 "Spread the Revolution to Scandinavia"
 GER_the_scandinavian_socialist_republic_desc:0 "The workers of the Scandinavian nations continue to be oppressed. We must liberate them, and spread the socialist revolution to them!"
 GER_the_benelux_socialist_republic:0 "Spread the Revolution to the Benelux"
 GER_the_benelux_socialist_republic_desc:0 "The workers of the Benelux nations continue to be oppressed. We must liberate them, and spread the socialist revolution to them!"
 GER_the_southern_germans:0 "Spread the Revolution to the Southern Germans"
 GER_the_southern_germans_desc:0 "The workers of the Southern German nations continue to be oppressed. We must liberate them, and spread the socialist revolution to them!"
 GER_the_eastern_germans:0 "Spread the Revolution to the Eastern Germans"
 GER_the_eastern_germans_desc:0 "The Eastern German workers have too long been oppressed by their foreign capitalist governments. We must liberate them, and spread the socialist revolution to them!"
 GER_the_french_germans:0 "Spread the Revolution to [FRA.getnamedef]"
 GER_the_french_germans_desc:0 "There live a great number of Germans in the Alsace-Lorraine region of [FRA.getnamedef]. We should seek to bring them back into the Fatherland in due time, and spread the revolution!"
 GER_union_of_socialist_germanic_republics:0 "Union of Socialist Germanic Republics"
 GER_union_of_socialist_germanic_republics_desc:0 "We shall become a shining example of the socialist revolution by uniting all Germanic peoples into one equal state, liberating them from their capitalist oppressors and bringing equality for all workers!"
 GER_restore_deutsch_boehmen:0 "Restore German Bohemia"
 GER_restore_deutsch_boehmen_desc:0 "Since the end of the Great War, the territories of Bohemia, once a key component of the Austrian Empire, have been part of [CZE.getnamedef]. Since Austria is now a part of us, it is only right that we restore those lands to their rightful German hands!"
 GER_towards_a_united_germania:0 "Towards a United Germania"
 GER_towards_a_united_germania_desc:0 "For too long, the Germanic peoples have been disunited, seperated into different nations that have often fought each other. No longer shall this be the case. We must bring our people together, by force if necessary."
 GER_integration_of_the_low_countries:0 "Integrate the Low Countries"
 GER_integration_of_the_low_countries_desc:0 "The Low Countries, having a long past with the Dutch language, are indeed Germanic. We must reclaim them back into our relam, as they would be a key part of a Germanic state."
 GER_integration_scandinavia:0 "Integrate Scandinavia"
 GER_integration_scandinavia_desc:0 "Scandinavia, having a long past with the Danish, Swedish, Norwegian, and Icelandic languages, is indeed Germanic. We must reclaim them back into our relam, as they would be a key part of a Germanic state."
 GER_integration_british_isles:0 "Integrate the British Isles"
 GER_integration_british_isles_desc:0 "The British Isles, having a long past with the English language, are indeed Germanic. We must reclaim them back into our relam, as they would be a key part of a Germanic state."
 GER_integration_commonwealth:0 "Integrate the Commonwealth"
 GER_integration_commonwealth_desc:0 "While the former [ENG.getadjective] Commonwealth were not always speaking any Germanic languages, English in this case, their more recent colonial history under the British has changed them. We shall bring them with us as part of our ambitions."
 GER_integration_america:0 "Integrate America"
 GER_integration_america_desc:0 "While the former United States of America were not always speaking any Germanic languages, English in this case, their more recent colonial history under the British has changed them. We shall bring them with us as part of our ambitions."
 GER_demand_scandinavian_submission:0 "Demand Scandinavian Submission"
 GER_demand_scandinavian_submission_desc:0 "The Scandinavian nations stand unprotected against the fascist and communist menances. We shall take them under our protection, to ensure that their people and monarchies can be protected."
 GER_fate_of_america:0 "Fate of America"
 GER_fate_of_america_desc:0 "With [USA.getnamedef] having been successfully subjugated, the question now rises to what we should do with the land. Some suggest splitting it into client states while others propose keeping the situation as is. Many also propose the integration of our German-American brothers."
 GER_integrate_american_german_speakers:0 "Integrate American German Speakers"
 GER_integrate_american_german_speakers_desc:0 "Many of our people moved to [USA.getnamedef] before the formation and the early days of the Empire. Now that their lands are back under our control, we can welcome them back into our nation!"
 GER_federation_compromise_idea:0 "Confederation Compromise"
 GER_federation_compromise_idea_desc:0 "By promising a significant amount of autonomy to the local states, we can appease much of the monarchist populace as it could give some representation to the old kigs."
 GER_monarchist_wehrmacht_angered_idea:0 "Angered Monarchists in Wehrmacht"
 GER_monarchist_wehrmacht_angered_idea_desc:0 "Many within the Wehrmacht believed that a restoration of the Kaiserreich would occur following the end of the civil war. The provisional government's rejections of such ideas and the embracement of the ideals of republicanism have certainly angered them."
 GER_stressman_legacy_idea:0 "Stresemann's Legacy"
 GER_stressman_legacy_idea_desc:0 "We should honor former Chancellor Gustav Stresemann's legacy, as he was a proponent of liberal democracy while also being supportive of careful [GER.getadjective] expansionism. By following his lead, we can ensure a great future of [GER.getnamedef]."
 GER_anti_imperialism_idea:0 "Stamp Out Imperial-Era Nationalism"
 GER_anti_imperialism_idea_desc:0 "Even after the loss in the Great War, nationalist fervor and imperial revaunchism is rampant in the country. While a healthy dose of patriotism is a good thing, we cannot continue to be a pariah on the world stage."
 GER_deutschland_ist_geoeffnet_idea:0 "Deutschland ist Geöffnet"
 GER_deutschland_ist_geoeffnet_idea_desc:0 "We shall have a new economic policy that will boost our own economy and damage those of the fascists. Deutschland ist Geöffnet will welcome industries from fascist nations to seek refuge and set up shop in [GER.getnamedef]."
 GER_dnsap_lingers_idea:0 "DNSAP Lingers"
 GER_dnsap_lingers_idea_desc:0 "The Austrian Nazi Party, also known as the DNSAP, still lingers in Austria, now a part of our nation. We will have to crush them so they are not a hindrance anymore."
 GER_stressman_legacy_2_idea:0 "Stresemann's Legacy"
 GER_stressman_legacy_2_idea_desc:0 "We should honor former Chancellor Gustav Stresemann's legacy, as he was a proponent of liberal democracy while also being supportive of careful [GER.getadjective] expansionism. By following his lead, we can ensure a great future of [GER.getnamedef]."
 GER_refuge_of_the_greatest_minds_idea:0 "Refuge of the Greatest Minds"
 GER_germany_free_europe_idea:0 "A Free Europe"
 GER_germany_free_europe_idea_desc:0 "We are a Europe of free, democratic nations together. Not some united empire; we do not want that."
 GER_ugsr_integration_decisions:0 "Uniting the Union of Socialist Germanic Republics"
 GER_ugsr_integration_decisions_desc:0 "We should seek to unite all of the Germanic peoples into one state, so we can liberate their workers and bring glory to our nation!"

 # Tooltip for the reconstructed socialist-republic effect.
 GER_establish_socialist_republic_effect_tt:0 "Becomes a §Rsocialist republic§! under German leadership"
