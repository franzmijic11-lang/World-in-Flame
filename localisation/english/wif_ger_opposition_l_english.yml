 GER_integrate_country_ugsr_columbia:0 "DSR Nordpazifik"
 GER_integrate_country_ugsr_new_zealand:0 "DSR Neuseeland"
 GER_integrate_country_ugsr_east_australia:0 "DSR Ostaustralien"
