 GER_integrate_country_ugsr_new_england:0 "DSR Neuengland"
 GER_integrate_country_ugsr_new_deutschland:0 "DSR Neudeutschland"
 GER_integrate_country_ugsr_chicago:0 "DSR Chicago"
 GER_integrate_country_ugsr_virginia:0 "DSR Washington"
 GER_integrate_country_ugsr_dixie:0 "DSR Dixieland"
 GER_integrate_country_ugsr_texas:0 "DSR Texas"
 GER_integrate_country_ugsr_great_plains:0 "DSR Groß-Dakota"
 GER_integrate_country_ugsr_rockies:0 "DSR Großraum Colorado"
 GER_integrate_country_ugsr_california:0 "DSR Pazifik"
 GER_integrate_country_ugsr_atlantic:0 "DSR Nordatlantik"
 GER_integrate_country_ugsr_ontario:0 "DSR Ontario"
