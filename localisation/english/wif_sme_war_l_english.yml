 wif_theocracy:0 "Theocracy"
 wif_theocracy_desc:0 "The Church rules. The bishops sit where the commissars sat, and the law is whatever the faith says it is."

 wif_russian_warlord_broken:0 "Russian Warlord"
 wif_russian_warlord_broken_desc:0 "The Union lost its last war, and what is left of it is held by whoever has the rifles. There are no recognised borders, no allies and no economy that answers to anyone - and the men who used to build and research have gone home, or gone over to the next warlord along."
 wif_sme_terror_bombing:0 "Luftwaffe Revenge Terror Bombing"
 wif_sme_terror_bombing_desc:0 "The bombers come every night now. There is no air force left to stop them and nothing left worth the bombs, but they come anyway: the Reich is settling accounts."

 wif_sme_fierce_dislike:0 "Fierce Dislike"
 wif_sme_old_comrades:0 "Old Comrades"

 wif_sme_war_category:0 "The War for Russia"
 wif_sme_war_category_desc:0 "The Emergency Government has come out of the Urals to take back what the Germans took. The scale below is the war itself: who is winning, and how close either side is to breaking."
 WIF_SME_WAR_TITLE:0 "The War for Russia"
 WIF_SME_WAR_LEFT:0 "§R-100§!\nCollapse of the SME"
 WIF_SME_WAR_RIGHT:0 "§G+170§!\nCollapse of the Reichskommissariats"
 WIF_SME_WAR_SCORE:0 "§Y[?global.wif_sme_score|0]§!"
 WIF_SME_WAR_RULES:0 "§YThe SME gains:§!\n +5 Penza, Saratov, Voronezh, Ryazan, Tikhvin, Astrakhan, Grozny\n +10 Stalingrad, Leningrad, Kalinin, Yaroslavl, Tula, Krasnodar\n +15 Baku, Tiflis, Stalino, Kharkov, Kiev, Minsk, Riga, Tallinn, Smolensk\n +20 Moscow\n +20 any Ostschild member capitulating\n\n§YThe SME loses:§!\n Double the points of any city the Ostschild takes back\n -40 for every state it held before the war (-55 for Gorky)\n -10 for every 40 days without a gain\n -5 a month once the Reich has reunited\n\nThe SME wins at §G+170§!, or once both Kaukasien and Moskowien have capitulated. It collapses at §R-100§!."

 wif_sme_war.1.t:0 "The War for Russia"
 wif_sme_war.1.d:0 "With the Reich silent and its commissariats on their own, the Soviet Military Emergency Government has come west out of the Urals. Moskowien is its first target, and the rest of the Ostschild will not be far behind.\n\nThe Emergency Government is a fragile thing. Its soldiers march on the promise of Moscow; push them back, and they will start asking who made that promise, and why they should keep it."
 wif_sme_war.1.a:0 "To Moscow."
 wif_sme_war.1.b:0 "Hold the line."
 wif_sme_war.1.a_tt:0 "A §Ywar scale§! opens in the decision menu, from §R-100§! (the SME collapses) to §G+170§! (the Reichskommissariats collapse). It starts at §Y+5§!."

 wif_sme_war.2.t:0 "The Reichskommissariats Collapse"
 wif_sme_war.2.d:0 "Moskowien and Kaukasien are gone. The Emergency Government's divisions are in Moscow, the commissars have fled west, and for the first time since 1941 the Red Army flies its flag over the Kremlin. What becomes of the rest of the Reich's east is yet to be settled."
 wif_sme_war.2.a:0 "The Union returns."

 wif_sme_war.3.t:0 "The SME Breaks"
 wif_sme_war.3.d:0 "The offensive that was supposed to end in Moscow has ended in the Urals. The Ostschild keeps what it holds, the Emergency Government has accepted peace on any terms, and in the provinces the men who were waiting for it to fail have stopped waiting. Within weeks there will be a dozen Russias."
 wif_sme_war.3.a:0 "It was always going to end like this."

 wif_sme_war.5.t:0 "The Ostschild Changes Hands"
 wif_sme_war.5.d:0 "With its old leader on the brink of collapse, the Ostschild now answers to [ROOT.GetName]."
 wif_sme_war.5.a:0 "Then we lead."

 wif_sme_war.6.t:0 "Russia in Pieces"
 wif_sme_war.6.d:0 "Two weeks after the Emergency Government's defeat, there is no Russia left - only Russias. A Tsar in Vyatka, a bishop in Gayny, Yeltsin's republic in the Urals, fascists in Kuybyshev and Perm, syndicalists in Orenburg, and two governments that both claim to be the Union. None of them is at war with any other. None of them has the strength to be."
 wif_sme_war.6.a:0 "The Union is dead."

 wif_sme_war.20.t:0 "The Marshal and the Council"
 wif_sme_war.20.d_council:0 "Zhukov has gone north. Half the army, most of the generals and nearly the whole high command have followed him to Archangelsk, and he calls what he leads the West Russian Army Front. The council remains, and governs what remains, in the name of the Supreme Soviet."
 wif_sme_war.20.d_zhukov:0 "The council has gone south, and taken half the army with it, to govern in the name of the Supreme Soviet. Zhukov holds Archangelsk, the fleet and the high command, and the Emergency Government is now the West Russian Army Front."
 wif_sme_war.20.b:0 "Go with the other half."

 wif_smeu_the_war_is_lost:0 "The War Is Lost"
 wif_smeu_the_war_is_lost_desc:0 "Say it aloud, so that someone has. Then bury the dead and see who is still standing."
 wif_smeu_count_what_is_left:0 "Count What Is Left"
 wif_smeu_count_what_is_left_desc:0 "A census of an army that no longer knows its own size. The men who stayed are owed a ration card and a reason."
 wif_smeu_hold_what_we_have:0 "Hold What We Have"
 wif_smeu_hold_what_we_have_desc:0 "Nothing more will be taken back. What is left will at least not be given away."
 wif_smeu_salvage_the_factories:0 "Salvage the Factories"
 wif_smeu_salvage_the_factories_desc:0 "The machine tools the breakaways did not carry off are gathered in one place, and one factory runs."
 wif_smeu_blame_the_other_government:0 "Blame the Other Government"
 wif_smeu_blame_the_other_government_desc:0 "Somebody lost the war. It was not us."
 wif_smeu_reach_across_the_lines:0 "Reach Across the Lines"
 wif_smeu_reach_across_the_lines_desc:0 "The other half of the Union is still the Union. A telegram, a liaison officer, a promise that neither side will fire first."
 wif_smeu_ration_cards:0 "Ration Cards"
 wif_smeu_ration_cards_desc:0 "Bread first, and bread for everyone. It is the one thing the government can still promise."
 wif_smeu_rifles_for_the_rear:0 "Rifles for the Rear"
 wif_smeu_rifles_for_the_rear_desc:0 "The arsenals are opened and every workshop that can turn a barrel turns barrels."
 wif_smeu_mend_the_railways:0 "Mend the Railways"
 wif_smeu_mend_the_railways_desc:0 "The lines the retreat tore up are relaid, one verst at a time."
 wif_smeu_we_endure:0 "We Endure"
 wif_smeu_we_endure_desc:0 "It is not victory. It is not even peace. But the government is still here, and so are we."
