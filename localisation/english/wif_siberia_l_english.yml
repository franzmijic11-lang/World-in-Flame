l_english:
 wif_csr_tomsk_declaration:0 "The Tomsk Declaration"
 wif_csr_tomsk_declaration_desc:0 "Siberia will be ruled neither from Moscow nor from Irkutsk. Marshal Popov has promised a republic, and now he has to build one out of an army, a railway and a few frozen cities.\n\nStarting spirits (negative): Anarchist Rebels, Heavy Church Influence, Food Shortages, A Republic of Soldiers."
 wif_csr_provisional:0 "A Provisional Government"
 wif_csr_provisional_desc:0 "Ministers appointed by the Marshal, to govern until the people can choose their own."
 wif_csr_assembly:0 "Call a Constituent Assembly"
 wif_csr_assembly_desc:0 "Every district, every town soviet, every regiment sends delegates to Tomsk to decide what Siberia is."
 wif_csr_parties:0 "Legalise the Parties"
 wif_csr_parties_desc:0 "Kadets, Socialist Revolutionaries, Mensheviks, regionalists - all of them banned for twenty years, all of them back."
 wif_csr_press:0 "A Free Press in Tomsk"
 wif_csr_press_desc:0 "Newspapers nobody censors, saying things the Marshal does not always like."
 wif_csr_campaign:0 "The Duma Campaign"
 wif_csr_campaign_desc:0 "Posters on every station wall from Omsk to Krasnoyarsk, and soldiers guarding the polling stations from the anarchists."
 wif_csr_election:0 "Elections to the Siberian Duma"
 wif_csr_election_desc:0 "The first free vote east of the Urals since 1917."
 wif_csr_coalition:0 "A Coalition of the Centre"
 wif_csr_coalition_desc:0 "The parties govern together, and the Marshal stays out of the chamber."
 wif_csr_marshals_bloc:0 "The Marshal's Bloc"
 wif_csr_marshals_bloc_desc:0 "Popov's own list wins, and the army's men take the ministries."
 wif_csr_duma_seated:0 "The Duma Is Seated"
 wif_csr_duma_seated_desc:0 "Four hundred deputies in the old merchants' club in Tomsk. It is cold, it is crowded, and it is a parliament."
 wif_csr_constitution:0 "The Tomsk Constitution"
 wif_csr_constitution_desc:0 "A republic on paper, signed by the Duma and by the Marshal."
 wif_csr_banners_spread:0 "The Black Banners Spread"
 wif_csr_banners_spread_desc:0 "He does nothing; it happens anyway. The anarchist bands take another district of the taiga, and the republic has neither the men nor the authority to take it back."
 wif_csr_rail_sabotage:0 "Sabotage on the Ob Line"
 wif_csr_rail_sabotage_desc:0 "It happens anyway. Bridges burn, trains stop, and the Black Banners print their own newspaper."
 wif_csr_sermons:0 "Sermons Against the Duma"
 wif_csr_sermons_desc:0 "It happens anyway. With the commissars gone, the Church came back faster than anyone expected, and from every pulpit it tells the villages a parliament is godless."
 wif_csr_blessing:0 "The Church Blesses the Marshal"
 wif_csr_blessing_desc:0 "It happens anyway. The Metropolitan of Novosibirsk prays for Marshal Popov by name - and for the Duma not at all."
 wif_csr_refugees:0 "Refugees from the West"
 wif_csr_refugees_desc:0 "Hundreds of thousands fled across the Urals ahead of the Germans and the SME. They need bread, roofs and papers."
 wif_csr_zemstvo:0 "Zemstvo Councils"
 wif_csr_zemstvo_desc:0 "District councils, elected, to run the roads, schools and grain stores."
 wif_csr_land_question:0 "The Land Question"
 wif_csr_land_question_desc:0 "The kolkhozes are breaking up on their own. The Duma must decide who owns the land."
 wif_csr_siberian_ruble:0 "The Siberian Ruble"
 wif_csr_siberian_ruble_desc:0 "Soviet rubles are worthless east of the Urals. Tomsk prints its own."
 wif_csr_army_oath:0 "The Army Swears to the Duma"
 wif_csr_army_oath_desc:0 "Every regiment takes the oath to the republic, not to the Marshal."
 wif_csr_grain_census:0 "A Grain Census"
 wif_csr_grain_census_desc:0 "How much grain is in the elevators, and how many mouths there are to feed until the harvest."
 wif_csr_rationing:0 "Food Rationing"
 wif_csr_rationing_desc:0 "Ration cards for every city - bread first, then sugar, then everything."
 wif_csr_requisition:0 "Requisition from the Altai"
 wif_csr_requisition_desc:0 "The army collects the grain from the farms, as the Bolsheviks did."
 wif_csr_free_markets:0 "Free Grain Markets"
 wif_csr_free_markets_desc:0 "Let the peasants sell their grain at whatever price it fetches."
 wif_csr_kuzbass_fed:0 "Feed the Kuzbass Miners First"
 wif_csr_kuzbass_fed_desc:0 "No coal without miners, no miners without bread."
 wif_csr_harvest:0 "The Harvest of the Ob"
 wif_csr_harvest_desc:0 "The first good harvest since the war."
 wif_csr_popovs_army:0 "The Army Popov Brought"
 wif_csr_popovs_army_desc:0 "A third of the SME's eastern army followed him to Tomsk. It is the only reason the republic exists."
 wif_csr_kuzbass:0 "Kuzbass Coal and Steel"
 wif_csr_kuzbass_desc:0 "The Kuznetsk basin is the heart of whatever industry Siberia has."
 wif_csr_novosibirsk:0 "The Novosibirsk Works"
 wif_csr_novosibirsk_desc:0 "The factories evacuated east in 1941 are still here."
 wif_csr_rifles:0 "Siberian Rifle Divisions"
 wif_csr_rifles_desc:0 "The divisions that saved Moscow in 1941 came from here. They can do it again."
 wif_csr_yenisei:0 "Hold the Yenisei"
 wif_csr_yenisei_desc:0 "The river is the border with Stalin. Fort the crossings."
 wif_csr_plans_east:0 "Plans for the East"
 wif_csr_plans_east_desc:0 "The staff draws the arrows towards Irkutsk."
 wif_csr_march_east:0 "March East"
 wif_csr_march_east_desc:0 "Stalin is still alive in Irkutsk, and as long as he is, Siberia is not free."
 wif_fes_irkutsk:0 "Irkutsk, Not Moscow"
 wif_fes_irkutsk_desc:0 "The war was lost, Moscow was lost, and the Emergency Government hunted him across the Urals. He is still the Vozhd.\n\nStarting spirits (negative): The Vozhd's Paranoia, Food Shortages, An Army That Lost, Siberian White Army Remnant Resistance."
 wif_fes_whites_taiga:0 "The Whites in the Taiga"
 wif_fes_whites_taiga_desc:0 "It happens anyway. Kolchak's men never all went to Harbin. Their sons kept the rifles, and with the Red Army broken they have come out of the forest."
 wif_fes_amur_ambush:0 "Ambushes on the Amur Road"
 wif_fes_amur_ambush_desc:0 "It happens anyway. Convoys vanish between Chita and Blagoveshchensk, and the villages say they saw nothing."
 wif_fes_atamans_banner:0 "The Ataman's Banner Raised Again"
 wif_fes_atamans_banner_desc:0 "It happens anyway. Semyonov's old banner flies over a Transbaikal stanitsa, and Cossacks ride under it."
 wif_fes_vozhd:0 "The Vozhd Still Rules"
 wif_fes_vozhd_desc:0 "Every order still goes out under his name, as it did from the Kremlin."
 wif_fes_portraits:0 "Portraits in Every Office"
 wif_fes_portraits_desc:0 "His face on every wall from Chita to Magadan."
 wif_fes_pravda_east:0 "Pravda of the East"
 wif_fes_pravda_east_desc:0 "The Irkutsk Pravda tells the people that the war was not lost - it was betrayed."
 wif_fes_cult:0 "The Cult Reborn"
 wif_fes_cult_desc:0 "Songs, statues, a new short course of party history."
 wif_fes_betrayed:0 "Moscow Was Lost by Traitors"
 wif_fes_betrayed_desc:0 "Not by him. Never by him."
 wif_fes_loyal_marshals:0 "The Marshals Who Came East"
 wif_fes_loyal_marshals_desc:0 "Every commander here was on the train east with him. They are all the high command he has left."
 wif_fes_union_lives:0 "The Union Lives in Irkutsk"
 wif_fes_union_lives_desc:0 "The lawful government of the USSR, in exile in its own country."
 wif_fes_the_few:0 "The Few Who Came East"
 wif_fes_the_few_desc:0 "Every man around him chose the Vozhd over Moscow and followed him across Siberia. That ought to be enough. It is not."
 wif_fes_sleeps_badly:0 "The Vozhd Sleeps Badly"
 wif_fes_sleeps_badly_desc:0 "He does this himself. Someone warned him in Moscow, so someone could betray him here."
 wif_fes_tasters:0 "Tasters at Every Meal"
 wif_fes_tasters_desc:0 "Nothing reaches his table that someone else has not eaten first."
 wif_fes_by_telephone:0 "Rule by Telephone"
 wif_fes_by_telephone_desc:0 "He stops leaving the house. Orders come down the line at three in the morning."
 wif_fes_show_himself:0 "Show Himself to the Troops"
 wif_fes_show_himself_desc:0 "A review on the parade ground, every rifle unloaded first."
 wif_fes_papers:0 "Nobody Enters Without Papers"
 wif_fes_papers_desc:0 "Passes, countersigned passes, and guards who check each other's."
 wif_fes_doctors:0 "Doctors Under Suspicion"
 wif_fes_doctors_desc:0 "He does this himself. Even the men who take his pulse might be poisoners."
 wif_fes_vozhd_alone:0 "The Vozhd Alone"
 wif_fes_vozhd_alone_desc:0 "Loyal men all around him, and he trusts none of them - but there is nobody to shoot, so the fear simply stays."
 wif_fes_shadows:0 "Shadows in the Corridor"
 wif_fes_shadows_desc:0 "He does this himself. He hears footsteps where there are none."
 wif_fes_hungry_winter:0 "The Hungry Winter"
 wif_fes_hungry_winter_desc:0 "He does this himself. The far east never fed itself; the grain came from the west, and the west is gone."
 wif_fes_kolkhoz:0 "Kolkhoz Quotas"
 wif_fes_kolkhoz_desc:0 "Every collective farm east of Baikal gets a number it has to meet."
 wif_fes_raise_quotas:0 "Raise the Quotas"
 wif_fes_raise_quotas_desc:0 "If the farms cannot meet the quota, the quota is not high enough."
 wif_fes_private_plots:0 "Allow Private Plots"
 wif_fes_private_plots_desc:0 "A heresy, but it feeds people."
 wif_fes_okhotsk_fish:0 "Fish from the Sea of Okhotsk"
 wif_fes_okhotsk_fish_desc:0 "The fishing fleet at Magadan and Nikolayevsk feeds the cities."
 wif_fes_buryat_grain:0 "Grain from Buryatia"
 wif_fes_buryat_grain_desc:0 "The steppe south of Baikal is the only farmland worth the name."
 wif_fes_manchurian_rice:0 "Rice Through Manchuria"
 wif_fes_manchurian_rice_desc:0 "Bought from the Japanese, quietly."
 wif_fes_forty_percent:0 "Forty Percent of the Red Army"
 wif_fes_forty_percent_desc:0 "The divisions that followed him east are the largest army in Asia that is not Japanese."
 wif_fes_fronts:0 "Re-form the Fronts"
 wif_fes_fronts_desc:0 "Transbaikal Front, Far Eastern Front - the old names, the old staffs."
 wif_fes_trans_siberian:0 "Guard the Trans-Siberian"
 wif_fes_trans_siberian_desc:0 "One railway holds the whole country together."
 wif_fes_amur_works:0 "The Amur Works"
 wif_fes_amur_works_desc:0 "Komsomolsk and Khabarovsk build what Moscow used to send."
 wif_fes_ulan_ude_guns:0 "Guns from Ulan-Ude"
 wif_fes_ulan_ude_guns_desc:0 "The locomotive works can build artillery too."
 wif_fes_plan_west:0 "Plan West"
 wif_fes_plan_west_desc:0 "The staff draws the arrows towards Tomsk."
 wif_fes_hang_popov:0 "Hang the Traitor Popov"
 wif_fes_hang_popov_desc:0 "Popov took the army he was given to hunt the Vozhd and made himself a president with it. He will answer for it."
 wif_wsm_commissar:0 "The Commissar of the Urals"
 wif_wsm_commissar_desc:0 "Genrikh Yagoda ran the NKVD once, and Moscow took it from him. Now Moscow has fallen, and the Urals answer to him.\n\nStarting spirits (negative): The Organs Rule, Fear of the Commissar, Cut Off from the Union."
 wif_wsm_proclaim:0 "Proclaim the Marxist Republic"
 wif_wsm_proclaim_desc:0 "A republic of workers and soldiers, run by the men who used to arrest them."
 wif_wsm_sverdlovsk_soviet:0 "Dissolve the Sverdlovsk Soviet"
 wif_wsm_sverdlovsk_soviet_desc:0 "The city soviet thought it could choose its own chairman."
 wif_wsm_party_answers:0 "The Party Answers to the Organs"
 wif_wsm_party_answers_desc:0 "Every party committee gets an NKVD officer, and he signs the minutes."
 wif_wsm_through_party:0 "Rule Through the Party"
 wif_wsm_through_party_desc:0 "Keep the forms of Soviet power, and fill them with his men."
 wif_wsm_through_organs:0 "Rule Through the Organs"
 wif_wsm_through_organs_desc:0 "Do away with the pretence. The Commissariat is the government."
 wif_wsm_order_state:0 "The Order State"
 wif_wsm_order_state_desc:0 "Everything permitted is written down. Everything not written down is forbidden."
 wif_wsm_registered:0 "Every Citizen Registered"
 wif_wsm_registered_desc:0 "A card for every person in the republic: name, work, address, reliability."
 wif_wsm_passports:0 "Internal Passports"
 wif_wsm_passports_desc:0 "No travel between towns without a stamp from the organs."
 wif_wsm_curfew:0 "The Long Curfew"
 wif_wsm_curfew_desc:0 "Off the streets at nine. Lights out at ten."
 wif_wsm_one_voice:0 "One Voice in Tyumen"
 wif_wsm_one_voice_desc:0 "One newspaper, one radio station, one chairman."
 wif_wsm_portraits:0 "Portraits of Genrikh Yagoda"
 wif_wsm_portraits_desc:0 "A small man in a commissar's tunic, on every wall in the Urals."
 wif_wsm_no_successor:0 "No Successor Named"
 wif_wsm_no_successor_desc:0 "Anyone who might replace him is watched more closely than anyone else."
 wif_wsm_grip_tightens:0 "The Grip Tightens"
 wif_wsm_grip_tightens_desc:0 "Every lever in the republic now runs through one office in Tyumen."
 wif_wsm_absolute_order:0 "Absolute Order"
 wif_wsm_absolute_order_desc:0 "Nothing moves in the Urals that the organs have not allowed. It is the most orderly state in Russia, and it cannot last."
 wif_wsm_rebuild_organs:0 "Rebuild the Organs"
 wif_wsm_rebuild_organs_desc:0 "The NKVD officers who came over with him become the core of a new Commissariat."
 wif_wsm_informers:0 "Informers in Every Block"
 wif_wsm_informers_desc:0 "Every apartment block has a man who writes reports."
 wif_wsm_special_depts:0 "The Special Departments"
 wif_wsm_special_depts_desc:0 "An NKVD officer in every regiment, answering only to Tyumen."
 wif_wsm_camps:0 "Camps of the Urals"
 wif_wsm_camps_desc:0 "The old Gulag camps around Sverdlovsk fill up again."
 wif_wsm_files:0 "A File on Everyone"
 wif_wsm_files_desc:0 "Cabinets of index cards in the basement of the Tyumen Commissariat."
 wif_wsm_open_terror:0 "Open Terror"
 wif_wsm_open_terror_desc:0 "Arrests at night, trials by morning, and everyone knows."
 wif_wsm_quiet_watch:0 "Silent Surveillance"
 wif_wsm_quiet_watch_desc:0 "Nobody is arrested. Everybody is watched."
 wif_wsm_watchers:0 "Who Watches the Watchers"
 wif_wsm_watchers_desc:0 "A second commissariat to watch the first."
 wif_wsm_yagodas_guard:0 "Yagoda's Own Guard"
 wif_wsm_yagodas_guard_desc:0 "One regiment that answers to him personally, quartered next to his office."
 wif_wsm_whispers:0 "Whispers in the Party"
 wif_wsm_whispers_desc:0 "It happens anyway. Party men meet in kitchens and talk about who comes after Yagoda."
 wif_wsm_officers_resent:0 "The Officers Resent the Organs"
 wif_wsm_officers_resent_desc:0 "It happens anyway. Every colonel with a commissar at his elbow is a colonel waiting for his moment."
 wif_wsm_cracks:0 "Cracks in the Order"
 wif_wsm_cracks_desc:0 "It happens anyway. The more tightly he holds the Urals, the more of it slips through his fingers."
 wif_wsm_seize_institute:0 "Seize the Chelyabinsk Institute"
 wif_wsm_seize_institute_desc:0 "The Institute for All Research is the greatest prize in the Urals. NKVD troops take the building, the laboratories and every scientist in them."
 wif_wsm_under_guard:0 "Scientists Under Guard"
 wif_wsm_under_guard_desc:0 "They work, they eat and they sleep inside the wire."
 wif_wsm_sharashka:0 "The Urals Sharashka"
 wif_wsm_sharashka_desc:0 "A prison design bureau, as the NKVD ran in the 1930s: arrested engineers working for their freedom."
 wif_wsm_weapons_for_organs:0 "Weapons for the Organs"
 wif_wsm_weapons_for_organs_desc:0 "The Institute designs what the Commissariat needs: rifles, radios, armoured cars."
 wif_wsm_machines:0 "Machines for the Factories"
 wif_wsm_machines_desc:0 "The Institute designs what Uralmash needs."
 wif_wsm_kyshtym:0 "The Kyshtym Project"
 wif_wsm_kyshtym_desc:0 "A closed town by Lake Kyzyltash, south of Sverdlovsk, where the Institute's physicists work on something nobody may name."
 wif_wsm_prisoners_invent:0 "Prisoners Who Invent"
 wif_wsm_prisoners_invent_desc:0 "The sharashka's best engineers are promised their freedom. None of them get it."
 wif_wsm_uralmash:0 "Uralmash Under the Organs"
 wif_wsm_uralmash_desc:0 "The Ural heavy machinery works gets a new director from the Commissariat."
 wif_wsm_tankograd:0 "Tankograd"
 wif_wsm_tankograd_desc:0 "The Chelyabinsk tractor works built tanks for the whole war. It can build them for the republic."
 wif_wsm_prison_labour:0 "Prisoners for the Mines"
 wif_wsm_prison_labour_desc:0 "The camps supply the mines with labour that cannot leave."
 wif_wsm_tobolsk_grain:0 "Grain from Tobolsk"
 wif_wsm_tobolsk_grain_desc:0 "The only farmland the republic holds is along the Tobol and the Irtysh."
 wif_wsm_sverdlovsk_arms:0 "The Sverdlovsk Arms Works"
 wif_wsm_sverdlovsk_arms_desc:0 "Rifles and machine guns for the NKVD troops."
 wif_wsm_loyal_rations:0 "Rations by Reliability"
 wif_wsm_loyal_rations_desc:0 "Bread by category: reliable, doubtful, enemy."
 wif_wsm_commissariat_plan:0 "The Commissariat's Plan"
 wif_wsm_commissariat_plan_desc:0 "A five-year plan drawn up by policemen."
 wif_wsm_nkvd_troops:0 "NKVD Troops"
 wif_wsm_nkvd_troops_desc:0 "The republic's army is the Commissariat's own internal troops."
 wif_wsm_border_guards:0 "The Border Guard Divisions"
 wif_wsm_border_guards_desc:0 "NKVD border guards, the best-equipped soldiers in the Urals."
 wif_wsm_ural_passes:0 "Hold the Ural Passes"
 wif_wsm_ural_passes_desc:0 "West lies the Reichskommissariat, east lies Popov. The passes must hold."
 wif_wsm_tankograd_tanks:0 "Tanks for the Organs"
 wif_wsm_tankograd_tanks_desc:0 "Tankograd's tanks go to NKVD units, not the army."
 wif_sib_anarchists_1:0 "Anarchist Rebels"
 wif_sib_anarchists_1_desc:0 "Black Banner bands hold the taiga villages and blow up the railway when it suits them. The republic has neither the men nor the authority to stop them."
 wif_sib_anarchists_2:0 "Anarchist Rebels (Rising)"
 wif_sib_anarchists_2_desc:0 "Black Banner bands hold the taiga villages and blow up the railway when it suits them. The republic has neither the men nor the authority to stop them."
 wif_sib_anarchists_3:0 "Anarchist Rebels (Severe)"
 wif_sib_anarchists_3_desc:0 "Black Banner bands hold the taiga villages and blow up the railway when it suits them. The republic has neither the men nor the authority to stop them."
 wif_sib_church_1:0 "Heavy Church Influence"
 wif_sib_church_1_desc:0 "With the commissars gone, the Church came back faster than anyone expected, and it tells the villages that a parliament is godless."
 wif_sib_church_2:0 "Heavy Church Influence (Rising)"
 wif_sib_church_2_desc:0 "With the commissars gone, the Church came back faster than anyone expected, and it tells the villages that a parliament is godless."
 wif_sib_church_3:0 "Heavy Church Influence (Severe)"
 wif_sib_church_3_desc:0 "With the commissars gone, the Church came back faster than anyone expected, and it tells the villages that a parliament is godless."
 wif_sib_food_1:0 "Food Shortages"
 wif_sib_food_1_desc:0 "Siberia never fed itself. The grain came from the west, and the west is gone."
 wif_sib_food_2:0 "Food Shortages (Rising)"
 wif_sib_food_2_desc:0 "Siberia never fed itself. The grain came from the west, and the west is gone."
 wif_sib_food_3:0 "Food Shortages (Severe)"
 wif_sib_food_3_desc:0 "Siberia never fed itself. The grain came from the west, and the west is gone."
 wif_sib_soldiers_republic_1:0 "A Republic of Soldiers"
 wif_sib_soldiers_republic_1_desc:0 "The republic exists because an army followed Marshal Popov to Tomsk, and the army knows it."
 wif_sib_soldiers_republic_2:0 "A Republic of Soldiers (Strong)"
 wif_sib_soldiers_republic_2_desc:0 "The republic exists because an army followed Marshal Popov to Tomsk, and the army knows it."
 wif_sib_paranoia_1:0 "The Vozhd's Paranoia"
 wif_sib_paranoia_1_desc:0 "Everyone in Irkutsk chose him over Moscow. He trusts none of them, and there is nobody left to shoot."
 wif_sib_paranoia_2:0 "The Vozhd's Paranoia (Rising)"
 wif_sib_paranoia_2_desc:0 "Everyone in Irkutsk chose him over Moscow. He trusts none of them, and there is nobody left to shoot."
 wif_sib_paranoia_3:0 "The Vozhd's Paranoia (Severe)"
 wif_sib_paranoia_3_desc:0 "Everyone in Irkutsk chose him over Moscow. He trusts none of them, and there is nobody left to shoot."
 wif_sib_army_lost:0 "An Army That Lost"
 wif_sib_army_lost_desc:0 "The divisions that followed him east were beaten all the way from the Volga."
 wif_sib_whites_1:0 "Siberian White Army Remnant Resistance"
 wif_sib_whites_1_desc:0 "Kolchak's men never all went to Harbin. Their sons kept the rifles, and with the Red Army broken they have come out of the forest."
 wif_sib_whites_2:0 "Siberian White Army Remnant Resistance (Rising)"
 wif_sib_whites_2_desc:0 "Kolchak's men never all went to Harbin. Their sons kept the rifles, and with the Red Army broken they have come out of the forest."
 wif_sib_whites_3:0 "Siberian White Army Remnant Resistance (Severe)"
 wif_sib_whites_3_desc:0 "Kolchak's men never all went to Harbin. Their sons kept the rifles, and with the Red Army broken they have come out of the forest."
 wif_sib_organs_1:0 "The Organs Rule"
 wif_sib_organs_1_desc:0 "The Commissariat is the state. The party, the soviets and the army all answer to it."
 wif_sib_organs_2:0 "The Organs Rule (Rising)"
 wif_sib_organs_2_desc:0 "The Commissariat is the state. The party, the soviets and the army all answer to it."
 wif_sib_organs_3:0 "The Organs Rule (Severe)"
 wif_sib_organs_3_desc:0 "The Commissariat is the state. The party, the soviets and the army all answer to it."
 wif_sib_fear_1:0 "Fear of the Commissar"
 wif_sib_fear_1_desc:0 "Nobody in the Urals says what he thinks, and nobody fights harder than he must."
 wif_sib_fear_2:0 "Fear of the Commissar (Rising)"
 wif_sib_fear_2_desc:0 "Nobody in the Urals says what he thinks, and nobody fights harder than he must."
 wif_sib_fear_3:0 "Fear of the Commissar (Severe)"
 wif_sib_fear_3_desc:0 "Nobody in the Urals says what he thinks, and nobody fights harder than he must."
 wif_sib_cut_off:0 "Cut Off from the Union"
 wif_sib_cut_off_desc:0 "The Urals were the arsenal of a country that no longer exists."
 wif_csr_duma:0 "The Siberian Duma"
 wif_csr_duma_desc:0 "Four hundred deputies in a cold merchants' club in Tomsk."
 wif_csr_ruble:0 "The Siberian Ruble"
 wif_csr_ruble_desc:0 "Tomsk prints its own money."
 wif_csr_miners_fed:0 "Miners Fed First"
 wif_csr_miners_fed_desc:0 "No coal without miners, no miners without bread."
 wif_csr_siberian_rifles:0 "Siberian Rifle Divisions"
 wif_csr_siberian_rifles_desc:0 "The divisions that saved Moscow in 1941 came from here."
