l_english:
 wif_reichskommissariat_economy:0 "Reichskommissariat"
 wif_reichskommissariat_economy_desc:0 "The economy of the occupied territories exists to serve the Reich. Raw materials flow east to west, industry is retooled for war at Berlin's convenience, and the population endures what Berlin decides it can endure. The Reichskommissar does not set economic policy - he administers it."
