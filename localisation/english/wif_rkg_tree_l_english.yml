 wif_rkg_tt_48:0 "§RA grievance:§! the resistance grows §R0.5§! a month faster, for good."
 wif_rkg_tt_49:0 "Nordland: §G+4§! steel."
 wif_rkg_tt_50:0 "§YDover§!'s opinion of us: §G+50§!."
 wif_rkg_tt_51:0 "Resistance attacks are §G25%§! less likely."
 wif_rkg_tt_52:0 "When the Reich reunites, we §Gkeep§! Narvik."
 wif_rkg_tt_53:0 "§RQuisling's coup.§! §YVidkun Quisling§! leads; §YTerboven§! flees to Germany. We §Rleave the Reich§! - and Dover - as the independent §YNorwegian National State§!, fascist and racist.\nWe gain §Gcores on all of Norway§!, Nordland included, and §G5,000§! rifles from the German depots.\n§RSweden may attack us§!, and once the Ostschild war is over a reunited Germany may §Rreinvade§!: if it beats us, the cores are removed, Quisling is shot and Terboven returns."
 wif_rkg_tt_54:0 "We become the §YNorwegian National State§!, under the Nasjonal Samling's flag."
 wif_rkg_tt_55:0 "§RA grievance:§! the resistance grows §R0.5§! a month faster, for good."
 wif_rkg_tt_56:0 "Opplandene, Trondelag and Troms: §G+2§! land forts on the Swedish border."
 RKG_wif_national_state:0 "Norwegian National State"
 RKG_wif_national_state_DEF:0 "the Norwegian National State"
 RKG_wif_national_state_ADJ:0 "Norwegian"
 RKG_wif_gau:0 "Gau Norwegen"
 RKG_wif_gau_DEF:0 "Gau Norwegen"
 RKG_wif_gau_ADJ:0 "Norwegian"
 wif_rkg_heavy_water:0 "Heavy Water from Rjukan"
 wif_rkg_category:0 "Norway"
 wif_rkg_category_desc:0 "The Home Front's Strength: §R[?ROOT.wif_rkg_res|0]§!/100, growing [?ROOT.wif_rkg_res_rate|1] a month; it never falls below 10. Each month it strikes with a chance of half its Strength: shootings (10), railways and shipping (25), factory sabotage (40), the heavy water and aluminium works (55), the U-boat and fleet bases (70), a coordinated rising of the Home Front (90)."
 wif_rkg_patrol_coast:0 "Patrol the Coast"
 wif_rkg_patrol_coast_desc:0 "Hunt the Shetland Bus: the fishing boats that carry the resistance's weapons and agents."
 wif_rkg_patrol_tt:0 "Resistance Strength §G-5§!."
 wif_rkg_forest_sweep:0 "Forest Sweep"
 wif_rkg_forest_sweep_desc:0 "Search the forests of Opplandene and Telemark for Milorg's arms dumps."
 wif_rkg_sweep_tt:0 "After §Y30§! days: resistance Strength §G-5§! or §G-10§! (§G3§! more with Norway Is Never Quiet)."
 wif_rkg.11.t:0 "Shots in the Street"
 wif_rkg.11.desc:0 "A German officer and a Norwegian informer were shot in [wif_rkg_res_state.GetName]. The killers vanished."
 wif_rkg.11.a:0 "Arrest the neighbours."
 wif_rkg.12.t:0 "Sabotage on the Line"
 wif_rkg.12.desc:0 "A bridge was blown and a coastal steamer sunk at her moorings in [wif_rkg_res_state.GetName]."
 wif_rkg.12.a:0 "Guard every quay."
 wif_rkg.13.t:0 "A Factory Blown Up"
 wif_rkg.13.desc:0 "Milorg saboteurs wrecked a factory working for the Wehrmacht in [wif_rkg_res_state.GetName]."
 wif_rkg.13.a:0 "Find them."
 wif_rkg.14.t:0 "Rjukan Again"
 wif_rkg.14.desc:0 "Commandos struck the hydro and heavy water works in Telemark. The plant will be out of action for months."
 wif_rkg.14.a:0 "Double the guard."
 wif_rkg.15.t:0 "The Base Is Hit"
 wif_rkg.15.desc:0 "Limpet mines in the harbour of [wif_rkg_res_state.GetName]: a shipyard and the ships in it are burning."
 wif_rkg.15.a:0 "The navy is furious."
 wif_rkg.16.t:0 "The Home Front Strikes"
 wif_rkg.16.desc:0 "On a single night the Home Front struck all over Norway: railways, power lines, depots, informers."
 wif_rkg.16.a:0 "This is war."
 wif_rkg.1.t:0 "Quisling's Coup"
 wif_rkg.1.desc:0 "With the Reich at war with itself, Vidkun Quisling has turned the Norwegian fascists against the Reichskommissar. The Hird holds Akershus, Terboven has fled to Germany, and Quisling has proclaimed an independent Norwegian National State - as fascist, and as racist, as the regime it replaced."
 wif_rkg.1.a:0 "Norway for the Norwegians - his kind of Norwegians."
