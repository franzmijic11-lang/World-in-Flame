l_english:
 wif_rkg_root:0 "Reichskommissariat Norwegen"
 wif_rkg_root_desc:0 "Norway has fallen. Reichskommissariat Norwegen (RKG) is ruled from Oslo by a German official, Josef Terboven - or, if Berlin chose to use a local puppet, by Vidkun Quisling of the Nasjonal Samling (vanilla event wuw_GER_reichskommissariats.3). Norway is 'Germanic': in Nazi theory its people are to be won for a Greater Germanic Reich, not removed. But its coast is a fortress, its waterfalls power the Reich's aluminium and heavy water, and its people mostly hate the occupation."
 wif_rkg_skaugum:0 "The Reichskommissar at Skaugum"
 wif_rkg_skaugum_desc:0 "Terboven moves into Skaugum, the Crown Prince's residence. The King and the government are in London."
 wif_rkg_kommissarische_staatsrate:0 "The Commissarial Councillors"
 wif_rkg_kommissarische_staatsrate_desc:0 "Norwegian ministers appointed by the Reichskommissar, most of them from the Nasjonal Samling."
 wif_rkg_terboven_regime:0 "Terboven's Regime"
 wif_rkg_terboven_regime_desc:0 "Terboven rules directly and trusts no Norwegian - not even Quisling."
 wif_rkg_act_of_state:0 "The Act of State"
 wif_rkg_act_of_state_desc:0 "1 February 1942: at Akershus, Quisling is made Minister-President of a 'national government' - under the Reichskommissar's eye."
 wif_rkg_martial_law:0 "Martial Law in Trondheim"
 wif_rkg_martial_law_desc:0 "Terboven's answer to sabotage: a state of emergency, mass arrests, executions."
 wif_rkg_nasjonal_samling:0 "The Nasjonal Samling State"
 wif_rkg_nasjonal_samling_desc:0 "One party, its uniformed Hird, its Fuhrer - Quisling."
 wif_rkg_germanic_reich:0 "The Greater Germanic Reich"
 wif_rkg_germanic_reich_desc:0 "In the SS vision Norway is not a colony but a member of a Germanic Reich - on Berlin's terms."
 wif_rkg_reichsgau_norwegen:0 "Gau Norwegen"
 wif_rkg_reichsgau_norwegen_desc:0 "Terboven's goal: Norway annexed outright as a German Gau."
 wif_rkg_nordic_state:0 "Quisling's Germanic Province"
 wif_rkg_nordic_state_desc:0 "Quisling dreamed of a free Norway allied to Germany. Berlin never allowed it, and he never dared to insist: the Nasjonal Samling governs a Germanic province inside the Reich, and only German bayonets keep it in power."
 wif_rkg_norwegian_question:0 "The Norwegian Question"
 wif_rkg_norwegian_question_desc:0 "A 'Germanic' people that refuses to be won: the churches, the schools, the courts and the sports clubs all resist the new order."
 wif_rkg_teachers_front:0 "The Teachers Front"
 wif_rkg_teachers_front_desc:0 "1942: thousands of teachers refuse to join the NS teachers' union. A thousand are arrested and shipped north to forced labour at Kirkenes. The union is never formed."
 wif_rkg_church_struggle:0 "The Church Struggle"
 wif_rkg_church_struggle_desc:0 "Every bishop of the Church of Norway resigns rather than serve the regime; the clergy follow."
 wif_rkg_sports_strike:0 "The Sports Strike"
 wif_rkg_sports_strike_desc:0 "Norwegian athletes refuse to compete in any event organised by the regime - for the whole occupation."
 wif_rkg_grini_falstad:0 "Grini and Falstad"
 wif_rkg_grini_falstad_desc:0 "The prison camps for Norwegian prisoners: hostages, resisters, and those caught listening to the BBC."
 wif_rkg_trandum:0 "The Trandum Forest"
 wif_rkg_trandum_desc:0 "Where the German security police shoot Norwegian hostages and resisters."
 wif_rkg_telavag:0 "Telavag"
 wif_rkg_telavag_desc:0 "April 1942: after two Gestapo men were killed in a firefight, the fishing village of Telavag was razed, its men sent to Sachsenhausen and its women and children interned."
 wif_rkg_jews_of_norway:0 "The Jews of Norway"
 wif_rkg_jews_of_norway_desc:0 "26 November 1942: Norwegian police round up the country's Jews; 529 are shipped on the Donau to Stettin and on to Auschwitz. Of the 772 Norwegian Jews deported, 34 survive."
 wif_rkg_lebensborn:0 "Lebensborn in Norway"
 wif_rkg_lebensborn_desc:0 "SS maternity homes for the children of German soldiers and Norwegian women - the 'valuable blood' of the Germanic future."
 wif_rkg_state_police:0 "The Statspolitiet"
 wif_rkg_state_police_desc:0 "Norway's own state police, run by the Nasjonal Samling, and the Rinnan gang's informers and torturers in Trondheim."
 wif_rkg_loyalty_oath:0 "The Loyalty Oath"
 wif_rkg_loyalty_oath_desc:0 "Civil servants, police and teachers must swear loyalty to the regime - or lose their jobs and their pensions."
 wif_rkg_wirtschaft_norwegen:0 "Norwegian Assets for the Reich"
 wif_rkg_wirtschaft_norwegen_desc:0 "Norwegian banks, shipping and industry are placed under German trustees."
 wif_rkg_ore_railway:0 "The Ore Railway"
 wif_rkg_ore_railway_desc:0 "The Ofoten line carries Swedish iron to German Narvik. The Reichskommissariat keeps it running."
 wif_rkg_norsk_hydro:0 "Norsk Hydro"
 wif_rkg_norsk_hydro_desc:0 "The hydroelectric works at Rjukan in Telemark make fertiliser - and heavy water, the one thing German atomic research cannot do without."
 wif_rkg_fisheries:0 "Fish for the Reich"
 wif_rkg_fisheries_desc:0 "Norway's fishing fleet works for German tables; Norwegians queue for what is left."
 wif_rkg_nordag:0 "Nordag Aluminium"
 wif_rkg_nordag_desc:0 "Goring's plan to make Norway the Reich's aluminium works, on cheap waterfall power."
 wif_rkg_nordlandsbanen:0 "The Nordland Railway"
 wif_rkg_nordlandsbanen_desc:0 "The railway north to Bodo and beyond, built by Soviet prisoners of war who died by the thousand in the camps along it."
 wif_rkg_hydro_power:0 "Waterfalls for the Reich"
 wif_rkg_hydro_power_desc:0 "Power stations on every great waterfall, wired for German industry."
 wif_rkg_north_industry:0 "The Northern Industrial Region"
 wif_rkg_north_industry_desc:0 "Norway is to be the Reich's power plant and aluminium smelter for a generation."
 wif_rkg_festung_norwegen:0 "Festung Norwegen"
 wif_rkg_festung_norwegen_desc:0 "Hitler is convinced the Allies will land in Norway. Hundreds of thousands of German troops garrison the coast."
 wif_rkg_coastal_batteries:0 "The Coastal Batteries"
 wif_rkg_coastal_batteries_desc:0 "Batterie Dietl and Batterie Trondenes: battleship guns in concrete, covering the approaches to Narvik and the north."
 wif_rkg_uboat_pens:0 "The U-Boat Pens"
 wif_rkg_uboat_pens_desc:0 "Dora in Trondheim, Bruno in Bergen: concrete pens for the U-boat war in the Atlantic and the Arctic."
 wif_rkg_norwegian_legion:0 "Den Norske Legion"
 wif_rkg_norwegian_legion_desc:0 "Norwegian volunteers for the war against the Soviet Union, later the SS-regiment 'Norge'."
 wif_rkg_arctic_front:0 "The Arctic Front"
 wif_rkg_arctic_front_desc:0 "From Kirkenes the Wehrmacht's mountain troops face Murmansk across the tundra."
 wif_rkg_germanske_ss:0 "Germanske SS Norge"
 wif_rkg_germanske_ss_desc:0 "The Norwegian branch of the Germanic SS: politically reliable, racially 'Germanic'."
 wif_rkg_nordstern:0 "Nordstern"
 wif_rkg_nordstern_desc:0 "Hitler's plan for a new German city of 300,000 and the Reich's greatest naval base beside Trondheim - begun at last."
 wif_rkg_northern_bastion:0 "The Northern Bastion"
 wif_rkg_northern_bastion_desc:0 "The Reich's northern flank: if the Reich ever falls silent, Norway can hold its own coast."
 wif_rkg_hjemmefronten:0 "Hjemmefronten"
 wif_rkg_hjemmefronten_desc:0 "The Home Front: Milorg's secret army, the civil resistance, the underground press - all answering to the government in London."
 wif_rkg_shetland_bus:0 "The Shetland Bus"
 wif_rkg_shetland_bus_desc:0 "Fishing boats run agents, weapons and refugees between Shetland and the Norwegian coast through the winter dark."
 wif_rkg_kompani_linge:0 "Kompani Linge"
 wif_rkg_kompani_linge_desc:0 "Norwegian commandos trained by the British. In February 1943 six of them blew up the heavy water plant at Vemork."
 wif_rkg_xu:0 "XU"
 wif_rkg_xu_desc:0 "The intelligence network that reports every German ship and gun position to London."
 wif_rkg_rinnan:0 "Sonderabteilung Lola"
 wif_rkg_rinnan_desc:0 "Henry Rinnan's gang of Norwegian infiltrators and torturers, working for the German security police from the 'Gang Monastery' in Trondheim."
 wif_rkg_milorg_hunt:0 "Hunting Milorg"
 wif_rkg_milorg_hunt_desc:0 "Sweeps through the forests of Opplandene and Telemark for the secret army's arms dumps."
 wif_rkg_never_quiet:0 "Norway Is Never Quiet"
 wif_rkg_never_quiet_desc:0 "The resistance cannot be broken - only kept from striking."
 wif_rkg_silence_from_berlin:0 "Silence from Berlin"
 wif_rkg_silence_from_berlin_desc:0 "The Reich is at war with itself. Across the North Sea, in Dover, Grand Admiral Donitz has formed a German Administrative Government with the fleet and the Reich's subjects - ourselves among them. Oslo is still ours."
 wif_rkg_narvik_ours:0 "Narvik Is Ours"
 wif_rkg_narvik_ours_desc:0 "With the Reich gone, German Narvik comes to the Reichskommissariat instead of to Oslo."
 wif_rkg_donitz_loyal:0 "Loyal to Dover"
 wif_rkg_donitz_loyal_desc:0 "Donitz has the fleet and the Reich's diplomacy. We stand under his flag until Germany is whole - there is nowhere else to stand."
 wif_rkg_own_path:0 "A Fragile Regime"
 wif_rkg_own_path_desc:0 "Without Berlin, the Reichskommissar is one German official and a few thousand collaborators among three million Norwegians who hate them. He doubles the guards and does not leave Skaugum."
 wif_rkg_reich_returns:0 "Waiting for the Reich"
 wif_rkg_reich_returns_desc:0 "The Reichskommissariat's only future is a German one. It holds Norway for whoever wins the civil war."
 wif_rkg_new_europe:0 "Norway in the New Europe"
 wif_rkg_new_europe_desc:0 "Whatever its name, Norway is part of the order the Reich has built across Europe."
 wif_rkg_germanic_volunteers:0 "The Germanic Volunteer Programme"
 wif_rkg_germanic_volunteers_desc:0 "Young Norwegians are sent to Germany to serve, train and settle in the East."
 wif_rkg_youth_service:0 "The NS Youth Service"
 wif_rkg_youth_service_desc:0 "Membership of the Nasjonal Samling's youth organisation is made compulsory. Parents protest by the tens of thousands."
 wif_rkg_arbeidstjenesten:0 "Arbeidstjenesten"
 wif_rkg_arbeidstjenesten_desc:0 "The compulsory labour service: young Norwegians build roads and fortifications for the Wehrmacht."
 wif_rkg_heavy_water_programme:0 "The Heavy Water Programme"
 wif_rkg_heavy_water_programme_desc:0 "Vemork is rebuilt and guarded like a fortress: the Reich's atomic programme depends on it."
 wif_rkg_sydvaranger:0 "Sydvaranger"
 wif_rkg_sydvaranger_desc:0 "The iron mines at Kirkenes in Finnmark, worked again for German steel."
 wif_rkg_power_cable:0 "A Cable to the Reich"
 wif_rkg_power_cable_desc:0 "Undersea cables carry Norwegian waterfall power to German industry."
 wif_rkg_atlantikwall_nord:0 "Atlantikwall Nord"
 wif_rkg_atlantikwall_nord_desc:0 "The Atlantic Wall's northern half: every fjord mouth from Kristiansand to Kirkenes fortified."
 wif_rkg_northern_fleet_base:0 "The Northern Fleet Base"
 wif_rkg_northern_fleet_base_desc:0 "The Kriegsmarine's heavy ships are based in the northern fjords for good."
 wif_rkg_arms_dumps:0 "The Arms Dumps"
 wif_rkg_arms_dumps_desc:0 "Milorg has hidden thousands of British weapons in the forests, waiting for the day it is ordered to rise."
 wif_rkg_reprisal_policy:0 "The Reprisal Policy"
 wif_rkg_reprisal_policy_desc:0 "Ten Norwegians for every German killed."
 wif_rkg_trondheim_capital:0 "Oslo Holds"
 wif_rkg_trondheim_capital_desc:0 "The Reichskommissar still sits at Skaugum. Without Berlin, Oslo is the only German capital in the north."
 wif_rkg_northern_reich:0 "The Northern Reich"
 wif_rkg_northern_reich_desc:0 "From Kristiansand to Kirkenes, the Reichskommissariat holds the north for whoever rules Germany next."
 wif_rkg_quisling_turns:0 "Quisling Turns"
 wif_rkg_quisling_turns_desc:0 "Berlin passed Quisling over for Terboven. Now Berlin is silent, and the Minister-President who never was calls out the Hird. Norwegian fascists seize Akershus, the police go over to them, and Terboven escapes to Germany with his staff."
 wif_rkg_national_state:0 "The Norwegian National State"
 wif_rkg_national_state_desc:0 "Quisling's Norway at last: a one-party state under the Nasjonal Samling, with a Fører and a Riksting of estates."
 wif_rkg_hird_army:0 "The Hird Becomes an Army"
 wif_rkg_hird_army_desc:0 "The party militia and the veterans of the Norwegian Legion are all the army Norway has."
 wif_rkg_racial_state:0 "The Racial Laws Stay"
 wif_rkg_racial_state_desc:0 "Independence changes nothing for those the regime has marked: the racial laws stay, and so does the forced sterilisation of the Romani travellers ('tatere') that Norway had begun before the war."
 wif_rkg_swedish_border:0 "The Swedish Border"
 wif_rkg_swedish_border_desc:0 "Sweden has always sheltered Norwegian refugees and the resistance. Without the Reich, it may come for us."
 wif_rkg_if_the_reich_returns:0 "If the Reich Comes Back"
 wif_rkg_if_the_reich_returns_desc:0 "A reunited Reich will remember who drove out its Reichskommissar. Quisling prepares to plead - or to fight."
 wif_rkg_festung_idea:0 "Festung Norwegen"
 wif_rkg_festung_idea_desc:0 "Hitler is sure the Allies will land in Norway."
 wif_rkg_germanic_idea:0 "A Germanic People"
 wif_rkg_germanic_idea_desc:0 "The Norwegians are to be won, not removed."
 wif_rkg_councillors_idea:0 "The Commissarial Councillors"
 wif_rkg_councillors_idea_desc:0 "Norwegian ministers chosen by the Reichskommissar."
 wif_rkg_terboven_idea:0 "Terboven's Regime"
 wif_rkg_terboven_idea_desc:0 "He trusts no Norwegian - not even Quisling."
 wif_rkg_national_government_idea:0 "The National Government"
 wif_rkg_national_government_idea_desc:0 "Quisling, Minister-President - under the Reichskommissar."
 wif_rkg_ns_state_idea:0 "The Nasjonal Samling State"
 wif_rkg_ns_state_idea_desc:0 "One party, one Hird, one Forer."
 wif_rkg_gau_idea:0 "Gau Norwegen"
 wif_rkg_gau_idea_desc:0 "Norway, annexed in all but name."
 wif_rkg_province_idea:0 "Quisling's Germanic Province"
 wif_rkg_province_idea_desc:0 "Inside the Reich, on German bayonets."
 wif_rkg_volunteers_idea:0 "The Germanic Volunteers"
 wif_rkg_volunteers_idea_desc:0 "Young Norwegians serve and settle in the East."
 wif_rkg_teachers_idea:0 "The Teachers Front"
 wif_rkg_teachers_idea_desc:0 "A thousand teachers in the labour camps at Kirkenes."
 wif_rkg_lebensborn_idea:0 "Lebensborn"
 wif_rkg_lebensborn_idea_desc:0 "The Germanic future's 'valuable blood'."
 wif_rkg_oath_idea:0 "The Loyalty Oath"
 wif_rkg_oath_idea_desc:0 "Swear, or lose your job and your pension."
 wif_rkg_youth_idea:0 "The NS Youth Service"
 wif_rkg_youth_idea_desc:0 "Compulsory - and hated."
 wif_rkg_labour_service_idea:0 "Arbeidstjenesten"
 wif_rkg_labour_service_idea_desc:0 "Young Norwegians build for the Wehrmacht."
 wif_rkg_hydro_idea:0 "Waterfalls for the Reich"
 wif_rkg_hydro_idea_desc:0 "Cheap power on every great waterfall."
 wif_rkg_bastion_idea:0 "The Northern Bastion"
 wif_rkg_bastion_idea_desc:0 "The Reich's northern flank."
 wif_rkg_fleet_base_idea:0 "The Northern Fleet Base"
 wif_rkg_fleet_base_idea_desc:0 "The heavy ships live in the fjords."
 wif_rkg_fragile_idea:0 "A Fragile Regime"
 wif_rkg_fragile_idea_desc:0 "Three million Norwegians who hate us, and no Berlin."
 wif_rkg_last_stand_idea:0 "If the Reich Comes Back"
 wif_rkg_last_stand_idea_desc:0 "Plead, or fight."
 wif_rkg_fish_ger_idea:0 "Fish from Norway"
 wif_rkg_fish_ger_idea_desc:0 "Norwegian catch for German tables."
 wif_rkg_north_ger_idea:0 "The Northern Industrial Region"
 wif_rkg_north_ger_idea_desc:0 "Norway smelts for the Reich."
 wif_rkg_cable_ger_idea:0 "A Cable to the Reich"
 wif_rkg_cable_ger_idea_desc:0 "Norwegian waterfall power in German factories."
 wif_rkg_germanic_opinion:0 "The Germanic Reich"
 wif_rkg_volunteer_opinion:0 "Germanic Volunteers"
 wif_rkg_terror_opinion:0 "The Jews of Norway"
 wif_rkg_dover_opinion:0 "Loyal to Dover"
