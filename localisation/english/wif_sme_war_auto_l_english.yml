 wif_sme_switch.stay:0 "We stay with what is left."
 wif_sme_switch.1.t:0 "The Russian Empire Breaks Away"
 wif_sme_switch.1.d:0 "[400.GetName] no longer answer to us. Vladimir III Romanov has declared the Russian Empire, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.1.b:0 "Lead the Russian Empire instead."
 wif_sme_switch.2.t:0 "The Neutral State of Vologda Breaks Away"
 wif_sme_switch.2.d:0 "[351.GetName] no longer answer to us. Valimer Kasparov has declared the Neutral State of Vologda, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.2.b:0 "Lead the Neutral State of Vologda instead."
 wif_sme_switch.3.t:0 "The Gorky Soviet Republic Breaks Away"
 wif_sme_switch.3.d:0 "[252.GetName] no longer answer to us. Leyanold Raziv has declared the Gorky Soviet Republic, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.3.b:0 "Lead the Gorky Soviet Republic instead."
 wif_sme_switch.5.t:0 "The Orthodox Order of Saint George Breaks Away"
 wif_sme_switch.5.d:0 "[1085.GetName] no longer answer to us. Cyril Pavlov has declared the Orthodox Order of Saint George, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.5.b:0 "Lead the Orthodox Order of Saint George instead."
 wif_sme_switch.6.t:0 "The Free Republic of Komi Breaks Away"
 wif_sme_switch.6.d:0 "[397.GetName], [880.GetName], [262.GetName], [581.GetName] no longer answer to us. Nikolai Voznesensky has declared the Free Republic of Komi, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.6.b:0 "Lead the Free Republic of Komi instead."
 wif_sme_switch.7.t:0 "The Aryan Brotherhood Breaks Away"
 wif_sme_switch.7.d:0 "[398.GetName] no longer answer to us. Alexey Dobrovolsky has declared the Aryan Brotherhood, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.7.b:0 "Lead the Aryan Brotherhood instead."
 wif_sme_switch.8.t:0 "The Russian National State Breaks Away"
 wif_sme_switch.8.d:0 "[1084.GetName], [1083.GetName], [1082.GetName], [399.GetName] no longer answer to us. Boris Yeltsin has declared the Russian National State, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.8.b:0 "Lead the Russian National State instead."
 wif_sme_switch.9.t:0 "The Russian Fascist State Breaks Away"
 wif_sme_switch.9.d:0 "[251.GetName], [401.GetName] no longer answer to us. Yuri Molotov has declared the Russian Fascist State, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.9.b:0 "Lead the Russian Fascist State instead."
 wif_sme_switch.10.t:0 "The Syndicalist State of the True Proletariat Breaks Away"
 wif_sme_switch.10.d:0 "[652.GetName], [582.GetName], [651.GetName], [573.GetName] no longer answer to us. Leonid Brezhnev has declared the Syndicalist State of the True Proletariat, and a part of the army has gone with him. Nobody is coming to stop it: there is nothing left to send."
 wif_sme_switch.10.b:0 "Lead the Syndicalist State of the True Proletariat instead."
