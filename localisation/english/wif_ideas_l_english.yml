l_english:
 active_russian_resistance:0 "Active Russian Resistance"
 active_russian_resistance_desc:0 "The local Russian population fiercely resists German occupation, hampering compliance efforts and fueling partisan activity."
 GER_german_controlled_reichskommissariat:0 "Reichskommissariat"
 wif_military_factory_ceiling:0 "Military Factory Ceiling Reached"
 wif_military_factory_ceiling_desc:0 "Our military industry has reached the limit our civilian economy can sustain at the current level of international tension. No further military factories can be completed until we expand our civilian industry or tension rises."
 wif_military_factory_ceiling_far:0 "Military Factory Ceiling Exceeded"
 wif_military_factory_ceiling_far_desc:0 "Our military industry stands well beyond what the civilian economy can sustain. No further military factories can be completed, and the state is offering favourable terms to industrialists willing to convert armament plants back to civilian production."
 wif_military_factory_ceiling_severe:0 "Military Industry Overextended"
 wif_military_factory_ceiling_severe_desc:0 "The armaments sector has grown so far past what our civilian economy can support that the whole industrial base is faltering. Shortages of labour, machine tools and transport are strangling output across every plant in the country. This will not correct itself until the imbalance is unwound."
