 wif_bul_a_new_europe_new_balkans:0 "A New Europe, a New Balkans"
 wif_bul_a_new_europe_new_balkans_desc:0 "Germany has won in the West and in the East, and Bulgaria stood with it from the first. Thirty years after Neuilly, Sofia has its revenge - and must now live in the Reich's Europe."
