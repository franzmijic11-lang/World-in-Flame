l_english:
 wif_bulv_new_europe_new_balkans:0 "A New Europe, a New Balkans"
 wif_bulv_new_europe_new_balkans_desc:0 "Germany has won in the West and in the East, and Bulgaria stood with it from the first. Macedonia, Thrace and the Dobruja are Bulgarian; the Aegean is in sight from Bulgarian hills. Thirty years after Neuilly, Sofia has its revenge - and must now live in the Reich's Europe."
 wif_bulv_who_governs_sofia:0 "Who Governs in Sofia"
 wif_bulv_who_governs_sofia_desc:0 "The war is won. The palace, the generals of the Military League and the street movements all claim the victory as theirs."
 wif_bulv_the_crown:0 "The Crown of the Third Kingdom"
 wif_bulv_the_crown_desc:0 "Whoever governs, governs in the name of the Tsar - of Boris, of the boy Simeon, of the regents who rule for him."
 wif_bulv_berlins_demand:0 "Berlin's Demand"
 wif_bulv_berlins_demand_desc:0 "In March 1943 Bulgaria handed 11,343 Jews from occupied Thrace and Macedonia to the Germans - and refused to hand over its own 48,000, after the deputy speaker Dimitar Peshev, the Church and the public protested. Victorious Germany asks again."
 wif_bulv_legions_question:0 "The Ratniks and the Legions"
 wif_bulv_legions_question_desc:0 "The Ratniks and the Union of Bulgarian National Legions marched for the Axis. Now they want the state."
 wif_bulv_state_security:0 "State Security"
 wif_bulv_state_security_desc:0 "The police directorate of the capital, with files on every school, union and village."
 wif_bulv_partisans_in_the_mountains:0 "The Partisans in the Mountains"
 wif_bulv_partisans_in_the_mountains_desc:0 "Communist and agrarian partisans still hold out in the Balkan range and the Sredna Gora."
 wif_bulv_the_peshev_letter:0 "The Peshev Letter"
 wif_bulv_the_peshev_letter_desc:0 "As in 1943: forty-three deputies sign a protest, the Metropolitans Stefan and Kiril stand at the station, and the trains leave empty. The Jews of Bulgaria proper stay."
 wif_bulv_the_trains_from_thrace:0 "The Trains from Sofia"
 wif_bulv_the_trains_from_thrace_desc:0 "In 1943 only the Jews of the new lands were sent to Treblinka. In this Europe Sofia gives the rest as well: 48,000 people, assembled in the provinces and put on the trains north."
 wif_bulv_tame_the_legions:0 "Tame the Legions"
 wif_bulv_tame_the_legions_desc:0 "Uniforms banned, leaders given posts, street fighters sent to the army."
 wif_bulv_legions_in_power:0 "The Legions in Power"
 wif_bulv_legions_in_power_desc:0 "Professor Tsankov's men and the Legionaries take the ministries."
 wif_bulv_crush_the_partisans:0 "Crush the Partisans"
 wif_bulv_crush_the_partisans_desc:0 "Gendarmerie and army sweep the mountains; villages that fed the partisans are burned."
 wif_bulv_amnesty:0 "The Amnesty"
 wif_bulv_amnesty_desc:0 "Those who come down from the mountains with their rifles keep their lives."
 wif_bulv_the_fatherland_union:0 "One Fatherland"
 wif_bulv_the_fatherland_union_desc:0 "Propaganda for a Greater Bulgaria in every school and newspaper."
 wif_bulv_the_supreme_council:0 "The Supreme Council"
 wif_bulv_the_supreme_council_desc:0 "A council of the Crown, the army and the party that governs above parliament."
 wif_bulv_the_press_directorate:0 "The Press Directorate"
 wif_bulv_the_press_directorate_desc:0 "Every newspaper licensed, every editor a member."
 wif_bulv_order_in_the_villages:0 "Order in the Villages"
 wif_bulv_order_in_the_villages_desc:0 "Whatever was done in the mountains, the villages are quiet now."
 wif_bulv_a_kingdom_consolidated:0 "A Kingdom Consolidated"
 wif_bulv_a_kingdom_consolidated_desc:0 "The Third Bulgarian Kingdom is governed - firmly."
 wif_bulv_bulgaria_at_mid_century:0 "Bulgaria at Mid-Century"
 wif_bulv_bulgaria_at_mid_century_desc:0 "A small kingdom that came out of the war larger than at any time since the tsars of Tarnovo."
 wif_bulv_the_new_lands:0 "The New Lands"
 wif_bulv_the_new_lands_desc:0 "Vardar Macedonia, Western Thrace, the Aegean coast: Bulgarian at last, and to be governed as Bulgarian."
 wif_bulv_the_aegean_coast:0 "The Aegean Coast"
 wif_bulv_the_aegean_coast_desc:0 "Kavala and Dedeagach: Bulgaria's window on the White Sea, lost in 1919, regained."
 wif_bulv_skopje_university:0 "The University of Skopje"
 wif_bulv_skopje_university_desc:0 "The King Boris University opens in Skopje in 1943 - Bulgarian, of course."
 wif_bulv_macedonian_question:0 "The Macedonian Question"
 wif_bulv_macedonian_question_desc:0 "Are the Macedonians Bulgarians? Sofia says yes. Many Macedonians are no longer sure."
 wif_bulv_the_greeks_of_thrace:0 "The Greeks of Thrace"
 wif_bulv_the_greeks_of_thrace_desc:0 "Three hundred thousand Greeks live in Bulgaria's Thrace."
 wif_bulv_bulgarisation:0 "Bulgarisation"
 wif_bulv_bulgarisation_desc:0 "Bulgarian schools, Bulgarian priests, Bulgarian names on the shop signs."
 wif_bulv_imro_autonomy:0 "An IMRO Autonomy"
 wif_bulv_imro_autonomy_desc:0 "Ivan Mihailov's Internal Macedonian Revolutionary Organisation gets its autonomous Macedonia - under the Bulgarian crown."
 wif_bulv_drama_uprising:0 "Drama, 1941"
 wif_bulv_drama_uprising_desc:0 "September 1941: Greeks rise at Drama, and the Bulgarian army answers by killing some 3,000 people in Drama, Doxato and the villages. Colonists from Bulgaria take the empty farms."
 wif_bulv_the_exarchate:0 "The Bulgarian Exarchate"
 wif_bulv_the_exarchate_desc:0 "The Bulgarian Church takes over the dioceses of Macedonia and Thrace."
 wif_bulv_tito_in_macedonia:0 "Tito's Men in Macedonia"
 wif_bulv_tito_in_macedonia_desc:0 "Yugoslav partisans cross into the mountains around Ohrid and Prilep."
 wif_bulv_ohrid:0 "Ohrid"
 wif_bulv_ohrid_desc:0 "The lake and the see of St Clement, the cradle of Bulgarian letters."
 wif_bulv_settle_thrace:0 "Settle Thrace"
 wif_bulv_settle_thrace_desc:0 "Bulgarian families on the farms of Thrace."
 wif_bulv_the_morava_line:0 "The Morava Line"
 wif_bulv_the_morava_line_desc:0 "The new border with Serbia must be held."
 wif_bulv_the_white_sea:0 "Bulgaria on the White Sea"
 wif_bulv_the_white_sea_desc:0 "From the Danube to the Aegean."
 wif_bulv_san_stefano:0 "The Bulgaria of San Stefano"
 wif_bulv_san_stefano_desc:0 "In 1878 the Treaty of San Stefano drew a Greater Bulgaria that the Great Powers tore up within months. Seventy years later it is real."
 wif_bulv_peace_economy:0 "The Peace Economy"
 wif_bulv_peace_economy_desc:0 "The war orders stop, the Reich's markets open."
 wif_bulv_tobacco:0 "Tobacco for the Reich"
 wif_bulv_tobacco_desc:0 "Bulgaria grows the Reich's cigarettes: Reemtsma buys the whole Thracian crop."
 wif_bulv_pernik:0 "The Pernik Mines"
 wif_bulv_pernik_desc:0 "The coal of Pernik powers Sofia's industry."
 wif_bulv_rose_valley:0 "The Rose Valley"
 wif_bulv_rose_valley_desc:0 "Kazanlak's rose oil sells for its weight in gold."
 wif_bulv_aegean_ports:0 "The Aegean Ports"
 wif_bulv_aegean_ports_desc:0 "Kavala and Dedeagach, linked to Plovdiv by rail."
 wif_bulv_black_sea_trade:0 "Varna and Burgas"
 wif_bulv_black_sea_trade_desc:0 "The Black Sea ports, free of the Soviet fleet."
 wif_bulv_kremikovtsi:0 "The Kremikovtsi Ore"
 wif_bulv_kremikovtsi_desc:0 "Iron ore near Sofia - enough for a steel works."
 wif_bulv_state_railways:0 "The State Railways"
 wif_bulv_state_railways_desc:0 "New lines to Skopje and Kavala."
 wif_bulv_sofia_works:0 "The Sofia Arms Works"
 wif_bulv_sofia_works_desc:0 "Rifles and shells made at home."
 wif_bulv_iskar_dams:0 "The Iskar Dams"
 wif_bulv_iskar_dams_desc:0 "Hydro-electric power from the Rila and the Iskar gorge."
 wif_bulv_cooperatives:0 "The Cooperatives"
 wif_bulv_cooperatives_desc:0 "Bulgaria's village cooperatives - the strongest in the Balkans - buy tractors together."
 wif_bulv_the_polytechnic:0 "The State Polytechnic"
 wif_bulv_the_polytechnic_desc:0 "Sofia trains its own engineers at last."
 wif_bulv_dimitrovgrad:0 "A New Industrial Town"
 wif_bulv_dimitrovgrad_desc:0 "A planned town of chemical works and power stations on the Maritsa."
 wif_bulv_electrify:0 "Electrify the Villages"
 wif_bulv_electrify_desc:0 "Light in every village."
 wif_bulv_grossraum_partner:0 "A Partner in the Grossraum"
 wif_bulv_grossraum_partner_desc:0 "Bulgaria sells to the Reich at the Reich's prices - and asks for factories in return."
 wif_bulv_a_strong_lev:0 "A Strong Lev"
 wif_bulv_a_strong_lev_desc:0 "Our own currency, our own prices."
 wif_bulv_balkan_market:0 "The Balkan Market"
 wif_bulv_balkan_market_desc:0 "Trade with Bucharest, Ankara, Belgrade and Zagreb."
 wif_bulv_industrial_bulgaria:0 "An Industrial Bulgaria"
 wif_bulv_industrial_bulgaria_desc:0 "The garden of the Balkans has factories."
 wif_bulv_economy_1952:0 "The Economy of 1952"
 wif_bulv_economy_1952_desc:0 "Richer than ever before."
 wif_bulv_army_after_victory:0 "The Army After Victory"
 wif_bulv_army_after_victory_desc:0 "The Bulgarian army fought little and occupied much. Now it must become a real army."
 wif_bulv_occupation_corps:0 "The Occupation Corps"
 wif_bulv_occupation_corps_desc:0 "Bulgarian divisions still garrison southern Serbia for the Reich, as they did from 1942."
 wif_bulv_mountain_troops:0 "The Mountain Troops"
 wif_bulv_mountain_troops_desc:0 "Rila, Pirin and Rhodope: Bulgaria is a mountain country."
 wif_bulv_army_reform:0 "Reform the Army"
 wif_bulv_army_reform_desc:0 "German instructors and German doctrine."
 wif_bulv_maybach_programme:0 "The Maybach Programme"
 wif_bulv_maybach_programme_desc:0 "In 1943 Germany sold Bulgaria Panzer IVs and assault guns under the 'Maybach' programme. More can be bought."
 wif_bulv_air_force:0 "The Royal Air Force"
 wif_bulv_air_force_desc:0 "The Vazdushni Voyski, with German fighters and Bulgarian DAR aircraft."
 wif_bulv_counter_insurgency:0 "Counter-Insurgency"
 wif_bulv_counter_insurgency_desc:0 "Years of hunting partisans in Serbia and Macedonia."
 wif_bulv_military_academy:0 "The Military Academy"
 wif_bulv_military_academy_desc:0 "The Sofia academy, reorganised on the German model."
 wif_bulv_armoured_brigade:0 "The Armoured Brigade"
 wif_bulv_armoured_brigade_desc:0 "A real armoured division, built around the Maybach tanks."
 wif_bulv_dar_aircraft:0 "DAR Aircraft"
 wif_bulv_dar_aircraft_desc:0 "The State Aircraft Workshops at Bozhurishte build Bulgarian designs."
 wif_bulv_rhodope_line:0 "The Rhodope Line"
 wif_bulv_rhodope_line_desc:0 "Bunkers in the passes to the south and the west."
 wif_bulv_standing_army:0 "A Standing Army"
 wif_bulv_standing_army_desc:0 "Twenty divisions in peacetime."
 wif_bulv_aegean_fleet:0 "The Aegean Fleet"
 wif_bulv_aegean_fleet_desc:0 "Torpedo boats and submarines at Kavala."
 wif_bulv_black_sea_flotilla:0 "The Black Sea Flotilla"
 wif_bulv_black_sea_flotilla_desc:0 "Varna's small fleet, rebuilt."
 wif_bulv_army_of_1950:0 "The Army of 1950"
 wif_bulv_army_of_1950_desc:0 "An army for a kingdom of three seas."
 wif_bulv_jets:0 "German Jets"
 wif_bulv_jets_desc:0 "The first Bulgarian jet squadron."
 wif_bulv_new_europe:0 "Bulgaria in the New Europe"
 wif_bulv_new_europe_desc:0 "Berlin rules the continent. Bulgaria, the most faithful of its Balkan allies, wants its reward to last."
 wif_bulv_berlin_first:0 "Berlin First"
 wif_bulv_berlin_first_desc:0 "Bulgaria owes its new lands to the Reich."
 wif_bulv_the_savoy_link:0 "The Savoy Link"
 wif_bulv_the_savoy_link_desc:0 "The Tsaritsa Giovanna is a princess of Savoy. Rome is Sofia's second friend."
 wif_bulv_watch_belgrade:0 "Watching Belgrade"
 wif_bulv_watch_belgrade_desc:0 "What is left of Serbia remembers Macedonia."
 wif_bulv_the_dobruja_friendship:0 "The Dobruja Settled"
 wif_bulv_the_dobruja_friendship_desc:0 "Craiova gave back Southern Dobruja peacefully. Bucharest is a neighbour, not an enemy."
 wif_bulv_ankara:0 "The Turkish Neighbour"
 wif_bulv_ankara_desc:0 "Turkey courts the Balkans - and watches its Bulgarian Turks."
 wif_bulv_budapest:0 "Friends in Budapest"
 wif_bulv_budapest_desc:0 "Hungary, too, was cheated in 1919 - and has its own quarrel with Bucharest."
 wif_bulv_anti_comintern:0 "The Anti-Comintern Congress"
 wif_bulv_anti_comintern_desc:0 "Sofia hosts the victors over Bolshevism."
 wif_bulv_adriatic_ambitions:0 "Rome and the Adriatic"
 wif_bulv_adriatic_ambitions_desc:0 "Albania and Montenegro are Italy's; Macedonia is Bulgaria's. A border to agree."
 wif_bulv_greek_question:0 "The Greek Question"
 wif_bulv_greek_question_desc:0 "What is left of Greece wants Thrace back."
 wif_bulv_black_sea_pact:0 "A Black Sea Understanding"
 wif_bulv_black_sea_pact_desc:0 "Bucharest, Sofia and Ankara agree to keep the Black Sea quiet."
 wif_bulv_danube_friends:0 "The Danube Friends"
 wif_bulv_danube_friends_desc:0 "Sofia and Budapest trade and plan together."
 wif_bulv_reich_divided:0 "The Reich Divided"
 wif_bulv_reich_divided_desc:0 "The Reich is at war with itself. Its guarantees of the new borders are worth what its armies can enforce."
 wif_bulv_stand_with_the_axis:0 "Stand with the Axis"
 wif_bulv_stand_with_the_axis_desc:0 "Bulgaria owes everything to the Reich. Whatever happens in Berlin, Sofia stays in the Axis - and in whichever Germany comes out of the war."
 wif_bulv_join_rome:0 "The Invitation from Rome"
 wif_bulv_join_rome_desc:0 "Italy's Pact of Rome wants Bulgaria - and the Tsaritsa's family is in Rome."
 wif_bulv_hold_thrace:0 "Hold Thrace"
 wif_bulv_hold_thrace_desc:0 "Greece and Turkey will look at Thrace while Berlin cannot protect it."
 wif_bulv_stand_by_the_winner:0 "Wait and Stand By the Winner"
 wif_bulv_stand_by_the_winner_desc:0 "Sofia keeps its army at home and its ambassadors polite."
 wif_bulv_dark_dawn:0 "A Dark Dawn over Germany"
 wif_bulv_dark_dawn_desc:0 "The SS has won the civil war. Sofia does not trust Reinhard Heydrich - and the Tsar's court has never trusted the SS."
 wif_bulv_tarnovo_constitution:0 "The Tarnovo Crown"
 wif_bulv_tarnovo_constitution_desc:0 "With Rome behind it and Berlin no friend, Sofia governs for itself."
 wif_bulv_reich_returns:0 "The Reich Returns"
 wif_bulv_reich_returns_desc:0 "Germany is one again - and asks who stood where in its civil war."
 wif_bulv_bow_to_the_reich:0 "Bow to the Reich"
 wif_bulv_bow_to_the_reich_desc:0 "Back into Berlin's faction."
 wif_bulv_defy_the_reich:0 "Defy the Reich"
 wif_bulv_defy_the_reich_desc:0 "Bulgaria stays its own master."
 wif_bulv_bulgaria_1952:0 "Bulgaria in 1952"
 wif_bulv_bulgaria_1952_desc:0 "The Third Bulgarian Kingdom has outlived the Reich's war with itself."
 wif_bulv_victory_idea:0 "A New Europe, a New Balkans"
 wif_bulv_victory_idea_desc:0 "Neuilly is avenged; the Aegean is Bulgarian."
 wif_bulv_state_security_idea:0 "State Security"
 wif_bulv_state_security_idea_desc:0 "Files on every school, union and village."
 wif_bulv_legions_idea:0 "The Legions in Power"
 wif_bulv_legions_idea_desc:0 "The Legionaries hold the ministries."
 wif_bulv_supreme_council_idea:0 "The Supreme Council"
 wif_bulv_supreme_council_idea_desc:0 "Crown, army and party govern above parliament."
 wif_bulv_villages_idea:0 "Order in the Villages"
 wif_bulv_villages_idea_desc:0 "The villages are quiet now."
 wif_bulv_mid_century_idea:0 "Bulgaria at Mid-Century"
 wif_bulv_mid_century_idea_desc:0 "Larger than at any time since the tsars of Tarnovo."
 wif_bulv_skopje_idea:0 "The University of Skopje"
 wif_bulv_skopje_idea_desc:0 "Bulgarian, of course."
 wif_bulv_bulgarisation_idea:0 "Bulgarisation"
 wif_bulv_bulgarisation_idea_desc:0 "Bulgarian schools, priests and names."
 wif_bulv_imro_idea:0 "The IMRO Autonomy"
 wif_bulv_imro_idea_desc:0 "An autonomous Macedonia under the Bulgarian crown."
 wif_bulv_tobacco_idea:0 "Tobacco for the Reich"
 wif_bulv_tobacco_idea_desc:0 "The Reich smokes Thracian tobacco."
 wif_bulv_rose_oil_idea:0 "The Rose Valley"
 wif_bulv_rose_oil_idea_desc:0 "Rose oil worth its weight in gold."
 wif_bulv_iskar_idea:0 "The Iskar Dams"
 wif_bulv_iskar_idea_desc:0 "Hydro-electric power from the Rila."
 wif_bulv_electrify_idea:0 "Electrified Villages"
 wif_bulv_electrify_idea_desc:0 "Light in every village."
 wif_bulv_lev_idea:0 "A Strong Lev"
 wif_bulv_lev_idea_desc:0 "Our own currency, our own prices."
 wif_bulv_balkan_market_idea:0 "The Balkan Market"
 wif_bulv_balkan_market_idea_desc:0 "Trade with every Balkan capital."
 wif_bulv_industrial_idea:0 "An Industrial Bulgaria"
 wif_bulv_industrial_idea_desc:0 "The garden of the Balkans has factories."
 wif_bulv_economy_1952_idea:0 "The Economy of 1952"
 wif_bulv_economy_1952_idea_desc:0 "Richer than ever before."
 wif_bulv_counter_insurgency_idea:0 "Counter-Insurgency"
 wif_bulv_counter_insurgency_idea_desc:0 "Years of hunting partisans."
 wif_bulv_academy_idea:0 "The Military Academy"
 wif_bulv_academy_idea_desc:0 "On the German model."
 wif_bulv_standing_army_idea:0 "A Standing Army"
 wif_bulv_standing_army_idea_desc:0 "Twenty divisions in peacetime."
 wif_bulv_flotilla_idea:0 "The Black Sea Flotilla"
 wif_bulv_flotilla_idea_desc:0 "Varna's small fleet, rebuilt."
 wif_bulv_army_1950_idea:0 "The Army of 1950"
 wif_bulv_army_1950_idea_desc:0 "An army for a kingdom of three seas."
 wif_bulv_watch_belgrade_idea:0 "Watching Belgrade"
 wif_bulv_watch_belgrade_idea_desc:0 "Serbia remembers Macedonia."
 wif_bulv_reich_divided_idea:0 "The Reich Divided"
 wif_bulv_reich_divided_idea_desc:0 "Berlin's guarantees are worth what its armies can enforce."
 wif_bulv_hold_thrace_idea:0 "Hold Thrace"
 wif_bulv_hold_thrace_idea_desc:0 "Greece and Turkey are watching."
 wif_bulv_1952_idea:0 "Bulgaria in 1952"
 wif_bulv_1952_idea_desc:0 "The Third Kingdom has outlived the Reich's war with itself."
