 JAP_wif_america_out_of_asia:0 "America out of Asia"
 JAP_wif_america_out_of_asia_desc:0 "The Americans came to Asia with gunboats and stayed with garrisons. Their islands are ours, their Philippine colony is ours, and the colonial empires that stood behind them have nothing left to stand on. It is time to dictate the peace of the Pacific."
 wif_jap_aooa_tt_china:0 "We have beaten §YNationalist§! or §YCommunist China§! in war"
 wif_jap_aooa_tt_coast:0 "We or our puppets control the whole §YChinese coast§! from Manchuria to Hainan (Hong Kong, Macau and Guangzhouwan excepted)"
 wif_jap_aooa_tt_usa:0 "At war with the §YUnited States§!"
 wif_jap_aooa_tt_philippines:0 "We or our puppets control the §YPhilippines§!"
 wif_jap_aooa_tt_us_islands:0 "We or our puppets control every §YAmerican Pacific island§! west of Hawaii (Midway, Wake, Guam, Johnston, the Line and Phoenix Islands, American Samoa; not the Aleutians)"
 wif_jap_aooa_tt_hawaii:0 "We or our puppets control §YHawaii§!, or we have dropped an atomic bomb on it"
 wif_jap_aooa_tt_indochina:0 "If its owner is at war with us: we or our puppets control §YIndochina§!"
 wif_jap_aooa_tt_burma:0 "If their owners are at war with us: we or our puppets control all of §YBurma§! and §YBihar§!"
 wif_jap_aooa_tt_malaya:0 "If their owners are at war with us: we or our puppets control all of §YMalaya§!, §YSingapore§!, §YBrunei§! and British Borneo"
 wif_jap_aooa_tt_indonesia:0 "If their owners are at war with us: we or our puppets control all of the §YEast Indies§!"
 wif_jap_aooa_peace_tt:0 "Every war between our side and our enemies ends in a §Ydictated peace§!. Land we occupy that is not named below is §Rhanded back§!.\nOnly from countries at war with us:\n - §YJapan§! annexes the Philippines and every American Pacific island west of the Pitcairn Islands, and our other enemies' Pacific islands (not Australia's or New Zealand's).\n - §YHawaii§! becomes an Imperial Protectorate.\n - French Indochina, the East Indies, Malaya, Singapore, Brunei, Timor, the Bismarck Archipelago, Australian Papua and the Solomon Islands become the §YGreater East Asian Prosperous Nation of South East Asia§!, an Imperial Protectorate.\n - Burma, East and West Bengal, Bihar, Assam, Manipur, Sikkim and Arunachal Pradesh become the §YIndian Free State§!, an Imperial Protectorate.\n§YChristmas Island§! goes to South East Asia in any case.\nThe §YUnited States§! must accept the loss of its Pacific empire."
 wif_jap_loss_in_the_east:0 "Loss in the East"
 wif_jap_loss_in_the_east_desc:0 "The Pacific fleet is gone, the Philippines are gone, and the flag has come down over islands Americans had learned to think of as their own. The army that has to rebuild from this does not trust its plans, its officers or the sea."
 wif_jap_aooa_christmas_seized:0 "Seized Christmas Island"
 wif_jap_aooa.1.t:0 "The Pacific Settlement"
 wif_jap_aooa.1.d:0 "The guns have fallen silent across the Pacific. Under terms dictated in Tokyo, the United States has given up the Philippines and its island empire, and the colonial order in South East Asia is gone. Two new states stand in its place under Japanese protection: the Greater East Asian Prosperous Nation of South East Asia, governed from Singapore by Yoshi Basubisi, and the Indian Free State under Shizu Akamori. Every war Japan was fighting has ended with it."
 wif_jap_aooa.1.a:0 "Asia for the Asians."
 wif_jap_aooa.1.b:0 "We will remember this."
 wif_jap_aooa.1.c:0 "The map of Asia is redrawn."
 wif_jap_aooa.2.t:0 "Japan Seizes Christmas Island"
 wif_jap_aooa.2.d:0 "As part of its Pacific settlement, Japan has handed Christmas Island to its new South East Asian protectorate. Nobody asked us. The island is small and far away, but the question is what we do about it."
 wif_jap_aooa.2.a:0 "It is not worth the trouble."
 wif_jap_aooa.2.b:0 "Lodge a formal protest."
 wif_jap_aooa.2.c:0 "Embargo Japan."
