l_english:
 wif_steel_manufacturer: "Steel Manufacturer"
 wif_steel_manufacturer_plural: "Steel Manufacturers"
 wif_steel_manufacturer_desc: "A dedicated works producing §YSteel§! for the state it stands in. Takes a free factory slot, like a civilian factory. Output rises with research."
 wif_aluminium_manufacturer: "Aluminium Manufacturer"
 wif_aluminium_manufacturer_plural: "Aluminium Manufacturers"
 wif_aluminium_manufacturer_desc: "A dedicated works producing §YAluminium§! for the state it stands in. Takes a free factory slot, like a civilian factory. Output rises with research."
 wif_chromium_manufacturer: "Chromium Manufacturer"
 wif_chromium_manufacturer_plural: "Chromium Manufacturers"
 wif_chromium_manufacturer_desc: "A dedicated works producing §YChromium§! for the state it stands in. Takes a free factory slot, like a civilian factory. Output rises with research."
 wif_tungsten_manufacturer: "Tungsten Manufacturer"
 wif_tungsten_manufacturer_plural: "Tungsten Manufacturers"
 wif_tungsten_manufacturer_desc: "A dedicated works producing §YTungsten§! for the state it stands in. Takes a free factory slot, like a civilian factory. Output rises with research."
 wif_metal_working_plants: "Improved Metal Working Plants"
 wif_metal_working_plants_desc: "Purpose-built rolling mills and electrolytic smelters let us turn imported ore and scrap into steel and aluminium at home, rather than depending on what foreign markets will sell us."
 wif_metal_working_plants2: "Improved Metal Working Plants II"
 wif_metal_working_plants2_desc: "Continuous casting and better furnace linings raise the output of every steel and aluminium manufacturer we operate."
 wif_metal_working_plants3: "Improved Metal Working Plants III"
 wif_metal_working_plants3_desc: "Oxygen converters and modern reduction cells push our steel and aluminium plants to their full capacity."
 wif_chromium_working: "Chromium Working I"
 wif_chromium_working_desc: "Recovering chromium from low-grade ore and alloy scrap lets us build plants dedicated to this vital alloying metal."
 wif_chromium_working2: "Chromium Working II"
 wif_chromium_working2_desc: "Improved leaching and reduction processes raise the yield of our chromium manufacturers."
 wif_chromium_working3: "Chromium Working III"
 wif_chromium_working3_desc: "Fully modernised chromium works extract every last trace of the metal from their feedstock."
 wif_tungsten_working: "Tungsten Working I"
 wif_tungsten_working_desc: "Tungsten recovery from scheelite tailings and worn tooling makes dedicated tungsten plants worthwhile."
 wif_tungsten_working2: "Tungsten Working II"
 wif_tungsten_working2_desc: "Better powder metallurgy raises the output of our tungsten manufacturers."
 wif_tungsten_working3: "Tungsten Working III"
 wif_tungsten_working3_desc: "Modern carbide recycling and refining bring our tungsten manufacturers to peak output."
