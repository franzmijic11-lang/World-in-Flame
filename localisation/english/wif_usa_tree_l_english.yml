l_english:
 wif_usa_continue_new_deal:0 "Continue the New Deal"
 wif_usa_continue_new_deal_desc:0 "The Supreme Court has struck down the NRA and the First New Deal is in pieces. Roosevelt goes back to Congress with a bolder programme."
 wif_usa_relief:0 "Relief: The Works Progress Administration"
 wif_usa_relief_desc:0 "Put the unemployed to work today, on anything that needs building."
 wif_usa_ccc:0 "Civilian Conservation Corps"
 wif_usa_ccc_desc:0 "Three million young men plant forests, fight floods and learn to march in step."
 wif_usa_rea:0 "Rural Electrification"
 wif_usa_rea_desc:0 "Nine farms in ten have no electricity. Change that."
 wif_usa_dust_bowl:0 "Rescue the Dust Bowl"
 wif_usa_dust_bowl_desc:0 "The Great Plains are blowing away. Shelterbelts, soil conservation and relief for the Okies."
 wif_usa_recovery:0 "Recovery: Public Works Administration"
 wif_usa_recovery_desc:0 "Not make-work but big projects: dams, bridges, airports, warships."
 wif_usa_housing_act:0 "The Housing Act"
 wif_usa_housing_act_desc:0 "Slum clearance and cheap mortgages put the building trades back to work."
 wif_usa_flsa:0 "Fair Labor Standards Act"
 wif_usa_flsa_desc:0 "A minimum wage and a forty-hour week."
 wif_usa_balance_budget:0 "Balance the Budget"
 wif_usa_balance_budget_desc:0 "Morgenthau says the emergency is over and the deficit must go. He may be early."
 wif_usa_spend_way_out:0 "Spend Our Way Out"
 wif_usa_spend_way_out_desc:0 "Keynes writes to the President: cutting now would throw the country back into the pit. Keep spending."
 wif_usa_court_question:0 "The Court Question"
 wif_usa_court_question_desc:0 "Five old men keep striking down the New Deal. Something has to give."
 wif_usa_pack_court:0 "Pack the Court"
 wif_usa_pack_court_desc:0 "Six new justices, one for every judge over seventy."
 wif_usa_wait_old_men:0 "Wait Out the Nine Old Men"
 wif_usa_wait_old_men_desc:0 "Justices retire. Justices die. Roosevelt can be patient."
 wif_usa_reform:0 "Reform: The Social Security Act"
 wif_usa_reform_desc:0 "Old-age pensions and unemployment insurance - the safety net that keeps the next crash from becoming the last one."
 wif_usa_sec:0 "Tame Wall Street"
 wif_usa_sec_desc:0 "The Securities and Exchange Commission and Glass-Steagall put a fence around the speculators."
 wif_usa_wagner_act:0 "The Wagner Act"
 wif_usa_wagner_act_desc:0 "Unions get the right to organise and bargain."
 wif_usa_recovery_achieved:0 "The Depression Is Over"
 wif_usa_recovery_achieved_desc:0 "Not a single day when it ended, but by now the breadlines are gone."
 wif_usa_tva:0 "Tennessee Valley Authority"
 wif_usa_tva_desc:0 "Dams and power for the poorest valley in the country."
 wif_usa_hydro:0 "Grand Coulee and Bonneville"
 wif_usa_hydro_desc:0 "The Columbia River is harnessed. Cheap power for the Northwest."
 wif_usa_steel_mills:0 "Modernise the Steel Mills"
 wif_usa_steel_mills_desc:0 "Continuous strip mills replace the old hand-rolling lines."
 wif_usa_synthetic_rubber:0 "Synthetic Rubber Programme"
 wif_usa_synthetic_rubber_desc:0 "If the rubber of Malaya is ever cut off, America must make its own."
 wif_usa_machine_tools:0 "Machine Tools for Democracy"
 wif_usa_machine_tools_desc:0 "The bottleneck of every war economy is the machine that makes the machines."
 wif_usa_opm:0 "Office of Production Management"
 wif_usa_opm_desc:0 "Knudsen of General Motors comes to Washington to put the country on a war footing."
 wif_usa_victory_program:0 "The Victory Program"
 wif_usa_victory_program_desc:0 "Wedemeyer calculates what it would take to win a world war. The answer is everything."
 wif_usa_liberty_ships:0 "Liberty Ships"
 wif_usa_liberty_ships_desc:0 "An ugly duckling of a freighter, built in weeks."
 wif_usa_detroit:0 "Detroit Goes to War"
 wif_usa_detroit_desc:0 "The auto plants stop making cars and start making tanks and bombers."
 wif_usa_kaiser_yards:0 "Kaiser's Yards"
 wif_usa_kaiser_yards_desc:0 "Henry Kaiser builds ships like Ford built cars."
 wif_usa_wpb:0 "War Production Board"
 wif_usa_wpb_desc:0 "One board, one priority list, the whole economy."
 wif_usa_big_inch:0 "The Big Inch"
 wif_usa_big_inch_desc:0 "U-boats sink the tankers, so the oil goes overland in the world's longest pipeline."
 wif_usa_aluminium:0 "Aluminium for the Air Forces"
 wif_usa_aluminium_desc:0 "Every bomber is made of light metal, and there is never enough."
 wif_usa_miracle_production:0 "The Miracle of Production"
 wif_usa_miracle_production_desc:0 "By now America out-builds the rest of the world combined."
 wif_usa_science_haven:0 "A Haven for Science"
 wif_usa_science_haven_desc:0 "Europe's universities are purging their best minds. America can take them in."
 wif_usa_emergency_committee:0 "The Emergency Committee"
 wif_usa_emergency_committee_desc:0 "The Emergency Committee in Aid of Displaced Foreign Scholars finds university posts for refugees."
 wif_usa_ias:0 "The Institute for Advanced Study"
 wif_usa_ias_desc:0 "Princeton becomes the place where physics happens."
 wif_usa_quota:0 "Open the Quota for Scientists"
 wif_usa_quota_desc:0 "The immigration quotas are full. Write scientists an exception."
 wif_usa_einstein_letter:0 "The Einstein-Szilard Letter"
 wif_usa_einstein_letter_desc:0 "Einstein signs a letter warning the President that a uranium bomb may be possible."
 wif_usa_ndrc:0 "National Defense Research Committee"
 wif_usa_ndrc_desc:0 "Vannevar Bush organises the universities for war."
 wif_usa_osrd:0 "Office of Scientific Research and Development"
 wif_usa_osrd_desc:0 "Bush gets a budget nobody audits and a direct line to the President."
 wif_usa_rad_lab:0 "The Radiation Laboratory"
 wif_usa_rad_lab_desc:0 "The British bring the cavity magnetron in a black box. MIT builds radar around it."
 wif_usa_uranium_committee:0 "The Uranium Committee"
 wif_usa_uranium_committee_desc:0 "Fermi builds a pile under the stands of a football stadium."
 wif_usa_proximity_fuze:0 "The Proximity Fuze"
 wif_usa_proximity_fuze_desc:0 "A radio in every shell, so it bursts next to the plane."
 wif_usa_manhattan:0 "The Manhattan Project"
 wif_usa_manhattan_desc:0 "Oak Ridge, Hanford, Los Alamos. The largest secret in history."
 wif_usa_big_science:0 "Big Science"
 wif_usa_big_science_desc:0 "The war has taught the government that money and scientists, in large enough amounts, can do anything."
 wif_usa_armed_forces:0 "Modernise the Armed Forces"
 wif_usa_armed_forces_desc:0 "The Army is the 17th largest in the world, behind Portugal. That cannot last."
 wif_usa_pmp:0 "Protective Mobilization Plan"
 wif_usa_pmp_desc:0 "A plan to put a trained army of 400,000 in the field in weeks."
 wif_usa_selective_service:0 "Selective Service Act"
 wif_usa_selective_service_desc:0 "The first peacetime draft in American history."
 wif_usa_garand:0 "The Garand Rifle"
 wif_usa_garand_desc:0 "The only semi-automatic service rifle in the world."
 wif_usa_louisiana:0 "The Louisiana Maneuvers"
 wif_usa_louisiana_desc:0 "Four hundred thousand men in the swamps, and a generation of generals found and fired."
 wif_usa_armored_force:0 "The Armored Force"
 wif_usa_armored_force_desc:0 "After France, the cavalry loses the argument."
 wif_usa_ninety_divisions:0 "The Ninety-Division Gamble"
 wif_usa_ninety_divisions_desc:0 "Marshall bets that ninety divisions, well equipped, are enough."
 wif_usa_vinson_act:0 "The Second Vinson Act"
 wif_usa_vinson_act_desc:0 "Twenty per cent more navy."
 wif_usa_two_ocean:0 "The Two-Ocean Navy Act"
 wif_usa_two_ocean_desc:0 "One fleet for the Atlantic, one for the Pacific, and neither borrowed from the other."
 wif_usa_carrier_navy:0 "The Carrier Navy"
 wif_usa_carrier_navy_desc:0 "Battleships are the past. Flat-tops are the future."
 wif_usa_essex:0 "The Essex Class"
 wif_usa_essex_desc:0 "Twenty-four fleet carriers on order."
 wif_usa_air_corps:0 "Expand the Air Corps"
 wif_usa_air_corps_desc:0 "Five thousand planes is not an air force. Fifty thousand is."
 wif_usa_flying_fortress:0 "The Flying Fortress"
 wif_usa_flying_fortress_desc:0 "A bomber that defends itself."
 wif_usa_pursuit:0 "Pursuit Fighters"
 wif_usa_pursuit_desc:0 "The Lightning, the Thunderbolt and, soon, the Mustang."
 wif_usa_aaf:0 "The Army Air Forces"
 wif_usa_aaf_desc:0 "Hap Arnold gets an air force that is almost independent."
 wif_usa_fifty_thousand:0 "Fifty Thousand Planes a Year"
 wif_usa_fifty_thousand_desc:0 "Roosevelt's number was called impossible. Industry beats it."
 wif_usa_jcs:0 "The Joint Chiefs of Staff"
 wif_usa_jcs_desc:0 "Army, Navy and Air plan one war together."
 wif_usa_neutrality_act:0 "The Neutrality Act"
 wif_usa_neutrality_act_desc:0 "Congress swears America will not be dragged into another European war."
 wif_usa_good_neighbor:0 "The Good Neighbor Policy"
 wif_usa_good_neighbor_desc:0 "No more Marines in Nicaragua. Partners, not protectorates."
 wif_usa_quarantine:0 "The Quarantine Speech"
 wif_usa_quarantine_desc:0 "Roosevelt tests the water: aggressors should be quarantined like an epidemic."
 wif_usa_havana:0 "The Act of Havana"
 wif_usa_havana_desc:0 "No European colony in the Americas may change hands."
 wif_usa_cash_and_carry:0 "Cash and Carry"
 wif_usa_cash_and_carry_desc:0 "The democracies may buy arms, if they pay cash and carry them home."
 wif_usa_hemisphere_defense:0 "Hemisphere Defense"
 wif_usa_hemisphere_defense_desc:0 "Bases from Greenland to the Galapagos."
 wif_usa_destroyers_bases:0 "Destroyers for Bases"
 wif_usa_destroyers_bases_desc:0 "Fifty old destroyers for the British, ninety-nine-year leases for America."
 wif_usa_lend_lease:0 "Lend-Lease"
 wif_usa_lend_lease_desc:0 "Lend your garden hose to a neighbour whose house is on fire."
 wif_usa_arsenal_democracy:0 "The Arsenal of Democracy"
 wif_usa_arsenal_democracy_desc:0 "America will be the great arsenal of democracy."
 wif_usa_atlantic_charter:0 "The Atlantic Charter"
 wif_usa_atlantic_charter_desc:0 "Roosevelt and Churchill on a cruiser off Newfoundland agree the war aims of a war America is not in."
 wif_usa_undeclared_war:0 "The Undeclared War in the Atlantic"
 wif_usa_undeclared_war_desc:0 "US destroyers escort British convoys halfway across, and shoot first."
 wif_usa_into_the_fight:0 "Into the Fight"
 wif_usa_into_the_fight_desc:0 "December 1941 - or whenever the Axis gives Congress the reason."
 wif_usa_germany_first:0 "Germany First"
 wif_usa_germany_first_desc:0 "The strongest enemy first. The Pacific must hold with what it has."
 wif_usa_pacific_first:0 "Pacific First"
 wif_usa_pacific_first_desc:0 "Pearl Harbor is the wound the public wants avenged. MacArthur and King agree."
 wif_usa_grand_alliance:0 "The Grand Alliance"
 wif_usa_grand_alliance_desc:0 "The United Nations declaration: twenty-six nations, one war."
 wif_usa_beaten_not_defeated:0 "Beaten but not Defeated"
 wif_usa_beaten_not_defeated_desc:0 "London has made peace with Berlin. Tokyo has dictated terms in the Pacific. For the first time since 1814, America has lost a war."
 wif_usa_rising_sun_tiger:0 "A Rising Sun and a Tiger"
 wif_usa_rising_sun_tiger_desc:0 "Japan won in the Pacific, but Germany has been defeated.\n\nThis branch is not written yet."
 wif_usa_fortress_europe_free_asia:0 "Fortress Europe, Free Asia"
 wif_usa_fortress_europe_free_asia_desc:0 "Germany holds Europe, but Japan has been beaten.\n\nThis branch is not written yet."
 wif_usa_victory_achieved:0 "A Victory Achieved"
 wif_usa_victory_achieved_desc:0 "Germany and Japan are both defeated.\n\nThis branch is not written yet."
 wif_usa_who_lost:0 "Who Lost the World?"
 wif_usa_who_lost_desc:0 "Every newspaper asks it. Every congressman has an answer."
 wif_usa_inquiry:0 "The Congressional Inquiry"
 wif_usa_inquiry_desc:0 "Pearl Harbor, the convoys, the peace: a committee room, cameras and a lot of generals under oath."
 wif_usa_purge_appeasers:0 "Purge the Appeasers"
 wif_usa_purge_appeasers_desc:0 "Those who signed the peace and those who argued for it must go."
 wif_usa_national_unity:0 "A Government of National Unity"
 wif_usa_national_unity_desc:0 "Democrats and Republicans in one cabinet until the country is safe."
 wif_usa_midterms_46:0 "The 1946 Midterms"
 wif_usa_midterms_46_desc:0 "The first election since the defeat."
 wif_usa_national_security_act:0 "The National Security Act"
 wif_usa_national_security_act_desc:0 "Never again a disaster from divided command."
 wif_usa_dept_defense:0 "A Department of Defense"
 wif_usa_dept_defense_desc:0 "One department, one secretary, one budget."
 wif_usa_nsc:0 "The National Security Council"
 wif_usa_nsc_desc:0 "The President's own war room for a war that has no front line."
 wif_usa_election_48:0 "The 1948 Election"
 wif_usa_election_48_desc:0 "The country chooses who will lead the comeback."
 wif_usa_mandate_renewal:0 "A Mandate for Renewal"
 wif_usa_mandate_renewal_desc:0 "Whoever won, the country has stopped looking back."
 wif_usa_fortress_america:0 "Fortress America"
 wif_usa_fortress_america_desc:0 "The oceans did not protect us. Then the hemisphere must."
 wif_usa_monroe_reborn:0 "The Monroe Doctrine Reborn"
 wif_usa_monroe_reborn_desc:0 "No power from outside the Americas will set foot here again."
 wif_usa_continental_pact:0 "The Continental Pact"
 wif_usa_continental_pact_desc:0 "Canada carries on the fight in Asia and leads what is left of the Commonwealth. Stand with it."
 wif_usa_rio_treaty:0 "The Rio Treaty"
 wif_usa_rio_treaty_desc:0 "An attack on one American nation is an attack on all."
 wif_usa_northern_defense:0 "Joint Defense of the North"
 wif_usa_northern_defense_desc:0 "Radar lines across Canada and Alaska, so the bombers are seen coming."
 wif_usa_panama_canal:0 "Fortify the Panama Canal"
 wif_usa_panama_canal_desc:0 "The canal is the one thing that lets a one-ocean navy fight in two."
 wif_usa_aleutian_wall:0 "The Aleutian Wall"
 wif_usa_aleutian_wall_desc:0 "Japan sits in Hawaii and the Kurils. Alaska is the front line now."
 wif_usa_hemispheric_bloc:0 "The Hemispheric Bloc"
 wif_usa_hemispheric_bloc_desc:0 "From the Arctic to Cape Horn, one bloc."
 wif_usa_remember_hawaii:0 "Remember Hawaii"
 wif_usa_remember_hawaii_desc:0 "Hawaii is an Imperial Protectorate now. Americans have not forgotten."
 wif_usa_reconversion:0 "Reconversion"
 wif_usa_reconversion_desc:0 "Ten million men come home to an economy built for a war that was lost."
 wif_usa_gi_bill:0 "The GI Bill"
 wif_usa_gi_bill_desc:0 "College and a mortgage for every veteran - they fought, even if they lost."
 wif_usa_war_debt:0 "Pay Down the War Debt"
 wif_usa_war_debt_desc:0 "The war cost three hundred billion dollars and bought nothing. Pay it back."
 wif_usa_veteran_housing:0 "Houses for Veterans"
 wif_usa_veteran_housing_desc:0 "Levittown: a house, a lawn and a lot of new families."
 wif_usa_weather_recession:0 "Weather the Defeat Recession"
 wif_usa_weather_recession_desc:0 "Strikes, shortages and a dollar nobody trusts."
 wif_usa_hemispheric_recovery:0 "Hemispheric Recovery Program"
 wif_usa_hemispheric_recovery_desc:0 "Europe's Marshall Plan will never happen. Spend it on the Americas instead."
 wif_usa_interstates:0 "The Interstate Highways"
 wif_usa_interstates_desc:0 "Forty thousand miles of road, built for evacuation as much as commerce."
 wif_usa_consumer_boom:0 "The Consumer Boom"
 wif_usa_consumer_boom_desc:0 "Televisions, cars, refrigerators. Defeat or not, Americans want to live well."
 wif_usa_prosperity_restored:0 "Prosperity Restored"
 wif_usa_prosperity_restored_desc:0 "The richest country on earth is rich again."
 wif_usa_never_again:0 "Never Again Unarmed"
 wif_usa_never_again_desc:0 "America lost because it was ready too late. That will not happen twice."
 wif_usa_atomic_program:0 "The Atomic Program"
 wif_usa_atomic_program_desc:0 "Los Alamos is reopened with every resource it asks for."
 wif_usa_sac:0 "Strategic Air Command"
 wif_usa_sac_desc:0 "Curtis LeMay builds an air force whose only job is to reach the enemy's heart."
 wif_usa_crossroads:0 "Operation Crossroads"
 wif_usa_crossroads_desc:0 "The world must see that America has the bomb."
 wif_usa_peacemaker:0 "The Peacemaker"
 wif_usa_peacemaker_desc:0 "The B-36: ten thousand miles of range. Berlin and Tokyo within reach from American soil."
 wif_usa_the_super:0 "The Super"
 wif_usa_the_super_desc:0 "Teller's hydrogen bomb. A thousand times the Hiroshima bomb."
 wif_usa_jet_age:0 "Into the Jet Age"
 wif_usa_jet_age_desc:0 "The Germans had jets in 1944. America will not be second again."
 wif_usa_nautilus:0 "Project Nautilus"
 wif_usa_nautilus_desc:0 "Rickover's submarine that never needs to surface."
 wif_usa_supercarriers:0 "Supercarriers"
 wif_usa_supercarriers_desc:0 "Carriers big enough to fly jet bombers off."
 wif_usa_deterrent:0 "A Deterrent Second to None"
 wif_usa_deterrent_desc:0 "Bombers, carriers and submarines - no enemy can strike without being struck."
 wif_usa_twilight:0 "The Long Twilight Struggle"
 wif_usa_twilight_desc:0 "If America cannot fight the victors openly, it will fight them everywhere else."
 wif_usa_cia:0 "The Central Intelligence Agency"
 wif_usa_cia_desc:0 "The OSS reborn, permanent and secret."
 wif_usa_radio_free:0 "Radio Free World"
 wif_usa_radio_free_desc:0 "Broadcast the truth into the Reich and the Co-Prosperity Sphere."
 wif_usa_scottish_resistance:0 "Arm the Scottish Resistance"
 wif_usa_scottish_resistance_desc:0 "Scotland is free and Britain is a German protectorate. Keep the Scots armed."
 wif_usa_free_asia:0 "Friends in Free Asia"
 wif_usa_free_asia_desc:0 "China is beaten but not quiet. Find the men still fighting."
 wif_usa_non_aligned:0 "Courting the Non-Aligned"
 wif_usa_non_aligned_desc:0 "India, Egypt, Indonesia - nations that want neither Berlin nor Tokyo."
 wif_usa_rollback:0 "Rollback"
 wif_usa_rollback_desc:0 "Containment is for powers that won. America intends to take things back."
 wif_usa_inter_american_board:0 "The Inter-American Defense Board"
 wif_usa_inter_american_board_desc:0 "A permanent joint staff for the whole hemisphere."
 wif_usa_atlas:0 "The Atlas Missile"
 wif_usa_atlas_desc:0 "A rocket that can reach Berlin from Florida in thirty minutes."
 wif_usa_overflights:0 "Overflights of the Reich"
 wif_usa_overflights_desc:0 "High-altitude cameras over Peenemuende and Kure. Know what they have."
 wif_usa_america_stands:0 "America Stands Again"
 wif_usa_america_stands_desc:0 "1952. Seven years after the defeat, the United States is once again a power the victors must reckon with."
 wif_usa_world_after_war:0 "The World After the War"
 wif_usa_world_after_war_desc:0 "1945. However the war has gone, the country has to decide what it is now."
 wif_usa_ccc_idea:0 "Civilian Conservation Corps"
 wif_usa_ccc_idea_desc:0 "Three million young men who already know how to march."
 wif_usa_housing_idea:0 "The Housing Boom"
 wif_usa_housing_idea_desc:0 "The building trades are back at work."
 wif_usa_flsa_idea:0 "Fair Labor Standards"
 wif_usa_flsa_idea_desc:0 "A minimum wage and a forty-hour week."
 wif_usa_balanced_budget_idea:0 "A Balanced Budget"
 wif_usa_balanced_budget_idea_desc:0 "Morgenthau has his surplus."
 wif_usa_roosevelt_recession:0 "The Roosevelt Recession"
 wif_usa_roosevelt_recession_desc:0 "The spending stopped, and so did the recovery."
 wif_usa_deficit_spending:0 "Deficit Spending"
 wif_usa_deficit_spending_desc:0 "Keynes was right, and it shows."
 wif_usa_court_revolt:0 "Congress in Revolt"
 wif_usa_court_revolt_desc:0 "Even the President's own party voted against the court plan."
 wif_usa_wagner_idea:0 "The Wagner Act"
 wif_usa_wagner_idea_desc:0 "Organised labour, organised production."
 wif_usa_strip_mills:0 "Continuous Strip Mills"
 wif_usa_strip_mills_desc:0 "Steel by the mile."
 wif_usa_liberty_ships_idea:0 "Liberty Ships"
 wif_usa_liberty_ships_idea_desc:0 "An ugly duckling, built in weeks."
 wif_usa_kaiser:0 "Kaiser's Yards"
 wif_usa_kaiser_desc:0 "Ships built like Fords."
 wif_usa_miracle:0 "The Miracle of Production"
 wif_usa_miracle_desc:0 "America out-builds the world."
 wif_usa_uranium:0 "The Uranium Committee"
 wif_usa_uranium_desc:0 "A pile under the stands of a football stadium."
 wif_usa_neutrality:0 "The Neutrality Act"
 wif_usa_neutrality_desc:0 "America will not be dragged into another European war."
 wif_usa_good_neighbor_idea:0 "The Good Neighbor"
 wif_usa_good_neighbor_idea_desc:0 "Partners, not protectorates."
 wif_usa_arsenal:0 "The Arsenal of Democracy"
 wif_usa_arsenal_desc:0 "The great arsenal."
 wif_usa_grand_alliance_idea:0 "The Grand Alliance"
 wif_usa_grand_alliance_idea_desc:0 "Twenty-six nations, one war."
 wif_usa_defeat:0 "A Lost War"
 wif_usa_defeat_desc:0 "For the first time since 1814, America has lost a war."
 wif_usa_purge_idea:0 "Purge of the Appeasers"
 wif_usa_purge_idea_desc:0 "Those who signed the peace are gone."
 wif_usa_national_unity_idea:0 "National Unity"
 wif_usa_national_unity_idea_desc:0 "Both parties in one cabinet."
 wif_usa_nsa_idea:0 "The National Security Act"
 wif_usa_nsa_idea_desc:0 "Never again divided command."
 wif_usa_dod:0 "The Department of Defense"
 wif_usa_dod_desc:0 "One department, one budget."
 wif_usa_revenge:0 "A Mandate for Revenge"
 wif_usa_revenge_desc:0 "The voters chose the man who promised to get it back."
 wif_usa_recovery_mandate:0 "A Mandate for Recovery"
 wif_usa_recovery_mandate_desc:0 "The voters chose the man who promised to rebuild."
 wif_usa_defeat_recession:0 "The Defeat Recession"
 wif_usa_defeat_recession_desc:0 "Ten million men home, and an economy built for a war that was lost."
 wif_usa_baby_boom:0 "The Baby Boom"
 wif_usa_baby_boom_desc:0 "A lot of new families."
 wif_usa_prosperity:0 "Prosperity Restored"
 wif_usa_prosperity_desc:0 "The richest country on earth, rich again."
 wif_usa_inter_american_board_idea:0 "The Inter-American Defense Board"
 wif_usa_inter_american_board_idea_desc:0 "A joint staff for the hemisphere."
 wif_usa_selective_service_idea:0 "Selective Service"
 wif_usa_selective_service_idea_desc:0 "The first peacetime draft."
 wif_usa_ninety_divisions_idea:0 "The Ninety-Division Army"
 wif_usa_ninety_divisions_idea_desc:0 "Few divisions, well equipped."
 wif_usa_fortress_america_idea:0 "Fortress America"
 wif_usa_fortress_america_idea_desc:0 "The hemisphere is the wall."
 wif_usa_northern_defense_idea:0 "Joint Defense of the North"
 wif_usa_northern_defense_idea_desc:0 "Radar from Alaska to Labrador."
 wif_usa_victory_program_idea:0 "The Victory Program"
 wif_usa_victory_program_idea_desc:0 "Everything, and fast."
 wif_usa_undeclared_war_idea:0 "The Undeclared War"
 wif_usa_undeclared_war_idea_desc:0 "US destroyers escort, and shoot first."
 wif_usa_atomic_program_idea:0 "The Atomic Program"
 wif_usa_atomic_program_idea_desc:0 "Los Alamos, reopened."
 wif_usa_proximity_fuze_idea:0 "The Proximity Fuze"
 wif_usa_proximity_fuze_idea_desc:0 "A radio in every shell."
 wif_usa_fifty_thousand_idea:0 "Fifty Thousand Planes"
 wif_usa_fifty_thousand_idea_desc:0 "The impossible number, beaten."
 wif_usa_america_stands_idea:0 "America Stands Again"
 wif_usa_america_stands_idea_desc:0 "A power the victors must reckon with."
 wif_usa_pacific_first_idea:0 "Pacific First"
 wif_usa_pacific_first_idea_desc:0 "Remember Pearl Harbor."
 wif_usa_consumer_boom_idea:0 "The Consumer Boom"
