 wif_gen_roundup:0 "Round-Up"
 wif_gen_roundup_desc:0 "Seal a street, stop a tram, empty a church: everyone inside goes to forced labour in the Reich."
 wif_gen_roundup_cheap:0 "Round-Up"
 wif_gen_roundup_cheap_desc:0 "Seal a street, stop a tram, empty a church: everyone inside goes to forced labour in the Reich."
 wif_gen_roundup_tt:0 "§YGermany§!: §G+1%§! factory output for 90 days. Home Army Strength §R+3§!."
 wif_gen_forest_sweep:0 "Forest Sweep"
 wif_gen_forest_sweep_desc:0 "Police and security divisions comb the forests of Kielce and Lublin for the Home Army's forest units."
 wif_gen_sweep_tt:0 "After §Y30§! days: Home Army Strength §G-5§! or §G-10§! (§G3§! more with The Home Army Never Surrenders). It never falls below §R15§!."
 wif_arm_polish_partisans_sme:0 "Arm the Home Army"
 wif_arm_polish_partisans_sme_desc:0 "Rifles and explosives, parachuted or smuggled into the Generalgouvernement by the SME. The next Home Army raid comes in half the time."
 wif_arm_polish_partisans_eng:0 "Arm the Home Army"
 wif_arm_polish_partisans_eng_desc:0 "Rifles and explosives, parachuted or smuggled into the Generalgouvernement by Britain. The next Home Army raid comes in half the time."
 wif_arm_polish_partisans_tt:0 "§YThe time until the Generalgouvernement's next Home Army raid is halved§!, and the Home Army grows §R+5§!."
 wif_gen_chase_terrorists:0 "Chase the Terrorists"
 wif_gen_category:0 "The Generalgouvernement"
 wif_gen_category_desc:0 "Home Army Strength: §R[?ROOT.wif_gen_ak|0]§!/100, growing [?ROOT.wif_gen_ak_rate|1] a month; it never falls below 15. Each month it strikes with a chance of half its Strength: ambushes (10), rail sabotage (25), assassinations (40), a factory or depot (55), a liberated forest district (70), a coordinated strike (90).\nNext Home Army raid in §R[?ROOT.wif_gen_terror_days|0]§! days. The Generalgouvernement can never core any land."
 wif_gen.25.t:0 "Complete Success"
 wif_gen.25.desc:0 "Our forces achieved a decisive victory against the partisans in [event_target:partisan_state.GetName]. The terrorist cell has been completely destroyed, the region is stabilised, and the next attack has been significantly delayed."
 wif_gen.25.a:0 "Excellent work!"
 wif_gen.26.t:0 "The Terrorists Got Away But Region Stabilised"
 wif_gen.26.desc:0 "Our forces swept through [event_target:partisan_state.GetName] and restored order, but the partisan leaders managed to escape into the countryside. The region is stable for now, though the threat remains."
 wif_gen.26.a:0 "At least the region is secure."
 wif_gen.27.t:0 "Harsh Battle"
 wif_gen.27.desc:0 "The operation in [event_target:partisan_state.GetName] turned into a brutal engagement. We took significant casualties but managed to clear the area. The region is stabilised, though at great cost."
 wif_gen.27.a:0 "A pyrrhic victory."
 wif_gen.28.t:0 "Failed to Pursue"
 wif_gen.28.desc:0 "Our forces deployed to [event_target:partisan_state.GetName] but failed to locate the partisan cells. The terrorists remain at large and the region continues to suffer from their presence."
 wif_gen.28.a:0 "They will not escape forever."
 wif_gen.29.t:0 "Forces Routed"
 wif_gen.29.desc:0 "The operation in [event_target:partisan_state.GetName] was a disaster. Our forces walked into an ambush and were routed by the partisans. The terrorists are now emboldened and their grip on the region has tightened considerably."
 wif_gen.29.a:0 "This is humiliating."
 wif_gen.30.t:0 "Total Defeat"
 wif_gen.30.desc:0 "Catastrophe in [event_target:partisan_state.GetName]. Our entire force was annihilated by a well-coordinated partisan offensive. None of the 10,000 men returned. The region has been lost to the terrorists, who have declared it a liberated zone. Emboldened partisans across the Generalgouvernement are accelerating their attacks."
 wif_gen.30.a:0 "God help us..."
 wif_gen.31.t:0 "Demilitarization Lifted"
 wif_gen.31.desc:0 "The demilitarized zone has been lifted. Our forces can once again operate in the formerly contested area."
 wif_gen.31.a:0 "Resume operations."
 wif_gen.20.t:0 "Home Army Raid"
 wif_gen.20.desc:0 "On [GetDateText], the Home Army struck in [terror_attack_state.GetName]. A railway line was blown, a factory set on fire, and German officials and policemen were shot."
 wif_gen.20.a:0 "Shoot a hundred for every one."
 wif_gen.11.t:0 "Ambush"
 wif_gen.11.desc:0 "A German patrol was ambushed on a forest road in [wif_gen_ak_state.GetName]."
 wif_gen.11.a:0 "Burn the nearest village."
 wif_gen.12.t:0 "The Line Is Cut"
 wif_gen.12.desc:0 "A Home Army sabotage unit derailed a train in [wif_gen_ak_state.GetName]."
 wif_gen.12.a:0 "Guard every bridge."
 wif_gen.13.t:0 "An Execution by the Underground"
 wif_gen.13.desc:0 "A Home Army court sentenced a senior German official to death - and its 'Parasol' squad carried the sentence out in broad daylight."
 wif_gen.13.a:0 "Armoured cars for everyone."
 wif_gen.14.t:0 "A Factory Burns"
 wif_gen.14.desc:0 "Saboteurs set fire to a factory working for the Wehrmacht in [wif_gen_ak_state.GetName]."
 wif_gen.14.a:0 "Find them."
 wif_gen.15.t:0 "A Liberated District"
 wif_gen.15.desc:0 "In the forests of [wif_gen_ak_state.GetName], the Home Army's forest units hold the villages by day as well as by night."
 wif_gen.15.a:0 "Send in the security divisions."
 wif_gen.16.t:0 "The Underground Strikes Everywhere"
 wif_gen.16.desc:0 "On a single night the Home Army struck across the whole Generalgouvernement: railways, depots, police posts."
 wif_gen.16.a:0 "This is war."
 wif_gen.50.t:0 "The Ostschild Asks"
 wif_gen.50.desc:0 "The Reich has fallen silent. The Reichskommissariate of the East have banded together as the Ostschild, and they ask us to join. With them we would share police and security troops - which we will lack without the Reich. But they are at war with the SME, and we need every resource of our own. And the Poles are watching for the moment we are weakest."
 wif_gen.50.a:0 "We join the Ostschild."
 wif_gen.50.a_tt:0 "We join the §YOstschild§! - and its war with the §RSME§!. Spirit 'The Ostschild Police Pact': §G-25%§! garrison needed, §G+10%§! compliance growth.\nIn two weeks the Poles will rise - but §Yonly in Warsaw§!."
 wif_gen.50.b:0 "We stand alone."
 wif_gen.50.b_tt:0 "We stay out of the SME war. Spirit 'Our Own Resources': §G+15%§! political power, §G+10%§! local resources.\nIn two weeks the Poles will rise in §Rboth Warsaw and Krakau§!."
 wif_gen.60.t:0 "Warsaw Rises"
 wif_gen.60.desc:0 "With the Reich in pieces, the Home Army has come out of hiding. The white-and-red flag flies over Warsaw again, and the Polish Underground State has declared itself the government of a free Poland. If it is crushed now, the Poles will never rise again."
 wif_gen.60.a:0 "Poland is not yet lost."
 wif_gen.61.t:0 "Poland Is Reborn"
 wif_gen.61.desc:0 "The Generalgouvernement has capitulated to the Polish rising. For the first time since 1939 there is a Poland on the map."
 wif_gen.61.a:0 "For how long?"
 wif_gen.62.t:0 "The Last Polish Rising Crushed"
 wif_gen.62.desc:0 "The Polish rising has been crushed and its land handed back to the Generalgouvernement. The Home Army fights on in the forests, but there will be no more uprisings: the Poles have nothing left to rise with."
 wif_gen.62.a:0 "It is over."
 wif_gen_attack_partisan_activity:0 "Attack partisan activity in [FROM.GetName]"
 wif_gen_attack_partisan_activity_desc:0 "Polish partisans have struck in [FROM.GetName]. We shall deploy 10,000 men to hunt them down and restore order. The outcome is uncertain."
 wif_gen_deploy_mechanised_forces:0 "Deploy the Mechanised Forces in [FROM.GetName]"
 wif_gen_deploy_mechanised_forces_desc:0 "Polish partisans have struck in [FROM.GetName]. We shall deploy security divisions to hunt them down. This requires §R10,000 Manpower§! and §R500 Mechanised Equipment§!, but our armoured troops are far more effective at eliminating partisan cells."
 wif_gen_police_offensive:0 "Police Offensive in [FROM.GetName]"
 wif_gen_police_offensive_desc:0 "Polish partisans have struck in [FROM.GetName]. Under the Higher SS and Police Leader, we shall deploy a combined-arms force with armoured support to hunt them down. This requires §R10,000 Manpower§!, §R200 Support Equipment§!, and §R10 Medium Tanks§!."
