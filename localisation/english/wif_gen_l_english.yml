l_english:
 wif_gen_root:0 "The Generalgouvernement"
 wif_gen_root_desc:0 "Poland has fallen. What the Reich did not annex outright becomes the Generalgouvernement: from the Wawel castle in Krakau, Generalgouverneur Hans Frank rules Krakau, Warschau, Radom (Kielce) and Lublin - Galicia (Lemberg, Stanislau) follows after the attack on the Soviet Union. Hitler's instructions were plain: the Generalgouvernement is a reservoir of labour for the Reich, its leadership class is to be destroyed, and in the end it is to be German land, emptied of Poles and Jews."
 wif_gen_wawel:0 "Frank on the Wawel"
 wif_gen_wawel_desc:0 "Hans Frank lives in the castle of the Polish kings and has himself painted like one. His wife calls herself the Queen of Poland."
 wif_gen_krakau_capital:0 "Krakau, Not Warsaw"
 wif_gen_krakau_capital_desc:0 "The capital of the Generalgouvernement is Krakau. Warsaw, the Polish capital, is to be reduced to a provincial town."
 wif_gen_nebenland:0 "Nebenland des Reiches"
 wif_gen_nebenland_desc:0 "Not a state, not a protectorate: an 'adjacent land of the Reich', with no Polish government of any kind."
 wif_gen_frank_kingdom:0 "Frank's Kingdom"
 wif_gen_frank_kingdom_desc:0 "Frank wins his long feud with the SS: the Generalgouverneur rules, and the police answer to him - and his fortune grows from what is confiscated."
 wif_gen_ss_state:0 "The SS State"
 wif_gen_ss_state_desc:0 "Higher SS and Police Leader Kruger and Lublin's Odilo Globocnik win instead. Frank keeps the castle; the SS keeps everything else."
 wif_gen_krakau_court:0 "The Krakau Court"
 wif_gen_krakau_court_desc:0 "Art looted from Polish museums and churches - Leonardo's Lady with an Ermine among it - decorates the Wawel."
 wif_gen_globocnik:0 "Globocnik in Lublin"
 wif_gen_globocnik_desc:0 "The SS and Police Leader of Lublin gets a free hand for the 'settlement of the East'."
 wif_gen_frank_diaries:0 "Frank's Diaries"
 wif_gen_frank_diaries_desc:0 "Frank's office diary records it all, in his own words: 'We must annihilate the Jews wherever we find them.' 'If I put up a poster for every seven Poles shot, the forests of Poland would not suffice to make the paper.'"
 wif_gen_victory_in_the_east:0 "Victory in the East"
 wif_gen_victory_in_the_east_desc:0 "The Soviet Union has fallen. The Generalgouvernement is no longer the edge of the Reich, but its hinterland - and the plans made for after the war can begin."
 wif_gen_colony_with_deadline:0 "A Colony With a Deadline"
 wif_gen_colony_with_deadline_desc:0 "Berlin sets the timetable: the Generalgouvernement is to be German within fifteen to twenty years."
 wif_gen_annexation_plan:0 "The Annexation Plan"
 wif_gen_annexation_plan_desc:0 "The Reich Ministry of the Interior drafts the incorporation of the Generalgouvernement as a Gau."
 wif_gen_reichsgau_weichselland:0 "Reichsgau Weichselland"
 wif_gen_reichsgau_weichselland_desc:0 "The final goal: the Generalgouvernement becomes a German Gau on the Vistula, its people gone."
 wif_gen_polish_question:0 "The Polish Question"
 wif_gen_polish_question_desc:0 "Hitler, 1940: the Poles are 'born for low labour'. The occupation is built to make a nation disappear."
 wif_gen_ab_aktion:0 "AB-Aktion"
 wif_gen_ab_aktion_desc:0 "The 'Extraordinary Pacification Action' of 1940: thousands of Polish politicians, teachers, priests and professionals were rounded up and shot, many in the Palmiry forest outside Warsaw."
 wif_gen_sonderaktion_krakau:0 "Sonderaktion Krakau"
 wif_gen_sonderaktion_krakau_desc:0 "The professors of the Jagiellonian University were summoned to a lecture and arrested on the spot; many died in Sachsenhausen."
 wif_gen_count_to_500:0 "Count to Five Hundred"
 wif_gen_count_to_500_desc:0 "Himmler's memorandum: Polish children are to learn only 'simple arithmetic up to 500 at most, writing one's name, and that it is God's law to obey the Germans'."
 wif_gen_pawiak:0 "Pawiak and Montelupich"
 wif_gen_pawiak_desc:0 "The Gestapo prisons of Warsaw and Krakau, where the arrested are tortured, shot in the courtyard, or sent to Auschwitz on the next transport."
 wif_gen_lapanka:0 "Lapanka"
 wif_gen_lapanka_desc:0 "Street round-ups: a tram is stopped, a street is sealed, and everyone inside goes to forced labour in the Reich, to a camp, or to a wall."
 wif_gen_cultural_destruction:0 "Erasing Poland"
 wif_gen_cultural_destruction_desc:0 "Monuments torn down, libraries burned, Chopin banned, place names germanised, museums shipped to the Reich."
 wif_gen_public_executions:0 "Red Posters"
 wif_gen_public_executions_desc:0 "Hostages shot in public, their names on red posters: fifty or a hundred Poles for every German killed."
 wif_gen_ostarbeiter:0 "Forced Labour in the Reich"
 wif_gen_ostarbeiter_desc:0 "Over a million Poles are taken to Germany, marked with a 'P' on their clothes, forbidden to ride trams, enter churches with Germans, or love a German on pain of death."
 wif_gen_hunger_rations:0 "Rations for Poles"
 wif_gen_hunger_rations_desc:0 "Official rations for Poles fall to a few hundred calories a day; the black market is the only way to live, and smuggling food is punishable by death."
 wif_gen_labour_reservoir:0 "The Labour Reservoir"
 wif_gen_labour_reservoir_desc:0 "The Generalgouvernement's purpose, as Frank put it: a 'reservoir of labour' for the Reich."
 wif_gen_deportations_east:0 "Deportations to Ryazan"
 wif_gen_deportations_east_desc:0 "Generalplan Ost assigned 20 million Poles to 'resettlement' in the east. Now the trains run to Moskowien's new camp at Ryazan: a Polish district at a time, east past the border, in winter as in summer."
 wif_gen_germanisable_poles:0 "The Racial Examinations"
 wif_gen_germanisable_poles_desc:0 "SS examiners sort the Poles who are left: the 'Germanisable' to the Reich, the rest to the trains."
 wif_gen_polish_intelligentsia_gone:0 "A Nation Without a Head"
 wif_gen_polish_intelligentsia_gone_desc:0 "No Polish university, newspaper, theatre or parish priest remains. Those who taught, wrote or led are dead, in camps, or in Siberia."
 wif_gen_end_of_poland:0 "Finis Poloniae"
 wif_gen_end_of_poland_desc:0 "In the Reich's maps there is no Poland any more, only the Vistula land."
 wif_gen_ghettos:0 "The Ghettos"
 wif_gen_ghettos_desc:0 "Warsaw, Krakau, Lublin: the Jews of the Generalgouvernement were sealed into ghettos behind walls and barbed wire, where hunger and typhus killed tens of thousands."
 wif_gen_lublin_reservation:0 "The Lublin Reservation"
 wif_gen_lublin_reservation_desc:0 "The Nisko plan of 1939-40: Jews deported from the Reich and Vienna dumped in a 'reservation' near Lublin - a first experiment in mass deportation."
 wif_gen_labour_camps:0 "The Jewish Labour Camps"
 wif_gen_labour_camps_desc:0 "Jewish forced labour digs the 'Otto Line' anti-tank ditches on the Soviet border and the river works of Lublin district."
 wif_gen_operation_reinhard:0 "Operation Reinhard"
 wif_gen_operation_reinhard_desc:0 "Belzec, Sobibor and Treblinka were built in the Generalgouvernement for one purpose. Around 1.7 million Jews were murdered there in 1942 and 1943, most of them on the day they arrived."
 wif_gen_warsaw_ghetto:0 "The Warsaw Ghetto"
 wif_gen_warsaw_ghetto_desc:0 "In April 1943 the remaining Jews of the Warsaw ghetto rose against the final deportation and fought for nearly a month. Jurgen Stroop's report was titled 'The Jewish Quarter of Warsaw Is No More'."
 wif_gen_plaszow:0 "Plaszow"
 wif_gen_plaszow_desc:0 "The camp on the edge of Krakau, run by Amon Goth, who shot prisoners from his balcony."
 wif_gen_majdanek:0 "Majdanek"
 wif_gen_majdanek_desc:0 "The concentration and extermination camp on the edge of Lublin, in full view of the city."
 wif_gen_erntefest:0 "Aktion Erntefest"
 wif_gen_erntefest_desc:0 "'Harvest Festival': on 3-4 November 1943, around 42,000 Jews were shot at Majdanek, Trawniki and Poniatowa while music played over loudspeakers. It was the largest single massacre of the Holocaust."
 wif_gen_aktion_1005:0 "Aktion 1005"
 wif_gen_aktion_1005_desc:0 "The cover-up: prisoners are forced to dig up the mass graves and burn the bodies. The camps are ploughed under and farms built over them."
 wif_gen_the_silence:0 "The Silence"
 wif_gen_the_silence_desc:0 "Before the war a tenth of Poland's people were Jews. In the Generalgouvernement of the 1950s there are none, and it is forbidden to say where they went."
 wif_gen_volksdeutsche:0 "The Volksdeutsche List"
 wif_gen_volksdeutsche_desc:0 "Anyone with a German grandparent may sign the list - and gets better rations, a better flat, and the hatred of their neighbours."
 wif_gen_krakau_german:0 "Krakau, a German City"
 wif_gen_krakau_german_desc:0 "Frank's propaganda calls Krakau an 'ancient German city'. The Polish population of the centre is expelled, the Jewish quarter emptied, the streets renamed: Adolf-Hitler-Platz, Reichsstrasse."
 wif_gen_german_quarters:0 "German Quarters Only"
 wif_gen_german_quarters_desc:0 "'Nur fur Deutsche': the best districts of every town are cleared for German officials and their families."
 wif_gen_generalplan_ost:0 "Generalplan Ost"
 wif_gen_generalplan_ost_desc:0 "The SS master plan: 80-85% of the Poles are to be removed to the east within a generation; the rest Germanised or worked to death."
 wif_gen_kidnapped_children:0 "The Stolen Children"
 wif_gen_kidnapped_children_desc:0 "Polish children judged 'racially valuable' are taken from their families, given German names and sent to German homes through Lebensborn. Tens of thousands never returned."
 wif_gen_aktion_zamosc:0 "Aktion Zamosc"
 wif_gen_aktion_zamosc_desc:0 "Around 110,000 Poles were driven from the villages of the Zamosc region at gunpoint, families split, children sent to camps - and German settlers moved into their houses. The region answered with a peasant uprising."
 wif_gen_settler_villages:0 "Settler Villages"
 wif_gen_settler_villages_desc:0 "German farmers from Bessarabia, Bukovina and the Reich take over the farms of the expelled - in villages behind fences, with armed guards."
 wif_gen_pabst_plan:0 "The Pabst Plan"
 wif_gen_pabst_plan_desc:0 "'The New German City of Warsaw': a 1940 plan to reduce the Polish capital to a German town of 130,000. Now it is carried out: the city is emptied, its people deported, its old town demolished."
 wif_gen_new_warsaw:0 "Neue Deutsche Stadt Warschau"
 wif_gen_new_warsaw_desc:0 "Half-timbered houses where the Royal Castle stood, a Volkshalle on the Vistula, and a railway station for the Reich's settlers."
 wif_gen_wehrbauern:0 "Wehrbauern on the Bug"
 wif_gen_wehrbauern_desc:0 "Soldier-settlers on the old Soviet border, armed and organised in villages."
 wif_gen_weichselland_settled:0 "The Vistula Land Settled"
 wif_gen_weichselland_settled_desc:0 "German towns, German farms, German schools from Krakau to Lublin."
 wif_gen_germanisation_complete:0 "German Land"
 wif_gen_germanisation_complete_desc:0 "Berlin declares the deadline met. It is not: the Poles are still there, and still Polish."
 wif_gen_ostbahn:0 "The Ostbahn"
 wif_gen_ostbahn_desc:0 "The railways of the Generalgouvernement, run by the Reich: the trains east to the front and the camps, the trains west with grain and labourers."
 wif_gen_kontingente:0 "The Grain Kontingente"
 wif_gen_kontingente_desc:0 "Every village must deliver its quota. Farmers who fail are shot or sent to camps."
 wif_gen_otto_programm:0 "The Otto Programme"
 wif_gen_otto_programm_desc:0 "Roads, bridges and railways to the Soviet border, built for the coming attack."
 wif_gen_aufmarschgebiet:0 "Aufmarschgebiet Ost"
 wif_gen_aufmarschgebiet_desc:0 "The Generalgouvernement becomes the staging area for Barbarossa: three army groups camp in its fields and towns."
 wif_gen_ostindustrie:0 "Ostindustrie GmbH"
 wif_gen_ostindustrie_desc:0 "The SS's own company, using Jewish and Polish slave labour in the camps around Lublin."
 wif_gen_karpathen_oel:0 "Karpathen-Ol AG"
 wif_gen_karpathen_oel_desc:0 "The oil fields of Drohobycz and Boryslaw in Galicia, taken over by a Reich company."
 wif_gen_stalowa_wola:0 "Stalowa Wola"
 wif_gen_stalowa_wola_desc:0 "The steelworks of the pre-war Polish Central Industrial District, run by the Reichswerke Hermann Goring."
 wif_gen_mielec:0 "Heinkel at Mielec"
 wif_gen_mielec_desc:0 "The Polish aircraft works at Mielec builds Heinkel parts with labour from the camp next door."
 wif_gen_galician_refineries:0 "The Galician Refineries"
 wif_gen_galician_refineries_desc:0 "Drohobycz refinery rebuilt for the Wehrmacht."
 wif_gen_colony_economy:0 "A Colony for the Reich"
 wif_gen_colony_economy_desc:0 "Everything the Generalgouvernement makes goes west. Nothing is built for the people who live there."
 wif_gen_dg_iv:0 "Durchgangsstrasse IV"
 wif_gen_dg_iv_desc:0 "The Reich's highway to the east, from Lemberg into Ukraine, built by Jewish and Soviet prisoners who were shot when they could no longer work."
 wif_gen_settler_industry:0 "Industry for the Settlers"
 wif_gen_settler_industry_desc:0 "Factories are finally built in the Generalgouvernement - in the German towns, for German workers."
 wif_gen_vistula_industry:0 "The Vistula Industrial Region"
 wif_gen_vistula_industry_desc:0 "From Krakau to Warsaw, a German industrial region on the old Polish land."
 wif_gen_distrikt_galizien:0 "Distrikt Galizien"
 wif_gen_distrikt_galizien_desc:0 "After the attack on the Soviet Union, eastern Galicia is added to the Generalgouvernement as its fifth district. The Germans favour the Ukrainians here: their own committee, schools and police - against the Poles."
 wif_gen_ukrainian_committee:0 "The Ukrainian Central Committee"
 wif_gen_ukrainian_committee_desc:0 "Volodymyr Kubijovyc's committee in Krakau: the one native body the Generalgouvernement tolerates."
 wif_gen_ss_galizien:0 "The Galician SS Division"
 wif_gen_ss_galizien_desc:0 "Ukrainian volunteers in a Waffen-SS division, to fight the Soviets - and the Poles."
 wif_gen_janowska:0 "Janowska"
 wif_gen_janowska_desc:0 "The camp on Janowska Street in Lemberg, where the Jews of the city were murdered in the Piaski ravine behind it."
 wif_gen_divide_and_rule:0 "Divide and Rule"
 wif_gen_divide_and_rule_desc:0 "Ukrainian police in Polish villages, Polish police in Ukrainian ones. The hatred is useful."
 wif_gen_galician_frontier:0 "The Galician Frontier"
 wif_gen_galician_frontier_desc:0 "Galicia is the Generalgouvernement's bridge to the Reichskommissariat Ukraine - and its oil."
 wif_gen_blue_police:0 "The Blue Police"
 wif_gen_blue_police_desc:0 "The pre-war Polish police, kept on in navy-blue uniforms under German command. Many of them also work for the underground."
 wif_gen_sonderdienst:0 "The Sonderdienst"
 wif_gen_sonderdienst_desc:0 "Volksdeutsche auxiliaries for 'special duties': guarding, round-ups, executions."
 wif_gen_baudienst:0 "The Baudienst"
 wif_gen_baudienst_desc:0 "Young Poles conscripted into labour battalions under German command."
 wif_gen_underground_state:0 "The Underground State"
 wif_gen_underground_state_desc:0 "Behind the occupation there is a whole secret Poland: courts, schools, newspapers, a parliament, and an army of hundreds of thousands answering to London."
 wif_gen_kutschera:0 "After Kutschera"
 wif_gen_kutschera_desc:0 "In February 1944 the Home Army shot SS-Brigadefuhrer Franz Kutschera, the 'executioner of Warsaw', in front of his headquarters. His successors travel in armoured cars."
 wif_gen_anti_partisan:0 "Bandenbekampfung"
 wif_gen_anti_partisan_desc:0 "Sweeps through the forests of Kielce and Lublin, where the Home Army's 'forest units' live."
 wif_gen_pacification_villages:0 "Pacification of the Villages"
 wif_gen_pacification_villages_desc:0 "Villages suspected of feeding partisans are burned with their people - Michniow, Sochy, and hundreds more."
 wif_gen_fortress_warsaw:0 "Festung Warschau"
 wif_gen_fortress_warsaw_desc:0 "If the Poles ever rise in Warsaw, the city will be destroyed street by street - as Himmler ordered in 1944: 'every inhabitant is to be killed'."
 wif_gen_security_divisions:0 "Sicherungsdivisionen"
 wif_gen_security_divisions_desc:0 "Garrison divisions of older men and police, permanently stationed in the Generalgouvernement."
 wif_gen_never_surrenders:0 "The Home Army Never Surrenders"
 wif_gen_never_surrenders_desc:0 "A decade of terror has not broken the underground. It can be hunted, never destroyed."
 wif_gen_nebenland_idea:0 "Nebenland des Reiches"
 wif_gen_nebenland_idea_desc:0 "Not a state: an adjacent land of the Reich."
 wif_gen_reservoir_idea:0 "The Reservoir of Labour"
 wif_gen_reservoir_idea_desc:0 "The Poles work for the Reich."
 wif_gen_nebenland_pp_idea:0 "No Polish Government"
 wif_gen_nebenland_pp_idea_desc:0 "There is no Polish authority of any kind."
 wif_gen_frank_court_idea:0 "Frank's Court"
 wif_gen_frank_court_idea_desc:0 "The King of Poland, and his fortune."
 wif_gen_ss_state_idea:0 "The SS State"
 wif_gen_ss_state_idea_desc:0 "Kruger and Globocnik rule."
 wif_gen_timetable_idea:0 "The Timetable"
 wif_gen_timetable_idea_desc:0 "German within fifteen to twenty years."
 wif_gen_universities_idea:0 "The Universities Closed"
 wif_gen_universities_idea_desc:0 "The professors are in Sachsenhausen."
 wif_gen_no_schools_idea:0 "No Schools for Poles"
 wif_gen_no_schools_idea_desc:0 "Count to five hundred, write your name, obey."
 wif_gen_starvation_idea:0 "Starvation Rations"
 wif_gen_starvation_idea_desc:0 "A few hundred calories a day."
 wif_gen_examinations_idea:0 "The Racial Examinations"
 wif_gen_examinations_idea_desc:0 "Sorted by SS examiners."
 wif_gen_volksliste_idea:0 "The Volksdeutsche List"
 wif_gen_volksliste_idea_desc:0 "Better rations for a German grandparent."
 wif_gen_pabst_idea:0 "The Pabst Plan"
 wif_gen_pabst_idea_desc:0 "Warsaw is being emptied."
 wif_gen_wehrbauern_idea:0 "Wehrbauern on the Bug"
 wif_gen_wehrbauern_idea_desc:0 "Armed settler villages on the old border."
 wif_gen_vistula_idea:0 "The Vistula Industrial Region"
 wif_gen_vistula_idea_desc:0 "German industry on Polish land."
 wif_gen_ucc_idea:0 "The Ukrainian Central Committee"
 wif_gen_ucc_idea_desc:0 "The one native body we tolerate."
 wif_gen_baudienst_idea:0 "The Baudienst"
 wif_gen_baudienst_idea_desc:0 "Polish labour battalions."
 wif_gen_police_pact_idea:0 "The Ostschild Police Pact"
 wif_gen_police_pact_idea_desc:0 "Ostland, Ukraine and Moskowien share their police with us."
 wif_gen_own_resources_idea:0 "Our Own Resources"
 wif_gen_own_resources_idea_desc:0 "We keep what we have - and stand alone."
 wif_gen_poland_broken_idea:0 "The Last Rising Crushed"
 wif_gen_poland_broken_idea_desc:0 "The Poles will not rise again."
 wif_gen_ostarbeiter_ger_idea:0 "Polish Forced Labour"
 wif_gen_ostarbeiter_ger_idea_desc:0 "A million Poles in German factories and fields."
 wif_gen_rations_ger_idea:0 "Food from the Generalgouvernement"
 wif_gen_rations_ger_idea_desc:0 "Warsaw's rations, in Germany's shops."
 wif_gen_reservoir_ger_idea:0 "The Labour Reservoir"
 wif_gen_reservoir_ger_idea_desc:0 "The Generalgouvernement works for the Reich."
 wif_gen_kontingente_ger_idea:0 "The Grain Kontingente"
 wif_gen_kontingente_ger_idea_desc:0 "Polish grain for German bread."
 wif_gen_mielec_ger_idea:0 "Heinkel at Mielec"
 wif_gen_mielec_ger_idea_desc:0 "Aircraft parts from the camp next door."
 wif_gen_colony_ger_idea:0 "A Colony for the Reich"
 wif_gen_colony_ger_idea_desc:0 "Everything the Generalgouvernement makes goes west."
 wif_gen_roundup_ger_idea:0 "Round-Up Labour"
 wif_gen_roundup_ger_idea_desc:0 "Fresh labourers from the streets of Warsaw."
 wif_gen_loyal_opinion:0 "Frank's Diaries"
 wif_gen_annexation_opinion:0 "The Annexation Plan"
 wif_gen_weichselland_opinion:0 "Reichsgau Weichselland"
 wif_gen_finis_opinion:0 "Finis Poloniae"
 wif_gen_terror_opinion:0 "Operation Reinhard"
 wif_gen_silence_opinion:0 "The Silence"
 wif_gen_german_land_opinion:0 "German Land"
 wif_gen_tt_1:0 "§YHans Frank§! rules from the Wawel. The §RHome Army§! is already organising - and it will never be beaten."
 wif_gen_tt_2:0 "Warschau: §R-10§! compliance."
 wif_gen_tt_3:0 "Round-Ups cost less political power."
 wif_gen_tt_4:0 "§RA grievance:§! the Home Army grows §R0.5§! a month faster, for good."
 wif_gen_tt_5:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_6:0 "Home Army Strength: §G-5§!"
 wif_gen_tt_7:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_8:0 "Lublin: §G+10§! compliance."
 wif_gen_tt_9:0 "We become §YReichsgau Weichselland§! - a name on a map. The land is still not ours: §Rno cores§!."
 wif_gen_tt_10:0 "Unlocks the persecution of the Poles. Almost every focus here feeds the §RHome Army§!."
 wif_gen_tt_11:0 "§RA grievance:§! the Home Army grows §R0.5§! a month faster, for good."
 wif_gen_tt_12:0 "Every Polish district (terror): §G+10§! compliance."
 wif_gen_tt_13:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_14:0 "Home Army Strength: §G-5§!"
 wif_gen_tt_15:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_16:0 "Unlocks §YRound-Up§!: §R-15,000§! manpower, §YGermany§! §G+1%§! factory output for 90 days, Home Army §R+3§!."
 wif_gen_tt_17:0 "Every Polish district: §R-10§! compliance."
 wif_gen_tt_18:0 "§YGermany§!: §G+50§! political power."
 wif_gen_tt_19:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_20:0 "For a year, Home Army attacks are §G20%§! less likely. Then the grievance comes: §R+0.5§! a month, for good."
 wif_gen_tt_21:0 "§YGermany§!: §G+3%§! factory output for two years."
 wif_gen_tt_22:0 "§YGermany§!: §G-2%§! consumer goods for two years."
 wif_gen_tt_23:0 "§YGermany§!: §G+5%§! factory output and construction speed for two years."
 wif_gen_tt_24:0 "Every district: §R-15%§! of the population (about §R2,473,530§!)."
 wif_gen_tt_25:0 "§RA grievance:§! the Home Army grows §R0.5§! a month faster, for good."
 wif_gen_tt_26:0 "§YMoskowien§!: §G+30,000§! manpower (forced labour at Ryazan)."
 wif_gen_tt_27:0 "Home Army Strength: §G-10§!"
 wif_gen_tt_28:0 "Every Polish district (despair): §G+10§! compliance."
 wif_gen_tt_29:0 "Every district: §R-10%§! of the population (about §R1,649,020§!)."
 wif_gen_tt_30:0 "§RA grievance:§! the Home Army grows §R0.25§! a month faster, for good."
 wif_gen_tt_31:0 "Lublin: §R-10,000§! people."
 wif_gen_tt_32:0 "§RA grievance:§! the Home Army grows §R0.5§! a month faster, for good."
 wif_gen_tt_33:0 "Warschau: §R-100,000§! people."
 wif_gen_tt_34:0 "Krakau: §R-20,000§! people."
 wif_gen_tt_35:0 "Lublin: §R-30,000§! people."
 wif_gen_tt_36:0 "§RA grievance:§! the Home Army grows §R0.5§! a month faster, for good."
 wif_gen_tt_37:0 "Krakau: §R-50,000§! people."
 wif_gen_tt_38:0 "Krakau: §G+15§! compliance."
 wif_gen_tt_39:0 "Krakau does §Rnot§! become a core."
 wif_gen_tt_40:0 "Every Polish district: §R-5§! compliance."
 wif_gen_tt_41:0 "Unlocks the settlement of the Generalgouvernement. It will never make the land ours: §Rno cores§!."
