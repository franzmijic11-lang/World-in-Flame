l_english:
 wif_rkk_root:0 "Reichskommissariat Kaukasien"
 wif_rkk_root_desc:0 "The Soviet Union has surrendered. From Tiflis, Reichskommissar Arno Schickedanz - Rosenberg's old friend from Riga - rules fourteen states from the Kuban to the Caspian: the Cossack steppe, the Kalmyk plain, the mountain peoples of the North Caucasus, and Georgia, Armenia and Azerbaijan beyond the range. And under it all: the oil of Baku, Grozny and Maikop."
 wif_rkk_tiflis:0 "Schickedanz in Tiflis"
 wif_rkk_tiflis_desc:0 "Arno Schickedanz moves into the Viceroy's Palace on Rustaveli Avenue, with plans for a palace of his own that Berlin has not paid for."
 wif_rkk_rosenberg_plan:0 "Rosenberg's Caucasus"
 wif_rkk_rosenberg_plan_desc:0 "Rosenberg always meant the Caucasus to be ruled differently from the Ukraine: a 'federation' of peoples, each set against Moscow, all bound to Berlin."
 wif_rkk_federation:0 "The Caucasian Federation"
 wif_rkk_federation_desc:0 "National committees for the Georgians, Armenians, Azerbaijanis and the North Caucasian peoples: flags, schools, a token parliament - and no army of their own."
 wif_rkk_oil_colony:0 "The Oil Colony"
 wif_rkk_oil_colony_desc:0 "Goring's Four-Year Plan men win the argument in Berlin: the Caucasus is a petrol station with a population problem."
 wif_rkk_national_committees:0 "The National Committees"
 wif_rkk_national_committees_desc:0 "Exiles from Paris, Berlin and Istanbul come home to sit on committees that advise the Reichskommissar."
 wif_rkk_wirtschaftskommando:0 "Wirtschaftskommando Kaukasus"
 wif_rkk_wirtschaftskommando_desc:0 "The economic command takes over every well, refinery and pipeline. The peoples are labour."
 wif_rkk_quiet_rk:0 "The Quiet Reichskommissariat"
 wif_rkk_quiet_rk_desc:0 "While Moskowien burns and the Ukraine starves, Kaukasien is quiet - not loyal, but quiet. It will not break when the others do."
 wif_rkk_technische_brigade:0 "Technische Brigade Mineralol"
 wif_rkk_technische_brigade_desc:0 "The oil engineers who followed the army in 1942 come back to finish the job: capping burning wells and rebuilding what the Soviets blew up."
 wif_rkk_maikop:0 "The Maikop Wells"
 wif_rkk_maikop_desc:0 "The first Caucasian oil field the Germans reached, and the most thoroughly destroyed."
 wif_rkk_grozny:0 "The Grozny Refineries"
 wif_rkk_grozny_desc:0 "Grozny's refineries made aviation spirit for the Red Army. Now for the Luftwaffe."
 wif_rkk_baku:0 "Baku"
 wif_rkk_baku_desc:0 "The greatest oil city in the world outside America. Its wells were wrecked by the retreating Soviets; rebuilding them is the Reich's biggest project in the East."
 wif_rkk_kontinentale_oel:0 "Kontinentale Ol AG"
 wif_rkk_kontinentale_oel_desc:0 "The Reich's oil monopoly for the East takes the concessions - with Goring's men on the board."
 wif_rkk_caspian_tankers:0 "Caspian Tankers"
 wif_rkk_caspian_tankers_desc:0 "Tankers across the Caspian to Astrakhan, and barges up the Volga."
 wif_rkk_batumi_pipeline:0 "The Batumi Pipeline"
 wif_rkk_batumi_pipeline_desc:0 "The old Baku-Batumi pipeline is relaid to the Black Sea, where Romanian and German tankers wait."
 wif_rkk_fuel_depots:0 "Fuel Depots of the East"
 wif_rkk_fuel_depots_desc:0 "Tank farms along the railway from Rostov to Baku."
 wif_rkk_oil_for_ostschild:0 "Oil for the Ostschild"
 wif_rkk_oil_for_ostschild_desc:0 "If the Reichskommissariate ever have to stand alone, they will run on Caucasian oil."
 wif_rkk_black_gold:0 "Black Gold"
 wif_rkk_black_gold_desc:0 "The Caucasus pumps more oil than it ever did for Stalin."
 wif_rkk_peoples:0 "The Peoples of the Caucasus"
 wif_rkk_peoples_desc:0 "Fifty peoples, forty languages, and every one of them with a grievance against Moscow. Berlin means to use them all - and to rank them."
 wif_rkk_kosakenland:0 "Kosakenland"
 wif_rkk_kosakenland_desc:0 "The Cossacks declared themselves 'Aryan Goths' and rode with the Wehrmacht. Berlin promised them a homeland on the Kuban and the Don."
 wif_rkk_kuban_host:0 "The Kuban Host"
 wif_rkk_kuban_host_desc:0 "The Kuban Cossack Host is restored with its atamans and its stanitsas."
 wif_rkk_terek_host:0 "The Terek and Don Hosts"
 wif_rkk_terek_host_desc:0 "The Terek Host around Stavropol, the Don Cossacks at Volgodonsk."
 wif_rkk_cossack_republic:0 "The Cossack Ataman"
 wif_rkk_cossack_republic_desc:0 "A Field Ataman of all the Hosts, sworn to the Reich."
 wif_rkk_kalmyk_corps:0 "The Kalmyk Cavalry Corps"
 wif_rkk_kalmyk_corps_desc:0 "Buddhist herdsmen who fought the Soviets from the saddle - and were rewarded, for once, by being left alone."
 wif_rkk_kalmyk_steppe:0 "The Kalmyk Steppe"
 wif_rkk_kalmyk_steppe_desc:0 "Kalmykia gets its own administration under a German advisor."
 wif_rkk_mountain_peoples:0 "The Mountain Peoples"
 wif_rkk_mountain_peoples_desc:0 "In 1942 the Wehrmacht let the Karachays and Kabardins run their own affairs, and the mountains stayed quiet. Schickedanz tries the same."
 wif_rkk_mountain_autonomy:0 "Mountain Autonomy"
 wif_rkk_mountain_autonomy_desc:0 "Village councils, the mosques reopened, the collective farms dissolved."
 wif_rkk_mountain_garrisons:0 "Garrison the Mountains"
 wif_rkk_mountain_garrisons_desc:0 "Blockhouses on every pass. The mountains are held, not won."
 wif_rkk_transcaucasia:0 "Beyond the Range"
 wif_rkk_transcaucasia_desc:0 "Georgia, Armenia and Azerbaijan: old nations with their own churches, alphabets and emigre governments in waiting."
 wif_rkk_georgian_question:0 "The Georgian Question"
 wif_rkk_georgian_question_desc:0 "Prince Irakli Bagration in Rome would like a crown. Berlin would like Tiflis quiet."
 wif_rkk_baku_question:0 "Azerbaijan and Armenia"
 wif_rkk_baku_question_desc:0 "Turkey watches Azerbaijan; the Armenians watch Turkey. Each gets just enough to fear the other."
 wif_rkk_capital_question:0 "The Capital Question"
 wif_rkk_capital_question_desc:0 "City councils, national committees, schools in Georgian, Armenian and Azeri: Kaukasien gives its peoples more than Moskowien ever will. But the Georgians, Armenians and Azerbaijanis hate each other more than they hate Berlin, and the Reichskommissariat can only lean on one of them. Where the capital finally sits decides which."
 wif_rkk_capital_tiflis:0 "Tiflis, the Seat of Power"
 wif_rkk_capital_tiflis_desc:0 "The capital stays in Tiflis, and the Georgians mean to make it count: Georgian ministers, Georgian officers, a Georgian voice in every committee. They do not want a capital, they want THE capital - and influence over everyone else."
 wif_rkk_capital_yerevan:0 "The Capital in Yerevan"
 wif_rkk_capital_yerevan_desc:0 "The Armenians, who have the most to fear from Turkey, are the most loyal - and the Reichskommissariat moves to Yerevan under Mount Ararat. Ankara is not pleased."
 wif_rkk_capital_baku:0 "The Capital in Baku"
 wif_rkk_capital_baku_desc:0 "Baku is happy: the capital comes to the oil. The Azerbaijanis get the ministries, Turkey applauds, and the oil men are next door to the Reichskommissar."
 wif_rkk_georgian_ascendancy:0 "The Georgian Ascendancy"
 wif_rkk_georgian_ascendancy_desc:0 "Georgians run the police and the railways from the Black Sea to the Caspian - and the Armenians and Azerbaijanis notice."
 wif_rkk_armenian_refuge:0 "A Refuge for the Armenians"
 wif_rkk_armenian_refuge_desc:0 "Armenians from Turkey, Iran and the Soviet camps come home to the capital of the Caucasus."
 wif_rkk_baku_capital_of_oil:0 "Baku, Capital of Oil"
 wif_rkk_baku_capital_of_oil_desc:0 "The Reichskommissariat governs from the oil city. The wells are guarded like palaces."
 wif_rkk_caucasus_germans:0 "The Caucasus Germans"
 wif_rkk_caucasus_germans_desc:0 "The Swabian villages of Helenendorf and Katharinenfeld were deported by Stalin in 1941. Their survivors are brought back, with new settlers from the Reich."
 wif_rkk_einsatzgruppe_d:0 "Einsatzgruppe D"
 wif_rkk_einsatzgruppe_d_desc:0 "The killing unit that followed the army into the Caucasus. In Krasnodar its Sonderkommando used gas vans; it is still at work."
 wif_rkk_mineralnye_vody:0 "Mineralnye Vody"
 wif_rkk_mineralnye_vody_desc:0 "Near Mineralnye Vody in September 1942, some 6,000 Jews from the spa towns of Kislovodsk, Pyatigorsk and Essentuki were shot in an anti-tank ditch. The Mountain Jews of Nalchik were spared only after a 'racial' dispute among the occupiers."
 wif_rkk_ostlegionen:0 "The Ostlegionen"
 wif_rkk_ostlegionen_desc:0 "No Reichskommissariat has more men willing to fight the Soviets. The Legions are recruited from every people."
 wif_rkk_north_caucasian_legion:0 "The North Caucasian Legion"
 wif_rkk_north_caucasian_legion_desc:0 "Chechens, Ingush, Ossetians, Dagestanis."
 wif_rkk_georgian_legion:0 "The Georgian Legion"
 wif_rkk_georgian_legion_desc:0 "Georgians who were Soviet prisoners of war and chose the German uniform over the camp."
 wif_rkk_armenian_legion:0 "The Armenian Legion"
 wif_rkk_armenian_legion_desc:0 "General Dro's Armenians, who hope a German victory will keep the Turks out."
 wif_rkk_cossack_corps:0 "The Cossack Cavalry Corps"
 wif_rkk_cossack_corps_desc:0 "Von Pannwitz's Cossacks - the best cavalry the Reich still has."
 wif_rkk_gebirgsjaeger:0 "Mountain Troops"
 wif_rkk_gebirgsjaeger_desc:0 "Training in the high Caucasus, where Edelweiss soldiers once raised the flag on Elbrus."
 wif_rkk_army_of_the_caucasus:0 "The Army of the Caucasus"
 wif_rkk_army_of_the_caucasus_desc:0 "The largest native army of any Reichskommissariat - and the one the Ostschild will lean on if the Reich ever falls silent."
 wif_rkk_abreks:0 "The Abreks"
 wif_rkk_abreks_desc:0 "In the mountains the outlaw - the abrek - is a hero. They raided the Tsar and Stalin; now they raid the oil fields."
 wif_rkk_israilov:0 "Khasan Israilov"
 wif_rkk_israilov_desc:0 "The Chechen insurgent who fought the Soviets for a decade now fights the Germans with the same rifles."
 wif_rkk_baku_underground:0 "The Baku Underground"
 wif_rkk_baku_underground_desc:0 "Communist cells in the oil workers' districts - and the SME's agents among them."
 wif_rkk_pass_blockhouses:0 "Blockhouses on the Passes"
 wif_rkk_pass_blockhouses_desc:0 "The Military Georgian Road and the Ossetian Road are guarded every kilometre."
 wif_rkk_clan_amnesty:0 "Amnesty for the Clans"
 wif_rkk_clan_amnesty_desc:0 "Elders who hand over their abreks are paid in gold and left alone."
 wif_rkk_mountains_never_quiet:0 "The Mountains Are Never Quiet"
 wif_rkk_mountains_never_quiet_desc:0 "The partisans cannot be beaten in the mountains - only kept out of the oil fields."
 wif_rkk_southern_frontier:0 "The Southern Frontier"
 wif_rkk_southern_frontier_desc:0 "Kaukasien borders Turkey and Iran: the Reich's frontier with the Middle East."
 wif_rkk_turkish_friendship:0 "Friendship with Ankara"
 wif_rkk_turkish_friendship_desc:0 "Turkey stayed out of the war and is owed nothing - but a friendly Ankara keeps the Black Sea quiet."
 wif_rkk_iranian_border:0 "The Iranian Border"
 wif_rkk_iranian_border_desc:0 "The Caspian shore and the Araxes river: British and American oil men watch from Tabriz."
 wif_rkk_gateway_middle_east:0 "Gateway to the Middle East"
 wif_rkk_gateway_middle_east_desc:0 "From Tiflis, Berlin can reach Mosul and Tabriz. Schickedanz dreams of a viceroyalty."
 wif_rkk_oil_rk_idea:0 "The Oil Reichskommissariat"
 wif_rkk_oil_rk_idea_desc:0 "Everything here is measured in barrels."
 wif_rkk_mosaic_idea:0 "A Mosaic of Peoples"
 wif_rkk_mosaic_idea_desc:0 "Fifty peoples, forty languages, one Reichskommissar."
 wif_rkk_federation_idea:0 "The Caucasian Federation"
 wif_rkk_federation_idea_desc:0 "Rosenberg's federation of peoples, bound to Berlin."
 wif_rkk_oil_colony_idea:0 "The Oil Colony"
 wif_rkk_oil_colony_idea_desc:0 "A petrol station with a population problem."
 wif_rkk_committees_idea:0 "The National Committees"
 wif_rkk_committees_idea_desc:0 "Exiles home from Paris, Berlin and Istanbul."
 wif_rkk_kontinentale_idea:0 "Kontinentale Ol AG"
 wif_rkk_kontinentale_idea_desc:0 "The Reich's oil monopoly for the East."
 wif_rkk_black_gold_idea:0 "Black Gold"
 wif_rkk_black_gold_idea_desc:0 "More oil than it ever pumped for Stalin."
 wif_rkk_ataman_idea:0 "The Cossack Ataman"
 wif_rkk_ataman_idea_desc:0 "A Field Ataman of all the Hosts, sworn to the Reich."
 wif_rkk_georgian_capital_idea:0 "Tiflis, the Seat of Power"
 wif_rkk_georgian_capital_idea_desc:0 "The Georgians have the capital - and mean to use it."
 wif_rkk_baku_capital_idea:0 "Baku, the Capital"
 wif_rkk_baku_capital_idea_desc:0 "Baku is happy."
 wif_rkk_army_idea:0 "The Army of the Caucasus"
 wif_rkk_army_idea_desc:0 "The largest native army of any Reichskommissariat."
 wif_rkk_gateway_idea:0 "Gateway to the Middle East"
 wif_rkk_gateway_idea_desc:0 "From Tiflis, Berlin can reach Mosul and Tabriz."
 wif_rkk_fuel_idea:0 "Oil for the Ostschild"
 wif_rkk_fuel_idea_desc:0 "The East runs on Caucasian oil."
 wif_rkk_terror_opinion:0 "Ruthless in the Caucasus"
 wif_rkk_neighbour_opinion:0 "A Quiet Frontier"
 wif_rkk_turkish_friend_opinion:0 "Friendship with Ankara"
 wif_rkk_armenian_capital_opinion:0 "The Capital in Yerevan"
 wif_rkk_baku_capital_opinion:0 "The Capital in Baku"
 wif_rkk_gateway_opinion:0 "Gateway to the Middle East"
 wif_rkk_tt_1:0 "§YArno Schickedanz§! rules from Tiflis. The §Rmountain partisans§! are already raiding the oil fields - but Kaukasien will never break apart as the other Reichskommissariate can."
 wif_rkk_tt_2:0 "Caucasian partisan raids come §G20 days later§!, for good."
 wif_rkk_tt_3:0 "Caucasian partisan raids come §R20 days sooner§!, for good."
 wif_rkk_tt_4:0 "Every Transcaucasian state: §G+10§! compliance."
 wif_rkk_tt_5:0 "Baku: §G+2§! oil."
 wif_rkk_tt_6:0 "Grozny: §G+2§! oil."
 wif_rkk_tt_7:0 "Kaukasien §Gnever§! goes through a civil war or a rising."
 wif_rkk_tt_8:0 "Krasnodar (Maikop): §G+4§! oil."
 wif_rkk_tt_9:0 "Chechnya-Ingushetia (Grozny): §G+4§! oil."
 wif_rkk_tt_10:0 "Azerbaijan (Baku): §G+10§! oil."
 wif_rkk_tt_11:0 "§YGermany§!: §G+1§! civilian factory."
 wif_rkk_tt_12:0 "Unlocks §YSend Extra Oil to the Reich§!: it slows the Facade Economy's consumer-goods rise in Germany."
 wif_rkk_tt_13:0 "When the §YOstschild§! forms, every member gets §G5,000§! fuel, and we get §G+20%§! fuel gain for a year."
 wif_rkk_tt_14:0 "§YGermany§!'s Facade Economy: consumer goods rise §G0.05§! points a month slower, for as long as we are its subject."
 wif_rkk_tt_15:0 "Unlocks the Cossack, Kalmyk, mountain and Transcaucasian branches."
 wif_rkk_tt_16:0 "The Cossack states: §G+10§! compliance."
 wif_rkk_tt_17:0 "§YKrasnodar (the Kuban Host)§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_18:0 "§YStavropol (the Terek Host)§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_19:0 "§YVolgodonsk (the Don Host)§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_20:0 "§YKalmykia§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_21:0 "Kabardino-Balkaria and North Ossetia: §G+15§! compliance."
 wif_rkk_tt_22:0 "Caucasian partisan raids come §G10 days later§!, for good."
 wif_rkk_tt_23:0 "Every mountain state: §G+10%§! compliance growth."
 wif_rkk_tt_24:0 "Caucasian partisan raids come §G15 days later§!, for good."
 wif_rkk_tt_25:0 "Every mountain state: §G-50%§! resistance growth, §R-10%§! compliance growth."
 wif_rkk_tt_26:0 "Caucasian partisan raids come §R10 days sooner§!, for good."
 wif_rkk_tt_27:0 "Every Transcaucasian state: §G+10§! compliance."
 wif_rkk_tt_28:0 "Georgia and Abkhazia: §G+15§! compliance."
 wif_rkk_tt_29:0 "Azerbaijan and Armenia: §G+15§! compliance."
 wif_rkk_tt_30:0 "Unlocks the choice of the final capital: §YTiflis§!, §YYerevan§! or §YBaku§! - and with it which nation is cored. Only one."
 wif_rkk_tt_31:0 "§YGeorgia§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_32:0 "Armenia and Azerbaijan get §REthnic Tension§!: §R-15%§! compliance growth, and partisan raids pick them more often."
 wif_rkk_tt_33:0 "§YArmenia§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_34:0 "Georgia and Azerbaijan get §REthnic Tension§!: §R-15%§! compliance growth, and partisan raids pick them more often."
 wif_rkk_tt_35:0 "§YAzerbaijan§! becomes a core of the Reichskommissariat."
 wif_rkk_tt_36:0 "Georgia and Armenia get §REthnic Tension§!: §R-15%§! compliance growth, and partisan raids pick them more often."
 wif_rkk_tt_37:0 "Abkhazia: §G+20§! compliance."
 wif_rkk_tt_38:0 "Caucasian partisan raids come §R10 days sooner§!, for good."
 wif_rkk_tt_39:0 "Armenia: §G+100,000§! people."
 wif_rkk_tt_40:0 "If the Armenian Legion was raised: §G2§! more 'Armenian Legion' divisions."
 wif_rkk_tt_41:0 "Baku: §G+5§! oil."
 wif_rkk_tt_42:0 "Raids on Baku do half the damage."
 wif_rkk_tt_43:0 "Every cored state: §G+1§! building slot."
 wif_rkk_tt_44:0 "Krasnodar: §R-15,000§! people."
 wif_rkk_tt_45:0 "Caucasian partisan raids come §R10 days sooner§!, for good."
 wif_rkk_tt_46:0 "Stavropol: §R-10,000§! people."
 wif_rkk_tt_47:0 "Caucasian partisan raids come §G10 days later§!, for good."
 wif_rkk_tt_48:0 "Georgia: §G+10§! compliance."
 wif_rkk_tt_49:0 "Armenia: §G+10§! compliance."
 wif_rkk_tt_50:0 "Every Chase the Terrorists operation gives back §G2,500§! manpower when it ends."
 wif_rkk_tt_51:0 "The next Caucasian partisan raid comes §G30 days later§!."
 wif_rkk_tt_52:0 "Chechnya-Ingushetia: §G+10§! compliance."
 wif_rkk_tt_53:0 "Raids on the oil states do half the damage."
 wif_rkk_tt_54:0 "Caucasian partisan raids come §G10 days later§!, for good."
 wif_rkk_tt_55:0 "Caucasian partisan raids come §G20 days later§!, for good."
 wif_rkk_tt_56:0 "Chase the Terrorists: success §G25%§! more likely. Kaukasien still never has a civil war."
 wif_large_caucasian_resistance:0 "Large Caucasian Resistance"
 wif_large_caucasian_resistance_doubled:0 "Severe Caucasian Resistance"
 wif_large_caucasian_resistance_quintupled:0 "Devastating Caucasian Resistance"
 wif_rkk_ethnic_tension:0 "Ethnic Tension"
 wif_rkk_mountain_autonomy_state:0 "Mountain Autonomy"
 wif_rkk_mountain_garrison:0 "Garrisoned Mountains"
 wif_rkk_mountains:0 "Caucasus Mountain Training"
 wif_rkk_extra_oil:0 "Send Extra Oil to the Reich"
 wif_rkk_extra_oil_desc:0 "Every tanker at Batumi sails for Constanta and the Reich. Kaukasien runs short, and the partisans notice."
 wif_rkk_extra_oil_tt:0 "For 180 days §YGermany§!'s Facade Economy consumer goods rise §G0.25§! points a month slower.\nWe lose §R5%§! stability, and the next Caucasian partisan raid comes §R15 days sooner§!."
 wif_arm_caucasian_partisans:0 "Arm the Caucasian Partisans"
 wif_arm_caucasian_partisans_desc:0 "7,000 rifles go south, over the Caspian and into the mountains. The next raid on Kaukasien comes in half the time."
 wif_arm_caucasian_partisans_tt:0 "§YThe time until Reichskommissariat Kaukasien's next raid is halved§!"
 wif_rkk_chase_terrorists:0 "Chase the Terrorists"
 wif_rkk_oil_category:0 "Black Gold"
 wif_rkk_oil_category_desc:0 "The oil of the Caucasus, for the Reich. Next Caucasian partisan raid in §R[?ROOT.wif_rkk_terror_days|0]§! days."
 wif_rkk.25.t:0 "Complete Success"
 wif_rkk.25.desc:0 "Our forces achieved a decisive victory against the partisans in [event_target:partisan_state.GetName]. The terrorist cell has been completely destroyed, the region is stabilised, and the next attack has been significantly delayed."
 wif_rkk.25.a:0 "Excellent work!"
 wif_rkk.26.t:0 "The Terrorists Got Away But Region Stabilised"
 wif_rkk.26.desc:0 "Our forces swept through [event_target:partisan_state.GetName] and restored order, but the partisan leaders managed to escape into the countryside. The region is stable for now, though the threat remains."
 wif_rkk.26.a:0 "At least the region is secure."
 wif_rkk.27.t:0 "Harsh Battle"
 wif_rkk.27.desc:0 "The operation in [event_target:partisan_state.GetName] turned into a brutal engagement. We took significant casualties but managed to clear the area. The region is stabilised, though at great cost."
 wif_rkk.27.a:0 "A pyrrhic victory."
 wif_rkk.28.t:0 "Failed to Pursue"
 wif_rkk.28.desc:0 "Our forces deployed to [event_target:partisan_state.GetName] but failed to locate the partisan cells. The terrorists remain at large and the region continues to suffer from their presence."
 wif_rkk.28.a:0 "They will not escape forever."
 wif_rkk.29.t:0 "Forces Routed"
 wif_rkk.29.desc:0 "The operation in [event_target:partisan_state.GetName] was a disaster. Our forces walked into an ambush and were routed by the partisans. The terrorists are now emboldened and their grip on the region has tightened considerably."
 wif_rkk.29.a:0 "This is humiliating."
 wif_rkk.30.t:0 "Total Defeat"
 wif_rkk.30.desc:0 "Catastrophe in [event_target:partisan_state.GetName]. Our entire force was annihilated by a well-coordinated partisan offensive. None of the 10,000 men returned. The region has been lost to the terrorists, who have declared it a liberated zone. Emboldened partisans across the Reichskommissariat are accelerating their attacks."
 wif_rkk.30.a:0 "God help us..."
 wif_rkk.31.t:0 "Demilitarization Lifted"
 wif_rkk.31.desc:0 "The demilitarized zone has been lifted. Our forces can once again operate in the formerly contested area."
 wif_rkk.31.a:0 "Resume operations."
 wif_rkk.20.t:0 "Caucasian Partisan Raid"
 wif_rkk.20.desc:0 "On [GetDateText], partisans came down from the mountains in [terror_attack_state.GetName] and blew up a factory. Garrison troops and workers were killed."
 wif_rkk.20.desc_oil:0 "On [GetDateText], partisans struck the oil fields of [terror_attack_state.GetName]. Derricks are burning, a refinery is wrecked or the pipelines are cut - the oil has stopped for months."
 wif_rkk.20.a:0 "Hunt them in the mountains."
 wif_rkk_attack_partisan_activity:0 "Attack partisan activity in [FROM.GetName]"
 wif_rkk_attack_partisan_activity_desc:0 "Caucasian partisans have struck in [FROM.GetName]. We shall deploy 10,000 men to hunt them down and restore order. The outcome is uncertain."
 wif_rkk_deploy_mechanised_forces:0 "Deploy the Mechanised Forces in [FROM.GetName]"
 wif_rkk_deploy_mechanised_forces_desc:0 "Caucasian partisans have struck in [FROM.GetName]. We shall deploy mountain troops to hunt them down. This requires §R10,000 Manpower§! and §R500 Mechanised Equipment§!, but our armoured troops are far more effective at eliminating partisan cells."
 wif_rkk_police_offensive:0 "Mountain Offensive in [FROM.GetName]"
 wif_rkk_police_offensive_desc:0 "Caucasian partisans have struck in [FROM.GetName]. Under the mountain troops, we shall deploy a combined-arms force with armoured support to hunt them down. This requires §R10,000 Manpower§!, §R200 Support Equipment§!, and §R10 Medium Tanks§!."
