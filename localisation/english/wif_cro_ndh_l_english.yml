l_english:
 wif_cro_the_independent_state_of_croatia:0 "The Independent State of Croatia"
 wif_cro_the_independent_state_of_croatia_desc:0 "Yugoslavia is falling apart under German and Italian guns. In Zagreb, Slavko Kvaternik reads a proclamation over the radio: the Independent State of Croatia exists, and Ante Pavelic, the Poglavnik, is on his way home from exile in Italy."
 wif_cro_the_poglavnik:0 "The Poglavnik"
 wif_cro_the_poglavnik_desc:0 "Pavelic rules by decree. There is no constitution, no parliament and no appeal."
 wif_cro_the_ustase_surveillance_service:0 "The Ustase Surveillance Service"
 wif_cro_the_ustase_surveillance_service_desc:0 "The UNS - the movement's own police, answering to Eugen Kvaternik and to no ministry."
 wif_cro_the_peasant_party_question:0 "The Peasant Party Question"
 wif_cro_the_peasant_party_question_desc:0 "Vladko Macek's Croatian Peasant Party won every free election in Croatia. It does not support the Ustase, and most Croats still support it."
 wif_cro_a_state_without_opposition:0 "A State Without Opposition"
 wif_cro_a_state_without_opposition_desc:0 "Every party but one is dissolved. The Ustase are the state."
 wif_cro_intern_macek:0 "Intern Macek"
 wif_cro_intern_macek_desc:0 "Macek is placed under guard - first in Jasenovac, then at his home in Kupinec."
 wif_cro_the_peasant_party_in_government:0 "The Peasant Party in Government"
 wif_cro_the_peasant_party_in_government_desc:0 "Bring the Peasant Party's moderates in, and the peasants with them."
 wif_cro_the_ustase_youth:0 "The Ustase Youth"
 wif_cro_the_ustase_youth_desc:0 "Every Croatian child, in uniform, by 1943."
 wif_cro_recall_the_sabor:0 "Recall the Sabor"
 wif_cro_recall_the_sabor_desc:0 "The Croatian parliament meets in February 1942 for the first time since 1918 - hand-picked, but a parliament."
 wif_cro_kvaterniks_fall:0 "Kvaternik's Fall"
 wif_cro_kvaterniks_fall_desc:0 "The Marshal Slavko Kvaternik and his son Eugen are blamed for everything and sent into exile in Slovakia. The Poglavnik stands alone."
 wif_cro_the_poglavniks_state:0 "The Poglavnik's State"
 wif_cro_the_poglavniks_state_desc:0 "The movement, the army, the police and the state answer to one man."
 wif_cro_the_rome_agreements:0 "The Rome Agreements"
 wif_cro_the_rome_agreements_desc:0 "Pavelic signs in Rome on 18 May 1941. Italy gets Dalmatia, and the right to garrison half of Croatia; Croatia gets an Italian prince as its king."
 wif_cro_king_tomislav_ii:0 "King Tomislav II"
 wif_cro_king_tomislav_ii_desc:0 "Prince Aimone, Duke of Spoleto, is proclaimed King of Croatia. He has never been there."
 wif_cro_the_second_zone:0 "The Second Zone"
 wif_cro_the_second_zone_desc:0 "Italian divisions garrison the coast and its hinterland - and protect the Serbs there from the Ustase."
 wif_cro_the_lost_coast:0 "The Lost Coast"
 wif_cro_the_lost_coast_desc:0 "Split, Sibenik, the islands - the Croatian coast flies the Italian flag. No Croat forgives it."
 wif_cro_a_crown_never_worn:0 "A Crown Never Worn"
 wif_cro_a_crown_never_worn_desc:0 "Aimone never sets foot in Croatia. The monarchy becomes a joke in Zagreb and an embarrassment in Rome."
 wif_cro_italian_advisers:0 "Italian Advisers"
 wif_cro_italian_advisers_desc:0 "Italian officers in the ministries, Italian engineers in the mines."
 wif_cro_look_to_berlin:0 "Look to Berlin"
 wif_cro_look_to_berlin_desc:0 "Germany wants Croatian bauxite and Croatian workers. It also has more divisions in Croatia than Italy does."
 wif_cro_romes_faithful_ally:0 "Rome's Faithful Ally"
 wif_cro_romes_faithful_ally_desc:0 "Croatia's future is Italian. Accept it, and be paid for it."
 wif_cro_berlin_is_stronger:0 "Berlin Is Stronger"
 wif_cro_berlin_is_stronger_desc:0 "Play the Germans against the Italians. Siegfried Kasche, the German envoy, is happy to help."
 wif_cro_an_italian_protectorate:0 "An Italian Protectorate"
 wif_cro_an_italian_protectorate_desc:0 "Croatia becomes an Italian Protectorate (the same level Italy's Levant protectorates have) - more say at home, Italian say abroad."
 wif_cro_german_patronage:0 "German Patronage"
 wif_cro_german_patronage_desc:0 "German money, German guns, German divisions - and German opinions about Croatia's future."
 wif_cro_the_adriatic_settlement:0 "The Adriatic Settlement"
 wif_cro_the_adriatic_settlement_desc:0 "Whatever patron Croatia chose, its borders and its coast are settled - for now."
 wif_cro_the_croatian_armed_forces:0 "The Croatian Armed Forces"
 wif_cro_the_croatian_armed_forces_desc:0 "The army of the new state is built from the wreckage of the Royal Yugoslav Army - and from the Ustase's own men."
 wif_cro_the_domobranstvo:0 "The Domobranstvo"
 wif_cro_the_domobranstvo_desc:0 "The Croatian Home Guard: conscripts, ex-Yugoslav officers and not much enthusiasm."
 wif_cro_the_ustase_militia:0 "The Ustase Militia"
 wif_cro_the_ustase_militia_desc:0 "Volunteers, true believers and the men who run the camps."
 wif_cro_the_croatian_legion:0 "The Croatian Legion"
 wif_cro_the_croatian_legion_desc:0 "A Croatian regiment for the Wehrmacht's war in the East - the 369th, which will die at Stalingrad."
 wif_cro_zrakoplovstvo_ndh:0 "Zrakoplovstvo NDH"
 wif_cro_zrakoplovstvo_ndh_desc:0 "An air force of ex-Yugoslav pilots and whatever aircraft the Axis can spare."
 wif_cro_rearm_the_home_guard:0 "Rearm the Home Guard"
 wif_cro_rearm_the_home_guard_desc:0 "Czech rifles, Italian mortars, German machine guns."
 wif_cro_the_black_legion:0 "The Black Legion"
 wif_cro_the_black_legion_desc:0 "Jure Francetic's Black Legion - the militia's elite, and its most feared unit."
 wif_cro_volunteers_for_the_east:0 "Volunteers for the East"
 wif_cro_volunteers_for_the_east_desc:0 "The Legion's survivors come home with frostbite and experience."
 wif_cro_fighters_from_rome:0 "Fighters from Rome"
 wif_cro_fighters_from_rome_desc:0 "Fiat G.50s and Macchi C.202s - Italy's aircraft for Italy's protectorate."
 wif_cro_ustase_primacy:0 "Ustase Primacy"
 wif_cro_ustase_primacy_desc:0 "The militia's officers take command of the Home Guard."
 wif_cro_a_professional_army:0 "A Professional Army"
 wif_cro_a_professional_army_desc:0 "The Home Guard's professionals bring the militia under army discipline."
 wif_cro_the_croatian_navy:0 "The Croatian Navy"
 wif_cro_the_croatian_navy_desc:0 "Italy forbids a Croatian navy in the Adriatic. So the Croatian Naval Legion serves on the Black Sea, and the river flotilla patrols the Sava."
 wif_cro_the_anti_partisan_air_wing:0 "The Anti-Partisan Air Wing"
 wif_cro_the_anti_partisan_air_wing_desc:0 "Light bombers over the mountains of Bosnia."
 wif_cro_hrvatske_oruzane_snage:0 "Hrvatske Oruzane Snage"
 wif_cro_hrvatske_oruzane_snage_desc:0 "One army: the Home Guard and the Ustase merged into the Croatian Armed Forces."
 wif_cro_the_legion_comes_home:0 "The Legion Comes Home"
 wif_cro_the_legion_comes_home_desc:0 "Every Croatian unit serving abroad is brought home for the war that matters."
 wif_cro_clear_the_mountains:0 "Clear the Mountains"
 wif_cro_clear_the_mountains_desc:0 "Kozara, Sutjeska, the Zelengora - offensive after offensive against the Partisans."
 wif_cro_the_army_of_the_croatian_state:0 "The Army of the Croatian State"
 wif_cro_the_army_of_the_croatian_state_desc:0 "Effect: +10% division attack and defence. +10% war support."
 wif_cro_the_croatian_economy:0 "The Croatian Economy"
 wif_cro_the_croatian_economy_desc:0 "Forests, mines, rivers and a little industry around Zagreb."
 wif_cro_bosnian_mines:0 "Bosnian Mines"
 wif_cro_bosnian_mines_desc:0 "Iron at Vares and Ljubija, coal at Zenica and Banovici."
 wif_cro_the_zenica_steelworks:0 "The Zenica Steelworks"
 wif_cro_the_zenica_steelworks_desc:0 "The only steelworks between Austria and Greece."
 wif_cro_forced_labour:0 "Forced Labour"
 wif_cro_forced_labour_desc:0 "The regime's prisoners - Serbs, Jews, Roma and political opponents - are put to work."
 wif_cro_the_kuna:0 "The Kuna"
 wif_cro_the_kuna_desc:0 "A new Croatian currency replaces the Yugoslav dinar."
 wif_cro_bauxite_for_the_axis:0 "Bauxite for the Axis"
 wif_cro_bauxite_for_the_axis_desc:0 "Herzegovina's bauxite is among the richest in Europe."
 wif_cro_hydroelectric_power:0 "Hydroelectric Power"
 wif_cro_hydroelectric_power_desc:0 "Effect: +10% production efficiency cap. +1 civilian factory in Croatia."
 wif_cro_camp_industries:0 "Camp Industries"
 wif_cro_camp_industries_desc:0 "Brickworks, a chain factory, sawmills and farms inside the camps, worked by prisoners until they die."
 wif_cro_timber_and_tobacco:0 "Timber and Tobacco"
 wif_cro_timber_and_tobacco_desc:0 "Croatia's exports: Slavonian oak and Herzegovinian tobacco."
 wif_cro_mining_for_germany:0 "Mining for Germany"
 wif_cro_mining_for_germany_desc:0 "Effect: +50 opinion with Germany. Germany builds 2 civilian factories in Bosnia. -15% resources to us (exports)."
 wif_cro_mining_for_italy:0 "Mining for Italy"
 wif_cro_mining_for_italy_desc:0 "Effect: +50 opinion with Italy. Italy builds 2 civilian factories in Croatia. -15% resources to us (exports)."
 wif_cro_the_sisak_refinery:0 "The Sisak Refinery"
 wif_cro_the_sisak_refinery_desc:0 "Effect: +1 refinery in Croatia."
 wif_cro_the_labour_service:0 "The Labour Service"
 wif_cro_the_labour_service_desc:0 "Penal labour battalions for roads, railways and fortifications."
 wif_cro_agricultural_requisitions:0 "Agricultural Requisitions"
 wif_cro_agricultural_requisitions_desc:0 "Effect: +5000 manpower. -5% stability. +10% resources."
 wif_cro_industrialise_bosnia:0 "Industrialise Bosnia"
 wif_cro_industrialise_bosnia_desc:0 "Effect: +2 civilian factories and +1 military factory in Bosnia."
 wif_cro_the_economic_plan:0 "The Economic Plan of 1945"
 wif_cro_the_economic_plan_desc:0 "Effect: +10% factory output. +5% construction speed."
 wif_cro_a_croatian_industry:0 "A Croatian Industry"
 wif_cro_a_croatian_industry_desc:0 "Effect: +3 civilian factories. +10% production efficiency growth."
 wif_cro_the_new_balkan_order:0 "The New Order in the Balkans"
 wif_cro_the_new_balkan_order_desc:0 "The war in the west is over and the Axis has won it. Croatia has survived - but the Partisans have not gone away, and neither have the dead."
 wif_cro_the_partisan_problem:0 "The Partisan Problem"
 wif_cro_the_partisan_problem_desc:0 "Tito's army survived every offensive. Peace in the west has not reached the mountains."
 wif_cro_hunt_the_partisans:0 "Hunt the Partisans"
 wif_cro_hunt_the_partisans_desc:0 "One more offensive - the last, the generals promise."
 wif_cro_peace_in_the_mountains:0 "A Brief Lull"
 wif_cro_peace_in_the_mountains_desc:0 "For a season the roads are open and the trains run on time. Everyone in Zagreb knows it will not last - the Partisans are only regrouping."
 wif_cro_the_reich_divided:0 "Under Rome's Shield"
 wif_cro_the_reich_divided_desc:0 "Whatever happens in Berlin, Croatia's master is in Rome. When Germany falls into civil war, Zagreb barely notices - Italian garrisons stay, Italian money keeps coming, and the German liaison officers simply go home."
 wif_cro_in_the_pact_of_rome:0 "Rome's Ally"
 wif_cro_in_the_pact_of_rome_desc:0 "Croatia's place is beside Italy - as its subject, and in Italy's alliance once there is one (WiF's civil-war script moves Croatia into Italy's Pact of Rome automatically)."
 wif_cro_croatia_stands:0 "Croatia Stands"
 wif_cro_croatia_stands_desc:0 "Effect: +10% war support. +5% stability."
 wif_cro_rebuild_zagreb:0 "Rebuild Zagreb"
 wif_cro_rebuild_zagreb_desc:0 "Effect: +2 civilian factories in Zagreb. +1 infrastructure."
 wif_cro_the_adriatic_railway:0 "The Adriatic Railway"
 wif_cro_the_adriatic_railway_desc:0 "Zagreb to Split - through Italian Dalmatia, if Rome allows it."
 wif_cro_the_croatian_recovery:0 "The Croatian Recovery"
 wif_cro_the_croatian_recovery_desc:0 "Effect: +10% factory output. +3 civilian factories."
 wif_cro_close_the_camps:0 "Close the Camps"
 wif_cro_close_the_camps_desc:0 "With the war over and the Partisans still in the hills, the regime's leaders want the evidence gone and the world's attention elsewhere."
 wif_cro_the_camps_remain:0 "The Camps Remain"
 wif_cro_the_camps_remain_desc:0 "Effect: keeps Camp Industries' factories. Partisan Strength grows by 0.5 a month for good (a grievance). -10% stability. -25 opinion with every country outside the Axis."
 wif_cro_the_verdict_of_the_peoples:0 "The Verdict of the Peoples"
 wif_cro_the_verdict_of_the_peoples_desc:0 "Serbs, Muslims, Croats, Germans - every people of the state remembers the war differently, and none forgets it."
 wif_cro_the_croatian_state_endures:0 "The Croatian State Endures"
 wif_cro_the_croatian_state_endures_desc:0 "Ten years after Kvaternik's proclamation, the Independent State of Croatia still exists."
 wif_cro_the_question_of_peoples:0 "The Question of Peoples"
 wif_cro_the_question_of_peoples_desc:0 "Barely half the people of the Independent State are Croats. Nearly two million are Orthodox Serbs, three-quarters of a million are Muslims, and there are Jews, Roma and Germans besides. The Ustase intend a state for Croats alone."
 wif_cro_the_muslim_question:0 "The Muslim Question"
 wif_cro_the_muslim_question_desc:0 "The Ustase claim Bosnia's Muslims as Croats in their speeches and treat them as a suspect people in practice."
 wif_cro_bosnia_is_croatian_land:0 "Bosnia Is Croatian Land"
 wif_cro_bosnia_is_croatian_land_desc:0 "Bosnia is Croatian soil, and the Muslims on it are expected to stop being anything but Croats. Muslim organisations are dissolved, the sharia courts and religious schools closed, waqf land confiscated and handed to Croat settlers."
 wif_cro_croatise_bosnia:0 "Croatise Bosnia"
 wif_cro_croatise_bosnia_desc:0 "Mosques turned into barracks, Muslim names struck from the registers, Muslim villages left undefended against the Chetniks."
 wif_cro_muslim_memoranda:0 "The Muslim Memoranda"
 wif_cro_muslim_memoranda_desc:0 "Muslim notables in Sarajevo, Mostar and Banja Luka publicly condemn the massacres - of Serbs and of Muslims - and demand autonomy."
 wif_cro_the_ethnic_german_group:0 "The Ethnic German Group"
 wif_cro_the_ethnic_german_group_desc:0 "The Volksdeutsche of Slavonia get their own autonomous organisation, answering to Berlin as much as to Zagreb."
 wif_cro_deutsche_mannschaft:0 "Deutsche Mannschaft"
 wif_cro_deutsche_mannschaft_desc:0 "The ethnic Germans' own militia."
 wif_cro_volksdeutsche_units:0 "Volksdeutsche Units"
 wif_cro_volksdeutsche_units_desc:0 "Effect: +1% recruitable population. +10 opinion with Germany."
 wif_cro_the_serbian_question:0 "The Serbian Question"
 wif_cro_the_serbian_question_desc:0 "The Ustase answer, as Mile Budak put it in 1941: a third to be killed, a third expelled, a third converted."
 wif_cro_ban_the_cyrillic_script:0 "Ban the Cyrillic Script"
 wif_cro_ban_the_cyrillic_script_desc:0 "Within days of the state's founding, Cyrillic is banned in public life, Serbian schools are closed and Serbs are made to wear armbands marked 'P' for Pravoslavac - Orthodox."
 wif_cro_the_glina_massacres:0 "Glina"
 wif_cro_the_glina_massacres_desc:0 "In the summer of 1941 Ustase units sweep Banija, Kordun and Lika. At Glina, Serbs summoned to the Orthodox church for 'conversion' are killed inside it."
 wif_cro_the_serbian_church_outlawed:0 "The Serbian Church Outlawed"
 wif_cro_the_serbian_church_outlawed_desc:0 "The Serbian Orthodox Church is stripped of its property; its bishops are expelled, imprisoned or murdered - Bishop Platon of Banja Luka among them."
 wif_cro_expulsions_to_serbia:0 "Expulsions to Serbia"
 wif_cro_expulsions_to_serbia_desc:0 "Trains of Serbian families, stripped of everything, sent over the Drina into occupied Serbia."
 wif_cro_convert_or_leave:0 "Convert or Die"
 wif_cro_convert_or_leave_desc:0 "Mass conversions of Orthodox Serbs to Catholicism, under threat of death - and villages that refuse are burned."
 wif_cro_the_kozara_offensive:0 "Kozara"
 wif_cro_the_kozara_offensive_desc:0 "The 1942 offensive on Mount Kozara clears the Partisans from the mountain - and deports tens of thousands of Serbian civilians from the villages below it to the camps."
 wif_cro_the_chetnik_agreements:0 "The Chetnik Agreements"
 wif_cro_the_chetnik_agreements_desc:0 "In 1942, under Italian sponsorship, the regime signs truces with Chetnik bands against the Partisans - the Serbs it persecutes become its uneasy allies."
 wif_cro_the_childrens_camps:0 "The Children's Camps"
 wif_cro_the_childrens_camps_desc:0 "Children taken from Kozara and the other cleared districts are held in camps at Sisak and Jastrebarsko, where thousands die. A Zagreb housewife, Diana Budisavljevic, smuggles out as many as she can."
 wif_cro_the_racial_laws:0 "The Racial Laws"
 wif_cro_the_racial_laws_desc:0 "Laws copied from Nuremberg strip Jews and Roma of citizenship and property within weeks of the state's founding."
 wif_cro_jadovno:0 "Jadovno"
 wif_cro_jadovno_desc:0 "The first camp, on the slopes of Velebit: prisoners are thrown alive into the karst pits."
 wif_cro_the_camp_system:0 "The Camp System"
 wif_cro_the_camp_system_desc:0 "Gospic, Pag, Kruscica, Loborgrad - and then the largest of them all, on the Sava."
 wif_cro_the_roma_deportations:0 "The Roma Deportations"
 wif_cro_the_roma_deportations_desc:0 "In 1942 the regime orders every Roma in the state rounded up and sent to Jasenovac. Almost none survive."
 wif_cro_jasenovac:0 "Jasenovac"
 wif_cro_jasenovac_desc:0 "The complex of camps at Jasenovac and Stara Gradiska, where Serbs, Jews, Roma and anti-fascist Croats are murdered in the tens of thousands."
 wif_cro_deportations_to_auschwitz:0 "Deportations to Auschwitz"
 wif_cro_deportations_to_auschwitz_desc:0 "In 1942 and 1943 the regime hands the Jews still alive in its camps to the Germans - and pays Germany thirty Reichsmarks a head to take them."
 wif_cro_rumours_from_jasenovac:0 "Rumours from Jasenovac"
 wif_cro_rumours_from_jasenovac_desc:0 "AUTO-COMPLETES after Jasenovac - the regime cannot stop it.\n\nSurvivors and escapees carry stories out of the camps, each worse than the last, until rumours that the dead are being rendered into soap circulate in Belgrade, in the Partisan press and on Allied radio. Whether or not they are true, they finish the regime's reputation abroad and fill the Partisans' ranks at home."
 wif_cro_order_in_the_provinces:0 "Order in the Provinces"
 wif_cro_order_in_the_provinces_desc:0 "Every province has a governor and a garrison. None has peace."
 wif_cro_hostage_laws:0 "The Hostage Laws"
 wif_cro_hostage_laws_desc:0 "A hundred Serbian hostages shot for every soldier the Partisans kill."
 wif_cro_village_militias:0 "Village Militias"
 wif_cro_village_militias_desc:0 "Armed Croat and Muslim villagers guard the roads and the railway halts."
 wif_cro_the_hunt_for_tito:0 "The Hunt for Tito"
 wif_cro_the_hunt_for_tito_desc:0 "Paratroopers on Drvar, bounty posters in every village, agents in every unit. Tito always gets away."
 wif_cro_the_racial_political_committee:0 "The Racial-Political Committee"
 wif_cro_the_racial_political_committee_desc:0 "A state office decides who is a Croat, who is an Aryan and who is neither - and issues the certificates that decide who keeps his job, his flat and his life."
 wif_cro_the_gothic_myth:0 "The Gothic Myth"
 wif_cro_the_gothic_myth_desc:0 "Regime scholars declare that Croats are not Slavs at all but descendants of the Goths - Aryans, kin of the Germans, and nothing like the Serbs beside them."
 wif_cro_aryanisation:0 "Aryanisation"
 wif_cro_aryanisation_desc:0 "Jewish and Serbian shops, factories and houses are handed to Ustase 'commissioners'. Much of it is simply looted."
 wif_cro_honorary_aryans:0 "Honorary Aryans"
 wif_cro_honorary_aryans_desc:0 "A few Jews useful to the state - and a few rich enough to pay - are declared 'honorary Aryans'. Everyone else is not."
 wif_cro_the_marriage_laws:0 "The Marriage Laws"
 wif_cro_the_marriage_laws_desc:0 "Marriage between 'Aryans' and Jews, Roma or Serbs is forbidden, and existing mixed families are broken up."
 wif_cro_serbs_out_of_zagreb:0 "Serbs and Jews Out of Zagreb"
 wif_cro_serbs_out_of_zagreb_desc:0 "Decrees order every Serb and Jew out of the northern districts of Zagreb within days, and then out of the city's better streets altogether."
 wif_cro_the_racial_state:0 "The Racial State"
 wif_cro_the_racial_state_desc:0 "Every law, office and certificate of the Independent State sorts its people by blood and faith."
 wif_cro_two_armies_1:0 "Two Armies"
 wif_cro_two_armies_1_desc:0 "The Home Guard and the Ustase Militia compete for men, guns and the Poglavnik's favour."
 wif_cro_two_armies_2:0 "Two Armies (Bitter)"
 wif_cro_two_armies_2_desc:0 "The Home Guard and the Ustase Militia compete for men, guns and the Poglavnik's favour."
 wif_cro_ustase_state_idea:0 "The Ustase State"
 wif_cro_ustase_state_idea_desc:0 "A movement of a few thousand men rules a state of six million."
 wif_cro_poglavniks_state_idea:0 "The Poglavnik's State"
 wif_cro_poglavniks_state_idea_desc:0 "The movement, the army, the police and the state answer to one man."
 wif_cro_rome_agreements_idea:0 "The Rome Agreements"
 wif_cro_rome_agreements_idea_desc:0 "Dalmatia, promised to Croatia for a century, now flies the Italian flag."
 wif_cro_rome_agreements_mild_idea:0 "The Rome Agreements"
 wif_cro_rome_agreements_mild_idea_desc:0 "The humiliation has become a grudge."
 wif_cro_rival_government_idea:0 "A Rival Government"
 wif_cro_rival_government_idea_desc:0 "AVNOJ has declared itself the lawful government of Yugoslavia - and half the villages believe it."
 wif_cro_sabotage_idea:0 "Railway Sabotage"
 wif_cro_sabotage_idea_desc:0 "The trains are not running."
 wif_cro_rule_by_decree_idea:0 "Rule by Decree"
 wif_cro_rule_by_decree_idea_desc:0 "No constitution, no parliament, no appeal."
 wif_cro_uns_idea:0 "The Ustase Surveillance Service"
 wif_cro_uns_idea_desc:0 "The movement's own police."
 wif_cro_macek_interned_idea:0 "Macek Interned"
 wif_cro_macek_interned_idea_desc:0 "The opposition has no leader."
 wif_cro_peasant_anger_idea:0 "The Peasants' Anger"
 wif_cro_peasant_anger_idea_desc:0 "The villages voted for Macek."
 wif_cro_coalition_idea:0 "A Reluctant Coalition"
 wif_cro_coalition_idea_desc:0 "The Peasant Party in government, and the Ustase hate it."
 wif_cro_ustase_youth_idea:0 "The Ustase Youth"
 wif_cro_ustase_youth_idea_desc:0 "Every child in uniform."
 wif_cro_kvaternik_gone_idea:0 "The Poglavnik Alone"
 wif_cro_kvaternik_gone_idea_desc:0 "The Kvaterniks are in exile."
 wif_cro_second_zone_idea:0 "The Second Zone"
 wif_cro_second_zone_idea_desc:0 "Italian divisions garrison the coast."
 wif_cro_italian_advisers_idea:0 "Italian Advisers"
 wif_cro_italian_advisers_idea_desc:0 "Italian officers in the ministries."
 wif_cro_domobranstvo_idea:0 "The Domobranstvo"
 wif_cro_domobranstvo_idea_desc:0 "The Croatian Home Guard."
 wif_cro_rearmed_idea:0 "The Home Guard Rearmed"
 wif_cro_rearmed_idea_desc:0 "Czech rifles, Italian mortars, German machine guns."
 wif_cro_fighters_idea:0 "Fighters from Rome"
 wif_cro_fighters_idea_desc:0 "Italy's aircraft for Italy's protectorate."
 wif_cro_ustase_primacy_idea:0 "Ustase Primacy"
 wif_cro_ustase_primacy_idea_desc:0 "The militia's officers command the army."
 wif_cro_professional_army_idea:0 "A Professional Army"
