 wif_cro_plan_0:0 "nothing yet"
 wif_cro_base_bosnia:0 "Bosnia"
 wif_cro_base_herzegovina:0 "Herzegovina"
 wif_cro_intel_known:0 "Tito's headquarters: §Y[ROOT.GetWifCroBase]§!. The Partisans are preparing §R[ROOT.GetWifCroPlan]§!."
 wif_cro_intel_unknown:0 "Where Tito is, and what he plans, is unknown. §YLocate the Partisan Headquarters§! to find out."
 wif_cro_sweep_tt:0 "A §Y30-day§! operation. If Tito's headquarters is there: a good chance of §G-12§! Partisan Strength and two months of quiet, otherwise §G-5§!. Anywhere else: §G-3§!."
 wif_cro_locate_tt:0 "For §Y45 days§! we know where Tito's headquarters is and what the Partisans are preparing."
 wif_cro_reprisals_tt:0 "Partisan Strength: §G-5§! now - and §R+0.25§! a month for good."
 wif_ita_dalmatia_reprisals_tt:0 "Croatia's Partisan Strength: §G-5§!. Compliance in our border states falls."
 wif_cro_supply_tt:0 "Croatia's Partisan Strength: §R+5§!."
 wif_cro_autonomy_loc:0 "The Rome Agreements"
 wif_cro_partisans_category:0 "Tito's Partisans"
 wif_cro_partisans_category_desc:0 "Partisan Strength: §R[?ROOT.wif_cro_ps|0]§!/100, rising [?ROOT.wif_cro_ps_rate|1] a month. It never falls below 10.\n[ROOT.GetWifCroIntel]\n\nThe Partisans save their strength for an operation and spend it when they strike: ambushes (10), railway sabotage (25), bombings in Zagreb (40), strikes into Italian Dalmatia (50), seizing a mountain district (70), assassinations (90). Sweep the region where Tito is to set them back."
 wif_cro_locate_headquarters:0 "Locate the Partisan Headquarters"
 wif_cro_locate_headquarters_desc:0 "Informers, couriers, radio intercepts - find out where Tito is and what he is planning."
 wif_cro_sweep_bosnia:0 "Sweep Bosnia"
 wif_cro_sweep_bosnia_desc:0 "Encircle the Bosnian mountains and comb the forests."
 wif_cro_sweep_bosnia_cheap:0 "Sweep Bosnia"
 wif_cro_sweep_bosnia_cheap_desc:0 "Encircle the Bosnian mountains and comb the forests."
 wif_cro_sweep_herzegovina:0 "Sweep Herzegovina"
 wif_cro_sweep_herzegovina_desc:0 "Encircle the Herzegovinian karst and comb the valleys."
 wif_cro_sweep_herzegovina_cheap:0 "Sweep Herzegovina"
 wif_cro_sweep_herzegovina_cheap_desc:0 "Encircle the Herzegovinian karst and comb the valleys."
 wif_cro_reprisals:0 "Reprisals"
 wif_cro_reprisals_desc:0 "Hostages shot for every soldier killed. It frightens the villages - and sends their sons to Tito."
