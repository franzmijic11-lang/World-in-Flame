 wif_ita_arm_the_croatians_desc:0 "Rifles from Italian depots for the Croatian Home Guard."
 wif_ita_dalmatia_category:0 "Partisans in Dalmatia"
 wif_ita_dalmatia_category_desc:0 "Croatia's Partisan war has crossed into Italian territory."
 wif_ita_reprisals_in_dalmatia:0 "Reprisals in Dalmatia"
 wif_ita_reprisals_in_dalmatia_desc:0 "Burn the villages that shelter them."
