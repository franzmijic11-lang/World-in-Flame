 wif_cro_lull_tt:0 "Partisan Strength keeps growing exactly as fast as before - the mountains never truly go quiet."
 wif_cro_rome_shield_tt:0 "If the §YGerman civil war§! has begun: §G+5%§! stability as Berlin's men leave - nothing else changes for us."
 wif_cro_railway_tt:0 "§G+1§! infrastructure in every state we own."
 wif_cro_close_camps_tt:0 "The camps close. §YCamp Industries§'! factories are lost. Partisan Strength grows §G0.5§! a month slower."
 wif_cro_camps_world_tt:0 "Countries outside the Axis think a little better of us."
 wif_cro_verdict_tt:0 "§G+5%§! stability if we closed the camps, §R-5%§! if we did not."
 wif_cro.10.t:0 "Ambush in the Mountains"
 wif_cro.10.d:0 "A column of Home Guard trucks was caught on a mountain road in [wif_cro_attack_state.GetName]. The bridge behind it went up first, then the one in front. By the time help arrived the Partisans had gone, with the rifles."
 wif_cro.10.a:0 "Hunt them down."
 wif_cro.11.t:0 "The Railway Cut"
 wif_cro.11.d:0 "Explosives under the line in [wif_cro_attack_state.GetName]. A goods train lies on its side in a ravine, and nothing will move on that line for weeks."
 wif_cro.11.a:0 "Repair it."
 wif_cro.12.t:0 "Bombs in Zagreb"
 wif_cro.12.d:0 "A bomb went off in a Zagreb factory during the morning shift, another outside a ministry. The capital, which the regime called safe, is not."
 wif_cro.12.a:0 "Find the cell."
 wif_cro.13.t:0 "The War Crosses the Border"
 wif_cro.13.d:0 "The Partisans have struck across the border in Italian [wif_cro_attack_state.GetName]. Rome blames Zagreb for failing to keep them in their mountains."
 wif_cro.13.a:0 "Rome will not forgive this."
 wif_cro.14.t:0 "Liberated Territory"
 wif_cro.14.d:0 "[wif_cro_attack_state.GetName] has fallen to the Partisans. Tito's men hold the towns, run the villages and call it liberated territory. The army must take it back."
 wif_cro.14.a:0 "Retake it."
 wif_cro.15.t:0 "Assassination"
 wif_cro.15.d:0 "One of the regime's ministers was shot dead in the street in broad daylight. The killer was never caught."
 wif_cro.15.a:0 "Another one."
 wif_cro.16.t:0 "AVNOJ Convenes"
 wif_cro.16.d:0 "In a liberated mountain town, the Anti-Fascist Council of the National Liberation of Yugoslavia has proclaimed itself the lawful government. Its decrees are read out in villages the regime no longer dares to enter."
 wif_cro.16.a:0 "They are bandits, not a government."
 wif_cro.17.t:0 "The Partisans Grow Bolder"
 wif_cro.17.d:0 "The Partisans are no longer hiding. They are strong enough now to strike across the border into Italian territory.\n\nPartisan Strength has reached §R50§!."
 wif_cro.17.a:0 "They will be stopped."
 wif_cro.18.t:0 "The Mountains Are Theirs"
 wif_cro.18.d:0 "The Partisans are strong enough to take and hold whole districts.\n\nPartisan Strength has reached §R70§!."
 wif_cro.18.a:0 "We need every division."
 wif_cro.40.t:0 "The Sweep Finds Them"
 wif_cro.40.d:0 "The cordon closed on Tito's headquarters in [ROOT.GetWifCroBase]. The Partisans broke out with heavy losses and have gone to ground - their headquarters has had to move."
 wif_cro.40.a:0 "They will be back."
 wif_cro.41.t:0 "They Slipped Away"
 wif_cro.41.d:0 "The sweep found Tito's camp still warm. The Partisans had been warned, and slipped through the cordon before it closed. They have moved their headquarters."
 wif_cro.41.a:0 "Next time."
 wif_cro.42.t:0 "Empty Forests"
 wif_cro.42.d:0 "A month of marching through the forests found burned-out camps, a few stragglers and nothing else. Tito was never there."
 wif_cro.42.a:0 "Our intelligence was wrong."
 wif_cro.43.t:0 "Where Tito Is"
 wif_cro.43.d:0 "Informers, captured couriers and radio intercepts all point the same way. Tito's headquarters is in §Y[ROOT.GetWifCroBase]§!, and the Partisans are preparing §R[ROOT.GetWifCroPlan]§!.\n\nThe information will be good for about six weeks."
 wif_cro.43.a:0 "Send in the army."
 wif_cro.21.t:0 "Partisans in Dalmatia"
 wif_cro.21.d:0 "Croatia's Partisans have struck across the border into [wif_cro_attack_state.GetName]. An Italian garrison was ambushed and the local population is turning against us.\n\nWe can answer with Reprisals in Dalmatia."
 wif_cro.21.a:0 "Zagreb must do better."
 wif_cro.2.t:0 "The Independent State of Croatia"
 wif_cro.2.d:0 "Slavko Kvaternik has read the proclamation over Radio Zagreb: the Independent State of Croatia exists. Ante Pavelic, the Poglavnik, is coming home from Italy - and Croatia will be an Italian protectorate in all but name."
 wif_cro.2.a:0 "Za dom."
 wif_cro_plan_1:0 "an ambush in the mountains"
 wif_cro_plan_2:0 "railway sabotage"
 wif_cro_plan_3:0 "bombings in Zagreb"
 wif_cro_plan_4:0 "a strike into Italian Dalmatia"
